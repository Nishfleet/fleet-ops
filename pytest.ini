# CI runs `pytest` with no file list: every tests/test_*.py is found here (fleet-ops#10721).
# A test that needs another CI job's setup carries `pytestmark = pytest.mark.<marker>`.
[pytest]
testpaths = tests
markers =
    systemd: needs sudo and the system manager (ci-systemd.yml)
    grafana: needs the pinned Grafana container (ci-grafana.yml)
