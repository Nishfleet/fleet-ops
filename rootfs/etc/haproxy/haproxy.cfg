# The router's load balancer: 127.0.0.1:4000 in front of the two LiteLLM instances
# (containers/quadlet/fleet-litellm-proxy@.container). LiteLLM's deploy doc: the proxy is
# stateless, run 2+ replicas behind a load balancer (https://docs.litellm.ai/docs/proxy/deploy).
# Every keyword below is from the HAProxy 2.8 configuration manual, the version Ubuntu 24.04
# ships: https://docs.haproxy.org/2.8/configuration.html
# global and the errorfile lines are the Ubuntu package's own defaults.

global
	log /dev/log local0
	log /dev/log local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

defaults
	log global
	mode http
	option httplog
	option dontlognull
	timeout connect 2s
	# A call may run 10 minutes with no byte back (non-streamed), and a stream may pause; these
	# are inactivity timeouts (4.2 "timeout client", "timeout server"), so 15m covers both.
	timeout client 15m
	timeout server 15m
	timeout http-request 1m
	timeout check 5s
	# A refused connection (the instance is draining or starting) is retried on the other
	# instance: "retries" plus "option redispatch" (4.2). retry-on stays at its default,
	# conn-failure, so a call the instance already received is never sent twice.
	retries 3
	option redispatch 1
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http

# HAProxy's built-in Prometheus exporter, loopback only, so Prometheus sees how many router
# instances pass the health check (haproxy_backend_active_servers). The vendor's own example:
# https://www.haproxy.com/documentation/haproxy-configuration-tutorials/alerts-and-monitoring/prometheus/
# ("no log" draws a harmless "log format ignored" warning from haproxy -c; the check still passes).
frontend prometheus
	bind 127.0.0.1:8405
	http-request use-service prometheus-exporter if { path /metrics }
	no log

frontend litellm
	bind 127.0.0.1:4000
	default_backend litellm

backend litellm
	# Calls last from 1 s to 10 min, so send each to the instance with fewer open calls (4.2 "balance").
	balance leastconn
	# Keep-alive is the HAProxy default (4.2 "option http-keep-alive"). HAProxy must not send
	# "option http-server-close": it puts "Connection: close" on every instance-side request, and
	# this LiteLLM/uvicorn build then closes the connection before a large body has flushed --
	# 2.8's own caveat: "some servers do not always conform to those requirements when they see
	# 'Connection: close'" (4.2 "option http-server-close"). Measured on LiteLLM 1.105.0 -- the
	# version the pinned image serves, one uvicorn process per instance (fleet-ops#11846
	# run-proof): a 1.5 MB /model/info answers cut mid-body -- 27 of 80
	# burst calls with the option, 0 of 80 without; the same body direct to the instance cut too
	# when the request carried "Connection: close". A stopped instance needs the close mode's
	# old "refused connect" help no more: a call to a stopped instance times out in "timeout
	# connect" and "retries" plus "option redispatch" send it to the other instance, and session
	# reuse stays within one client session (4.2 "http-reuse", default "safe": "exactly equivalent
	# to regular keep-alive"). Measured on a rolling restart of both instances, one at a time:
	# 0 cuts, 0 resets, every affected call answered 200 after redispatch (log rows
	# "0/2002/.../+1"), 60 large calls and 20 three-request keep-alive sessions through one
	# client connection each.
	# Active health check on LiteLLM's readiness endpoint
	# (https://docs.litellm.ai/docs/proxy/health, "/health/readiness"). Down after 3 failed checks,
	# up after 2 good ones (5.2 "inter", "fall", "rise").
	# "inter 2s" stays: the runs for this review measured a stopped instance marked down 11 s
	# after the stop with "inter 2s" but 26 s after it with "inter 10s" (and with "inter 10s" a
	# 20 s stop was never marked down at all), and a restarted instance back up 2-3 s after
	# readiness instead of 9 s. The journal gains nothing from "inter 10s": without "option
	# log-health-checks" (not set) HAProxy logs only the DOWN and UP transitions, 4 journal
	# lines per restart of one instance at either rate.
	option httpchk
	http-check send meth GET uri /health/readiness
	http-check expect status 200
	default-server check inter 2s fall 3 rise 2
	# No response buffering is configured, so SSE streams pass through as they are written.
	server a 127.0.0.1:4001
	server b 127.0.0.1:4002
