# zswap: a compressed cache in RAM in front of the 8G disk swap. A page the
# kernel swaps out is compressed and kept in RAM first (up to max_pool_percent,
# 20% of RAM by default); only the coldest pages go on to the disk swapfile.
# zswap, not zram, because this box already has disk swap: zram in front of a
# swapfile fills with the oldest pages and sends newer ones to disk, and zswap
# writes its coldest pages back on its own (the kernel's zswap docs,
# Documentation/admin-guide/mm/zswap.rst, and Chris Down, kernel memory
# maintainer, "Debunking zswap and zram myths", 2026-03-24). zstd for the best ratio,
# zsmalloc because zbud stores at most 2 compressed pages in one page.
# The Ubuntu 6.8 kernel has zswap built in but off, so these lines turn it on
# at every boot. Undo live: echo N > /sys/module/zswap/parameters/enabled.
# Delete this file to switch it off for good. Check: grep Zswap /proc/meminfo.
w /sys/module/zswap/parameters/zpool - - - - zsmalloc
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/enabled - - - - Y
