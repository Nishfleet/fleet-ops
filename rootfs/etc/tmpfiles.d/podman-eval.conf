# The runtime dir of podman-eval.service (2026-10-22, fleet-ops#9983). It is
# made here, at early boot, and not by RuntimeDirectory= in the unit: the runner
# units hide it with InaccessiblePaths=-/run/podman-eval, and a `-` skips a
# path that is missing when the runner starts. RuntimeDirectory= also deletes
# the dir whenever the unit stops. This line makes it before any runner starts
# and nothing removes it.
d /run/podman-eval 0700 nish nish -
