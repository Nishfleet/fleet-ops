# /home/nish/.config holds the paths the jailed runner jobs mask and bind, and a
# root-owned copy stops every jailed job at bwrap startup (fleet-ops#11120).
# Boot applies this before the user manager starts; host.yml's Create tmpfiles
# handler applies it again on every config change.
d /home/nish/.config 0755 nish nish -
d /home/nish/.config/cloudflare 0755 nish nish -
