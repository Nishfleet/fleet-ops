# Keeps the host's /home/nish/.config nish-owned even when a namespace-scoped process
# recreates it (fleet-ops#11120): nish's own processes must be able to create config
# dirs under it. Mode '-' repairs ownership without ever widening a mode an operator
# has set; a missing dir is created with the tmpfiles default 0755. Boot applies this
# before the user manager starts; host-config runs it again on every apply.
d /home/nish/.config - nish nish -
d /home/nish/.config/cloudflare - nish nish -
