# Keeps the host's /home/nish/.config nish-owned even when a namespace-scoped process
# recreates it (fleet-ops#11120): nish's own processes must be able to create config
# dirs under it. .config takes mode '-', so an apply never widens a mode an operator
# has set (a missing dir is created with the tmpfiles default 0755); the credentials
# dir takes an explicit 0700, which only ever tightens. Boot applies this before the
# user manager starts; host-config runs it again on every apply.
d /home/nish/.config - nish nish -
d /home/nish/.config/cloudflare 0700 nish nish -
