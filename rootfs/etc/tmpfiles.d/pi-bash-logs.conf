# An agent session's bash-output log (/tmp/pi-bash-<id>.log) keeps growing for as
# long as one command runs, and nothing aged it after the session left: one dead
# session's log was 507G on 2026-10-31 and filled the root filesystem
# (fleet-ops#11326). The stock /tmp pass (/usr/lib/tmpfiles.d/tmp.conf) ages
# files at 30d, so a runaway built in one hour sits for a month. 2d matches the
# chrome profile rule in this directory. The age-by is m alone: a log grows only
# by writes, so mtime is the stamp that says it is live; the other stamps say
# nothing here and only veto. A read of a dead log must not veto either, which
# the default atime term would (fleet-ops#4256).
e /tmp/pi-bash-*.log - - - m:2d
