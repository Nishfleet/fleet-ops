# Block a plaintext git credential store in nish's home (fleet-ops#9983).
# A root-owned, read-only, non-empty directory exists here from boot, so git's
# store helper cannot write a file at this path, nish cannot rmdir it, and the
# runners' InaccessiblePaths entry for it always has something to cover.
# If a regular file already exists at this path, tmpfiles `d` does not replace
# it (it fails with "already exists and is not a directory"), so the rollout
# moves any existing file away first.
d /home/nish/.git-credentials 0555 root root -
f /home/nish/.git-credentials/README 0444 root root - Plaintext git credentials are blocked here; git uses the gh credential helper; fleet-ops#9983
