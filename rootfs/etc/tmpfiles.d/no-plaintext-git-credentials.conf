# Block a plaintext git credential store at nish's default path (fleet-ops#9983).
# Git on this host authenticates through the gh credential helper, so nothing
# should use a plaintext store, and the repo sets no `credential.helper store`.
# A mode 0000 directory with a README inside exists at the store path from boot.
# Mode 0000 so the runners' probe, which tests that a hidden path is not
# readable, passes; the README keeps it non-empty so rmdir fails. git's store
# helper cannot write a file there, and the runners' InaccessiblePaths entry
# always has something to cover.
# Owned by nish, not root: systemd-tmpfiles refuses an `f` line under a
# root-owned directory inside a nish-owned one ("unsafe path transition", exit
# 73, checked with systemd 255), which would fail the Create tmpfiles handler on
# every run.
# Limit: this stops an accidental write by git's store helper. It does not stop
# a deliberate rename or chmod by a process running as nish, which owns the
# parent directory too. The full fix is runners off the nish uid
# (fleet-ops#9983 R3).
# If a regular file already exists at the path, tmpfiles `d` does not replace it
# (it fails with "already exists and is not a directory"), so the rollout moves
# any existing file away first; ansible/host.yml fails the run before tmpfiles
# if one is there, and the host-config tasks after that point wait until a
# person moves the file.
d /home/nish/.git-credentials 0000 nish nish -
f /home/nish/.git-credentials/README 0444 nish nish - Plaintext git credentials are blocked here; git uses the gh credential helper; fleet-ops#9983
