# Block a plaintext git credential store in nish's home (fleet-ops#9983).
# Git on this host authenticates through the gh credential helper, so nothing
# should use a plaintext store, and the repo sets no `credential.helper store`.
# A root-owned, mode 0000 directory with a root-owned README inside exists at
# each store path from boot. It is mode 0000 so the runners' probe, which tests
# that a hidden path is not readable, passes; the README keeps it non-empty so
# nish cannot rmdir it. git's store helper cannot write a file there, and the
# runners' InaccessiblePaths entry for the default path always has something to
# cover.
# Limit: this stops an accidental write by git's store helper. It does not stop
# a deliberate rename by a process running as nish, because nish owns the parent
# directories (/home/nish, and /home/nish/.config/git, which already exists).
# The full fix is runners off the nish uid (fleet-ops#9983 R3).
# `d` creates a missing parent as root, which would hand nish's own config
# directory to root, so keep a store path only under a parent that already exists.
# If a regular file already exists at a path, tmpfiles `d` does not replace it
# (it fails with "already exists and is not a directory"), so the rollout moves
# any existing file away first; ansible/host.yml fails the run before tmpfiles
# if one is there.
d /home/nish/.git-credentials 0000 root root -
f /home/nish/.git-credentials/README 0444 root root - Plaintext git credentials are blocked here; git uses the gh credential helper; fleet-ops#9983
d /home/nish/.config/git/credentials 0000 root root -
f /home/nish/.config/git/credentials/README 0444 root root - Plaintext git credentials are blocked here; git uses the gh credential helper; fleet-ops#9983
