# The user runtime dir and the two runtime dirs the user token mints write their App tokens
# into (systemd/fleet-worker-github-token@.service, systemd/fleet-grafana-github-token.service).
# The agent, fleet-ci and vault runner units cover both token dirs with a read-only
# TemporaryFileSystem= mount (fleet-ops#10886), and systemd makes a mount point that is absent
# when the unit starts itself: mkdir_p_label() as root, mode 0755. The mint runs as nish, so it
# cannot write into a root-owned mount point, and every detached worker launch and every
# fleet-pr-sweep run fails with no App token until a person removes the directory as root.
# A mount point made at boot is not removed again (the mints keep their dirs with
# RuntimeDirectoryPreserve=yes), so this file is what keeps it nish-owned mode 0700.
#
# systemd-tmpfiles-setup.service reads this before sysinit.target, so both directories exist
# with the owner and the mode the mint needs before any runner unit starts. The d type also
# adjusts the mode of a directory that exists already (checked with systemd 255: a 0755
# directory read back 0700), so a directory an earlier boot left root-owned is fixed here
# rather than by a person.
#
# /run/user/1000 itself is named because it is the parent of both mount points: systemd
# makes the missing parents of a mount point too, as root, and user-runtime-dir@1000.service
# does not set up a directory it does not own, so a root-made parent would stop nish's user
# manager from starting. The runners are ordered after that manager (fleet-ops#10081), so a
# parent it never makes is a pool that never starts.
d /run/user/1000 0700 nish nish -
d /run/user/1000/fleet-worker-github-token 0700 nish nish -
d /run/user/1000/fleet-grafana-github-token 0700 nish nish -
