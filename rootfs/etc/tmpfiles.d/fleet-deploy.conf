# The deploy-box job's mailbox (rootfs/etc/systemd/system/fleet-deploy.path). The
# directory is root's, so the runner cannot swap or delete the files in it; each
# file is owned by the uid the fleet-ci runners run as (nish today), 0600. The job
# writes `request`; fleet-deploy.service, as root, writes `result` and `log`. When
# the runners move to their own user, change the owner on these three lines.
d /var/lib/fleet-deploy 0755 root root -
f /var/lib/fleet-deploy/request 0600 nish nish -
f /var/lib/fleet-deploy/result 0600 nish nish -
f /var/lib/fleet-deploy/log 0600 nish nish -
