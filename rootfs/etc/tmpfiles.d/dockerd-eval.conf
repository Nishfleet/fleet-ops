# The rootless Docker engine's runtime directory (dockerd-eval.service,
# fleet-ops#9983). Created at boot, before any runner starts, so the runner units
# can hide it by inode; the engine's per-start rt subdirectory lives inside it.
# The second line is the engine's data root, which the unit binds into its home.
d /run/dockerd-eval 0700 nish nish -
d /home/nish/.local/share/dockerd-eval 0700 nish nish -
