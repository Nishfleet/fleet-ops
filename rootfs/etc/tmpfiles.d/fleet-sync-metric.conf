# The deploy result the fleet-sync.service textfile write lands in (fleet-ops#9437).
# node_exporter reads this directory (--collector.textfile.directory, from
# /etc/default/prometheus-node-exporter) and the files in it are owned by the uid
# the user units run as (nish today). The package ships the directory
# root:prometheus 0755, which the user unit cannot write, so this line keeps the
# group nish and adds the group write. node_exporter still reads it as
# `other`, so the mode stays 0755 for a reader that is neither root nor nish.
# When the units move to their own user, change the group on this line.
d /var/lib/prometheus/node-exporter 0775 root nish -
