# The one file the fleet-sync.service textfile write lands in (fleet-ops#9437).
# node_exporter reads this directory (--collector.textfile.directory, from
# /etc/default/prometheus-node-exporter), and the package ships it
# root:prometheus 0755, which the user unit cannot write. This line creates the
# single file that unit writes, owned by the uid the user units run as (nish
# today), and leaves the directory's owner and mode alone: a process that runs as
# nish can then rewrite this one series, but cannot add a file to the directory or
# replace another collector's series, and node_exporter reads this file as
# `other`. A `d` line here would make the whole directory group-writable for every
# process that runs as nish, which is every agent on the box, and one of them
# could then write `fleet_sync_failed 0` over a failed deploy.
# When the units move to their own user, change the owner on this line.
f /var/lib/prometheus/node-exporter/fleet-sync.prom 0644 nish nish -
