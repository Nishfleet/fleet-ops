# The deploy result the fleet-sync.service textfile write lands in (fleet-ops#9437).
# node_exporter reads this directory (--collector.textfile.directory, from
# /etc/default/prometheus-node-exporter) as user prometheus. The d line keeps
# mode 0755 and the owner of its parent /var/lib/prometheus, prometheus: a root-owned
# child under it makes systemd-tmpfiles stop with "unsafe path transition" (rc 73),
# which failed fleet-host-config.service (fleet-ops#11480). An earlier version of this
# file made the directory group-writable for nish, which is every agent on the
# box, and one of them could then write `fleet_sync_failed 0` over a failed
# deploy. The f line creates the single file the user unit writes, owned by the
# uid those units run as (nish today): the unit can rewrite that one series, it
# cannot add another file to the directory or replace another collector's series,
# and node_exporter reads this file as `other`.
# When the units move to their own user, change the owner on the f line.
d /var/lib/prometheus/node-exporter 0755 prometheus prometheus -
f /var/lib/prometheus/node-exporter/fleet-sync.prom 0644 nish nish -
