# /tmp had ~97 GB and files back to 2022: the distro line (tmp.conf, 30d) ages by
# the default abcmABM, and any read refreshes atime, so a file that is still
# opened never reaches the age. bcmBCM keeps the btime/ctime/mtime vetoes and
# ignores atime — the same fix agent-worktrees.conf made for the worktrees
# (fleet-ops#4256). The daily systemd-tmpfiles-clean.timer --clean runs this line.
# Vendor doc: tmpfiles.d(5), "Age" (the age-by argument) and "Type" (D).
D /tmp 1777 root root bcmBCM:14d
