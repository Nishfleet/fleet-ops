# Symptom alerts only (owner reset 2026-11-01, fleet-ops#10935): a public
# site that stops answering, a deploy that failed, an off-site backup or restore
# drill that stopped, the owner's Hermes gateway or Remote Control down, and a failed system
# unit, which files the issue the self-repair loop fixes. The dead-man
# heartbeat stays, because only an outside service can say the box itself is
# down. Every rule about the fleet's own internals (router rows, spend lines,
# Grafana, node_exporter, memory, disk, config reloads) was deleted in the
# reset: alert on symptoms, not causes (Google SRE book, "Monitoring
# Distributed Systems").
#
# Stock sources only: node_exporter's systemd collector (node_systemd_unit_state,
# unit-include covers .service and .timer), the blackbox exporter's
# probe_success, HAProxy's built-in exporter, the fleet-sync textfile metric,
# prometheus-community json_exporter (agent run counts), Prometheus' own vector()
# and the router's own deployment exports (litellm_deployment_success_responses_total,
# litellm_deployment_state).
#
# Routing lives in rootfs/etc/alertmanager/alertmanager.yml:
#   Watchdog          -> the outside dead-man (healthchecks.io), every 5m
#   severity=nish     -> Telegram (a real outage, immediately)
#   anything else     -> no receiver; Grafana's prometheus-alerts rule files
#                        one fleet-ops issue per firing alert name
groups:
  - name: fleet_watchdog
    rules:
      # Always firing. Its ABSENCE is the signal: Alertmanager forwards it to
      # an outside service on a repeat interval, and when the pings stop
      # (Prometheus dead, Alertmanager dead, or the box dead) that service
      # alerts, which nothing on this box can do for itself.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog heartbeat for the alerting pipeline"
          description: "Always firing. If this disappears, Prometheus or Alertmanager is dead."

  - name: fleet_host
    rules:
      # Visible, not paged: a failed unit is not by itself an outage. It also
      # covers a backup, locked copy or restore drill run that failed.
      - alert: SystemUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "system unit {{ $labels.name }} failed"
          description: "Systemd unit {{ $labels.name }} has been in the failed state for 5 minutes."

  - name: fleet_hermes
    rules:
      # Not active for 5 minutes. max_over_time rather than `for:` so a crash
      # loop that touches "active" for a moment between restarts does not reset
      # the clock on a gateway that is plainly not serving. absent_over_time
      # covers the series vanishing (the unit is gone). Both branches are gated
      # on node_exporter being up: when it is down the gateway is unobserved,
      # not down. Kept in the reset because Hermes is the owner's Telegram line
      # to the fleet, and the unit restarts forever, so it never reaches the
      # failed state SystemUnitFailed reads.
      - alert: HermesGatewayDown
        expr: |
          (
            max_over_time(node_systemd_unit_state{name="hermes-gateway.service",state="active"}[5m]) == 0
            or
            absent_over_time(node_systemd_unit_state{name="hermes-gateway.service",state="active"}[5m])
          )
          and on() (up{job="node"} == 1)
        labels:
          severity: nish
        annotations:
          summary: "hermes-gateway.service has not been active for 5 minutes"
          description: "node_systemd_unit_state{name=\"hermes-gateway.service\",state=\"active\"} has no active sample in the last 5 minutes, or the series is missing."

  - name: fleet_remote_control
    rules:
      # Nish's Remote Control server (claude-remote-control.service) has not been
      # active for 15 minutes, or its series is gone (fleet-ops#11643). The unit
      # restarts forever (Restart=always, StartLimitIntervalSec=0), so it never
      # reaches the failed state SystemUnitFailed reads; a stop was the
      # 2026-10-09 "nothing told anyone" gap. Same shape as HermesGatewayDown,
      # but a 15 minute window: RestartSec=300 keeps the unit out of "active" for
      # 5 minutes after every crash it heals itself, so only three failed
      # restarts in a row, or a stop, page. node_exporter here has no restart
      # counter (--collector.systemd.enable-restarts-metrics is off), so the
      # rule reads the active state, as the issue allows. Paged, because a stop
      # cuts Nish's own coding line to the box.
      - alert: RemoteControlDown
        expr: |
          (
            max_over_time(node_systemd_unit_state{name="claude-remote-control.service",state="active"}[15m]) == 0
            or
            absent_over_time(node_systemd_unit_state{name="claude-remote-control.service",state="active"}[15m])
          )
          and on() (up{job="node"} == 1)
        labels:
          severity: nish
        annotations:
          summary: "claude-remote-control.service has not been active for 15 minutes"
          description: "node_systemd_unit_state{name=\"claude-remote-control.service\",state=\"active\"} has no active sample in the last 15 minutes, or the series is missing."

  - name: fleet_backup
    rules:
      # The nightly off-site backup has not started for 30 hours (one missed
      # night plus slack), or its timer series vanished. A backup nobody hears
      # about stopping is the failure this catches; the healthchecks.io ping
      # only says a run finished, nothing on the box said when runs stopped.
      - alert: BackupStale
        expr: |
          # max_over_time keeps the last real trigger time across a reboot,
          # when a timer without Persistent=true reports 0 until it next runs.
          (time() - max_over_time(node_systemd_timer_last_trigger_seconds{name="restic-r2-backup.timer"}[31h])) > 30 * 3600
          or
          absent(node_systemd_timer_last_trigger_seconds{name="restic-r2-backup.timer"})
        for: 15m
        labels:
          severity: nish
        annotations:
          summary: "off-site backup has not run for over 30 hours"
          description: "restic-r2-backup.timer last triggered more than 30 hours ago, or its series is missing."
      # The monthly full restore drill has not started for 35 days (one missed
      # month plus slack) past its last real trigger, or its timer series
      # vanished. A timer that has never triggered exports 0, and 0 is the
      # state of a fresh install for up to a month, so the > 0 gate keeps it
      # quiet and the staleness check arms on the first real trigger. A backup
      # nobody ever restores is a hope, so a drill that quietly stopped is
      # worth seeing. Warning, not nish: the backup still runs and the data is
      # still on R2, so this is readiness, not an outage. A run that fails is
      # seen the same way as any other failed unit, through SystemUnitFailed.
      - alert: RestoreDrillStale
        expr: |
          max_over_time(node_systemd_timer_last_trigger_seconds{name="restic-r2-restore-drill.timer"}[36d]) > 0
          and
          (time() - max_over_time(node_systemd_timer_last_trigger_seconds{name="restic-r2-restore-drill.timer"}[36d])) > 35 * 24 * 3600
          or
          absent(node_systemd_timer_last_trigger_seconds{name="restic-r2-restore-drill.timer"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "monthly restore drill has not run for over 35 days"
          description: "restic-r2-restore-drill.timer last triggered more than 35 days ago, or its series is missing."

  - name: fleet_sites
    rules:
      # A public product site probed by the blackbox exporter (jobs named
      # site-*) has failed every probe for 3 minutes. The rule's own `for:`
      # absorbs a flap: one good probe resets it, so a single failed probe, or a
      # newly added target's first one, never pages. Alertmanager then waits
      # only seconds (group_wait), so an outage reaches Nish in about 5 minutes:
      # one probe interval (60s) + one evaluation (30s) + for (3m) + group_wait
      # (30s). Alerting rules and `for`:
      # https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
      # The up branch covers a dead blackbox exporter: its scrape fails, so
      # probe_success goes missing instead of reading 0. Both branches carry the
      # same job and instance labels, so a switch between them keeps one alert.
      # If the box itself is down the outside dead-man fires instead.
      - alert: SiteDown
        expr: probe_success{job=~"site-.*"} == 0 or up{job=~"site-.*"} == 0
        for: 3m
        labels:
          severity: nish
        annotations:
          summary: "{{ $labels.instance }} has not answered for 3 minutes"
          description: "Every blackbox probe of {{ $labels.instance }} (job {{ $labels.job }}) failed, or could not run, for 3 minutes."

  - name: fleet_router
    rules:
      # The router runs as two LiteLLM instances behind HAProxy, so one that dies breaks
      # nothing anyone sees, and nothing else would say so: the instances are user units,
      # which SystemUnitFailed does not read. HAProxy's own exporter counts the instances
      # that pass its health check (haproxy_backend_active_servers, "Total number of active
      # UP servers with a non-zero weight", the exporter's own HELP text; exporter doc:
      # https://www.haproxy.com/documentation/haproxy-configuration-tutorials/alerts-and-monitoring/prometheus/).
      # 15 minutes keeps a rolling restart quiet: one instance is out for up
      # to its 300 s drain plus its start. Warning, routed like SystemUnitFailed: it files
      # the issue the self-repair loop fixes, because the router still answers.
      - alert: RouterCopyDown
        expr: haproxy_backend_active_servers{proxy="litellm"} < 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "the router has fewer than 2 healthy copies"
          description: "HAProxy has seen {{ $value }} of 2 router instances pass its health check for 15 minutes."

      # PaidPlanIdle (fleet-ops#11845, the standing rules' "a paid plan with no calls
      # for 24 hours"): a paid plan in config/paid-plans.json that the router has not
      # answered successfully for 24 hours. The 24-hour window is the alert's own
      # measure, so there is no extra `for:`. Endpoints are the router's own exports,
      # label names checked live 2026-11-10: litellm_deployment_success_responses_total
      # carries api_base, the endpoint a router row calls, but only exists from a
      # row's first successful call since the router restarted, so a deployment
      # litellm_deployment_state knows and the counter has never seen (a row nobody
      # has called successfully) fires too — unless that endpoint's counter has
      # appeared. The api_base regex is the router-facing plans; when
      # config/paid-plans.json changes, change it here with it (tests/test_paid_plans.py
      # holds the pair together). Plans marked `via` in config/paid-plans.json reach their provider without the router and are out of scope.
      #
      # The two label sets do not always agree (seen live 2026-11-10, fleet-ops#11884):
      # the router exports a deployment's state under its configured api_base
      # (https://api.minimax.io/anthropic), while the counter carries the runtime URL
      # the Anthropic provider built (https://api.minimax.io/anthropic/v1/messages),
      # so an exact `unless on (api_base)` join missed a plan that had thousands of
      # successful calls and fired anyway. And the runtime suffix is not one string
      # (fleet-ops#11943, seen live 2026-11-12): CommandCode's OpenAI provider serves
      # some calls through the Responses API, so the exporter labels those deployments'
      # state with the runtime URL plan api_base + "/v1/responses" while the counter
      # stays at the configured one, and a "/v1/messages"-only strip fired CommandCode
      # — a plan with thousands of successful calls — all the same. The two suffixes
      # are not shaped alike (the Anthropic provider appends "/v1/messages" to a base
      # without one; the OpenAI one appends "/responses" to a base that already ends
      # in "/v1"), so label_replace chains two strips on the raw series: a trailing
      # "/v1/messages", then a trailing "/responses" after a kept "/v1". Both label
      # sets for one plan collapse into the same api_base in the sum by, both branches
      # name the plan the way config/paid-plans.json does, and the join is a
      # plan-level one.
      # https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
      - alert: PaidPlanIdle
        expr: |
          (
            sum by (api_base) (label_replace(label_replace(increase(litellm_deployment_success_responses_total{job="litellm",api_base=~"https://api\\.commandcode\\.ai/provider/v1.*|https://api\\.minimax\\.io/anthropic.*|https://api\\.z\\.ai/api/coding/paas/v4.*|https://opencode\\.ai/zen/go/v1.*|https://token-plan\\.ap-southeast-1\\.maas\\.aliyuncs\\.com/compatible-mode/v1.*|https://api\\.anthropic\\.com.*"}[24h]), "api_base", "$1", "api_base", "(.*)/v1/messages"), "api_base", "$1", "api_base", "(.*/v1)/responses")) == 0
            or
            sum by (api_base) (label_replace(label_replace(litellm_deployment_state{job="litellm",api_base=~"https://api\\.commandcode\\.ai/provider/v1.*|https://api\\.minimax\\.io/anthropic.*|https://api\\.z\\.ai/api/coding/paas/v4.*|https://opencode\\.ai/zen/go/v1.*|https://token-plan\\.ap-southeast-1\\.maas\\.aliyuncs\\.com/compatible-mode/v1.*|https://api\\.anthropic\\.com.*"}, "api_base", "$1", "api_base", "(.*)/v1/messages"), "api_base", "$1", "api_base", "(.*/v1)/responses"))
            unless on (api_base)
            sum by (api_base) (label_replace(label_replace(increase(litellm_deployment_success_responses_total{job="litellm",api_base=~"https://api\\.commandcode\\.ai/provider/v1.*|https://api\\.minimax\\.io/anthropic.*|https://api\\.z\\.ai/api/coding/paas/v4.*|https://opencode\\.ai/zen/go/v1.*|https://token-plan\\.ap-southeast-1\\.maas\\.aliyuncs\\.com/compatible-mode/v1.*|https://api\\.anthropic\\.com.*"}[24h]), "api_base", "$1", "api_base", "(.*)/v1/messages"), "api_base", "$1", "api_base", "(.*/v1)/responses"))
          )
        labels:
          severity: warning
        annotations:
          summary: "paid plan {{ $labels.api_base }} has had no successful router response for 24 hours"
          description: "The router answered no successful response for paid-plan endpoint {{ $labels.api_base }} in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."

  - name: fleet_agent_runs
    rules:
      # More than 2% of finished agent runs failed in each of the last two 24-hour windows
      # (scorecard target, fleet-ops#10711). The Grafana rule that did this was deleted with
      # Grafana's GitHub data source in the 2026-11-01 reset (fleet-ops#10935); this restores it
      # in Prometheus (fleet-ops#11799). Same counting as that rule: failed = failure, timed_out
      # and startup_failure; finished = those plus success; skipped and cancelled count as
      # neither. github_workflow_runs is GitHub's all-time total_count per conclusion (job
      # agent-runs, json_exporter), so a window's runs are the difference between its two ends;
      # a difference, not increase(), so a deleted run reads as a small dip, not a counter reset.
      # last_over_time bridges the 15-minute scrape interval. A window with no finished run
      # divides 0 by 0 and stays quiet. The absent branch is the old rule's error state: the
      # counts stopped arriving (exporter down, or GitHub refused the read). `for: 30m` keeps
      # the first load quiet until the first scrape lands.
      # https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
      - alert: AgentRunFailureShare
        expr: |
          (
            sum(last_over_time(github_workflow_runs{job="agent-runs",conclusion!="success"}[20m]) - last_over_time(github_workflow_runs{job="agent-runs",conclusion!="success"}[20m] offset 1d))
            /
            sum(last_over_time(github_workflow_runs{job="agent-runs"}[20m]) - last_over_time(github_workflow_runs{job="agent-runs"}[20m] offset 1d))
            > 0.02
          )
          and on()
          (
            sum(last_over_time(github_workflow_runs{job="agent-runs",conclusion!="success"}[20m] offset 1d) - last_over_time(github_workflow_runs{job="agent-runs",conclusion!="success"}[20m] offset 2d))
            /
            sum(last_over_time(github_workflow_runs{job="agent-runs"}[20m] offset 1d) - last_over_time(github_workflow_runs{job="agent-runs"}[20m] offset 2d))
            > 0.02
          )
          or
          absent_over_time(github_workflow_runs{job="agent-runs"}[1h])
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ if $labels.job }}agent run counts have not arrived for an hour{{ else }}more than 2% of finished agent runs failed two days running{{ end }}"
          description: "{{ if $labels.job }}github_workflow_runs{job=\"agent-runs\"} is missing: check prometheus-json-exporter.service and the GitHub API read, because the failure-share alert is blind.{{ else }}{{ $value | humanizePercentage }} of finished agent.yml runs failed in the last 24 hours, and over 2% the 24 hours before. Find what fails most, fix it, and prove the share fell. Runs: https://github.com/Nishfleet/fleet-ops/actions/workflows/agent.yml{{ end }}"

  - name: fleet_router_downgrade
    interval: 5m
    rules:
      # Share of worker-capable chat calls answered by worker-cheap, for reading the downgrade rate in one
      # query: router:capable_answered_by_cheap:ratio_1d for the day, and
      # avg_over_time(router:capable_answered_by_cheap:ratio_1d[7d]) or
      # sum(router:capable_answered_by_cheap:increase1d)/sum(router:capable_requests:increase1d) over the same
      # window for 7 days. Counters: litellm_deployment_successful_fallbacks_total (requested_model,
      # fallback_model) and litellm_proxy_total_requests_metric_total.
      - record: router:capable_requests:increase1d
        expr: sum(increase(litellm_proxy_total_requests_metric_total{requested_model="worker-capable",route=~".*chat/completions"}[1d]))
      - record: router:capable_answered_by_cheap:increase1d
        expr: sum(increase(litellm_deployment_successful_fallbacks_total{requested_model="worker-capable",fallback_model="worker-cheap"}[1d])) or vector(0)
      - record: router:capable_answered_by_cheap:ratio_1d
        expr: router:capable_answered_by_cheap:increase1d / router:capable_requests:increase1d
