# Fleet alert rules: the dead-man heartbeat, failed units, the Hermes
# gateway, node_exporter and config-reload health, stale or failed off-site
# backups, public sites that stop answering, and a same-day AI spend line
# (plus a page if that metric goes missing). Kept deliberately small. The
# repair-dispatch machinery and the 12 rules that fed it were cut on
# 2026-09-29 (fleet-ops#8958); nothing here brings back a repair worker or a
# second page path. NodeExporterDown pages because a down node_exporter
# gates HermesGatewayDown off.
#
# Stock sources only: node_exporter's systemd collector (node_systemd_unit_state,
# unit-include covers .service and .timer), the blackbox exporter's
# probe_success, LiteLLM's own spend metric and Prometheus' own vector().
#
# Routing lives in rootfs/etc/alertmanager/alertmanager.yml:
#   Watchdog          -> the outside dead-man (healthchecks.io), every 5m
#   severity=nish     -> Telegram (a real outage, immediately)
#   anything else     -> no receiver; visible as the ALERTS series and in
#                        Alertmanager, pages nobody
groups:
  - name: fleet_watchdog
    rules:
      # Always firing. Its ABSENCE is the signal: Alertmanager forwards it to
      # an outside service on a repeat interval, and when the pings stop
      # (Prometheus dead, Alertmanager dead, or the box dead) that service
      # alerts, which nothing on this box can do for itself.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog heartbeat for the alerting pipeline"
          description: "Always firing. If this disappears, Prometheus or Alertmanager is dead."

  - name: fleet_host
    rules:
      # Visible, not paged: a failed unit is not by itself an outage.
      - alert: SystemUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "system unit {{ $labels.name }} failed"
          description: "Systemd unit {{ $labels.name }} has been in the failed state for 5 minutes."

  - name: fleet_hermes
    rules:
      # Not active for 5 minutes. max_over_time rather than `for:` so a crash
      # loop that touches "active" for a moment between restarts does not reset
      # the clock on a gateway that is plainly not serving. absent_over_time
      # covers the series vanishing (the unit is gone). Both branches are gated
      # on node_exporter being up: when it is down the gateway is unobserved,
      # not down, and NodeExporterDown reports that instead.
      - alert: HermesGatewayDown
        expr: |
          (
            max_over_time(node_systemd_unit_state{name="hermes-gateway.service",state="active"}[5m]) == 0
            or
            absent_over_time(node_systemd_unit_state{name="hermes-gateway.service",state="active"}[5m])
          )
          and on() (up{job="node"} == 1)
        labels:
          severity: nish
        annotations:
          summary: "hermes-gateway.service has not been active for 5 minutes"
          description: "node_systemd_unit_state{name=\"hermes-gateway.service\",state=\"active\"} has no active sample in the last 5 minutes, or the series is missing."

      # Pages: without node_exporter the gateway rule is gated off and cannot see, so the
      # exporter's own loss must reach Telegram (it did through absent_over_time before).
      - alert: NodeExporterDown
        expr: up{job="node"} == 0 or absent(up{job="node"})
        for: 5m
        labels:
          severity: nish
        annotations:
          summary: "node_exporter is not being scraped"
          description: "up{job=\"node\"} has been 0 for 5 minutes, so HermesGatewayDown and SystemUnitFailed cannot see."

  - name: fleet_config
    rules:
      # A reload that fails keeps the old config running; these make that loud.
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: nish
        annotations:
          summary: "Prometheus rejected its last config reload"
          description: "prometheus_config_last_reload_successful is 0: the running config is not the installed one."

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: nish
        annotations:
          summary: "Alertmanager rejected its last config reload"
          description: "alertmanager_config_last_reload_successful is 0: the running config is not the installed one."

  # The self-repair loop's own health (fleet-ops#10306): alert -> Grafana ->
  # GitHub issue -> Claude-lane worker. Grafana files the issues, so when it is
  # down or cannot deliver, no issue and no worker follows and nothing else
  # reports it. These two go to Telegram at once (alertmanager.yml, own route
  # with group_wait 0s), outside the 2 hour wait. The queue-stuck half is not
  # a rule: see the comment on fleet-ops#10306.
  - name: fleet_loop_health
    rules:
      # absent() covers the scrape job vanishing from prometheus.yml.
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0 or absent(up{job="grafana"})
        for: 5m
        labels:
          severity: nish
        annotations:
          summary: "Grafana is down, so no alert can file a fleet issue"
          description: "up{job=\"grafana\"} has been 0 or missing for 5 minutes."

      # Any integration, any reason: a webhook 401 from an expired GitHub App
      # token is the case this was written for (fleet-grafana-github-token.timer).
      # The series appears with the first failure, so a healthy Grafana is silent.
      - alert: GrafanaNotificationsFailing
        expr: sum(increase(grafana_alerting_notifications_failed_total[15m])) > 0
        labels:
          severity: nish
        annotations:
          summary: "Grafana failed to deliver alert notifications in the last 15 minutes"
          description: "grafana_alerting_notifications_failed_total rose in the last 15 minutes: check the Grafana log and fleet-grafana-github-token.service."

  - name: fleet_backup
    rules:
      # The nightly off-site backup has not started for 30 hours (one missed
      # night plus slack), or its timer series vanished. A backup nobody hears
      # about stopping is the failure this catches; the healthchecks.io ping
      # only says a run finished, nothing on the box said when runs stopped.
      - alert: BackupStale
        expr: |
          # max_over_time keeps the last real trigger time across a reboot,
          # when a timer without Persistent=true reports 0 until it next runs.
          (time() - max_over_time(node_systemd_timer_last_trigger_seconds{name="restic-r2-backup.timer"}[31h])) > 30 * 3600
          or
          absent(node_systemd_timer_last_trigger_seconds{name="restic-r2-backup.timer"})
        for: 15m
        labels:
          severity: nish
        annotations:
          summary: "off-site backup has not run for over 30 hours"
          description: "restic-r2-backup.timer last triggered more than 30 hours ago, or its series is missing."
      # A backup, locked copy or size guard that failed and stayed failed for
      # an hour (not a one-off retry): the snapshot did not reach R2.
      - alert: BackupFailed
        expr: node_systemd_unit_state{name=~"restic-r2-(backup|locked-copy|size-guard)\\.service",state="failed"} == 1
        for: 1h
        labels:
          severity: nish
        annotations:
          summary: "backup unit {{ $labels.name }} has been failed for 1 hour"
          description: "Systemd unit {{ $labels.name }} is in the failed state, so last night's off-site backup did not complete."

  - name: fleet_sites
    rules:
      # A public product site probed by the blackbox exporter (jobs named
      # site-*) has failed every probe for 10 minutes. If the box itself is
      # down the outside dead-man fires instead.
      - alert: SiteDown
        # The up branch covers a dead blackbox exporter: its scrape fails, so
        # probe_success goes missing instead of reading 0. The count gate needs
        # 8 samples in the window (8 minutes at the slowest site job), so a
        # newly added target cannot page on its first failed probe.
        expr: |
          (max_over_time(probe_success{job=~"site-.*"}[10m]) == 0
            and count_over_time(probe_success{job=~"site-.*"}[10m]) >= 8)
          or
          (max_over_time(up{job=~"site-.*"}[10m]) == 0
            and count_over_time(up{job=~"site-.*"}[10m]) >= 8)
        labels:
          severity: nish
        annotations:
          summary: "{{ $labels.instance }} has not answered for 10 minutes"
          description: "Every blackbox probe of {{ $labels.instance }} (job {{ $labels.job }}) failed, or could not run, for 10 minutes."

  - name: fleet_spend
    rules:
      # Paid AI spend through the LiteLLM router over the last 24 hours is
      # past 40 USD. The per-seat caps stop each seat on its own and tell
      # nobody; this is the same-day signal for a runaway loop. 14 days to
      # 2026-10-15: highest day 31.04 USD, median 5.21 USD.
      - alert: AISpendHigh
        expr: sum(increase(litellm_spend_metric_total[24h])) > 40
        for: 15m
        labels:
          severity: nish
        annotations:
          summary: "AI spend is over 40 USD in the last 24 hours"
          description: "sum(increase(litellm_spend_metric_total[24h])) is {{ $value | printf \"%.2f\" }} USD, above the 40 USD daily line."

      # The spend line above cannot fire if the router stops exporting the
      # counter, so a day with no series at all pages too. The fleet calls
      # the router every hour, so 24 hours of silence is a broken export,
      # not a quiet day.
      - alert: AISpendMetricMissing
        expr: absent_over_time(litellm_spend_metric_total[24h])
        for: 1h
        labels:
          severity: nish
        annotations:
          summary: "AI spend metric has been missing for over a day"
          description: "No litellm_spend_metric_total series for 24 hours, so AISpendHigh cannot fire."

  - name: fleet_router
    rules:
      # The strong worker group answers nothing. litellm_deployment_state is 0 for a row the
      # router cannot cool (an Ollama connection error is ignored by v1.98.0's cooldown logic), so a
      # state-only rule stayed silent while every pick failed. A row counts as healthy here only if it
      # reads state 0 AND answered a call in the last 15 minutes; the rule fires when no row does while the
      # group is being called (more than 5 chat calls in 15 minutes), so an idle night does not page.
      # The state series whose litellm_model_name is the group name is left out: it can sit at 2 after the
      # row recovered. up{job="litellm"} gates it, since a failed scrape is unobserved, not down.
      # Label model_id: every worker-capable row id ends in -worker-capable (there is no group label).
      - alert: RouterStrongGroupNoHealthyRow
        expr: |
          (count(
              count by (model_id) (litellm_deployment_state{model_id=~".+-worker-capable", litellm_model_name!="worker-capable"} == 0)
              and on (model_id)
              (sum by (model_id) (increase(litellm_deployment_success_responses_total{model_id=~".+-worker-capable"}[15m])) > 0)
            ) or vector(0)) == 0
          and on() (sum(increase(litellm_proxy_total_requests_metric_total{requested_model="worker-capable",route=~".*chat/completions"}[15m])) > 5)
          and on() (up{job="litellm"} == 1)
        for: 5m
        labels:
          severity: nish
          group: worker-capable
        annotations:
          summary: "worker-capable has no row that answers"
          description: "No worker-capable row is at litellm_deployment_state 0 and answering calls, for 5 minutes while the group is being called."

      # The senior tier (fleet-ops#9054): one row, no fallback, sparse traffic (16
      # calls in 24 h on 2026-10-12). A dead-model 400 has no peer row to escape to
      # and v1.98.0 does not cool a 400 by default; the per-row
      # BadRequestErrorAllowedFails 1 parks it for cooldown_time (60 s) on every
      # call, so litellm_deployment_state reads 0 again each cycle and a state-only
      # alert would flap. Same caller-facing signal as RouterStrongGroupFailing,
      # scaled to the traffic: no call to senior is answered while at least 2 fail
      # in 6 h (senior has no fallback, so every failed pick reaches the caller).
      # One transient 502, the thing that parked the row on 2026-10-12, cannot
      # cross the 2.
      - alert: RouterSeniorFailing
        expr: |
          sum(increase(litellm_proxy_failed_requests_metric_total{requested_model="senior",route=~".*chat/completions"}[6h])) >= 2
          and sum(increase(litellm_proxy_failed_requests_metric_total{requested_model="senior",route=~".*chat/completions"}[6h]))
            == sum(increase(litellm_proxy_total_requests_metric_total{requested_model="senior",route=~".*chat/completions"}[6h]))
          and sum(increase(litellm_proxy_total_requests_metric_total{requested_model="senior",route=~".*chat/completions"}[6h])) >= 2
          and on() (up{job="litellm"} == 1)
        for: 5m
        labels:
          severity: nish
          group: senior
        annotations:
          summary: "senior has no row that answers"
          description: "Every senior call in the last 6 hours failed (2 or more calls) for 5 minutes. The senior group has one row and no fallback, so every call dies on it: fix or remove the dead row in config/litellm-proxy.yaml."

      # Caller-facing failures on the strong group: more than 5% of its chat calls fail for 10 minutes.
      # litellm_proxy_failed_requests_metric_total counts only calls that reached the caller, so a
      # fallback that answered the call does not count (0 in the 24 h to 2026-10-22). Both halves carry
      # the same route filter.
      - alert: RouterStrongGroupFailing
        expr: |
          sum(increase(litellm_proxy_failed_requests_metric_total{requested_model="worker-capable",route=~".*chat/completions"}[15m]))
            / sum(increase(litellm_proxy_total_requests_metric_total{requested_model="worker-capable",route=~".*chat/completions"}[15m])) > 0.05
          and sum(increase(litellm_proxy_total_requests_metric_total{requested_model="worker-capable",route=~".*chat/completions"}[15m])) > 20
        for: 10m
        labels:
          severity: nish
          group: worker-capable
        annotations:
          summary: "More than 5% of worker-capable calls are failing"
          description: "worker-capable chat calls are reaching the caller as errors. Compare litellm_deployment_failure_responses_total by model_id for the row that keeps failing."

  - name: fleet_router_downgrade
    interval: 5m
    rules:
      # Share of worker-capable chat calls answered by worker-cheap, for reading the downgrade rate in one
      # query: router:capable_answered_by_cheap:ratio_1d for the day, and
      # avg_over_time(router:capable_answered_by_cheap:ratio_1d[7d]) or
      # sum(router:capable_answered_by_cheap:increase1d)/sum(router:capable_requests:increase1d) over the same
      # window for 7 days. Counters: litellm_deployment_successful_fallbacks_total (requested_model,
      # fallback_model) and litellm_proxy_total_requests_metric_total.
      - record: router:capable_requests:increase1d
        expr: sum(increase(litellm_proxy_total_requests_metric_total{requested_model="worker-capable",route=~".*chat/completions"}[1d]))
      - record: router:capable_answered_by_cheap:increase1d
        expr: sum(increase(litellm_deployment_successful_fallbacks_total{requested_model="worker-capable",fallback_model="worker-cheap"}[1d])) or vector(0)
      - record: router:capable_answered_by_cheap:ratio_1d
        expr: router:capable_answered_by_cheap:increase1d / router:capable_requests:increase1d
