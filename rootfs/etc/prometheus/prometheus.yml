# Prometheus configuration — repo-sourced (fleet-ops#1534).
#
# The Debian package owns /etc/prometheus/prometheus.yml; fleet-sync.service
# deploys this as a root-owned copy (not a symlink: prometheus cannot
# traverse /home/nish) and reloads prometheus after the change
# (fleet-ops#8084).
global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s
  external_labels:
    monitor: fleet-netcup-rs2000

# Relative to this file's directory, so `promtool check config` on the repo
# copy (CI, and ansible before it installs) also validates the rules file.
rule_files:
  - fleet_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  # fleet-ops#4130 P1: scrape the LiteLLM proxy's /metrics endpoint so
  # the router's own gauges (litellm_deployment_success_rate,
  # litellm_deployment_cooldowns, litellm_request_total_duration_seconds,
  # litellm_total_requests) land in Prometheus alongside the fleet's own
  # fleet_litellm_* gauges from the /health canary. The proxy binds
  # 127.0.0.1:4000. The trailing slash on metrics_path is load-bearing:
  # LiteLLM mounts the endpoint at /metrics/, so a bare /metrics answers 307
  # with an empty body and Prometheus (follow_redirects: false) scrapes zero
  # samples while still reporting the target up (fleet-ops#4174 reopen).
  - job_name: litellm
    metrics_path: /metrics/
    static_configs:
      - targets: ['127.0.0.1:4000']

  # fleet-ops#9355: Grafana's own /metrics (anonymous, loopback), so the
  # cost-alarm delivery rule can read grafana_alerting_notifications_failed_total
  # and page hermes-urgent when the GitHub-issue webhook fails.
  - job_name: grafana
    static_configs:
      - targets: ['127.0.0.1:3001']

  # Alertmanager's own metrics: alertmanager_notifications_total{integration=
  # "webhook"} is the count of Watchdog heartbeats it has sent to the outside
  # dead-man, and up{job="alertmanager"} is the local half of "is it alive".
  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']

  # --- 0509 blackbox probes removed 2026-10-01 (fleet-ops#9014) -----------
  # Deleted, not repointed. All 12 targets of the three blackbox-0509-* jobs
  # (/timeline/*, /search?...) answer 404 after the 0509 rebuild (0509#3842),
  # so all three probe_success series read 0; and the alert stack was cut on
  # 2026-09-29 (fleet-ops#8958 — 0 rules loaded, alertmanager disabled), so a
  # blackbox failure reached nobody anyway. (The dead-man and the hermes
  # gateway rule are back since; the repair-dispatch rules are not.) Net machinery goes down. 0509
  # stays covered by the Sentry cron monitors in org 0509-gg (liveness-ping,
  # own-site-check, nightly) and the post-deploy e2e (0509#5736). The three
  # module definitions these jobs used were removed from config/blackbox.yml
  # in the same change.

  # 0509 homepage up/down for the fleet view (fleet-grafana, Nish 2026-10-03).
  # The stock http_2xx module, via the blackbox exporter already running on
  # :9115. SiteDown (fleet_rules.yml) pages on any site-* job down for 10m.
  - job_name: site-0509
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://0509.io/]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # The other public product homepages, one GET each per minute, same
  # module and exporter. Redirects are followed, so a www or apex redirect
  # counts as up when it lands on a 2xx. storagebun.com is left out until it
  # is public: it answers with the Access login while it is private.
  - job_name: site-products
    # Once a minute is enough for the 10-minute SiteDown window and halves the
    # requests each site's free-plan quota and analytics see.
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.0509.io/
          - https://seofixkit.com/
          - https://siterep.net/
          # TinyStudio is offline on purpose while it is rebuilt (Nish, 2026-10-25):
          # put https://tinystudio.io/ and https://tinystudio.in/ back at relaunch.
          - https://aiconverter.app/
          - https://inish.in/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      # repo: the Nishfleet repo whose worker fixes the site (fleet-ops#10323).
      # Grafana files a SiteDown in that repo; a target with no row here files
      # in fleet-ops.
      - source_labels: [__param_target]
        regex: 'https://api\.0509\.io/'
        target_label: repo
        replacement: 0509
      - source_labels: [__param_target]
        regex: 'https://seofixkit\.com/'
        target_label: repo
        replacement: seo-fix-kit
      - source_labels: [__param_target]
        regex: 'https://siterep\.net/'
        target_label: repo
        replacement: siterep-public
      - source_labels: [__param_target]
        regex: 'https://aiconverter\.app/'
        target_label: repo
        replacement: aiconverter-app
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Launch push (2026-10-15 to 2026-10-29): the paths a Site Rep or SEO Fix
  # Kit customer depends on, not just the homepage: each Worker's health
  # route, Site Rep's embed script on customer sites, and SEO Fix Kit's free
  # check page. Read-only GETs that write nothing (the deep-health endpoints
  # write, so they are left out); four a minute keeps the Workers request
  # count small. The job name matches site-.*, so SiteDown pages on these.
  - job_name: site-launch-paths
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://siterep.net/api/health
          - https://siterep.net/widget.js
          - https://seofixkit.com/api/health
          - https://seofixkit.com/check
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
