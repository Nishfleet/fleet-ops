# fleet-ops: after apt (unattended-upgrades daily, fleet-update weekly),
# needrestart only LISTS services on old libraries. The daily security
# patches then never restart a service mid-job. fleet-update restarts them
# with `needrestart -r a` once the fleet is paused.
$nrconf{restart} = 'l';
# Never restarted, not even by fleet-update: it ends every open Claude chat.
# It picks up new libraries at the next reboot.
$nrconf{override_rc}{qr(^claude-remote-control\.service$)} = 0;
