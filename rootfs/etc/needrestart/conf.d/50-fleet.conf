# fleet-ops: after apt (unattended-upgrades weekly, fleet-update daily),
# needrestart only LISTS services on old libraries. The weekly security
# patches then never restart a service mid-job; the Sunday 03:30 reboot
# applies the new libraries.
$nrconf{restart} = 'l';
# Never restarted, not even by fleet-update: it ends every open Claude chat.
# It picks up new libraries at the next reboot.
$nrconf{override_rc}{qr(^claude-remote-control\.service$)} = 0;
# Never restarted by the daily update either: a daily run would restart them on
# every library patch. They pick up new libraries at the next reboot.
$nrconf{override_rc}{qr(^hermes-(gateway|serve)\.service$)} = 0;
