#!/usr/sbin/nft -f

# Scoped per-table rebuild (destroy + redeclare), never `flush ruleset`:
# this file must not touch ufw's `ip`/`ip6 filter` tables on restart (fleet-ops#8258).
destroy table inet filter
table inet filter {
	chain input {
		type filter hook input priority filter;
	}
	chain forward {
		type filter hook forward priority filter;
	}
	chain output {
		type filter hook output priority filter;
	}
}

# Taildrop/PeerAPI guard (replaces /usr/local/sbin/tailscale-peerapi-uid-filter,
# 2026-09-25). Non-root local uids may not open TCP to this node's own tailnet
# IPs except the tailnet services they need: 22 ssh, 445 tiny-studio SMB
# bridge, 22000 syncthing, 3217 zerocut. `fib daddr type local` matches this
# node's own addresses, so no IP list to keep in sync. Lives here so every
# nftables restart re-applies it (the script-applied table was silently lost
# on the 2026-09-22 restart).
destroy table inet tailscale-peerapi-uid-filter
table inet tailscale-peerapi-uid-filter {
  chain output {
    type filter hook output priority filter; policy accept;
    ip daddr 100.64.0.0/10 fib daddr type local tcp dport { 22, 445, 22000, 3217 } accept
    ip daddr 100.64.0.0/10 fib daddr type local meta skuid != 0 drop
    ip6 daddr fd7a:115c:a1e0::/48 fib daddr type local tcp dport { 22, 445, 22000, 3217 } accept
    ip6 daddr fd7a:115c:a1e0::/48 fib daddr type local meta skuid != 0 drop
  }
}
