# /etc/sysctl.d/62-fleet-tty-tiocsti.conf: no process may push keystrokes into
# a terminal it does not own with TIOCSTI (fleet-ops#11320).
#
# The seats sandbox in /etc/zsh/zprofile leaves out bwrap --new-session, because
# setsid takes the interactive TUI's controlling terminal away. The keystroke
# injection that flag guards is closed here instead, on every kernel: this
# box's kernel builds CONFIG_LEGACY_TIOCSTI out today, and this line keeps the
# same result if a kernel update builds it back in (kernel docs,
# admin-guide/sysctl/kernel, "legacy_tiocsti", Linux 6.2 and later).
dev.tty.legacy_tiocsti = 0
