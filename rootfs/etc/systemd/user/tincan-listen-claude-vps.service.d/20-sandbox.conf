[Service]
# Sandbox the Tincan wake listener (fleet-ops#9503). Home-wide writes because
# the headless claude handles arbitrary requests and may edit workspaces.
#
# A user manager silently ignores InaccessiblePaths=/run/docker.sock
# (verified 2026-10-09: still connectable, no mask in /proc/self/mountinfo).
# ProtectKernelModules/ProtectClock/ProtectKernelLogs fail the unit with
# status 218/CAPABILITIES. Docker access on this unit closes only when nish
# leaves the docker group; see docs/RUNBOOK.md, "Worker sandbox (fleet-ops#9503)".
#
# Staged: ansible/host.yml copies this file. Rollback: revert and restart.
UMask=0077
PrivateTmp=true
ProtectSystem=strict
ReadWritePaths=-/home/nish
ReadWritePaths=-/run/user/1000
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
SystemCallArchitectures=native
