# The daemon listens on a fixed loopback port, so tether (a system service
# that the `inet tether` nftables table lets reach only this port) can connect.
# The port must match cua_daemon_port in ansible/host.yml
# (tests/test_systemd_unit_keys.py checks). A change here takes effect when
# update.yml restarts the daemon with the desk Space idle. Switch off: delete
# this file, then the next restart listens on an ephemeral port again.
[Service]
ExecStart=
ExecStart="/opt/Cua Spaces/resources/native/cua" daemon start --foreground --loopback 127.0.0.1:4730
