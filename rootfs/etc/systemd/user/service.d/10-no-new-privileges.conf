# Every user-level service of nish gets NoNewPrivileges=yes, so `sudo` and other
# setuid binaries fail inside it. That covers every background worker, because
# workers start as `systemd-run --user` services (CLAUDE.md "Detached work").
# Interactive shells (tmux scopes) and Remote Control (a system unit) are not
# services of this manager, so they keep sudo for Nish and his sessions.
#
# Why: a worker that runs sudo can stall the whole box (fleet-ops#9091 stall
# test froze runners ~28 min). Root changes go through a reviewed PR to
# rootfs/ and ansible/host.yml instead (thread "fix everything like pro devs",
# 2026-10-03). Same uid as nish, so this stops accidents, not an attacker.
#
# Exceptions are 90-*.conf drop-ins in a unit's own directory. systemd applies
# drop-ins in filename order across all directories, so 90- overrides 10-.
[Service]
NoNewPrivileges=yes
