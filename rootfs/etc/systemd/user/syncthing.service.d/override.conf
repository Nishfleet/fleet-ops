# Syncthing's packaged user unit (/usr/lib/systemd/user/syncthing.service) with
# only the start line changed: this box keeps its Syncthing home in
# ~/.config/syncthing, and apt owns upgrades (ansible/tasks/syncthing.yml).
# The packaged unit's restart policy, start limit and hardening stay in force.
# An empty ExecStart= clears the packaged line before the new one (systemd.service(5)).
# https://docs.syncthing.net/users/autostart.html#using-systemd
[Service]
ExecStart=
ExecStart=/usr/bin/syncthing serve --no-browser --no-restart --no-upgrade --home=%h/.config/syncthing
