# SENIOR AUDITOR 2026-09-05: gpg-agent is a tiny, security-critical
# credential cache; it must not be selected by systemd-oomd.
# It was a hand-placed file under ~/.config/systemd/user (fleet-ops#10138),
# which shadows this directory, so the drop-in lived only on the box.
# fleet-sync.service step 2k removes the live copy once fleet-host-config.service
# has installed this one, and the daemon-reload that follows picks it up.
[Service]
ManagedOOMPreference=omit
MemoryMax=512M
