# gpg-agent is a tiny, security-critical credential cache, so systemd-oomd
# must not select it (senior auditor, 2026-09-05).
# fleet-ops#10138 moved this drop-in out of ~/.config/systemd/user, which
# shadows /etc/systemd/user and made these bytes inert, and retired the live
# copy in ansible/host.yml; the user-manager reload that follows the removal
# is what picks this file up.
[Service]
ManagedOOMPreference=omit
MemoryMax=512M
