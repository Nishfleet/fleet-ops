# Fleet policy: killing is the EXCEPTION, not the norm (Nish, 2026-08-26).
# Per-worker MemoryHigh=4G throttles a stalled job; agent.slice's
# MemoryMax=28G is a hard cap the kernel enforces by killing the single
# biggest task inside the slice; oomd only acts when throttling has
# failed. A slice-wide MemoryHigh does neither cleanly (fleet-ops#11160):
# it throttles every descendant at once and pushed all 29 runners over
# their oomd rules together, so agent.slice carries no slice MemoryHigh.
#
# Duration is global-only in systemd 255 (per-slice DurationSec is not a valid
# key). systemd default 30s; Fedora ships 20s on user@.service for desktop
# latency. 60s suits a batch fleet: a 30s pressure spike is survivable, a full
# sustained minute is a genuine emergency.
[OOM]
DefaultMemoryPressureDurationSec=60s
