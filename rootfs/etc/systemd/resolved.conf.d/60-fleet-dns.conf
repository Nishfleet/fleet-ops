# fleet-ops#12151: SiteDown fired for five site probes at once on
# 2026-11-27 10:32Z because every recursive resolver in DNS= — all four are
# the provider's, set by hand in /etc/systemd/resolved.conf — stopped
# answering together for 24 minutes, and recovery was only resolved rotating
# back onto a live one. This drop-in restates the provider resolvers (a
# drop-in's DNS= replaces the main file's list) and adds 9.9.9.9 (Quad9) and
# 1.1.1.1 (Cloudflare), on networks independent of the provider's: resolved
# moves to the next listed server when one times out, so one provider's
# outage can no longer silence every outbound lookup. FallbackDNS= would be
# inert here: resolved.conf(5) — it is "only used if no other DNS server
# information is known", and DNS= is always known on this box.
# systemd-resolved reads this at start, so the play restarts the unit after
# installing it.
[Resolve]
# An empty DNS= clears the list from /etc/systemd/resolved.conf (resolved.conf(5):
# list settings accumulate across drop-ins unless reset), so the line below is
# the whole effective list.
DNS=
DNS=46.38.252.230 46.38.225.230 2a03:4000:8000::fce6 2a03:4000:0:1::e1e6 9.9.9.9 1.1.1.1
