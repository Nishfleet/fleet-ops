# The half of the agent lock that every relay listener shares (fleet-ops#9977).
# This file belongs to no unit: it is installed under a name systemd never
# loads, and each tincan-listen-*.service.d/50-shared.conf is a symlink to it,
# so the rules have one source. A sandbox setting in a user unit is silently
# ignored on this host (kernel.apparmor_restrict_unprivileged_userns=1), so
# these only count because the units are system units with User=.
# The probe in tests/test_agent_locks.py reads this file and fails if a path
# listed as hidden for an agent is not hidden here or in its own drop-in.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
UMask=0077
# Every other agent's keys, the host's deploy and mail credentials, the user
# manager that could lift this lock, and the container socket.
InaccessiblePaths=/home/nish/.config/fleet-ops/seats
InaccessiblePaths=/home/nish/.config/cloudflare
InaccessiblePaths=/home/nish/.config/systemd
InaccessiblePaths=/home/nish/.ssh
InaccessiblePaths=/home/nish/.git-credentials
InaccessiblePaths=/home/nish/.hermes
InaccessiblePaths=/home/nish/.local/share/claude-seat-backup
InaccessiblePaths=/run/user/1000
InaccessiblePaths=/run/docker.sock
InaccessiblePaths=/var/run/docker.sock
