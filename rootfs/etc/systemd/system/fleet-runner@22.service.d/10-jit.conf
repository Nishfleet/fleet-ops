# Pilot, runner 22 only (fleet-ops#11960, design: docs/design/ephemeral-runners.md): the runner
# registers as a just-in-time runner at every start, takes one job, exits, and starts again as
# a fresh registration, so a file one job leaves cannot change the next job (#11946, #11959).
# A drop-in for this one instance, not the shared template, so no other runner changes.
#
# GitHub's "Secure use reference", "Using just-in-time runners", names JIT as the way "to improve
# runner registration security"; REST docs "Create configuration for a just-in-time runner for an
# organization" (POST /orgs/{org}/actions/runners/generate-jitconfig); the runner takes the config
# from ACTIONS_RUNNER_INPUT_JITCONFIG. Permissions: "Permissions required for GitHub Apps".
#
# The step before the runner starts runs as root (the + prefix; systemd.service(5),
# "Command lines"). The App token is minted by nish, who already holds the worker App's key,
# through the repo's existing mint (config/github-app-token), asking for exactly
# organization_self_hosted_runners:write. The token and the JIT config live in shell variables;
# the token goes to curl on stdin (-H @-) and the config goes to a root-only file in /run that
# systemd reads (EnvironmentFile=) before it drops to fleet-runner. Neither is on a command line
# or in the journal. The job user can read neither the key nor the mint's token.
#
# A record left by a stop before a job (crash, deploy restart, plain stop), or the pilot's old
# standing registration, makes a second request for the same name fail with 409. The step
# deletes the records of that name first, then asks for the same name: one stable name means one
# record per runner and no offline duplicates, where a unique name per start would leave one
# record behind per stop and need the same deleting anyway.
#
# The work folder and the old registration files go at every start, so the folder is empty and
# the runner can only register from the JIT config. Labels and group are what the pool has today:
# group agent (id 3), labels self-hosted and agent.
[Unit]
# Failed starts end `failed` and do not loop silently (fleet-ops#10253): a clean exit after each
# job is a start too, so the burst is above what real jobs reach (a cycle is at least the 30s
# RestartSec of the shared unit), while a start that cannot reach GitHub repeats every 30s to 75s
# and reaches 20 well inside the window.
StartLimitIntervalSec=30min
StartLimitBurst=20

[Service]
# A JIT runner exits cleanly after its one job; on-failure would leave it stopped.
Restart=always
# The mint and the three API calls must finish inside this, so a hung GitHub fails the start.
TimeoutStartSec=60s
Environment=GITHUB_API_URL=https://api.github.com
Environment=APP_ID=4728578
Environment=APP_KEY=/home/nish/.config/fleet-worker/nishfleet-worker.private-key.pem
Environment=MINT=/home/nish/.local/share/github-app-token/mint.mjs
Environment='TOKEN_PERMISSIONS={"organization_self_hosted_runners":"write"}'
# Read before each command, so it is the file the step below wrote; absent until then.
EnvironmentFile=-/run/fleet-runner-jit-%i.env
ExecStartPre=/usr/bin/rm -rf /var/lib/fleet-runner/%i/_work /var/lib/fleet-runner/%i/.runner /var/lib/fleet-runner/%i/.credentials /var/lib/fleet-runner/%i/.credentials_rsaparams
ExecStartPre=+/bin/bash -c 'set -euo pipefail; umask 077; \
  export N=netcup-agent-%i G=3 L1=self-hosted L2=agent; \
  api="$$GITHUB_API_URL/orgs/Nishfleet/actions/runners"; \
  tok=$$(timeout 30 /usr/sbin/runuser -u nish -- /opt/node-v22.23.3/bin/node "$$MINT"); \
  c() { printf "Authorization: Bearer %%s\\n" "$$tok" | curl -fsS --connect-timeout 10 --max-time 20 -H @- -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "$$@"; }; \
  ids=$$(c "$$api?per_page=100&name=$$N" | jq -r ".runners[] | select(.name == env.N) | .id"); \
  for id in $$ids; do c -X DELETE "$$api/$$id"; done; \
  jit=$$(c -X POST --data "$$(jq -nc "{name: env.N, runner_group_id: (env.G | tonumber), labels: [env.L1, env.L2]}")" "$$api/generate-jitconfig" | jq -er .encoded_jit_config); \
  printf "ACTIONS_RUNNER_INPUT_JITCONFIG=%%s\\n" "$$jit" > /run/fleet-runner-jit-%i.env.new; \
  mv -f /run/fleet-runner-jit-%i.env.new /run/fleet-runner-jit-%i.env'
# The config is single use: it does not stay in /run after the runner stops.
ExecStopPost=+/usr/bin/rm -f /run/fleet-runner-jit-%i.env /run/fleet-runner-jit-%i.env.new
