# The pilot for the home row of docs/design/ephemeral-runners.md ("Where the reset
# happens", fleet-ops#11959): runner 22 gets a private home that is thrown away when the
# unit stops, so a job cannot leave a tool for the next job. A drop-in for this one
# instance, not the shared template, so no other runner restarts.
# systemd.exec(5): TemporaryFileSystem=, BindReadOnlyPaths=, BindPaths=, RuntimeDirectory=.
# https://docs.github.com/en/actions/reference/security/secure-use#hardening-for-self-hosted-runners
[Service]
# A tmpfs over the home, root-owned and not writable by the job. Only what the job needs
# comes back, read-only: the runner install, pi's model file and settings, and the key
# files. The runner's own _work and _diag stay read-write.
TemporaryFileSystem=/var/lib/fleet-runner:mode=0755
BindReadOnlyPaths=/var/lib/fleet-runner/22
BindReadOnlyPaths=/var/lib/fleet-runner/.pi
BindReadOnlyPaths=/var/lib/fleet-runner/.config
BindPaths=/var/lib/fleet-runner/22/_work
BindPaths=/var/lib/fleet-runner/22/_diag
# pi and the check tools live outside the home, installed by tasks/runners.yml into the
# root-owned folder below, so no bind into the job-writable home is needed and pi's
# launcher keeps its relative symlink into its package folder. The pinned Node is bound
# read-only: its bin holds npm and npx, and npm there is a script that runs the node
# beside it.
BindReadOnlyPaths=/opt/node-v22.23.3
# The one writable place besides those, removed when the unit stops. Caches and pi's
# session files go here (pi docs/environment-variables.md: PI_CODING_AGENT_SESSION_DIR
# overrides where sessions are written; the default is under ~/.pi, which is read-only).
RuntimeDirectory=fleet-runner-22
Environment=XDG_CACHE_HOME=/run/fleet-runner-22
Environment=npm_config_cache=/run/fleet-runner-22/npm
Environment=PI_CODING_AGENT_SESSION_DIR=/run/fleet-runner-22/pi-sessions
# Every folder on PATH is root-owned and read-only to the job: the pinned tools folder
# tasks/runners.yml installs (a Python venv, the vendor binaries and pi beside it) and
# the pinned Node's bin. The runner reads PATH from the runner directory's .path too,
# which tasks/runners.yml sets to the same value for this runner.
Environment=PATH=/opt/fleet-pilot-tools/venv/bin:/opt/fleet-pilot-tools/bin:/opt/node-v22.23.3/bin:/usr/local/bin:/usr/bin:/bin
