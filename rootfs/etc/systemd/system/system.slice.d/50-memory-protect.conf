# Protect the system services' working set (sshd, tailscaled, the runner
# listeners' parents, journald, podman) from agent.slice on the 32G host.
# Measured 2026-10-05 18:30 IST: system.slice anon 2154M, so 3G covers it
# with headroom. memory_recursiveprot is on, so the kernel reclaims from
# unprotected slices (agent.slice) first. Delete this file and daemon-reload
# to switch it off.
[Slice]
MemoryLow=3G
