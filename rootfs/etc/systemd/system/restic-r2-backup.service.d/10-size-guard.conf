# Size guard for restic backup
# Fails the unit (exit 78) when data_added exceeds 2 GiB (2147483648 bytes).
# The guard runs restic backup --json, captures the summary line, extracts
# data_added, and compares it against the 2 GiB threshold.
[Service]
# Override ExecStart to add the size guard. The original ExecStart is replaced.
# We run restic backup --json, tee the output to a temp file for the heartbeat,
# then extract data_added from the summary and compare.
ExecStart=
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /bin/bash -c '\
  set -euo pipefail; \
  output=$(/usr/bin/restic backup --files-from=/etc/restic/include.txt --exclude-file=/etc/restic/exclude.txt --exclude-caches --host netcup-rs2000 --tag netcup-rs2000 --json 2>&1); \
  echo "$output" | grep -E '"'"'^.*$'"'"' >/dev/null; \
  summary=$(echo "$output" | grep '"'"'message_type":"summary'"'"' | tail -1); \
  if [ -z "$summary" ]; then \
    echo "ERROR: No summary in restic output" >&2; \
    exit 1; \
  fi; \
  data_added=$(echo "$summary" | sed -n '"'"'s/.*"data_added":\([0-9]*\).*/\1/p'"'"'); \
  if [ -z "$data_added" ]; then \
    echo "ERROR: Could not parse data_added from summary" >&2; \
    exit 1; \
  fi; \
  if [ "$data_added" -gt 2147483648 ]; then \
    echo "SIZE GUARD TRIGGERED: data_added=$data_added bytes (> 2 GiB)" >&2; \
    exit 78; \
  fi; \
  echo "$output"; \
  /usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null ${HC_BACKUP_URL} \
'