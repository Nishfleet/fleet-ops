# Size guard for restic backup
# Fails the unit (exit 78) when data_added exceeds SIZE_GUARD_MAX_BYTES (default 2 GiB).
# The guard runs restic backup --json, captures the summary line, extracts
# data_added, and compares it against the threshold.
[Service]
# Override ExecStart to add the size guard. The original ExecStart is replaced.
# SIZE_GUARD_MAX_BYTES can be set to 0 to disable the guard.
ExecStart=
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /bin/bash -c "set -euo pipefail; max_bytes=\${SIZE_GUARD_MAX_BYTES:-2147483648}; if [ \"\$max_bytes\" -eq 0 ]; then echo \"Size guard disabled via SIZE_GUARD_MAX_BYTES=0\"; /usr/bin/restic backup --files-from=/etc/restic/include.txt --exclude-file=/etc/restic/exclude.txt --exclude-caches --host netcup-rs2000 --tag netcup-rs2000 --json; /usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null \${HC_BACKUP_URL}; exit 0; fi; output=$(/usr/bin/restic backup --files-from=/etc/restic/include.txt --exclude-file=/etc/restic/exclude.txt --exclude-caches --host netcup-rs2000 --tag netcup-rs2000 --json 2>&1); summary=$(echo \"\$output\" | grep 'message_type\":\"summary' | tail -1); if [ -z \"\$summary\" ]; then echo \"ERROR: No summary in restic output\" >&2; exit 1; fi; data_added=$(echo \"\$summary\" | sed -n 's/.*\"data_added\":\\([0-9]*\\).*/\\1/p'); if [ -z \"\$data_added\" ]; then echo \"ERROR: Could not parse data_added from summary\" >&2; exit 1; fi; if [ \"\$data_added\" -gt \"\$max_bytes\" ]; then echo \"SIZE GUARD TRIGGERED: data_added=\$data_added bytes (> \$max_bytes)\" >&2; exit 78; fi; echo \"\$output\"; /usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null \${HC_BACKUP_URL}"