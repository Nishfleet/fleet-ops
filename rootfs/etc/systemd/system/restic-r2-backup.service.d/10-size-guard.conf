# Size guard for restic backup.
# Fails the unit (exit 78) when the dry-run says the backup would add
# more than SIZE_GUARD_MAX_BYTES (default 2 GiB). 0 disables.
# Pre-flight: restic backup --dry-run --json computes data_added without
# uploading, so nothing new ever reaches the live bucket or the weekly
# locked-copy target.
# NOTE: ExecStart is overridden so the unit actually reads the tracked
# include list (the box-only unit still points at the old exclude file).
# Edit config/restic/include.txt to change paths, not the unit line.
[Service]
Environment=SIZE_GUARD_MAX_BYTES=2147483648
ExecStart=
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /usr/bin/restic backup --files-from=/etc/restic/include.txt --exclude-file=/etc/restic/exclude.txt --exclude-caches --host netcup-rs2000 --tag netcup-rs2000
ExecStartPre=/bin/bash -o pipefail -c "/usr/bin/restic backup --dry-run --json --files-from=/etc/restic/include.txt --exclude-file=/etc/restic/exclude.txt --exclude-caches --host netcup-rs2000 --tag netcup-rs2000 | /usr/bin/jq -s --arg t summary --arg msg size-guard --argjson max ${SIZE_GUARD_MAX_BYTES} 'map(select(.message_type == $$t)) | if $$max == 0 or .[-1].data_added <= $$max then empty else ($$msg | halt_error(78)) end'"
