# Size guard for the restic backup (fleet-ops#9360). The check is its own unit,
# restic-r2-size-guard.service: a dry run that fails (exit 78) when data_added
# is over 2 GiB or the snapshot's restored size is over 10 GiB. Requires= makes
# this unit fail with it, before any upload. After= runs the guard first.
# The ExecStart override makes the unit read the tracked include list; the
# box-only unit still points at the old exclude file. Edit
# config/restic/include.txt to change paths, not the unit line.
[Unit]
Requires=restic-r2-size-guard.service
After=restic-r2-size-guard.service

[Service]
ExecStart=
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /usr/bin/restic backup --files-from=/etc/restic/include.txt --exclude-file=/etc/restic/exclude.txt --exclude-caches --host netcup-rs2000 --tag netcup-rs2000
