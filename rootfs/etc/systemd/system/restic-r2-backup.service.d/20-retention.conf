# One retention policy for the backup and the weekly maintenance unit, read
# from /etc/restic/retention.env (config/restic/retention.env). --group-by
# host,tags is what makes it age out old snapshots: restic groups by host and
# path set by default, and every change to include.txt started a new group
# that the policy never reached (fleet-ops#9360 follow-up). The box-only unit
# carried its own forget line without --group-by; this ExecStartPost replaces
# it and keeps the heartbeat ping. The - prefix stays: a failed prune must not
# stop the locked copy of a good backup (the unit still fails visibly).
[Service]
EnvironmentFile=/etc/restic/retention.env
ExecStartPost=
ExecStartPost=-/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /usr/bin/restic forget $RESTIC_FORGET_ARGS
ExecStartPost=/usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null ${HC_BACKUP_URL}
