# Start the locked copy when, and only when, this unit finishes successfully.
# OnSuccess= fires on the inactive transition of a run that did not fail, so a
# tripped size guard or a failed backup never reaches the locked bucket, and
# the copy no longer pulls a second backup in the way Requires= did
# (fleet-ops#9360 follow-up). Needs systemd 249 or later.
[Unit]
OnSuccess=restic-r2-locked-copy.service
