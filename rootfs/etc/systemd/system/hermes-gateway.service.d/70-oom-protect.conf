# The Telegram alert bot must outlive a runaway job. On 2026-10-09 the kernel
# OOM killer picked hermes (score adjust 0) while a 15G scan under Remote
# Control (adjust -900) was left alone. -500 puts hermes among the protected
# services: the kernel now prefers any unprotected process, such as a runner
# job at +500, before it. Restart=always still brings it back if it dies.
# Only the system manager may lower the value (it applies before the drop to
# user nish); a user-manager unit is clamped to the manager's own 100.
#
# Switch off: delete this file and `systemctl daemon-reload`.
[Service]
OOMScoreAdjust=-500
