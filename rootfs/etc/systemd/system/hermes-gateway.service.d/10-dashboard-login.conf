# fleet-ops#11900: with dashboard.public_url set the dashboard login gate is
# mandatory, so the installer-written gateway unit needs the same login
# settings file hermes-serve.service loads, or it will not start. This file
# replaces the hand-placed one of the same name. Gateway only: the other Hermes
# units must not get these settings. `-`: a missing file does not block the
# start (systemd.exec(5), EnvironmentFile=).
[Service]
EnvironmentFile=-/home/nish/.hermes/secrets.env
