# `hermes gateway run` exits 1 on SIGTERM when no restart was requested.
# This unit is Restart=always, so an unexpected exit still comes back, and
# systemd does not restart an explicit stop. Exit 1 must count as success
# or that stop is recorded failed and pages SystemUnitFailed (fleet-ops#8758).
# 75 stays: it is the service-restart code (RestartForceExitStatus=75).
#
# Installed by fleet-host-config.service (ansible/host.yml) on every merge to main.
[Service]
SuccessExitStatus=1 75
