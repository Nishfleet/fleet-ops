# The restore test also restores the LiteLLM Postgres dump that the backup
# unit writes (pg_dump -Fc, agent-state/backups/litellm.dump) and fails when
# pg_restore cannot read it or lists no table data. Before this the test only
# proved config files, so a dump that was missing or unreadable in the
# snapshot went unnoticed. Extra ExecStart lines run after the base unit's
# own, so the existing checks and the ExecStartPost heartbeat are unchanged.
# The paths use a home/* pattern: restic matches it as a pattern and bash
# expands it as a glob (one match; none or two makes pg_restore fail).
# pg_restore --list reads only the table of contents, not the data.
# Switch off: delete this file and `systemctl daemon-reload`.
[Service]
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /usr/bin/restic restore latest --host netcup-rs2000 --target /var/tmp/restore --include "/home/*/workspaces/agent-state/backups/litellm.dump" --verify
ExecStart=/usr/bin/bash -c 'set -o pipefail; /usr/bin/pg_restore --list /var/tmp/restore/home/*/workspaces/agent-state/backups/litellm.dump | /usr/bin/grep -c "TABLE DATA"'
