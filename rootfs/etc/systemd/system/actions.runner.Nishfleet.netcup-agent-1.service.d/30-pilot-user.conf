# Pilot (fleet-ops#10451): runner 1 runs as the no-sudo service user fleet-runner, in its own
# directory and HOME, under the same jail as the other runners (10-agent.conf, 20-lockdown.conf).
# The other runners and the Pi units stay on nish until this one passes a real job.
# ansible/host.yml creates the user and copies the registration once. Switch off: delete this
# file, and the unit goes back to User=nish and the nish runner directory (left in place).
[Unit]
After=
Wants=
After=network-online.target
Wants=network-online.target

[Service]
User=fleet-runner
Group=fleet-runner
WorkingDirectory=/var/lib/fleet-runner/1
Environment=HOME=/var/lib/fleet-runner
InaccessiblePaths=-/run/user/1000
# The nish-only runtime dirs that 10-agent.conf makes do not exist for this uid.
ExecStartPre=
ExecStart=
ExecStart=/var/lib/fleet-runner/1/runsvc.sh
