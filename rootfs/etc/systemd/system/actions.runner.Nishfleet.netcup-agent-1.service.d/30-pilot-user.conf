# Pilot (fleet-ops#10451): runner 1 runs as the no-sudo service user fleet-runner, in its own
# directory and HOME, under the same jail as the other runners (10-agent.conf, 20-lockdown.conf).
# The other runners and the Pi units stay on nish until this one passes a real job.
# ansible/host.yml creates the user and copies the registration once. Switch off: delete this
# file, and the unit goes back to User=nish and the nish runner directory (left in place).
[Unit]
After=
Wants=
After=network-online.target
Wants=network-online.target

[Service]
User=fleet-runner
Group=fleet-runner
WorkingDirectory=/var/lib/fleet-runner/1
Environment=HOME=/var/lib/fleet-runner
InaccessiblePaths=-/run/user/1000
# The worker App key, handed over read-only by systemd (LoadCredential): this uid has no copy under
# its HOME, and agent.yml reads $CREDENTIALS_DIRECTORY first (fleet-ops#10153).
LoadCredential=nishfleet-worker.private-key.pem:/home/nish/.config/fleet-worker/nishfleet-worker.private-key.pem
# The nish-only runtime dirs under /run/user/1000 do not exist for this uid, and the
# InaccessiblePaths= below hides the whole directory, so a shared pre-start step under it
# would fail inside this unit's mount namespace. An empty assignment clears the shared
# lines; 30 sorts after 10, so the reset wins.
ExecStartPre=
ExecStart=
ExecStart=/var/lib/fleet-runner/1/runsvc.sh
