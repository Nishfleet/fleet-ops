# Bind SSH to the tailnet only, so a rebuild cannot put it back on the public
# interfaces (fleet-ops#10541). An empty ListenStream= clears the wildcard
# binds Ubuntu ships (0.0.0.0:22 and [::]:22) before the tailnet addresses are
# added. ansible/host.yml installs this file and restarts ssh.socket when it
# changes, because a socket picks up new addresses only on restart.
[Socket]
ListenStream=
ListenStream=100.108.184.97:22
ListenStream=[fd7a:115c:a1e0::d23a:b862]:22
