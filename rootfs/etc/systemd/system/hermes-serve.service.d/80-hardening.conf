# Extra sandboxing for the Tailscale-only Hermes backend.
# The generic hermes-.service.d/sandbox.conf already sets NoNewPrivileges,
# ProtectSystem=strict, ProtectHome=read-only, the kernel Protect* switches,
# RestrictSUIDSGID, LockPersonality, RestrictRealtime and
# SystemCallArchitectures; this file adds only what that one lacks.
# Not set on purpose: RestrictNamespaces and SystemCallFilter stop Chrome (the
# tools Hermes launches) from creating its sandbox zygote, as tested on
# hermes-gateway 2026-10-22.
# Both hermes units run as User=nish (not root), so the empty capability set only
# removes what a non-root service never had. sandbox.conf is in this repo at
# rootfs/etc/systemd/system/hermes-.service.d/sandbox.conf.
# RestrictAddressFamilies is inherited by every child process: one that needs
# AF_PACKET or AF_VSOCK fails with EAFNOSUPPORT; add the family here.
# Roll back: delete this file, `systemctl daemon-reload`, restart hermes-serve.
[Service]
ProtectHostname=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
