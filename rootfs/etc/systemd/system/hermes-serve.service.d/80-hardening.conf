# Extra sandboxing for the Tailscale-only Hermes backend. The generic
# hermes-.service.d/sandbox.conf already sets NoNewPrivileges, ProtectSystem=strict,
# ProtectHome=read-only, the kernel Protect* switches, RestrictSUIDSGID,
# LockPersonality, RestrictRealtime and SystemCallArchitectures; this file adds
# only what that one lacks (sandbox.conf sorts later, so it wins any overlap).
# Roll back: delete this file, `systemctl daemon-reload`, restart hermes-serve.
[Service]
RestrictNamespaces=yes
ProtectHostname=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
