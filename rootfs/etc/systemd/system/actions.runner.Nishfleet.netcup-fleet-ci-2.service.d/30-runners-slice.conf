# Canary for the runner egress rule: fleet-ci-2 alone moves into runners.slice
# (see runners.slice and nftables-runners/runners.nft). fleet-ci-1, fleet-ci-3
# and the vault runner follow in a later PR once this one is proven.
# Slice= is read when the unit starts, so the runner joins the slice only at its
# next restart (the rollout restarts it when idle); until then the rule does not
# cover it. Check: systemctl show -p Slice <unit> reads runners.slice.
# Wants= and After= nftables-runners.service: the runner starts after the rule
# is loaded (a failed rule unit pages but does not keep the runner offline).
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Unit]
Wants=nftables-runners.service
After=nftables-runners.service

[Service]
Slice=runners.slice
