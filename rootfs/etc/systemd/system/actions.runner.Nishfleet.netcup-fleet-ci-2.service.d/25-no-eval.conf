# fleet-ci-1/2 do not run the agent eval (fleet-ci-3 does): hide its worker key, split and podman socket (2026-10-22, fleet-ops#9983).
#
# Hide the home directory at the directory level so files rewritten in place stay
# hidden. A file-level InaccessiblePaths= mount is dropped when the file is
# replaced by rename on the host (a rename swaps the path), so the file became
# readable again. The only job on these runners, deploy-box, uses /usr/bin/systemctl
# and journalctl against /run/user/1000 and reads nothing under /home/nish except
# its own runner directory (checked against _diag/Worker logs and deploy-box.yml).
# So /home/nish is an empty read-only tmpfs with this runner's own directory
# bound back in (the runner writes _work, _diag and _tool there). The /home/nish
# entries in 20-lockdown.conf stay listed so runner-probe still checks them; under
# the tmpfs they do not exist, so they pass. Only fleet-ci-3 differs (30-eval.conf).
# Takes effect when the runner restarts.
# Rollback: delete the two lines below, `systemctl daemon-reload`, restart the runner.
[Service]
InaccessiblePaths=-/home/nish/.config/fleet-ops/litellm-keys/worker -/home/nish/.local/share/drive -/run/podman-eval
TemporaryFileSystem=/home/nish:ro
BindPaths=/home/nish/.local/share/fleet-ci-runner/2
