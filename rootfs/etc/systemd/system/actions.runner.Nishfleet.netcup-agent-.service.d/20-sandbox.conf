[Service]
# Sandbox the fleet job runners (fleet-ops#9503). Same hermes pattern
# (hermes-.service.d/sandbox.conf), home-wide so an arbitrary job still writes.
#
# InaccessiblePaths=/run/docker.sock masks the socket in the unit mount
# namespace. SupplementaryGroups= cannot drop docker: it only extends the
# groups in /etc/group (man systemd.exec). The host group step, and its
# rollback, are in docs/RUNBOOK.md under "Worker sandbox (fleet-ops#9503)".
#
# Staged, not live: ansible/host.yml copies this file and reloads systemd.
# The lines take effect at the next runner restart. Rollback: revert this
# file, re-run host-config, restart the runner.
PrivateTmp=true
ProtectSystem=strict
ReadWritePaths=-/home/nish
ReadWritePaths=-/run/user/1000
InaccessiblePaths=/run/docker.sock
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectKernelLogs=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
SystemCallArchitectures=native
