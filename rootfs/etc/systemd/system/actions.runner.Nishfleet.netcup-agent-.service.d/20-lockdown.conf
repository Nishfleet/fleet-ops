# Hide credential paths and the docker socket from CI jobs on the agent runners
# (2026-10-22, fleet-ops#9983). A `-` before a path means a missing path never
# stops the runner from starting. The paths here are the ones no agent job reads;
# the table is in the PR that added this file. runner-probe (the first step of
# every agent job) fails the job if one of them is readable. Takes effect when
# the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
# The docker socket and the user systemd bus, with the user token and gpg dirs.
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/podman-eval
InaccessiblePaths=-/run/user/1000/bus -/run/user/1000/systemd -/run/user/1000/podman
InaccessiblePaths=-/run/user/1000/gnupg -/run/user/1000/fleet-worker-github-token -/run/user/1000/fleet-grafana-github-token
# Credential stores no agent job reads.
InaccessiblePaths=-/home/nish/.ssh -/home/nish/.gnupg -/home/nish/.config/cloudflare -/home/nish/.cloudflare -/home/nish/.wrangler
InaccessiblePaths=-/home/nish/.config/rclone -/home/nish/.codex -/home/nish/.netrc -/home/nish/.git-credentials -/home/nish/.aws -/home/nish/.docker
InaccessiblePaths=-/home/nish/.oci -/home/nish/.minio -/home/nish/.juicefs -/home/nish/.config/tailscale -/home/nish/.config/glab-cli -/home/nish/.hermes
InaccessiblePaths=-/etc/restic
# The other Claude logins and the login backups. The runner's own seats stay visible:
# ~/.claude-vps (seat a) and ~/.claude/.credentials.json (seat b).
InaccessiblePaths=-/home/nish/.claude-max -/home/nish/.claude-nish -/home/nish/.claude-team -/home/nish/.claude-telegram
InaccessiblePaths=-/home/nish/.claude-auth-backup-max-2026-10-10 -/home/nish/.local/share/claude-seat-backup
InaccessiblePaths=-/home/nish/.claude/.credentials.json.bak-alert-repair-20260909T055545Z -/home/nish/.claude/.credentials.json.bak-issue-4670-20260909T122627 -/home/nish/.claude/.credentials.json.blanked.20260821T233543
# Parts of ~/.config/fleet-ops no agent job reads (seats/, litellm-master-key.env and litellm-proxy.yaml stay visible).
InaccessiblePaths=-/home/nish/.config/fleet-ops/litellm-keys -/home/nish/.config/fleet-ops/litellm-virtual-keys.env -/home/nish/.config/fleet-ops/0509-telemetry-deploy-key
InaccessiblePaths=-/home/nish/.config/fleet-ops/gh-webhook.secret -/home/nish/.config/fleet-ops/github-issues.env -/home/nish/.config/fleet-ops/grafana-admin-password
InaccessiblePaths=-/home/nish/.config/fleet-ops/keystone-hc.env -/home/nish/.config/fleet-ops/telegram.env
