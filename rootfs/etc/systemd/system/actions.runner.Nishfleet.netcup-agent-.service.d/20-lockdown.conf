# Allowlist for CI jobs on the agent runners (fleet-ops#9983, #10453). The home
# directory is an empty writable tmpfs and only the paths bound back in below are
# visible, so the hide list this file replaced is gone: a path that is not bound
# here does not exist for a job. A `-` before a path means a missing path never stops
# the runner from starting. runner-probe (the first step of every agent job) fails the
# job if a path this unit hides is readable, or if a path it covers with a mount below
# is not covered. tests/test_runner_jail_start_state.py fails the PR if a drop-in names
# a path under home again. Takes effect when the runner restarts. The deploy installs
# this file and reloads the daemon, and it restarts no runner: a restart waits 5 min
# for a job and then kills it (fleet-ops#10898).
# Rollout: a change reaches the pool at each runner's next start. The nightly update
# stops and starts every runner after it drains them, which is where the whole pool
# picks this file up, and that run reads the read-only clone bind back on an agent
# runner it restarted (fleet-ops#10866). Runner 1 is the pilot, and the deploy leaves
# it stopped. An OOM kill restarts a runner on its own, so a restart at any moment is
# a case the fleet already meets.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
# The docker sockets, the eval engine's /run/dockerd-eval and the user systemd
# bus, with the user gpg dir. The two token dirs are covered by a mount further down.
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/podman-eval -/run/dockerd-eval
InaccessiblePaths=-/run/user/1000/bus -/run/user/1000/systemd -/run/user/1000/podman
InaccessiblePaths=-/run/user/1000/gnupg
# Outside home, so the home tmpfs does not cover it: the backup repo config and password path.
InaccessiblePaths=-/etc/restic
# Nothing inside home is hidden by name. The seat config dir is bound whole, and the
# blanked zero-byte login stubs that sit in it are root-owned mode 000, so the runner
# user cannot read them and no line here has to name a credential path to keep them
# out of a job (fleet-ops#10453).
# Writable, small and gone at restart: the job jail (agent.yml bwrap) mounts tmpfs on home paths
# that are not bound here, and a read-only home would refuse the mkdir.
TemporaryFileSystem=/home/nish:mode=0700,uid=1000,gid=1000,size=512M
# The two runtime dirs the user token mints write their App tokens into. A mount
# covers the path, so the hide no longer depends on the directory inode that
# exists when this unit starts: a directory the mint recreates in its place
# stays covered and a job cannot read the new tokens (fleet-ops#10886).
# InaccessiblePaths= masks the inode, which is why these two paths are not on
# that list: at one path systemd applies the more restrictive of two entries
# and drops the other, InaccessiblePaths= sorts first, so a path on both lists
# is masked and the mount never happens.
# systemd makes the mount point itself when the path is absent at start, so no
# pre-start mkdir has to exist first, and a mount that cannot be made stops
# this unit instead of leaving a job readable. A pool that hides
# /run/user/1000 whole (netcup-agent-1, fleet-ci-3) already covers these paths
# and drops the nested mounts.
TemporaryFileSystem=/run/user/1000/fleet-worker-github-token
TemporaryFileSystem=/run/user/1000/fleet-grafana-github-token
# Writable: the runner directories (_work, _diag, _tool), the job worktrees and mirrors,
# the engines' state, and the package caches.
BindPaths=/home/nish/.local/share/agent-runner
BindPaths=-/home/nish/workspaces/agent-worktrees -/home/nish/workspaces/.mirrors
BindPaths=-/home/nish/.claude -/home/nish/.claude-vps -/home/nish/.claude.json -/home/nish/.pi
BindPaths=-/home/nish/.devin -/home/nish/.cursor -/home/nish/.config/devin -/home/nish/.config/cursor -/home/nish/.config/opencode
BindPaths=-/home/nish/.local/share/claude -/home/nish/.local/share/devin -/home/nish/.local/share/cursor-agent -/home/nish/.local/share/cognition -/home/nish/.local/share/opencode
BindPaths=-/home/nish/.npm -/home/nish/.cache -/home/nish/.local/share/uv -/home/nish/.local/share/pipx -/home/nish/.local/share/fnm
# Read-only: tools, the deploy clone the prompts come from, and the fleet config the
# jobs read. The seats dir, the router key and the App key dir are credentials, and
# each is bound because a job reads it before the engine jail starts: the Gate and the
# arm job mint an App token from the key dir, the claude lane reads its seat token file
# and the daily job reads the router key. agent.yml's bwrap jail hides the key dir and
# the seats dir from every jailed engine, so the runner-level bind serves the unjailed
# steps alone.
BindReadOnlyPaths=-/home/nish/.local/bin -/home/nish/.local/venvs -/home/nish/.local/lib -/home/nish/.nvm -/home/nish/.cargo -/home/nish/.rustup -/home/nish/.bun
BindReadOnlyPaths=-/home/nish/.gitconfig -/home/nish/AGENTS.md -/home/nish/workspaces/tooling/fleet-ops-deploy-clone
BindReadOnlyPaths=-/home/nish/.config/fleet-ops/seats -/home/nish/.config/fleet-ops/litellm-master-key.env -/home/nish/.config/fleet-ops/litellm-proxy.yaml -/home/nish/.config/fleet-ops/intake-repos.json
BindReadOnlyPaths=-/home/nish/.config/gh -/home/nish/.config/fleet-worker -/home/nish/.config/git -/home/nish/.config/uv
