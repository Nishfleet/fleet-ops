# Allowlist for CI jobs on the agent runners (fleet-ops#9983, #10453). The home
# directory is an empty writable tmpfs and only the paths bound back in below are
# visible, so the hide list this file replaced is gone: a path that is not bound
# here does not exist for a job. A `-` before a path means a missing path never stops
# the runner from starting. runner-probe (the first step of every agent job) fails the
# job if a path this unit hides is readable, or if a path it covers with a mount below
# is not covered. tests/test_runner_jail_start_state.py fails the PR if a drop-in names
# a path under home again. Takes effect when the runner restarts. The deploy installs
# this file and reloads the daemon, and it restarts no runner: a restart waits 5 min
# for a job and then kills it (fleet-ops#10898).
# Rollout: a change reaches the pool at each runner's next start. The nightly update
# stops and starts every runner after it drains them, which is where the whole pool
# picks this file up, and that run reads the read-only clone bind back on an agent
# runner it restarted (fleet-ops#10866). Runner 1 is the pilot, and the deploy leaves
# it stopped. An OOM kill restarts a runner on its own, so a restart at any moment is
# a case the fleet already meets.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
# The docker sockets, the eval engine's /run/dockerd-eval and the user systemd
# bus, with the user gpg dir. The two token dirs are covered by a mount further down.
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/podman-eval -/run/dockerd-eval
InaccessiblePaths=-/run/user/1000/bus -/run/user/1000/systemd -/run/user/1000/podman
InaccessiblePaths=-/run/user/1000/gnupg
# Outside home, so the home tmpfs does not cover it: the backup repo config and password path.
InaccessiblePaths=-/etc/restic
# Nothing inside home is hidden by name. The seat config dir is bound whole, and the
# blanked zero-byte login stubs that sit in it are root-owned mode 000, so the runner
# user cannot read them and no line here has to name a credential path to keep them
# out of a job (fleet-ops#10453).
# Writable, small and gone at restart: the job jail (agent.yml bwrap) mounts tmpfs on home paths
# that are not bound here, and a read-only home would refuse the mkdir.
TemporaryFileSystem=/home/nish:mode=0700,uid=1000,gid=1000,size=512M
# An empty, read-only mount point, so the worker jail's --tmpfs over it can start: bwrap cannot create it under this read-only home (#10934).
TemporaryFileSystem=/home/nish/.config/cloudflare:ro
# The same for the gh login dir the worker jail masks: fleet-ops#10949 cut the bind that used to create it here, so every worker jail died at start with "Can't mkdir /home/nish/.config/gh: Permission denied" (fleet-ops#11097).
TemporaryFileSystem=/home/nish/.config/gh:ro
# The same for the App key's home dir the worker jail masks: fleet-ops#10957 cut the bind that created it here, and a masked path the unit does not create is a jail that dies at start with "Can't mkdir" (fleet-ops#11097).
TemporaryFileSystem=/home/nish/.config/fleet-worker:ro
# The two runtime dirs the user token mints write their App tokens into. A mount
# covers the path from the first moment of this unit's life: systemd makes the
# mount point and mounts it before the runner runs, so a directory the mint
# creates later is already covered. InaccessiblePaths= was applied once, against
# whatever directory existed then, and the pre-start mkdir that made these dirs
# ran after it, so the directory it made was never covered (fleet-ops#10886).
# Nothing may remove and recreate these dirs: a mount sits on the directory it
# was made on, so a replacement is as uncovered as a replaced mask (mount a
# tmpfs, then rm -rf and mkdir the directory from the host, and the unit reads
# the new contents). The mints keep them (RuntimeDirectoryPreserve=yes).
# Read-only: a job has nothing to write there, and a tmpfs without a size is
# half of RAM to the first process that fills it.
# InaccessiblePaths= masks the inode, which is why these two paths are not on
# that list: at one path systemd applies the more restrictive of two entries
# and drops the other, InaccessiblePaths= sorts first, so a path on both lists
# is masked and the mount never happens.
# A mount that cannot be made stops this unit instead of leaving a job readable.
# A pool that hides /run/user/1000 whole (netcup-agent-1, fleet-ci-3) already
# covers these paths and drops the nested mounts.
# An absent mount point is made by systemd itself, as root mode 0755, and the
# mints run as nish, so this line makes both dirs first. A "+" command runs with
# full privileges and skips the file system namespacing options
# (systemd.service(5), "Command lines"), so it writes the host path and not the
# tmpfs this unit mounts there; run under the unit's own User= it would change
# only that tmpfs and leave the host point root-owned. install -d also fixes a
# point an earlier start left with the wrong owner or mode.
ExecStartPre=+/usr/bin/install -d -o nish -g nish -m 0700 /run/user/1000/fleet-worker-github-token /run/user/1000/fleet-grafana-github-token
TemporaryFileSystem=/run/user/1000/fleet-worker-github-token:ro
TemporaryFileSystem=/run/user/1000/fleet-grafana-github-token:ro
# Writable: the runner directories (_work, _diag, _tool), the job worktrees and mirrors,
# the engines' state, and the package caches.
BindPaths=/home/nish/.local/share/agent-runner
BindPaths=-/home/nish/workspaces/agent-worktrees -/home/nish/workspaces/.mirrors
BindPaths=-/home/nish/.claude -/home/nish/.claude-vps -/home/nish/.claude.json -/home/nish/.pi
BindPaths=-/home/nish/.devin -/home/nish/.cursor -/home/nish/.config/devin -/home/nish/.config/cursor -/home/nish/.config/opencode
BindPaths=-/home/nish/.local/share/claude -/home/nish/.local/share/devin -/home/nish/.local/share/cursor-agent -/home/nish/.local/share/cognition -/home/nish/.local/share/opencode
BindPaths=-/home/nish/.npm -/home/nish/.cache -/home/nish/.local/share/uv -/home/nish/.local/share/pipx -/home/nish/.local/share/fnm
# Read-only: tools, the deploy clone the prompts come from, and the fleet config the
# jobs read. The seats dir and the router key are credentials, and each is bound because
# a job reads it before the engine jail starts: the claude lane reads its seat token file
# and the daily job reads the router key. The two other paths that used to sit on the
# seats line were repo files and not credentials, so both are cut (fleet-ops#10826):
# the proxy config is read from the deploy clone bound whole above, and no job reads
# the intake list at all (later-sweep.service reads the installed copy on the host,
# outside this jail). agent.yml's bwrap jail hides the seats dir from every jailed
# engine, so the runner-level bind serves the unjailed steps alone.
BindReadOnlyPaths=-/home/nish/.local/bin -/home/nish/.local/venvs -/home/nish/.local/lib -/home/nish/.nvm -/home/nish/.cargo -/home/nish/.rustup -/home/nish/.bun
BindReadOnlyPaths=-/home/nish/.gitconfig -/home/nish/AGENTS.md -/home/nish/workspaces/tooling/fleet-ops-deploy-clone
BindReadOnlyPaths=-/home/nish/.config/fleet-ops/seats -/home/nish/.config/fleet-ops/litellm-master-key.env
BindReadOnlyPaths=-/home/nish/.config/git -/home/nish/.config/uv
# The worker App key the Gate and the arm job mint a token from arrives as a systemd
# credential, so no job reads it through a home path any more (fleet-ops#10957): systemd
# hands each unit a copy at $CREDENTIALS_DIRECTORY/nishfleet-worker.private-key.pem, which
# agent.yml and agent-dispatch.yml already prefer over the home path. The file stays where
# it is; the pilot and the review runners load the same name from the same path.
LoadCredential=nishfleet-worker.private-key.pem:/home/nish/.config/fleet-worker/nishfleet-worker.private-key.pem
# The directive takes an ID and one path (systemd.exec: `LoadCredential=ID[:PATH]`) and has no `-`
# form that tolerates a missing file: a runner that cannot read this path does not start. The key is
# provisioned outside this repo, and #10968 loads the same path on three units already. systemd
# copies the file at unit start, not on every job, so a rotated key reaches a runner at its next
# restart.
# No gh login (fleet-ops#10949): every write a job makes is the worker App token minted from
# the App key above, so the runner user's own gh login is not a credential here, and no
# fooled session can use it as the owner's approval.
