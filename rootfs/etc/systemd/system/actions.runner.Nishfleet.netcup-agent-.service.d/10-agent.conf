[Service]
# No sudo inside a job (thread "fix everything like pro devs", 2026-10-03).
# NoNewPrivileges=yes stops setuid binaries, so `sudo` fails with "the no new
# privileges flag is set". A job that froze the box through sudo (the
# fleet-ops#9091 stall test, ~28 min) now gets an error instead. Root changes go
# through a reviewed PR to rootfs/ and ansible/host.yml. Takes effect when the
# runner restarts. Same uid as nish, so this stops accidents, not an attacker.
NoNewPrivileges=yes
Slice=agent.slice
MemoryHigh=3G
MemoryMax=6G
# Stop a job that is stalled on memory, not one that is merely busy (fleet-ops#9091).
# 2026-10-02: a drive job sat at 95% memory pressure under MemoryHigh for 3h20m after
# GitHub had failed it. MemoryMax was never reached, so nothing stopped it. oomd kills
# the unit only after 80% pressure for 60s (oomd.conf.d/99-fleet.conf), and
# Restart=on-failure brings the runner back. Proof: netcup-agent-1, killed 18:29:36 IST,
# listening again 18:30:08 IST.
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
# on-failure: an OOM kill (agent-26, 2026-09-24 23:53 IST) left the runner offline until restarted by hand.
Restart=on-failure
RestartSec=30s
# Cap vitest workers per job: 32 runners x default (cores-1) workers overran agent.slice (Nish, 2026-09-25).
Environment=VITEST_MAX_WORKERS=2
# Grok client version for Pi's xai-oauth seat; see config/environment.d/60-pi-xai-client-version.conf (fleet-ops#9219).
Environment=PI_XAI_CLIENT_VERSION=1.0.46
# Runner count N=24 (fleet-ops#8860, 2026-09-28 20:15-21:15 IST): mem full hour-avg 0.01292556089135715, peak swap 0.9999980926504577, avg load1 6.18175, 25 agent jobs/h (0509 14 + fleet-ops 11), node_vmstat_oom_kill 16->16, min 32 runner units active. Prior #8829 2026-09-28 15:00-16:00 IST at N=16: peak stall 0.6331187703703715 at 15:27 IST (time=1790589443), hour-avg stall 0.190523. Prior #8678 2026-09-25: 16 runners mem full 5.37% / 103 jobs/h vs 32 7.89% / 122 jobs/h.
