[Service]
# This is a prefix drop-in: it applies to every netcup-agent runner, whose unit
# files come from the runner's own svc.sh, not from this repo.
# The Devin CLI writes its run logs, the plugin lock and the rotated logs under
# ~/.local/share/devin itself, with the umask of whoever starts it. This unit
# started it at 0022, so a new log was group-readable (audit W1a,
# Nishfleet/nish-vault#30). Owner-only, the same as the listener's
# systemd/tincan-listen-devin-vps.service.d/20-umask.conf. A login shell start
# is covered by rootfs/etc/zsh/zprofile. Takes effect at the next runner
# restart.
UMask=0077
