[Service]
# This is a prefix drop-in: it applies to every netcup-agent runner, whose unit
# files come from the runner's own svc.sh, not from this repo.
# An agent CLI writes its run logs and rotated logs with the umask of whoever
# starts it. This unit started them at 0022, so a new log was group-readable
# (audit W1a, Nishfleet/nish-vault#30). Owner-only, the same as the retired
# Devin listener's drop-in did. A login shell start
# is covered by rootfs/etc/zsh/zprofile. Takes effect at the next runner
# restart.
UMask=0077
