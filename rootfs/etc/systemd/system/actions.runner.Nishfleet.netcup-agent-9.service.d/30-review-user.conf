# Review runners (fleet-ops#10950): runners 9 and 10 run as the no-sudo service user
# fleet-reviewer, in their own directory and HOME, under the same jail as the other
# runners (10-agent.conf, 20-lockdown.conf). They are the only units that run the review
# and arm jobs, so they are the only units that hold the reviewer App key.
# nish's home is mode 0700, so binding a 0600 file under it would hand this uid a path it
# cannot open: every credential arrives through LoadCredential= or EnvironmentFile=
# instead, and systemd reads each as root. ansible/host.yml creates the user and copies
# the registration once. Switch off: delete this file, and the unit goes back to
# User=nish and the nish runner directory (left in place).
[Unit]
After=
Wants=
After=network-online.target
Wants=network-online.target

[Service]
User=fleet-reviewer
Group=fleet-reviewer
WorkingDirectory=/var/lib/fleet-reviewer/9
Environment=HOME=/var/lib/fleet-reviewer
# Empty and writable: the one-year seat token below is the whole login, so claude reads
# and writes no rotating login (the claude lane's token path, fleet-ops#9696).
Environment=CLAUDE_CONFIG_DIR=/var/lib/fleet-reviewer/.claude
EnvironmentFile=/home/nish/.config/fleet-ops/seats/claude-seat-b.env
InaccessiblePaths=-/run/user/1000
# The reviewer App key, by bare name: systemd reads it from /etc/credstore, root-owned
# 0600, so no job on any runner can open it and no path to it is written here.
LoadCredential=nishfleet-reviewer.private-key.pem
# The worker App key the arm job mints from, and the router key the review job reads.
LoadCredential=nishfleet-worker.private-key.pem:/home/nish/.config/fleet-worker/nishfleet-worker.private-key.pem
LoadCredential=typesafe-jev.env:/home/nish/.config/fleet-ops/seats/typesafe-jev.env
# The review job reads these by path, and each is world-readable, so a read-only bind is
# enough and no copy is kept. claude in .local/bin is an absolute link into
# .local/share/claude, which this uid cannot enter, so bash skips it and runs the
# root-owned /usr/bin/claude instead: the review lane's CLI can lag nish's own.
BindReadOnlyPaths=-/home/nish/.local/bin:/var/lib/fleet-reviewer/.local/bin
BindReadOnlyPaths=-/home/nish/.local/lib:/var/lib/fleet-reviewer/.local/lib
BindReadOnlyPaths=-/home/nish/.nvm:/var/lib/fleet-reviewer/.nvm
BindReadOnlyPaths=-/home/nish/AGENTS.md:/var/lib/fleet-reviewer/AGENTS.md
BindReadOnlyPaths=-/home/nish/workspaces/tooling/fleet-ops-deploy-clone:/var/lib/fleet-reviewer/workspaces/tooling/fleet-ops-deploy-clone
# The nish-only runtime dirs that 10-agent.conf makes do not exist for this uid.
ExecStartPre=
ExecStart=
ExecStart=/var/lib/fleet-reviewer/9/runsvc.sh
