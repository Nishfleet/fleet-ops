[Service]
# Hardening for the Telegram-facing gateway. Hermes writes only its own home,
# gh auth, and its vault inbox drop; fleet work goes through GitHub issues.
# The InaccessiblePaths block at the end of this file hides the credential stores
# and the other agents' identities this gateway has no role in (fleet-ops#9981).
# It is a path list enforced by overmounts inside this unit's mount namespace, so
# it hides what is on the list when the unit starts. A credential written later
# into a directory that stays open (~/.config/tincan, ~/.hermes, ~/.cua, ~/.pi,
# ~/.config/gh), or a path nobody has added yet, is readable until the list
# grows; hidden_beyond_the_table in config/agent-locks.json keeps that list
# accounted for.
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=-/home/nish/.hermes -/home/nish/.local/state/hermes -/home/nish/.config/gh "-/home/nish/workspaces/tooling/nish-vault/00 Inbox/agent-drop/hermes"
Environment="npm_config_cache=/home/nish/.hermes/cache/npm"
# Nous Portal free-tier launch gate (fleet-ops#8766). Hermes' stock bootstrap
# (hermes_cli/anon_auth.py `guest_enabled`) only mints the anonymous
# `nous/welcome` identity while this is exactly "1", and that identity is what
# the `nous` fallback_providers rung resolves. This generic `hermes-` drop-in
# is shared by hermes-gateway.service and hermes-serve.service, so one line
# covers both. ~/.hermes/.env also carries it because Hermes re-reads that file
# per gateway turn; this line covers cron and cold starts that read .env later
# than the bootstrap.
Environment="HERMES_GUEST_ONBOARDING=1"
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictRealtime=true

# Deny by default (fleet-ops#9981). This gateway is the one agent Nish talks to
# in chat, and it starts MCP children (tincan, cua, chrome-devtools) inside this
# cgroup, so the list has to hide credentials without taking what one of them
# measured to read. Every entry carries `-`: a path that is not there yet must
# never stop the unit from starting (fleet-ops#10081).
# Kept visible, measured: ~/.hermes, ~/.local/state/hermes and ~/.config/gh (the
# ReadWritePaths above), ~/.config/tincan (strace of `tincan mcp` on 2026-10-25
# reads client.json there and appends a launch record to mcp-launches/),
# ~/.cua (cua mcp reaches the desk daemon over ~/.cua/cua.sock), ~/.local/bin and
# ~/.hermes/tools (PATH), and ~/.pi (~/.local/bin/pi symlinks into it and tincan
# carries 59 `.pi` references, so hiding it can break a working child).
# Roll back: delete this block, `systemctl daemon-reload`, restart hermes-gateway.
# The list is what the unit starts with, not a ceiling: see the header for what a
# credential written into an open directory afterwards means.
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/dockerd-eval
# The whole runtime dir, not the paths inside it: InaccessiblePaths makes a path
# and everything below it inaccessible, so a sub-entry can never resolve and is
# only a line that reads as if it does something. One entry covers the user bus,
# the minted worker and Grafana tokens, the podman socket and gnupg.
InaccessiblePaths=-/run/user/1000
# Credential stores no Hermes turn reads. The listener and runner lock
# (actions.runner.Nishfleet.netcup-agent-.service.d/20-lockdown.conf,
# fleet-ops#9983) is the source of this block; `~/.hermes` comes out of it and the
# fleet's own config goes in below.
InaccessiblePaths=-/home/nish/.ssh -/home/nish/.gnupg -/home/nish/.config/cloudflare -/home/nish/.cloudflare -/home/nish/.wrangler
InaccessiblePaths=-/home/nish/.config/rclone -/home/nish/.codex -/home/nish/.netrc -/home/nish/.git-credentials -/home/nish/.aws -/home/nish/.docker
InaccessiblePaths=-/home/nish/.oci -/home/nish/.minio -/home/nish/.juicefs -/home/nish/.config/tailscale -/home/nish/.config/glab-cli -/home/nish/.pgpass
InaccessiblePaths=-/etc/restic
InaccessiblePaths=-/home/nish/.npmrc -/home/nish/.yarnrc -/home/nish/.yarnrc.yml
InaccessiblePaths=-/home/nish/.config/containers -/home/nish/.config/systemd
# Every other engine's login, and the Claude seat backups. The runner's lock
# keeps ~/.claude-vps and ~/.claude/.credentials.json visible because a runner
# job runs Claude; this gateway's measured children are hermes-agent, a node
# plugin, tincan, cua and chrome-devtools, none of which reads them.
InaccessiblePaths=-/home/nish/.claude -/home/nish/.claude-vps -/home/nish/.claude-nish -/home/nish/.claude-max -/home/nish/.claude-team -/home/nish/.claude-telegram
InaccessiblePaths=-/home/nish/.claude.json -/home/nish/.claude-auth-backup-max-2026-10-10 -/home/nish/.local/share/claude-seat-backup
InaccessiblePaths=-/home/nish/.codeium -/home/nish/.cursor -/home/nish/.devin -/home/nish/.devin-server -/home/nish/.config/devin
InaccessiblePaths=-/home/nish/.commandcode -/home/nish/.config/opencode -/home/nish/.gemini -/home/nish/.coderabbit -/home/nish/.crush -/home/nish/.goose
InaccessiblePaths=-/home/nish/.serena -/home/nish/.zcode -/home/nish/.momentic -/home/nish/.executor -/home/nish/.mmx -/home/nish/.sigstore
InaccessiblePaths=-/home/nish/.beacon -/home/nish/.beacon-dl-2026-10-21 -/home/nish/.beacon-preinstall-backup-2026-10-21
# The fleet's own config: the LiteLLM master key and virtual keys, the seat files
# under seats/, the deploy keys, the worker App's private key, and the Grafana and
# Alertmanager passwords. Hermes has no role that reads any of it: fleet work goes
# through `gh`, which authenticates from ~/.config/gh.
InaccessiblePaths=-/home/nish/.config/fleet-ops -/home/nish/.config/fleet-worker -/home/nish/.config/0509-canary.env
# The self-hosted runners' registrations (.credentials) and the memory index.
InaccessiblePaths=-/home/nish/.local/share/agent-runner -/home/nish/.local/share/actions-runner -/home/nish/.local/share/fleet-ci-runner
InaccessiblePaths=-/home/nish/.local/share/cursor-agent -/home/nish/.local/share/devin -/home/nish/.local/share/leviathan
# The other agents' relay identities inside Hermes' own tincan config, and the
# issue-desk AgentMail key. hermes.json and hermes-webhook.secret stay readable:
# they are this agent's own relay identity, and tincan mcp reads hermes.json.
InaccessiblePaths=-/home/nish/.config/tincan/agentmail.key
InaccessiblePaths=-/home/nish/.config/tincan/claude-vps.json -/home/nish/.config/tincan/command-code.json -/home/nish/.config/tincan/cursor-vps.json
InaccessiblePaths=-/home/nish/.config/tincan/devin-vps.json -/home/nish/.config/tincan/fleet-worker.json -/home/nish/.config/tincan/issue-desk.json
InaccessiblePaths=-/home/nish/.config/tincan/opencode.json -/home/nish/.config/tincan/pi.json -/home/nish/.config/tincan/instinct.json.placeholder-20261021
