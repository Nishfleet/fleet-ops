[Service]
# Hardening for the Telegram-facing gateway. Hermes writes only its own home,
# gh auth, and its vault inbox drop; fleet work goes through GitHub issues.
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=read-only
# Beacon (local session capture, 2026-10-21) puts a shell hook in Hermes config.yaml.
# beacon-hooks appends to ~/.beacon/endpoint/logs/runtime.jsonl (flock on runtime.jsonl.lock)
# and keeps per-harness state in ~/.beacon/hermes/state.json (+ .lock). Under
# ProtectHome=read-only these are EROFS inside the gateway, so the hook records nothing.
# Only those FOUR FILES are bind-mounted writable, never their directories. A writable
# directory would let a prompt-injected gateway replace runtime.jsonl with a symlink to
# ~/.bashrc or ~/.claude/settings.json, and the unsandboxed writers (otelcol, the other
# agents' hooks) would then append into that target. With file binds the gateway cannot
# create, rename or unlink anything in those directories (EROFS/EBUSY); it can only append
# JSON lines to the log, so the worst case is forged records, never changed code or config.
# The rest of ~/.beacon (endpoint/hooks/beacon-hooks, config.json, otelcol.yaml) stays
# read-only here. Tested with bwrap: all-read-only fails, the four file binds record
# session-start, prompt-submit, pre-tool, post-tool and session-end.
# Caveat: a bind pins an inode. If otelcol rotates runtime.jsonl by rename (rotate_bytes
# 10 MB in otelcol.yaml), a gateway that started before the rotation keeps appending to the
# archive until it restarts; check ActiveEnterTimestamp against the last rotation
# (README fleet-map hermes-.service row). The files must exist: the - prefix skips a missing one.
# Beacon is local-only: otelcol.yaml binds the OTLP receivers to 127.0.0.1 and its one exporter
# writes runtime.jsonl (mode 0600, dir 0700): no network exporter. The only copy off this host is
# Syncthing's send-only beacon-server folder, which mirrors endpoint/logs to Nish's own MacBook.
# Hermes sessions include Telegram chats, so they reach that Mac too.
# Off switch: drop the four -/home/nish/.beacon entries AND remove the beacon-hooks entries
# from the hooks: block of ~/.hermes/config.yaml, or every turn logs EROFS.
ReadWritePaths=-/home/nish/.hermes -/home/nish/.local/state/hermes -/home/nish/.config/gh -/home/nish/.beacon/endpoint/logs/runtime.jsonl -/home/nish/.beacon/endpoint/logs/runtime.jsonl.lock -/home/nish/.beacon/hermes/state.json -/home/nish/.beacon/hermes/state.json.lock "-/home/nish/workspaces/tooling/nish-vault/00 Inbox/agent-drop/hermes"
Environment="npm_config_cache=/home/nish/.hermes/cache/npm"
# Nous Portal free-tier launch gate (fleet-ops#8766). Hermes' stock bootstrap
# (hermes_cli/anon_auth.py `guest_enabled`) only mints the anonymous
# `nous/welcome` identity while this is exactly "1", and that identity is what
# the `nous` fallback_providers rung resolves. This generic `hermes-` drop-in
# is shared by hermes-gateway.service and hermes-serve.service, so one line
# covers both. ~/.hermes/.env also carries it because Hermes re-reads that file
# per gateway turn; this line covers cron and cold starts that read .env later
# than the bootstrap.
Environment="HERMES_GUEST_ONBOARDING=1"
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictRealtime=true
