[Unit]
# The gh login is a one-hour App token that fleet-hermes-github-token.service
# writes to /run. Wants= and After= order a start behind the mint, but a mint
# that failed does not stop the Hermes start (systemd.unit, "Wants="): a mint
# that met a boot whose network was not up yet, or a GitHub outage, leaves the
# chat gateway running with gh unauthenticated, and the next successful mint
# fixes gh with no restart, because gh reads hosts.yml per call. Requires=
# was the first cut and the stuck-PR review (fleet-ops#11502, 7c7c8df) named
# what it priced: a start job failed on a dependency never fires Restart=
# alarms, so Hermes stayed down until a deploy or a hand start. The mint
# skips a token younger than 15 min, so this costs Hermes restarts no extra
# API calls, and the timer refreshes the token for as long as the unit runs.
# The deploy's prove-then-restart gate still refuses to restart Hermes on a
# login the proof has not passed.
Wants=fleet-hermes-github-token.service
After=fleet-hermes-github-token.service

[Service]
# Hardening for the Telegram-facing gateway. Hermes writes only its own home
# and its vault inbox drop; fleet work goes through GitHub issues. gh reads
# its login from its own GH_CONFIG_DIR, refreshed by the oneshot with a token
# scoped to the digest jobs' calls, and nish's admin login in ~/.config/gh is
# hidden (fleet-ops#10267). gh 2.103.3 with a hosts.yml token wrote nothing to
# its config dir across auth status, issue, pr, repo, search and api calls,
# also with the dir chmod 500 (fleet-ops#10184), so the token directory can
# stay read-only under ProtectHome=read-only and never needs a write grant
# here.
# Allow-style home (systemd.exec, ProtectHome=tmpfs, BindPaths=,
# BindReadOnlyPaths=): /home/nish is an empty tmpfs and only the paths below are
# bound back in, so a credential file that appears later anywhere else under
# home is hidden by default. Writable: Hermes' own home, its state dir and its
# vault inbox drop. Read-only: what Hermes and its MCP children (tincan, cua,
# chrome-devtools) were measured to open on 2026-11-05 from /proc of both
# units: ~/.local/bin (PATH and the MCP commands), the chrome-devtools-mcp
# package the ~/.local/bin link points into, ~/.cua (the desk socket), this
# agent's own tincan identity and its prompts, wake socket and launch log, the
# skills folder config.yaml names, and ~/.gitconfig. Every entry carries `-`, so
# a missing path never stops the unit from starting (fleet-ops#10081).
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=-/home/nish/.hermes -/home/nish/.local/state/hermes "-/home/nish/workspaces/tooling/nish-vault/00 Inbox/agent-drop/hermes"
BindReadOnlyPaths=-/home/nish/.local/bin -/home/nish/.local/share/chrome-devtools-mcp -/home/nish/.cua -/home/nish/.gitconfig
BindReadOnlyPaths=-/home/nish/.config/tincan/hermes.json -/home/nish/.config/tincan/hermes-webhook.secret -/home/nish/.config/tincan/prompts -/home/nish/.config/tincan/socket-wake -/home/nish/.config/tincan/mcp-launches
BindReadOnlyPaths=-/home/nish/workspaces/tooling/nish-vault/_system/shared-memory/skills-library
Environment="GH_CONFIG_DIR=/run/fleet-hermes-github-token"
Environment="npm_config_cache=/home/nish/.hermes/cache/npm"
# Nous Portal free-tier launch gate (fleet-ops#8766). Hermes' stock bootstrap
# (hermes_cli/anon_auth.py `guest_enabled`) only mints the anonymous
# `nous/welcome` identity while this is exactly "1", and that identity is what
# the `nous` fallback_providers rung resolves. This generic `hermes-` drop-in
# is shared by hermes-gateway.service and hermes-serve.service, so one line
# covers both. ~/.hermes/.env also carries it because Hermes re-reads that file
# per gateway turn; this line covers cron and cold starts that read .env later
# than the bootstrap.
Environment="HERMES_GUEST_ONBOARDING=1"
[Unit]
# Same ordering as the relay listener lock (fleet-ops#10081). The drop-in below
# hides /run/user/1000, and InaccessiblePaths= is applied once at start, so a
# unit that wins the boot race keeps the user manager socket and the minted
# worker App token readable for its whole life. hermes-gateway.service already
# carried these two lines; hermes-serve.service did not, so they belong here,
# next to the path they protect, for every unit that reads this file.
Wants=user@1000.service
After=user@1000.service

[Service]
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictRealtime=true

# Outside /home the host's docker sockets, the eval engine, nish's runtime dir
# (user bus, minted worker and Grafana tokens, podman socket, gnupg) and the
# restic config stay hidden. InaccessiblePaths= hides a path and all below it.
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/dockerd-eval
InaccessiblePaths=-/run/user/1000
InaccessiblePaths=-/etc/restic
