[Unit]
# The gh login is a one-hour App token that fleet-hermes-github-token.service
# writes to /run. After= orders the start, so a restart never runs Hermes
# against a token directory that is still empty, and the timer keeps it fresh
# for as long as the unit runs.
Wants=fleet-hermes-github-token.service
After=fleet-hermes-github-token.service

[Service]
# Hardening for the Telegram-facing gateway. Hermes writes only its own home
# and its vault inbox drop; fleet work goes through GitHub issues. gh reads
# its login from its own GH_CONFIG_DIR, refreshed by the oneshot below with a
# token scoped to the digest jobs' calls, and nish's admin login in
# ~/.config/gh is hidden (fleet-ops#10267). gh 2.103.3 with a hosts.yml token
# wrote nothing to its config dir across auth status, issue, pr, repo, search
# and api calls, also with the dir chmod 500 (fleet-ops#10184), so the token
# directory can stay read-only under ProtectHome=read-only and never needs a
# write grant here.
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=read-only
InaccessiblePaths=-/home/nish/.config/gh
ReadWritePaths=-/home/nish/.hermes -/home/nish/.local/state/hermes "-/home/nish/workspaces/tooling/nish-vault/00 Inbox/agent-drop/hermes"
Environment="GH_CONFIG_DIR=/run/fleet-hermes-github-token"
Environment="npm_config_cache=/home/nish/.hermes/cache/npm"
# Nous Portal free-tier launch gate (fleet-ops#8766). Hermes' stock bootstrap
# (hermes_cli/anon_auth.py `guest_enabled`) only mints the anonymous
# `nous/welcome` identity while this is exactly "1", and that identity is what
# the `nous` fallback_providers rung resolves. This generic `hermes-` drop-in
# is shared by hermes-gateway.service and hermes-serve.service, so one line
# covers both. ~/.hermes/.env also carries it because Hermes re-reads that file
# per gateway turn; this line covers cron and cold starts that read .env later
# than the bootstrap.
Environment="HERMES_GUEST_ONBOARDING=1"
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictRealtime=true
