[Service]
# Hardening for the Telegram-facing gateway. Hermes writes only its own home,
# gh auth, and its vault inbox drop; fleet work goes through GitHub issues.
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=read-only
# Beacon (local session capture, 2026-10-21) puts a shell hook in Hermes config.yaml.
# beacon-hooks appends to ~/.beacon/endpoint/logs/runtime.jsonl (plus its .lock) and keeps
# per-harness state in ~/.beacon/hermes. Under ProtectHome=read-only both are EROFS inside
# the gateway, so the hook records nothing. Only those two directories are opened up: the
# rest of ~/.beacon (endpoint/hooks/beacon-hooks, config.json, otelcol.yaml) is run or read by
# unsandboxed agents and must stay read-only here. Tested with bwrap: read-only tree fails,
# these two binds pass. Off switch: drop the two -/home/nish/.beacon entries AND remove the
# beacon-hooks entries from the hooks: block of ~/.hermes/config.yaml, or every turn logs EROFS.
# Data, not code: the two directories hold the session log and hook state, never a binary or
# config another agent runs. A prompt-injected gateway can append or forge log records but
# cannot change what runs. Beacon is local-only: otelcol.yaml binds the OTLP receivers to
# 127.0.0.1 and its one exporter writes ~/.beacon/endpoint/logs/runtime.jsonl (mode 0600, dir 0700).
# Hermes sessions include Telegram chats, so that file stays on the box.
ReadWritePaths=-/home/nish/.hermes -/home/nish/.local/state/hermes -/home/nish/.config/gh -/home/nish/.beacon/endpoint/logs -/home/nish/.beacon/hermes "-/home/nish/workspaces/tooling/nish-vault/00 Inbox/agent-drop/hermes"
Environment="npm_config_cache=/home/nish/.hermes/cache/npm"
# Nous Portal free-tier launch gate (fleet-ops#8766). Hermes' stock bootstrap
# (hermes_cli/anon_auth.py `guest_enabled`) only mints the anonymous
# `nous/welcome` identity while this is exactly "1", and that identity is what
# the `nous` fallback_providers rung resolves. This generic `hermes-` drop-in
# is shared by hermes-gateway.service and hermes-serve.service, so one line
# covers both. ~/.hermes/.env also carries it because Hermes re-reads that file
# per gateway turn; this line covers cron and cold starts that read .env later
# than the bootstrap.
Environment="HERMES_GUEST_ONBOARDING=1"
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectClock=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictRealtime=true
