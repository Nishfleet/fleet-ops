# The copy into the 30-day-locked bucket follows a good backup only
# (fleet-ops#9360). restic-r2-backup.service starts this unit through its
# OnSuccess= (backup.service.d/30-copy-on-success.conf), so a failed backup or
# a tripped size guard never reaches the second copy. This unit no longer
# Requires= the backup: Requires= on a oneshot starts it, which ran a second
# backup every day. After= keeps the two from overlapping.
[Unit]
After=restic-r2-backup.service
