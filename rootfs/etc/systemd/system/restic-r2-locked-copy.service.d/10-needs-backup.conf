# The copy into the 30-day-locked bucket only follows a good backup
# (fleet-ops#9360). Requires= starts restic-r2-backup.service first and skips
# this unit when it fails (size guard tripped), so growth never reaches the
# second copy. The box-only unit already has After= for ordering.
[Unit]
Requires=restic-r2-backup.service
After=restic-r2-backup.service
