# A failed run pings the healthchecks.io fail URL through the existing
# fleet-unit-failed@ handler (same OnFailure= line as fleet-host-config; the
# ping body is this unit's name). Without it the failure only showed up in
# `systemctl --failed` and, for backup, locked-copy and size-guard, in the
# BackupFailed rule after an hour.
# Switch off: delete this file and `systemctl daemon-reload`.
[Unit]
OnFailure=fleet-unit-failed@%N.service
