# No job on this runner needs the user bus: deploy-box's deploy is a system unit
# (2026-10-22, fleet-ops#10043). fleet-ci-3 hides it in 30-eval.conf.
# ExecStartPre= clears the shared 10-fleet-ci.conf mkdir under /run/user/1000:
# InaccessiblePaths= covers the pre-start step too, so that mkdir fails with
# "Permission denied" and the runner never starts. fleet-ci-3 resets the same
# line in 30-eval.conf; 40 sorts after 10, so this reset wins.
# SupplementaryGroups=systemd-journal lets deploy-box print the deploy unit's
# journal: members of that group read the system journal (journalctl(1),
# https://www.freedesktop.org/software/systemd/man/latest/journalctl.html), and
# systemd.exec sets the group on this unit alone, so nish's other processes and
# fleet-ci-3 (drive's eval) get no journal access.
# Takes effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
ExecStartPre=
InaccessiblePaths=-/run/user/1000
SupplementaryGroups=systemd-journal
