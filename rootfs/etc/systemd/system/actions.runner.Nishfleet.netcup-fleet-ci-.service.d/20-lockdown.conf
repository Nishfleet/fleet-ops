# Hide credential paths from CI jobs on the fleet-ci runners (2026-10-22,
# fleet-ops#9983). A `-` before a path means a missing path never stops the
# runner from starting. The user bus stays visible: deploy-box starts a user unit
# (fleet-sync.service). The host docker socket and ~/.docker are hidden too: the
# one job that needed a container engine, drive's agent eval, runs on fleet-ci-3
# alone and uses its own rootless Docker engine (30-eval.conf, dockerd-eval.service).
# litellm-keys/worker, ~/.local/share/drive, /run/podman-eval (the retired podman
# socket) and the Docker engine's /run/dockerd-eval are left out here on purpose:
# fleet-ci-3 alone uses them. Every other pool hides the engine socket in its own
# drop-in (fleet-ci-1/2 in 25-no-eval.conf; the agent and vault runners in their
# 20-lockdown.conf, fleet-ops#10057): the socket directory is 0700 nish and every
# runner process is nish, so a pool that can read it could drive the eval engine.
# runner-probe (the first step of deploy-box's apply job) fails
# the job if one of these paths is readable. Takes effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
# The user runtime dir is an empty read-only tmpfs, with only the bus bound back in,
# because deploy-box starts a user unit (fleet-sync.service). An empty tmpfs, not
# one InaccessiblePaths= entry per child (fleet-ops#10753): InaccessiblePaths= binds
# the inode present at the moment this unit starts (fleet-ops#10081), so a child
# recreated later is a new inode the runner can read. On 2026-10-28 the token dir
# under /run/user/1000 was recreated after the runners started and 106 dispatches
# failed runner-probe with "/run/user/1000/fleet-worker-github-token is readable from
# this job". man systemd.exec: paths under InaccessiblePaths= cannot be bound back in,
# so the parent is a tmpfs and the bus is bound over it (the same shape the vault
# runner uses for /home/nish). runner-probe does not list tmpfs-hidden paths, so the
# bus is the only path here a job can reach, and it needs it.
# Reset the shared 10-fleet-ci.conf ExecStartPre= (mkdir under /run/user/1000). Under
# the tmpfs that mkdir fails and the runner never starts. An empty assignment clears
# the list; 20 sorts after 10, so the reset wins.
ExecStartPre=
TemporaryFileSystem=/run/user/1000:ro
BindPaths=-/run/user/1000/bus
# The gpg dir and the two token dirs, listed so runner-probe still checks them; under
# the tmpfs they do not exist, so they pass.
InaccessiblePaths=-/run/user/1000/gnupg -/run/user/1000/fleet-worker-github-token -/run/user/1000/fleet-grafana-github-token
InaccessiblePaths=-/home/nish/.ssh -/home/nish/.gnupg -/home/nish/.config/cloudflare -/home/nish/.cloudflare -/home/nish/.wrangler
InaccessiblePaths=-/home/nish/.config/rclone -/home/nish/.codex -/home/nish/.netrc -/home/nish/.git-credentials -/home/nish/.aws
InaccessiblePaths=-/home/nish/.oci -/home/nish/.minio -/home/nish/.juicefs -/home/nish/.config/tailscale -/home/nish/.config/glab-cli -/home/nish/.hermes
InaccessiblePaths=-/etc/restic -/run/docker.sock -/var/run/docker.sock -/home/nish/.docker
# No fleet-ci job runs gh, claude or pi; deploy-box only starts units.
InaccessiblePaths=-/home/nish/.config/gh -/home/nish/.config/fleet-worker
InaccessiblePaths=-/home/nish/.claude/.credentials.json -/home/nish/.claude.json -/home/nish/.claude-vps -/home/nish/.claude-max
InaccessiblePaths=-/home/nish/.claude-nish -/home/nish/.claude-team -/home/nish/.claude-telegram -/home/nish/.claude-auth-backup-max-2026-10-10
InaccessiblePaths=-/home/nish/.local/share/claude-seat-backup
InaccessiblePaths=-/home/nish/.claude/.credentials.json.bak-alert-repair-20260909T055545Z -/home/nish/.claude/.credentials.json.bak-issue-4670-20260909T122627 -/home/nish/.claude/.credentials.json.blanked.20260821T233543
InaccessiblePaths=-/home/nish/.pi/agent/auth.json -/home/nish/.pi/agent/mcp-adapter.json -/home/nish/.pi/agent/mcp-adapter.json.bak-executor -/home/nish/.pi/agent/models-store.json -/home/nish/.pi/agent/mcp-oauth-encrypted
InaccessiblePaths=-/home/nish/workspaces/tooling/nish-vault -/home/nish/nish-vault
# ~/.config/fleet-ops: the secret files, but not litellm-keys/worker (the eval's key; 25-no-eval.conf hides it on fleet-ci-1/2).
InaccessiblePaths=-/home/nish/.config/fleet-ops/seats -/home/nish/.config/fleet-ops/litellm-master-key.env -/home/nish/.config/fleet-ops/litellm-virtual-keys.env
InaccessiblePaths=-/home/nish/.config/fleet-ops/litellm-keys/master -/home/nish/.config/fleet-ops/litellm-keys/private -/home/nish/.config/fleet-ops/litellm-keys/senior
InaccessiblePaths=-/home/nish/.config/fleet-ops/0509-telemetry-deploy-key -/home/nish/.config/fleet-ops/gh-webhook.secret -/home/nish/.config/fleet-ops/github-issues.env
InaccessiblePaths=-/home/nish/.config/fleet-ops/grafana-admin-password -/home/nish/.config/fleet-ops/keystone-hc.env -/home/nish/.config/fleet-ops/telegram.env
