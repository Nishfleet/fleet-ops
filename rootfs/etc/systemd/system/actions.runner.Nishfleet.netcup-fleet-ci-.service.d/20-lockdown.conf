# Runner lockdown for the fleet-ci runners (2026-10-22, fleet-ops#9983, #10453). The
# home directory is an empty tmpfs in every fleet-ci drop-in (25-no-eval.conf, 30-eval.conf),
# so no home path is named here: a path that is not bound back in does not exist for a job.
# This file hides what lives outside home. The user bus stays visible: deploy-box starts
# a user unit (fleet-sync.service). The host docker socket is hidden: the one job that
# needed a container engine, drive's agent eval, runs on fleet-ci-3 alone and uses its
# own rootless Docker engine (30-eval.conf, dockerd-eval.service). /run/podman-eval and
# /run/dockerd-eval are left out here on purpose: fleet-ci-3 alone uses them, and the
# other pools hide them in their own drop-ins (fleet-ops#10057): the socket directory
# is 0700 nish and every runner process is nish, so a pool that can read it could drive
# the eval engine. runner-probe (the first step of deploy-box's apply job) fails the job
# if one of these paths is readable, or if a path covered by a mount below is not
# covered. Takes effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
InaccessiblePaths=-/run/user/1000/gnupg
InaccessiblePaths=-/etc/restic
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock
# The two runtime dirs the user token mints write their App tokens into, covered by a
# mount rather than masked: systemd makes the mount point and mounts it before the
# runner runs, so a directory the mint creates later is already covered, while the
# mask was applied once against whatever existed then and the pre-start mkdir that
# made these dirs ran after it (fleet-ops#10886). A mount sits on the directory it
# was made on, so a delete-and-recreate from the host is as uncovered as a replaced
# mask: the mints keep these dirs (RuntimeDirectoryPreserve=yes). Read-only, so a
# job cannot fill a tmpfs that defaults to half of RAM. Neither path may stay on
# InaccessiblePaths=, because at one path systemd applies the more restrictive entry
# and drops the other. fleet-ci-3 hides /run/user/1000 whole, so it already covers
# these paths and drops the nested mounts.
TemporaryFileSystem=/run/user/1000/fleet-worker-github-token:ro
TemporaryFileSystem=/run/user/1000/fleet-grafana-github-token:ro
