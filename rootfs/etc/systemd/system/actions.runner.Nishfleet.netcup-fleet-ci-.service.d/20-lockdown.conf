# Runner lockdown for the fleet-ci runners (2026-10-22, fleet-ops#9983, #10453). The
# home directory is an empty tmpfs in every fleet-ci drop-in (25-no-eval.conf, 30-eval.conf),
# so no home path is named here: a path that is not bound back in does not exist for a job.
# This file hides what lives outside home. The user bus stays visible: deploy-box starts
# a user unit (fleet-sync.service). The host docker socket is hidden: the one job that
# needed a container engine, drive's agent eval, runs on fleet-ci-3 alone and uses its
# own rootless Docker engine (30-eval.conf, dockerd-eval.service). /run/podman-eval and
# /run/dockerd-eval are left out here on purpose: fleet-ci-3 alone uses them, and the
# other pools hide them in their own drop-ins (fleet-ops#10057): the socket directory
# is 0700 nish and every runner process is nish, so a pool that can read it could drive
# the eval engine. runner-probe (deploy-box's probe step, which runs after its deploy
# steps and never gates them: fleet-ops#10046) fails the job if one of these paths is
# readable. Takes effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
InaccessiblePaths=-/run/user/1000/gnupg -/run/user/1000/fleet-worker-github-token -/run/user/1000/fleet-grafana-github-token
InaccessiblePaths=-/etc/restic
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock
# Hermes' token dir (fleet-ops#10267) is a real nish-owned 0700 dir on /run outside home, so
# the home tmpfs does not cover it. This paints it empty for every job step, and agent.yml's
# jail masks it again from every engine (tests/test_runner_jail_start_state.py holds the
# pairing). An InaccessiblePaths= cut here is not a mount point that the jail's --tmpfs can
# try; an empty tmpfs is, like the gh home dir on the agent pool.
TemporaryFileSystem=/run/fleet-hermes-github-token
