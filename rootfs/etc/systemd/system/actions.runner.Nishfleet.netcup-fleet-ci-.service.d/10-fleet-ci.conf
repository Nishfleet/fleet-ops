# The 3 CI-only runners (actions.runner.Nishfleet.netcup-fleet-ci-1..3), the
# same guard the agent runners get in netcup-agent-.service.d/10-agent.conf.
#
# MemoryMax=3G was set live by `systemctl set-property` (a file per runner in
# /etc/systemd/system.control, outside the repo); it moves here, and
# ansible/host.yml deletes those files. A system.control file outranks this
# drop-in, so both changes ship together.
#
# ManagedOOMMemoryPressure=kill: before this, these runners had the distro
# default `auto` and were the only runners systemd-oomd would not kill under
# memory pressure, so one CI job could stall the whole box instead of dying
# alone (thread "fix everything like pro devs", 2026-10-03). 80% matches the
# agent runners. The pressure window is DefaultMemoryPressureDurationSec in
# rootfs/etc/systemd/oomd.conf.d/99-fleet.conf.
#
# Restart: an OOM kill must not leave the runner offline (was 10-restart.conf).
[Service]
MemoryMax=3G
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
Restart=on-failure
RestartSec=30s
