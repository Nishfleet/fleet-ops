# CPU arbitration for everything user `nish` runs: the agent fleet, every
# transient systemd-run unit, every browser, every test suite.
#
# No CPUQuota (Nish, 2026-08-10: no ceilings on netcup's 8 dedicated cores;
# weights arbitrate, so idle cycles are never wasted). The 2026-08-10 ceiling
# of 640%-760% and the Python watcher that re-asserted it are gone. A
# `systemctl set-property` leftover that set `CPUQuota=` (empty) in
# /etc/systemd/system.control is deleted by ansible/host.yml.
#
# CPUWeight=60 makes the user tree lose contention to system services
# (default weight 100), so sshd, tailscaled and systemd are never starved by
# a thrashing fleet. SSH to this box is Tailscale-only, so a starved network
# stack locks everyone out.
#
# Interactive priority inside this slice: session-.scope.d and the user-level
# tmux-spawn-.scope.d drop-ins give nish's terminals CPUWeight=300.
#
# Was hand-installed; moved into fleet-ops rootfs/ 2026-10-03 (thread "fix
# everything like pro devs"). Memory limits for this slice are in
# 50-ram-governor.conf next to this file.
[Slice]
CPUAccounting=yes
CPUWeight=60
