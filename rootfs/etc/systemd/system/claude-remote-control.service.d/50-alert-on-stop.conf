# Alert within seconds when Remote Control stops or crashes (OOM storm
# 2026-10-09: the link stalled about two minutes and nothing told anyone).
#
# OnFailure= cannot do this job. It fires only when the unit lands in `failed`,
# and selfheal.conf (StartLimitIntervalSec=0, Restart=always) means it never
# does: every exit goes straight to auto-restart. ExecStopPost= runs on every
# exit, crash or stop, so it is the hook that sees the drop.
#
# It starts the existing fleet-unit-failed@ handler (healthchecks.io fail ping,
# fleet-ops#9033, installed beside this file). `+` runs it as root, because this
# unit runs as nish and may not start system units; `-` keeps a failing ping
# from changing the stop result; --no-block returns at once, so a slow ping
# never delays the 2 s restart in selfheal.conf. Unset keystone-hc.env URL =
# the handler exits 0 with a SKIP line in the journal.
# A deliberate `systemctl restart` by Nish pings too: it really is a drop.
#
# OOMPolicy=continue: the default (stop) stops the whole unit when the kernel
# kills ANY process in its cgroup, and Restart=always then restarts it, so
# a killed runaway child under the new claude.slice cap would cut every
# session. With continue only the killed process dies.
#
# Staged like the rest of this unit: the ExecStopPost line is read at the next
# restart of Remote Control, which only Nish does. OOMPolicy applies at
# `systemctl daemon-reload`.
#
# Switch off: delete this file and `systemctl daemon-reload`.
[Service]
OOMPolicy=continue
ExecStopPost=-+/usr/bin/systemctl start --no-block fleet-unit-failed@%N.service
