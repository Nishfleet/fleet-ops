# Self-heal after any exit; never trip the start-rate limit (the default
# 5-in-10s limit would leave RC dead after a flap).
[Unit]
StartLimitIntervalSec=0
[Service]
# Wait out the relay's folder-claim release before the retry. The server claims
# ~/workspaces on the claude.ai relay and releases it with
# DELETE /v1/environments/bridge/<id>; after a kill the relay held the claim for
# 2:06-3:16 on 2026-10-08, so a 2 s retry only got HTTP 409 "This folder is
# already served" and burned a restart every ~60 s, three times (#9485). 300 s is
# the longest observed hold plus half again; only time can wait for the claim,
# because no API reports it.
RestartSec=300
