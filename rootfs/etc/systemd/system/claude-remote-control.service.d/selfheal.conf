# Self-heal after any exit; never trip the start-rate limit (the default
# 5-in-10s limit would leave RC dead after a flap).
[Unit]
StartLimitIntervalSec=0
[Service]
# Wait past the relay's folder-claim release. The server claims ~/workspaces on
# the claude.ai relay and releases it with DELETE /v1/environments/bridge/<id>;
# after a kill the relay held the claim for 2:06-3:16 in the 2026-10-08 restart,
# so a 2 s retry only got HTTP 409 "This folder is already served" and burned a
# restart every ~60 s (#9485).
RestartSec=240
