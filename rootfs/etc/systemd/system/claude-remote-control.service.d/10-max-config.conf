# Remote Control runs on the default Team-seat login (2026-10-22). The personal
# Max login lost Remote Control that day ("Remote Control isn't enabled for this
# account") and the unit crash-looped; the default login allows it.
# UnsetEnvironment drops CLAUDE_CONFIG_DIR, so the unit and every session it
# spawns read ~/.claude and ~/.claude.json (a ~/.claude CLAUDE_CONFIG_DIR reads a
# different .claude.json and fails with "Workspace not trusted").
# The filename stays so ansible/host.yml needs no change.
#
# Switch off: put the old Environment=CLAUDE_CONFIG_DIR= line (the Max config dir
# ~/.claude-max, as an absolute path) back in place of the UnsetEnvironment line,
# which only helps once Max has Remote Control again, then
# `systemctl daemon-reload`. Takes effect at the next restart.
[Service]
UnsetEnvironment=CLAUDE_CONFIG_DIR
