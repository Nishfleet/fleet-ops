# Remote Control keeps the Max login (2026-10-10). The default Claude login in
# ~/.claude is now a Team seat, and that organization's policy disables Remote
# Control: on that login the server exits at once with "Remote Control is
# disabled by your organization's policy" and Restart=always loops on it
# (measured 2026-10-10 10:52 to 10:56 UTC, link down about 4 minutes).
# CLAUDE_CONFIG_DIR points this unit, and every session it spawns, at the
# separate Max config dir, so the link no longer depends on which login is the
# default. A new config dir registers a new Remote Control environment on
# claude.ai; the old environment stays listed as offline and serves nothing.
#
# Installed live by hand during that outage; this file makes it a reviewed
# rootfs/ file, so the owned-dir drift check in ansible/host.yml passes.
# Takes effect at the next restart of Remote Control, which only Nish does.
#
# Switch off: delete this file, add its path to `retired` in ansible/host.yml,
# then `systemctl daemon-reload` and restart Remote Control. Only do that once
# the default login allows Remote Control again.
[Service]
Environment=CLAUDE_CONFIG_DIR=/home/nish/.claude-max
