[Service]
# Cut the docker socket off from Remote Control (fleet-ops#9503). RC sessions
# run with --permission-mode bypassPermissions, so they are the same
# prompt-injection surface as a job runner.
#
# ProtectSystem/ProtectHome/NoNewPrivileges/PrivateTmp are deliberately
# unset: RC keeps sudo (the unit's own comment), and sudo apt writes /usr.
#
# Staged, not live: ansible/host.yml never restarts RC. Rollback: revert this
# file, re-run host-config, daemon-reload, then restart
# claude-remote-control.service.
InaccessiblePaths=/run/docker.sock
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectKernelLogs=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
SystemCallArchitectures=native
