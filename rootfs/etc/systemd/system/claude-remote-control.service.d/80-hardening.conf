# Conservative sandboxing for Remote Control. Its sessions edit files across
# /home and /etc and run sudo (passwordless root), so the switches that would
# break that are left out on purpose:
#   NoNewPrivileges      stops sudo from working
#   ProtectHome, ProtectSystem=strict   sessions write under /home and /etc
#   CapabilityBoundingSet=, RestrictNamespaces   break sudo and rootless podman
#   RestrictSUIDSGID     breaks `sudo apt` installing setuid files
#   ProtectKernelTunables/Logs, ProtectControlGroups, ProtectClock, SystemCallFilter
#                        break sudo sysctl, dmesg, cgroup and date work
# Takes effect at the next restart of Remote Control.
# Roll back: delete this file, `systemctl daemon-reload`, restart the unit.
[Service]
LockPersonality=yes
RestrictRealtime=yes
ProtectKernelModules=yes
ProtectHostname=yes
SystemCallArchitectures=native
