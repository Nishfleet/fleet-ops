# Sandbox for Remote Control (audit W2a, nish-vault#30): `systemd-analyze security`
# 9.2 -> under 5. Every directive is inherited by every session, tool and child the
# server spawns, so only switches that cost a coding session nothing are set.
# Scored offline (`systemd-analyze security --offline=true`, 4.8 with PrivateMounts
# set; the live scorer counts PrivateMounts= as unset without the line below).
#
# Deliberately NOT set, because sessions use them: NoNewPrivileges (sessions run
# `sudo -n`), PrivateTmp (tmux and /tmp files shared with Nish's shell),
# ProtectSystem (sudo edits and installs), RestrictNamespaces and
# SystemCallFilter=@system-service (Chrome/bwrap sandboxes, see the hermes
# notes in 80-hardening.conf there), IPAddressDeny (container and tailnet
# addresses), ProcSubset=pid (hides /proc/meminfo and cpuinfo), RemoveIPC
# (would delete the SysV segments of every other nish process on stop),
# MemoryDenyWriteExecute (node JIT), UMask (files sessions share with groups).
# Also not touched: User=, Environment, ExecStart and the CLAUDE_CONFIG_DIR
# handling in 10-max-config.conf. The 2026-10-22 Remote Control failures were the
# account flag ("Remote Control isn't enabled for this account"), not a sandbox
# directive (W2a notes, 21:01 IST); a transient unit with these properties
# was run through a command battery before this landed.
#
# What a session loses: reading dmesg/kernel log and writing /proc/sys or /sys
# (ProtectKernel*), setting the clock or hostname, loading modules, device nodes
# other than the pseudo devices (PrivateDevices), other users' /proc entries
# (ProtectProc), writing under /home other than /home/nish, raw and packet
# sockets (AF_PACKET), and the capabilities dropped below for `sudo` children.
# To give one back, delete its line here and apply as below.
#
# Staged like the rest of this unit: ansible/host.yml installs the file and never
# restarts Remote Control, so it applies at the next restart, which only Nish
# does (it cuts his phone link). Take effect: `systemctl daemon-reload` then
# restart. Roll back: delete this file, `systemctl daemon-reload`, restart.
[Service]
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
PrivateMounts=yes
PrivateDevices=yes
ProtectProc=invisible
# /home and /run/user become read-only; the two paths sessions write stay writable.
ProtectHome=read-only
ReadWritePaths=/home/nish /run/user/1000
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=~CAP_SYS_TIME CAP_SYS_PACCT CAP_WAKE_ALARM CAP_BPF CAP_LINUX_IMMUTABLE CAP_IPC_LOCK CAP_SYS_MODULE CAP_SYS_TTY_CONFIG CAP_SYS_BOOT CAP_SYS_CHROOT CAP_BLOCK_SUSPEND CAP_LEASE CAP_MKNOD CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_SYS_RAWIO CAP_NET_BIND_SERVICE CAP_NET_BROADCAST CAP_NET_RAW CAP_SYS_NICE CAP_SYS_RESOURCE
SystemCallFilter=~@clock @cpu-emulation @module @obsolete @raw-io @reboot @swap
