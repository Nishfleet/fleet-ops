# Sandbox for Remote Control (audit W2a, nish-vault#30). Every directive is
# inherited by every session, tool and child the server spawns.
# Scored offline (`systemd-analyze security --offline=true`): 9.2 before any
# sandbox (W2a), 4.8 after the audit landed, 4.2 with this file.
#
# Shape 1 of #11290, landed on the owner's reset brief of 2026-11-01 (#10935:
# "green #11321"): hardened like tincan-listen-claude-vps
# (deny-by-default) instead of an explicit deny list. NoNewPrivileges is now set,
# so the privilege-escalation path (`sudo -n`) is closed and every other agent's
# keys stay unreadable: seats, ~/.config/gh, ~/.config/cloudflare, ~/.ssh,
# ~/.git-credentials, the litellm master key, pi's provider logins in ~/.pi,
# and all of /run/user/1000, like the shared agent-lock drop-in hides it for
# the relay listeners: that directory holds the user manager's bus and private
# socket (a `systemctl --user` or `systemd-run --user` call starts a user unit
# outside this sandbox, which could read every key above), the podman socket,
# and the per-run worker App tokens. A worker spawned through the
# transient-unit pattern (docs/detached-worker-unit.md) is its own unit and gets
# its token minted into ITS environment; only the reading of the token file stays
# hidden from the session.
#
# What a session loses with this change (each one is real, listed so the loss is
# a fact, not a surprise): host sudo (read-only diagnostics like
# sudo journalctl, package installs, /etc edits), writing under /home outside
# the bind list below (e.g. ~/.zshrc, another checkout outside ~/workspaces),
# the litellm master key, every pi login and gh's login (~/.pi and ~/.config/gh
# are absent, so a session cannot run pi or push with gh; it starts fleet work
# through the agent-ready queue), the user manager, dbus and podman
# (/run/user/1000 is hidden, so `systemctl --user`, `systemd-run --user` and the
# detached-worker launch fail), /tmp
# sharing with Nish's shell (tmux hand-off files), the container socket, and
# Chrome's setuid sandbox (NoNewPrivileges blocks it, so a headless browser a
# session starts needs --no-sandbox), and
# every write to ~/.cache, ~/.npm, ~/.config and ~/.local/state: ProtectHome=tmpfs
# mounts the empty /home read-only (systemd.exec(5)), so npm, pip and gh need
# their cache and state under ~/workspaces (for example npm_config_cache). To give one back, add the path to
# BindPaths or BindReadOnlyPaths below, or close the sudo-based task some other
# way, and apply as below.
#
# The system bus stays reachable, so `systemctl status` still reads units. It is
# not a way out: polkit lets nish start only fleet-update, restic-r2-backup and
# restic-r2-size-guard and restart five named runner units
# (rootfs/etc/polkit-1/rules.d/50-fleet-*.rules), each running its own fixed
# command, never one a session chooses.
#
# Deliberately NOT set, because sessions still use them: RestrictNamespaces and
# SystemCallFilter=@system-service (Chrome/bwrap sandboxes, see the hermes
# notes in 80-hardening.conf there), IPAddressDeny (container and tailnet
# addresses), ProcSubset=pid (hides /proc/meminfo and cpuinfo), RemoveIPC
# (would delete the SysV segments of every other nish process on stop),
# MemoryDenyWriteExecute (node JIT), UMask (files sessions share with groups).
# Also not touched: User=, Environment, ExecStart, and 10-max-config.conf,
# which unsets CLAUDE_CONFIG_DIR, so the login and session state this unit
# needs are ~/.claude and ~/.claude.json, both in the bind list below.
# ~/.claude.json is a single-file bind, so a rename onto it fails with EBUSY.
# Whether Claude Code then falls back to an in-place write was not checked:
# if settings stop saving after the next start, that is the cause. The 2026-10-22 Remote Control failures were
# the account flag ("Remote Control isn't enabled for this account"), not a
# sandbox directive (W2a notes, 21:01 IST); a transient unit with these
# properties was run through a command battery before this landed.
#
# Staged like the rest of this unit: ansible/host.yml installs the file and never
# restarts Remote Control, so it applies at the next start: a restart Nish
# makes, a reboot, or a crash restart (Restart= in the unit), whichever comes
# first. The optional binds (.gitconfig, browser-use.env) take the "-" prefix,
# so a missing one is skipped. The three writable binds are the login itself:
# without them the server cannot connect, sandboxed or not. Take effect: `systemctl daemon-reload` then
# restart. Roll back: delete this file, `systemctl daemon-reload`, restart.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
PrivateMounts=yes
PrivateDevices=yes
ProtectProc=invisible
# Deny by default (tincan-listen-claude-vps shape): /home starts empty, and only
# what a coding session for Nish needs is mounted back. Writable: the workspaces
# checkouts and the ~/.claude state and ~/.claude.json a session writes. Read-only: the CLI
# binaries, the git identity, and the browser MCP key file (its value reaches
# this unit through EnvironmentFile= before the sandbox applies). Everything
# else under /home is absent, so ~/.ssh, ~/.git-credentials, ~/.config/gh,
# ~/.config/cloudflare, ~/.config/systemd, ~/.hermes and the claude-vps/tincan
# identities are gone without InaccessiblePaths=.
ProtectHome=tmpfs
BindPaths=/home/nish/workspaces /home/nish/.claude /home/nish/.claude.json
BindReadOnlyPaths=/home/nish/.local/bin /home/nish/.local/share/claude -/home/nish/.gitconfig -/home/nish/.config/claude/browser-use.env
# ProtectSystem=strict mounts the whole tree read-only except /dev, /proc, /sys
# (systemd.exec(5)); /usr, /etc and /boot become read-only, so sudo edits and
# package installs fail outright now that they also cannot run.
ProtectSystem=strict
# The checkouts stay writable under ProtectSystem=strict. /run/user/1000 is
# hidden whole, and the container sockets with it.
ReadWritePaths=/home/nish/workspaces
InaccessiblePaths=-/run/user/1000 -/run/docker.sock -/var/run/docker.sock
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=~CAP_SYS_TIME CAP_SYS_PACCT CAP_WAKE_ALARM CAP_BPF CAP_LINUX_IMMUTABLE CAP_IPC_LOCK CAP_SYS_MODULE CAP_SYS_TTY_CONFIG CAP_SYS_BOOT CAP_SYS_CHROOT CAP_BLOCK_SUSPEND CAP_LEASE CAP_MKNOD CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_SYS_RAWIO CAP_NET_BIND_SERVICE CAP_NET_BROADCAST CAP_NET_RAW CAP_SYS_NICE CAP_SYS_RESOURCE
SystemCallFilter=~@clock @cpu-emulation @module @obsolete @raw-io @reboot @swap
