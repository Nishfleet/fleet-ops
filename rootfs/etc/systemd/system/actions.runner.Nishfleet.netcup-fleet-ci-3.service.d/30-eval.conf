# fleet-ci-3 runs drive's agent eval and nothing else (org runner group
# drive-eval, restricted to drive's agent-eval.yml on main), so it alone gets a
# container engine of its own: the rootless podman socket from
# podman-eval.service, not the host docker socket (2026-10-22, fleet-ops#9983).
# It only adds to the fleet-ci 20-lockdown.conf list: the eval's worker key and
# split stay visible here (fleet-ci-1/2 hide them in 25-no-eval.conf), and the
# eval needs no user bus, so /run/user/1000 is hidden whole.
# Takes effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Unit]
After=podman-eval.service
Wants=podman-eval.service

[Service]
Environment=DOCKER_HOST=unix:///run/podman-eval/podman.sock
InaccessiblePaths=-/run/user/1000 -/home/nish/.local/share/containers/storage
