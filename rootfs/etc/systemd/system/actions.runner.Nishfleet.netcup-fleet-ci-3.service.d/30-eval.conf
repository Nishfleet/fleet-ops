# fleet-ci-3 runs drive's agent eval and nothing else (org runner group
# drive-eval, restricted to drive's agent-eval.yml on main), so it alone gets a
# container engine of its own: the rootless Docker engine from
# dockerd-eval.service, not the host docker socket (2026-10-22, fleet-ops#9983).
# It only adds to the fleet-ci 20-lockdown.conf list: the eval's worker key and
# split stay visible here (fleet-ci-1/2 hide them in 25-no-eval.conf), and the
# eval needs no user bus, so /run/user/1000 is hidden whole.
#
# Home directory: hidden at the directory level so files rewritten in place stay
# hidden (a file-level InaccessiblePaths= mount is dropped when the host replaces
# the file by rename). /home/nish is a small writable tmpfs (size-capped; tmpfs
# pages count against MemoryMax) that holds the eval's small state:
# ~/.local/share/inspect_ai and rclone's cache. The big caches
# are bound from disk, not tmpfs: ~/.npm (npm ci), ~/.cache/pip (the Inspect
# venv's pip install) and ~/.promptfoo (promptfoo's cache and results database,
# which the drive eval writes; run 39803734678 passed promptfoo only with it
# bound, and it is writable so the results persist). Directories systemd creates for the binds are root-owned,
# so ~/.config and ~/.cache are not writable: XDG_CONFIG_HOME and XDG_CACHE_HOME
# point at a directory made by the job, and PIP_CACHE_DIR keeps pip on the bound
# cache. ~/.local/share/inspect_ai is bound for the same reason. Also bound: this
# runner's own directory; the worker key
# file and the held-out split directory, read-only (litellm-keys holds the other
# pools' keys, so only the one file is bound); the rclone binary, read-only (the
# stand-in is a host-side `rclone serve s3`). The /home/nish entries in
# 20-lockdown.conf stay listed so runner-probe still checks them; under the
# tmpfs they do not exist, so they pass.
# A `-` before a bound path means a missing path never stops the runner from
# starting; only the runner's own directory is required.
# Residual: ~/.npm and ~/.cache/pip are writable host caches, so the eval job can
# add cache entries that host tools later read (npm re-checks each entry against
# the lockfile's integrity hash). ~/.promptfoo is the same kind of residual: the
# eval job reads whatever a host promptfoo run left there (checked 2026-10-22:
# its config file holds no secret, only an install id), and the eval's cache
# and results persist there for a host run to read. Only drive's agent-eval.yml on main runs here.
# Takes effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Unit]
After=dockerd-eval.service
Wants=dockerd-eval.service

[Service]
# Reset the shared 10-fleet-ci.conf ExecStartPre= (mkdir under /run/user/1000). The
# InaccessiblePaths= below hides /run/user/1000 whole, so inside this unit's mount
# namespace that mkdir fails ("Permission denied") and the runner never starts.
# This runner hides the whole directory, so it never needs the two dirs. An empty
# assignment clears the list; 30 sorts after 10, so the reset wins.
ExecStartPre=
Environment=DOCKER_HOST=unix:///run/dockerd-eval/rt/docker.sock
# Eval containers reach the host through the engine's slirp4netns gateway.
Environment=DRIVE_EVAL_SANDBOX_HOST=10.0.2.2
# The eval's stand-in listens on this one loopback port, and it is the only host
# port the engine may reach (/etc/nftables.d/evalnet.nft names the same port).
Environment=DRIVE_EVAL_STANDIN_PORT=18931
# The eval's rclone stand-in needs no remotes, so it gets an empty config.
Environment=RCLONE_CONFIG=/dev/null
Environment=XDG_CONFIG_HOME=/home/nish/.xdg/config XDG_CACHE_HOME=/home/nish/.xdg/cache PIP_CACHE_DIR=/home/nish/.cache/pip
InaccessiblePaths=-/run/user/1000 -/home/nish/.local/share/containers/storage
TemporaryFileSystem=/home/nish:mode=0700,uid=1000,gid=1000,size=256M
BindPaths=/home/nish/.local/share/fleet-ci-runner/3 -/home/nish/.npm -/home/nish/.cache/pip -/home/nish/.local/share/inspect_ai -/home/nish/.promptfoo
BindReadOnlyPaths=-/home/nish/.config/fleet-ops/litellm-keys/worker -/home/nish/.local/share/drive -/home/nish/.local/bin/rclone
