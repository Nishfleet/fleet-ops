# Interactive login sessions (SSH, Claude remote) get priority INSIDE the
# fleet's 320% CPU ceiling (see user-1000.slice.d/50-fleet-cpu-ceiling.conf).
#
# Why (2026-08-09): the ceiling put every process nish runs into one 3.2-core
# budget with equal weight, so interactive terminals fought ~10 fleet workers
# for CPU and stalled 68k+ times in a day - the box felt "erratic" while
# perfectly healthy. Weight is work-conserving: the fleet still uses ALL
# headroom when nish is idle, and Hostinger sees the same totals. This only
# decides who wins the moments of contention - including the 15-min cooldown
# squeezes to 100%, where sessions now get ~3/4 of the single core.
#
# Siblings for reference: user@1000.service (the whole fleet) has weight 100.
[Scope]
CPUWeight=300
