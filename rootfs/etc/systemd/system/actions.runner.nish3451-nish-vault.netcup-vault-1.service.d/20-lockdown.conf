# Hide credential paths and the docker socket from CI jobs on the nish-vault
# runner (2026-10-22, fleet-ops#9983). NoNewPrivileges was off here; the other
# pools already set it (10-agent.conf, 10-fleet-ci.conf). A `-` before a path
# means a missing path never stops the runner from starting. The vault jobs
# (skills-library.yml, secret-scan.yml) read no credentials: the deploy job
# writes ~/workspaces/tooling/nish-vault and links skills into ~/.claude,
# ~/.claude-max and ~/.pi/agent, so those stay visible. runner-probe (the first
# step of those jobs) fails the job if one of these paths is readable. Takes
# effect when the runner restarts.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Service]
NoNewPrivileges=yes
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/podman-eval
InaccessiblePaths=-/run/user/1000/bus -/run/user/1000/systemd -/run/user/1000/podman
InaccessiblePaths=-/run/user/1000/gnupg -/run/user/1000/fleet-worker-github-token -/run/user/1000/fleet-grafana-github-token
InaccessiblePaths=-/home/nish/.ssh -/home/nish/.gnupg -/home/nish/.config/cloudflare -/home/nish/.cloudflare -/home/nish/.wrangler
InaccessiblePaths=-/home/nish/.config/rclone -/home/nish/.codex -/home/nish/.netrc -/home/nish/.git-credentials -/home/nish/.aws -/home/nish/.docker
InaccessiblePaths=-/home/nish/.oci -/home/nish/.minio -/home/nish/.juicefs -/home/nish/.config/tailscale -/home/nish/.config/glab-cli -/home/nish/.hermes
InaccessiblePaths=-/etc/restic
InaccessiblePaths=-/home/nish/.config/gh -/home/nish/.config/fleet-ops -/home/nish/.config/fleet-worker
InaccessiblePaths=-/home/nish/.claude/.credentials.json -/home/nish/.claude.json -/home/nish/.claude-vps
InaccessiblePaths=-/home/nish/.claude-max/.credentials.json -/home/nish/.claude-max/.claude.json
InaccessiblePaths=-/home/nish/.claude-nish -/home/nish/.claude-team -/home/nish/.claude-telegram -/home/nish/.claude-auth-backup-max-2026-10-10
InaccessiblePaths=-/home/nish/.local/share/claude-seat-backup
InaccessiblePaths=-/home/nish/.claude/.credentials.json.bak-alert-repair-20260909T055545Z -/home/nish/.claude/.credentials.json.bak-issue-4670-20260909T122627 -/home/nish/.claude/.credentials.json.blanked.20260821T233543
InaccessiblePaths=-/home/nish/.pi/agent/auth.json -/home/nish/.pi/agent/mcp-adapter.json -/home/nish/.pi/agent/mcp-adapter.json.bak-executor -/home/nish/.pi/agent/models-store.json -/home/nish/.pi/agent/mcp-oauth-encrypted
InaccessiblePaths=-/home/nish/nish-vault
