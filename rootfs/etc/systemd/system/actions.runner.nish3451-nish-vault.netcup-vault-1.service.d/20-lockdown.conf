# Hide credential paths and the docker and eval-engine sockets from CI jobs on the nish-vault
# runner (2026-10-22, fleet-ops#9983). NoNewPrivileges was off here; the other
# pools already set it (10-agent.conf, 10-fleet-ci.conf). A `-` before a path
# means a missing path never stops the runner from starting. The vault jobs
# (skills-library.yml, secret-scan.yml) read no credentials: the deploy job
# writes ~/workspaces/tooling/nish-vault and links skills into ~/.claude,
# ~/.claude-max and ~/.pi/agent, so those stay visible. runner-probe (the first
# step of those jobs) fails the job if one of these paths is readable, or if a
# path covered by a mount below is not covered. Takes effect when the runner
# restarts.
#
# Home directory: hidden at the directory level so files rewritten in place stay
# hidden (a file-level InaccessiblePaths= mount is dropped when the host replaces
# the file by rename, e.g. ~/.claude.json). /home/nish is an empty read-only
# tmpfs; bound back in, writable: this runner's own install directory
# (/home/nish/.local/share/agent-runner/23 is the WorkingDirectory of this unit;
# the agent runners use 1-22), the live vault's skills-library directory (the
# deploy step's rsync target; it writes nothing else under ~/workspaces/tooling/
# nish-vault), the three skills directories the deploy step links new skills
# into, and ~/.cache/uv plus ~/.local/share/uv (uvx tool envs and the managed
# Python; setup-uv points UV_PYTHON_INSTALL_DIR there, and without the bind the
# validate job fails with "failed to create directory .../uv/tools"). uv itself
# comes from the runner's _tool cache. A `-` before a bound path means a missing
# path never stops the runner from starting; only the runner directory is
# required. The /home/nish entries below stay listed so runner-probe still checks
# them; under the tmpfs they do not exist, so they pass.
# Rollback: delete this file, `systemctl daemon-reload`, restart the runner.
[Unit]
# Start after the user manager, so the user runtime dir and its sockets exist when
# the paths below are hidden. InaccessiblePaths= hides a path only if it exists at
# the moment the unit starts (fleet-ops#10081, #10120). Wants= pulls the manager in at boot.
After=user@1000.service
Wants=user@1000.service

[Service]
NoNewPrivileges=yes
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock -/run/podman-eval -/run/dockerd-eval
InaccessiblePaths=-/run/user/1000/bus -/run/user/1000/systemd -/run/user/1000/podman
InaccessiblePaths=-/run/user/1000/gnupg
InaccessiblePaths=-/etc/restic
TemporaryFileSystem=/home/nish:ro
# The two runtime dirs the user token mints write their App tokens into, covered by a
# mount rather than masked: a mount covers the path, so a directory the mint recreates
# in its place stays covered (fleet-ops#10886). Neither path may stay on
# InaccessiblePaths=, because at one path systemd applies the more restrictive entry and
# drops the other. systemd makes the mount point when it is absent at start, so no
# pre-start mkdir has to exist first.
TemporaryFileSystem=/run/user/1000/fleet-worker-github-token
TemporaryFileSystem=/run/user/1000/fleet-grafana-github-token
BindPaths=/home/nish/.local/share/agent-runner/23
BindPaths=-/home/nish/workspaces/tooling/nish-vault/_system/shared-memory/skills-library -/home/nish/.cache/uv -/home/nish/.local/share/uv
BindPaths=-/home/nish/.claude/skills -/home/nish/.claude-max/skills -/home/nish/.pi/agent/skills
