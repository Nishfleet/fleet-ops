# The weekly prune uses the same policy as the backup unit, from
# /etc/restic/retention.env, instead of its own 7d/5w/12m line without
# --group-by. The integrity check line is unchanged (%% is a literal %).
[Service]
EnvironmentFile=/etc/restic/retention.env
ExecStart=
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /usr/bin/restic forget $RESTIC_FORGET_ARGS
ExecStart=/usr/bin/flock -E 75 -w 900 /run/lock/restic-r2-backup.lock /usr/bin/restic check --read-data-subset=5%%
