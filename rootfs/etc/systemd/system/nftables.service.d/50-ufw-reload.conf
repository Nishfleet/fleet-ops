# fleet-ops#8258 / CONTAINER-WORKER.md section 4 — nftables.service's stock
# ExecStart AND ExecReload both run `nft -f /etc/nftables.conf`, whose stock
# `flush ruleset` line deletes ufw's live `ip`/`ip6 filter` tables on every
# start, restart or reload of this service. These two stock INI keys re-apply
# ufw's own ruleset immediately after every load, so the window is seconds
# and needs no memory. ExecReload lines are additive in systemd: this appends
# `ufw reload` after the stock `nft -f` reload command.
#
# The `+` prefix is required, not style: the unit sets ProtectSystem=full,
# which mounts /etc read-only inside the service's mount namespace, and
# `ufw reload` must write /etc/ufw/ufw.conf — an unprefixed ExecStartPost
# fails with "'/etc/ufw/ufw.conf' is not writable" and takes the whole
# service down (proven live 2026-09-22).
#
# Covers restart/reload on a running host; boot order is already safe
# (nftables.service is WantedBy=sysinit.target, ufw.service
# WantedBy=multi-user.target — the flush runs before ufw's tables exist).
# This file only ever re-invokes ufw's own reload; it writes no rules.
[Service]
ExecStartPost=+/usr/sbin/ufw reload
ExecReload=+/usr/sbin/ufw reload
