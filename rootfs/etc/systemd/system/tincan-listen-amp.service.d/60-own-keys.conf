# The other half of the agent lock, for this listener only (fleet-ops#9977):
# every other agent's login and every other relay identity. Its own login
# directory and its own tincan identity stay readable, and nothing else
# under /home is hidden, so a command it already runs still runs.
[Service]
InaccessiblePaths=%h/.config/tincan/claude-vps.json
InaccessiblePaths=%h/.config/tincan/command-code.json
InaccessiblePaths=%h/.config/tincan/cursor-vps.json
InaccessiblePaths=%h/.config/tincan/devin-vps.json
InaccessiblePaths=%h/.config/tincan/fleet-worker.json
InaccessiblePaths=%h/.config/tincan/hermes.json
InaccessiblePaths=%h/.config/tincan/hermes-webhook.secret
InaccessiblePaths=%h/.config/tincan/opencode.json
InaccessiblePaths=%h/.config/tincan/pi.json
InaccessiblePaths=%h/.config/tincan/agentmail.key
InaccessiblePaths=%h/.claude
InaccessiblePaths=%h/.config/gh
InaccessiblePaths=%h/.pi
InaccessiblePaths=%h/.commandcode
InaccessiblePaths=%h/.cursor
InaccessiblePaths=%h/.devin
InaccessiblePaths=%h/.config/opencode
