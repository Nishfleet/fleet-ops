# The other half of the agent lock, for this listener only (#10813): every
# other agent's login and every other relay identity. Its own login directory
# and its own tincan identity stay readable, and nothing else under /home is
# hidden, so a command it already runs still runs. Unlike the pi listener this
# unit keeps the gh login readable: file_issue runs gh as Nish, so that one
# directory is in the contract's needs instead of here.
[Service]
InaccessiblePaths=-/home/nish/.config/tincan/amp.json
InaccessiblePaths=-/home/nish/.config/tincan/claude-vps.json
InaccessiblePaths=-/home/nish/.config/tincan/command-code.json
InaccessiblePaths=-/home/nish/.config/tincan/cursor-vps.json
InaccessiblePaths=-/home/nish/.config/tincan/devin-vps.json
InaccessiblePaths=-/home/nish/.config/tincan/fleet-worker.json
InaccessiblePaths=-/home/nish/.config/tincan/hermes.json
InaccessiblePaths=-/home/nish/.config/tincan/hermes-webhook.secret
InaccessiblePaths=-/home/nish/.config/tincan/opencode.json
InaccessiblePaths=-/home/nish/.config/tincan/pi.json
InaccessiblePaths=-/home/nish/.config/tincan/agentmail.key
InaccessiblePaths=-/home/nish/.claude
InaccessiblePaths=-/home/nish/.claude-vps
InaccessiblePaths=-/home/nish/.amp
InaccessiblePaths=-/home/nish/.commandcode
InaccessiblePaths=-/home/nish/.cursor
InaccessiblePaths=-/home/nish/.devin
InaccessiblePaths=-/home/nish/.config/opencode
