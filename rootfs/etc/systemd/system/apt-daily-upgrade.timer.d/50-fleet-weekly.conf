# Unattended-upgrades' own timer, moved to the Sunday quiet window its reboot
# takes (fleet-ops#11922). The stock Automatic-Reboot-Time is a time of day and
# cannot name a weekday (shutdown(8)), so the run itself is weekly.
#
# 03:00 leaves the upgrade half an hour to finish before the 03:30 reboot. An
# empty OnCalendar= clears the vendor's daily value before the Sunday one is
# added (systemd.timer(5), "OnCalendar="). Persistent=false keeps a missed
# Sunday from running at the next boot and scheduling a reboot outside the
# window.
[Timer]
OnCalendar=
OnCalendar=Sun *-*-* 03:00:00 Asia/Kolkata
RandomizedDelaySec=0
Persistent=false
