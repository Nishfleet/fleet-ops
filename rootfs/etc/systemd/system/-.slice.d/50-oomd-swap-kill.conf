# Last guard against a full-swap freeze, for the whole box. Ubuntu ships
# ManagedOOMSwap=auto on the root slice (10-oomd-root-slice-defaults.conf), so
# systemd-oomd watched no cgroup for swap; Fedora ships kill here. With kill,
# once swap use passes oomd's SwapUsedLimit (90%), oomd ends the cgroup that
# holds the most swap. This is the job earlyoom does; Fedora replaced earlyoom
# with systemd-oomd in Fedora 34, so no second killer runs here. The pressure
# rules on user-1000.slice and agent.slice stay the first line. Context: on
# 2026-09-24/25 runners filled all 8G of swap and the box thrashed
# (fleet-ops#8638). Check: oomctl lists / under "Swap Monitored CGroups".
[Slice]
ManagedOOMSwap=kill
