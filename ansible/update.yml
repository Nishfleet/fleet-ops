# Daily update of the user-level tools that have no updater of their own,
# run by fleet-update.service. Everything else updates itself:
# - Ubuntu packages: unattended-upgrades (Ubuntu's default; a pending reboot is
#   taken at 03:30 on Sunday, see rootfs/etc/apt/apt.conf.d/52fleet-unattended-upgrades).
# - Container images: digest-pinned, bumped by Renovate PRs (.github/renovate.json).
# - Claude Code: its own background auto-updater.
# - Cua Spaces: pinned in host.yml, bumped by Renovate PRs, installed by the host play.
- name: Update npm and uv tools
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Update each tool through its own updater  # noqa: no-changed-when
      become: true
      become_user: nish
      environment:
        HOME: /home/nish
        PATH: /home/nish/.local/bin:/usr/local/bin:/usr/bin:/bin
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [npm, update, --global]
        - [uv, tool, upgrade, --all]
      timeout: 900
