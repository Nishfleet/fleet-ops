# Daily update of the user-level tools that have no updater of their own,
# run by fleet-update.service. Everything else updates itself:
# - Ubuntu packages: unattended-upgrades (Ubuntu's default, never reboots).
# - Container images: podman-auto-update.timer, for containers labelled
#   AutoUpdate=registry.
# - Claude Code: its own background auto-updater.
- name: Update npm and uv tools
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Update each tool through its own updater
      become: true
      become_user: nish
      environment:
        HOME: /home/nish
        PATH: /home/nish/.local/bin:/usr/local/bin:/usr/bin:/bin
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [npm, update, --global]
        - [uv, tool, upgrade, --all]
      timeout: 900
