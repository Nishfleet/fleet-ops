# Weekly update of the user-level tools that have no updater of their own,
# run by fleet-update.service in the Sunday maintenance window. Everything else:
# - Ubuntu packages: unattended-upgrades (Ubuntu's default) at Sunday 03:00;
#   the window's restart is fleet-reboot.timer at 04:00, see
#   rootfs/etc/systemd/system/fleet-reboot.timer.
# - Container images: digest-pinned, bumped by Renovate PRs (.github/renovate.json).
# - Claude Code: its own background auto-updater.
# - Cua Spaces: pinned in host.yml, bumped by Renovate PRs, installed by the host play.
- name: Update the user-level tools
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Update each tool through its own updater  # noqa: no-changed-when
      become: true
      become_user: nish
      environment:
        HOME: /home/nish
        PATH: /home/nish/.local/bin:/home/nish/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [npm, update, --global]
        - [uv, tool, upgrade, --all]
        - [rustup, update]
        - [bun, upgrade]
        - [rclone, selfupdate]
        - [gh, extension, upgrade, --all]
      timeout: 900
