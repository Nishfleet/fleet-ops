# Python CLIs that agents and their skills run, each in its own uv tool
# environment (https://docs.astral.sh/uv/guides/tools/). creates: skips a tool
# that is already installed, and fleet-update's `uv tool upgrade --all` keeps
# them current. yt-dlp: the research skills. zizmor: workflow audits.
# html2text, semgrep, pytest, pipx: agents run them.
- name: Install the uv tools agents run
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/uv", tool, install, "{{ item }}"]
    creates: "{{ nish_home }}/.local/bin/{{ item }}"
  loop:
    - yt-dlp
    - zizmor
    - html2text
    - semgrep
    - pytest
    - pipx
  timeout: 600

- name: Create the Chrome DevTools MCP install directory
  become: true
  become_user: nish
  ansible.builtin.file:
    path: "{{ chrome_devtools_mcp_dir }}"
    state: directory
    mode: "0755"

- name: Copy the Chrome DevTools MCP package.json and package-lock.json
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/chrome-devtools-mcp/{{ item }}"
    dest: "{{ chrome_devtools_mcp_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - package.json
    - package-lock.json
  register: chrome_devtools_pins

- name: Look for the installed Chrome DevTools MCP server
  become: true
  become_user: nish
  ansible.builtin.stat:
    path: "{{ chrome_devtools_mcp_dir }}/node_modules/.bin/chrome-devtools-mcp"
  register: chrome_devtools_installed

- name: Install the pinned Chrome DevTools MCP server from the lockfile  # noqa: no-changed-when
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/npm", ci, --ignore-scripts, --no-audit, --no-fund]
    chdir: "{{ chrome_devtools_mcp_dir }}"
  timeout: 300
  when: chrome_devtools_pins.changed or not chrome_devtools_installed.stat.exists

- name: Link the Chrome DevTools MCP server into nish's ~/.local/bin
  become: true
  become_user: nish
  ansible.builtin.file:
    src: "{{ chrome_devtools_mcp_dir }}/node_modules/.bin/chrome-devtools-mcp"
    dest: "{{ chrome_devtools_mcp_bin }}"
    state: link

- name: Create the shared MCP config directory
  become: true
  become_user: nish
  ansible.builtin.file:
    path: "{{ nish_home }}/.config/mcp"
    state: directory
    mode: "0755"

- name: Read the shared MCP config
  become: true
  become_user: nish
  ansible.builtin.slurp:
    src: "{{ nish_home }}/.config/mcp/mcp.json"
  register: shared_mcp
  failed_when: false
  diff: false

- name: Install the shared MCP config (Pi reads it through pi-mcp-adapter)
  become: true
  become_user: nish
  ansible.builtin.copy:
    content: "{{ shared_next | to_nice_json(indent=2) }}\n"
    dest: "{{ nish_home }}/.config/mcp/mcp.json"
    mode: "0600"
  vars:
    shared_now: "{{ (shared_mcp.content | default('e30=') | b64decode | from_json) }}"
    shared_servers: "{{ (shared_now.mcpServers | default({})) | combine({'chrome-devtools': {'command': chrome_devtools_mcp_bin, 'args': chrome_devtools_mcp_args, 'lifecycle': 'lazy', 'idleTimeout': 5}}) }}"
    shared_next: "{{ shared_now | combine({'mcpServers': shared_servers}) }}"
  when: shared_next != shared_now
  diff: false

- name: Read Claude Code's drive entry
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/claude", mcp, get, drive]
  register: drive_entry
  changed_when: false
  failed_when: false
  check_mode: false
  timeout: 60

# The drive filesystem server is retired here (fleet-ops#11862): it duplicates
# Claude Code's own file tools and its npx launcher is not on a detached job's
# PATH, so the server cannot start there. This drops the entry Claude Code's
# user config still carries; a run whose entry is already gone is fine. Cursor's
# copy needed no matching task: the Cursor swap task left with the Cursor lane
# (fleet-ops#10580), so these two tasks are the only drive-entry readers left
# in the repo.
- name: Drop the retired drive entry from Claude Code's user config  # noqa: no-changed-when
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/claude", mcp, remove, drive, --scope, user]
  when: drive_entry.rc == 0
  timeout: 60

- name: Read Hermes' config
  become: true
  become_user: nish
  ansible.builtin.slurp:
    src: "{{ nish_home }}/.hermes/config.yaml"
  register: hermes_config
  failed_when: false
  diff: false

- name: Add the chrome-devtools entry under Hermes' mcp_servers
  become: true
  become_user: nish
  ansible.builtin.lineinfile:
    path: "{{ nish_home }}/.hermes/config.yaml"
    insertafter: '^mcp_servers:$'
    line: "  chrome-devtools: {command: {{ chrome_devtools_mcp_bin }}, args: [{{ chrome_devtools_mcp_args | join(', ') }}], enabled: true}"
    regexp: '^  chrome-devtools: \{'
  vars:
    hermes_text: "{{ hermes_config.content | default('') | b64decode }}"
  when: hermes_text is search('(?m)^mcp_servers:$') and hermes_text is not search('(?m)^  chrome-devtools:')
  diff: false

# Webhook runs get Hermes' narrow default toolset, with no terminal, so a Tincan
# wake had only cua's Space shell, and that cannot reach Docker inside the
# sandbox.conf lock. Hermes documents a per-route `toolsets` key as a manual edit
# of webhook_subscriptions.json, and the list replaces the default:
# https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/messaging/webhooks.md#per-route-toolsets
# Only the tincan route gets it: its senders are relay-approved fleet agents.
- name: Read Hermes' webhook subscriptions
  become: true
  become_user: nish
  ansible.builtin.slurp:
    src: "{{ nish_home }}/.hermes/webhook_subscriptions.json"
  register: hermes_webhooks
  failed_when: false
  no_log: true

- name: Give the tincan webhook route Hermes' terminal
  become: true
  become_user: nish
  ansible.builtin.copy:
    dest: "{{ nish_home }}/.hermes/webhook_subscriptions.json"
    content: "{{ subs | combine({'tincan': subs.tincan | combine({'toolsets': wanted})}) | to_nice_json(indent=2) }}\n"
    mode: "0600"
  vars:
    subs: "{{ hermes_webhooks.content | b64decode | from_json }}"
    wanted: [terminal, web, vision, clarify, x_search]
  when: hermes_webhooks.content is defined and subs.tincan is defined and subs.tincan.toolsets | default([]) != wanted
  no_log: true

- name: Read Hermes' scheduled jobs
  become: true
  become_user: nish
  ansible.builtin.slurp:
    src: "{{ nish_home }}/.hermes/cron/jobs.json"
  register: hermes_jobs
  failed_when: false
  diff: false
  no_log: true

- name: Delete the retired jobs from Hermes' cron store  # noqa: no-changed-when
  become: true
  become_user: nish
  ansible.builtin.command:
    argv:
      - "{{ nish_home }}/.local/bin/hermes"
      - cron
      - remove
      - "{{ item }}"
  environment: "{{ nish_env }}"
  loop: "{{ hermes_retired_jobs | select('in', hermes_jobs_ids) | list }}"
  vars:
    hermes_jobs_ids: >-
      {{ (hermes_jobs.content | default('e30=') | b64decode | from_json).jobs
         | default([]) | map(attribute='id') | list }}

- name: Apply config/hermes/digest-*.md to the live digest jobs
  become: true
  become_user: nish
  ansible.builtin.command:
    argv:
      - "{{ nish_home }}/.local/bin/hermes"
      - cron
      - edit
      - "{{ job.id }}"
      - --prompt
      - "{{ wanted }}"
  environment: "{{ nish_env }}"
  loop: "{{ digest_prompts }}"
  loop_control:
    loop_var: digest
    label: "{{ digest }}"
  vars:
    job: "{{ (hermes_jobs.content | default('e30=') | b64decode | from_json).jobs | default([]) | selectattr('name', 'equalto', digest) | first | default({}) }}"
    wanted: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../config/hermes/' ~ digest ~ '.md') | regex_replace('\\n+$', '') }}"
  when: job.id is defined and (job.prompt | default('')) != wanted
  changed_when: true

- name: Read Hermes' scheduled jobs again
  become: true
  become_user: nish
  ansible.builtin.slurp:
    src: "{{ nish_home }}/.hermes/cron/jobs.json"
  register: hermes_jobs_after
  failed_when: false
  diff: false
  no_log: true

- name: Link the packaged gh into nish's ~/.local/bin
  become: true
  become_user: nish
  ansible.builtin.file:
    path: "{{ nish_home }}/.local/bin/gh"
    src: /usr/bin/gh
    state: link
    force: true
