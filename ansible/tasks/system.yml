# nish's user units run with nobody logged in only while lingering is on
# (loginctl(1), enable-linger). It was set by hand, so a fresh box had no user manager.
- name: Keep nish's user manager running without a login
  ansible.builtin.command: loginctl enable-linger nish
  args:
    creates: /var/lib/systemd/linger/nish

- name: Install systemd user-manager drop-ins
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/systemd/user/"
    dest: /etc/systemd/user/
    owner: root
    group: root
    mode: preserve
  notify: Reload nish's user manager

- name: Install systemd-oomd config
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/systemd/oomd.conf.d/"
    dest: /etc/systemd/oomd.conf.d/
    owner: root
    group: root
    mode: preserve
  notify: Restart systemd-oomd

- name: Install journald config
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/systemd/journald.conf.d/"
    dest: /etc/systemd/journald.conf.d/
    owner: root
    group: root
    mode: preserve
  notify: Restart journald

- name: Install tmpfiles.d entries
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/tmpfiles.d/"
    dest: /etc/tmpfiles.d/
    owner: root
    group: root
    mode: preserve

# Rotates the two ansible-pull play logs (ANSIBLE_LOG_PATH of both play units,
# /var/lib/fleet-ops/fleet-{host-config,update}.log), which used to grow past
# 60 MB and be readable by every local user (fleet-ops#11863). logrotate(8).
- name: Install logrotate's config for the play logs
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/logrotate.d/"
    dest: /etc/logrotate.d/
    owner: root
    group: root
    mode: preserve

# Both play units point ANSIBLE_LOG_PATH at these logs (the journal's cap
# rotated a run's tail away once). This creates them owner-only here, so the
# file is 0600 before anything renders into it and cannot go back to
# world-readable while the log grows unrotated.
- name: Create the play logs owner-only before anything renders into them
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  loop:
    - /var/lib/fleet-ops/fleet-host-config.log
    - /var/lib/fleet-ops/fleet-update.log
  # A --check run on a box without the StateDirectory yet has no log path.
  ignore_errors: "{{ ansible_check_mode }}"

# Read before the apply below, so the final check sees the state the run found, not
# the state the repair left (fleet-ops#11120).
- name: Read the config dirs' owner as the apply found it
  ansible.builtin.stat:
    path: "{{ nish_home }}/{{ item }}"
    follow: false
  loop:
    - .config
    - .config/cloudflare
  register: config_dirs_found

# In place of the retired Create tmpfiles handler, which fired only when a tmpfiles.d
# file changed: this applies them on every run, so a recreation between applies cannot
# leave nish's own processes unable to create config dirs (fleet-ops#11120).
# systemd-tmpfiles refuses an unsafe path transition, such as a link to a directory
# another user owns, where a root file task would chown through it.
- name: Apply tmpfiles on every run
  ansible.builtin.command: /usr/bin/systemd-tmpfiles --create
  changed_when: false

# rootless podman (the quadlet containers in tasks/user-files.yml) needs
# newuidmap for its user namespace (uidmap(1)); the drop-in
# 90-podman-newuidmap.conf whitelists it for the user sandbox.
- name: Install uidmap for rootless podman
  ansible.builtin.apt:
    name:
      - uidmap
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

# Laptop packages a VPS never uses: battery power (upower), device firmware
# updates (fwupd; the provider owns this host's firmware), Intel thermal control
# (thermald), Thunderbolt (bolt) and iPhone USB (usbmuxd). samba went 2026-11-02: the share was an empty folder no client had opened since 2026-10-23.
# The cloud image also ships guest tools for hypervisors this KVM host is not on:
# VMware (open-vm-tools), LXD (lxd-agent-loader, lxd-installer), and iSCSI disks
# (open-iscsi), which it has none of. packagekit stays because
# software-properties-common depends on it.
- name: Remove laptop and other-hypervisor packages
  ansible.builtin.apt:
    name:
      - upower
      - fwupd
      - fwupd-signed
      - thermald
      - bolt
      - usbmuxd
      - open-vm-tools
      - open-iscsi
      - lxd-agent-loader
      - lxd-installer
      - samba
      - samba-vfs-modules
    state: absent
    purge: true
    lock_timeout: 300

# The graphical desktop: KDE Plasma, the XFCE "Bot Desktop" and the TigerVNC
# server. Nothing on the box uses a display: Hermes and Tether do computer use in
# Cua cloud Spaces, and Chrome runs headless (fleet-ops#10935). autoremove takes
# the libraries only these packages pulled in. xrdp and xorg were never installed
# and are listed so a stray install goes too.
- name: Remove the graphical desktop
  ansible.builtin.apt:
    name:
      - plasma-desktop
      - plasma-workspace
      - kwin-x11
      - breeze
      - dolphin
      - konsole
      - xfce4-panel
      - xfce4-settings
      - xfdesktop4
      - xfwm4
      - tigervnc-common
      - tigervnc-standalone-server
      - tigervnc-tools
      - xrdp
      - xorg
      - x11-apps
      - x11-utils
      - x11-xkb-utils
      - x11-xserver-utils
      - xauth
      - dbus-x11
    state: absent
    purge: true
    autoremove: true
    lock_timeout: 300

# Installed before the purge below so autoremove keeps them. psql and
# pg_restore: final-checks logs in to the router's database with psql, and the
# restore test reads the router dump with pg_restore. file: agents run it (26
# sessions in October); only ImageMagick pulled it in.
# The rest are what agent skills import or call (owner 2026-11-05: a clean-up
# deleted them once because no unit used them):
# - python3-bs4, python3-lxml, python3-defusedxml, python3-openpyxl,
#   python3-pypdf, python3-pil: the docx, pptx, xlsx and pdf document skills.
# - python3-numpy: hyperframes-creative's audio script.
# - libreoffice-*-nogui (soffice), poppler-utils (pdftoppm), qpdf, pandoc: the
#   document skills, headless builds so no desktop comes back.
# - ffmpeg: hyperframes-*, media-use, last30days, product-launch-video.
- name: Install the Postgres client, file and the tools agent skills call
  ansible.builtin.apt:
    name:
      - postgresql-client
      - file
      - python3-bs4
      - python3-lxml
      - python3-defusedxml
      - python3-openpyxl
      - python3-pypdf
      - python3-pil
      - python3-numpy
      - libreoffice-writer-nogui
      - libreoffice-calc-nogui
      - libreoffice-impress-nogui
      - poppler-utils
      - qpdf
      - pandoc
      - ffmpeg
    state: present
    lock_timeout: 300

# Packages nothing on the box uses (owner's package review, fleet-ops#10935):
# the system Postgres and Redis (the router runs its own in podman; the system
# ones are disabled), WebKit and GStreamer libraries left by a Playwright
# install-deps (only Chromium is installed, and Chrome brings its own deps),
# ImageMagick, native-build tools no build here calls (cmake, ninja, autoconf),
# the old desktop's VNC viewer, X core fonts and UI fonts, and Ubuntu extras no
# one runs (byobu, screen, landscape, pollinate, sosreport, GPU drivers tool).
# The GStreamer base plugins, libhyphen0, libharfbuzz-icu0 and libwebpdemux2 are
# not listed: LibreOffice and Pillow above depend on them, and removing a
# library removes the packages that depend on it.
# rootlesskit and slirp4netns were the retired eval engine dockerd-eval's
# runtime, with only that unit calling them (fleet-ops#11853).
- name: Remove packages nothing on the box uses
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-16
      - postgresql-contrib
      - redis-server
      - redis-tools
      - imagemagick
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-good
      - libgstreamer-gl1.0-0
      - libgstreamer-plugins-bad1.0-0
      - libmanette-0.2-0
      - libwoff1
      - libenchant-2-2
      - libavif16
      - libevent-2.1-7t64
      - cmake
      - ninja-build
      - autoconf
      - libcurl4-gnutls-dev
      - byobu
      - screen
      - landscape-common
      - pollinate
      - xtightvncviewer
      - xorriso
      - p7zip-full
      - parallel
      - pass
      - git-lfs
      - gettext
      - sosreport
      - ubuntu-drivers-common
      - net-tools
      - duf
      - btop
      - fonts-inter
      - fonts-jetbrains-mono
      - xfonts-cyrillic
      - xfonts-scalable
      - rootlesskit
      - slirp4netns
    state: absent
    purge: true
    autoremove: true
    lock_timeout: 300

# The nftables include directory (/etc/nftables.d/*.nft is pulled in by
# nftables.conf) holds tether's Cua Space fence file, rendered by
# tasks/tether.yml.
- name: Create the nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install sysctl settings
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/sysctl.d/
    owner: root
    group: root
    mode: preserve
  loop: "{{ query('ansible.builtin.fileglob', rootfs ~ '/etc/sysctl.d/*.conf') }}"
  register: sysctl_files

# Applies only the file that changed. `sysctl --system` would also re-apply
# the provider image's files, which README keeps a Nish-only action.
- name: Apply a changed sysctl file  # noqa: no-changed-when
  ansible.builtin.command: /usr/sbin/sysctl -p /etc/sysctl.d/{{ item.item | basename }}
  loop: "{{ sysctl_files.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item | basename }}"

- name: Install audit rules
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/audit/rules.d/"
    dest: /etc/audit/rules.d/
    owner: root
    group: root
    mode: preserve
  notify: Load audit rules

- name: Install the nftables ruleset
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/nftables.conf"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: preserve
  notify: Reload nftables

# The postgres account is a package leftover with no login use: set its shell
# to nologin. Only when the account exists; this never creates it.
- name: Look up the postgres account
  ansible.builtin.getent:
    database: passwd
    key: postgres
    fail_key: false
  register: postgres_passwd

- name: Set the postgres account shell to nologin
  ansible.builtin.user:
    name: postgres
    shell: /usr/sbin/nologin
  when: postgres_passwd.ansible_facts.getent_passwd.postgres is not none

- name: Install the htpdate options
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/default/htpdate"
    dest: /etc/default/htpdate
    owner: root
    group: root
    mode: preserve
  notify: Restart htpdate
