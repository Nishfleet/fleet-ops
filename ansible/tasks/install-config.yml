# ansible-pull's own clone (/var/lib/fleet-ops/repo) is the read-only
# checkout that user units can read (fleet-ops#10479): root owns it, no
# worktree is attached to it, and every deploy moves it to the merged
# commit. UMask=0077 (20-umask.conf) leaves its newer files 0600, which
# locked readers out once already (#10472), so this makes the whole tree
# readable and not writable by anyone but root.
- name: Make the deploy checkout readable by every user and writable by root only
  ansible.builtin.file:
    path: "{{ (playbook_dir ~ '/..') | realpath }}"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: "u=rwX,go=rX"

- name: Check the prometheus config before installing it
  ansible.builtin.command: /usr/bin/promtool check config {{ rootfs }}/etc/prometheus/prometheus.yml
  changed_when: false
  check_mode: false  # read-only; runs under --check too

- name: Check the alertmanager config before installing it
  ansible.builtin.command: /usr/bin/amtool check-config {{ rootfs }}/etc/alertmanager/alertmanager.yml
  changed_when: false
  check_mode: false  # read-only; runs under --check too

- name: Check the nftables ruleset before installing it
  ansible.builtin.command: /usr/sbin/nft -c -f {{ rootfs }}/etc/nftables.conf
  changed_when: false
  check_mode: false  # read-only; runs under --check too

# GitHub's public commit-signing keys (https://github.com/web-flow.gpg), so
# root can run `git verify-commit` on what ansible-pull fetches. Two keys,
# both matching keys.openpgp.org. Current, signs squash and merge commits:
# 9684 79A1 AFF9 27E3 7D1A  566B B569 0EEE BB95 2194. Expired 2024-01-16,
# kept for older history: 5DE3 E050 9C47 EA3C F04A  42D3 4AEE 18F8 3AFD EB23.
# The import into root's keyring is idempotent: gpg reports "imported" only
# the first time.
- name: Import GitHub's commit-signing keys into root's keyring
  ansible.builtin.command: /usr/bin/gpg --batch --import {{ playbook_dir }}/files/github-web-flow.gpg
  environment:
    LC_ALL: C
  register: github_signing_keys
  changed_when: "'imported:' in github_signing_keys.stderr"

# Per-role Claude Code allow lists (fleet-ops#9502). tincan-listen-claude-vps
# passes --settings at /etc/claude-code/roles/tincan-listener.json, so this
# copy must exist on the box before that user unit is restarted after merge.
# claude remote-control refuses --settings; spawned sessions read
# ~/.claude/settings.json. The remote-control.json file here is the list in
# the repo, not a path that unit loads.
- name: Install the per-role Claude permission allow lists
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/claude-code/roles/"
    dest: /etc/claude-code/roles/
    owner: root
    group: root
    mode: preserve
    validate: /usr/bin/python3 -c 'import json,sys; sys.exit(0 if isinstance(json.load(open(sys.argv[1])), dict) else 1)' %s

# Restic backup include and exclude lists and the retention policy
# (config/restic/). The backup and maintenance units read them from
# /etc/restic/ on every run, so they are installed before the unit drop-ins
# that name retention.env; a change here is live after
# the next fleet-host-config run, no daemon-reload needed. README.md is not
# copied: it is repo documentation, not box config. Rendered as templates
# so newer lines can name the home directory through nish_home. Keep
# Jinja markers ({{, {% and {#) out of their comments and patterns.
- name: Install restic include, exclude and retention files
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../config/restic/{{ item }}"
    dest: /etc/restic/{{ item }}
    owner: root
    group: root
    mode: '0644'
  loop:
    - include.txt
    - exclude.txt
    - retention.env

# A socket takes new ListenStream addresses only on restart. This copy runs before
# the tree copy below, which would otherwise write the file first and leave this
# task with no change to signal (fleet-ops#10541).
- name: Create the ssh.socket drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the SSH socket bind and rebind the socket when it changes
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/systemd/system/ssh.socket.d/override.conf"
    dest: /etc/systemd/system/ssh.socket.d/override.conf
    owner: root
    group: root
    mode: preserve
  notify:
    - Reload systemd
    - Restart ssh.socket

# The runner's sandbox (TemporaryFileSystem=, BindReadOnlyPaths=, InaccessiblePaths=) is
# read once, when the unit starts, so an installed drop-in reaches no runner that is
# already running. On 2026-10-29 the read-only deploy-clone bind had been installed for
# hours while every runner still started before it, so a job could write the clone
# (fleet-ops#10866). Restarting the pool to install it cut three hand-offs mid-session on
# the same day (fleet-ops#10898), so this play reloads the daemon and restarts no runner:
# every running job keeps running, and the drop-in arrives at the next start, which the
# nightly update performs after it drains the runners. The deploy job is not one of those
# jobs: deploy-box.yml runs it on [self-hosted, fleet-ci].
- name: Install the agent runner sandbox
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-.service.d/"
    dest: /etc/systemd/system/actions.runner.Nishfleet.netcup-agent-.service.d/
    owner: root
    group: root
    mode: preserve
  notify: Reload systemd

- name: Install systemd units, slices and drop-ins
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/systemd/system/"
    dest: /etc/systemd/system/
    owner: root
    group: root
    mode: preserve
  notify: Reload systemd

# A review runner drop-in loads the reviewer App key, so a unit that can still take a
# worker job is a second identity that can post an approval on its own PR
# (fleet-ops#9521). GitHub routes a job by the runner's labels, and the labels live at
# GitHub, not here: the technical lead adds `review` to netcup-agent-11 and -12 and drops
# `agent` and `fleet-ops` from them by hand, which he did on 2026-10-29 before this merged.
# The read below is what decides, so a runner that still carries a worker label keeps its
# drop-in off, the unit keeps running as nish on the nish runner directory, and no worker
# job meets the reviewer key. The org endpoint is the one that lists these runners, the
# same one update.yml counts them from, and it is read as nish because that is the login
# the box's other GitHub reads use. No answer at all holds them back too: a check that
# waves itself through when it cannot run is not a check (fleet-ops#10144).
- name: Read the labels GitHub holds for the two new review runners
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command:
    argv:
      - gh
      - api
      - orgs/Nishfleet/actions/runners
      - --paginate
      - --jq
      - '.runners[] | select(.name == "netcup-agent-11" or .name == "netcup-agent-12") | select(any(.labels[]; .name == "review") and all(.labels[]; .name != "agent" and .name != "fleet-ops")) | .name'
  register: new_review_runner_labels
  # One API blip must not hold a rollout back for a whole deploy cycle, and the
  # count in update.yml retries this same endpoint for the same reason.
  until: new_review_runner_labels.rc == 0
  retries: 3
  delay: 20
  changed_when: false
  ignore_errors: true

# The copy above installs every drop-in rootfs/ ships, so the two new ones are taken back
# here while their runner can still take a worker job. host.yml: copy never deletes, and
# removing a live file is a reviewed PR that deletes it in rootfs/ and adds a
# `state: absent` task for it, which is what this is. The reload is notified here and not
# left to the copy above, because systemd forgets a drop-in only on a daemon-reload and the
# copy reports `ok` once the file is already on the box, which would leave a held drop-in
# loaded until the nightly restart. The unit reads the drop-in at its next start, which the
# nightly update performs after it drains the runners (fleet-ops#10898). A held drop-in
# leaves the unit inert as a review runner, which is where the pool was before this change,
# and the drift check in retired-and-drift.yml passes because a file the box does not have
# is not a hand install.
- name: Hold the two new review runner drop-ins back until both are review-only
  ansible.builtin.file:
    path: /etc/systemd/system/actions.runner.Nishfleet.netcup-agent-{{ item }}.service.d/30-review-user.conf
    state: absent
  loop: [11, 12]
  notify: Reload systemd
  when: >-
    new_review_runner_labels.rc | default(1) != 0
    or (new_review_runner_labels.stdout_lines | default([]) | sort) != ['netcup-agent-11', 'netcup-agent-12']

# fleet-update.service reads the healthchecks.io success-ping URL from a
# root-only curl config; the URL is not named in the repo (fleet-ops#9965).
- name: Make the directory for the update unit's root-only files
  ansible.builtin.file:
    path: /etc/fleet-ops
    state: directory
    owner: root
    group: root
    mode: '0755'

# The update's own healthchecks ping URL lives with the box's other ping
# URLs in the keystone env file, so one paste covers it once the check
# exists (creating the check needs the healthchecks.io account; no API key
# is on the box). Only the HC_URL_UPDATE line is handed to the unit, so
# the update unit cannot ping the other checks. A missing line leaves the
# mirror absent, the unit pings SKIP, and its check simply goes stale,
# which is the alert.
- name: Read the healthchecks ping URLs nish keeps for the box
  ansible.builtin.slurp:
    src: "{{ nish_config }}/fleet-ops/keystone-hc.env"
  register: hc_env_source
  failed_when: false
  no_log: true

# Written as a curl config (`url = <URL>`), so the unit pings with a
# plain `curl --config` and the URL stays out of argv.
- name: Hand the update unit its own healthchecks URL, root-only
  vars:
    hc_update_lines: "{{ (hc_env_source.content | default('') | b64decode).splitlines() | select('match', '^HC_URL_UPDATE=') | list }}"
  ansible.builtin.copy:
    dest: /etc/fleet-ops/update-hc.curl
    content: "url = {{ hc_update_lines | first | regex_replace('^HC_URL_UPDATE=', '') }}\n"
    owner: root
    group: root
    mode: '0600'
  when: hc_update_lines | length > 0
  diff: false
  no_log: true
