# Pilot (fleet-ops#10451): runner 1 runs as a service user with no sudo and no group
# in common with nish. Its drop-in is rootfs/etc/systemd/system/
# actions.runner.Nishfleet.netcup-agent-1.service.d/30-pilot-user.conf. The registration
# is copied once: only while the copy has no runsvc.sh, so a re-run never overwrites the
# runner's live state.
- name: Create the pilot runner user
  ansible.builtin.user:
    name: fleet-runner
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-runner
    create_home: true

- name: Copy runner 1 to the pilot user once
  ansible.builtin.copy:
    src: "{{ nish_home }}/.local/share/agent-runner/1/"
    dest: /var/lib/fleet-runner/1/
    remote_src: true
    local_follow: false
    owner: fleet-runner
    group: fleet-runner
    mode: preserve
    directory_mode: '0750'
  when:
    - (nish_home ~ '/.local/share/agent-runner/1/runsvc.sh') is exists
    - "'/var/lib/fleet-runner/1/runsvc.sh' is not exists"
  notify:
    - Reload systemd

# The copy keeps `bin` and `externals` as the absolute links they are under
# nish's home, which fleet-runner cannot enter (mode 0750), so runsvc.sh exited
# at once and the unit crash-looped (fleet-ops#10491). Point them at their
# sibling directories instead. A link that is already relative is left alone.
- name: Read the pilot runner links
  ansible.builtin.stat:
    path: "/var/lib/fleet-runner/1/{{ item }}"
  loop: [bin, externals]
  register: pilot_links

- name: Point the pilot runner links at the copy
  ansible.builtin.file:
    src: "{{ item.stat.lnk_target | basename }}"
    dest: "{{ item.stat.path }}"
    state: link
    owner: fleet-runner
    group: fleet-runner
  loop: "{{ pilot_links.results | selectattr('stat.lnk_target', 'defined') | selectattr('stat.lnk_target', 'match', '^' ~ nish_home ~ '/') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"

# The copied runner `.env` pins HOME, XDG_RUNTIME_DIR and CLAUDE_CONFIG_DIR to nish's
# paths, and the runner loads it over the unit's own HOME, so every job's gh read
# nish's .config/gh/config.yml and died with permission denied (fleet-ops#10510).
# HOME goes to the pilot's own; the other two point at nish's runtime and Claude seat,
# so they are dropped.
- name: Give the pilot runner its own HOME in the runner environment
  ansible.builtin.lineinfile:
    path: /var/lib/fleet-runner/1/.env
    regexp: '^HOME='
    line: HOME=/var/lib/fleet-runner
    insertbefore: BOF
  when: "'/var/lib/fleet-runner/1/.env' is exists"

- name: Drop nish's runtime paths from the pilot runner environment
  ansible.builtin.lineinfile:
    path: /var/lib/fleet-runner/1/.env
    regexp: '^(XDG_RUNTIME_DIR|CLAUDE_CONFIG_DIR)='
    state: absent
  when: "'/var/lib/fleet-runner/1/.env' is exists"

# Runner 1 is still registered with the `agent` label, so a running unit takes production
# jobs it cannot run (42 failed on 2026-10-28, fleet-ops#10706). Until it is re-registered
# with a pilot-only label and passes its own test job, a deploy leaves it stopped and
# disabled, and a change to the pilot tasks never starts it. The stop waits up to
# TimeoutStopSec (5 min) for a running job. Switch off: delete this task, in the same PR
# that re-registers runner 1 with a pilot-only label, then start the unit.
- name: Leave the pilot runner stopped while it carries the agent label
  ansible.builtin.systemd_service:
    name: actions.runner.Nishfleet.netcup-agent-1.service
    enabled: false
    state: stopped
  when: "'/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-1.service' is exists"

# The stop waits for a running job (TimeoutStopSec=5min), so no job is cut.
- name: Stop and disable the retired agent runners
  ansible.builtin.systemd_service:
    name: "actions.runner.Nishfleet.netcup-agent-{{ item }}.service"
    enabled: false
    state: stopped
  loop: "{{ agent_runner_retired_ids }}"
  when: ('/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-' ~ item ~ '.service') is exists

- name: Remove the retired agent runner units
  ansible.builtin.file:
    path: "/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-{{ item }}.service"
    state: absent
  loop: "{{ agent_runner_retired_ids }}"
  notify: Reload systemd
