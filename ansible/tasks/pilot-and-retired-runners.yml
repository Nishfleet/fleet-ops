# The stop waits for a running job (TimeoutStopSec=5min), so no job is cut.
- name: Stop and disable the retired agent runners
  ansible.builtin.systemd_service:
    name: "actions.runner.Nishfleet.netcup-agent-{{ item }}.service"
    enabled: false
    state: stopped
  loop: "{{ agent_runner_retired_ids }}"
  when: ('/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-' ~ item ~ '.service') is exists

- name: Remove the retired agent runner units
  ansible.builtin.file:
    path: "/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-{{ item }}.service"
    state: absent
  loop: "{{ agent_runner_retired_ids }}"
  notify: Reload systemd

# A directory cannot deregister its runner on its own: `config.sh remove` needs a
# removal token from the same org permission the App lacks, and with that
# permission the REST call `DELETE /orgs/{org}/actions/runners/{id}` needs no
# directory. The live copies run from /var/lib/fleet-runner (tasks/runners.yml).
- name: Remove the retired runner directories
  ansible.builtin.file:
    path: "{{ agent_runner_root }}/{{ item }}"
    state: absent
  loop: "{{ agent_runner_retired_ids }}"

- name: Remove the review runner user
  ansible.builtin.user:
    name: fleet-reviewer
    state: absent
