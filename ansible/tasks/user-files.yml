# nish's user units, quadlets and config files, copied from this checkout on every
# deploy. This replaced fleet-sync.service and its deploy clone (fleet-ops#10935 E1);
# units that read repo files read them from this checkout, /var/lib/fleet-ops/repo.
# ansible.builtin.copy replaces a symlink at dest with the file (follow defaults to
# false). The router config and Grafana provisioning are tasks/services.yml's.
- name: Install nish's user units
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ repo_root }}/systemd/{{ item }}"
    dest: "{{ nish_home }}/.config/systemd/user/{{ item }}"
    mode: '0644'
  loop:
    - app-litellm.slice
    - app-litellm-postgres.slice
    - app-litellm-redis.slice
    - cloudflare-tokens-apply.service
    - cloudflare-tokens-apply.timer
    - fleet-grafana-github-token.service
    - fleet-grafana-github-token.timer
    - tincan-relay.service
    - tmux-spawn-.scope.d/50-interactive-cpu-priority.conf
  notify: Reload nish's user manager

# The read-only checkout of this repo that agents on the box read. One standalone
# clone that this task really moves to main each run: the git module updates only
# its own dest, never a checkout linked as a git worktree of a second checkout,
# which is how this tree sat at a 2026-11-01 HEAD, 51 commits behind, for nine
# days until a hand fast-forward (2026-11-10). No unit reads it any more — the
# deploy applies from ansible-pull's own pull directory, /var/lib/fleet-ops/repo
# (fleet-ops#10935 E1); only agents do. force adds --force to the fetch, so a
# moved upstream tag (v1) cannot stop the run with "would clobber existing tag".
# The retired deploy clone (fleet-ops#10935 E1) is not in `retired`: it may still
# be the parent of a linked worktree, so it waits for a checked hand delete.
# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/git_module.html
- name: Check whether the agents' checkout is a standalone clone
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.stat:
    path: "{{ nish_home }}/workspaces/tooling/fleet-ops/.git"
  register: fleet_ops_checkout_git

# A checkout linked as a git worktree of another checkout has a .git file, and
# the git module then fails on it (it reads the file as a separate git dir, finds
# no config there and clones into a directory that is not empty). Such a dest is
# removed here and re-cloned standalone below, in the same run, so the first
# deploy after this task lands is green instead of waiting for a hand delete.
- name: Remove the agents' checkout when it is a linked worktree
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.file:
    path: "{{ nish_home }}/workspaces/tooling/fleet-ops"
    state: absent
  when:
    - fleet_ops_checkout_git.stat.exists
    - not (fleet_ops_checkout_git.stat.isdir | default(false))

- name: Keep the agents' read-only fleet-ops checkout on main
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.git:
    repo: https://github.com/Nishfleet/fleet-ops.git
    dest: "{{ nish_home }}/workspaces/tooling/fleet-ops"
    version: main
    force: true

- name: Install nish's quadlets
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ repo_root }}/containers/quadlet/{{ item }}"
    dest: "{{ nish_home }}/.config/containers/systemd/{{ item }}"
    mode: '0644'
  loop:
    - fleet-grafana.container
    - fleet-litellm-postgres.container
    - fleet-litellm-redis.container
  notify:
    - Reload nish's user manager
    - Restart fleet-grafana

# Docker ran aiostreams as root, so its files are root's; rootless podman maps the
# container's root to nish, who must own them to write the database.
- name: Give nish the aiostreams data
  ansible.builtin.file:
    path: /srv/aiostreams/data
    state: directory
    owner: nish
    group: nish
    recurse: true

# Its own task, so only a change of this file restarts aiostreams.
- name: Install the aiostreams quadlet
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ repo_root }}/containers/quadlet/aiostreams.container"
    dest: "{{ nish_home }}/.config/containers/systemd/aiostreams.container"
    mode: '0644'
  notify:
    - Reload nish's user manager
    - Restart aiostreams

# Its own task, so only a change of this file (in practice the Image= line) runs LiteLLM's
# migration job and then the rolling restart, in the order host.yml lists the handlers.
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_handlers.html
# One copy per instance: podman 4.9 Quadlet has no template units, and the @<port> file name
# gives systemd the %i the quadlet uses for the port.
- name: Install the router quadlets
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ repo_root }}/containers/quadlet/fleet-litellm-proxy@.container"
    dest: "{{ nish_home }}/.config/containers/systemd/fleet-litellm-proxy@{{ item }}.container"
    mode: '0644'
  loop: "{{ litellm_proxy_ports }}"
  notify:
    - Reload nish's user manager
    - Migrate the litellm database
    - Restart litellm proxy

# The router's load balancer on 127.0.0.1:4000. After the retired-units step, which stops the old
# single router that held the port. Ubuntu's package, its own unit and reload.
- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present

- name: Install the HAProxy config
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/haproxy/haproxy.cfg"
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/haproxy -c -f %s
  notify: Reload haproxy

- name: Run HAProxy
  ansible.builtin.systemd_service:
    name: haproxy.service
    enabled: true
    state: started

- name: Install nish's agent and tool config files
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item.src }}"
    dest: "{{ nish_home }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - {src: AGENTS.md, dest: .pi/agent/AGENTS.md}
    - {src: config/pi-models.json, dest: .pi/agent/models.json}
    - {src: config/claude-agents/helper.md, dest: .claude/agents/helper.md}
    - {src: config/claude-agents/scout.md, dest: .claude/agents/scout.md}
    - {src: config/user-tmpfiles.d/agent-worktrees.conf, dest: .config/user-tmpfiles.d/agent-worktrees.conf}
    - {src: credentials/app-manifest.json, dest: .config/fleet-worker/app-manifest.json}
  loop_control:
    label: "{{ item.dest }}"

# pi rewrites its own keys in settings.json at runtime, so only .packages comes from the repo.
- name: Read pi's settings
  become: true
  become_user: nish
  ansible.builtin.slurp:
    src: "{{ nish_home }}/.pi/agent/settings.json"
  register: pi_settings

- name: Pin pi's packages from the repo
  become: true
  become_user: nish
  ansible.builtin.copy:
    content: "{{ (pi_settings.content | b64decode | from_json) | combine(lookup('ansible.builtin.file', repo_root ~ '/config/pi-packages.json') | from_json) | to_nice_json(indent=2) }}"
    dest: "{{ nish_home }}/.pi/agent/settings.json"
    mode: preserve
  when: (pi_settings.content | b64decode | from_json | combine(lookup('ansible.builtin.file', repo_root ~ '/config/pi-packages.json') | from_json)) != (pi_settings.content | b64decode | from_json)

- name: Apply nish's tmpfiles rules
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command: systemd-tmpfiles --user --create
  changed_when: false

- name: Apply the user manager reload before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable nish's user timers and services
  ansible.builtin.command:
    argv: [systemctl, --user, --machine=nish@.host, enable, --now, "{{ item }}"]
  loop:
    - cloudflare-tokens-apply.timer
    - fleet-grafana-github-token.timer
    - syncthing.service
    - tincan-relay.service
  changed_when: false
