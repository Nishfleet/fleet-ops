# The agent runner pool (fleet-ops#10935): fleet_runner_ids run as the unprivileged
# user fleet-runner through rootfs/etc/systemd/system/fleet-runner@.service, per
# GitHub's "Security hardening for self-hosted runners". Its home holds only the
# runner installs, pi, pi's model file and the scoped router key: no Claude, gh or
# Cloudflare login, no git credential and no App key. agent.yml mints the App token
# only on GitHub-hosted runners, which the worker cannot reach (fleet-ops#11715).
#
# Runners 1 and 15 reuse registrations copied once from nish's runner directory:
# only while the copy has no runsvc.sh, so a re-run never overwrites a live
# runner's state. Runners 2 to 14 were copied from runner 1's install and
# registered with `config.sh` and an org registration token minted by the
# nishfleet-worker App (GitHub docs: "Adding self-hosted runners").
- name: Create the runner user
  ansible.builtin.user:
    name: fleet-runner
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-runner
    create_home: true

- name: Stop nish's units for the runners that move to fleet-runner
  ansible.builtin.systemd_service:
    name: "actions.runner.Nishfleet.netcup-agent-{{ item }}.service"
    enabled: false
    state: stopped
  loop: "{{ fleet_runner_ids }}"
  when: ('/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-' ~ item ~ '.service') is exists

- name: Copy each runner registration to fleet-runner once
  ansible.builtin.copy:
    src: "{{ agent_runner_root }}/{{ item }}/"
    dest: "/var/lib/fleet-runner/{{ item }}/"
    remote_src: true
    local_follow: false
    owner: fleet-runner
    group: fleet-runner
    mode: preserve
    directory_mode: '0750'
  loop: "{{ fleet_runner_ids }}"
  when:
    - (agent_runner_root ~ '/' ~ item ~ '/runsvc.sh') is exists
    - ('/var/lib/fleet-runner/' ~ item ~ '/runsvc.sh') is not exists

# The copy keeps `bin` and `externals` as absolute links into nish's home, which
# fleet-runner cannot enter (fleet-ops#10491), so they point at their siblings.
- name: Read the runner links
  ansible.builtin.stat:
    path: "/var/lib/fleet-runner/{{ item.0 }}/{{ item.1 }}"
  loop: "{{ fleet_runner_ids | product(['bin', 'externals']) | list }}"
  register: fleet_runner_links

- name: Point the runner links at the copy
  ansible.builtin.file:
    src: "{{ item.stat.lnk_target | basename }}"
    dest: "{{ item.stat.path }}"
    state: link
    owner: fleet-runner
    group: fleet-runner
  loop: "{{ fleet_runner_links.results | selectattr('stat.lnk_target', 'defined') | selectattr('stat.lnk_target', 'match', '^/home/') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"

# The runner loads .env and .path over the unit's environment (fleet-ops#10510), and
# the copies name nish's HOME, runtime dir and tool paths.
- name: Give each runner fleet-runner's environment
  ansible.builtin.copy:
    content: "HOME=/var/lib/fleet-runner\nLANG=C.UTF-8\n"
    dest: "/var/lib/fleet-runner/{{ item }}/.env"
    owner: fleet-runner
    group: fleet-runner
    mode: '0644'
  loop: "{{ fleet_runner_ids }}"
  notify: Restart the fleet runners

- name: Give each runner fleet-runner's PATH
  ansible.builtin.copy:
    content: "/var/lib/fleet-runner/.local/bin:/usr/local/bin:/usr/bin:/bin\n"
    dest: "/var/lib/fleet-runner/{{ item }}/.path"
    owner: fleet-runner
    group: fleet-runner
    mode: '0644'
  loop: "{{ fleet_runner_ids }}"
  notify: Restart the fleet runners

# Node for tether and for the runners' pi: the official linux-x64 tarball, pinned by
# version and sha256, unpacked into a root-owned versioned directory. tether's
# ExecStart and the pi install below name it by absolute path. It comes before the
# pi install, which failed on a fresh box when it was in tasks/tether.yml. The distro nodejs package
# is not used and is not touched.
- name: Download the pinned Node tarball
  tags: [tether]
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ tether_node_version }}/node-v{{ tether_node_version }}-linux-x64.tar.xz"
    dest: "{{ tether_node_cache }}/node-v{{ tether_node_version }}-linux-x64.tar.xz"
    checksum: "sha256:{{ tether_node_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  # A --check run by a user that cannot write /var/cache (the test) fails here.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the versioned Node directory, root-owned
  tags: [tether]
  ansible.builtin.file:
    path: "{{ tether_node_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the pinned Node
  tags: [tether]
  ansible.builtin.unarchive:
    src: "{{ tether_node_cache }}/node-v{{ tether_node_version }}-linux-x64.tar.xz"
    dest: "{{ tether_node_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: root
    group: root
    creates: "{{ tether_node_dir }}/bin/node"
  # Under --check the download above did not really happen.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install pi for fleet-runner
  become: true
  become_user: fleet-runner
  ansible.builtin.command:
    argv: ["{{ tether_node_dir }}/bin/npm", install, --global, --prefix, /var/lib/fleet-runner/.local, "@earendil-works/pi-coding-agent@{{ fleet_runner_pi_version }}"]
    creates: "/var/lib/fleet-runner/.local/lib/node_modules/@earendil-works/pi-coding-agent/package.json"
  environment:
    HOME: /var/lib/fleet-runner
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

- name: Make fleet-runner's config directories
  ansible.builtin.file:
    path: "/var/lib/fleet-runner/{{ item }}"
    state: directory
    owner: fleet-runner
    group: fleet-runner
    mode: '0700'
  loop: [.pi, .pi/agent, .config, .config/fleet-ops, .config/fleet-ops/seats]

- name: Install pi's model file and settings for fleet-runner
  ansible.builtin.copy:
    src: "{{ item.src | default(omit) }}"
    content: "{{ item.content | default(omit) }}"
    dest: "/var/lib/fleet-runner/.pi/agent/{{ item.dest }}"
    owner: fleet-runner
    group: fleet-runner
    mode: '0600'
  loop:
    - {src: "{{ repo_root }}/config/pi-models.json", dest: models.json}
    - {content: "{{ {'defaultProvider': 'litellm', 'defaultModel': 'worker-capable', 'defaultProjectTrust': 'always'} | to_nice_json }}", dest: settings.json}
  loop_control:
    label: "{{ item.dest }}"

# The router job's scoped worker key (fleet-ops#11573): it reaches the worker model
# groups only, never the admin API.
- name: Give fleet-runner the scoped router key
  ansible.builtin.copy:
    src: "{{ nish_home }}/.config/fleet-ops/seats/litellm-agent.env"
    dest: /var/lib/fleet-runner/.config/fleet-ops/seats/litellm-agent.env
    remote_src: true
    owner: fleet-runner
    group: fleet-runner
    mode: '0600'

# No job on this runner pushes any more (fleet-ops#11715), so the git credential helper goes.
- name: Remove the git credential helper
  ansible.builtin.file:
    path: /var/lib/fleet-runner/.gitconfig
    state: absent

- name: Start the fleet runners
  ansible.builtin.systemd_service:
    name: "fleet-runner@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ fleet_runner_ids }}"

# The review runner: one runner, label `reviewer`, in runner group `reviewer` that only
# fleet-ops review.yml@main may use, as its own user fleet-reviewer. It shares no user or
# group with fleet-runner or nish, so a worker job cannot read or change the pi that writes
# the verdict, and fleet-reviewer cannot read the worker's home or the App key. Its home holds
# the runner, pi, pi-grok and pi-grok's own login: no router key, no git credential, no App key.
# GitHub's "Hardening for self-hosted runners" and "Managing access to self-hosted runners":
# https://docs.github.com/en/actions/reference/security/secure-use#hardening-for-self-hosted-runners
# https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/manage-access
# Registration is one `config.sh` as fleet-reviewer with an org registration token; the
# unit waits for its .runner file (rootfs/etc/systemd/system/fleet-reviewer-runner.service).
- name: Create the review runner user
  ansible.builtin.user:
    name: fleet-reviewer
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-reviewer
    create_home: true

- name: Download the pinned actions runner
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ fleet_reviewer_runner_version }}/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    dest: "/var/cache/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    checksum: "sha256:{{ fleet_reviewer_runner_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Make the review runner directory
  ansible.builtin.file:
    path: /var/lib/fleet-reviewer/runner
    state: directory
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0750'

# Once only: the runner updates itself in place after that (GitHub docs: "About self-hosted runners").
- name: Unpack the actions runner for fleet-reviewer
  ansible.builtin.unarchive:
    src: "/var/cache/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    dest: /var/lib/fleet-reviewer/runner
    remote_src: true
    owner: fleet-reviewer
    group: fleet-reviewer
    creates: /var/lib/fleet-reviewer/runner/config.sh
  ignore_errors: "{{ ansible_check_mode }}"

- name: Give the review runner its environment and PATH
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/var/lib/fleet-reviewer/runner/{{ item.dest }}"
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0644'
  loop:
    - {content: "HOME=/var/lib/fleet-reviewer\nLANG=C.UTF-8\n", dest: .env}
    - {content: "/var/lib/fleet-reviewer/.local/bin:{{ tether_node_dir }}/bin:/usr/bin:/bin\n", dest: .path}
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart the review runner

- name: Install pi for fleet-reviewer
  become: true
  become_user: fleet-reviewer
  ansible.builtin.command:
    argv: ["{{ tether_node_dir }}/bin/npm", install, --global, --prefix, /var/lib/fleet-reviewer/.local, "@earendil-works/pi-coding-agent@{{ fleet_runner_pi_version }}"]
    creates: "/var/lib/fleet-reviewer/.local/lib/node_modules/@earendil-works/pi-coding-agent/package.json"
  environment:
    HOME: /var/lib/fleet-reviewer
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

- name: Make fleet-reviewer's pi directories
  ansible.builtin.file:
    path: "/var/lib/fleet-reviewer/{{ item }}"
    state: directory
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0700'
  loop: [.pi, .pi/agent]

- name: Install pi's settings for fleet-reviewer
  ansible.builtin.copy:
    content: "{{ {'packages': fleet_reviewer_pi_packages} | to_nice_json }}"
    dest: /var/lib/fleet-reviewer/.pi/agent/settings.json
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0600'

# pi-grok, at the pin nish's pi uses, is the review job's Grok seat. `pi install` is pi's
# documented install; the owner's one device-code `/login` as fleet-reviewer writes its own
# auth.json, because pi-grok rotates refresh tokens and a copied login would log one copy out.
# https://github.com/stnly/pi-grok#quick-start
- name: Install pi-grok for fleet-reviewer
  become: true
  become_user: fleet-reviewer
  ansible.builtin.command:
    argv: [/var/lib/fleet-reviewer/.local/bin/pi, install, "{{ fleet_reviewer_pi_packages[0] }}"]
    creates: /var/lib/fleet-reviewer/.pi/agent/git/github.com/stnly/pi-grok/package.json
  environment:
    HOME: /var/lib/fleet-reviewer
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

- name: Start the review runner
  ansible.builtin.systemd_service:
    name: fleet-reviewer-runner.service
    enabled: true
    state: started
    daemon_reload: true
