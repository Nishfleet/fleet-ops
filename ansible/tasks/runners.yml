# The agent runner pool (fleet-ops#10935): fleet_runner_ids run as the unprivileged
# user fleet-runner through rootfs/etc/systemd/system/fleet-runner@.service, per
# GitHub's "Security hardening for self-hosted runners". Its home holds only the
# runner installs, pi, pi's model file and the scoped router key: no Claude, gh or
# Cloudflare login, no git credential and no App key. agent.yml mints the App token
# only on GitHub-hosted runners, which the worker cannot reach (fleet-ops#11715).
#
# Runners 1 and 15 reuse registrations copied once from nish's runner directory:
# only while the copy has no runsvc.sh, so a re-run never overwrites a live
# runner's state. Runners 2 to 14 and 16 to 30 were copied from another runner's install and
# registered with `config.sh` and an org registration token minted by the
# nishfleet-worker App (GitHub docs: "Adding self-hosted runners").
- name: Create the runner user
  ansible.builtin.user:
    name: fleet-runner
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-runner
    create_home: true

- name: Stop nish's units for the runners that move to fleet-runner
  ansible.builtin.systemd_service:
    name: "actions.runner.Nishfleet.netcup-agent-{{ item }}.service"
    enabled: false
    state: stopped
  loop: "{{ fleet_runner_ids }}"
  when: ('/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-' ~ item ~ '.service') is exists

- name: Copy each runner registration to fleet-runner once
  ansible.builtin.copy:
    src: "{{ agent_runner_root }}/{{ item }}/"
    dest: "/var/lib/fleet-runner/{{ item }}/"
    remote_src: true
    local_follow: false
    owner: fleet-runner
    group: fleet-runner
    mode: preserve
    directory_mode: '0750'
  loop: "{{ fleet_runner_ids }}"
  when:
    - (agent_runner_root ~ '/' ~ item ~ '/runsvc.sh') is exists
    - ('/var/lib/fleet-runner/' ~ item ~ '/runsvc.sh') is not exists

# The copy keeps `bin` and `externals` as absolute links into nish's home, which
# fleet-runner cannot enter (fleet-ops#10491), so they point at their siblings.
- name: Read the runner links
  ansible.builtin.stat:
    path: "/var/lib/fleet-runner/{{ item.0 }}/{{ item.1 }}"
  loop: "{{ fleet_runner_ids | product(['bin', 'externals']) | list }}"
  register: fleet_runner_links

- name: Point the runner links at the copy
  ansible.builtin.file:
    src: "{{ item.stat.lnk_target | basename }}"
    dest: "{{ item.stat.path }}"
    state: link
    owner: fleet-runner
    group: fleet-runner
  loop: "{{ fleet_runner_links.results | selectattr('stat.lnk_target', 'defined') | selectattr('stat.lnk_target', 'match', '^/home/') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"

# The runner loads .env and .path over the unit's environment (fleet-ops#10510), and
# the copies name nish's HOME, runtime dir and tool paths.
# A change to one runner's .env notifies the restart, which restarts only that
# runner (handlers: ansible/host.yml), so the other runners' jobs keep running.
- name: Give each runner fleet-runner's environment
  ansible.builtin.copy:
    content: "HOME=/var/lib/fleet-runner\nLANG=C.UTF-8\n"
    dest: "/var/lib/fleet-runner/{{ item }}/.env"
    owner: fleet-runner
    group: fleet-runner
    mode: '0644'
  loop: "{{ fleet_runner_ids }}"
  register: fleet_runner_env
  notify: Restart the agent runners

# The pool's PATH names the home's tools folder; the pilot's (runner 22) is the root-owned
# tools folder and the pinned Node instead, the same value its drop-in sets as PATH.
- name: Give each runner fleet-runner's PATH
  ansible.builtin.copy:
    content: "{{ fleet_pilot_path if item == 22 else '/var/lib/fleet-runner/.local/bin:/usr/local/bin:/usr/bin:/bin' }}\n"
    dest: "/var/lib/fleet-runner/{{ item }}/.path"
    owner: fleet-runner
    group: fleet-runner
    mode: '0644'
  loop: "{{ fleet_runner_ids }}"
  register: fleet_runner_path
  notify: Restart the agent runners

# Node for tether and for the runners' pi: the official linux-x64 tarball, pinned by
# version and sha256, unpacked into a root-owned versioned directory. tether's
# ExecStart and the pi install below name it by absolute path. It comes before the
# pi install, which failed on a fresh box when it was in tasks/tether.yml. The distro nodejs package
# is not used and is not touched.
- name: Download the pinned Node tarball
  tags: [tether]
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ tether_node_version }}/node-v{{ tether_node_version }}-linux-x64.tar.xz"
    dest: "{{ tether_node_cache }}/node-v{{ tether_node_version }}-linux-x64.tar.xz"
    checksum: "sha256:{{ tether_node_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  # A --check run by a user that cannot write /var/cache (the test) fails here.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the versioned Node directory, root-owned
  tags: [tether]
  ansible.builtin.file:
    path: "{{ tether_node_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the pinned Node
  tags: [tether]
  ansible.builtin.unarchive:
    src: "{{ tether_node_cache }}/node-v{{ tether_node_version }}-linux-x64.tar.xz"
    dest: "{{ tether_node_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: root
    group: root
    creates: "{{ tether_node_dir }}/bin/node"
  # Under --check the download above did not really happen.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install pi for fleet-runner
  become: true
  become_user: fleet-runner
  ansible.builtin.command:
    argv: ["{{ tether_node_dir }}/bin/npm", install, --global, --prefix, /var/lib/fleet-runner/.local, "@earendil-works/pi-coding-agent@{{ fleet_runner_pi_version }}"]
    creates: "/var/lib/fleet-runner/.local/lib/node_modules/@earendil-works/pi-coding-agent/package.json"
  environment:
    HOME: /var/lib/fleet-runner
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

# The pilot runner 22 gets its tools from one root-owned folder outside the pool's home
# (fleet-runner@22.service.d/10-private-home.conf hides the home behind a tmpfs, so the
# shared tools folder jobs once filled in ~/.local/bin is gone there, and a folder in
# the home could not go on PATH anyway). Only what this repo's CI and the enrolled
# repos' check commands call is installed: the pinned pip tools in a virtual environment,
# the two vendor binaries beside it, and pi; npm, npx and node come from the pinned Node
# above. Nothing else from the old shared folder is reinstalled: system ansible-playbook,
# gh, jq and git already resolve, and no check command calls tofu, tincan, litellm, the
# huggingface CLI, yt-dlp, mcp or the opentelemetry commands. A bump of any pin is a
# reviewed PR that changes the version and the checksum together, as with Node above.
- name: Create the pilot tools folder, root-owned
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ fleet_pilot_tools }}"
    - "{{ fleet_pilot_tools }}/bin"

- name: Install the pinned Python check tools for the pilot
  ansible.builtin.pip:
    name:
      - ansible-lint==26.11.0
      - black==26.10.1
      - pytest==8.3.5
      - ruff==0.17.3
      - semgrep==1.183.0
      - yamllint==1.38.0
      - zizmor==1.32.0
      - uv==0.13.7
    virtualenv: "{{ fleet_pilot_tools }}/venv"
    virtualenv_command: python3 -m venv

# One binary, one tarball, the checksum of the vendor's actionlint_1.7.12_checksums.txt.
- name: Download the pinned actionlint release
  ansible.builtin.get_url:
    url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
    dest: /var/cache/actionlint_1.7.12_linux_amd64.tar.gz
    checksum: "sha256:8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    owner: root
    group: root
    mode: "0644"

- name: Install the pinned actionlint for the pilot
  ansible.builtin.unarchive:
    src: /var/cache/actionlint_1.7.12_linux_amd64.tar.gz
    dest: "{{ fleet_pilot_tools }}/bin"
    remote_src: true
    include: [actionlint]
    owner: root
    group: root
    mode: "0755"
    creates: "{{ fleet_pilot_tools }}/bin/actionlint"

# One binary straight into the tools folder, the sha256 of the vendor's checksums file.
- name: Install the pinned yq for the pilot
  ansible.builtin.get_url:
    url: https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
    dest: "{{ fleet_pilot_tools }}/bin/yq"
    checksum: "sha256:a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
    owner: root
    group: root
    mode: "0755"

- name: Drop the actionlint download
  ansible.builtin.file:
    path: /var/cache/actionlint_1.7.12_linux_amd64.tar.gz
    state: absent

# The same pin as the pool install above; the launcher is a relative symlink beside the
# package inside this folder, and node comes from the pinned Node's bin on the PATH.
- name: Install pi into the pilot tools folder
  ansible.builtin.command:
    argv: ["{{ tether_node_dir }}/bin/npm", install, --global, --prefix, "{{ fleet_pilot_tools }}", "@earendil-works/pi-coding-agent@{{ fleet_runner_pi_version }}"]
    creates: "{{ fleet_pilot_tools }}/lib/node_modules/@earendil-works/pi-coding-agent/package.json"
  environment:
    HOME: /root
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

- name: Make fleet-runner's config directories
  ansible.builtin.file:
    path: "/var/lib/fleet-runner/{{ item }}"
    state: directory
    owner: fleet-runner
    group: fleet-runner
    mode: '0700'
  loop: [.pi, .pi/agent, .config, .config/fleet-ops, .config/fleet-ops/seats]

- name: Install pi's model file and settings for fleet-runner
  ansible.builtin.copy:
    src: "{{ item.src | default(omit) }}"
    content: "{{ item.content | default(omit) }}"
    dest: "/var/lib/fleet-runner/.pi/agent/{{ item.dest }}"
    owner: fleet-runner
    group: fleet-runner
    mode: '0600'
  loop:
    - {src: "{{ repo_root }}/config/pi-models.json", dest: models.json}
    - {content: "{{ {'defaultProvider': 'litellm', 'defaultModel': 'worker-capable', 'defaultProjectTrust': 'always'} | to_nice_json }}", dest: settings.json}
  loop_control:
    label: "{{ item.dest }}"

# The router job's scoped worker key (fleet-ops#11573): it reaches the worker model
# groups only, never the admin API. The src is a nish-held credential file: when this copy
# changed, --diff printed its value into the play's log (fleet-ops#11863), so no_log with
# diff: false keeps the value out of the ansible-pull log
# (docs.ansible.com/ansible/latest/playbook_guide/playbooks_privacy.html).
- name: Give fleet-runner the scoped router key
  ansible.builtin.copy:
    src: "{{ nish_home }}/.config/fleet-ops/seats/litellm-agent.env"
    dest: /var/lib/fleet-runner/.config/fleet-ops/seats/litellm-agent.env
    remote_src: true
    owner: fleet-runner
    group: fleet-runner
    mode: '0600'
  no_log: true
  diff: false

# No job on this runner pushes any more (fleet-ops#11715), so the git credential helper goes.
- name: Remove the git credential helper
  ansible.builtin.file:
    path: /var/lib/fleet-runner/.gitconfig
    state: absent

- name: Start the fleet runners
  ansible.builtin.systemd_service:
    name: "fleet-runner@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ fleet_runner_ids }}"

# The review runner: one runner, label `reviewer`, in runner group `reviewer` that only
# fleet-ops review.yml@main may use, as its own user fleet-reviewer. It shares no user or
# group with fleet-runner or nish, so a worker job cannot read or change the pi that writes
# the verdict, and fleet-reviewer cannot read the worker's home or the App key. Its home holds
# the runner, pi, pi-grok and pi-grok's own login, and a router key that reaches the review
# groups only (below): no git credential, no App key.
# GitHub's "Hardening for self-hosted runners" and "Managing access to self-hosted runners":
# https://docs.github.com/en/actions/reference/security/secure-use#hardening-for-self-hosted-runners
# https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/manage-access
# Registration is one `config.sh` as fleet-reviewer with an org registration token; the
# unit waits for its .runner file (rootfs/etc/systemd/system/fleet-reviewer-runner@.service).
- name: Create the review runner user
  ansible.builtin.user:
    name: fleet-reviewer
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-reviewer
    create_home: true

# fleet_reviewer_runner_ids run as fleet-reviewer-runner@N in /var/lib/fleet-reviewer/N, as the
# agent pool does, so reviews of different pull requests run side by side. The first runner was
# a plain unit in /var/lib/fleet-reviewer/runner; its registration moves once to directory 1.
# Its files keep only relative paths (bin/runsvc.sh, .runner), so the move keeps it registered.
- name: Stop the review runner's plain unit before its directory moves
  ansible.builtin.systemd_service:
    name: fleet-reviewer-runner.service
    enabled: false
    state: stopped
  when: ('/etc/systemd/system/fleet-reviewer-runner.service') is exists

- name: Move the first review runner to directory 1
  ansible.builtin.command:
    argv: [mv, /var/lib/fleet-reviewer/runner, /var/lib/fleet-reviewer/1]
    removes: /var/lib/fleet-reviewer/runner
    creates: /var/lib/fleet-reviewer/1

- name: Download the pinned actions runner
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ fleet_reviewer_runner_version }}/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    dest: "/var/cache/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    checksum: "sha256:{{ fleet_reviewer_runner_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Make the review runner directories
  ansible.builtin.file:
    path: "/var/lib/fleet-reviewer/{{ item }}"
    state: directory
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0750'
  loop: "{{ fleet_reviewer_runner_ids }}"

# Once only: the runner updates itself in place after that (GitHub docs: "About self-hosted runners").
- name: Unpack the actions runner for fleet-reviewer
  ansible.builtin.unarchive:
    src: "/var/cache/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    dest: "/var/lib/fleet-reviewer/{{ item }}"
    remote_src: true
    owner: fleet-reviewer
    group: fleet-reviewer
    creates: "/var/lib/fleet-reviewer/{{ item }}/config.sh"
  loop: "{{ fleet_reviewer_runner_ids }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Give each review runner fleet-reviewer's environment
  ansible.builtin.copy:
    content: "HOME=/var/lib/fleet-reviewer\nLANG=C.UTF-8\n"
    dest: "/var/lib/fleet-reviewer/{{ item }}/.env"
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0644'
  loop: "{{ fleet_reviewer_runner_ids }}"
  register: fleet_reviewer_env
  notify: Restart the review runners

- name: Give each review runner fleet-reviewer's PATH
  ansible.builtin.copy:
    content: "/var/lib/fleet-reviewer/.local/bin:{{ tether_node_dir }}/bin:/usr/bin:/bin\n"
    dest: "/var/lib/fleet-reviewer/{{ item }}/.path"
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0644'
  loop: "{{ fleet_reviewer_runner_ids }}"
  register: fleet_reviewer_path
  notify: Restart the review runners

- name: Install pi for fleet-reviewer
  become: true
  become_user: fleet-reviewer
  ansible.builtin.command:
    argv: ["{{ tether_node_dir }}/bin/npm", install, --global, --prefix, /var/lib/fleet-reviewer/.local, "@earendil-works/pi-coding-agent@{{ fleet_runner_pi_version }}"]
    creates: "/var/lib/fleet-reviewer/.local/lib/node_modules/@earendil-works/pi-coding-agent/package.json"
  environment:
    HOME: /var/lib/fleet-reviewer
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

- name: Make fleet-reviewer's pi directories
  ansible.builtin.file:
    path: "/var/lib/fleet-reviewer/{{ item }}"
    state: directory
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0700'
  loop: [.pi, .pi/agent, .config, .config/fleet-ops, .config/fleet-ops/seats]

# The reviewer is any family but the builder's, never MiniMax (owner 2026-11-04), so reviews
# reach Claude, Qwen, GLM and DeepSeek through the router. Its own virtual key lists the review
# groups only; the lead set them with POST /key/update
# {"key": "<the fleet-reviewer key>", "models": ["review-claude", "review-qwen", "review-any"]} and stores the
# key in the seats directory, as fleet-runner's key is.
# https://docs.litellm.ai/docs/proxy/virtual_keys
# The src is a nish-held credential file: as the copy above, no_log with diff: false keeps
# its value out of the ansible-pull log
# (docs.ansible.com/ansible/latest/playbook_guide/playbooks_privacy.html).
- name: Give fleet-reviewer its review-only router key
  ansible.builtin.copy:
    src: "{{ nish_home }}/.config/fleet-ops/seats/litellm-reviewer.env"
    dest: /var/lib/fleet-reviewer/.config/fleet-ops/seats/litellm-reviewer.env
    remote_src: true
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0600'
  no_log: true
  diff: false

# Its own model file with the router's review groups alone, so the shared pi-models.json
# cannot shadow pi-grok's models (pi docs/models.md: a models entry replaces the same ID).
- name: Install pi's router model for fleet-reviewer
  ansible.builtin.copy:
    content: "{{ {'providers': {'litellm': {'baseUrl': 'http://127.0.0.1:4000', 'api': 'openai-completions', 'apiKey': '!cut -d= -f2- $HOME/.config/fleet-ops/seats/litellm-reviewer.env', 'models': [{'id': 'review-claude', 'name': 'Claude Sonnet 5.5 (router review-claude)'}, {'id': 'review-fable', 'name': 'Claude Fable 5.2 (router review-fable)'}, {'id': 'review-qwen', 'name': 'Qwen 3.8 Max (router review-qwen)'}, {'id': 'review-any', 'name': 'Qwen, GLM or DeepSeek (router review-any)'}]}}} | to_nice_json }}"
    dest: /var/lib/fleet-reviewer/.pi/agent/models.json
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0600'

- name: Install pi's settings for fleet-reviewer
  ansible.builtin.copy:
    content: "{{ {'packages': fleet_reviewer_pi_packages} | to_nice_json }}"
    dest: /var/lib/fleet-reviewer/.pi/agent/settings.json
    owner: fleet-reviewer
    group: fleet-reviewer
    mode: '0600'

# pi-grok, at the pin nish's pi uses, is the review job's Grok seat. `pi install` is pi's
# documented install; the owner's one device-code `/login` as fleet-reviewer writes its own
# auth.json, because pi-grok rotates refresh tokens and a copied login would log one copy out.
# https://github.com/stnly/pi-grok#quick-start
- name: Install pi-grok for fleet-reviewer
  become: true
  become_user: fleet-reviewer
  ansible.builtin.command:
    argv: [/var/lib/fleet-reviewer/.local/bin/pi, install, "{{ fleet_reviewer_pi_packages[0] }}"]
    creates: /var/lib/fleet-reviewer/.pi/agent/git/github.com/stnly/pi-grok/package.json
  environment:
    HOME: /var/lib/fleet-reviewer
    PATH: "{{ tether_node_dir }}/bin:/usr/bin:/bin"

- name: Start the review runners
  ansible.builtin.systemd_service:
    name: "fleet-reviewer-runner@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ fleet_reviewer_runner_ids }}"

# The Claude engine's pool (fleet-ops#11958): its own user fleet-claude, because the two
# Team seat tokens are its login and all agent runners share one user and one home.
- name: Create the Claude runner user
  ansible.builtin.user:
    name: fleet-claude
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-claude
    create_home: true

- name: Make the Claude runner directories
  ansible.builtin.file:
    path: "/var/lib/fleet-claude/{{ item }}"
    state: directory
    owner: fleet-claude
    group: fleet-claude
    mode: '0750'
  loop: "{{ fleet_claude_runner_ids }}"

# The review pool's pinned download above is reused: one version, one checksum, one cache
# file. Once only: the runner updates itself in place after that (GitHub docs: "About
# self-hosted runners").
- name: Unpack the actions runner for fleet-claude
  ansible.builtin.unarchive:
    src: "/var/cache/actions-runner-linux-x64-{{ fleet_reviewer_runner_version }}.tar.gz"
    dest: "/var/lib/fleet-claude/{{ item }}"
    remote_src: true
    owner: fleet-claude
    group: fleet-claude
    creates: "/var/lib/fleet-claude/{{ item }}/config.sh"
  loop: "{{ fleet_claude_runner_ids }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Give each Claude runner fleet-claude's environment
  ansible.builtin.copy:
    content: "HOME=/var/lib/fleet-claude\nLANG=C.UTF-8\n"
    dest: "/var/lib/fleet-claude/{{ item }}/.env"
    owner: fleet-claude
    group: fleet-claude
    mode: '0644'
  loop: "{{ fleet_claude_runner_ids }}"
  register: fleet_claude_env
  notify: Restart the Claude runners

# Job PATH: system directories only. The runner prepends this file's entries to the job's
# PATH, as it does for the review pool; no entry may sit in a job-writable home.
- name: Give each Claude runner fleet-claude's PATH
  ansible.builtin.copy:
    content: "/usr/local/bin:/usr/bin:/bin\n"
    dest: "/var/lib/fleet-claude/{{ item }}/.path"
    owner: fleet-claude
    group: fleet-claude
    mode: '0644'
  loop: "{{ fleet_claude_runner_ids }}"
  register: fleet_claude_path
  notify: Restart the Claude runners

- name: Make fleet-claude's seats directory
  ansible.builtin.file:
    path: /var/lib/fleet-claude/.config/fleet-ops/seats
    state: directory
    owner: fleet-claude
    group: fleet-claude
    mode: '0700'

# Nish-held credential files; no_log keeps their values out of the ansible-pull log,
# as with the router keys above.
- name: Give fleet-claude the Team seat tokens
  ansible.builtin.copy:
    src: "{{ nish_home }}/.config/fleet-ops/seats/{{ item }}.env"
    dest: "/var/lib/fleet-claude/.config/fleet-ops/seats/{{ item }}.env"
    remote_src: true
    owner: fleet-claude
    group: fleet-claude
    mode: '0600'
  loop: [claude-seat-a, claude-seat-b]
  no_log: true
  diff: false

- name: Start the Claude runners
  ansible.builtin.systemd_service:
    name: "fleet-claude-runner@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ fleet_claude_runner_ids }}"

# The deploy runner netcup-fleet-ci-1: deploy-box's only runner, as its own user fleet-ci
# (rootfs/etc/systemd/system/fleet-ci-runner.service), the same move the agent pool made
# above. Its registration is copied once from nish's runner directory, while the copy has no
# runsvc.sh, so it keeps its name, label and runner group and needs no new token. The play
# runs inside a deploy-box job on this runner, so the one run that stops nish's unit cancels
# that job ("The runner has received a shutdown signal"); fleet-host-config.service runs on,
# and the next deploy runs on fleet-ci.
# https://docs.github.com/en/actions/reference/security/secure-use#hardening-for-self-hosted-runners
- name: Create the deploy runner user
  ansible.builtin.user:
    name: fleet-ci
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/fleet-ci
    create_home: true

- name: Stop nish's unit for the deploy runner
  ansible.builtin.systemd_service:
    name: actions.runner.Nishfleet.netcup-fleet-ci-1.service
    enabled: false
    state: stopped
  when: ('/etc/systemd/system/actions.runner.Nishfleet.netcup-fleet-ci-1.service') is exists

- name: Copy the deploy runner registration to fleet-ci once
  ansible.builtin.copy:
    src: "{{ agent_share }}/fleet-ci-runner/1/"
    dest: /var/lib/fleet-ci/runner/
    remote_src: true
    local_follow: false
    owner: fleet-ci
    group: fleet-ci
    mode: preserve
    directory_mode: '0750'
  when:
    - (agent_share ~ '/fleet-ci-runner/1/runsvc.sh') is exists
    - ('/var/lib/fleet-ci/runner/runsvc.sh') is not exists

- name: Read the deploy runner links
  ansible.builtin.stat:
    path: "/var/lib/fleet-ci/runner/{{ item }}"
  loop: [bin, externals]
  register: fleet_ci_links

- name: Point the deploy runner links at the copy
  ansible.builtin.file:
    src: "{{ item.stat.lnk_target | basename }}"
    dest: "{{ item.stat.path }}"
    state: link
    owner: fleet-ci
    group: fleet-ci
  loop: "{{ fleet_ci_links.results | selectattr('stat.lnk_target', 'defined') | selectattr('stat.lnk_target', 'match', '^/home/') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"

- name: Give the deploy runner fleet-ci's environment and PATH
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/var/lib/fleet-ci/runner/{{ item.dest }}"
    owner: fleet-ci
    group: fleet-ci
    mode: '0644'
  loop:
    - {dest: .env, content: "HOME=/var/lib/fleet-ci\nLANG=C.UTF-8\n"}
    - {dest: .path, content: "/usr/bin:/bin\n"}
  loop_control:
    label: "{{ item.dest }}"

- name: Start the deploy runner
  ansible.builtin.systemd_service:
    name: fleet-ci-runner.service
    enabled: true
    state: started
    daemon_reload: true
