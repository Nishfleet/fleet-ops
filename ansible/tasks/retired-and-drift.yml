# Retiring a unit or file: list the unit in retired_units (system) or
# retired_user_units (nish's user manager), and its files in retired. A unit is
# stopped and disabled before its files go, so a loaded timer cannot fire a unit
# whose files are gone. Drop a line once the box no longer has the path.
- name: Stop and disable retired system units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ retired_units }}"
  register: retired_unit_off
  failed_when:
    - retired_unit_off.failed | default(false)
    - "'Could not find' not in (retired_unit_off.msg | default(''))"

# stop, not disable --now: disable gives up once the unit file is gone, and a
# loaded unit keeps running. Enable links go in retired with the unit files.
- name: Stop and disable retired units in nish's user manager
  ansible.builtin.command:
    argv: [systemctl, --user, --machine=nish@.host, "{{ item.0 }}", "{{ item.1 }}"]
  loop: "{{ ['stop', 'disable'] | product(retired_user_units) | list }}"
  register: retired_user_unit_off
  changed_when: retired_user_unit_off.rc == 0
  failed_when: >-
    retired_user_unit_off.rc != 0
    and 'not loaded' not in retired_user_unit_off.stderr | lower
    and 'does not exist' not in retired_user_unit_off.stderr | lower
    and 'not found' not in retired_user_unit_off.stderr | lower

- name: Remove retired host files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ retired }}"
  notify:
    - Reload systemd
    - Reload nish's user manager

# The retired 0509 verify lane's runner users and lock group (fleet-ops#11714):
# nothing in the repo uses /run/lock/0509 or the gha0509-* accounts any more,
# and the group no play task makes made "Apply tmpfiles on every run" fail on a
# fresh box. After "Remove retired host files" above, so this apply's earlier
# tmpfiles run still finds the group while the lane's conf file is on the box.
- name: Remove the retired 0509 verify runner users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ retired_verify_users }}"

- name: Remove the retired 0509 lock group
  ansible.builtin.group:
    name: gha0509-lock
    state: absent

- name: Apply pending handlers before the credential check
  ansible.builtin.meta: flush_handlers
