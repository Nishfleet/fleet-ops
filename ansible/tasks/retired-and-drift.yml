# Retiring a unit or file: list the unit in retired_units (system) or
# retired_user_units (nish's user manager), and its files in retired. A unit is
# stopped and disabled before its files go, so a loaded timer cannot fire a unit
# whose files are gone. Drop a line once the box no longer has the path.
- name: Stop and disable retired system units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ retired_units }}"
  register: retired_unit_off
  failed_when:
    - retired_unit_off.failed | default(false)
    - "'Could not find' not in (retired_unit_off.msg | default(''))"

# stop, not disable --now: disable gives up once the unit file is gone, and a
# loaded unit keeps running. Enable links go in retired with the unit files.
- name: Stop and disable retired units in nish's user manager
  ansible.builtin.command:
    argv: [systemctl, --user, --machine=nish@.host, "{{ item.0 }}", "{{ item.1 }}"]
  loop: "{{ ['stop', 'disable'] | product(retired_user_units) | list }}"
  register: retired_user_unit_off
  changed_when: retired_user_unit_off.rc == 0
  failed_when: >-
    retired_user_unit_off.rc != 0
    and 'not loaded' not in retired_user_unit_off.stderr | lower
    and 'does not exist' not in retired_user_unit_off.stderr | lower
    and 'not found' not in retired_user_unit_off.stderr | lower

# aiostreams ran from a Docker Compose file outside the play; the quadlet in
# tasks/user-files.yml runs it now. `compose down` stops and removes the
# container before `retired` deletes the Compose file, so it frees port 3000
# for the quadlet. `removes` skips it once the file is gone. Drop this task with
# the compose.yaml line in `retired`. ansible-core only, as the play's header says.
# https://docs.docker.com/reference/cli/docker/compose/down/
# No noqa needed (ansible-lint v26.10.1): rules/no_changed_when.py skips `removes`; rules/command_instead_of_module.py has no docker entry.
- name: Stop the Compose copy of aiostreams
  ansible.builtin.command:
    argv: [/usr/bin/docker, compose, --project-directory, /srv/aiostreams, down]
    removes: /srv/aiostreams/compose.yaml

- name: Remove retired host files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ retired }}"
  notify:
    - Reload systemd
    - Reload nish's user manager

# The grafana_ro role and the session_hop_logs view were built for the LiteLLM
# Postgres data source deleted on 2026-11-10 (fleet-ops#11851). They live inside
# the router's database, not on a path `retired` can remove: that datadir is in
# nish's home, so state: absent there would delete the cluster. The drop runs psql
# as nish over the cluster's unix socket, the way the restic dump does
# (rootfs/etc/systemd/system/restic-r2-backup.service), and reads the password from
# nish's ~/.pgpass (0600); no password is in argv. IF EXISTS makes a later run a
# no-op, and `removes` skips it while the database is down, so a fresh host or a
# stopped cluster does not fail the play. Drop the task once a deploy shows both gone.
- name: Drop the retired grafana_ro role and session_hop_logs view
  become: true
  become_user: nish
  ansible.builtin.command:
    argv:
      - /usr/bin/psql
      - --host={{ nish_home }}/.local/share/fleet-litellm-postgres/run
      - --username=litellm
      - --dbname=litellm
      - --no-psqlrc
      - --no-password
      - --set=ON_ERROR_STOP=1
      - --command=DROP VIEW IF EXISTS public.session_hop_logs
      - --command=DROP ROLE IF EXISTS grafana_ro
    removes: "{{ nish_home }}/.local/share/fleet-litellm-postgres/run/.s.PGSQL.5432"
  environment: "{{ nish_env }}"
  register: retired_db_objects
  changed_when: retired_db_objects.rc is defined and 'DROP ' in retired_db_objects.stdout

- name: Apply pending handlers before the credential check
  ansible.builtin.meta: flush_handlers
