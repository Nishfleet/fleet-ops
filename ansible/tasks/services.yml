# The daily drift timer is gone (fleet-ops#10457): the host changes when main
# changes, through deploy-box.yml, and after a boot. Stopped and disabled
# here, and its file is in `retired`. A box where it is already gone is fine.
- name: Stop and disable the retired daily host config timer
  ansible.builtin.systemd_service:
    name: fleet-host-config.timer
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

# A reboot stops tether's Cua Space (Docker restart policy `no`) and its next
# start publishes a new port, so the env file and the nft rule must be
# rendered again: this runs this very playbook once after every boot.
# `enabled` only: a start now would fire the elapsed boot timer at once.
- name: Enable the host config run after boot
  ansible.builtin.systemd_service:
    name: fleet-host-config-boot.timer
    enabled: true
    daemon_reload: true
  # Under --check the copy above did not really install the timer yet.
  ignore_errors: "{{ ansible_check_mode }}"

# Starting the timer only schedules ansible/update.yml; it never runs it now.
- name: Enable the daily update
  ansible.builtin.systemd_service:
    name: fleet-update.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# The deploy request watcher. Its mailbox files come from tmpfiles.d, created
# by the handler flush above, so enabling it never fires on creation.
- name: Enable the deploy request watcher
  ansible.builtin.systemd_service:
    name: fleet-deploy.path
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# The monthly full restore drill (fleet-ops#9770). Its units are shipped under
# rootfs/, so the copy above installed them; this starts the timer once. The
# first drill runs at the first 1st after this deploy: a timer with no stored
# trigger replays nothing, so Persistent=true does not pull the first run
# forward, and it instead replays a later month the box spent switched off at
# the next boot. It takes the restic lock like every other restic job, so a
# drill that collides with the nightly backup waits up to 15 minutes and then
# fails: SystemUnitFailed reports it as a warning, the drill never delays the
# backup, and the backup never waits on it longer than its own lock timeout.
- name: Enable the monthly restore drill
  ansible.builtin.systemd_service:
    name: restic-r2-restore-drill.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# The rootless Docker engine for drive's agent eval (fleet-ops#9983); the
# fleet-ci-3 runner reaches it through DOCKER_HOST (its 30-eval.conf). Started
# once; a later edit to the unit file is staged until the next restart. It
# replaces podman-eval, which cannot run the eval (Inspect needs Docker Engine
# 24.0.6 or newer). The tmpfiles entry and the unit were installed above, and
# the queued handlers ran, before this point.
- name: Enable the rootless Docker engine for the drive eval
  ansible.builtin.systemd_service:
    name: dockerd-eval.service
    enabled: true
    state: started
    daemon_reload: true
  register: dockerd_eval_up
  # A unit that fails to start must not stop the rest of the host config, so
  # the error is not fatal here; the task below puts it in this run's output.
  ignore_errors: true

# The engine is one unit among many: the eval's own run fails until it is
# fixed, and a failed unit is listed by fleet-unit-failed@.service.
- name: Report a rootless Docker engine that did not start
  ansible.builtin.debug:
    msg: "dockerd-eval.service did not start ({{ dockerd_eval_up.msg | default('no message') | trim }}). drive's agent eval fails until it does."
  when: dockerd_eval_up is failed

# The retired podman engine: stopped and disabled, and its unit file is in
# `retired` below. A host where the unit is already gone is not an error.
- name: Stop and disable the retired rootless podman socket
  ansible.builtin.systemd_service:
    name: podman-eval.service
    enabled: false
    state: stopped
  register: podman_eval_off
  failed_when:
    - podman_eval_off.failed | default(false)
    - "'Could not find' not in (podman_eval_off.msg | default(''))"
  ignore_errors: "{{ ansible_check_mode }}"

# The system podman API socket: every podman call in this repo and in update.yml
# runs as nish against the user manager's socket, and rootful podman needs no
# daemon, so nothing on this box uses it. Masked, so the listener cannot return at
# boot or on a package upgrade; `systemctl unmask podman.socket` puts it back.
- name: Mask the unused root podman API socket
  ansible.builtin.systemd_service:
    name: podman.socket
    state: stopped
    masked: true

# Hermes' own GitHub login (fleet-ops#10267). The sandbox drop-in hides nish's
# admin login in ~/.config/gh and points GH_CONFIG_DIR at the token directory
# this oneshot writes, so the chat agent runs gh with a one-hour App token
# scoped to the calls its digest jobs make. The unit is a system unit and its
# RuntimeDirectory is /run, so the token never touches disk. The timer keeps
# the token fresh; starting the unit here mints the first one now.
#
# A GitHub outage must not turn the rest of the host config red, so neither the
# mint nor the proof stops this play: each is reported below, and the restart
# is gated on the login file itself, so Hermes moves onto the new login only
# once that file exists. The unit's OnFailure= pages and the timer retries in
# 20 minutes, so a box left on the old login is not silent.
- name: Enable the Hermes GitHub login refresh
  ansible.builtin.systemd_service:
    name: fleet-hermes-github-token.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Mint the Hermes GitHub login now
  ansible.builtin.systemd_service:
    name: fleet-hermes-github-token.service
    state: started
  register: hermes_login_mint
  ignore_errors: true

- name: Read the login file the mint wrote
  ansible.builtin.stat:
    path: /run/fleet-hermes-github-token/hosts.yml
  register: hermes_login_file

- name: Report a Hermes login that failed to mint
  ansible.builtin.debug:
    msg: >-
      fleet-hermes-github-token.service did not mint ({{ hermes_login_mint.msg | default('no message') }}).
      Hermes keeps the login it has: it restarts onto the minted one only once the file
      exists, and the timer retries in 20 minutes.
  when: hermes_login_mint is failed

# A real gh call through the minted login, before the handler restarts Hermes
# onto it: GH_CONFIG_DIR names the token directory, never nish's ~/.config/gh,
# which is also what makes this proof mean anything.
- name: Prove the Hermes login reads the issue it was built for
  ansible.builtin.command:
    argv: [/usr/bin/gh, issue, view, "10267", --repo, Nishfleet/fleet-ops, --json, number, --jq, .number]
  become: true
  become_user: nish
  environment:
    HOME: "{{ nish_home }}"
    PATH: "{{ nish_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    GH_CONFIG_DIR: /run/fleet-hermes-github-token
  register: hermes_login_proof
  changed_when: false
  ignore_errors: true
  when:
    - not ansible_check_mode
    - hermes_login_file.stat.exists

- name: Report a Hermes login that cannot read an issue
  ansible.builtin.debug:
    msg: >-
      gh could not read Nishfleet/fleet-ops#10267 through the minted login
      ({{ hermes_login_proof.msg | default(hermes_login_proof.stderr | default('no output')) }}).
      The timer retries in 20 minutes; Hermes keeps the login it has.
  when: hermes_login_proof is failed

# The drop-in is what hides nish's admin login, so it must not take effect on a
# box that has no minted login to replace it: a restart in that state would
# leave Hermes with no gh at all, and both units run Restart=always.
- name: Restart Hermes onto the minted login
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - hermes-gateway.service
    - hermes-serve.service
  when:
    - hermes_sandbox_dropin is changed
    - hermes_login_file.stat.exists
