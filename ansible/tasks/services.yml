# The daily drift timer is gone (fleet-ops#10457): the host changes when main
# changes, through deploy-box.yml, and after a boot. Stopped and disabled
# here, and its file is in `retired`. A box where it is already gone is fine.
- name: Stop and disable the retired daily host config timer
  ansible.builtin.systemd_service:
    name: fleet-host-config.timer
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

# A reboot stops tether's Cua Space (Docker restart policy `no`) and its next
# start publishes a new port, so the env file and the nft rule must be
# rendered again: this runs this very playbook once after every boot.
# `enabled` only: a start now would fire the elapsed boot timer at once.
- name: Enable the host config run after boot
  ansible.builtin.systemd_service:
    name: fleet-host-config-boot.timer
    enabled: true
    daemon_reload: true
  # Under --check the copy above did not really install the timer yet.
  ignore_errors: "{{ ansible_check_mode }}"

# Starting the timer only schedules ansible/update.yml; it never runs it now.
- name: Enable the daily update
  ansible.builtin.systemd_service:
    name: fleet-update.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# Hermes' own installer writes hermes-gateway.service; --if-missing leaves the
# unit it already wrote alone, and `hermes gateway restart --system` refreshes
# it. The generated unit is also copied under rootfs/etc/systemd/system/, so the
# tree copy above installs it on a rebuilt host and the play owns it
# (fleet-ops#11864); a change to what the installer writes is a PR that re-copies
# the live file. hermes-serve.service stays ours: Hermes ships no installer for
# serve (its desktop.md: keep `hermes serve` running under systemd). The shared
# sandbox is hermes-.service.d/sandbox.conf (fleet-ops#10935 D9).
- name: Install the Hermes gateway service with Hermes' own installer
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/hermes", gateway, install, --system, --run-as-user, nish, --if-missing, --no-start-now]
  environment:
    HERMES_HOME: "{{ nish_home }}/.hermes"
  register: hermes_gateway_install
  changed_when: "'already installed' not in (hermes_gateway_install.stdout | lower)"
  when: not ansible_check_mode

# The installer runs as root and loads config.yaml, and every config load saves
# a "good" copy under $HERMES_HOME/backups/config, so that folder was created
# root-owned and nish's Hermes could no longer write its config backups.
- name: Give the Hermes config backups back to nish after the root installer
  ansible.builtin.file:
    path: "{{ nish_home }}/.hermes/backups"
    state: directory
    owner: nish
    group: nish
    recurse: true

# The kept relay listener and Hermes (fleet-ops#10935).
- name: Enable the relay listener and Hermes
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - tincan-listen-claude-vps.service
    - hermes-gateway.service
    - hermes-serve.service
  ignore_errors: "{{ ansible_check_mode }}"

# The monthly full restore drill (fleet-ops#9770). Its units are shipped under
# rootfs/, so the copy above installed them; this starts the timer once. The
# first drill runs at the first 1st after this deploy: a timer with no stored
# trigger replays nothing, so Persistent=true does not pull the first run
# forward, and it instead replays a later month the box spent switched off at
# the next boot. It takes the restic lock like every other restic job, so a
# drill that collides with the nightly backup waits up to 15 minutes and then
# fails: SystemUnitFailed reports it as a warning, the drill never delays the
# backup, and the backup never waits on it longer than its own lock timeout.
- name: Enable the monthly restore drill
  ansible.builtin.systemd_service:
    name: restic-r2-restore-drill.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# The rootless Docker engine for drive's agent eval (fleet-ops#9983); the
# fleet-ci-3 runner reaches it through DOCKER_HOST (its 30-eval.conf). Started
# once; a later edit to the unit file is staged until the next restart. It
# replaces podman-eval, which cannot run the eval (Inspect needs Docker Engine
# 24.0.6 or newer). The tmpfiles entry and the unit were installed above, and
# the queued handlers ran, before this point.
- name: Enable the rootless Docker engine for the drive eval
  ansible.builtin.systemd_service:
    name: dockerd-eval.service
    enabled: true
    state: started
    daemon_reload: true
  # A unit that does not start fails the play, so the deploy goes red
  # (docs.ansible.com/ansible/latest/playbook_guide/playbooks_error_handling.html).
  ignore_errors: "{{ ansible_check_mode }}"

# The retired podman engine: stopped and disabled, and its unit file is in
# `retired` below. A host where the unit is already gone is not an error.
- name: Stop and disable the retired rootless podman socket
  ansible.builtin.systemd_service:
    name: podman-eval.service
    enabled: false
    state: stopped
  register: podman_eval_off
  failed_when:
    - podman_eval_off.failed | default(false)
    - "'Could not find' not in (podman_eval_off.msg | default(''))"
  ignore_errors: "{{ ansible_check_mode }}"

# The system podman API socket: every podman call in this repo and in update.yml
# runs as nish against the user manager's socket, and rootful podman needs no
# daemon, so nothing on this box uses it. Masked, so the listener cannot return at
# boot or on a package upgrade; `systemctl unmask podman.socket` puts it back.
- name: Mask the unused root podman API socket
  ansible.builtin.systemd_service:
    name: podman.socket
    state: stopped
    masked: true

# Hermes' own GitHub login (fleet-ops#10267). The sandbox drop-in hides nish's
# admin login in ~/.config/gh and points GH_CONFIG_DIR at the token directory
# this oneshot writes, so the chat agent runs gh with a one-hour App token
# scoped to the calls its digest jobs make. The unit is a system unit and its
# RuntimeDirectory is /run, so the token never touches disk. The timer keeps
# the token fresh; starting the unit here mints the first one now.
#
# A mint or a proof that fails, fails the play, so the deploy goes red and
# Hermes is never restarted onto a login nothing has proven
# (docs.ansible.com/ansible/latest/playbook_guide/playbooks_error_handling.html).
- name: Create the GitHub App token minter directory
  become: true
  become_user: nish
  ansible.builtin.file:
    path: "{{ github_app_token_dir }}"
    state: directory
    mode: "0755"

# GitHub's Octokit SDK mints both App tokens (Hermes and Grafana), pinned by the
# lockfile (docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app).
- name: Copy the GitHub App token minter and its lockfile
  become: true
  become_user: nish
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/github-app-token/{{ item }}"
    dest: "{{ github_app_token_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - package.json
    - package-lock.json
    - mint.mjs
  register: github_app_token_pins

- name: Look for the installed Octokit auth-app package
  become: true
  become_user: nish
  ansible.builtin.stat:
    path: "{{ github_app_token_dir }}/node_modules/@octokit/auth-app/package.json"
  register: github_app_token_installed

- name: Install the pinned Octokit packages from the lockfile  # noqa: no-changed-when
  become: true
  become_user: nish
  environment: "{{ nish_env }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/npm", ci, --ignore-scripts, --no-audit, --no-fund]
    chdir: "{{ github_app_token_dir }}"
  timeout: 300
  when: github_app_token_pins.changed or not github_app_token_installed.stat.exists

- name: Enable the Hermes GitHub login refresh
  ansible.builtin.systemd_service:
    name: fleet-hermes-github-token.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Mint the Hermes GitHub login now
  ansible.builtin.systemd_service:
    name: fleet-hermes-github-token.service
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

# A real gh call through the minted login, before Hermes restarts onto it:
# GH_CONFIG_DIR names the token directory, never nish's ~/.config/gh, which is
# also what makes this proof mean anything.
- name: Prove the Hermes login reads the issue it was built for
  ansible.builtin.command:
    argv: [/usr/bin/gh, issue, view, "10267", --repo, Nishfleet/fleet-ops, --json, number, --jq, .number]
  become: true
  become_user: nish
  environment:
    HOME: "{{ nish_home }}"
    PATH: "{{ nish_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    GH_CONFIG_DIR: /run/fleet-hermes-github-token
  changed_when: false
  when: not ansible_check_mode

# The drop-in hides nish's admin login, so Hermes restarts onto it only after
# the mint and the proof above passed; a failure there stopped the play.
# Staleness is the same comparison fleet-runner-sandbox-apply.service makes for
# the runners: the drop-in's mtime against the unit's start time, which systemd
# holds itself (it answers "has a unit read this drop-in yet" without a state
# file, and a natural Restart=always start after the install clears the
# staleness that a change flag or a marker would keep alive). A failed deploy
# re-arms by itself: the next deploy re-reads the installed mtime.
- name: Read the installed Hermes sandbox drop-in
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-.service.d/sandbox.conf
  register: hermes_installed_sandbox_dropin

- name: Read when hermes-gateway last started
  ansible.builtin.command:
    argv: [/bin/sh, -c, "t=$(systemctl show -p ActiveEnterTimestamp --value hermes-gateway.service); case \"$t\" in ''|n/a) echo 0 ;; *) date -d \"$t\" +%s ;; esac"]
  register: hermes_gateway_start
  changed_when: false
  check_mode: false

- name: Read when hermes-serve last started
  ansible.builtin.command:
    argv: [/bin/sh, -c, "t=$(systemctl show -p ActiveEnterTimestamp --value hermes-serve.service); case \"$t\" in ''|n/a) echo 0 ;; *) date -d \"$t\" +%s ;; esac"]
  register: hermes_serve_start
  changed_when: false
  check_mode: false

- name: Restart Hermes onto the minted login
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - hermes-gateway.service
    - hermes-serve.service
  when:
    - hermes_installed_sandbox_dropin.stat.exists
    - "hermes_installed_sandbox_dropin.stat.mtime | int > ([hermes_gateway_start.stdout | int, hermes_serve_start.stdout | int] | min)"

# hermes-serve binds 127.0.0.1 and Tailscale Serve publishes it on this node's
# tailnet name, port 10000 (https://tailscale.com/kb/1312/serve). Hermes takes
# the proxied Host only when dashboard.public_url names it, and that URL keeps
# its login gate on (Hermes web-dashboard.md, "Public URL override"). The name
# is read from the node, so the repo names no host.
- name: Read this node's tailnet name
  ansible.builtin.command:
    argv: [tailscale, status, --json, --peers=false]
  register: tailscale_self
  changed_when: false
  check_mode: false

- name: Set the hermes-serve tailnet URL
  ansible.builtin.set_fact:
    hermes_serve_host: "{{ (tailscale_self.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

- name: Read hermes-serve's public URL
  become: true
  become_user: nish
  environment: "{{ nish_env | combine({'HERMES_HOME': nish_home ~ '/.hermes'}) }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/hermes", config, get, dashboard.public_url]
  register: hermes_public_url
  changed_when: false
  check_mode: false

- name: Point hermes-serve's public URL at its tailnet URL
  become: true
  become_user: nish
  environment: "{{ nish_env | combine({'HERMES_HOME': nish_home ~ '/.hermes'}) }}"
  ansible.builtin.command:
    argv: ["{{ nish_home }}/.local/bin/hermes", config, set, dashboard.public_url, "https://{{ hermes_serve_host }}:10000"]
  register: hermes_public_url_set
  changed_when: true
  when: hermes_public_url.stdout | trim != 'https://' ~ hermes_serve_host ~ ':10000'

# Adds this one handler; the node's other Serve handlers stay as they are.
- name: Read the Tailscale Serve config
  ansible.builtin.command:
    argv: [tailscale, serve, status, --json]
  register: tailscale_serve
  changed_when: false
  check_mode: false

- name: Publish hermes-serve on the tailnet with Tailscale Serve
  ansible.builtin.command:
    argv: [tailscale, serve, --bg, --https=10000, "http://127.0.0.1:9119"]
  changed_when: true
  when: >-
    ((tailscale_serve.stdout | from_json).Web | default({})).get(hermes_serve_host ~ ':10000', {}).get('Handlers', {}).get('/', {}).get('Proxy', '')
    != 'http://127.0.0.1:9119'

# hermes-serve reads its unit (its PATH pins the managed Node) only at start, and
# the unit tree copy only reloads systemd, so a changed unit restarts serve here
# by the same mtime-against-start comparison as the drop-in above. Serve reads
# dashboard.public_url only at start too, so a changed URL restarts it as well.
- name: Read the installed hermes-serve unit
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-serve.service
  register: hermes_serve_unit

- name: Restart hermes-serve onto its installed unit
  ansible.builtin.systemd_service:
    name: hermes-serve.service
    state: restarted
    daemon_reload: true
  when: >-
    hermes_serve_unit.stat.mtime | int > hermes_serve_start.stdout | int
    or hermes_public_url_set is changed

# The router container mounts this copy. A changed file restarts the router.
- name: Install the router config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/litellm-proxy.yaml"
    dest: "{{ nish_config }}/fleet-ops/litellm-proxy.yaml"
    owner: nish
    group: nish
    mode: "0644"
  notify: Restart litellm proxy

# Grafana reads alerting and datasource provisioning only at start or on this
# admin API call (grafana.com/docs/grafana/latest/developers/http_api/admin/).
- name: Read whether Grafana runs
  ansible.builtin.command:
    argv: [systemctl, --user, --machine=nish@.host, is-active, --quiet, fleet-grafana.service]
  register: grafana_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reload Grafana alerting and datasource provisioning
  when: grafana_active.rc == 0
  ansible.builtin.uri:
    url: "http://127.0.0.1:3001/api/admin/provisioning/{{ item }}/reload"
    method: POST
    url_username: admin
    url_password: "{{ lookup('ansible.builtin.file', nish_config ~ '/fleet-ops/grafana-admin-password') }}"
    force_basic_auth: true
  loop: [alerting, datasources]
  register: grafana_reload
  until: grafana_reload is succeeded
  retries: 6
  delay: 10
  changed_when: false
  check_mode: false

# Ubuntu, Claude Code, gh, Syncthing, Tailscale and Chrome update through
# unattended-upgrades (Debian wiki UnattendedUpgrades, Origins-Pattern).
- name: Install the unattended-upgrades origins
  ansible.builtin.copy:
    src: "{{ rootfs }}/etc/apt/apt.conf.d/52fleet-unattended-upgrades"
    dest: /etc/apt/apt.conf.d/52fleet-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
