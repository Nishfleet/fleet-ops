- name: Fail when an alertmanager credential file is missing
  ansible.builtin.assert:
    that: alertmanager_credentials is defined and (alertmanager_credentials.results | map(attribute='stat.exists') | min)
    fail_msg: "Alertmanager is not running: a hand-placed credential file is missing from /etc/prometheus (deadman_url, telegram_bot_token or telegram_chat_id). The dead-man heartbeat and the hermes-gateway page are off until it is placed."
    quiet: true

# The pair below is what puts basic auth in front of Alertmanager's API. While
# either half is missing the prometheus config install is skipped, so alerting
# keeps working on the old loopback-only options and the run fails here, naming
# the two paths. alerting.yml makes them on the first run, so this fails only when that
# step failed.
- name: Fail when the alertmanager API credential pair is not in place
  ansible.builtin.assert:
    that: alertmanager_auth_ready | default(false) | bool
    fail_msg: "Alertmanager's API is still unauthenticated and the prometheus config was not installed: /etc/alertmanager/web.yml and /etc/prometheus/alertmanager_password must both exist, owned by root or prometheus and not readable by nish. ansible/tasks/alerting.yml makes both on the first run; check that run's errors."
    quiet: true

- name: Fail when a live digest prompt differs from config/hermes/
  ansible.builtin.assert:
    that: job.prompt is defined and job.prompt == wanted
    fail_msg: "The live {{ digest }} job is missing or its prompt differs from config/hermes/{{ digest }}.md, and the apply task above did not put it back."
    quiet: true
  loop: "{{ digest_prompts }}"
  loop_control:
    loop_var: digest
    label: "{{ digest }}"
  when: hermes_jobs_after.content is defined
  vars:
    job: "{{ (hermes_jobs_after.content | default('e30=') | b64decode | from_json).jobs | default([]) | selectattr('name', 'equalto', digest) | first | default({}) }}"
    wanted: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../config/hermes/' ~ digest ~ '.md') | regex_replace('\\n+$', '') }}"

# The retired reminder job (#10137) is deleted by id, so a wrong id removes nothing and
# leaves a job running a script this playbook has already deleted. The store is read
# again above, so this is the state the prune task actually left behind.
- name: Fail when the retired Hermes reminder job is still in the store
  ansible.builtin.assert:
    that: >-
      ((hermes_jobs_after.content | default('e30=') | b64decode | from_json).jobs | default([])
      | selectattr('name', 'equalto', 'remind-orchestrator-app') | list | length) == 0
    fail_msg: "The retired Hermes reminder job (#10137) is still in the cron store, so the id in hermes_retired_jobs is not the live one. The job runs a script this playbook has already deleted. Read the id out of the live store, put it in hermes_retired_jobs, and rerun."
    quiet: true
  when: hermes_jobs_after.content is defined

- name: Apply pending handlers before the Grafana credential check
  ansible.builtin.meta: flush_handlers

# Reads what the apply found, recorded in tasks/system.yml before tmpfiles ran, so it
# still fails when the repair has already fixed the directory on disk (fleet-ops#11120).
# Ownership only: the .config d line takes mode '-', so tmpfiles repairs an owner and
# never a mode, and a demand for owner-write bits would stay red on a mode the repair
# does not touch.
- name: Fail when a config dir was not nish-owned when the apply started
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isdir and item.stat.pw_name == 'nish' and item.stat.gr_name == 'nish'
    fail_msg: "nish's {{ item.item }} was not nish-owned when this apply started (stat says {{ item.stat.pw_name | default('none') }}:{{ item.stat.gr_name | default('none') }}), so nish's own processes could not create config dirs under it. The apply ran systemd-tmpfiles --create after the reading, so on a real run the directory on disk is nish:nish now; find what recreated or re-owned it before trusting the next jailed run. A missing or non-directory path never repairs mid-run: systemd-tmpfiles creates it at boot."
    quiet: true
  loop: "{{ config_dirs_found.results }}"
  loop_control:
    label: "{{ item.item }}"

# After the handlers, so a missing source never stops them. A missing or empty credential
# fails the run here, naming the secret, key and file and never a value.
- name: Work out which Grafana credentials could not be read
  ansible.builtin.set_fact:
    grafana_secrets_missing: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- for r in grafana_secret_values.results -%}
      {%- if r.rc | default(1) != 0 or (r.stdout | default('') | trim) == '' -%}
      {%- set ns.bad = ns.bad + [r.item.name ~ ' (' ~ r.item.key ~ ' in ' ~ r.item.src ~ ')'] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.bad }}
  no_log: true

- name: Fail when a Grafana credential source or key is missing or empty
  ansible.builtin.assert:
    that: grafana_secrets_missing | length == 0
    fail_msg: "Grafana secrets not refreshed, source or key missing or empty: {{ grafana_secrets_missing | join('; ') }}."
    quiet: true

# The grafana_ro probe (fleet-ops#10818): the data source's role, view and grant are
# created by hand on the host (the DDL comment in
# config/grafana/provisioning/datasources/litellm-postgres.yaml), so a rebuilt host, a
# dropped role or a re-granted ACL leaves the session-hop rule in DatasourceError with no
# machine path back. This logs in as grafana_ro over loopback with the grafana-postgres-password
# value the secrets tasks minted into the Podman secret from
# ~/.config/fleet-ops/grafana-postgres-password.env, and fails the play when the login fails,
# the view is missing or unreadable, or any other relation in public carries a table- or
# column-level SELECT for the role. The grants query reads pg_attribute.attacl
# (has_column_privilege), not only relacl: a column-level SELECT on LiteLLM_SpendLogs
# survived a table-level probe on 2026-10-29 until it was revoked. The password rides a
# one-use pgpass file (0600, libpq refuses a looser one) named by PGPASSFILE, never argv,
# and is removed in the always block; --no-password makes a wrong or missing password fail
# the login instead of prompting.
- name: Probe the grafana_ro login, view and grant surface
  block:
    - name: Make the probe's one-use password file
      become: true
      become_user: nish
      check_mode: false
      changed_when: false
      ansible.builtin.tempfile:
        state: file
        prefix: fleet-grafana-probe-pgpass-
      register: grafana_ro_probe_pgpass

    - name: Write the probe's pgpass line
      become: true
      become_user: nish
      check_mode: false
      no_log: true
      ansible.builtin.copy:
        dest: "{{ grafana_ro_probe_pgpass.path }}"
        mode: "0600"
        content: >-
          127.0.0.1:5432:litellm:grafana_ro:{{
          grafana_ro_probe_password.replace('\\', '\\\\').replace(':', '\\:') }}
      vars:
        grafana_ro_probe_password: >-
          {{ (grafana_secret_values.results
              | selectattr('item.name', 'equalto', 'grafana-postgres-password')
              | map(attribute='stdout') | first) | trim }}

    - name: Log in as grafana_ro and read the grant surface
      become: true
      become_user: nish
      check_mode: false
      changed_when: false
      failed_when: false
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - --host=127.0.0.1
          - --username=grafana_ro
          - --dbname=litellm
          - --no-psqlrc
          - --no-password
          - --tuples-only
          - --no-align
          - --set=ON_ERROR_STOP=1
          - --command=SELECT 1 FROM public.session_hop_logs LIMIT 1
          - >-
            --command=DO $probe$ DECLARE n int; offenders text; BEGIN WITH o AS
            (SELECT c.relname, COALESCE(a.attname, '-') AS attname FROM pg_class c
            JOIN pg_namespace nn ON nn.oid = c.relnamespace LEFT JOIN pg_attribute a
            ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
            WHERE nn.nspname = 'public' AND c.relkind IN ('r', 'p', 'f', 'v')
            AND c.relname <> 'session_hop_logs'
            AND (has_table_privilege(c.oid, 'SELECT')
            OR (a.attnum IS NOT NULL AND has_column_privilege(c.oid, a.attnum, 'SELECT'))))
            SELECT count(*), COALESCE(string_agg(relname || ':' || attname, ', '), '')
            INTO n, offenders FROM o;
            IF n > 0 THEN RAISE EXCEPTION 'grafana_ro holds SELECT it must not: % grant(s) on
            %, the view is the whole grant, revoke them', n, offenders; END IF; END $probe$;
      environment:
        PGPASSFILE: "{{ grafana_ro_probe_pgpass.path }}"
      register: grafana_ro_probe

    - name: Fail when the grafana_ro probe failed
      ansible.builtin.assert:
        that: grafana_ro_probe.rc == 0
        fail_msg: >-
          The grafana_ro data source probe failed (rc {{ grafana_ro_probe.rc }}).
          stderr: {{ grafana_ro_probe.stderr | trim }}
          query output: {{ grafana_ro_probe.stdout | trim }}
          The role, password and view are created by hand; the DDL and the password step are in
          config/grafana/provisioning/datasources/litellm-postgres.yaml, and the exception in the
          stderr names the relation or column whose SELECT the role holds and that must be revoked.
        quiet: true
  always:
    - name: Remove the probe's password file
      become: true
      become_user: nish
      ansible.builtin.file:
        path: "{{ grafana_ro_probe_pgpass.path }}"
        state: absent
      when: grafana_ro_probe_pgpass.path is defined

# A Cua Space that did not come up fails the run here, before the last two
# tasks; force_handlers still runs the pending handlers.
- name: Fail when tether's Cua Space could not be readied
  tags: [tether]
  ansible.builtin.fail:
    msg: "tether's Cua Space did not come up ({{ tether_space_failure }}). {{ tether_cua_env }} and {{ tether_space_nft }} were left as they were, tether.nft was rendered without the Space port, and the rest of this run completed."
  when: tether_space_failure is defined and not ansible_check_mode

# Last task of the play: a tether release that could not be installed (see the
# block above) fails the run here, after every other task and handler has
# run, so the deploy goes red and pages while the rest of the host config
# still applied.
- name: Apply pending handlers before the tether failure check
  tags: [tether, tether-release]
  ansible.builtin.meta: flush_handlers

- name: Fail when the tether release could not be installed
  tags: [tether, tether-release]
  ansible.builtin.fail:
    msg: "tether v{{ tether_version }} was not installed: {{ tether_install_failure }}. {{ tether_release_root }}/current was not changed and the rest of this run completed."
  when: tether_install_failure is defined and not ansible_check_mode
