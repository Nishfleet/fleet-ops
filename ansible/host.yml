# Root-owned host config for the fleet box. rootfs/ mirrors / : the file at
# rootfs/etc/X is installed at /etc/X. fleet-host-config.service runs this
# through ansible-pull as root, on every push to main and once a day.
#
# Every task is a stock ansible-core module. Validation runs first, so a file
# the daemon would refuse never reaches /etc. Each area gets its own copy
# task so a change reloads only the daemon that reads it. copy never deletes:
# removing a live file is a reviewed PR that deletes it here and adds a
# `state: absent` task for it.
#
# Owner and mode: every file is root:root with its mode from git (0644, or
# 0755 for a directory). copy follows symlinks in rootfs/, so a link to a
# file elsewhere in the repo installs the real file (one source of truth for
# fleet-unit-failed@.service, which the user units use too).
- name: Install fleet-ops rootfs/ onto this host
  hosts: localhost
  connection: local
  gather_facts: false
  # A change to tether.nft once failed a later task and dropped the pending
  # "Reload nftables" handler; the next run saw no change and never reloaded.
  # force_handlers runs notified handlers even when a later task fails.
  force_handlers: true
  vars:
    rootfs: "{{ (playbook_dir ~ '/../rootfs') | realpath }}"
    tether_off_marker: /etc/fleet-ops/tether-off
    # Agent runners 1-10 stay. 11-36 are retired (fleet-ops#10480): 40 services
    # on a 12-core, 31 GB box ran at load 1. Their directories stay on disk: the
    # runner's registration lives at GitHub and removing it needs an org admin
    # token that the VPS key does not carry.
    agent_runner_retired_ids: "{{ range(31, 37) | list }}"
    # Node for tether: one exact 22.x LTS release, downloaded from nodejs.org and
    # checked against the hash pinned here. The hash is the tar.xz line of that
    # release's SHASUMS256.txt (https://nodejs.org/dist/v22.23.3/SHASUMS256.txt).
    # A new version is a reviewed PR that changes both values.
    tether_node_version: 22.23.3
    tether_node_sha256: df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de
    tether_node_dir: "/opt/node-v{{ tether_node_version }}"
    tether_node_cache: /var/cache
    # The tether release: one exact version of the private repo Nishfleet/tether,
    # built by its CI and checked against the sha256 pinned here (the value in the
    # release's .sha256 asset). An upgrade is one reviewed PR that changes both
    # values; a rollback is the revert of that PR. These two lines are the only
    # place the version and the hash are written.
    # 0.7.0 is the first release that uses its own Space's key from cua.env.
    tether_version: 0.7.1
    tether_sha256: b753ed661e96ccdf7fcfd71f15e00f77fe65d9aee6105fd6b320fa185633104a
    # Everything below derives from the two pins. The directory and the cached
    # file carry the version AND the first 12 hex of the hash, so a new hash at
    # the same version is a new name and never reuses old content. The root and
    # cache paths are vars so the test can point them at a temp dir.
    tether_release_root: /opt/tether
    tether_release_cache: /var/cache/tether-releases
    tether_release_key: "{{ tether_version }}-{{ tether_sha256[:12] }}"
    tether_release_dir: "{{ tether_release_root }}/{{ tether_release_key }}"
    tether_release_stage: "{{ tether_release_root }}/.tmp-{{ tether_release_key }}"
    tether_release_tarball: "{{ tether_release_cache }}/tether-v{{ tether_release_key }}.tar.gz"
    tether_release_download: "{{ tether_release_cache }}/nish/tether-v{{ tether_version }}.tar.gz"
    # The packaged gh, which stores nish's login in ~/.config/gh/hosts.yml (a
    # file, not the keyring), so it also works as nish under sudo.
    tether_gh: /usr/bin/gh
    # Placed by hand, never created here. A var so the test can point it at a file.
    tether_photon_env: /etc/tether/photon.env
    tether_calendar_env: /etc/tether/calendar.env
    # tether's own Cua Space: the only Cua target its key opens. The env file
    # holds the Space's address and token, rendered by the tasks below. Docker
    # publishes a Space's spacesd on a random loopback port that changes at
    # every container start (pause and resume keep it), so the port is read
    # live on each run and never kept in a var.
    tether_cua_env: /etc/tether/cua.env
    tether_space_name: tether
    tether_space_ref: "local:{{ tether_space_name }}"
    cua_cli: /opt/Cua Spaces/resources/native/cua
    docker_cli: /usr/bin/docker
    nft_cli: /usr/sbin/nft
    nsenter_cli: /usr/bin/nsenter
    ip_cli: /usr/sbin/ip
    # The fence around tether's Cua Space. Its own file and tables, so the
    # tether off marker, which removes tether.nft, leaves it in place.
    tether_space_nft: /etc/nftables.d/tether-space.nft
    tether_space_nft_src: "{{ playbook_dir }}/templates/tether-space.nft.j2"
    # Directories this repo owns. A regular file in one of them that rootfs/
    # does not ship is a hand install, and the run fails on it (last task).
    # /etc/prometheus is left out: it also holds alertmanager credentials.
    owned_dirs:
      - /etc/systemd/system
      - /etc/systemd/system.control
      - /etc/systemd/user
      - /etc/systemd/oomd.conf.d
      - /etc/systemd/journald.conf.d
      - /etc/sysctl.d
      - /etc/tmpfiles.d
      - /etc/audit/rules.d
      - /etc/polkit-1/rules.d
    # /etc/restic is deliberately NOT in owned_dirs: it also holds the
    # hand-installed R2 credentials (/etc/restic/netcup-r2.env) and the old
    # box-only exclude list, which the drift check would fail on. The tracked
    # include/exclude lists in config/restic/ are copied there (see below)
    # without making the whole directory repo-owned.
    # Files Ubuntu packages ship, or the GitHub runner's own svc.sh writes, in
    # those directories. Matched against the full path.
    package_files:
      - '^/etc/systemd/system/actions\.runner\..*\.service$'
      - '/README[^/]*$'
      - '^/etc/tmpfiles\.d/screen-cleanup\.conf$'
      - '^/etc/sysctl\.d/99-sysctl\.conf$'
      - '^/etc/sysctl\.d/10-[^/]*\.conf$'
      - '^/etc/audit/rules\.d/audit\.rules$'
    # Retired files and directories: removed by "Remove retired host files"
    # (see the comment there). The drift check skips them too, so a --check
    # run, which removes nothing, still passes.
    retired:
      # The daily drift run (fleet-ops#10457): deploy-box.yml applies every merge
      # and fleet-host-config-boot.timer runs once per boot.
      - /etc/systemd/system/fleet-host-config.timer
      - /etc/systemd/system/timers.target.wants/fleet-host-config.timer
      - /etc/systemd/system/actions.runner.Nishfleet.netcup-fleet-ci-.service.d/10-restart.conf
      # drive moved to Nishfleet (2026-10-06): its runners are org agent runners now.
      - /etc/systemd/system/actions.runner.nish3451-drive.netcup-agent-drive-.service.d
      - /etc/systemd/system.control/actions.runner.Nishfleet.netcup-fleet-ci-1.service.d
      - /etc/systemd/system.control/actions.runner.Nishfleet.netcup-fleet-ci-2.service.d
      - /etc/systemd/system.control/actions.runner.Nishfleet.netcup-fleet-ci-3.service.d
      - /etc/systemd/system.control/github.slice.d
      - /etc/systemd/system.control/github-0509.slice.d
      - /etc/systemd/system.control/github-0509-verify.slice.d
      - /etc/systemd/system.control/github-aiconv.slice.d
      - /etc/systemd/system.control/github-inish.slice.d
      - /etc/systemd/system.control/github-seofixkit.slice.d
      - /etc/systemd/system.control/github-siterep.slice.d
      - /etc/systemd/system.control/github-tinystudio.slice.d
      - /etc/systemd/system.control/github-tsin.slice.d
      - /etc/systemd/system.control/user-1000.slice.d
      - /usr/local/bin/gh
      # Replaced by dockerd-eval.service (fleet-ops#9983).
      - /etc/systemd/system/podman-eval.service
      # The Cua daemon's fixed loopback port (#10102): the daemon ignores a
      # supplied token, so tether never used the route. The user manager is
      # reloaded below so it forgets the drop-in.
      - /etc/systemd/user/cua-desk-daemon.service.d
      # The seo-fix-kit weekly D1 backup unit lived loose in nish's user
      # directory, which the 2026-10-23 glue audit named (#10125). Its home is
      # now that product repo, next to ops/backup-d1.sh (fleet-ops#10145), and
      # its install there is for a machine that runs the export, not this box:
      # no clock is added here (docs/mac-scheduled-tasks.md).
      - "{{ nish_home }}/.config/systemd/user/seofixkit-d1-backup.service"
      - "{{ nish_home }}/.config/systemd/user/seofixkit-d1-backup.timer"
      - "{{ nish_home }}/.config/systemd/user/timers.target.wants/seofixkit-d1-backup.timer"
      # The Amp runners (#10662): removed from the repo and already gone from
      # this host. Listed so a box that still has the links drops them instead of
      # failing the link check in fleet-sync.service.
      - "{{ nish_home }}/.config/systemd/user/amp-runner-nish.service"
      - "{{ nish_home }}/.config/systemd/user/amp-runner-rajeev.service"
      - "{{ nish_home }}/.config/systemd/user/default.target.wants/amp-runner-nish.service"
      - "{{ nish_home }}/.config/systemd/user/default.target.wants/amp-runner-rajeev.service"
      # gpg-agent's OOM guard (#10138): the drop-in lived loose in nish's user
      # directory, which shadows the installed one in /etc/systemd/user, so the
      # bytes the repo ships were inert. The file, not the directory: a retired
      # path is deleted, and the directory stays for the next drop-in. The user
      # manager is reloaded below so it forgets the drop-in, and gpg-agent picks
      # the installed one up at its next start.
      - "{{ nish_home }}/.config/systemd/user/gpg-agent.service.d/20-oom-omit.conf"
      # tincan-relay's temporary --dist drop-in (#10255): it restated the --dist
      # that #9961 added to the shipped unit, and that change landed as #10642
      # (merge 77eb5719), so the drop-in is redundant. The file, not the
      # directory: a retired path is deleted, and the directory stays for the
      # next drop-in. The user manager is reloaded below so it drops the cached
      # drop-in and reads the shipped unit's --dist.
      - "{{ nish_home }}/.config/systemd/user/tincan-relay.service.d/dist-temp.conf"
      # The old hand-placed Alertmanager config (#10146): the running service
      # reads /etc/alertmanager/alertmanager.yml, which the repo ships, and the
      # only reader of this copy was the first-run chat-id seed, removed below.
      # The guard above keeps this line from deleting a box's only chat id.
      - /etc/prometheus/alertmanager.yml
      # The TinyStudio SMB bridge (#10146): disabled, inactive, with no wants
      # link, and no repo shipped it. The tasks above stop it first anyway. The
      # SMB server (smbd.service) stays.
      - /etc/systemd/system/tiny-studio-smb-bridge.service
      # Leftovers the 2026-10-23 glue audit named (#10125, #10146): the products
      # hook dir execs /Users/nish/Vibecoded projects/... and the vault's
      # .git/hooks are macOS-only no-ops, and no checkout sets core.hooksPath;
      # the one-shot tincan relink script's PR merged 2026-10-04.
      - "{{ nish_home }}/workspaces/products/.githooks"
      - "{{ nish_home }}/workspaces/tooling/nish-vault/.git/hooks"
      - "{{ nish_home }}/.cache/tincan-relink-once.sh"
      # The alert-stack cut deleted the executor, its config and the tmpfiles
      # lines that created this directory and link. tmpfiles is applied with
      # --create only, so the link outlived the file it pointed at.
      - "{{ nish_home }}/.config/prometheus-am-executor/config.yml"
      # The chrome-devtools plugin left the nish-mods marketplace (2026-10-23
      # glue audit), so the drop-in that enabled it enabled nothing and the
      # repo stopped shipping it. `copy` never deletes, so the live file is
      # retired here or it keeps loading a plugin id no marketplace lists.
      - /etc/claude-code/managed-settings.d/60-chrome-devtools.json
      # The 2026-10-28 glue sweep's user-config debris (#10544). Every one is a
      # finished one-off probe or a .bak copy of a file the repo does not ship,
      # so the fix is the deletion and nothing is rebuilt. The two .d
      # directories hold only NoNewPrivileges=no drop-ins, which would undo the
      # units' own hardening if anything ever started them.
      - "{{ nish_home }}/.config/systemd/user/nish-root.service"
      - "{{ nish_home }}/.config/systemd/user/nish-root.exec"
      - "{{ nish_home }}/.config/systemd/user/nish-root.service.d"
      - "{{ nish_home }}/.config/systemd/user/nnp-probe.service"
      - "{{ nish_home }}/.config/systemd/user/nnp-probe.service.d"
      - /tmp/nish-root
      # A copy of a unit fleet-ops now manages: the live name is a symlink into
      # the deploy clone, and this .bak predates it.
      - "{{ nish_home }}/.config/systemd/user/tincan-listen-cursor-vps.service.bak-20261024"
      # Backups of live settings files, taken by hand and never read again.
      - "{{ nish_home }}/.pi/agent/settings.json.bak-20261004-ysk"
      - "{{ nish_home }}/.pi/agent/settings.json.bak-20261005"
      - "{{ nish_home }}/.pi/agent/mcp-adapter.json.bak-executor"
      - "{{ nish_home }}/.hermes/config.yaml.bak-8766-20260925T200306Z"
      - "{{ nish_home }}/.hermes/config.yaml.bak-autoskills-20261009"
      - "{{ nish_home }}/.hermes/config.yaml.bak-tincan-20260929"
      - "{{ nish_home }}/.hermes/config.yaml.bak-tincan-20261008"
      - "{{ nish_home }}/.hermes/sandbox.conf.bak-8766"
      - "{{ nish_home }}/.hermes/SOUL.md.bak-2026-10-23"
      # The daily Hermes reminder about the GitHub App from #9676 (#10137): the
      # 2026-10-23 glue audit named it, and #9676 carries the reminder now, so the
      # job's work is done. Only the file is named: this playbook cannot list
      # ~/.hermes/scripts, and retiring a directory blind would delete files no
      # one has looked at. The job that ran it is in hermes_retired_jobs.
      - "{{ nish_home }}/.hermes/scripts/remind-orchestrator-app.sh"
      # The 2025 Node install the 2026-10-28 glue sweep found (G11, #10548): a
      # second unversioned tree beside the live ~/.local/lib/node_modules. The
      # npm launcher and its npm-exec alias in ~/.local/bin are symlinks to
      # ~/.hermes/node/bin, and the node binary at the top of this tree was a
      # byte-identical copy of /usr/local/bin/node, so PATH still resolves once
      # the tree is gone.
      - "{{ nish_home }}/.local/bin/bin"
      - "{{ nish_home }}/.local/bin/include"
      - "{{ nish_home }}/.local/bin/lib"
      - "{{ nish_home }}/.local/bin/node"
      - "{{ nish_home }}/.local/bin/README.md"
      - "{{ nish_home }}/.local/bin/CHANGELOG.md"
      - "{{ nish_home }}/.local/bin/LICENSE"
      - "{{ nish_home }}/.local/bin/share"
    # Files kept off GitHub on purpose (they reveal access paths or backup
    # targets) are listed, one path per line, in /etc/fleet-ops/box-only on
    # the box itself. That one file is the only hand-kept list.
    box_only_file: /etc/fleet-ops/box-only
    box_only: >-
      {{ (lookup('ansible.builtin.file', box_only_file, errors='ignore')
         | default('', true)).splitlines() | map('trim')
         | reject('match', '^(#|$)') | list }}
    nish_home: "{{ '~nish' | expanduser }}"
    nish_env:
      HOME: "{{ nish_home }}"
      XDG_RUNTIME_DIR: /run/user/1000
      PATH: "{{ nish_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    digest_prompts:
      - digest-morning
      - digest-evening
    # Jobs the vendor store must not carry (fleet-ops#10545). Hermes keeps every job
    # it is given, so a job whose work is done stays until something deletes it.
    # Listed by id and never searched for: a worker's fresh proof job is legitimate,
    # and a rule that matched names would delete it on the next deploy. Every job the
    # host still needs is absent from this list.
    # Deleting a job keeps no copy of its prompt or schedule, so ~/.hermes is in
    # config/restic/include.txt.
    hermes_retired_jobs:
      # The daily reminder about the GitHub App (#10137): #9676 carries it now.
      # The script it ran is in the retired list above.
      - 527a50bfda03
      # The two proof jobs from the digest runs (#9579, #9717). Both were still
      # enabled on a schedule that fires once a year, so they would have run 1 Jan.
      - 13d3db49b9c5
      - f16c57bb6885
      # The seven one-shot jobs whose run_at passed on 2026-10-23 to 2026-10-26.
      - d4efa85f43c3
      - 50229bbf6c4a
      - 0de3952d8ecb
      - df6163647275
      - bdc37cb70a4a
      - fc1c6a815b80
      - 7eda90c8dd97
    chrome_devtools_mcp_dir: "{{ nish_home }}/.local/share/chrome-devtools-mcp"
    chrome_devtools_mcp_bin: "{{ nish_home }}/.local/bin/chrome-devtools-mcp"
    chrome_devtools_mcp_args:
      - --headless
      - --isolated
      - --executablePath
      - /usr/bin/google-chrome
      - --no-usage-statistics
      - --no-performance-crux
    chrome_devtools_mcp_command: "{{ [chrome_devtools_mcp_bin] + chrome_devtools_mcp_args }}"
    chrome_devtools_mcp_words: "{{ [chrome_devtools_mcp_bin] + chrome_devtools_mcp_args }}"
    drive_mcp_entry: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../config/drive-mcp.json') | from_json).mcpServers.drive }}"
    drive_mcp_words: "{{ [drive_mcp_entry.command] + (drive_mcp_entry.args | map('replace', '~', nish_home) | list) }}"
    drive_mcp_servers: "{{ {'drive': drive_mcp_entry | combine({'args': drive_mcp_words[1:]})} }}"
    nish_config: "{{ nish_home }}/.config"
    agent_share: "{{ nish_home }}/.local/share"
    commandcode_seat_file: "{{ nish_config }}/fleet-ops/seats/commandcode.env"
    commandcode_auth_dir: "{{ nish_home }}/.commandcode"
    commandcode_auth_file: "{{ commandcode_auth_dir }}/auth.json"
    # The LiteLLM Redis password: ONE root-only file that the stock password lookup creates
    # when it is missing; the Redis requirepass fragment and the proxy env file are rendered
    # from it on every run, so the two cannot differ. Deleting the file mints a new password,
    # the renders change, and the handler restarts Redis and then the proxy.
    redis_password_file: /etc/fleet-ops/litellm-redis-password
    redis_auth_conf: "{{ nish_config }}/fleet-ops/litellm-keys/redis-auth.conf"
    redis_proxy_env: "{{ nish_config }}/fleet-ops/litellm-keys/redis.env"
    # Grafana credentials as Podman secrets (mounted by containers/quadlet/fleet-grafana.container).
    # The values are read from their original files the way systemd reads an EnvironmentFile
    # (systemd-run, no parser of our own) and the secret is recreated only when it differs.
    grafana_secrets:
      - {name: grafana-telegram-bot-token, src: "{{ nish_home }}/.hermes/.env", key: TELEGRAM_BOT_TOKEN}
      - {name: grafana-telegram-home-channel, src: "{{ nish_home }}/.hermes/.env", key: TELEGRAM_HOME_CHANNEL}
      - {name: grafana-cloudflare-api-token, src: "{{ nish_home }}/.config/cloudflare/deploy-ci.env", key: CLOUDFLARE_API_TOKEN}
    commandcode_key_re: 'COMMANDCODE_API_KEY=["'']?([^"''\s]+)["'']?[ \t]*\r?$'
    commandcode_seat_key: "{{ (commandcode_seat.content | default('') | b64decode) | regex_findall('(?m)^(?:export +)?' ~ commandcode_key_re) | last | default('') }}"

  tasks:
    - ansible.builtin.import_tasks: tasks/install-config.yml

    - ansible.builtin.import_tasks: tasks/pilot-and-retired-runners.yml

    - ansible.builtin.import_tasks: tasks/system.yml

    - ansible.builtin.import_tasks: tasks/alerting.yml

    - ansible.builtin.import_tasks: tasks/agent-policy.yml

    - ansible.builtin.import_tasks: tasks/pinned-tools.yml

    - ansible.builtin.import_tasks: tasks/agent-state.yml

    - ansible.builtin.import_tasks: tasks/tether.yml

    - ansible.builtin.import_tasks: tasks/services.yml

    - ansible.builtin.import_tasks: tasks/gh-cli.yml

    - ansible.builtin.import_tasks: tasks/retired-and-drift.yml

    - ansible.builtin.import_tasks: tasks/mcp-and-agent-clis.yml

    - ansible.builtin.import_tasks: tasks/secrets.yml

    - ansible.builtin.import_tasks: tasks/final-checks.yml


  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Established SSH sessions live in ssh@.service and survive this (fleet-ops#10541).
    - name: Restart ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: restarted

    # systemd_service scope=user would reload root's user manager, not nish's.
    - name: Reload nish's user manager
      ansible.builtin.command: /usr/bin/systemctl --user --machine=nish@.host daemon-reload

    # One systemctl call, so one transaction: Redis first (the proxy is After= and Requires= it),
    # then the proxy, restarted once. Fires only when a rendered Redis file changed (first
    # creation, or the password file was deleted and re-minted), never in steady state.
    # The proxy needs up to ~10 minutes to be healthy again after this.
    - name: Restart litellm redis then proxy
      ansible.builtin.command: /usr/bin/systemctl --user --machine=nish@.host restart fleet-litellm-redis.service fleet-litellm-proxy.service

    - name: Restart systemd-oomd
      ansible.builtin.systemd_service:
        name: systemd-oomd.service
        state: restarted

    # journald re-reads its config only on restart; logging pauses for a moment.
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

    - name: Create tmpfiles
      ansible.builtin.command: /usr/bin/systemd-tmpfiles --create

    - name: Load audit rules
      ansible.builtin.command: /usr/sbin/augenrules --load

    # nftables.service's ExecReload re-runs `nft -f /etc/nftables.conf`, and
    # its drop-in re-runs `ufw reload` right after (fleet-ops#8258).
    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables.service
        state: reloaded

    # A moved `current` link is invisible to the running agent: v0.1.2 landed
    # on 23 Oct and the unit kept running 0.1.1 until a hand restart. This
    # fires only when the hand-enabled wants symlink exists, and never while
    # the off marker exists (the marker run notifies nothing and keeps the
    # unit stopped).
    - name: Restart tether-agent after its release changed
      ansible.builtin.systemd_service:
        name: tether-agent.service
        state: restarted
      when:
        - tether_agent_enabled.stat.islnk | default(false)
        - not tether_off.stat.exists

    # htpdate reads /etc/default/htpdate only at start.
    - name: Restart htpdate
      ansible.builtin.systemd_service:
        name: htpdate.service
        state: restarted

    # Reported when it fails, but it never stops the rest of the play. A running Grafana
    # keeps the secret files it was started with, so it is restarted only after a change.
    - name: Restart fleet-grafana
      ansible.builtin.command: /usr/bin/systemctl --user --machine=nish@.host restart fleet-grafana.service
      ignore_errors: true

    - name: Reload prometheus
      ansible.builtin.systemd_service:
        name: prometheus.service
        state: reloaded

    - name: Reload alertmanager
      ansible.builtin.systemd_service:
        name: prometheus-alertmanager.service
        state: reloaded
      when: alertmanager_credentials is defined and (alertmanager_credentials.results | map(attribute='stat.exists') | min)

    # The options file and the web config it names are read only at start, so a
    # restart happens only when both the API credential and the web config that
    # switches auth on are in place. Without the pair the old loopback-only
    # options stay and Alertmanager keeps answering, so paging never stops.
    - name: Restart alertmanager
      ansible.builtin.systemd_service:
        name: prometheus-alertmanager.service
        state: restarted
      when:
        - alertmanager_credentials is defined and (alertmanager_credentials.results | map(attribute='stat.exists') | min)
        - alertmanager_auth_ready | default(false) | bool

    - name: Reload blackbox exporter
      ansible.builtin.systemd_service:
        name: prometheus-blackbox-exporter.service
        state: restarted

    # Last step of the self-repair loop (fleet-ops#10338): a oneshot that failed
    # before its fix landed stays failed, and its alerts keep firing, until
    # something starts it again. Only a unit that is failed now is started, and
    # --no-block keeps a long backup from holding the deploy. The unit list is
    # the start list in rootfs/etc/polkit-1/rules.d/50-fleet-host-config.rules,
    # minus fleet-host-config.service itself.
    - name: Read whether each re-runnable oneshot is failed
      ansible.builtin.command: /usr/bin/systemctl is-failed {{ item }}
      loop:
        - fleet-update.service
        - restic-r2-backup.service
        - restic-r2-size-guard.service
      register: oneshot_failed
      changed_when: false
      failed_when: oneshot_failed.rc not in [0, 1]

    - name: Re-run each failed oneshot after the deploy
      ansible.builtin.command: /usr/bin/systemctl start --no-block {{ item.item }}
      loop: "{{ oneshot_failed.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout == 'failed'
