# Root-owned host config for the fleet box. rootfs/ mirrors / : the file at
# rootfs/etc/X is installed at /etc/X. fleet-host-config.service runs this
# through ansible-pull as root, on every push to main and once a day.
#
# Every task is a stock ansible-core module. Validation runs first, so a file
# the daemon would refuse never reaches /etc. Each area gets its own copy
# task so a change reloads only the daemon that reads it. copy never deletes:
# removing a live file is a reviewed PR that deletes it here and adds a
# `state: absent` task for it.
#
# Owner and mode: every file is root:root with its mode from git (0644, or
# 0755 for a directory). copy follows symlinks in rootfs/, so a link to a
# file elsewhere in the repo installs the real file (one source of truth for
# fleet-unit-failed@.service, which the user units use too).
- name: Install fleet-ops rootfs/ onto this host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rootfs: "{{ (playbook_dir ~ '/../rootfs') | realpath }}"
    # Directories this repo owns. A regular file in one of them that rootfs/
    # does not ship is a hand install, and the run fails on it (last task).
    # /etc/prometheus is left out: it also holds alertmanager credentials.
    owned_dirs:
      - /etc/systemd/system
      - /etc/systemd/system.control
      - /etc/systemd/user
      - /etc/systemd/oomd.conf.d
      - /etc/systemd/journald.conf.d
      - /etc/sysctl.d
      - /etc/tmpfiles.d
      - /etc/audit/rules.d
      - /etc/polkit-1/rules.d
    # /etc/restic is deliberately NOT in owned_dirs: it also holds the
    # hand-installed R2 credentials (/etc/restic/netcup-r2.env) and the old
    # box-only exclude list, which the drift check would fail on. The tracked
    # include/exclude lists in config/restic/ are copied there (see below)
    # without making the whole directory repo-owned.
    # Files Ubuntu packages ship, or the GitHub runner's own svc.sh writes, in
    # those directories. Matched against the full path.
    package_files:
      - '^/etc/systemd/system/actions\.runner\..*\.service$'
      - '/README[^/]*$'
      - '^/etc/tmpfiles\.d/screen-cleanup\.conf$'
      - '^/etc/sysctl\.d/99-sysctl\.conf$'
      - '^/etc/sysctl\.d/10-[^/]*\.conf$'
      - '^/etc/audit/rules\.d/audit\.rules$'
    # Retired files and directories: removed by "Remove retired host files"
    # (see the comment there). The drift check skips them too, so a --check
    # run, which removes nothing, still passes.
    retired:
      - /etc/systemd/system/actions.runner.Nishfleet.netcup-fleet-ci-.service.d/10-restart.conf
      # drive moved to Nishfleet (2026-10-06): its runners are org agent runners now.
      - /etc/systemd/system/actions.runner.nish3451-drive.netcup-agent-drive-.service.d
      - /etc/systemd/system.control/actions.runner.Nishfleet.netcup-fleet-ci-1.service.d
      - /etc/systemd/system.control/actions.runner.Nishfleet.netcup-fleet-ci-2.service.d
      - /etc/systemd/system.control/actions.runner.Nishfleet.netcup-fleet-ci-3.service.d
      - /etc/systemd/system.control/github.slice.d
      - /etc/systemd/system.control/github-0509.slice.d
      - /etc/systemd/system.control/github-0509-verify.slice.d
      - /etc/systemd/system.control/github-aiconv.slice.d
      - /etc/systemd/system.control/github-inish.slice.d
      - /etc/systemd/system.control/github-seofixkit.slice.d
      - /etc/systemd/system.control/github-siterep.slice.d
      - /etc/systemd/system.control/github-tinystudio.slice.d
      - /etc/systemd/system.control/github-tsin.slice.d
      - /etc/systemd/system.control/user-1000.slice.d
    # Files kept off GitHub on purpose (they reveal access paths or backup
    # targets) are listed, one path per line, in /etc/fleet-ops/box-only on
    # the box itself. That one file is the only hand-kept list.
    box_only_file: /etc/fleet-ops/box-only
    box_only: >-
      {{ (lookup('ansible.builtin.file', box_only_file, errors='ignore')
         | default('', true)).splitlines() | map('trim')
         | reject('match', '^(#|$)') | list }}
    nish_home: "{{ '~nish' | expanduser }}"
    nish_env:
      HOME: "{{ nish_home }}"
      XDG_RUNTIME_DIR: /run/user/1000
      PATH: "{{ nish_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    chrome_devtools_mcp_dir: "{{ nish_home }}/.local/share/chrome-devtools-mcp"
    chrome_devtools_mcp_bin: "{{ nish_home }}/.local/bin/chrome-devtools-mcp"
    chrome_devtools_mcp_args:
      - --headless
      - --isolated
      - --executablePath
      - /usr/bin/google-chrome
      - --no-usage-statistics
      - --no-performance-crux
    chrome_devtools_mcp_command: "{{ [chrome_devtools_mcp_bin] + chrome_devtools_mcp_args }}"
    chrome_devtools_mcp_words: "{{ [chrome_devtools_mcp_bin] + chrome_devtools_mcp_args }}"
    nish_config: "{{ nish_home }}/.config"
    commandcode_seat_file: "{{ nish_config }}/fleet-ops/seats/commandcode.env"
    commandcode_auth_dir: "{{ nish_home }}/.commandcode"
    commandcode_auth_file: "{{ commandcode_auth_dir }}/auth.json"
    commandcode_key_re: 'COMMANDCODE_API_KEY=["'']?([^"''\s]+)'
    commandcode_object_re: '^\s*[{]'
    commandcode_identity_keys: [userId, userName, keyName, authenticatedAt]
    commandcode_seat_key: "{{ (commandcode_seat.content | default('') | b64decode) | regex_findall('(?m)^(?:export +)?' ~ commandcode_key_re) | last | default('') }}"

  tasks:
    - name: Check the prometheus config before installing it
      ansible.builtin.command: /usr/bin/promtool check config {{ rootfs }}/etc/prometheus/prometheus.yml
      changed_when: false
      check_mode: false  # read-only; runs under --check too

    - name: Check the alertmanager config before installing it
      ansible.builtin.command: /usr/bin/amtool check-config {{ rootfs }}/etc/alertmanager/alertmanager.yml
      changed_when: false
      check_mode: false  # read-only; runs under --check too

    - name: Check the nftables ruleset before installing it
      ansible.builtin.command: /usr/sbin/nft -c -f {{ rootfs }}/etc/nftables.conf
      changed_when: false
      check_mode: false  # read-only; runs under --check too

    # Per-role Claude Code allow lists (fleet-ops#9502). tincan-listen-claude-vps
    # passes --settings at /etc/claude-code/roles/tincan-listener.json, so this
    # copy must exist on the box before that user unit is restarted after merge.
    # claude remote-control refuses --settings; spawned sessions read
    # ~/.claude/settings.json. The remote-control.json file here is the list in
    # the repo, not a path that unit loads.
    - name: Install the per-role Claude permission allow lists
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/claude-code/roles/"
        dest: /etc/claude-code/roles/
        owner: root
        group: root
        mode: preserve

    - name: Install systemd units, slices and drop-ins
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/systemd/system/"
        dest: /etc/systemd/system/
        owner: root
        group: root
        mode: preserve
      notify: Reload systemd

    - name: Install systemd user-manager drop-ins
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/systemd/user/"
        dest: /etc/systemd/user/
        owner: root
        group: root
        mode: preserve
      notify: Reload nish's user manager

    - name: Install systemd-oomd config
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/systemd/oomd.conf.d/"
        dest: /etc/systemd/oomd.conf.d/
        owner: root
        group: root
        mode: preserve
      notify: Restart systemd-oomd

    - name: Install journald config
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/systemd/journald.conf.d/"
        dest: /etc/systemd/journald.conf.d/
        owner: root
        group: root
        mode: preserve
      notify: Restart journald

    - name: Install tmpfiles.d entries
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/tmpfiles.d/"
        dest: /etc/tmpfiles.d/
        owner: root
        group: root
        mode: preserve
      notify: Create tmpfiles

    - name: Install sysctl settings
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/sysctl.d/
        owner: root
        group: root
        mode: preserve
      loop: "{{ query('ansible.builtin.fileglob', rootfs ~ '/etc/sysctl.d/*.conf') }}"
      register: sysctl_files

    # Applies only the file that changed. `sysctl --system` would also re-apply
    # the provider image's files, which README keeps a Nish-only action.
    - name: Apply a changed sysctl file
      ansible.builtin.command: /usr/sbin/sysctl -p /etc/sysctl.d/{{ item.item | basename }}
      loop: "{{ sysctl_files.results | selectattr('changed') | list }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Install audit rules
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/audit/rules.d/"
        dest: /etc/audit/rules.d/
        owner: root
        group: root
        mode: preserve
      notify: Load audit rules

    - name: Install the nftables ruleset
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/nftables.conf"
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: preserve
      notify: Reload nftables

    - name: Install the htpdate options
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/default/htpdate"
        dest: /etc/default/htpdate
        owner: root
        group: root
        mode: preserve
      notify: Restart htpdate

    - name: Install prometheus and blackbox exporter config
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/prometheus/"
        dest: /etc/prometheus/
        owner: root
        group: root
        mode: preserve
      notify:
        - Reload prometheus
        - Reload alertmanager
        - Reload blackbox exporter

    # The Telegram chat id has no file option in Alertmanager, so it is kept out
    # of the repo: the repo copy holds chat_id 1 and the installed copy gets the
    # id from a hand-placed file. First run only: the id is taken from the
    # alertmanager.yml the box already has, so nothing needs placing by hand.
    - name: Seed the telegram chat id file from the installed alertmanager config
      ansible.builtin.shell: |
        set -o pipefail
        id=$(sed -n 's/^ *chat_id: *\(-\?[0-9]\+\).*/\1/p' /etc/prometheus/alertmanager.yml | head -n1)
        [ -n "$id" ] && [ "$id" != 0 ] || exit 3
        install -o prometheus -g prometheus -m 0600 /dev/stdin /etc/prometheus/telegram_chat_id <<< "$id"
      args:
        executable: /bin/bash
        creates: /etc/prometheus/telegram_chat_id
      register: chat_seed
      failed_when: chat_seed.rc not in [0, 3]

    - name: Read the telegram chat id
      ansible.builtin.slurp:
        src: /etc/prometheus/telegram_chat_id
      register: telegram_chat_id
      failed_when: false

    - name: Install the alertmanager config
      ansible.builtin.file:
        path: /etc/alertmanager
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install alertmanager.yml with the chat id filled in
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', rootfs ~ '/etc/alertmanager/alertmanager.yml') | regex_replace('chat_id: 1 ', 'chat_id: ' ~ (telegram_chat_id.content | b64decode | trim) ~ ' ') }}"
        dest: /etc/alertmanager/alertmanager.yml
        owner: root
        group: root
        mode: "0644"
      when: telegram_chat_id.content is defined
      notify: Reload alertmanager

    # Alertmanager's API is unauthenticated, so the options pin it to loopback.
    - name: Install the alertmanager options
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/default/prometheus-alertmanager"
        dest: /etc/default/prometheus-alertmanager
        owner: root
        group: root
        mode: preserve
      notify: Restart alertmanager

    # The ping URL and the bot token are hand-placed credentials that stay out of
    # the repo. Alertmanager exits at config load without them, so it starts only
    # when both exist; the last task of the play fails the run, loudly, when one
    # is missing, after everything else has been applied.
    - name: Look for the alertmanager credential files
      ansible.builtin.stat:
        path: "/etc/prometheus/{{ item }}"
      loop:
        - deadman_url
        - telegram_bot_token
        - telegram_chat_id
      register: alertmanager_credentials

    # Alertmanager runs as the prometheus user and reads these at config load and
    # when it notifies. Only the owner and mode are managed; the bytes stay hand-placed.
    - name: Let the prometheus user read the alertmanager credential files
      ansible.builtin.file:
        path: "/etc/prometheus/{{ item.item }}"
        owner: prometheus
        group: prometheus
        mode: "0600"
      loop: "{{ alertmanager_credentials.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      notify: Reload alertmanager

    # The package ships alertmanager disabled. The dead-man heartbeat and the
    # hermes-gateway page both leave the box through it, so it runs.
    - name: Enable and start alertmanager
      ansible.builtin.systemd_service:
        name: prometheus-alertmanager.service
        enabled: true
        state: started
      when: alertmanager_credentials.results | map(attribute='stat.exists') | min

    # polkitd watches rules.d itself; no reload needed.
    - name: Install polkit rules
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/polkit-1/rules.d/"
        dest: /etc/polkit-1/rules.d/
        owner: root
        group: root
        mode: preserve

    # No handler: needrestart reads conf.d on every run.
    - name: Install needrestart config
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/needrestart/conf.d/"
        dest: /etc/needrestart/conf.d/
        owner: root
        group: root
        mode: preserve

    # Claude Code merges /etc/claude-code/managed-settings.d/*.json into its
    # managed settings: here, the agents' auto-mode rules and the hook that
    # bounces routine asks to Nish (README, "Agent autonomy drop-in"). A drop-in
    # that does not parse stops Claude Code from starting on the whole box, so
    # validate refuses any file that is not a JSON object before it reaches
    # /etc. /etc/claude-code is not in owned_dirs: its managed-settings.json is
    # hand-installed. To switch this off, delete the file from rootfs/ and add
    # its /etc path to `retired`.
    - name: Install Claude Code managed-settings drop-ins
      ansible.builtin.copy:
        src: "{{ rootfs }}/etc/claude-code/managed-settings.d/"
        dest: /etc/claude-code/managed-settings.d/
        owner: root
        group: root
        mode: preserve
        validate: /usr/bin/python3 -c 'import json,sys; sys.exit(0 if isinstance(json.load(open(sys.argv[1])), dict) else 1)' %s

    - name: Create the OpenCode managed config directory
      ansible.builtin.file:
        path: /etc/opencode
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the OpenCode managed config
      ansible.builtin.copy:
        content: "{{ {'$schema': 'https://opencode.ai/config.json', 'mcp': {'chrome-devtools': {'type': 'local', 'command': chrome_devtools_mcp_command, 'enabled': true}}} | to_nice_json(indent=2) }}\n"
        dest: /etc/opencode/opencode.json
        owner: root
        group: root
        mode: "0644"

    # Restic backup include and exclude lists (config/restic/). The backup unit
    # reads them from /etc/restic/ on every run; a change here is live after
    # the next fleet-host-config run, no daemon-reload needed. README.md is not
    # copied: it is repo documentation, not box config.
    - name: Install restic include and exclude lists
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/restic/{{ item }}"
        dest: /etc/restic/{{ item }}
        owner: root
        group: root
        mode: '0644'
      loop:
        - include.txt
        - exclude.txt

    # Leviathan is the session-log search the agents are told to run first
    # (AGENTS.md, prompts/worker.md). The release is pinned: a bump is a PR
    # that changes the URL and the checksum together, and this block's
    # extracted path (the tarball's one top dir carries the version). Runs as
    # root but installs into nish's ~/.local/bin, because the binary reads
    # only nish's session logs. update.yml versions it weekly; like the other
    # raw binaries in ~/.local/bin it has no updater.
    - name: Download the pinned Leviathan release
      ansible.builtin.get_url:
        url: https://github.com/elstongun/leviathan/releases/download/v0.1.0/leviathan-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
        dest: /tmp/leviathan.tar.gz
        mode: "0644"
        checksum: sha256:9ddbae3b70afeaa1f638effaffdb5f49fb1a6651a99d3450d2af584938eee3cd

    # unarchive fails with "must be an existing dir" when dest is missing, and
    # the drop task below deletes /tmp/leviathan every run, so create it first.
    - name: Create the Leviathan unpack directory
      ansible.builtin.file:
        path: /tmp/leviathan
        state: directory
        mode: "0755"

    - name: Unpack the pinned Leviathan release
      ansible.builtin.unarchive:
        src: /tmp/leviathan.tar.gz
        dest: /tmp/leviathan/
        remote_src: true
        include:
          - leviathan-v0.1.0-x86_64-unknown-linux-gnu/leviathan

    - name: Install the Leviathan binary for nish
      ansible.builtin.copy:
        src: /tmp/leviathan/leviathan-v0.1.0-x86_64-unknown-linux-gnu/leviathan
        dest: /home/nish/.local/bin/leviathan
        owner: nish
        group: nish
        mode: "0755"
        remote_src: true

    - name: Drop the Leviathan download and unpack tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/leviathan.tar.gz
        - /tmp/leviathan

    # OpenTofu runs infra/cloudflare-tokens/ (the per-repo Cloudflare tokens that
    # GitHub Actions secrets are made from). Same shape as Leviathan above: a
    # pinned release, its sha256 in the task, one binary in nish's ~/.local/bin.
    # A bump is a PR that changes the version in the URL and the checksum
    # together (the checksum is in tofu_<version>_SHA256SUMS on the release page).
    - name: Download the pinned OpenTofu release
      ansible.builtin.get_url:
        url: https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.tar.gz
        dest: /tmp/tofu.tar.gz
        mode: "0644"
        checksum: sha256:378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69

    - name: Create the OpenTofu unpack directory
      ansible.builtin.file:
        path: /tmp/tofu
        state: directory
        mode: "0755"

    - name: Unpack the pinned OpenTofu release
      ansible.builtin.unarchive:
        src: /tmp/tofu.tar.gz
        dest: /tmp/tofu/
        remote_src: true
        include:
          - tofu

    - name: Install the OpenTofu binary for nish
      ansible.builtin.copy:
        src: /tmp/tofu/tofu
        dest: /home/nish/.local/bin/tofu
        owner: nish
        group: nish
        mode: "0755"
        remote_src: true

    - name: Drop the OpenTofu download and unpack tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tofu.tar.gz
        - /tmp/tofu

    # enabled only: never restarts the Remote Control link this playbook may run
    # under, so a change to the unit file it installs is staged, not applied.
    # This task adds no reload of its own. The restart, and the reload before
    # it, are one deliberate step by Nish, in the README under the same heading.
    - name: Enable Remote Control at boot
      ansible.builtin.systemd_service:
        name: claude-remote-control.service
        enabled: true

    - name: Enable the daily drift run
      ansible.builtin.systemd_service:
        name: fleet-host-config.timer
        enabled: true
        state: started
        daemon_reload: true
      # Under --check the copy above did not really install the timer yet.
      ignore_errors: "{{ ansible_check_mode }}"

    # Starting the timer only schedules ansible/update.yml; it never runs it now.
    - name: Enable the weekly update
      ansible.builtin.systemd_service:
        name: fleet-update.timer
        enabled: true
        state: started
        daemon_reload: true
      ignore_errors: "{{ ansible_check_mode }}"

    # Files the repo used to leave live and now removes. Each path is named,
    # so a deletion is always a reviewed line in this file. system.control
    # holds `systemctl set-property` leftovers: the fleet-ci MemoryMax moved
    # to rootfs/.../netcup-fleet-ci-.service.d/10-fleet-ci.conf, the github-*
    # slices no longer exist on this box (no unit loaded 2026-10-03), and the
    # user-1000 `CPUQuota=` is empty, the same as unset.
    - name: Remove retired host files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ retired }}"
      notify: Reload systemd

    # Drift: the copy tasks above already put back any hand edit to a file the
    # repo ships. What is left is a file on the box that the repo does not
    # ship: a hand install. Fail on it, so it pages instead of living on
    # unreviewed. /etc/systemd/system.control must stay empty, because
    # `systemctl set-property` without --runtime writes there and bypasses
    # the repo. Symlinks are enable/mask state, not config, so only regular
    # files count.
    - name: List config files on the box in the directories the repo owns
      ansible.builtin.find:
        paths: "{{ owned_dirs }}"
        recurse: true
        file_type: file
        hidden: true
      register: live

    - name: List the files rootfs/ ships
      ansible.builtin.find:
        paths: "{{ rootfs }}/etc"
        recurse: true
        file_type: any
        hidden: true
      register: shipped

    - name: Fail on a hand-installed file
      ansible.builtin.assert:
        that: unmanaged | length == 0
        fail_msg: "Hand-installed, not in fleet-ops rootfs/ (add it to the repo, delete it, or list it in /etc/fleet-ops/box-only): {{ unmanaged | join(', ') }}"
        quiet: true
      vars:
        shipped_paths: "{{ shipped.files | rejectattr('isdir') | map(attribute='path') | map('replace', rootfs, '') | list }}"
        unmanaged: >-
          {{ live.files | map(attribute='path')
             | difference(shipped_paths) | difference(box_only)
             | reject('search', package_files | join('|'))
             | reject('search', '^(' ~ (retired | map('regex_escape') | join('|')) ~ ')(/|$)')
             | sort }}

    # Last on purpose: the handlers run first, so a missing credential file
    # fails this run without holding back the reloads above.
    - name: Apply pending handlers before the credential check
      ansible.builtin.meta: flush_handlers

    - name: Create the Chrome DevTools MCP install directory
      become: true
      become_user: nish
      ansible.builtin.file:
        path: "{{ chrome_devtools_mcp_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the Chrome DevTools MCP package.json and package-lock.json
      become: true
      become_user: nish
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/chrome-devtools-mcp/{{ item }}"
        dest: "{{ chrome_devtools_mcp_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - package.json
        - package-lock.json
      register: chrome_devtools_pins

    - name: Look for the installed Chrome DevTools MCP server
      become: true
      become_user: nish
      ansible.builtin.stat:
        path: "{{ chrome_devtools_mcp_dir }}/node_modules/.bin/chrome-devtools-mcp"
      register: chrome_devtools_installed

    - name: Install the pinned Chrome DevTools MCP server from the lockfile
      become: true
      become_user: nish
      environment: "{{ nish_env }}"
      ansible.builtin.command:
        argv: ["{{ nish_home }}/.local/bin/npm", ci, --ignore-scripts, --no-audit, --no-fund]
        chdir: "{{ chrome_devtools_mcp_dir }}"
      timeout: 300
      when: chrome_devtools_pins.changed or not chrome_devtools_installed.stat.exists

    - name: Link the Chrome DevTools MCP server into nish's ~/.local/bin
      become: true
      become_user: nish
      ansible.builtin.file:
        src: "{{ chrome_devtools_mcp_dir }}/node_modules/.bin/chrome-devtools-mcp"
        dest: "{{ chrome_devtools_mcp_bin }}"
        state: link

    - name: Create the shared MCP config directory
      become: true
      become_user: nish
      ansible.builtin.file:
        path: "{{ nish_home }}/.config/mcp"
        state: directory
        mode: "0755"

    - name: Read the shared MCP config
      become: true
      become_user: nish
      ansible.builtin.slurp:
        src: "{{ nish_home }}/.config/mcp/mcp.json"
      register: shared_mcp
      failed_when: false
      diff: false

    - name: Install the shared MCP config (Pi reads it through pi-mcp-adapter)
      become: true
      become_user: nish
      ansible.builtin.copy:
        content: "{{ shared_next | to_nice_json(indent=2) }}\n"
        dest: "{{ nish_home }}/.config/mcp/mcp.json"
        mode: "0600"
      vars:
        shared_now: "{{ (shared_mcp.content | default('e30=') | b64decode | from_json) }}"
        shared_servers: "{{ (shared_now.mcpServers | default({})) | combine({'chrome-devtools': {'command': chrome_devtools_mcp_bin, 'args': chrome_devtools_mcp_args, 'lifecycle': 'lazy', 'idleTimeout': 5}}) }}"
        shared_next: "{{ shared_now | combine({'mcpServers': shared_servers}) }}"
      when: shared_next != shared_now
      diff: false

    - name: Read each agent CLI's chrome-devtools entry
      become: true
      become_user: nish
      environment: "{{ nish_env }}"
      ansible.builtin.command:
        argv: ["{{ item }}", mcp, get, chrome-devtools]
      loop: "{{ [nish_home ~ '/.local/bin/devin', nish_home ~ '/.local/bin/cmd'] | select('file') | list }}"
      register: mcp_entry
      changed_when: false
      failed_when: false
      check_mode: false
      timeout: 60

    - name: Drop a stale chrome-devtools entry
      become: true
      become_user: nish
      environment: "{{ nish_env }}"
      ansible.builtin.command:
        argv: ["{{ item.item }}", mcp, remove, chrome-devtools, --scope, user]
      loop: "{{ mcp_entry.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc == 0 and (chrome_devtools_mcp_words | reject('in', item.stdout ~ item.stderr) | list | length) > 0
      timeout: 60

    - name: Add the chrome-devtools entry to each agent CLI
      become: true
      become_user: nish
      environment: "{{ nish_env }}"
      ansible.builtin.command:
        argv: "{{ [item.item, 'mcp', 'add', '--scope', 'user', 'chrome-devtools', '--'] + chrome_devtools_mcp_words }}"
      loop: "{{ mcp_entry.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0 or (chrome_devtools_mcp_words | reject('in', item.stdout ~ item.stderr) | list | length) > 0
      timeout: 60

    - name: Read Cursor's MCP config
      become: true
      become_user: nish
      ansible.builtin.slurp:
        src: "{{ nish_home }}/.cursor/mcp.json"
      register: cursor_mcp
      failed_when: false
      diff: false

    - name: Swap Cursor's dead camofox entry for chrome-devtools
      become: true
      become_user: nish
      ansible.builtin.copy:
        content: "{{ cursor_next | to_nice_json(indent=2) }}\n"
        dest: "{{ nish_home }}/.cursor/mcp.json"
        mode: "0600"
      vars:
        cursor_now: "{{ (cursor_mcp.content | default('e30=') | b64decode | from_json) }}"
        cursor_servers: "{{ (cursor_now.mcpServers | default({})) | dict2items | rejectattr('key', 'in', ['camofox-browser', 'chrome-devtools']) | items2dict }}"
        cursor_next: "{{ cursor_now | combine({'mcpServers': cursor_servers | combine({'chrome-devtools': {'command': chrome_devtools_mcp_bin, 'args': chrome_devtools_mcp_args}})}) }}"
      when: cursor_next != cursor_now
      diff: false

    - name: Look for Codex's config
      become: true
      become_user: nish
      ansible.builtin.stat:
        path: "{{ nish_home }}/.codex/config.toml"
      register: codex_config

    - name: Drop Codex's dead camofox entry and its subtables
      become: true
      become_user: nish
      ansible.builtin.replace:
        path: "{{ nish_home }}/.codex/config.toml"
        regexp: '(?m)^\[mcp_servers\.camofox-browser(?:\.[^\]\n]+)?\]\n(?:[^\[\n][^\n]*\n|\n)*'
        replace: ""
      when: codex_config.stat.exists and codex_config.stat.isreg
      diff: false

    - name: Read Hermes' config
      become: true
      become_user: nish
      ansible.builtin.slurp:
        src: "{{ nish_home }}/.hermes/config.yaml"
      register: hermes_config
      failed_when: false
      diff: false

    - name: Add the chrome-devtools entry under Hermes' mcp_servers
      become: true
      become_user: nish
      ansible.builtin.lineinfile:
        path: "{{ nish_home }}/.hermes/config.yaml"
        insertafter: '^mcp_servers:$'
        line: "  chrome-devtools: {command: {{ chrome_devtools_mcp_bin }}, args: [{{ chrome_devtools_mcp_args | join(', ') }}], enabled: true}"
        regexp: '^  chrome-devtools: \{'
      vars:
        hermes_text: "{{ hermes_config.content | default('') | b64decode }}"
      when: hermes_text is search('(?m)^mcp_servers:$') and hermes_text is not search('(?m)^  chrome-devtools:')
      diff: false

    - name: Read the Command Code seat
      become: true
      become_user: nish
      ansible.builtin.slurp:
        src: "{{ commandcode_seat_file }}"
      register: commandcode_seat
      failed_when: false
      no_log: true
      diff: false

    - name: Create the Command Code login directory
      become: true
      become_user: nish
      ansible.builtin.file:
        path: "{{ commandcode_auth_dir }}"
        state: directory
        mode: "0700"
      when: commandcode_seat_key != ''

    - name: Read the Command Code login
      become: true
      become_user: nish
      ansible.builtin.slurp:
        src: "{{ commandcode_auth_file }}"
      register: commandcode_auth
      failed_when: false
      no_log: true
      diff: false

    - name: Parse the Command Code login (an unreadable file counts as empty, as it does for cmd)
      ansible.builtin.set_fact:
        commandcode_parsed: "{{ (commandcode_auth.content | default('e30=') | b64decode | from_json) if (commandcode_auth.content | default('e30=') | b64decode) is match(commandcode_object_re) else {} }}"
      when: commandcode_seat_key != ''
      ignore_errors: true
      no_log: true

    - name: Store the seat's key as the Command Code login (cmd reads auth.json when COMMAND_CODE_API_KEY is unset)
      become: true
      become_user: nish
      ansible.builtin.copy:
        content: "{{ commandcode_next | to_nice_json(indent=2) }}\n"
        dest: "{{ commandcode_auth_file }}"
        mode: "0600"
      vars:
        commandcode_now: "{{ commandcode_parsed | default({}) }}"
        commandcode_kept: "{{ commandcode_now | dict2items | rejectattr('key', 'in', commandcode_identity_keys) | items2dict }}"
        commandcode_next: "{{ commandcode_kept | combine({'apiKey': commandcode_seat_key}) }}"
      when: commandcode_seat_key != '' and commandcode_now.apiKey | default('') != commandcode_seat_key
      no_log: true
      diff: false

    - name: Fail when an alertmanager credential file is missing
      ansible.builtin.assert:
        that: alertmanager_credentials.results | map(attribute='stat.exists') | min
        fail_msg: "Alertmanager is not running: a hand-placed credential file is missing from /etc/prometheus (deadman_url, telegram_bot_token or telegram_chat_id). The dead-man heartbeat and the hermes-gateway page are off until it is placed."
        quiet: true


  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # systemd_service scope=user would reload root's user manager, not nish's.
    - name: Reload nish's user manager
      ansible.builtin.command: /usr/bin/systemctl --user --machine=nish@.host daemon-reload

    - name: Restart systemd-oomd
      ansible.builtin.systemd_service:
        name: systemd-oomd.service
        state: restarted

    # journald re-reads its config only on restart; logging pauses for a moment.
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

    - name: Create tmpfiles
      ansible.builtin.command: /usr/bin/systemd-tmpfiles --create

    - name: Load audit rules
      ansible.builtin.command: /usr/sbin/augenrules --load

    # nftables.service's ExecReload re-runs `nft -f /etc/nftables.conf`, and
    # its drop-in re-runs `ufw reload` right after (fleet-ops#8258).
    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables.service
        state: reloaded

    # htpdate reads /etc/default/htpdate only at start.
    - name: Restart htpdate
      ansible.builtin.systemd_service:
        name: htpdate.service
        state: restarted

    - name: Reload prometheus
      ansible.builtin.systemd_service:
        name: prometheus.service
        state: reloaded

    - name: Reload alertmanager
      ansible.builtin.systemd_service:
        name: prometheus-alertmanager.service
        state: reloaded
      when: alertmanager_credentials.results | map(attribute='stat.exists') | min

    # The options file is read only at start.
    - name: Restart alertmanager
      ansible.builtin.systemd_service:
        name: prometheus-alertmanager.service
        state: restarted
      when: alertmanager_credentials.results | map(attribute='stat.exists') | min

    - name: Reload blackbox exporter
      ansible.builtin.systemd_service:
        name: prometheus-blackbox-exporter.service
        state: restarted
