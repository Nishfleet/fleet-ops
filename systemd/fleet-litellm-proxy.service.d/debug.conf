# fleet-ops#4449: this drop-in was a real file under the live drop-in dir
# (~/.config/systemd/user/fleet-litellm-proxy.service.d/), invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean.
#
# LITELLM_LOG=DEBUG (the old live value, set during the fleet-ops#4181 live
# install) dumped full prompts + tool schemas into the user journal: 161k
# lines in 2h, journal at 856MB, and every journalctl-based guardrail query
# timed out. It also manufactured a PHANTOM GitHub secondary-rate-limit
# signal — 151 "submitted too quickly" matches in 2h, all of them DEBUG echo
# of worker transcripts, while watch.log and actions.log had 0 real hits.
# INFO keeps request/route lines, drops the prompt bodies.
[Service]
Environment=LITELLM_LOG=INFO
