# fleet-ops#4864: LiteLLM proxy + postgres are the only critical fleet organs
# without ManagedOOMPreference=avoid drop-in protection. They suffered 3 OOM
# kills in 1 hour (fleet-ops#4861), each taking down seat routing for the
# fleet. Postgres death -> proxy loses DB -> all seat routing via LiteLLM
# fails. The fleet runs at RAM capacity (9.9Gi/15Gi used, some avg300=80%);
# OOM pressure is chronic. This is the same pure ManagedOOM* override
# absorbed for fleet-metrics-export (fleet-ops#4521), fable-fleet-check, and
# codex-remote-control. Marks the proxy avoid so systemd-oomd deprioritizes
# it under user-slice pressure. No ExecStart/ExecStartPre, not new machinery.
[Service]
ManagedOOMPreference=avoid
