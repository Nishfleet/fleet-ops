# 30-graceful-stop.conf — drain instead of SIGKILL on stop.
#
# The unit ships TimeoutStopSec=15s. Between 2026-09-11 and 2026-09-18 the
# token-refresh timers bounced this proxy 44 times; 25 of those stops hit
# the 15s wall and were SIGKILLed, severing every in-flight Pi request with
# "Connection error.". The bounces themselves are gone now (grok- and
# minimax-token-refresh no longer restart the proxy; minimax-token-refresh
# was deleted outright in the 2026-09-18 glue sweep), but any future stop
# — a deploy, a manual restart — should still let live requests finish.
[Service]
TimeoutStopSec=120
