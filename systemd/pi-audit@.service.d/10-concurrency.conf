# fleet-ops#146 (storm-tolerant panel): route every pi-audit@* instance
# into the CPU/Memory-capped pi-audit.slice so a concurrent intake
# burst (many scout-candidate issues enqueued at once) cannot saturate
# the 8-vCPU host. See pi-audit.slice header for the quota values.
#
# Drop-in-removable: delete this file + pi-audit.slice and daemon-reload.
# Install is governed by the MANIFEST entry that pairs this file with
# /home/nish/.config/systemd/user/pi-audit@.service.d/10-concurrency.conf.
[Service]
Slice=pi-audit.slice
