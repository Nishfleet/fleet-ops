# fleet-ops#4063: codex-remote-control is a hand-placed infra tool (allowlist
# class a), but this OOM drop-in was a real file under
# ~/.config/systemd/user/codex-remote-control.service.d/ — invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean. Pure
# ManagedOOM* / memory capping override; no ExecStart/ExecStartPre, not new
# machinery. Protects the daemon from systemd-oomd pressure kills while
# keeping a hard cap on the managed app server.
[Service]
ManagedOOMPreference=avoid
MemoryHigh=1536M
MemoryMax=2G
