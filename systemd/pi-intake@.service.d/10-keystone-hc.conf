# Best-effort healthchecks.io ping after a successful intake tick
# (fleet-ops#455). Type=simple: ExecStopPost runs when the process exits.
# SERVICE_RESULT=success means the tick completed; a failed tick must not
# keep the dead-man alive. bash -c wrapper dodges CI systemd-analyze
# verify for the unstubbed keystone-hc-ping binary. Missing HC_URL_INTAKE
# is a skip (exit 0), not a unit failure.
[Service]
ExecStopPost=/bin/bash -c 'if [ "${SERVICE_RESULT:-}" = success ]; then exec /home/nish/.local/bin/keystone-hc-ping intake; fi'
