# Best-effort healthchecks.io ping after a successful intake tick
# (fleet-ops#455). Type=simple: ExecStopPost runs when the process exits.
# SERVICE_RESULT=success means the tick completed; a failed tick must not
# keep the dead-man alive. The 96-line bin/keystone-hc-ping wrapper this
# replaced was one curl behind a hand-rolled env-file parser;
# EnvironmentFile= is the stock systemd feature that reads the URL. Missing
# file or unset HC_URL_INTAKE is a skip (exit 0), not a unit failure.
[Service]
EnvironmentFile=-/home/nish/.config/fleet-ops/keystone-hc.env
ExecStopPost=-/bin/bash -c 'if [ "${SERVICE_RESULT:-}" = success ] && [ -n "${HC_URL_INTAKE:-}" ]; then exec /usr/bin/curl -fsS -m 10 --retry 3 "$HC_URL_INTAKE"; fi'
