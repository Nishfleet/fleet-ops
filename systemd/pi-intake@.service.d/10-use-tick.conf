# fleet-ops#1377 / #2924: run the deterministic intake tick instead of the
# model-based pi-packet-run prompt path (prompts/intake.md).
#
# The model path was the starvation mechanism: gh issue list --limit 50 only
# ever saw the 50 NEWEST agent-ready issues (hiding older surge_leverage
# issues behind the page), and a model session could exit with empty final
# text, which the pi-packet-run no-op detector (stdout < 256B) misclassified
# as a failure so systemd retried — burning seats while the queue sat idle.
# lib/pi-intake-tick.sh is a deterministic bash tick with none of those
# dependencies. This drop-in switches ExecStart to it.
#
# Type=oneshot: the tick runs to completion synchronously; it spawns workers
# itself with `systemctl start --no-block`. We clear the base ExecStartPre
# (model packet build) and the base ExecStart (pi-intake-run %i).
#
# Absorbed from the live hand-placed drop-in (fleet-ops#2924) so a redeploy
# cannot silently reintroduce the model path.
#
# ExecStart uses /bin/bash -c 'exec ...' so systemd-analyze verify (CI) checks
# /bin/bash instead of the VPS-only ~/.local/lib path — the same dodge every
# other repo drop-in uses (canary-effectiveness.conf, scout-effectiveness.conf).
[Service]
Type=oneshot
ExecStartPre=
ExecStart=
ExecStart=/bin/bash -c 'exec /home/nish/.local/lib/pi-packet/pi-intake-tick.sh %i'
