# fleet-ops#3318: camofox-browser is a hand-placed infra tool (allowlist
# class a), but this ExecStartPre drop-in was a real file under
# ~/.config/systemd/user/camofox-browser.service.d/ — invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean.
# Fail-closed Xvfb auth tripwire: refuse start unless the ExecStart server.js
# DefaultVirtualDisplay emits -auth (FamilyLocal X11 cookie gate) and the
# Xvfb cookie file is mode 600. The -auth gate must not live only in the
# versioned node_modules tree (version bump / npm reinstall drops it).
# The referenced gate bin (camofox-xvfb-auth-gate) stays hand-placed as part
# of the allowlisted infra tool, exactly like the service's own ExecStart
# node/server.js paths; only the drop-in becomes repo-sourced.
[Service]
ExecStartPre=/home/nish/.local/bin/camofox-xvfb-auth-gate
