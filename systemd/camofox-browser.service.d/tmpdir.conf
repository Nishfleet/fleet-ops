# fleet-ops#2974: camofox-browser is a hand-placed infra tool (allowlist
# class a), but this env drop-in was a real file under
# ~/.config/systemd/user/camofox-browser.service.d/ — invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean. Pure
# environment override (TMPDIR/TMP/TEMP -> dedicated cache dir); no
# ExecStart/ExecStartPre, not new machinery.
[Service]
Environment=TMPDIR=/home/nish/.cache/camofox-tmp
Environment=TMP=/home/nish/.cache/camofox-tmp
Environment=TEMP=/home/nish/.cache/camofox-tmp
