# 20-resume.conf — the fleet RESUME POLICY declaration (fleet-ops#5456,
# addendum G amended by the 2026-09-11 incident binding constraints).
#
# "Nothing on the VPS fails silently, everything resumes, nothing is duct
# tape" (vault global-standing-rules.md).
#
# A GLOBAL Restart=on-failure here was attempted live on 2026-09-11 and
# KILLED nine units in five minutes (fleet-ops#5456 incident comment):
# dozens of timer-driven oneshot canaries exit non-zero as their NORMAL
# signal, and a global restart policy restart-looped them into
# start-limit-hit. The resume policy is therefore an ALLOWLIST, not a
# global default. This drop-in carries NO Restart= key on purpose — its
# hash is asserted by bin/fleet-escalation-canary so nobody can quietly
# re-add a global restart policy (or remove this declaration).
#
# The allowlist (each entry already ships its own Restart= in its unit or
# per-unit drop-in — see systemd/):
#   RESUME IN PLACE (long-running / retry-absorbing):
#     - pi-issue@.service            Restart=on-failure RestartSec=240 burst 3/1h
#                                    (worker unit; retry absorbs transient seat
#                                    faults; reaper + intake re-dispatch on death)
#     - fleet-litellm-proxy.service  Restart=on-failure (daemon)
#     - fleet-litellm-postgres.service Restart=on-failure (daemon)
#     - pi-packet@.service           Restart=on-failure RestartSec=240 burst 3/1h
#   RESUME VIA DISPATCHER (packet transients — NEVER restarted in place):
#     - every pi-systemd-run packet unit: pi-systemd-run writes a per-unit
#       90-no-resume.conf (Restart=no) at launch; death resumes through
#       stop-escalation-dispatch's hop+1 relaunch on the NEXT healthy seat.
#       An in-place restart would re-run the SAME seat and race the relaunch.
#   NEVER AUTO-RESTART (by design; named per addendum G):
#     - timer-driven oneshot canaries (siterep-uptime, fleet-deploy-check,
#       fleet-litellm-health-canary, fleet-escalation-canary, ...): exit
#       non-zero is their normal signal; the next timer tick IS the retry and
#       the escalation dispatcher handles persistent reds. A Restart= here is
#       the exact 2026-09-11 incident.
#     - the escalation handlers themselves (unit-escalation@*, pi-packet-failed@*,
#       stop-escalation.service): no recursion.
#     - .path/.timer units: service.d drop-ins do not apply to them.
#
# StartLimit note (fleet-ops#5456 constraint 3): NO global StartLimit change
# ships. The busiest timer, siterep-uptime, fires every 2 min with Restart=no;
# any global StartLimitIntervalSec/Burst here would count timer-activated
# starts and re-create the six-hour start-limit-hit outage. Per-unit limits
# (pi-issue@, pi-packet@: 3 per 1h with RestartSec=240) are proven: three
# restarts span ~12 min, safely inside the 1h window, and their exhaustion is
# exactly the escalation trigger the dispatcher consumes.
#
# Tamper contract: bin/fleet-escalation-canary hashes this file and
# systemd/service.d/10-escalate.conf against the repo copies every heartbeat
# tick. Removed or modified = ESCALATION-CANARY-VIOLATION.
