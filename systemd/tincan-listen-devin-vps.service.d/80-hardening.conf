# Sandbox for the Devin listener (audit W2a, nish-vault#30): `systemd-analyze --user
# security` 9.6 UNSAFE -> 4.9 OK. Every directive is inherited by every Devin child
# and every process a task spawns, so only switches that cost an autonomous coding
# session nothing are set. Scored offline (`systemd-analyze --user security
# --offline=true`, 4.9) and proven live with a transient unit that carried exactly
# these properties through a battery: writes to the state dirs, tincan config read,
# /usr read-only, router http://127.0.0.1:4000/health/readiness, `git status` in a
# scratch clone, `node --version`, and one real `devin -p "Reply with exactly: ok"
# --permission-mode dangerous` turn that answered ok.
#
# This is a user unit, so the whole capability family is unavailable: dropping any
# bounding-set member (including the implied drops of PrivateDevices=, ProtectClock=,
# ProtectKernelModules=, ProtectKernelLogs=) needs CAP_SETPCAP, and user-unit
# processes hold no capabilities, so the unit would fail to start with
# EXIT_CAPABILITIES at the next restart. PrivateUsers=yes also cannot compensate:
# systemd creates the user namespace but clears effective capabilities for user
# units first, so the drop still fails. User=, DynamicUser=, RootDirectory= and
# ProtectHome=tmpfs are system-manager-only here (RootDirectory/User= are scored as
# unset for every user unit; that 0.5 is structural and cannot be reclaimed).
#
# Deliberately NOT set, because the listener or its children use them:
# PrivateDevices (CAP drop, see above; DevicePolicy=closed is set as the ACL
# stand-in), IPAddressDeny (relay long-poll and internet access are the job),
# PrivateNetwork (same), ProcSubset=pid (node/playwright read /proc/meminfo and
# cpuinfo for worker counts), MemoryDenyWriteExecute (node and bun JIT),
# RestrictAddressFamilies minus AF_NETLINK (os.networkInterfaces() uses netlink and
# dev servers print network URLs from it), setrlimit inside SystemCallFilter (the
# @resources group; bun raises RLIMIT_NOFILE at startup), and ReadWritePaths for
# the human home: ProtectHome=read-only + ReadWritePaths=/home/nish keeps every
# write path the listener, Devin, git and node already use, including the worktrees
# under ~/workspaces and the runtime dir /run/user/1000.
#
# What a task loses: writing anywhere outside the home and runtime dir (whole /usr,
# /etc, /boot read-only), its own /tmp (PrivateTmp), other users' /proc entries
# (ProtectProc=invisible), writing /proc/sys, /sys and the cgroup tree
# (ProtectKernelTunables, ProtectControlGroups), reading the kernel log ring
# buffer, loading modules, changing the clock or hostname, realtime scheduling,
# suid/sgid file bits, non-native architectures, every socket family except
# AF_UNIX/AF_INET/AF_INET6/AF_NETLINK, and every namespace type (user, pid, net,
# mnt, uts, ipc, cgroup) plus the @mount/@privileged syscall groups. Containers
# and Chromium-style sandboxes were already dead for unprofiled binaries on this
# host (kernel.apparmor_restrict_unprivileged_userns=1); a nested
# `systemd-run --user` unit spawned from a task now warns that its namespace setup
# was ignored and runs unjailed, so detached fleet work started from inside a
# Devin task is degraded and should be avoided.
#
# Staged like the rest of this unit: the file is symlinked into
# ~/.config/systemd/user/tincan-listen-devin-vps.service.d/ from the deploy clone
# by hand (`ln -sfn`), so it applies at the next restart, which merges with
# fleet-ops#10194 and is not done from this PR. Take effect: `systemctl --user
# daemon-reload` then restart the listener. Roll back: delete this file (and its
# symlink), `systemctl --user daemon-reload`.
[Service]
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/nish /run/user/1000
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectHostname=yes
DevicePolicy=closed
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=~pid net mnt uts ipc cgroup user
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @privileged @raw-io @reboot @swap @resources
KeyringMode=private
