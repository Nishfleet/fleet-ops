[Service]
# Headless Devin writes its state under ~/.local/share/devin/cli (installation id,
# trusted workspaces, session locks and the sessions database) with the
# user-manager default UMask=0002, which makes those files group-writable.
# Owner-only (audit W1a, nish-vault#30). The unit file itself is hand-placed on
# the host; only this drop-in lives here. Applies at the next restart.
UMask=0077
