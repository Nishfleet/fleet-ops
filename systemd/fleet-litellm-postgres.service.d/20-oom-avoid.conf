# fleet-ops#4861: mark the LiteLLM Postgres organ avoid so systemd-oomd
# deprioritizes it under user-slice pressure instead of killing the DB
# daemon first (3 OOM-kills in 1h, 3rd auditor summon). MemoryMin protects
# its working set from reclaim under pressure; no MemoryMax here.
[Service]
ManagedOOMPreference=avoid
MemoryMin=256M
