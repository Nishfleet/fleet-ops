# Fleet policy: killing is the EXCEPTION, not the norm (Nish, 2026-08-26).
# The ~13.1 GiB soft cap (MIN_FREE_RAM_MB=2500) prevents work starting, and
# per-worker MemoryHigh=3G throttles. oomd only acts when both have failed.
#
# Duration is global-only in systemd 255 (per-slice DurationSec is not a valid
# key). systemd default 30s; Fedora ships 20s on user@.service for desktop
# latency. 60s suits a batch fleet: a 30s pressure spike is survivable, a full
# sustained minute is a genuine emergency.
[OOM]
DefaultMemoryPressureDurationSec=60s
