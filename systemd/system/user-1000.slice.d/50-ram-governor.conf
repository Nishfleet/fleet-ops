# RAM governor for the ENTIRE user tree — the layer the fleet policy could not
# provide. Claude/agent interactive sessions run in login session scopes
# (session-*.scope), SIBLINGS of user@1000.service, so no user-manager slice
# config (app-pi\x2dissue.slice etc.) ever governs them. This system-scope
# drop-in is the only stock place that covers fleet AND sessions AND everything
# else nish runs. Same three-layer philosophy as app-pi\x2dissue.slice:
#   1. MemoryHigh=12G  -> kernel reclaim/throttle first. With 8G swap, the
#      COLDEST pages go out first — i.e. idle sessions get paged, active work
#      keeps its hot set. Nobody dies. (This is the mechanical answer to
#      "kill only what is genuinely stuck": coldness is the discriminator.)
#   2. oomd pressure kill at 80% sustained (global 60s duration) -> emergency
#      only; kills the worst-pgscan descendant cgroup instead of letting the
#      kernel OOM killer pick, or the box freeze (netcup 2026-08 thrash freeze).
# sshd/tailscaled live in system.slice — out of scope, lifelines safe.
# Monitoring is continuous and event-driven — replaces the "sweep every 30
# min" ask with something strictly stronger, per the event-driven compute rule.
#
# Provenance (fleet-ops#71): written 2026-08-26 01:21 IST and applied live
# the same minute. The repo copy landed alongside issue #71's PR; install via
#   sudo install.sh --system
# (or copy this file to /etc/systemd/system/user-1000.slice.d/ and
#   sudo systemctl daemon-reload
# for the manual path documented in README.md).
[Slice]
MemoryHigh=12G
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
