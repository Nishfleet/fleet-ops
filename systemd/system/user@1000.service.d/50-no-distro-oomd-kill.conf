# Ubuntu ships ManagedOOMMemoryPressure=kill at 50%/user@.service
# (10-oomd-user-service-defaults.conf). On 2026-08-26 01:24 IST that stock
# hair-trigger reaped 5 live fleet workers at 75% pressure while the fleet's
# DELIBERATE policy (user-1000.slice, 80%/60s,
# reasoned in-repo from measurement) says throttle-first, kill as exception.
# Neutralize the distro layer; the 80% layer remains the kill authority.
#
# Provenance (fleet-ops#71): written 2026-08-26 01:34 IST, applied live the
# same minute. Pairs with 50-ram-governor.conf above; both are part of
# issue #71's "repo-own the system-scope governor" work.
[Service]
ManagedOOMMemoryPressure=auto
