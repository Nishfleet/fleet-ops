# Lifeline hardening for tailscaled (fleet-ops#455).
# SSH is Tailscale-only on this box; tailscaled down = locked out of the
# access plane. Restart=on-failure does not restart a clean stop or a
# killed-but-exited-zero process. Restart=always is the N+0 equivalent:
# the one process that must come back, keeps coming back.
# StartLimitIntervalSec lives in [Unit] (systemd.unit), not [Service].
# 0 means systemd never benches the lifeline.
#
# Applied by: sudo -n install -D -m 0644 -o root -g root <repo>/<this file> /etc/systemd/system/tailscaled.service.d/50-restart-always.conf && sudo -n systemctl daemon-reload
# Does NOT restart the running daemon. daemon-reload only.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5s
