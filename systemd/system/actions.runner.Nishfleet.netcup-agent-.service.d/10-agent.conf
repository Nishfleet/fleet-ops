# Every agent runner runs in agent.slice. Per-runner caps; the slice caps
# the group. Runner count is the concurrency bound (README "Worker RAM
# admission"): 16 enabled.
# vitest 4 defaults to cores-1 (7) workers per job; 32 jobs x 7 thrashed
# swap on 2026-09-24. AGENTS.md's memory budget rule assumes this is set.
[Service]
Slice=agent.slice
MemoryHigh=3G
MemoryMax=6G
Environment=VITEST_MAX_WORKERS=2
