[Service]
Slice=agent.slice
MemoryHigh=3G
MemoryMax=6G
# on-failure: an OOM kill (agent-26, 2026-09-24 23:53 IST) left the runner offline until restarted by hand.
Restart=on-failure
RestartSec=30s
# Cap vitest workers per job: 32 runners x default (cores-1) workers overran agent.slice (Nish, 2026-09-25).
Environment=VITEST_MAX_WORKERS=2
