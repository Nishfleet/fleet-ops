# Universal failure escalation — global drop-in for ALL user .socket units.
# systemd type drop-ins (socket.d/) apply only to that unit type; service.d/
# does not cover .socket files. Without this file, a failed socket-activation
# unit (bind failure, backlog exhaustion) produces a journal line and nothing
# else — the hourly failed-units sweep was the only backstop. fleet-ops#5855.
#
# Same OnFailure target and exclusion story as service.d/10-escalate.conf:
# OnFailure= is a generic [Unit] directive, valid on socket units. The
# unit-escalation-write script guard's exclusion globs (unit-escalation@*,
# stop-escalation.*, resilience-drill-stub*, probe-*.service, ...) do not
# match vendor socket names, so a failed vendor socket writes a real
# STOP-REASON and enters the SENIOR-AUDITOR pipeline like every other unit.
# The nine loaded vendor sockets on this host (dbus, dirmngr, gpg-agent
# family, keyboxd, pk-debconf-helper, snapd.session-agent) are the canary's
# seeded supervision allowlist; a NEW loaded socket is fail-closed (LOUD).
[Unit]
OnFailure=unit-escalation@%n.service
