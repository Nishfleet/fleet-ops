# fleet-ops#4108: fable-fleet-check is a hand-placed infra tool (allowlist
# class a), but this OOM drop-in was a real file under
# ~/.config/systemd/user/fable-fleet-check.service.d/ — invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean. Pure
# ManagedOOM* override; no ExecStart/ExecStartPre, not new machinery.
# Marks the unit avoid so systemd-oomd deprioritizes it under user-slice
# pressure (senior auditor 2026-09-05).
[Service]
ManagedOOMPreference=avoid
