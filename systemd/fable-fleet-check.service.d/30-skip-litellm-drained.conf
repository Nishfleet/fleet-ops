# fleet-ops#4415: fable-fleet-check is a hand-placed infra tool (allowlist
# class a), but this skip-litellm drop-in was a real file under
# ~/.config/systemd/user/fable-fleet-check.service.d/ — invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean.
#
# TEMPORARY (senior auditor 2026-09-07T20:0xZ, fleet-ops#4410): route
# fable-check back to seat-lib pick_seat instead of the LiteLLM proxy judge
# group. The proxy's judge/senior ladder is OpenAI-compatible-only (Cursor
# cannot be a litellm deployment — proprietary protocol) and BOTH of its
# upstreams were drained: grok-oauth 426 (CLI version gate) + openrouter 402
# (credits exhausted — MONEY, Nish-only, escalated 2026-09-07T16:45Z).
# judge->senior->worker-capable died at every hop, so fable-check
# crash-looped to StartLimit (unit-failure trip 2026-09-08T01:30 IST).
# seat-lib routes senior-review to cursor/cursor-grok-4.6-high, which ran
# fable-check SUCCESS 3x on 2026-09-07 (Nish: spend the $400 Cursor pool).
#
# REMOVE WHEN: the durable seat-lib fallback lands (fleet-ops#4410) OR
# openrouter credits are restored AND the P3 native Cursor adapter lands in
# the proxy judge group — then delete this drop-in and re-enable P2.
#
# Pure Environment override (AGENT_CRON_SKIP_LITELLM escape hatch, tested in
# tests/agent-cron-fable-check-litellm-routing.test.sh); no ExecStart/
# ExecStartPre, not new machinery.
[Service]
Environment=AGENT_CRON_SKIP_LITELLM=1
