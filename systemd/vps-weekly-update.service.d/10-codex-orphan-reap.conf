# fleet-ops#78: reap the unmanaged Codex app-server at the start of the
# weekly update (Sun 03:30 IST), after the 15-minute quiesce drain.
# Maintenance flag is still `quiescing`, so the gate allows a kill even
# with live peers. Leading '-' means a failed reap cannot skip apt/npm.
[Service]
ExecStartPre=-/home/nish/.local/bin/codex-orphan-reap
