# Universal failure escalation — global drop-in for ALL user .timer units.
# systemd type drop-ins (timer.d/) apply only to that unit type; service.d/
# does not cover .timer files. Without this file, a failed timer has empty
# OnFailure and never enters the SENIOR-AUDITOR pipeline. fleet-ops#618.
#
# Same OnFailure target and exclusion story as service.d/10-escalate.conf:
# unit-escalation-write refuses escalation-daily-sweep.timer (and the rest
# of the anti-recursion set) so this drop-in cannot feed the sweep its own
# failure.
[Unit]
OnFailure=unit-escalation@%n.service
