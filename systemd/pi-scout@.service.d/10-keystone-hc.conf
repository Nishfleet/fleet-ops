# Best-effort healthchecks.io ping after a successful scout tick
# (fleet-ops#455). Type=oneshot: ExecStartPost runs only if ExecStart
# succeeded. The 96-line bin/keystone-hc-ping wrapper this replaced was one
# curl behind a hand-rolled env-file parser; EnvironmentFile= is the stock
# systemd feature that reads the URL, and '-' on both the file and the
# command keeps the old contract (missing file or unset URL = silent skip,
# a missed ping never fails the tick).
[Service]
EnvironmentFile=-/home/nish/.config/fleet-ops/keystone-hc.env
ExecStartPost=-/usr/bin/curl -fsS -m 10 --retry 3 "${HC_URL_SCOUT}"
