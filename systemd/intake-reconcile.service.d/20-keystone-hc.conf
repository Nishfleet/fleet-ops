# Best-effort healthchecks.io ping after a successful intake-reconcile
# tick (fleet-ops#455). Type=oneshot: ExecStartPost runs only if ExecStart
# succeeded. bash -c wrapper dodges CI systemd-analyze verify.
[Service]
ExecStartPost=/bin/bash -c 'exec /home/nish/.local/bin/keystone-hc-ping reconcile'
