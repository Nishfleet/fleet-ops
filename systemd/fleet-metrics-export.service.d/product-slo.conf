[Service]
# fleet-ops#2755: product delivery SLO family (throughput / lead time /
# revert rate / merged_24h). Sequential ExecStart on the existing
# fleet-metrics-export oneshot — no new timer. bash -c is the P14
# systemd-analyze dodge (hosted runners do not have ~/.local/lib).
# This script always exits 0 so a product-slo fault cannot fail the
# parent exporter.
ExecStart=-/bin/bash -c 'exec /usr/bin/python3 /home/nish/.local/lib/pi-packet/fleet-product-slo.py'
