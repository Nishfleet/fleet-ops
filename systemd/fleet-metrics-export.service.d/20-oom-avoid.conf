# fleet-ops#4521: this OOM drop-in was a real file under
# ~/.config/systemd/user/fleet-metrics-export.service.d/ — invisible to the
# unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo +
# MANIFEST so deploy symlinks it and the drop-in hunt stays clean. Pure
# ManagedOOM* override; no ExecStart/ExecStartPre, not new machinery.
# fleet-metrics-export is a low-priority metrics exporter that keeps getting
# OOM-killed as a victim under system memory pressure (bursts of concurrent
# 0509 worker `tsc -b` builds, 19 procs / ~7.8GB RSS). Marks it avoid so
# systemd-oomd deprioritizes it under user-slice pressure, consistent with
# fable-fleet-check and codex-remote-control (senior auditor 2026-09-05).
# The exporter is self-healing (5-min timer retries), but the failed state
# trips unit-escalation each time; deprioritizing reduces the recurrence.
[Service]
ManagedOOMPreference=avoid
