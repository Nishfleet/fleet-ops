# fleet-ops#1137: truth staleness metrics. Run the checker on the existing
# exporter tick (no new timer needed — the checker reads its own cache, so
# a rapid re-run just serves cached results). bash -c is the P14 systemd-analyze
# dodge; always exits 0 so a staleness fault cannot fail the parent exporter.
[Service]
ExecStart=-/bin/bash -c 'exec /usr/bin/python3 /home/nish/.local/libexec/staleness-checker.py'