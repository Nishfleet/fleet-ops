# fleet-ops#1137: truth staleness metrics. Run the checker on the existing
# exporter tick (no timer of its own). Export-only since fleet-ops#4149: the
# hand-built weekly timer + issue filing were retired — TruthStalenessMismatch
# in config/fleet_rules.yml notifies instead. bash -c is the P14
# systemd-analyze dodge; always exits 0 so a staleness fault cannot
# fail the parent exporter.
[Service]
ExecStart=-/bin/bash -c 'exec /usr/bin/python3 /home/nish/.local/libexec/staleness-checker.py'