[Service]
# fleet-ops#2759: intake prioritization effectiveness family (precedence-band
# product-first hold -> product merge lift). Sequential ExecStart on the
# existing fleet-metrics-export oneshot — no new timer. bash -c is the P14
# systemd-analyze dodge (hosted runners do not have ~/.local/lib/pi-packet).
# Always exits 0 so an intake-effectiveness fault cannot fail the parent
# exporter; the FleetIntakeEffectivenessAbsent absent() rule catches a dead
# exporter by the missing fleet_intake_effectiveness_last_run_seconds gauge.
ExecStart=-/bin/bash -c 'exec /usr/bin/python3 /home/nish/.local/lib/pi-packet/intake-prioritization-effectiveness.py --export'