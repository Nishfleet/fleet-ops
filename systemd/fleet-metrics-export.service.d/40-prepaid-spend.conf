[Service]
# Second cut 2026-09-18: bin/fleet-prepaid-util-canary is the PRODUCER of
# /var/lib/prometheus/node-exporter/prepaid-spend.prom (fleet_prepaid_spend_usd,
# fleet_prepaid_pool_usd, fleet_cursor_api_bucket_remaining_usd), which
# FleetCursorPrepaidBurnPacingLow and the money-boundary rules pace the real
# Cursor $400 Included-API bucket on. Its only scheduler was
# fleet-heartbeat-tier1 block 38, deleted in 354a5e908 — without this the
# metric freezes and the rules pace on a stale pool, which is exactly the
# fleet-ops#5993 regression #6114 had to revert.
#
# Sequential ExecStart on the existing fleet-metrics-export oneshot: no new
# unit, no new timer, no new schedule to justify. Same shape as
# product-slo.conf. The leading `-` and the script's own exit-0-on-unreachable
# behaviour keep a vendor hiccup from failing the parent exporter; the absent()
# leg of the pacing rule is what notices a genuinely dead reader.
ExecStart=-/bin/bash -c 'exec /home/nish/.local/bin/fleet-prepaid-util-canary'
