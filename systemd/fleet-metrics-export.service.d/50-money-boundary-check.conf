[Service]
# Second cut 2026-09-18: bin/money-boundary-raise --check lost its only
# scheduler when fleet-heartbeat-tier1 block 38 was deleted (354a5e908). The
# check is the money-boundary starvation gate: it finds seats benched at a
# far-future money wall with no MONEY-BOUNDARY ledger line and pages Nish.
# Money paging is Nish-reserved and load-bearing, so it must keep a schedule.
#
# Same rehoming shape as 40-prepaid-spend.conf: an ExecStartPost on the
# existing fleet-metrics-export oneshot. No new unit, no new timer, no new
# schedule to justify. The leading '-' keeps a check fault from failing the
# parent exporter; nish_boundary_money_pages_total (emitted by the exporter
# itself) is what shows the pages are landing.
ExecStartPost=-/home/nish/.local/bin/money-boundary-raise --check
