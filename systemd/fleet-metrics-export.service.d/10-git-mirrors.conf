# fleet-ops#1213: lightweight fetch of local bare mirrors on the existing
# 5-min exporter tick so packet clones can --reference-if-able. Named
# reason for piggybacking rather than a new timer: heartbeat forbids new
# schedules; a fetch fault must not fail Prometheus export (leading '-').
# Mirrors are read-only fetch targets; never push.
[Service]
ExecStartPost=-/home/nish/.local/bin/git-mirror-update
