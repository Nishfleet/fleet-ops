[Service]
# fleet-ops#2757: canary effectiveness family. Sequential ExecStart on the
# existing fleet-metrics-export oneshot — no new timer. bash -c is the
# P14 systemd-analyze dodge (hosted runners do not have ~/.local/lib).
# This script always exits 0 so a canary-effectiveness fault cannot fail
# the parent exporter.
ExecStart=-/bin/bash -c 'exec /usr/bin/python3 /home/nish/.local/lib/pi-packet/canary-effectiveness.py'
