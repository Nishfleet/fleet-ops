[Service]
# fleet-ops#1211: loss-accounting family. Sequential ExecStart on the
# existing fleet-metrics-export oneshot — no new timer. bash -c is the
# P14 systemd-analyze dodge (hosted runners do not have ~/.local/libexec).
# This script always exits 0 so a waste-ledger fault cannot fail the
# parent exporter.
ExecStart=-/bin/bash -c 'exec /usr/bin/python3 /home/nish/.local/libexec/fleet-waste-export.py'
