# fleet-ops#5854 anti-recursion: the organ-death watcher must NOT route its
# own red through STOP-REASON -> stop-escalation.path (the chain it watches).
# Reset the global service.d/10-escalate.conf OnFailure= so a red/dead
# watcher escalates OUT-OF-BAND only: the missed healthchecks.io dead-man
# ping (page within the 5-min grace) plus the hourly tier1 failed-units
# sweep, which sees the failed unit. Defense in depth alongside the name
# guard added to bin/unit-escalation-write.
[Unit]
OnFailure=
