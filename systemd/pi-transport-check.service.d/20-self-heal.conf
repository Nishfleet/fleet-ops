# fleet-ops#3111: self-heal the pi transport on the EXISTING unit (no new
# unit). The base pi-transport-check.service ExecStart (owned by the pi
# package) is detection-only and escalates via OnFailure — but the escalation
# path itself runs pi, so a clobbered ~/.local/bin/pi meant nothing could
# repair it and the fleet starved for 33h while seats were poisoned.
#
# ExecStartPost= does NOT fire on a failed ExecStart for Type=oneshot, so the
# self-heal wrapper IS ExecStart: it calls the existing pi-transport-check
# probe before and after healing (the probe is still the guard), heals via
# `npm rebuild -g @earendil-works/pi-coding-agent` (npm re-creates the bin
# symlink — no hand-written symlink logic, Nish 2026-09-04), and only exits 1
# if the package itself is broken, which is the failed unit state itself.
#
# Second cut 2026-09-18: 10-no-direct-notify.conf is gone and so is the
# fleet-heartbeat-failed-notify.service it named, but the base unit (owned by
# the pi package, hand-placed, not repo-owned) still carries
# OnFailure=fleet-heartbeat-failed-notify.service. Reset it here rather than
# keeping a second drop-in alive only to blank a line: an OnFailure= pointing
# at a unit that does not exist is a dangling reference, and the repair now
# lives in this unit's own ExecStart.
[Unit]
OnFailure=

[Service]
ExecStart=
ExecStart=/home/nish/.local/bin/pi-transport-self-heal
