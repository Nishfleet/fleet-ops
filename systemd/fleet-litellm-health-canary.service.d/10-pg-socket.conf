# fleet-ops#4439: this drop-in was a real file under the live drop-in dir
# (~/.config/systemd/user/fleet-litellm-health-canary.service.d/), invisible
# to the unit-name-only hunt (fleet-ops#2924 / #1548). Absorbed into the repo
# + MANIFEST so deploy symlinks it and the drop-in hunt stays clean.
#
# Point the postgres probe at the live user-level socket dir. The running
# postgres (PG16, user-level, run as nish) listens on a custom socket dir
# (/home/nish/.local/share/fleet-litellm-postgres/run), NOT the distro
# default /var/run/postgresql (owned by postgres, unwritable by nish).
# Without this, pg_isready reads FLEET_LITELLM_PG_HOST (default
# /var/run/postgresql) and fails, so the canary writes
# fleet_litellm_postgres_up 0 -> FleetLitellmPostgresAbsent fires despite a
# healthy postgres. fleet-ops#4130.
[Service]
Environment=FLEET_LITELLM_PG_HOST=/home/nish/.local/share/fleet-litellm-postgres/run
