# Universal failure escalation for SCOPE units — sibling of
# service.d/10-escalate.conf (fleet-ops#4266). Transient SCOPE units
# (systemd-run --user --scope, e.g. "systemd-run --scope mycmd") do NOT get
# service.d drop-ins, so they were the one clean path to run detached work
# with NO OnFailure — a stop of a scope is invisible to the escalation
# rail. This generic scope.d drop-in mirrors service.d so every scope feeds
# unit-escalation@<scope>.scope.service like everything else. The template
# instance is the full scope name INCLUDING the .scope suffix (%n).
#
# Anti-recursion is enforced by the SCRIPT GUARD (the same layer that covers
# concrete exclusions for service.d): unit-escalation-write refuses
# init.scope and app-*.scope (systemd's own manager scope + Chromium/
# flatpak app sandbox scopes on this box — browser tab churn must not
# summon the SENIOR AUDITOR) and exits 0 without writing. A generic drop-in
# cannot express per-instance exclusions; keep the guard list in lockstep
# with bin/fleet-escalation-canary's is_escalation_excluded().
[Unit]
OnFailure=unit-escalation@%n.service