# Process-count containment for fleet work (added 2026-08-23 after an incident).
#
# WHY: a recursion in the spec gate reached 24,945 processes, drove load to 32
# on 8 cores, left 305 MB RAM free, and stalled the fleet for over an hour.
#
# WHY NOT A CPU QUOTA: Nish moved CPU arbitration to dynamic weights on
# 2026-08-10 and that decision stands. A CPU quota would not have helped anyway
# - 25k processes each using a sliver of CPU still buried the box. The failure
# was process COUNT, so the limit is on process count.
#
# WHY 8000 (fleet-ops#3280, measured 2026-09-04 07:50Z): an idle pi process is
# 105-140 MB / 11 threads. systemd TasksMax counts tasks (threads), so 25
# workers each running 1 implementer + 8 scouts is 25 * 9 * 11 = 2475 tasks
# from pi threads alone, plus bash/git/test children. The old 3000 (~3x the
# 1,106 busiest legitimate level) would clip that manager-loop shape. 8000 is
# ~3x the 2475 pi-thread floor and still ~3x below the 24,945 runaway.
# spawn-guard-core.ts FLEET_SPAWN_SOFT_CEILING=7500 fails loud before this
# silent kill.
#
# ADMISSION AUTHORITY IS STILL RAM: MemAvailable and ram_gb_per_worker in
# seat-caps.json decide how many workers start. Raising TasksMax is not a
# licence to admit more work.
[Slice]
TasksMax=8000
