# Fleet hard blocks. No glue (global-standing-rules.md "No glue"; Nish
# 2026-09-29: non-negotiable, enforced by a machine, not by review) lands here,
# so each rule has one home. It replaces the cut no-glue job (fleet-ops#8960)
# with stock semgrep config; the required CI step runs this file with --error.
rules:
  - id: no-script-files
    languages: [generic]
    severity: ERROR
    message: >-
      No glue: no scripts, wrappers or script directories. Use a stock tool's own
      config, a unit line, a prompt line, or the product's own code. A new organ
      needs Nish's explicit yes.
    pattern-regex: '(?s)\A.'
    paths:
      include:
        - "*.sh"
        - "*.bash"
        - "*.zsh"
        - "*.py"
        - "*.pl"
        - "*.rb"
        - "/bin/"
        - "/scripts/"
        - "/libexec/"
        - "/lib/"
        - "/ops/"
        - "/hooks/"
        - "/.github/scripts/"
        - "/tools/"
        - "/.fleet/"
        - "/template/extensions/"
  - id: no-inline-program
    languages: [generic]
    severity: ERROR
    message: >-
      No glue: no interpreter program inline in a workflow, unit or prompt
      (python -c, node -e, a heredoc fed to an interpreter). Use a stock tool's
      flag or the product's own code.
    pattern-regex: '(?m)^[ \t]*(?:-[ \t]+run:[ \t]*|run:[ \t]*|Exec\w*=[ \t]*|\$[ \t]+)?(?:python3?|node|perl|ruby|deno|bun)[ \t]+(?:-c|-e|-p|-)(?:[ \t]|$)|(?:python3?|node|perl|ruby|bash|sh)[ \t]+-?[ \t]*<<-?[ \t]*[''"]?\w+'
    paths:
      include:
        - "/.github/workflows/"
        - "/systemd/"
        - "/prompts/"
  # Reaching Nish. The alertmanager escalation stack was deleted 2026-09-29
  # (fleet-ops#8958), taking its escalation command and alert with it; a
  # reserved-class item now reaches Nish from the vault line "Only these reach
  # Nish" (fleet-ops#9018) instead. A dangling reference is the dark channel
  # this rule exists to stop.
  - id: no-amtool-escalation
    languages: [generic]
    severity: ERROR
    message: >-
      The alertmanager escalation stack is deleted (fleet-ops#8958): its
      escalation command and alert no longer exist on any host. Escalate a
      reserved-class item as a fleet-ops issue labelled needs-nish-decision
      and assigned to nish3451, per global-standing-rules.md "Only these reach
      Nish".
    pattern-regex: '(?i)amtool|NishEscalation'
    paths:
      exclude:
        - /.semgrep/**
