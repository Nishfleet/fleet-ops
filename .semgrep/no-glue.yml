# Fleet hard blocks. No glue (global-standing-rules.md "No glue"; Nish
# 2026-09-29: non-negotiable, enforced by a machine, not by review) lands here,
# so each rule has one home. It replaces the cut no-glue job (fleet-ops#8960)
# with stock semgrep config; ci.yml runs this file with `semgrep scan --error`.
rules:
  - id: no-script-files
    languages: [generic]
    severity: ERROR
    message: >-
      No glue: no scripts, wrappers or script directories. Use a stock tool's own
      config, a unit line, a prompt line, or the product's own code. A new organ
      needs Nish's explicit yes.
    pattern-regex: '(?s)\A.'
    paths:
      include:
        - "*.sh"
        - "*.bash"
        - "*.zsh"
        - "*.py"
        - "*.pl"
        - "*.rb"
        - "/bin/"
        - "/scripts/"
        - "/libexec/"
        - "/lib/"
        - "/ops/"
        - "/hooks/"
        - "/.github/scripts/"
        - "/tools/"
        - "/.fleet/"
        - "/template/extensions/"
  - id: no-inline-program
    languages: [generic]
    severity: ERROR
    message: >-
      No glue: no interpreter program inline in a workflow, unit or prompt
      (python -c, node -e, a heredoc fed to an interpreter). Use a stock tool's
      flag or the product's own code.
    pattern-regex: '(?m)^[ \t]*(?:-[ \t]+run:[ \t]*|run:[ \t]*|Exec\w*=[ \t]*|\$[ \t]+)?(?:python3?|node|perl|ruby|deno|bun)[ \t]+(?:-c|-e|-p|-)(?:[ \t]|$)|(?:python3?|node|perl|ruby|bash|sh)[ \t]+-?[ \t]*<<-?[ \t]*[''"]?\w+'
    paths:
      include:
        - "/.github/workflows/"
        - "/systemd/"
        - "/prompts/"
        - "/rootfs/"
        - "/ansible/"
  # Reaching Nish. The alertmanager escalation stack was deleted 2026-09-29
  # (fleet-ops#8958), taking its escalation command and alert with it. The
  # replacement path lives in one place only — the vault line "Only these
  # reach Nish" in global-standing-rules.md (fleet-ops#9018) — so this rule
  # is a pointer, not a second source. A dangling reference is the dark
  # channel this rule exists to stop.
  - id: no-amtool-escalation
    languages: [generic]
    severity: ERROR
    message: >-
      The alertmanager escalation stack (repair dispatch, the manual
      escalation command and its alert) was deleted in fleet-ops#8958 and is
      not coming back. Alertmanager itself runs again for the dead-man
      heartbeat and the hermes-gateway page, which are rules and routes in
      rootfs/etc/prometheus, never a command. Reach Nish the way
      global-standing-rules.md "Only these reach Nish" says, not through this
      deleted path.
    # \b keeps the match word-sized: `paramtool` or `amtoolkit` must not fire.
    # `amtool check-config` and `amtool config routes test` validate the config
    # the dead-man and the hermes-gateway page use; they send nothing, so they
    # are the only uses allowed.
    pattern-regex: '(?i)\b(amtool(?![ \t]+(?:check-config|config[ \t]+routes[ \t]+test)\b)|NishEscalation)\b'
    paths:
      # The exclude exists only so this rule's own literals cannot self-match.
      exclude:
        - /.semgrep/**
