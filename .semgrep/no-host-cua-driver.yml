# cua-driver never runs on the netcup host (Nish 2026-10-06, fleet-ops#9297):
# the host has no display and cua-driver cannot run headless. Every Linux Space
# image ships its own copy, reached with list_tools/call_tool(space=...).
# Mentions stay legal; only an install, a wiring flag, an MCP server entry or a
# download fires. ci.yml scans the repo with this file next to no-glue.yml, and
# runs no-host-cua-driver.txt (the ruleid:/ok: fixtures) with `semgrep --test`.
# It is its own file because no-glue.yml's no-script-files rule matches line 1
# of any explicit test target, which no annotation can cover.
rules:
  - id: no-host-cua-driver
    languages: [generic]
    severity: ERROR
    message: >-
      cua-driver is never installed or wired on the netcup host (Nish
      2026-10-06, fleet-ops#9297): it has no display and cua-driver cannot run
      headless. Use the copy inside a Cua Space through list_tools and
      call_tool(space=...).
    pattern-regex: '(?i)--select[ \t=]+["'']?cua-driver\b|\bcua[ \t]+agents[ \t]+setup\b[^\n]*--cua-driver\b|\bcua-driver["'']?(?:[ \t]+|[ \t]*,[ \t]*(?:"args"|args)[ \t]*:[ \t]*\[[ \t]*)["'']?mcp\b|\b(?:curl|wget|uvx|npx|gh[ \t]+release[ \t]+download|(?:pip[3x]?|-m[ \t]+pip|uv[ \t]+(?:tool|pip)|cargo|brew|npm|pnpm|yarn|go|apt(?:-get)?|dnf|snap)[ \t]+(?:install|i|add))\b[^\n]*cua-driver'
    paths:
      # The excludes exist only so this rule's own literals and fixtures cannot
      # self-match in a repo scan; `semgrep --test` still reads the fixture.
      exclude:
        - /.semgrep/no-host-cua-driver.yml
        - /.semgrep/no-host-cua-driver.txt
