#!/usr/sbin/nft -f

# Scoped per-table rebuild (destroy + redeclare), never `flush ruleset`:
# this file must not touch ufw's `ip`/`ip6 filter` tables on restart (fleet-ops#8258).
destroy table inet filter
table inet filter {
	chain input {
		type filter hook input priority filter;
	}
	chain forward {
		type filter hook forward priority filter;
	}
	chain output {
		type filter hook output priority filter;
	}
}

# fleet-ops#8258 / CONTAINER-WORKER.md section 4 - egress ACL for the
# containerized worker slice. Hand-maintained config: a stale gh_v4 entry
# fails loud (worker cannot reach GitHub). Independent of the ip filter
# table ufw manages.
destroy table inet fleetworker
table inet fleetworker {
  set gh_v4 {
    type ipv4_addr
    flags interval
    # github.com/meta -> .web + .api + .git, IPv4 only (78 CIDRs, 2026-09-22)
    elements = { 4.208.26.193/32, 4.208.26.197/32, 4.208.26.198/32,
                 4.208.26.200/32, 4.225.11.194/32, 4.225.11.199/32,
                 4.225.11.200/32, 4.225.11.201/32, 4.228.31.144/32,
                 4.228.31.145/32, 4.228.31.149/32, 4.228.31.150/32,
                 4.237.22.34/32, 4.237.22.36/32, 4.237.22.38/32,
                 4.237.22.40/32, 4.249.131.163/32, 4.249.131.164/32,
                 4.249.131.166/32, 20.26.156.210/32, 20.26.156.213/32,
                 20.26.156.214/32, 20.26.156.215/32, 20.27.177.113/32,
                 20.27.177.116/32, 20.27.177.118/32, 20.27.177.119/32,
                 20.29.134.17/32, 20.29.134.19/32, 20.29.134.22/32,
                 20.29.134.23/32, 20.87.245.0/32, 20.87.245.2/32,
                 20.87.245.4/32, 20.87.245.6/32, 20.175.192.146/32,
                 20.175.192.147/32, 20.175.192.149/32, 20.199.39.227/32,
                 20.199.39.228/32, 20.199.39.232/32, 20.200.245.244/32,
                 20.200.245.245/32, 20.200.245.247/32, 20.200.245.248/32,
                 20.201.28.148/32, 20.201.28.151/32, 20.201.28.152/32,
                 20.205.243.160/32, 20.205.243.161/32, 20.205.243.166/32,
                 20.205.243.168/32, 20.207.73.81/32, 20.207.73.82/32,
                 20.207.73.83/32, 20.207.73.85/32, 20.217.135.0/32,
                 20.217.135.1/32, 20.217.135.4/32, 20.217.135.5/32,
                 20.233.83.145/32, 20.233.83.146/32, 20.233.83.148/32,
                 20.233.83.149/32, 48.202.248.38/32, 48.202.248.39/32,
                 48.202.248.40/32, 48.204.201.2/32, 48.204.201.5/32,
                 48.204.201.6/32, 140.82.112.0/20, 143.55.64.0/20,
                 172.182.252.130/32, 172.182.252.133/32, 172.182.252.135/32,
                 172.182.252.137/32, 185.199.108.0/22, 192.30.252.0/22 }
  }
  chain output {
    type filter hook output priority filter; policy accept;
    socket cgroupv2 level 5 "user.slice/user-1000.slice/user@1000.service/fleet.slice/fleet-container.slice" ip daddr 127.0.0.0/8 accept
    socket cgroupv2 level 5 "user.slice/user-1000.slice/user@1000.service/fleet.slice/fleet-container.slice" ip daddr @gh_v4 accept
    socket cgroupv2 level 5 "user.slice/user-1000.slice/user@1000.service/fleet.slice/fleet-container.slice" ip daddr 10.0.2.0/24 accept
    socket cgroupv2 level 5 "user.slice/user-1000.slice/user@1000.service/fleet.slice/fleet-container.slice" counter reject
  }
}
