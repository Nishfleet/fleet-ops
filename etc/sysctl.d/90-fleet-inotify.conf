# /etc/sysctl.d/90-fleet-inotify.conf — headroom for the per-uid inotify
# watch budget (fleet-ops#5839).
#
# Observed 2026-09-12 11:19-11:40 IST: a transient uid-1000 tree-watcher
# consumed the whole fs.inotify.max_user_watches budget (124083) and every
# systemd --user unit start logged 2x "Failed to add control|memory inotify
# watch descriptor for control group ...: No space left on device" (~50
# lines/2h), while the steady state sat at ~273 watches / 10 instances —
# the limiter is burst depth, not steady-state leak. 524288 gives 4.2x
# headroom at a worst-case cost of ~512MB kernel (each watch ~1KB) on a
# 15GB box (~3%); 512 instances (from 128) covers the ~50-unit start
# bursts with 10x margin.
#
# Applying this needs sudo (Nish-reserved). Install step:
#   sudo install -m 644 etc/sysctl.d/90-fleet-inotify.conf /etc/sysctl.d/
#   sudo sysctl --system
# Verify after apply:
#   cat /proc/sys/fs/inotify/max_user_watches   # expect 524288
#   cat /proc/sys/fs/inotify/max_user_instances # expect 512
#
# Rollback: delete /etc/sysctl.d/90-fleet-inotify.conf; journal noise
# returns but nothing else depends on it.
#
# MANIFEST deploys this file on the next `install.sh --system`; the sudo
# step above is the only part that cannot be done by a worker.

fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
