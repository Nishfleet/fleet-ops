name: Repo standards apply

# Weekly idempotent sweep that enforces the declarative repo standard
# (.github/scripts/repo-standards.lib.mjs) across every non-archived repo in
# Nishfleet + nish3451: label triad, branch protection, CODEOWNERS on gate
# paths, merge_group triggers, SHA-pinned thin-caller workflows, and
# .fleet/standards-exceptions.yml honoring.
#
# Sibling of repo-standards-sync.yml (which runs daily for allow_auto_merge +
# canonical file sync). This workflow covers the settings + thin-caller
# surface that file sync cannot reach: branch-protection payloads, label
# creation, CODEOWNERS gate-path coverage, and SHA-current thin callers.
#
# Named reason for the weekly cadence (per the compute rule): new repos appear
# out-of-band; org webhooks are unavailable on the free plan, so an
# event-driven "repo created" trigger is not available. One idempotent weekly
# sweep is the minimal mechanical form. (Daily would be wasteful — settings
# drift slowly; weekly catches a new repo within 7 days, which the new-repo
# bootstrap doc covers with a one-command fast path for anyone who wants it
# sooner.)
#
# DRIFT handling: settings drift is applied via API + logged; file drift
# (CODEOWNERS, thin callers) is reported and left to the file-sync action / a
# follow-up PR (one writer per repo). Never weakens anything found stronger.
# Hands-off + local-richer repos skipped. Every active exception is reported.
#
# Blocked on: the nishfleet-worker App holding contents+workflows+
# pull-requests write on BOTH accounts (one installation each on Nishfleet
# and nish3451 — fleet-ops#6793 PR 2, Nish-side settings). The credential is
# minted per run below via actions/create-github-app-token (≤1h expiry); the
# never-expiring classic PAT this file used to require (FLEET_SYNC_PAT) is
# banned — ci.yml fails on any secrets.*PAT reference under
# .github/workflows/. Also blocked: the apply machinery itself —
# .github/scripts/repo-standards-*.mjs and enqueue-green-prs.mjs were deleted
# in #7861, so this file cannot be promoted until an apply mechanism exists
# again. Fails LOUD if a mint or the reach probe fails.

on:
  schedule:
    # Weekly, Mondays 03:17 UTC. Off-peak for the org; idempotent so a missed
    # run costs nothing.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply settings fixes (default: dry-run report only)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: repo-standards-apply
  cancel-in-progress: false

jobs:
  sync:
    name: Apply repo standards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fleet-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint app token (Nishfleet)
        id: app-token-nishfleet
        # ≤1h installation token per run (fleet-ops#6793), same action pin as
        # the old auto-merge-arm path. continue-on-error lets a missing App
        # secret fall through to the verify step's explicit error instead of
        # dying here on a generic action failure.
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
          private-key: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
          owner: Nishfleet

      - name: Mint app token (nish3451)
        id: app-token-nish3451
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
          private-key: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
          owner: nish3451

      - name: Verify minted tokens reach both orgs
        env:
          TOKEN_NISHFLEET: ${{ steps.app-token-nishfleet.outputs.token }}
          TOKEN_NISH3451: ${{ steps.app-token-nish3451.outputs.token }}
        run: |
          set -euo pipefail
          # App-token mode of the old FLEET_SYNC_PAT verify gate (deleted with
          # bin/verify-fleet-sync-pat in #7907): the probe is
          # /installation/repositories — the repos the installation can see —
          # not PAT scopes (fleet-ops#6793). An empty token means the App
          # secrets are missing or the App is not installed on that account.
          for org in Nishfleet nish3451; do
            var="TOKEN_$(printf '%s' "$org" | tr '[:lower:]' '[:upper:]')"
            tok="${!var}"
            if [ -z "$tok" ]; then
              echo "::error::no installation token minted for $org — NISHFLEET_WORKER_APP_ID/NISHFLEET_WORKER_PRIVATE_KEY secrets missing, or the nishfleet-worker App is not installed on $org (fleet-ops#6793)."
              exit 1
            fi
            count="$(GH_TOKEN="$tok" gh api /installation/repositories --jq '.total_count')"
            echo "$org: installation sees $count repositories"
          done

      - name: Run standards sync
        env:
          # Installation tokens are single-account: the apply mechanism
          # consumes one per org (the single-PAT GH_TOKEN env went with the
          # PAT).
          GH_TOKEN_NISHFLEET: ${{ steps.app-token-nishfleet.outputs.token }}
          GH_TOKEN_NISH3451: ${{ steps.app-token-nish3451.outputs.token }}
          APPLY: ${{ inputs.apply || false }}
        run: |
          set -euo pipefail
          args="--org Nishfleet --org nish3451 --format markdown --out-dir out"
          if [ "$APPLY" = "true" ]; then args="$args --apply"; fi
          node .github/scripts/repo-standards-apply.mjs $args

      - name: Enqueue green fleet PRs (amendment 2 part c)
        env:
          GH_TOKEN_NISHFLEET: ${{ steps.app-token-nishfleet.outputs.token }}
          GH_TOKEN_NISH3451: ${{ steps.app-token-nish3451.outputs.token }}
          APPLY: ${{ inputs.apply || false }}
        run: |
          set -euo pipefail
          args="--org Nishfleet --org nish3451 --format markdown --out-dir out"
          if [ "$APPLY" = "true" ]; then args="$args --apply"; fi
          node .github/scripts/enqueue-green-prs.mjs $args

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-standards-drift
          path: out/
          retention-days: 28
