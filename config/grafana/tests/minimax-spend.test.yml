# Fixture for the minimax-spend rule (fleet-ops#9470).
#
# Two kinds of case, as in prompt-cache-hit.test.yml, because they check
# different things:
#
#  - alert_rule_test cases run the rule through the Prometheus alert engine and
#    answer "does it fire".
#  - promql_expr_test cases evaluate the deployed A expression on its own and
#    assert its VALUE in dollars, which is the half an alert_rule_test cannot
#    see: the threshold `> 4` reads 1 as Alerting and 0 as Normal, and only the
#    value tells the reader how close the four rows are to the cap.
#
# The unit under test is the four-row scope: the sum over the named model_ids,
# not the four rows individually and not the rest of the proxy's spend. A row
# that spends its whole $1.25 on its own must not page; a non-MiniMax row that
# spends $100 must not page either.
#
# Every series is a counter of dollars with one sample per day, and every
# counter moves only once inside the 24h window, so increase() reads the move
# exactly. $1.25/day per row is what config/litellm-proxy.yaml sets, so the
# fired case below is the four rows all at their cap, exactly $5.
evaluation_interval: 1h
rule_files:
- minimax-spend.test.rules.yml
tests:
# Fires: all four rows draw their whole $1.25 cap in a day, so the 24h total is
# exactly $5, over 80% of $5.
- alert_rule_test:
  - alertname: MiniMaxSpend
    eval_time: 48h
    exp_alerts:
    - exp_labels:
        grafana_folder: fleet
        signal: minimax-spend
      exp_annotations:
        summary: 'MiniMax M3.1 spend at the daily cap'
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-capable"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-cheap"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-cheap"}
    values: '0 1.25 2.5'
  interval: 24h
# Stays Normal: the same four rows drawing $0.75 each, about 60% of the cap.
- alert_rule_test:
  - alertname: MiniMaxSpend
    eval_time: 48h
    exp_alerts: []
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 0.75 1.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-capable"}
    values: '0 0.75 1.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-cheap"}
    values: '0 0.75 1.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-cheap"}
    values: '0 0.75 1.5'
  interval: 24h
# Stays Normal: exactly $4.00 spent across the four rows. The threshold is
# strictly greater than 4, so the case at the line does not page. (The 24h sum
# here is 4.0 on the nose, which is why this case can exist at all.)
- alert_rule_test:
  - alertname: MiniMaxSpend
    eval_time: 48h
    exp_alerts: []
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 1 2'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-capable"}
    values: '0 1 2'
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-cheap"}
    values: '0 1 2'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-cheap"}
    values: '0 1 2'
  interval: 24h
# Stays Normal: one row draws its whole $1.25 cap and the other three are idle.
# The cap is per deployment (LiteLLM filters that row out of the routing
# decision), so a single row at its cap is not 80% of the fleet's day.
- alert_rule_test:
  - alertname: MiniMaxSpend
    eval_time: 48h
    exp_alerts: []
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-capable"}
    values: '0 0 0'
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-cheap"}
    values: '0 0 0'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-cheap"}
    values: '0 0 0'
  interval: 24h
# Stays Normal: another provider's row spends a hundred times the cap. The
# model_id regex is the scope, so a hot GLM row is not a MiniMax alarm.
- alert_rule_test:
  - alertname: MiniMaxSpend
    eval_time: 48h
    exp_alerts: []
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 0.5 1'
  - series: litellm_spend_metric_total{model_id="glm-5.3-flash-worker-capable"}
    values: '0 100 200'
  interval: 24h
# Stays Normal: no MiniMax series at all. The rule's own noDataState is OK, so
# a fleet that stopped using MiniMax pages nobody.
- alert_rule_test:
  - alertname: MiniMaxSpend
    eval_time: 48h
    exp_alerts: []
  input_series:
  - series: litellm_spend_metric_total{model_id="ollama-ds41flashg-worker-capable"}
    values: '0 1 2'
  interval: 24h
# The deployed A expression, verbatim, as Grafana evaluates it before the
# threshold step. The values below are what the threshold then reads.
- promql_expr_test:
  - expr: (sum(increase(litellm_spend_metric_total{model_id=~"minimax-m31-worker-capable|minimax-m31b-worker-capable|minimax-m31-worker-cheap|minimax-m31b-worker-cheap"}[24h])))
    eval_time: 48h
    exp_samples:
    - labels: '{}'
      value: 5
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-capable"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-cheap"}
    values: '0 1.25 2.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-cheap"}
    values: '0 1.25 2.5'
  interval: 24h
# $3.00 across the four rows: below the line, and the total is what the
# threshold reads.
- promql_expr_test:
  - expr: (sum(increase(litellm_spend_metric_total{model_id=~"minimax-m31-worker-capable|minimax-m31b-worker-capable|minimax-m31-worker-cheap|minimax-m31b-worker-cheap"}[24h])))
    eval_time: 48h
    exp_samples:
    - labels: '{}'
      value: 3
  input_series:
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-capable"}
    values: '0 0.75 1.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-capable"}
    values: '0 0.75 1.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31-worker-cheap"}
    values: '0 0.75 1.5'
  - series: litellm_spend_metric_total{model_id="minimax-m31b-worker-cheap"}
    values: '0 0.75 1.5'
  interval: 24h
