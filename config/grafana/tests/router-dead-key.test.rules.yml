# The deployed router-dead-key A expression, inlined verbatim from
# router-dead-row.yaml, wrapped in `(...) > 2` (Grafana's C threshold) and carrying
# the deployed `for: 15m`, so a case that fires here is a case Grafana calls
# Alerting and a case that stays quiet here stays quiet there.
#
# The 30-minute recency gate is multiplied in, not joined with `and`: `and` keeps
# the left value while the right side still has a matching series, whatever that
# series reads, so a row that stopped parking would fire for the rest of the 6 hours.
#
# The bar is 2 parks, not the row rule's 5, because a parked row cannot park again
# until its cooldown ends (15 minutes on the worker rows), so a dead key cannot
# produce more than about four parks an hour: three parks in 6 hours fire.
#
# tests/test_grafana_fixture_drift.py holds this expr and its `for` to the deployed
# rule, so promtool cannot pass on a copy that drifted from it.
groups:
- interval: 5m
  name: router-dead-row
  rules:
  - alert: RouterRowParkedOn401
    expr: "(sum by (model_id) (increase(litellm_deployment_cooled_down_total{exception_status=\"401\"}[6h]))\n* on(model_id)\n(sum by (model_id) (increase(litellm_deployment_cooled_down_total{exception_status=\"401\"}[30m])) > bool 0))\n> 2"
    for: 15m
    labels:
      grafana_folder: fleet
      severity: warning
      signal: router-dead-key
