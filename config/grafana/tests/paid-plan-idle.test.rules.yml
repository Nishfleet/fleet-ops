# The deployed ppi-alibaba rule's A expression, inlined verbatim from
# paid-plan-idle.yaml, wrapped in `> 0`.
#
# The wrapper reproduces Grafana's C threshold (`> 0` over A) the same way
# prompt-cache-hit.test.rules.yml does for its rule: a case that fires here is
# a case Grafana calls Alerting, and a quiet day that reads 0 is dropped here
# exactly as it is Normal there.
#
# The A expression unions the 24-hour absence branch (first: absent_over_time
# returns a series only when absent, so leading with it keeps a vanished row
# paging after 24h even when the counter moved within 7d; with the idle branch
# first, `or` would shadow the absent 1 under the idle 0) with the 7-day idle
# branch; both are aggregations with no labels, so the union is one {} series.
groups:
- interval: 1h
  name: paid-plan-idle
  rules:
  - alert: AlibabaTokenPlanSgIdle
    expr: "(absent_over_time(litellm_deployment_success_responses_total{api_base=~\"https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1.*\"}[24h])\nor\n(sum(increase(litellm_deployment_success_responses_total{api_base=~\"https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1.*\"}[7d])) == bool 0))\n> 0"
    labels:
      grafana_folder: fleet
      plan: alibaba-token-plan-sg
      severity: critical
