# Cloudflare spend watch data source (fleet-ops#9355).
# The Infinity data source (yesoreyeram-infinity-datasource, preinstalled via
# GF_PLUGINS_PREINSTALL_SYNC in fleet-grafana.container) calls
# https://api.cloudflare.com/client/v4 (GraphQL analytics and the billable-usage
# API) with the VPS token from infra/cloudflare-tokens (token key `vps-grafana`:
# Account Analytics Read and Billing Read, locked to this host's addresses) and never sits in
# this file: Grafana reads it with
# $__file{} from the grafana-cloudflare-api-token Podman secret (see the quadlet) at
# provisioning load and stores it encrypted in the Grafana database.
#
# parser 'backend' is required for alerting (the frontend JSON parser cannot
# run inside Grafana's rule evaluation), and auth requires allowedHosts.
apiVersion: 1

datasources:
  - name: Cloudflare
    uid: fleet-cloudflare
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    isDefault: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - https://api.cloudflare.com
      timeoutInSeconds: 60
    secureJsonData:
      bearerToken: $__file{/run/secrets/grafana-cloudflare-api-token}
