# LiteLLM Postgres data source for the session-hop rule (fleet-ops#9475).
# Stock Grafana only, no scripts.
#
# Why a new data source: the session id and the answering row both live only
# in PostgreSQL (LiteLLM_SpendLogs.session_id, model_id). LiteLLM's Prometheus
# metrics carry model id, alias and token counts and no session id at all, so
# #9357's prompt-cache-hit.yaml (Prometheus) cannot express "the same
# session's previous call". #9361's dedicated Grafana data source does.
#
# Why not the router's own login: the router connects as `litellm`, which is
# the login LiteLLM runs its write path with (INSERT on every request). A
# dashboard data source must not share a read-write login, so this data source
# connects as `grafana_ro`, a SELECT-only role (fleet-ops#9475 acceptance).
#
# The `grafana_ro` role (created on the host, outside this repo, where a
# dashboard's reach must end):
#   CREATE ROLE grafana_ro LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
#   GRANT CONNECT ON DATABASE litellm TO grafana_ro;
#   GRANT USAGE ON SCHEMA public TO grafana_ro;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana_ro;
#   REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON ALL TABLES IN SCHEMA public FROM grafana_ro;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO grafana_ro;  -- run as litellm
# Any new table carries SELECT by default; nothing else is possible.
# Denials verified on the live database 2026-10-25: insert, CREATE TABLE,
# DELETE, DROP SCHEMA public all fail as `grafana_ro`.
#
# The password lives in the Podman secret `grafana-postgres-password`
# (ansible/host.yml creates it from the 0600 env file on the host and Grafana
# reads it via $__file{}), never in this file.
apiVersion: 1

datasources:
  - name: LiteLLM Postgres
    uid: fleet-litellm-postgres
    type: postgres
    access: proxy
    url: 127.0.0.1:5432
    user: grafana_ro
    database: litellm
    jsonData:
      postgresVersion: 1500
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 5
      connMaxLifetime: 14400
      timeInterval: 1h
    secureJsonData:
      password: $__file{/run/secrets/grafana-postgres-password}
    editable: false
