# Router dead-row alarm (fleet-ops#9312 class fix). Stock Grafana only, no scripts.
#
# Why: LiteLLM v1.98.0 never cools a 402 or 403 (cooldown_handlers._is_cooldown_required
# cools only 401/404/408/429/5xx), and session_affinity re-pins a dead row, so a row whose
# provider ended the model or ran out of credit fails every caller routed to it until a
# person edits config/litellm-proxy.yaml. CommandCode Space Bunny Alpha answered 403 "no
# longer available" and killed drive#642 build-r2 on 2026-10-07; Cline Space Bunny Alpha
# answered 402 "Insufficient balance" for a day. Both sat unseen. This rule finds the next
# one in an hour instead of by hand.
#
# Rule: any single deployment (model_id) that returned HTTP 402, 403 or 404 more than 5
# times in the last hour while the row is still failing: at least one such failure in the
# last 10 minutes, held for 15 continuous minutes. litellm_deployment_failure_responses_total
# is on the LiteLLM /metrics endpoint Prometheus already scrapes; its exception_status label
# is the upstream status and model_id is the router row id. 429 is never counted: a quota
# wall is a resting row, not a dead one (Nish 2026-10-02).
#
# 401 is a second rule, router-dead-key, on a second signal (fleet-ops#11063). One dead
# provider key answers 401 on every row it backs and only a person can renew it, but a 401
# never reaches litellm_deployment_failure_responses_total: that metric has no 401 series at
# all on v1.105.0, so a regex change here would read nothing. A 401 row is parked by
# AuthenticationErrorAllowedFails 0, and every park increments
# litellm_deployment_cooled_down_total{exception_status="401"} with the row id, which is the
# only surface that carries it. The bar is lower than 5 in an hour because a parked row
# re-probes on its cooldown (15 minutes on the worker rows), so a dead key cannot produce
# more than about four parks an hour: more than 2 parks in 6 hours, still parking in the
# last 30 minutes, held for 15 minutes. On 2026-10-29 two rows backed by one dead
# CommandCode key sat parked all day (34 401 parks in total) while every alert that reads
# 402/403/404 or the group-level state gauge stayed silent, and 11 worker-capable calls
# died on those rows in 24 hours. It is a rule of its own rather than a branch, because its
# bar differs and its issue is a different kind: no worker can renew a key, so its route
# files the issue needs-nish-decision instead of agent-ready (fleet-ops#11081).
#
# Persistence (fleet-ops#9562). The plain 1-hour count paged for a one-minute burst and
# stayed true for the rest of the hour, so a row that answered 402/403/404 for about a
# minute and then healed filed an issue anyway (2026-10-10, twice in 20 minutes; seven
# more in the 2026-10-13 audit cycle). A dead row keeps failing, so the count now carries
# a second factor: at least one such failure in the last 10 minutes. It is a `> bool 0`
# 0/1 multiplied in, not `and`: `and` keeps the left value whenever the right side has a
# matching series, whatever that value (paid-plan-idle.test.rules.yml says the same), so
# a quiet row would still fire. `for: 15m` then holds until the failures persist. Numbers
# from this fleet's Prometheus over 2026-09-20..2026-10-29: the 2026-10-10 flaps held the
# plain count 55m per row and the gated count 10m at most; seven of the eight condition
# runs in the 2026-10-12 audit cycle held 10m or less and the 30m one still fires at 15m;
# every day-long dead row (2026-10-05..07, 2026-09-29..30) still fires. config/grafana/tests
# holds the behaviour as promtool cases; tests/test_grafana_fixture_drift.py fails when
# this file and that fixture drift apart.
#
# Proxy-level failures (the LiteLLM health check, a caller with no router row id) carry
# requested_model and no model_id, and the old sum by (model_id) folded them into one
# unnamed series that the dispatch filed as an empty title twice (fleet-ops#9938,
# fleet-ops#10069). The or-branch fires them per requested_model, so such a page names
# the model it probed; tests/alert_routes_check.py holds the naming shape.
#
# Route: severity warning, so neither rule pages. signal=router-dead-row files a fleet-ops
# issue (agent-ready + priority-now) through the policy tree in cloudflare-spend-contact.yaml,
# and signal=router-dead-key files one labelled needs-nish-decision, because a rejected key
# is Nish's to renew. Both issues ask Nish whether to remove the row; a worker never removes
# it by itself.
# Provisioned alert rules do not expand $VAR, so every dollar here is a single one.
#
# Switch it off: set isPaused: true on the rule (the same idiom as
# cloudflare-spend.yaml), or move `for:` back to 0s with the 10-minute factor removed to
# return the fire-on-any-burst behaviour. Neither is a manual Grafana edit: provisioning
# rewrites the API copy when Grafana restarts.
apiVersion: 1

groups:
  - orgId: 1
    name: router-dead-row
    folder: fleet
    interval: 5m
    rules:
      - uid: router-dead-row
        title: Router row answers 402, 403 or 404
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: >-
                (sum by (model_id,requested_model) (increase(litellm_deployment_failure_responses_total{exception_status=~"402|403|404",model_id!=""}[1h]))
                or sum by (model_id,requested_model) (increase(litellm_deployment_failure_responses_total{exception_status=~"402|403|404",model_id=""}[1h])))
                * on(model_id,requested_model)
                (sum by (model_id,requested_model) (increase(litellm_deployment_failure_responses_total{exception_status=~"402|403|404"}[10m])) > bool 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              refId: C
              expression: A
              conditions: [{evaluator: {params: [5], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}, type: query}]
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Router row {{ with $labels.model_id }}{{ . }}{{ else }}{{ with $labels.requested_model }}{{ . }} (proxy-level){{ else }}unknown row{{ end }}{{ end }} answered 402, 403 or 404 {{ with index $values "A" }}{{ if .Value }}{{ .Value | printf "%.0f" }}{{ else }}no reading{{ end }}{{ else }}no reading{{ end }} times'
          description: 'A 402 is spent credit, a 403 is a model the provider ended, and a 404 is a model or endpoint that no longer exists. LiteLLM v1.98.0 cannot cool the first two, so every caller routed to this row fails. The retry-side fix is tracked in #9050 (retry a 403/404 onto a live seat) and #9417 (re-probe a resting row); this rule is the detector until they land, so a one-minute flap that healed needs no action. A 401 (a rejected provider key) has its own rule, router-dead-key. Check the row in config/litellm-proxy.yaml and the router journal (journalctl --user -u fleet-litellm-proxy | grep {{ with $labels.model_id }}{{ printf "%q" . }}{{ else }}{{ with $labels.requested_model }}{{ printf "%q" . }}{{ else }}MODEL_ID{{ end }}{{ end }}). Do NOT remove or bench it without Nish''s explicit yes (2026-10-02 rule): open or update a needs-nish-decision issue with the evidence.'
          value: '{{ with index $values "A" }}{{ if .Value }}{{ .Value | printf "%.0f" }}{{ else }}no reading{{ end }}{{ else }}no reading{{ end }} failures in the last hour'
          threshold: 'more than 5 in 1 hour, still failing 15 minutes later'
        labels: {severity: warning, signal: router-dead-row}
        isPaused: false
      - uid: router-dead-key
        title: Router row parked on a 401, provider key rejected
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: >-
                sum by (model_id) (increase(litellm_deployment_cooled_down_total{exception_status="401"}[6h]))
                * on(model_id)
                (sum by (model_id) (increase(litellm_deployment_cooled_down_total{exception_status="401"}[30m])) > bool 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              refId: C
              expression: A
              conditions: [{evaluator: {params: [2], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}, type: query}]
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: 'Router row {{ with $labels.model_id }}{{ . }}{{ else }}unknown row{{ end }} was parked on a 401, a provider key it rejects'
          description: 'A 401 is a key the provider rejects, not a model that ended, so the row parks again on every re-probe until the key is renewed and every caller routed to it fails. Check which key backs the row in config/litellm-proxy.yaml and the router journal (journalctl --user -u fleet-litellm-proxy | grep {{ with $labels.model_id }}{{ printf "%q" . }}{{ else }}MODEL_ID{{ end }}). No worker can renew a key, so this issue waits on Nish: renew the key, or approve taking its rows out of the router. Do NOT remove or bench the row without Nish''s explicit yes (2026-10-02 rule). The retry-side fix is tracked in #9050 and #9417.'
          value: '{{ with index $values "A" }}{{ if .Value }}{{ .Value | printf "%.0f" }}{{ else }}no reading{{ end }}{{ else }}no reading{{ end }} 401 parks in the last 6 hours'
          threshold: 'more than 2 parks in 6 hours, still parking in the last 30 minutes, held for 15 minutes'
        labels: {severity: warning, signal: router-dead-key}
        isPaused: false
