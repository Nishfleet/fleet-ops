# A priority-now issue that goes quiet (fleet-ops#10716).
#
# Why: #10681 carried priority-now and needs-orchestrator and nothing ran on it for
# an hour. Nothing alerted, because the queue-stuck group waits 3 hours and the
# re-queue waited 6 (both unchanged). priority-now is the label that says "this one
# is not allowed to wait", so it needs its own, shorter clock. The list job's QUIET
# step restarts a quiet priority-now issue inside 15 minutes; this rule is the
# backstop for the case where that sweep is not running at all.
#
# Signal: the stock GitHub data source (fleet-github), an Issues search, timeField 2
# ("updated", the Issues enum: 3 panics the plugin). The SQL counts the hits whose
# updated_at is at least 30 minutes old. Excluded, on purpose:
#   -label:agent-in-progress  a worker run owns the issue, and its label write is
#                             the freshest touch, so it cannot read as quiet.
#   -label:needs-nish-decision an issue waiting on Nish is quiet because nobody may
#                             move it yet.
#   -linked:pr                a PR that closes it owns it, on any branch prefix: the
#                             stuck-prs sweep gives every open PR over 15 minutes a
#                             verdict (arm, ask for review, or rework), and files a
#                             stuck-pr issue for one it cannot arm or send back. The
#                             queue-stuck group waits 3 hours on that issue. What this
#                             rule deliberately does not do is page for an issue whose
#                             only problem is a PR sitting DIRTY in review.
# A comment or label write resets updated_at, so a live hand-off stays fresh until
# 30 minutes after its last write. A hand-off that runs past 40 minutes without a
# comment can trip this once, and its own end comment clears it: the rule files an
# issue (severity warning, no page), so that costs a look, not a wake-up.
#
# Route: severity warning, so it does not page; with no signal route it reaches the
# catch-all in cloudflare-spend-contact.yaml and files a fleet-ops issue at once.
# Provenance alert rules do not expand $VAR, so every dollar here is a single one.
apiVersion: 1

groups:
  - orgId: 1
    name: priority-now-quiet
    folder: fleet
    interval: 5m
    rules:
      - uid: priority-now-quiet-30m
        title: priority-now issue quiet for 30m
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 2592000, to: 0}
            datasourceUid: fleet-github
            model:
              datasource: {type: grafana-github-datasource, uid: fleet-github}
              queryType: Issues
              owner: Nishfleet
              repository: fleet-ops
              options: {owner: Nishfleet, repository: fleet-ops, query: "org:Nishfleet is:issue is:open label:priority-now -label:agent-in-progress -label:needs-nish-decision -linked:pr", timeField: 2}
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: sql
              format: alerting
              refId: C
              expression: |-
                SELECT COUNT(*) AS quiet
                FROM (SELECT updated_at FROM A) AS found
                WHERE UNIX_TIMESTAMP() - UNIX_TIMESTAMP(updated_at) >= 1800
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: '{{ if $values }}A priority-now issue has had no comment, label or linked pull request for 30 minutes.{{ else }}The fleet cannot read GitHub for the rule "priority-now issue quiet for 30m", so it is blind until the read is fixed.{{ end }}'
          description: '{{ if $values }}priority-now means it must not wait, and nothing is running on it: a lane label may be missing, or the sweep that would re-fire it is down (fleet-ops#10716: #10681 waited an hour this way). Check that the agent-dispatch list job runs on its hourly schedule, then give the issue a lane (needs-orchestrator) so the sweep re-fires it in 15 minutes.{{ else }}Check the GitHub data source in Grafana: the nishfleet-worker App installation needs read on issues and pull requests.{{ end }} Open the list: https://github.com/search?type=issues&q=org%3ANishfleet+is%3Aissue+is%3Aopen+label%3Apriority-now+-label%3Aagent-in-progress+-label%3Aneeds-nish-decision+-linked%3Apr+sort%3Aupdated-asc'
        labels: {severity: warning, signal: priority-now-quiet}
        isPaused: false
