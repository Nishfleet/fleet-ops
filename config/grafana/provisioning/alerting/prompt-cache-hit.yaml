# Prompt-cache read-share alert (fleet-ops#9357).
#
# The signal is the share of a model's input tokens that came back from the
# provider's prompt cache:
#
#   rate(litellm_input_cached_tokens_metric_total[1h])
#     / rate(litellm_input_tokens_metric_total[1h])
#
# grouped by requested_model (the fleet alias: worker-capable, worker-cheap,
# senior, judge), so one broken route is named instead of the whole proxy.
#
# The denominator is correct as written because LiteLLM feeds
# litellm_input_tokens_metric from the provider usage's prompt_tokens, and
# prompt_tokens already CONTAINS the cached part on both shapes we see:
# OpenAI's prompt_tokens_details.cached_tokens is a subset of prompt_tokens,
# and Anthropic's prompt_tokens is cache_read + cache_creation + fresh.
# Measured on this box 2026-10-07: every share is <= 1 and the busy lanes sit
# at 0.66-0.83, so the cached part is inside the denominator.
#
# Two deliberate choices, both from the #4977 postmortem:
#
#  - rate over [1h], not increase over [24h]. A trailing-24h ratio cannot
#    recover for ~24h after a correct fix, so a daily alert page stays red for
#    a day after the fix lands. A 1h rate recovers inside an hour.
#  - a minimum input-token rate (the floor below), because a low-volume probe
#    lane is legitimately ~100% uncached and would fire the rule on its own.
#    Measured 2026-10-07: worker-capable runs ~25,000 input tok/s, while
#    worker-cheap runs ~20 and senior ~4 in the same window. A 1000 tok/s floor
#    sits three orders of magnitude above a probe lane and far below the busy
#    lane, so a real route losing its cache still fires and a single probe call
#    does not.
#
# for: 30m on top of the 1h window: a route has to stay broken across half an
# hour of steady traffic before this pages, so one bad upstream reply does not.
#
# The four vendors that report no cache field at all (cline, zai, ollama,
# openrouter) are NOT an incident here, and the query now says so: a row whose
# provider sends no cache number has no cached-token series, so the
# `and on (model_id)` filter below drops it from both sides of the ratio
# instead of counting its tokens as misses. See docs/prompt-cache-routes.md for
# the per-vendor proof.
#
# Known coverage limits, stated rather than hidden:
#  - A dip is a dip in the alias's MEASURABLE share. Rows the router cannot
#    measure are excluded, so a mix shift toward those vendors no longer moves
#    this rule. It did twice: 2026-10-07 (read 1 on worker-capable for 125
#    straight minutes, 2026-10-06T14:39Z-16:39Z, share 0.206 at 5358 input
#    tok/s, 43.8% of that traffic on a cline row with no cache field) and
#    2026-10-17 (fleet-ops#9881). What is left is a real drop on a caching
#    row, and the per-model drill-down in docs/prompt-cache-routes.md still
#    names it.
#  - A row that stops reporting its cache AND loses its cached-token series in
#    the same window is not covered: one scrape cannot tell it from a row that
#    never reported one. In-process that is not reachable, because a sparse
#    counter keeps being exported once instantiated, so a route that stops
#    reporting reads a flat series and fires. A proxy restart re-opens the
#    gap, because the counters start again at zero: until a lane's rows cache
#    once, it reads NoData, and noDataState: OK keeps that quiet. A rename of
#    the cached metric, or a model_id dropped from either metric's labels,
#    reads NoData the same way and is silent rather than loud. The old
#    `or (0 * input)` branch failed loud instead, but false, which is the
#    false page this change removes.
#  - The volume floor covers lanes with real traffic. On this fleet that is
#    worker-capable (~25,000 input tok/s); worker-cheap (~20) and senior (~4)
#    run far below the floor, so a regression confined to those two is not
#    covered by this rule. Lowering the floor to reach them would let a single
#    probe call page, which is the reason the floor exists.
#
# Contact point: the existing hermes-urgent Telegram contact point (paid-plan-idle.yaml).
# A route that stopped caching bills every request at full input price: severity critical,
# paged hourly through the policy tree.
apiVersion: 1

groups:
  - orgId: 1
    name: prompt-cache-hit
    folder: fleet
    interval: 1m
    rules:
      - uid: prompt-cache-hit-low
        title: Prompt-cache read share below 50%
        condition: C
        data:
          # A: the breach verdict per requested model, as 1 (breached) or 0
          # (healthy). `bool` is load-bearing, not cosmetic: C tests `> 0`, so a
          # lane has to read 1 to page. A TOTAL cache failure, the case this
          # rule exists for, has a share of exactly 0, and without `bool` A
          # would hand that 0 to C, `0 > 0` is false, and Grafana would hold the
          # rule Normal while every request paid full input price. With `bool`
          # the 0% share becomes a 1 and pages. paid-plan-idle.yaml uses this
          # same shape (`== bool 0` in the query, `gt 0` at the threshold), so
          # the verdict lives in the query and C only has to read it.
          #
          # Both sides of the ratio are restricted to the same row set: the
          # rows whose cache the router can measure. The denominator keeps the
          # input rows that also have a cached-token series, and the numerator
          # keeps the cached rows that also have an input series, so the two
          # sets are identical by construction. That matters when a row shows
          # up in one metric and not the other, which is what a metric whose
          # labels drift looks like: a cached-only row would otherwise inflate
          # the numerator past 1 and read as healthy while the lane was broken.
          # That counter is SPARSE:
          # LiteLLM instantiates a deployment's label set only once it has
          # reported a non-zero cached_tokens (integrations/prometheus.py,
          # _inc_sparse_usage_counters skips values <= 0). A row with no
          # cached-token series is therefore a row whose provider never sent a
          # cache number, while a row that HAD one keeps exporting it flat,
          # which is what keeps "a caching route went to 0" firing.
          #
          # Without the filter a measured numerator is divided by an unmeasured
          # denominator. On 2026-10-17 one orchestration burst on
          # ollama-ds41flashh-worker-capable (828 input tok/s, no cached series,
          # because LiteLLM's ollama_chat transformation never reads Ollama's
          # own prompt_eval_cached_count) held worker-capable's alias-wide share
          # at 0.083 and its volume over the floor for 40 minutes, paging this
          # rule on a route whose cache was working. With the filter that row is
          # dropped and the alias's measurable traffic (211 tok/s) falls under
          # the volume floor, the same way a probe lane does.
          #
          # `on (model_id)`, not a bare `and`: model_id is the deployment's
          # model_info.id, the row identity, while a bare `and` would also
          # require every other label (end_user, team, job) to match and would
          # silently stop filtering if a label were added to one metric and not
          # the other.
          #
          # There is no `or (0 * input)` branch any more. It existed to keep a
          # lane that stopped exporting its cached series from vanishing into
          # NoData, but such a lane is now excluded from the ratio on purpose:
          # one scrape cannot tell "never reported a cache" from "stopped
          # reporting one", and the first is the false positive this filter
          # removes. See the coverage limits at the top of this file.
          #
          # The `and on (requested_model)` volume gate is a plain label match,
          # so it drops a sub-floor lane from the result instead of leaving it
          # as a 0. That is why noDataState: OK is the right NoData policy: an
          # entire fleet below the floor returns nothing, which is silence by
          # design rather than a series that reads Normal by accident.
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: |-
                (
                  sum by (requested_model) (rate(litellm_input_cached_tokens_metric_total[1h]) and on (model_id) rate(litellm_input_tokens_metric_total[1h]))
                  /
                  sum by (requested_model) (rate(litellm_input_tokens_metric_total[1h]) and on (model_id) litellm_input_cached_tokens_metric_total)
                  < bool 0.5
                )
                and on (requested_model)
                sum by (requested_model) (rate(litellm_input_tokens_metric_total[1h]) and on (model_id) litellm_input_cached_tokens_metric_total) > 1000
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          # B: the input-token rate that carried the verdict, so the alert can
          # say how much traffic the number rests on.
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: sum by (requested_model) (rate(litellm_input_tokens_metric_total[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: B
          # C: fire when A reads 1. A is already "below 50% AND above the volume
          # floor" as a 0/1 series, so `gt 0` is the whole verdict: a breached
          # lane pages, a healthy lane reads 0 and stays Normal, and a lane
          # below the floor is not in A at all. promtool asserts those three
          # values against this exact expression (the promql_expr_test cases in
          # config/grafana/tests/prompt-cache-hit.test.yml), because the alert_rule_test cases above
          # only prove which series appear, not what Grafana's threshold then
          # reads.
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # 30m of steady traffic on top of the 1h window.
        for: 30m
        # No data is not an incident: a lane with no traffic has no cache share
        # to be low. Execution errors stay Error so a broken query is visible.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Prompt-cache read share below 50% on {{ $labels.requested_model }}, so fleet requests are paying full input price.'
          description: 'Less than half of this model''s input tokens came back from the provider prompt cache for an hour, on {{ $values.B.Value | printf "%.0f" }} input tokens/s. Every cache miss is billed at the full input price, so a route that stopped caching is a cost incident, not a latency one. Check whether the deployment still reports usage.prompt_tokens_details.cached_tokens (an OpenAI-compatible vendor that stops sending it looks exactly like this), and whether a prefix change broke the provider-side cache. Per-vendor verdicts: docs/prompt-cache-routes.md.'
        labels:
          severity: critical
          signal: prompt-cache-hit
        isPaused: false
