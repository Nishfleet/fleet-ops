# The agent queue (agent-dispatch.yml) being down, per enrolled repo.
#
# Why: the queue can die while every deploy and every site stays green. Two of
# the shapes seen live (fleet-ops#10204): the workflow file itself stops
# starting (conclusion startup_failure, GitHub's own file-level failure), and
# the scheduled sweep stops producing healthy runs so nothing new enters the
# queue. Neither fires a deploy alert, and nobody watched the queue itself.
#
# Signal: the stock GitHub data source (fleet-github in datasources/fleet.yaml,
# the nishfleet-worker App's organization installation, read-only) lists the
# runs of agent-dispatch.yml on main in the last 3 hours (Workflow_Runs). The
# SQL expression is the condition itself (format: alerting): Grafana 13 refuses
# a SQL expression as the input of another expression. success and neutral are
# healthy; failure, timed_out, action_required, stale and an unsuperseded
# cancel count as failures; skipped runs are ignored (a skip is the queue
# machinery correctly filtering an event, e.g. FLEET_DISPATCH_PAUSED), the same
# choice deploy-failed.yaml makes. The queue-down group reads 1 when the newest
# finished run is a startup_failure (fires at once) or the newest finished run
# has been failing for about 30 minutes (the group evaluates every 10 minutes,
# so detection lags by up to that). The queue-down-2h group reads 1 on the same
# startup_failure clause or a 2 hour failing streak; it pages because a queue
# down for 2 hours is the outage the queue exists to prevent (URGENT in
# tests/alert_routes_check.py). A window with no runs at all returns zero rows,
# so the queue-down rule fires on NoData (noDataState: Alerting): sweeps that
# stop producing runs at all are the case the 30 minute clause cannot see. A
# window whose runs are all queued, in_progress or skipped reads 0, not NoData:
# a runner backlog is a busy queue, not a blind read, and seven workers sent at
# saturated runners would be the wrong fix. An undated failing streak returns
# two rows, which Grafana refuses for alerting, so the rule shows Error (same
# tradeoff deploy-failed-24h documents). The SQL engine runs a fixed keyword
# allowlist and refuses EXISTS, so the row counts are read with scalar
# subqueries instead. The data source fetches the newest 100 runs (per_page), so
# a repo sustaining more than 100 finished runs in 3 hours keeps the 30 minute
# rule firing while the fetched span can keep the 2 hour rule short of its
# threshold; that is beyond any dispatch volume seen, and the warning still
# files its issue.
#
# One incident files one issue: the policy route for these signals refiles it
# only after a week, so a queue down for a day does not start a second worker
# on the same failure. The 2 hour rule pages through hermes-urgent (Telegram),
# the Grafana rule-side spelling of part B's severity=nish page: a Grafana rule
# label is critical or warning (tests/alert_routes_check.py), and critical is
# what reaches hermes-urgent. To switch a rule off: set isPaused: true here, or
# silence it in the Grafana UI for a short pause.
apiVersion: 1
groups:
  - orgId: 1
    name: queue-down
    folder: fleet
    interval: 10m
    rules:
      - uid: queue-down-fleet-ops
        title: Agent dispatch down Nishfleet/fleet-ops
        condition: C
        data:
          - &q-fleet-ops
            refId: A
            relativeTimeRange: {from: 10800, to: 0}
            datasourceUid: fleet-github
            model:
              datasource: {type: grafana-github-datasource, uid: fleet-github}
              queryType: Workflow_Runs
              owner: Nishfleet
              repository: fleet-ops
              options: {owner: Nishfleet, repository: fleet-ops, workflow: agent-dispatch.yml, branch: main}
              refId: A
          - &queue-down-latest
            refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: sql
              format: alerting
              refId: C
              expression: |-
                WITH counted AS (
                  SELECT id, created_at, status, conclusion,
                         CASE WHEN conclusion IN ('success', 'neutral') THEN 1 ELSE 0 END AS ok,
                         MAX(CASE WHEN status = 'completed' AND conclusion <> 'skipped' THEN id END) OVER () AS newest_done
                  FROM A
                ),
                runs AS (
                  SELECT * FROM counted
                  WHERE status = 'completed' AND conclusion <> 'skipped'
                    AND NOT (conclusion = 'cancelled' AND id < newest_done)
                ),
                streak AS (
                  SELECT COUNT(*) AS failures, UNIX_TIMESTAMP(MIN(created_at)) AS streak_start
                  FROM runs
                  WHERE id > COALESCE((SELECT MAX(id) FROM runs WHERE ok = 1), 0)
                )
                SELECT CASE WHEN (SELECT COUNT(*) FROM runs) = 0 THEN 0
                  WHEN
                  (SELECT conclusion FROM runs ORDER BY id DESC LIMIT 1) = 'startup_failure'
                  OR UNIX_TIMESTAMP() - streak_start >= 1800
                THEN 1 ELSE 0 END AS queue_down
                FROM streak
                JOIN (SELECT 1 AS k UNION ALL SELECT 2) AS copies
                  ON (copies.k = 1 AND (SELECT COUNT(*) FROM A) > 0) OR (failures > 0 AND streak_start IS NULL)
        noDataState: Alerting
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ if $values }}Agent dispatch down: the newest run of agent-dispatch.yml on main in Nishfleet/fleet-ops is a startup failure, or its newest finished run has been failing for about 30 minutes.{{ else }}The fleet cannot read GitHub runs for Nishfleet/fleet-ops, so its queue check is blind until the read is fixed.{{ end }}'
          description: '{{ if $values }}The agent queue for this repo is not taking work. Runs: https://github.com/Nishfleet/fleet-ops/actions/workflows/agent-dispatch.yml?query=branch%3Amain{{ else }}Check the GitHub data source in Grafana; the nishfleet-worker App installation must include this repo.{{ end }}'
        labels: {severity: warning, signal: queue-down, repo: Nishfleet/fleet-ops, workflow: agent-dispatch.yml}
        isPaused: false

