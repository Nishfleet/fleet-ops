        condition: C
        data:
          - *q-fleet-ops
          - &queue-down-2h
            refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: sql
              format: alerting
              refId: C
              expression: |-
                WITH counted AS (
                  SELECT id, created_at, status, conclusion,
                         CASE WHEN conclusion IN ('success', 'neutral') THEN 1 ELSE 0 END AS ok,
                         MAX(CASE WHEN status = 'completed' AND conclusion <> 'skipped' THEN id END) OVER () AS newest_done
                  FROM A
                ),
                runs AS (
                  SELECT * FROM counted
                  WHERE status = 'completed' AND conclusion <> 'skipped'
                    AND NOT (conclusion = 'cancelled' AND id < newest_done)
                ),
                streak AS (
                  SELECT COUNT(*) AS failures, UNIX_TIMESTAMP(MIN(created_at)) AS streak_start
                  FROM runs
                  WHERE id > COALESCE((SELECT MAX(id) FROM runs WHERE ok = 1), 0)
                )
                SELECT CASE WHEN (SELECT COUNT(*) FROM runs) = 0 THEN 0
                  WHEN
                  (SELECT conclusion FROM runs ORDER BY id DESC LIMIT 1) = 'startup_failure'
                  OR UNIX_TIMESTAMP() - streak_start >= 7200
                THEN 1 ELSE 0 END AS queue_down_for_2h
                FROM streak
                JOIN (SELECT 1 AS k UNION ALL SELECT 2) AS copies
                  ON (copies.k = 1 AND (SELECT COUNT(*) FROM A) > 0) OR (failures > 0 AND streak_start IS NULL)
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: '{{ if $values }}Agent dispatch down for 2 hours: the newest run of agent-dispatch.yml on main in Nishfleet/fleet-ops is a startup failure, or its newest finished run has been failing for 2 hours.{{ else }}The fleet cannot read GitHub runs for Nishfleet/fleet-ops, so its queue check is blind until the read is fixed.{{ end }}'
          description: '{{ if $values }}The agent queue for this repo has been down for about 2 hours and the repo is falling behind. Runs: https://github.com/Nishfleet/fleet-ops/actions/workflows/agent-dispatch.yml?query=branch%3Amain{{ else }}Check the GitHub data source in Grafana; the nishfleet-worker App installation must include this repo.{{ end }}'
