# Paid-plan idle detector (fleet-ops#9221).
# The paid-plan list lives in this file. A plan Nish cancels is removed here
# in the same PR that removes its router rows.
# Contact point: existing Hermes Telegram bot + TELEGRAM_HOME_CHANNEL.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: hermes-urgent
    receivers:
      - uid: hermes-urgent-tg
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: |
            $TELEGRAM_HOME_CHANNEL
          message: |
            {{ range .Alerts.Firing }}
            {{ .Annotations.summary }} {{ .Annotations.description }}
            {{ end }}

groups:
  - orgId: 1
    name: paid-plan-idle
    folder: fleet
    interval: 1m
    rules:
      - uid: ppi-cline
        title: Cline idle
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: |-
                (sum(increase(litellm_deployment_success_responses_total{api_base=~"https://api.cline.bot/api/v1.*"}[24h])) == bool 0)
                or
                absent_over_time(litellm_deployment_success_responses_total{api_base=~"https://api.cline.bot/api/v1.*"}[24h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: sum(increase(litellm_deployment_failure_responses_total{api_base=~"https://api.cline.bot/api/v1.*",exception_status="429"}[24h])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Cline served zero fleet calls for 24 hours (or vanished from the router).
          description: '{{ if eq $labels.quota_wall "true" }}Used to the max (quota wall), not idle.{{ else }}Idle or missing from the router.{{ end }}'
        labels:
          plan: cline
          quota_wall: '{{ with index $values "B" }}{{ if gt .Value 0.0 }}true{{ else }}false{{ end }}{{ else }}false{{ end }}'
        isPaused: false
        notification_settings:
          receiver: hermes-urgent
          group_by: [alertname, grafana_folder, plan]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 24h
