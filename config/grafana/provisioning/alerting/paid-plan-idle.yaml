      # The one judge-seat row in this family: its traffic is the occasional
      # one-shot judge call (0-3/day bursty, 626 calls in 7 days with 600+ from
      # the one-off eval campaign), not the hundreds/day of a worker row, so a
      # 24h-zero window pages on a normal quiet day (fleet-ops#9865, fired on
      # 2026-10-16 with the row healthy after 3 successful calls the day
      # before). The idle branch therefore reads 7 days; absence still pages
      # after 24h so a row dropped from the router is caught fast. Its A
      # expression carries the same two idle conditions as the 24h rows, with
      # the offset comparison widened to the same 7 days.
      - uid: ppi-alibaba
        title: Alibaba token-plan SG idle
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1209600, to: 0}
            datasourceUid: fleet-prometheus
