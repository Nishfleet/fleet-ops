# Paid-plan idle detector (fleet-ops#9221).
# The paid-plan list lives in this file. A plan Nish cancels is removed here
# in the same PR that removes its router rows.
# Contact point: existing Hermes Telegram bot + the Telegram home channel, reached through the policy tree by severity critical.
# Grafana file provisioning has no shared/foreach rule form (docs: groups[].rules
# is a list of full rules). One rule per plan so absent_over_time matches that
# api_base. disableResolveMessage is true: Hermes urgent is firing-only.
#
# The idle test in every rule below is two conditions multiplied, not
# `and`ed, because a success counter that has not increased is not the same
# thing as a plan that served nothing (fleet-ops#9879: CommandCode paged 50
# seconds after a real 200 OK, 90 seconds before its first sample after the
# router restart, with its pre-restart samples flat). `and` keeps the left
# element whenever the right side has a series with matching labels, whatever
# that series' value, so `(increase == bool 0) and (now == bool offset)` pages
# on a moved counter; `*` multiplies the two 0/1 conditions instead
# (https://prometheus.io/docs/prometheus/latest/querying/operators/).
#
#  - increase() misses a caller's first call after a restart. LiteLLM labels a
#    deployment's series only once it has reported, so that first success
#    creates the series at 1 and the counter never shows the 0 -> 1 step
#    increase() counts. A plan called once reads increase == 0 forever.
#  - the plan total is what moves instead. Comparing the total now against the
#    same total one idle window back catches both halves: a restart takes every
#    series away (0 against a non-zero total) and a new caller's series lifts
#    the total with no increase at all.
#
# Each side of that comparison carries `or vector(0)`, so an absent side reads
# 0 instead of an empty vector that would make `== bool` return nothing. The
# absent_over_time branch still leads the union, so a row dropped from the
# router pages after 24h whatever its counter did inside the idle window.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: hermes-urgent
    receivers:
      - uid: hermes-urgent-tg
        type: telegram
        disableResolveMessage: true
        settings:
          bottoken: $__file{/run/secrets/grafana-telegram-bot-token}
          chatid: $__file{/run/secrets/grafana-telegram-home-channel}
          message: |
            {{ range .Alerts.Firing }}
            {{ .Annotations.summary }} {{ .Annotations.description }}
            {{ end }}

# File provisioning never deletes a rule that merely leaves the file: Grafana keeps the
# provisioned copy and keeps evaluating it. ppi-pareto left with Pareto (fleet-ops#10040,
# #10065) but stayed live and fired "Pareto idle" from 2026-10-23 (fleet-ops#10198);
# ppi-ollama and ppi-cline did the same after fleet-ops#10068 (fleet-ops#10206).
deleteRules:
  - orgId: 1
    uid: ppi-pareto
  - orgId: 1
    uid: ppi-ollama
  - orgId: 1
    uid: ppi-cline

groups:
  - orgId: 1
    name: paid-plan-idle
    folder: fleet
    interval: 1m
    rules:
      - uid: ppi-commandcode
        title: CommandCode idle
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 172800, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: |-
                absent_over_time(litellm_deployment_success_responses_total{api_base=~"https://api.commandcode.ai/provider/v1.*"}[24h])
                or
                (
                  (sum(increase(litellm_deployment_success_responses_total{api_base=~"https://api.commandcode.ai/provider/v1.*"}[24h])) == bool 0)
                  *
                  ((sum(litellm_deployment_success_responses_total{api_base=~"https://api.commandcode.ai/provider/v1.*"}) or vector(0)) == bool (sum(litellm_deployment_success_responses_total{api_base=~"https://api.commandcode.ai/provider/v1.*"} offset 24h) or vector(0)))
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: sum(increase(litellm_deployment_failure_responses_total{api_base=~"https://api.commandcode.ai/provider/v1.*",exception_status="429"}[24h])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: CommandCode served zero fleet calls for 24 hours (or vanished from the router).
          description: '{{ with index $values "B" }}{{ if gt .Value 0.0 }}Used to the max (quota wall), not idle.{{ else }}Idle or missing from the router.{{ end }}{{ else }}Idle or missing from the router.{{ end }}'
        labels:
          severity: critical
          plan: commandcode
          quota_wall: '{{ with index $$values "B" }}{{ if gt .Value 0.0 }}true{{ else }}false{{ end }}{{ else }}false{{ end }}'
        isPaused: false
