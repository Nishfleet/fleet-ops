# Production deploy failing on main: the one Grafana symptom rule, one copy
# per product repo.
#
# Why: production deploy workflows failed for days or weeks and nobody was
# told. SiteDown only sees a homepage that stops answering, and an old build
# keeps answering.
#
# Signal: the stock GitHub data source (fleet-github in datasources/fleet.yaml,
# the nishfleet-worker App's organization installation, read-only) lists the runs
# of the repo's production deploy workflow on main in the last 7 days (3 for 0509)
# (Workflow_Runs). A Grafana SQL expression keeps the newest finished run and
# reads 1 when it did not succeed, 0 when it did. Skipped runs are ignored:
# drive, siterep-public and seo-fix-kit deploy on workflow_run and skip unless
# CI succeeded on a push. A cancelled run is ignored only when a newer
# completed, non-skipped run exists (superseded by concurrency); otherwise it
# counts as failed. success and neutral read 0; every other conclusion reads 1.
# The SQL expression is the condition itself (format: alerting): Grafana 13
# refuses a SQL expression as the input of another expression. No finished run
# in the window is NoData, which is OK.
#
# The contract this rule reads: a deploy workflow holds nothing but the deploy
# job (inish-site's ci.yml is the exception), because the signal is a run-level
# conclusion (fleet-ops#9889).
#
# Severity warning, signal=deploy-failed: it files one fleet-ops issue and never
# pages. The 24-hour paging group was deleted in the owner reset
# (fleet-ops#10935), because the done-line is zero pages to the owner.
#
# One rule per repo: the plugin reads its queries one after another, so one
# rule for all repos took 21 s of Grafana's 30 s evaluation timeout, and a repo
# the App cannot read would blind every other repo. 7 days, and 3 for 0509:
# 0509 deployed 4 to 94 times a day in the week to 2026-10-14, and 7 days of
# its runs was 3 API pages in about 12 s (measured 2026-10-15).
#
# Scope: the production deploy workflow of each product repo. rera-report-card
# has no rule yet. To cover a new product, copy one rule and change its uid,
# title, labels, query anchor and annotations; tests/test_deploy_failed_rule.py
# checks that they agree. Rule labels are plain strings: provisioning expands a
# $ in a label.
apiVersion: 1

# File provisioning never deletes a rule that merely leaves its file: Grafana
# keeps the provisioned copy and keeps evaluating it on a Grafana whose
# database outlives the container (fleet-ops#10198, #10206). So every rule
# removed from this directory is named here, including every fleet-internal
# rule the owner reset deleted (fleet-ops#10935).
