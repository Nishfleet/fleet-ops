# Production deploy failing on main.
#
# Why: production deploy workflows failed for days or weeks and nobody was told.
# fleet-console-worker's deploy has failed on every run since 2026-09-07, and
# inish-mail-filter's has never succeeded. SiteDown only sees a homepage that
# stops answering, and an old build keeps answering; the Hermes digest lists at
# most two broken workflows and pages nobody.
#
# Signal: the stock GitHub data source (fleet-github and fleet-github-personal
# in datasources/fleet.yaml, the nishfleet-worker App, read-only) lists the runs
# of the repo's production deploy workflow on main in the last 7 days
# (Workflow_Runs). A Grafana SQL expression keeps the newest finished run and
# reads 1 when it did not succeed, 0 when it did. Skipped runs are ignored
# (workflow_run deploys skip on a red CI). A cancelled run is ignored only when
# any newer run of the workflow exists (superseded by concurrency). A newest run
# that was cancelled counts as failed: the run fields cannot tell a timeout or a
# manual cancel from each other. success and neutral read 0; failure,
# timed_out, startup_failure, action_required, stale and an unsuperseded cancel
# read 1. The SQL expression is the condition itself (format: alerting): Grafana
# 13 refuses a SQL expression as the input of another expression, and a
# non-zero value fires. No finished run in 7 days is NoData, which is OK.
#
# One rule per repo: the plugin reads its queries one after another, so one
# rule for all repos took 21 s of Grafana's 30 s evaluation timeout, and a repo
# the App cannot read would blind every other repo. A rule that cannot evaluate
# for 30 minutes turns into a DatasourceError alert, so a broken query is loud
# too: it is a read problem, not a failed deploy, so it files a fleet-ops issue. The annotations name the repo as literal text (the
# rule's own labels are not in the template data, and an error has no
# $values), and `if $values` picks the failed-run text or the cannot-read text.
#
# 7 days, not longer: the plugin pages through every run in the window, and
# 0509 deploys about 40 times a day. Measured 2026-10-15 against the live API
# from the pinned image: 7 days of 0509 runs is 3 API pages in about 12 s, 30
# days is 1000 runs in about 43 s. A workflow that failed and has not run since
# keeps paging daily for 7 days.
#
# for: 30m at a 10m interval: a failed run that a rerun or the next push fixes
# within half an hour does not page.
#
# Route: the policy tree in cloudflare-spend-contact.yaml. signal=deploy-failed
# with a real result goes to hermes-urgent (Telegram): a failed production
# deploy means the live site is not running main, an outage of the release
# path. Re-sent once a day while it lasts. DatasourceError and DatasourceNoData
# skip that route and land on the root, fleet-alert-dispatch (a fleet-ops
# issue). tests/alert_routes_check.py lists these rules as urgent.
#
# Scope: the production deploy workflow of each live product repo. Left out:
# fleet-ops deploy-box (the box, not a product). inish-site deploys from the
# deploy job of its ci.yml, which needs its test job, so its rule says CI or
# deploy. To cover a new product, copy one rule and change its uid, title,
# labels, query and annotations; tests/test_deploy_failed_rule.py checks that
# they agree.
# Rule labels are plain strings: provisioning expands a $ in a label.
apiVersion: 1

groups:
  - orgId: 1
    name: deploy-failed
    folder: fleet
    interval: 10m
    rules:
      - uid: deploy-failed-0509
        title: Production deploy failed Nishfleet/0509
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: fleet-github
            model:
              datasource: {type: grafana-github-datasource, uid: fleet-github}
              queryType: Workflow_Runs
              owner: Nishfleet
              repository: "0509"
              options: {owner: Nishfleet, repository: "0509", workflow: deploy-production.yml, branch: main}
              refId: A
          - &deploy-failed-latest
            refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: sql
              format: alerting
              refId: C
              expression: |-
                SELECT CASE WHEN conclusion IN ('success', 'neutral') THEN 0 ELSE 1 END AS failed
                FROM (SELECT status, conclusion, created_at, id, MAX(id) OVER () AS newest FROM A) AS runs
                WHERE status = 'completed' AND conclusion <> 'skipped'
                  AND NOT (conclusion = 'cancelled' AND id < newest)
                ORDER BY created_at DESC, id DESC
                LIMIT 1
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: '{{ if $values }}Production deploy failing: the latest run of deploy-production.yml on main in Nishfleet/0509 did not succeed.{{ else }}The fleet cannot read GitHub runs for Nishfleet/0509, so its deploy check is blind until the read is fixed.{{ end }}'
          description: '{{ if $values }}Production is not running main.{{ else }}Check the GitHub data source in Grafana; the nishfleet-worker App installation must include this repo.{{ end }} Runs: https://github.com/Nishfleet/0509/actions/workflows/deploy-production.yml?query=branch%3Amain'
        labels: {signal: deploy-failed, repo: Nishfleet/0509, workflow: deploy-production.yml}
        isPaused: false

