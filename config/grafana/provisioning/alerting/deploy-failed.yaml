# Production deploy failing on main.
#
# Why: production deploy workflows failed for days or weeks and nobody was told.
# fleet-console-worker's deploy has failed on every run since 2026-09-07, and
# inish-mail-filter's has never succeeded. SiteDown only sees a homepage that
# stops answering, and an old build keeps answering; the Hermes digest lists at
# most two broken workflows and pages nobody.
#
# Signal: the stock GitHub data source (fleet-github and fleet-github-personal
# in datasources/fleet.yaml, the nishfleet-worker App, read-only) lists the runs
# of the repo's production deploy workflow on main in the last 7 days
# (Workflow_Runs). A Grafana SQL expression keeps the newest finished run and
# reads 1 when it did not succeed, 0 when it did. Skipped runs are ignored
# (workflow_run deploys skip on a red CI). A cancelled run is ignored only when
# a newer completed, non-skipped run exists (superseded by concurrency);
# otherwise it counts as failed, since the run fields cannot tell a timeout or a
# manual cancel apart. success and neutral read 0; failure, timed_out,
# startup_failure, action_required, stale and an unsuperseded cancel read 1. The
# SQL expression is the condition itself (format: alerting): Grafana 13 refuses
# a SQL expression as the input of another expression, and a non-zero value
# fires. No finished run in 7 days is NoData, which is OK.
#
# Two steps, because a failed deploy is work the fleet can fix first:
#  - group deploy-failed (one rule per repo, signal=deploy-failed, for: 30m)
#    matches no route, so it lands on the policy root, fleet-alert-dispatch,
#    which files a fleet-ops issue. Its DatasourceError (a read problem) files
#    an issue the same way.
#  - group deploy-failed-24h (signal=deploy-failed-24h, for: 24h) is the same
#    query and SQL held red for a day; the route in cloudflare-spend-contact.yaml
#    sends it to hermes-urgent (Telegram), re-sent once a day. A pending period
#    is used rather than a 24h group_wait because the token refresh reloads the
#    notification config every 20 minutes, which can restart group timers;
#    rule state is stored. execErrState KeepLast: its read errors are already filed
#    by the first group. inish-site has no 24h rule: its ci.yml runs tests
#    before the deploy job, and a run's result cannot say which failed, so it
#    files issues only. tests/alert_routes_check.py lists the 24h rules as
#    urgent.
#
# One rule per repo: the plugin reads its queries one after another, so one
# rule for all repos took 21 s of Grafana's 30 s evaluation timeout, and a repo
# the App cannot read would blind every other repo. The annotations name the
# repo as literal text (the rule's own labels are not in the template data, and
# an error has no $values), and `if $values` picks the failed-run text or the
# cannot-read text.
#
# 7 days, not longer: the plugin pages through every run in the window, and
# 0509 deploys about 40 times a day. Measured 2026-10-15 against the live API
# from the pinned image: 7 days of 0509 runs is 3 API pages in about 12 s, 30
# days is 1000 runs in about 43 s.
#
# Scope: the production deploy workflow of each live product repo. Left out:
# fleet-ops deploy-box (the box, not a product). To cover a new product, copy
# one rule in each group and change its uid, title, labels, query anchor and
# annotations; tests/test_deploy_failed_rule.py checks that they agree.
# Rule labels are plain strings: provisioning expands a $ in a label.
apiVersion: 1

groups:
  - orgId: 1
    name: deploy-failed
    folder: fleet
    interval: 10m
    rules:
      - uid: deploy-failed-0509
        title: Production deploy failed Nishfleet/0509
        condition: C
        data:
          - &q-0509
            refId: A
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: fleet-github
            model:
              datasource: {type: grafana-github-datasource, uid: fleet-github}
              queryType: Workflow_Runs
              owner: Nishfleet
              repository: "0509"
              options: {owner: Nishfleet, repository: "0509", workflow: deploy-production.yml, branch: main}
              refId: A
          - &deploy-failed-latest
            refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: sql
              format: alerting
              refId: C
              expression: |-
                SELECT CASE WHEN conclusion IN ('success', 'neutral') THEN 0 ELSE 1 END AS failed
                FROM (
                  SELECT status, conclusion, created_at, id,
                         MAX(CASE WHEN status = 'completed' AND conclusion <> 'skipped' THEN id END) OVER () AS newest_done
                  FROM A
                ) AS runs
                WHERE status = 'completed' AND conclusion <> 'skipped'
                  AND NOT (conclusion = 'cancelled' AND id < newest_done)
                ORDER BY created_at DESC, id DESC
                LIMIT 1
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: '{{ if $values }}Production deploy failing: the latest run of deploy-production.yml on main in Nishfleet/0509 did not succeed.{{ else }}The fleet cannot read GitHub runs for Nishfleet/0509, so its deploy check is blind until the read is fixed.{{ end }}'
          description: '{{ if $values }}Production is not running main. A fleet issue; it pages Nish if it is still red in 24 hours.{{ else }}Check the GitHub data source in Grafana; the nishfleet-worker App installation must include this repo.{{ end }} Runs: https://github.com/Nishfleet/0509/actions/workflows/deploy-production.yml?query=branch%3Amain'
        labels: {signal: deploy-failed, repo: Nishfleet/0509, workflow: deploy-production.yml}
        isPaused: false

      - uid: deploy-failed-aiconverter-app
