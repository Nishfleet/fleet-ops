# Production deploy failing on main.
#
# Why: production deploy workflows failed for days or weeks and nobody was
# told. SiteDown only sees a homepage that stops answering, and an old build
# keeps answering; the Hermes digest lists at most two broken workflows and
# pages nobody.
#
# Signal: the stock GitHub data source (fleet-github in datasources/fleet.yaml,
# the nishfleet-worker App's organization installation, read-only) lists the runs
# of the repo's production deploy workflow on main in the last 7 days (3 for 0509)
# (Workflow_Runs). A Grafana SQL expression keeps the newest finished run and
# reads 1 when it did not succeed, 0 when it did. Skipped runs are ignored:
# drive, mailbox, siterep-public and seo-fix-kit deploy on workflow_run and
# skip unless CI succeeded on a push, so a skip can also be a pull-request CI
# run, not a red main. A red CI on main is the CI-red issue rule's to report,
# not this rule's (known gap). A cancelled run is ignored only when a newer
# completed, non-skipped run exists (superseded by concurrency);
# otherwise it counts as failed, since the run fields cannot tell a timeout or a
# manual cancel apart. success and neutral read 0; failure, timed_out,
# startup_failure, action_required, stale and an unsuperseded cancel read 1. The
# SQL expression is the condition itself (format: alerting): Grafana 13 refuses
# a SQL expression as the input of another expression, and a non-zero value
# fires. No finished run in the window is NoData, which is OK.
#
# The contract this rule reads: a deploy workflow holds nothing but the deploy
# job. The signal is a run-level conclusion, so a post-deploy job inside a deploy
# workflow makes this rule lie. 0509 carried the production Lighthouse audit in
# deploy-production.yml, and its red on a successful deploy read here as
# "Production is not running main" for days (fleet-ops#9889; the audit measured
# the Access login page, fixed in Nishfleet/0509#7698). A check that cannot
# report on a pull request belongs on its own schedule or its own workflow, never
# inside the deploy run: the deploy run's conclusion is what this rule reads.
#
# Two groups (the policy tree in cloudflare-spend-contact.yaml routes on severity):
#  - group deploy-failed (one rule per repo, signal=deploy-failed, for: 30m),
#    severity warning: it files a fleet-ops issue and does not page. Its
#    DatasourceError (a read problem) files an issue the same way.
#  - group deploy-failed-24h (signal=deploy-failed-24h), severity critical: it
#    files an issue and pages hermes-urgent hourly. It reads the same query,
#    and its SQL decides "red for a day" by itself, with no Grafana pending
#    state: over the same counted runs, the failures after the newest success
#    exist and the oldest of them is at least 24 hours old (so no success in
#    the last day either). for: 10m only absorbs a passing read error. Its
#    DatasourceError is muted (mute timing deploy-failed-24h-errors): the
#    deploy-failed rule on the same query files the repo's one issue for a read
#    error. A red streak whose start has no date makes the SQL return two rows,
#    which Grafana refuses for alerting, so the rule shows Error, never a silent
#    Normal; the deploy-failed rule still reads that undated failure as 1, since
#    it orders by run id. inish-site has no 24h rule: its ci.yml runs tests
#    before the deploy job, and a run's result cannot say which failed.
#
# The nish3451 repos moved to Nishfleet on 2026-10-16. seo-fix-kit,
# fleet-console-worker and inish-mail-filter are covered from fleet-github,
# whose installation datasources/fleet.yaml records as all Nishfleet repos; its
# read of these three was not tested live before they were added, so a repo it
# cannot read files a "cannot read GitHub runs" issue. The last two are in
# the deploy-failed group only, with no 24h rule: their deploys have never
# succeeded (no Cloudflare key until 2026-10-16) and their fix PRs (#10, #8)
# are not merged, so a 24h page would only repeat a known red. Add their 24h
# rules once a deploy of theirs succeeds.
#
# One rule per repo: the plugin reads its queries one after another, so one
# rule for all repos took 21 s of Grafana's 30 s evaluation timeout, and a repo
# the App cannot read would blind every other repo. The annotations name the
# repo as literal text (the rule's own labels are not in the template data, and
# an error has no $values), and `if $values` picks the failed-run text or the
# cannot-read text. Grafana shares no query between rules, so a repo with a
# 24h rule is read twice per interval; one rule for both steps would need a
# label from the data to route on, which alert_routes_check.py cannot see.
#
# 7 days, and 3 for 0509: the plugin pages through every run in the window
# (100 a page, branch=main; its query has no event filter), and 0509 deployed
# 4 to 94 times a day in the week to 2026-10-14. Measured 2026-10-15 from the
# pinned image: 7 days of 0509 runs was 3 API pages in about 12 s, 30 days 1000
# runs in about 43 s, against a 30 s evaluation timeout; 3 days was 199 runs,
# 2 pages. A streak older than the window still reads as over 24 hours.
#
# Scope: the production deploy workflow of each live repo in the Nishfleet
# organization that deploys a site or worker to Cloudflare. Left out: fleet-ops
# deploy-box (it deploys the box). To cover a new product, copy one rule in each group and change its
# uid, title, labels, query anchor and annotations;
# tests/test_deploy_failed_rule.py checks that they agree.
# tests/test_deploy_failed_engine.py runs both SQLs on the pinned image, through
# the real plugin against a stub GitHub, in a non-UTC zone.
# Rule labels are plain strings: provisioning expands a $ in a label.
apiVersion: 1

groups:
  - orgId: 1
    name: deploy-failed
    folder: fleet
    interval: 10m
    rules:
      - uid: deploy-failed-0509
        title: Production deploy failed Nishfleet/0509
        condition: C
        data:
          - &q-0509
            refId: A
            relativeTimeRange: {from: 259200, to: 0}
            datasourceUid: fleet-github
            model:
              datasource: {type: grafana-github-datasource, uid: fleet-github}
              queryType: Workflow_Runs
              owner: Nishfleet
              repository: "0509"
              options: {owner: Nishfleet, repository: "0509", workflow: deploy-production.yml, branch: main}
              refId: A
          - &deploy-failed-latest
            refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: sql
              format: alerting
              refId: C
              expression: |-
                SELECT CASE WHEN conclusion IN ('success', 'neutral') THEN 0 ELSE 1 END AS failed
                FROM (
                  SELECT status, conclusion, created_at, id,
                         MAX(CASE WHEN status = 'completed' AND conclusion <> 'skipped' THEN id END) OVER () AS newest_done
                  FROM A
                ) AS runs
                WHERE status = 'completed' AND conclusion <> 'skipped'
                  AND NOT (conclusion = 'cancelled' AND id < newest_done)
                ORDER BY id DESC
                LIMIT 1
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: '{{ if $values }}Production deploy failing: the latest run of deploy-production.yml on main in Nishfleet/0509 did not succeed.{{ else }}The fleet cannot read GitHub runs for Nishfleet/0509, so its deploy check is blind until the read is fixed.{{ end }}'
          description: '{{ if $values }}Production is not running main. A fleet issue; it pages Nish if it is still red in 24 hours.{{ else }}Check the GitHub data source in Grafana; the nishfleet-worker App installation must include this repo.{{ end }} Runs: https://github.com/Nishfleet/0509/actions/workflows/deploy-production.yml?query=branch%3Amain'
        labels: {severity: warning, signal: deploy-failed, repo: Nishfleet/0509, workflow: deploy-production.yml}
        isPaused: false

      - uid: deploy-failed-aiconverter-app
        title: Production deploy failed Nishfleet/aiconverter-app
