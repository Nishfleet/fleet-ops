# Cloudflare cost alarm (fleet-ops#9355). Stock Grafana only, no scripts.
#
# Why: two leaks hit invoice IN-82380534 (D1 restore drills wrote ~145M rows,
# 0509 sign-in e2e sent ~15,300 emails) and R2 grew 3 GB to 24 GB. The budget
# emails sat unread. Cloudflare has no push event for usage, so Grafana asks
# the Cloudflare GraphQL analytics API (Infinity data source fleet-cloudflare,
# datasources/cloudflare.yaml) every hour. A firing rule opens a fleet-ops
# issue labelled agent-ready + priority-now through the contact point and
# policy in cloudflare-spend-contact.yaml; severity critical also pages hermes-urgent hourly.
#
# Thresholds (Nish, 2026-10-07):
#   AI neurons, D1 rows read, email sends: the last hour is more
#   than 3x the pro-rated hourly allowance, or more than 3x the 7-day hourly
#   median of the hours that had any usage. Allowances per hour:
#     Workers AI 10,000 neurons/day free -> 416.67
#     D1 reads 25B/month, writes 50M/month (Workers Paid) -> 34,246,575 and 68,493
#     email 3,000/month (Workers Paid) -> 4.11
#   D1 rows written is not on this 3x scheme any more: it has its own group at
#   the end of this file, a flat line of 50,000 rows in the last 60 minutes,
#   evaluated every 10 minutes (Nish, 2026-10-15; see the comment there).
#   Workers AI only (fleet-ops#9576): the 3x free-allowance line is
#   meaningless for this product, because 0509's judge is designed paid
#   usage (@cf/cloudflare/clef, 2026-10-03): the steady state is ~1.4k
#   neurons/h and the highest normal hour since 2026-10-05 was 5,138, both
#   above the 1250/h line, so the rule fired on 15 of the last 6 days'
#   hours for no leak. Both legs now also need the last hour over an
#   absolute 10,000 neurons/h (about 2x the highest normal hour). Replay
#   over 2026-10-01T00Z..2026-10-10T21Z on the Cloudflare hourly series:
#   the old rule fires 48 hours, the new one 12, all on 2026-10-02 and
#   2026-10-04, none after 2026-10-05. The 2026-10-02 leak is still caught
#   in its first spike hour (09:00Z, 30,811 neurons; the day peaked at
#   309,668).
#   Accepted blind spot: a real Workers AI leak that stays under 10,000
#   neurons/h stays silent; bounded at ~240k neurons/day, about $2.64 a day
#   at $0.011 per 1,000 neurons, and a 0509 runaway at the AI Gateway rate
#   cap (~60 calls/min) burns ~640k/h, so it fires in its first hour.
#   Email only (fleet-ops#9591): the 3x allowance line (12.3/h) sits below the
#   weekly production e2e suite, which sends 54 to 75 real sign-in emails in
#   one hour by design (0509 e2e-scheduled, Sunday cron; run 38146870606 sent
#   54 at 2026-10-11T14:21Z, about 75 a week against a ~700 a week allowance).
#   Both legs now also need the last hour over an absolute 100 emails/h. The
#   2026-09-28 sign-in e2e (5,976 a day, about 250/h) still fires in its first
#   hour. Accepted blind spot: a leak under 100/h stays silent; bounded at
#   2,400/day.
#   R2: total Standard storage over 30 GB, a bucket up 2 GB within 24h
#   (last value minus the 24h low, so a prune followed by regrowth still counts),
#   or the account total up more than 4 GB in 30 days (warning, so it files an
#   issue and never pages).
#
# Floor on the median leg (fleet-ops, incident 2026-10-06): the rule is
#   ($D > 3 x allowance) || ($D > 3 x median && $D > 1 x allowance)
# The 1x allowance floor is deliberate. After a quiet week the 7-day median
# approaches zero, so an unfloored "$D > 3 * $C" fires on any bump: cf-d1-rows-written
# fired on 2,492 rows/h (about 0.1% of the 50M/month allowance) because the median
# was 22, an effective line of 66 rows/h; no leak was found. Do not delete the floor
# as redundant. The floor cannot sit at the 3x line, because then the median leg
# could never fire first and the rule would be the absolute leg alone; 1x keeps the
# median leg useful for a jump that stays under 3x but is still a burn.
# H = the median line after the floor, G = the line the rule really uses (the lower
# of the 3x allowance and H); annotations render G, so the text always matches.
#
# Query shape per rule: A = last-hour total (one number), B = 7-day hourly
# series, T = the top resource in the last hour (its string column becomes the
# label `resource` in the alert and in the issue body). The ${__timeFrom} and
# ${__timeTo} macros are expanded by the Infinity backend from each query's
# relativeTimeRange, so a replay is the same rule with the two dates typed in.
# A rule with no usage in the hour has no rows, which is Normal (noDataState OK).
# Provisioned alert rules do not expand $VAR, so every dollar here is a single
# one and belongs to Grafana (macros, SSE refIds).
apiVersion: 1

groups:
  - orgId: 1
    name: cloudflare-spend
    folder: fleet
    interval: 1h
    rules:
      - uid: cf-ai-neurons
        title: Cloudflare Workers AI neurons
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model: &cf-last-hour-total
              refId: A
              datasource: {type: yesoreyeram-infinity-datasource, uid: fleet-cloudflare}
              type: graphql
              source: url
              url: https://api.cloudflare.com/client/v4/graphql
              parser: backend
              format: table
              root_selector: data.viewer.accounts[0].aiInferenceAdaptiveGroups
              columns: [{selector: sum.totalNeurons, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    aiInferenceAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { sum { totalNeurons } }
                  } } }
          - refId: B
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: B
              columns:
                - {selector: dimensions.datetimeHour, text: time, type: timestamp}
                - {selector: sum.totalNeurons, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    aiInferenceAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { datetimeHour } sum { totalNeurons } }
                  } } }
          - refId: T
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: T
              columns:
                - {selector: dimensions.modelId, text: resource, type: string}
                - {selector: sum.totalNeurons, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    aiInferenceAdaptiveGroups(limit: 1, orderBy: [sum_totalNeurons_DESC], filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { modelId } sum { totalNeurons } }
                  } } }
          - refId: C
            datasourceUid: __expr__
            model: &cf-median
              datasource: {type: __expr__, uid: __expr__}
              type: reduce
              refId: C
              expression: B
              reducer: median
              settings: {mode: dropNN}
          - refId: D
            datasourceUid: __expr__
            model: &cf-last
              datasource: {type: __expr__, uid: __expr__}
              type: reduce
              refId: D
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: E
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: math
              refId: E
              expression: ($D > 10000) || ($C > 0 && $D > 3 * $C && $D > 10000)
          - {refId: H, datasourceUid: __expr__, model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: H, expression: '3 * $C * (3 * $C >= 10000) + 10000 * (3 * $C < 10000)'}}
          - {refId: G, datasourceUid: __expr__, model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: G, expression: '10000 * (10000 <= $H) + $H * (10000 > $H)'}}
          - refId: R
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: math
              refId: R
              expression: $T * 0 + $E
          - refId: F
            datasourceUid: __expr__
            model: &cf-threshold
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              refId: F
              expression: R
              conditions: [{evaluator: {params: [0.5], type: gt}, operator: {type: and}, query: {params: [F]}, reducer: {params: [], type: last}, type: query}]
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Workers AI used {{ $values.D.Value | printf "%.0f" }} neurons in the last hour'
          description: 'It fires above {{ $values.G.Value | humanize }} neurons/h: the lower of the 10,000 neurons/h floor and the larger of 3 x the 7-day hourly median ({{ $values.C.Value | humanize }}) and the same floor. On 2026-10-02 this product burned 1,113,645 neurons in one day; the floor is the 2026-10-03 fix for the rule firing on 0509 judge traffic, which is designed paid usage.'
          value: '{{ $values.D.Value | printf "%.0f" }} neurons in the last hour'
          threshold: 'over {{ $values.G.Value | humanize }} neurons/h (the 10,000 neurons/h floor, or 3 x the 7-day hourly median above the same floor)'
          top: '{{ $labels.resource }}'
        labels: {severity: critical, signal: cloudflare-spend, product: workers-ai}
        isPaused: false
      - uid: cf-d1-rows-read
        title: Cloudflare D1 rows read
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: A
              root_selector: data.viewer.accounts[0].d1AnalyticsAdaptiveGroups
              columns: [{selector: sum.rowsRead, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { sum { rowsRead } }
                  } } }
          - refId: B
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: B
              root_selector: data.viewer.accounts[0].d1AnalyticsAdaptiveGroups
              columns:
                - {selector: dimensions.datetimeHour, text: time, type: timestamp}
                - {selector: sum.rowsRead, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { datetimeHour } sum { rowsRead } }
                  } } }
          - refId: T
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: T
              root_selector: data.viewer.accounts[0].d1AnalyticsAdaptiveGroups
              columns:
                - {selector: dimensions.databaseId, text: resource, type: string}
                - {selector: sum.rowsRead, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 1, orderBy: [sum_rowsRead_DESC], filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { databaseId } sum { rowsRead } }
                  } } }
          - {refId: C, datasourceUid: __expr__, model: {<<: *cf-median}}
          - {refId: D, datasourceUid: __expr__, model: {<<: *cf-last}}
          - refId: E
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: math
              refId: E
              expression: ($D > 3 * 34246575) || ($C > 0 && $D > 3 * $C && $D > 34246575)
          - {refId: H, datasourceUid: __expr__, model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: H, expression: '3 * $C * (3 * $C >= 34246575) + 34246575 * (3 * $C < 34246575)'}}
          - {refId: G, datasourceUid: __expr__, model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: G, expression: '3 * 34246575 * (3 * 34246575 <= $H) + $H * (3 * 34246575 > $H)'}}
          - refId: R
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: R, expression: $T * 0 + $E}
          - {refId: F, datasourceUid: __expr__, model: {<<: *cf-threshold}}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'D1 read {{ $values.D.Value | printf "%.0f" }} rows in the last hour'
          description: 'It fires above {{ $values.G.Value | humanize }} rows/h: the lower of 3 x the allowance (102,739,725 rows/h, 3 x the pro-rated 25B/month allowance) and the larger of 3 x the 7-day hourly median ({{ $values.C.Value | humanize }}) and the 1x allowance floor (34246575).'
          value: '{{ $values.D.Value | printf "%.0f" }} rows read in the last hour'
          threshold: 'over {{ $values.G.Value | humanize }} rows/h (3 x allowance, or 3 x the 7-day hourly median above the 1x allowance floor of 34246575)'
          top: 'D1 database {{ $labels.resource }}'
        labels: {severity: critical, signal: cloudflare-spend, product: d1-rows-read}
        isPaused: false
      - uid: cf-email-sends
        title: Cloudflare email sends
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: A
              root_selector: data.viewer.accounts[0].emailSendingAdaptiveGroups
              columns: [{selector: count, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    emailSendingAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { count }
                  } } }
          - refId: B
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: B
              root_selector: data.viewer.accounts[0].emailSendingAdaptiveGroups
              columns:
                - {selector: dimensions.datetimeHour, text: time, type: timestamp}
                - {selector: count, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    emailSendingAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { datetimeHour } count }
                  } } }
          - refId: T
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: T
              root_selector: data.viewer.accounts[0].emailSendingAdaptiveGroups
              columns:
                - {selector: dimensions.sendingDomain, text: resource, type: string}
                - {selector: count, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    emailSendingAdaptiveGroups(limit: 1, orderBy: [count_DESC], filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { sendingDomain } count }
                  } } }
          - {refId: C, datasourceUid: __expr__, model: {<<: *cf-median}}
          - {refId: D, datasourceUid: __expr__, model: {<<: *cf-last}}
          - refId: E
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: math
              refId: E
              expression: ($D > 100) || ($C > 0 && $D > 3 * $C && $D > 100)
          - {refId: H, datasourceUid: __expr__, model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: H, expression: '3 * $C * (3 * $C >= 100) + 100 * (3 * $C < 100)'}}
          - {refId: G, datasourceUid: __expr__, model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: G, expression: '100 * (100 <= $H) + $H * (100 > $H)'}}
          - refId: R
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: R, expression: $T * 0 + $E}
          - {refId: F, datasourceUid: __expr__, model: {<<: *cf-threshold}}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'Cloudflare sent {{ $values.D.Value | printf "%.0f" }} emails in the last hour'
          description: 'It fires above {{ $values.G.Value | humanize }} emails/h: the lower of the 100 emails/h floor and the larger of 3 x the 7-day hourly median ({{ $values.C.Value | humanize }}) and the same floor. The floor sits above the weekly production e2e suite (about 54 to 75 sign-in emails in one hour, 0509 e2e-scheduled, Sundays 07:40 UTC cron, fleet-ops#9591). The 2026-09-28 sign-in e2e sent about 5,976 emails in a day.'
          value: '{{ $values.D.Value | printf "%.0f" }} emails in the last hour'
          threshold: 'over {{ $values.G.Value | humanize }} emails/h (100/h floor, or 3 x the 7-day hourly median above it)'
          top: 'sending domain {{ $labels.resource }}'
        labels: {severity: critical, signal: cloudflare-spend, product: email-sends}
        isPaused: false
      - uid: cf-r2-standard-total
        title: Cloudflare R2 Standard storage total
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: A
              root_selector: '$map([data.viewer.accounts[0]], function($a){{"total": $sum($a.r2StorageAdaptiveGroups.max.payloadSize)}})'
              columns: [{selector: total, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 10000, filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - refId: T
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: T
              root_selector: data.viewer.accounts[0].r2StorageAdaptiveGroups
              columns:
                - {selector: dimensions.bucketName, text: resource, type: string}
                - {selector: max.payloadSize, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 1, orderBy: [max_payloadSize_DESC], filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - {refId: D, datasourceUid: __expr__, model: {<<: *cf-last}}
          - refId: E
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: E, expression: $D > 30000000000}
          - refId: R
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: R, expression: $T * 0 + $E}
          - {refId: F, datasourceUid: __expr__, model: {<<: *cf-threshold}}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'R2 Standard storage is {{ $values.D.Value | humanize }}B'
          description: 'Total R2 Standard storage is over 30 GB (27.9 GiB). Measured 2026-10-21: the restic live repository and its 30-day-locked copy held about 10 GB each, because the retention policy grouped snapshots by path set and old groups never aged out. With restic forget --group-by host,tags the live repository settles near 3 GiB; the locked copy drains to about the same by 2026-11-21, when the last object under the 30-day lock expires and rclone sync --min-age 31d reclaims it. The 0509-snapshots pair ramps to about 12.5 GiB over a year under its 365-day lifecycle rules (0509#5950). The line sits above the total today (about 23 GB) plus the repack the first prune writes into the locked copy, so it does not page for the drain. Tighten it again once the locked copy has drained. cf-r2-bucket-growth stays the fast per-bucket detector at 2 GB in 24 hours, so a slow leak spread across buckets pages here.'
          value: '{{ $values.D.Value | humanize }}B Standard in total'
          threshold: 'over 30 GB (30000000000 bytes) Standard in total'
          top: 'bucket {{ $labels.resource }}'
        labels: {severity: critical, signal: cloudflare-spend, product: r2-storage}
        isPaused: false
      - uid: cf-r2-bucket-growth
        title: Cloudflare R2 bucket growth
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: A
              root_selector: data.viewer.accounts[0].r2StorageAdaptiveGroups
              columns:
                - {selector: dimensions.bucketName, text: resource, type: string}
                - {selector: max.payloadSize, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 10000, filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - refId: B
            relativeTimeRange: {from: 90000, to: 86400}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: B
              root_selector: data.viewer.accounts[0].r2StorageAdaptiveGroups
              columns:
                - {selector: dimensions.bucketName, text: resource, type: string}
                - {selector: max.payloadSize, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 10000, filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - refId: E
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: E, expression: $A - $B}
          - refId: F
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              refId: F
              expression: E
              conditions: [{evaluator: {params: [2000000000], type: gt}, operator: {type: and}, query: {params: [F]}, reducer: {params: [], type: last}, type: query}]
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'R2 bucket {{ $labels.resource }} grew {{ $values.E.Value | humanize }}B in 24 hours'
          description: 'A bucket grew by more than 2 GB against its size 24 hours ago. 0509-landing-page-artifacts grew about 36 GB over 2026-09-22 to 2026-10-07 and the restic repo went from 3 GB to 24 GB.'
          value: '{{ $values.E.Value | humanize }}B in 24 hours'
          threshold: 'over 2 GB growth in 24 hours'
          top: 'bucket {{ $labels.resource }}'
        labels: {severity: critical, signal: cloudflare-spend, product: r2-storage}
        isPaused: false
      # The middle tier (fleet-ops#9825). A leak that adds under 2 GB a day to
      # each of several buckets is invisible to cf-r2-bucket-growth, which
      # compares one bucket against itself, and the total page fires only once
      # the account crosses 30 GB. This compares the account total against the
      # same hour 30 days ago, so a spread or trickling leak shows up as growth
      # whatever any single bucket does. Query B is the hour ending 30 days
      # back, the same shape as cf-r2-bucket-growth's 24-hour-back B.
      # Severity warning, not critical: cloudflare-spend-contact.yaml sends
      # only critical to hermes-urgent, so this rule files a fleet-ops issue
      # and never pages. tests/alert_routes_check.py holds that: a rule outside
      # its URGENT list must be warning.
      - uid: cf-r2-total-growth
        title: Cloudflare R2 Standard storage 30-day growth
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: A
              root_selector: '$map([data.viewer.accounts[0]], function($a){{"total": $sum($a.r2StorageAdaptiveGroups.max.payloadSize)}})'
              columns: [{selector: total, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 10000, filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - refId: B
            relativeTimeRange: {from: 2595600, to: 2592000}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: B
              root_selector: '$map([data.viewer.accounts[0]], function($a){{"total": $sum($a.r2StorageAdaptiveGroups.max.payloadSize)}})'
              columns: [{selector: total, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 10000, filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - refId: T
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: T
              root_selector: data.viewer.accounts[0].r2StorageAdaptiveGroups
              columns:
                - {selector: dimensions.bucketName, text: resource, type: string}
                - {selector: max.payloadSize, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    r2StorageAdaptiveGroups(limit: 1, orderBy: [max_payloadSize_DESC], filter: {storageClass: "Standard", datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { bucketName } max { payloadSize } }
                  } } }
          - refId: E
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: E, expression: $A - $B}
          - refId: R
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: R, expression: $T * 0 + $E}
          - refId: F
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              refId: F
              expression: R
              conditions: [{evaluator: {params: [4000000000], type: gt}, operator: {type: and}, query: {params: [F]}, reducer: {params: [], type: last}, type: query}]
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'R2 Standard storage grew {{ $values.E.Value | humanize }}B in 30 days'
          description: 'The account total grew by more than 4 GB against the same hour 30 days ago. It is the middle tier between cf-r2-bucket-growth, which compares one bucket against itself 24 hours ago and so misses a leak that adds under 2 GB a day to each of several buckets, and cf-r2-standard-total, which pages at 30 GB. Measured 2026-10-21 (fleet-ops#9943): the account holds about 23 GB, the restic live repository and its 30-day-locked copy held about 10 GB each before the retention prune, whose kept set is about 1.5 GiB, and the 0509-snapshots pair ramps to about 12.5 GiB over a year under its 365-day lifecycle rules (0509#5950), which is about 1 GB a month. The line sits about 4x above that designed ramp, and the drain of the locked copy to 2026-11-21 shrinks the total, so neither the designed growth nor the drain fires it. Severity warning: it files a fleet-ops issue through the cloudflare-spend contact point and never reaches hermes-urgent.'
          value: '{{ $values.E.Value | humanize }}B growth in 30 days'
          threshold: 'over 4 GB (4000000000 bytes) growth in 30 days'
          top: 'bucket {{ $labels.resource }}'
        labels: {severity: warning, signal: cloudflare-spend, product: r2-storage}
        isPaused: false

  # D1 write spike (Nish, 2026-10-15). A flat line, not the 3x scheme above: on
  # 2026-10-15 the 16:00Z hour wrote 205,124 rows, just under the old 3 x
  # allowance line (205,479), and only the 7-day-median clause caught it, 46
  # minutes into the hour because the group above evaluates hourly. Normal
  # account-wide peaks over the last 30 days are up to ~27,000 rows/h (0509
  # production e2e and its daily cron); the bad hours were 331k to 426k
  # (2026-09-14..19 restore drills), 139k (2026-09-28) and 205k (2026-10-15).
  # 50,000 sits between them. The window is the trailing 60 minutes, checked
  # every 10 minutes, so a spike pages within ~10 minutes. The Telegram text is
  # summary + description only (hermes-urgent), so the top database id is in the
  # description. To switch it off: set isPaused: true on this rule, or change
  # 50000 in expression E and in the two annotations that print it.
  - orgId: 1
    name: cloudflare-d1-write-spike
    folder: fleet
    interval: 10m
    rules:
      - uid: cf-d1-rows-written
        title: Cloudflare D1 rows written
        condition: F
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: A
              root_selector: data.viewer.accounts[0].d1AnalyticsAdaptiveGroups
              columns: [{selector: sum.rowsWritten, text: value, type: number}]
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 10000, filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { sum { rowsWritten } }
                  } } }
          - refId: T
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-cloudflare
            model:
              <<: *cf-last-hour-total
              refId: T
              root_selector: data.viewer.accounts[0].d1AnalyticsAdaptiveGroups
              columns:
                - {selector: dimensions.databaseId, text: resource, type: string}
                - {selector: sum.rowsWritten, text: value, type: number}
              url_options:
                method: POST
                body_type: graphql
                body_content_type: application/json
                body_graphql_query: |-
                  query { viewer { accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 1, orderBy: [sum_rowsWritten_DESC], filter: {datetime_geq: "${__timeFrom:date:iso}", datetime_lt: "${__timeTo:date:iso}"}) { dimensions { databaseId } sum { rowsWritten } }
                  } } }
          - {refId: D, datasourceUid: __expr__, model: {<<: *cf-last}}
          - refId: E
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: math
              refId: E
              expression: $D > 50000
          - refId: R
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, type: math, refId: R, expression: $T * 0 + $E}
          - {refId: F, datasourceUid: __expr__, model: {<<: *cf-threshold}}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'D1 wrote {{ $values.D.Value | printf "%.0f" }} rows in the last 60 minutes (line: 50,000)'
          description: 'Top database writing: {{ $labels.resource }}. Normal peaks are up to ~27,000 rows/h; the 2026-09-14..19 restore drills wrote 331k to 426k rows/h.'
          value: '{{ $values.D.Value | printf "%.0f" }} rows written in the last 60 minutes'
          threshold: 'over 50,000 rows in the last 60 minutes'
          top: 'D1 database {{ $labels.resource }}'
        labels: {severity: critical, signal: cloudflare-spend, product: d1-rows-written}
        isPaused: false
