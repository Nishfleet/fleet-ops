# Cloudflare spend watch (fleet-ops#9355).
#
# Two leaks hit invoice IN-82380534 (voided 2026-10-07): D1 restore drills
# wrote ~145M rows and 0509 sign-in e2e sent ~15,300 emails; the Cloudflare
# budget-alert emails sat unread for days. This file watches the spend-shaped
# usage products directly through the Cloudflare GraphQL analytics API via
# the Infinity data source (uid fleet-cloudflare), and pages hermes-urgent
# (declared in paid-plan-idle.yaml) when an hour is far above normal.
#
# Threshold per Nish's finish line (issue comments, 2026-10-07): fire when a
# product's last-hour usage is over 3x its pro-rated hourly free allowance OR
# over 3x its 7-day hourly median. The math expression E in each rule is that
# union: (($C > 0) && ($D > 3 * $C)) || ($D > 3 * ALLOW), with the $C > 0
# guard so a product whose median hour is genuinely zero (email) does not
# fire on its first message of the day. Per-resource rules keep the same
# shape per database / model / script / sender so the alert names the top
# resource: the GraphQL query groups by that dimension, the Infinity backend
# parser turns the long series into one labelled series per resource, and the
# label reaches the Telegram text as {{ $labels... }}.
#
# R2 rules use absolute thresholds from the same comment: total R2 Standard
# storage over 20 GB, any bucket growing over 2 GB in ~24h, and any Standard
# data in a bucket outside the known list (the known list is baked into the
# cf-r2-unknown GraphQL filter). The 10.35 GB nish-hostinger-kvm4-backups-locked
# ghost bucket is InfrequentAccess and stays out of these rules; its cleanup
# is tracked in #9359.
#
# Escaping note: provisioning expands $VAR and $$ in labels and in the query
# model (every string passes os.ExpandEnv; annotations are stored raw). So
# inside `model` every Grafana-side dollar is doubled: $${__timeFrom:date:iso}
# in the GraphQL text (the Infinity data source interpolates that macro from
# the query's relativeTimeRange at evaluation time) and $$D / $$C in math
# expressions. Annotations keep single dollars, which is why cpu-pressure.yaml
# templates work as written.
#
# Groups: the hourly group carries D1, email, Workers and Durable Objects;
# the 5m group carries Workers AI and R2 (Nish: "5m for the R2 and AI rules
# if cheap" — these are two small GraphQL reads per evaluation).

apiVersion: 1

groups:
  - orgId: 1
    name: cloudflare-spend-hourly
    folder: fleet
    interval: 1h
    rules:
    - uid: cf-d1-writes
      title: 'Cloudflare D1: hourly writes over the 3x line'
      condition: F
      data:
      - refId: A
        relativeTimeRange:
          from: 3600
          to: 0
        datasourceUid: fleet-cloudflare
        model:
          datasource:
            type: yesoreyeram-infinity-datasource
            uid: fleet-cloudflare
          refId: A
          type: graphql
          source: url
          url: https://api.cloudflare.com/client/v4/graphql
          url_options:
            method: POST
            body_type: graphql
            body_content_type: application/json
            body_graphql_query: |-
              query {
                viewer {
                  accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 10000, filter: {datetime_geq: "$${__timeFrom:date:iso}", datetime_lt: "$${__timeTo:date:iso}"}, orderBy: [datetime_ASC]) {
                      dimensions { datetime }
                      sum { rowsWritten }
                    }
                  }
                }
              }
          parser: backend
          root_selector: data.viewer.accounts.0.d1AnalyticsAdaptiveGroups
          columns:
          - selector: dimensions.datetime
            text: time
            type: timestamp
          - selector: sum.rowsWritten
            text: rows_written
            type: number
          format: timeseries
      - refId: B
        relativeTimeRange:
          from: 604800
          to: 0
        datasourceUid: fleet-cloudflare
        model:
          datasource:
            type: yesoreyeram-infinity-datasource
            uid: fleet-cloudflare
          refId: B
          type: graphql
          source: url
          url: https://api.cloudflare.com/client/v4/graphql
          url_options:
            method: POST
            body_type: graphql
            body_content_type: application/json
            body_graphql_query: |-
              query {
                viewer {
                  accounts(filter: {accountTag: "f670a698e17bf160c8e4679823e68916"}) {
                    d1AnalyticsAdaptiveGroups(limit: 10000, filter: {datetime_geq: "$${__timeFrom:date:iso}", datetime_lt: "$${__timeTo:date:iso}"}, orderBy: [datetime_ASC]) {
                      dimensions { datetime }
                      sum { rowsWritten }
                    }
                  }
                }
              }
          parser: backend
          root_selector: data.viewer.accounts.0.d1AnalyticsAdaptiveGroups
          columns:
          - selector: dimensions.datetime
            text: time
            type: timestamp
          - selector: sum.rowsWritten
            text: rows_written
            type: number
          format: timeseries
      - refId: C
        datasourceUid: __expr__
        model:
          datasource:
            type: __expr__
            uid: __expr__
          expression: B
          intervalMs: 1000
          maxDataPoints: 43200
          reducer: median
          settings:
            mode: dropNN
          refId: C
          type: reduce
      - refId: D
        datasourceUid: __expr__
        model:
          datasource:
            type: __expr__
            uid: __expr__
          expression: A
          intervalMs: 1000
          maxDataPoints: 43200
          reducer: last
          settings:
            mode: dropNN
          refId: D
          type: reduce
      - refId: E
        datasourceUid: __expr__
        model:
          datasource:
            type: __expr__
            uid: __expr__
          expression: (($$C > 0) && ($$D > 3 * $$C)) || ($$D > 3 * 68493)
          intervalMs: 1000
          maxDataPoints: 43200
          refId: E
          type: math
      - refId: F
        datasourceUid: __expr__
        model:
          conditions:
          - evaluator:
              params:
              - 0.5
              type: gt
            operator:
              type: and
            query:
              params:
              - F
            reducer:
              params: []
              type: last
            type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: E
          intervalMs: 1000
          maxDataPoints: 43200
          refId: F
          type: threshold
      noDataState: OK
      execErrState: Error
      for: 0s
      annotations:
        summary: "Cloudflare D1 wrote {{ $values.D.Value | printf \"%.0f\" }} rows in the last hour \u2014 over the 3x spend line (7-day hourly median {{ $values.C.Value | printf \"%.0f\" }}, free allowance 68493/h)."
        description: Last-hour D1 rows written = {{ $values.D.Value | printf "%.0f" }}. The rule fires when that hour is over 3x the 7-day hourly median or over 3x the free allowance (50M rows/month over 730 hours), whichever line is crossed. The 2026-10-02 restore drills wrote ~145M rows (invoice IN-82380534). The companion rule cf-d1-writes-by-db names the database if one database burst.
      labels:
        product: d1
        signal: cloudflare-spend
      isPaused: false
      notification_settings:
        receiver: cloudflare-spend-dispatch
        group_by:
        - alertname
        - grafana_folder
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
