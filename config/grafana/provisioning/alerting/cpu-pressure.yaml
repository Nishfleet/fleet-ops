# CPU pressure alert (fleet-ops#9304).
# The signal is node_exporter's node_pressure_cpu_waiting_seconds_total, the
# wait side of /proc/pressure/cpu: the fraction of wall time runnable work was
# ready and still had no core.
#
# The window is 15m on purpose, and it is NOT PSI's avg300. PSI avg300 is 300
# seconds, so the 5-minute average is the one that matches it. This rule wants
# the slower 15-minute average: sustained queueing is the signal, and a 5-minute
# rate flickers on every burst of runner churn. Combined with `for: 15m` the
# alert needs roughly 30 minutes of real queueing before it fires.
#
# On 2026-10-05 the box ran load 21 on 12 cores with nothing on the fleet view
# showing where the time went (fleet-ops#9304).
#
# The 25% threshold came from "pressure sits near 2% when idle and reads 33%
# when the cores are saturated, so 25% is above ordinary churn". The ten days
# 2026-10-21 to 2026-10-30 (one sample a minute) falsify that. Three events
# fired it there, and the peak of the 15m rate within 30 minutes of each one was
# 43.6% (10-21), 60.0% (10-23, which fired twice) and 34.6% (10-30, filed as
# #11127), while the processor read 79.1%, 70.1% and 67.7% busy at the moment
# each fired. The box was working, not stuck: /proc/pressure/cpu reports
# `full avg10=0.00 avg60=0.00 avg300=0.00 total=0`, so work that could not run
# has never been observed on this host. On CPU the kernel publishes `some` only,
# and `some` counts *any* single waiting task, so on a host running 28 agent
# runners (measured 2026-10-30) it rises whenever the fleet is busy; the 10-21
# event closed as "transient burst, no repo change needed".
#
# Time above each level over those ten days: 135 min above 25, 45 above 35, 21
# above 40, 7 above 45, and the maximum was 60.0.
#
# 40 keeps both larger events (43.6 and 60.0) and drops the 34.6 one, which ran
# at 67.7% busy with `full` at 0. At the 15m period it leaves 21 minutes of
# signal in ten days: enough to fire on an event that holds, and far from the
# 135 minutes the 25 threshold kept answering. The split is fitted and scored on
# the same ten days, so it is provisional: the next firing is the held-out case,
# and if that one reads 40 or above with `full` still 0, then busy is the wrong
# signal for this rule and busy is where it should move.
#
# Severity warning: the policy tree files a fleet-ops issue and does not page (fleet-ops#9445).
apiVersion: 1

groups:
  - orgId: 1
    name: cpu-pressure
    folder: fleet
    interval: 1m
    rules:
      - uid: cpu-pressure-avg300
        title: CPU pressure avg300 over 25%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: rate(node_pressure_cpu_waiting_seconds_total[15m]) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[15m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [40], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # 15m at a 1m interval, the window the issue asked for.
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: CPU pressure has held high for 15 minutes, so runnable work is waiting for cores.
          description: 'Pressure has held at {{ with index $values "A" }}{{ if .Value }}{{ .Value | printf "%.1f" }}%{{ else }}no reading{{ end }}{{ else }}no reading{{ end }} for 15 minutes while the processor read {{ with index $values "B" }}{{ if .Value }}{{ .Value | printf "%.1f" }}%{{ else }}no reading{{ end }}{{ else }}no reading{{ end }} busy. Busy is the share of all cores in use; pressure is the share of time runnable work could not get a core. Runners per repo, the router and sessions all share this host, and none of them is named by this rule, so use `systemctl status` on the host to find the unit. No exporter on this box publishes per-unit CPU (#9306 closed 2026-10-29 as a process add-on), so the consumer is a manual read of `ps -eo pcpu,args --sort=-pcpu` on the host.'
        labels:
          severity: warning
          signal: cpu-pressure
        isPaused: false
