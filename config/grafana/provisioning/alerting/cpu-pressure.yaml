# CPU pressure alert (fleet-ops#9304).
# The signal is node_exporter's node_pressure_cpu_waiting_seconds_total, the
# wait side of /proc/pressure/cpu: the fraction of wall time runnable work was
# ready and still had no core.
#
# The window is 15m on purpose, and it is NOT PSI's avg300. PSI avg300 is 300
# seconds, so the 5-minute average is the one that matches it. This rule wants
# the slower 15-minute average: sustained queueing is the signal, and a 5-minute
# rate flickers on every burst of runner churn. Combined with `for: 15m` the
# alert needs roughly 30 minutes of real queueing before it fires.
#
# On 2026-10-05 the box ran load 21 on 12 cores with nothing on the fleet view
# showing where the time went (fleet-ops#9304). Measured on this box: pressure
# sits near 2% when idle and reads 33% when the cores are saturated, so 25% is
# above ordinary churn and well below a genuinely blocked box.
#
# Contact point: the existing hermes-urgent Telegram contact point from
# paid-plan-idle.yaml, referenced by name. Grafana merges every file in
# /etc/grafana/provisioning/alerting, so this file adds a rule and reuses that
# receiver rather than declaring a second one.
apiVersion: 1

groups:
  - orgId: 1
    name: cpu-pressure
    folder: fleet
    interval: 1m
    rules:
      - uid: cpu-pressure-avg300
        title: CPU pressure avg300 over 25%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: rate(node_pressure_cpu_waiting_seconds_total[15m]) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[15m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [25], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # 15m at a 1m interval, the window the issue asked for.
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: CPU pressure above 25% for 15 minutes, so work is queueing for cores.
          description: 'Pressure has held at {{ $values.A.Value | printf "%.1f" }}% for 15 minutes while the processor read {{ $values.B.Value | printf "%.1f" }}% busy. Busy is the share of all cores in use; pressure is the share of time runnable work could not get a core. Runners per repo, the router and sessions all share this host, and none of them is named by this rule, so use `systemctl status` on the host to find the unit. See #9306 for per-unit and per-container CPU, which no exporter on this box publishes yet.'
        labels:
          signal: cpu-pressure
        isPaused: false
        notification_settings:
          receiver: hermes-urgent
          group_by: [alertname, grafana_folder]
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 4h