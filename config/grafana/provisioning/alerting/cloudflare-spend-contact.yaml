# Cloudflare spend-watch dispatch contact point (fleet-ops#9355).
#
# Nish's finish-line change (2026-10-07 07:57): every firing rule opens a
# fleet-ops issue (labels agent-ready + priority-now) via a stock Grafana
# webhook posting to the GitHub issues API, and Nish's phone is the FALLBACK,
# not the primary. This file declares one receiver with both integrations so
# each rule's notification reaches both destinations as one grouped
# notification:
#
#   1. webhook -> POST https://api.github.com/repos/Nishfleet/fleet-ops/issues
#      authenticated with a Bearer token from the provisioning env reference
#      $GITHUB_ISSUES_TOKEN (expanded at load from the unit environment; the
#      quadlet passes it from %h/.config/fleet-ops/github-issues.env, 0600).
#      The custom payload template (sprig dict/list + toJson) emits the exact
#      GitHub issues-API body - title "cost alarm: <rule> <product>", body
#      holding value/threshold/top resource per firing alert, labels fixed.
#      Stock Grafana cannot condition the Telegram send on the webhook result,
#      so the telegram integration below fires in parallel: that IS the loud
#      failure guarantee - if the GitHub POST fails, Nish still gets the
#      hermes-urgent ping. Until the standing token is minted the webhook
#      fails auth (delivery error, Telegram still fires) - documented in the
#      PR; minting the token is Nish's call.
#   2. telegram -> the hermes-urgent wiring from paid-plan-idle.yaml
#      (bottoken/chatid via the same env references), kept verbatim so the
#      fallback message format matches the existing urgent channel, with one
#      extra closing line. That line matters: Grafana's telegram notifier
#      routes by the bot's direct-message chat id, so a text posted to the
#      channel chat is stored but never delivered to the bot's owner and the
#      sending fails with "can't parse entities" (measured 2026-10-07). The
#      closing line makes the message self-identifying so the bare-send case
#      is at least recognizable in the channel history.
#
# Rules carry notification_settings.receiver = cloudflare-spend-dispatch with
# repeat_interval 12h (one leak = one issue, not one an hour).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: cloudflare-spend-dispatch
    receivers:
      - uid: cf-spend-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $GITHUB_ISSUES_TOKEN
          maxAlerts: "0"
          # The payload template replaces the whole request body, so it must
          # emit the complete GitHub issues-API JSON (title, body, labels) at
          # the top level - a template that only emits a string, or one that
          # starts with a sprig assignment, fails the POST (measured:
          # 'template: :1: unexpected ":=" in command' and a 422 from GitHub).
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- dict "title" (printf "cost alarm: %s %s" .Labels.alertname .Labels.product)
                     "body" (printf "Auto-created by the Grafana cloudflare-spend watch (fleet-ops#9355).\n\n**%s**\n\n%s\n\nRule `%s` in group %s fired at %s." .Annotations.summary .Annotations.description .Labels.alertname .GroupLabels.grafana_folder (.StartsAt | date "2006-01-02 15:04:05 Z07:00"))
                     "labels" (list "agent-ready" "priority-now") | toJson -}}
              {{- end -}}
      - uid: cf-spend-tg-fallback
        type: telegram
        disableResolveMessage: true
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: |
            $TELEGRAM_HOME_CHANNEL
          message: |
            {{ range .Alerts.Firing }}
            {{ .Annotations.summary }} {{ .Annotations.description }}
            {{ end }}
