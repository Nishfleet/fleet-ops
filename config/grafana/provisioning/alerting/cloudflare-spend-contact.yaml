# Cloudflare cost alarm: contact point and notification policy (fleet-ops#9355).
#
# Nish (2026-10-07, "make it urgent for us to address urgently"): a firing
# cost-alarm rule opens a fleet-ops issue labelled agent-ready + priority-now,
# so the fleet picks it up first. Nish reads it in the normal Hermes digest.
# hermes-urgent (paid-plan-idle.yaml) is the fallback, and it fires directly
# when the alarm cannot do its job:
#   - the rule cannot evaluate (alertname DatasourceError / DatasourceNoData
#     skips the issue route and lands on the policy root, hermes-urgent);
#   - the GitHub POST fails (the rule in cloudflare-spend-delivery.yaml reads
#     Grafana's own webhook failure counter and routes to hermes-urgent).
#
# The webhook posts the GitHub issues API body from the payload template. The
# token is a file reference, never a literal: $__file{} is Grafana's own
# provisioning expansion and re-reads the file at every provisioning load. The
# file holds a GitHub App installation token (issues:write on Nishfleet/fleet-ops
# only) that expires after one hour, so fleet-grafana-github-token.timer
# re-mints it every 20 min and reloads provisioning (fleet-ops#9445; before
# that it was a static token in an env file and went stale in an hour). Rules
# carry label signal=cloudflare-spend and the policy below picks them up, so
# there is one place that decides the route.
# Who gets interrupted (Nish's message contract: only a real outage, a money
# problem, or something only he can act on pages him; everything else is an
# issue for the fleet). hermes-urgent (Telegram) is therefore NOT the policy
# root any more: the root is fleet-alert-dispatch, which files a fleet-ops issue.
# Rules that page, and why:
#   cloudflare-spend (6 rules)      money: a cost alarm is the fleet reporting a bill
#   cloudflare-spend-delivery       the cost alarm could not file its issue
#   paid-plan-idle (9 rules)        money: a paid plan unused, cancelling is Nish's call
# Rules that file an issue instead: router-dead-row (fleet-owned router rows),
# cpu-pressure (host load the fleet can shed), prompt-cache-hit (cost tuning the
# fleet owns), and any rule whose datasource fails. tests/alert_routes_check.py
# (CI) fails when a rule outside that list can reach hermes-urgent.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: cloudflare-spend-dispatch
    receivers:
      - uid: cf-spend-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "cost alarm: %s %s" .Labels.alertname .Labels.resource)
                     "body" (printf "%s.\n\nValue: %s. Threshold: %s. Top resource: %s.\n\n%s\n\nRule `%s`, started firing %s UTC (%s). Source: the Grafana cloudflare-spend rules, fleet-ops#9355. Find the leak, stop it, then close this issue." .Annotations.summary .Annotations.value .Annotations.threshold .Annotations.top .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") .GeneratorURL)
                     "labels" (coll.Slice "agent-ready" "priority-now") | data.ToJSON -}}
              {{- end -}}
  - orgId: 1
    name: router-dead-row-dispatch
    receivers:
      - uid: router-dead-row-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "router dead row: %s" .Labels.model_id)
                     "body" (printf "%s.\n\nValue: %s. Threshold: %s.\n\n%s\n\nRule `%s`, started firing %s UTC (%s). Source: the Grafana router-dead-row rule (config/grafana/provisioning/alerting/router-dead-row.yaml), fleet-ops#9312 class fix. Do not remove or bench the row without Nish's yes: open a needs-nish-decision issue with the evidence." .Annotations.summary .Annotations.value .Annotations.threshold .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") .GeneratorURL)
                     "labels" (coll.Slice "agent-ready" "priority-now") | data.ToJSON -}}
              {{- end -}}

  - orgId: 1
    name: fleet-alert-dispatch
    receivers:
      - uid: fleet-alert-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "grafana alert: %s" .Labels.alertname)
                     "body" (printf "%s\n\n%s\n\nRule `%s`, started firing %s UTC (%s). Labels: %s. Source: a Grafana rule in config/grafana/provisioning/alerting, routed to the fleet because it is not one of the urgent classes (see the header of cloudflare-spend-contact.yaml). Find the cause, fix it, then close this issue." .Annotations.summary .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") .GeneratorURL (data.ToJSON (.Labels.Remove (stringSlice "alertname" "grafana_folder"))))
                     "labels" (coll.Slice "agent-ready") | data.ToJSON -}}
              {{- end -}}


policies:
  - orgId: 1
    # Root: the fleet, not Nish. One issue per alert instance (group_by '...').
    receiver: fleet-alert-dispatch
    group_by: ['...']
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      - receiver: cloudflare-spend-dispatch
        object_matchers:
          - [signal, "=", cloudflare-spend]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, product, resource]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
        continue: true
      # Same matcher again: a spend alert also pages hermes-urgent, so a dead
      # or expired GitHub token never silences it.
      - receiver: hermes-urgent
        object_matchers:
          - [signal, "=", cloudflare-spend]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, product, resource]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
      - receiver: router-dead-row-dispatch
        object_matchers:
          - [signal, "=", router-dead-row]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, model_id]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
      # A cost rule that cannot evaluate (alertname DatasourceError or
      # DatasourceNoData skips the dispatch route above) is the fleet unable to
      # see a bill: it pages, like the cost alarm itself.
      - receiver: hermes-urgent
        object_matchers:
          - [signal, "=", cloudflare-spend]
          - [alertname, "=~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, product]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
