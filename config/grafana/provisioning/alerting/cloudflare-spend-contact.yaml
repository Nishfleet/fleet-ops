# Notification contact points and the one policy tree (fleet-ops#9355, #9445).
# The webhooks post the GitHub issues API body from the payload template. The
# token is a file reference, never a literal: $__file{} is Grafana's own
# provisioning expansion and re-reads the file at every provisioning load. The
# file holds a GitHub App installation token (issues:write on Nishfleet/fleet-ops
# only) that expires after one hour, so fleet-grafana-github-token.timer
# re-mints it every 20 min and reloads provisioning. Every rule carries a
# severity label (critical or warning) and the policy tree below routes on it.
#
# One issue per firing alert (fleet-ops#10204). The webhook receiver is
# create-only: every notification it sends opens a new issue, and a resolved
# notification would open a second one, so disableResolveMessage stays true and
# the issue cadence is set with repeat_interval. A rule that fires, then flaps
# (resolves and fires again), is a new alert instance and files again; the
# stock receiver cannot search GitHub for the open issue and comment on it (it
# cannot learn the issue number), so the fleet's resolution record is the fixing
# worker's close receipt, not a resolve notification.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: cloudflare-spend-dispatch
    receivers:
      - uid: cf-spend-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "cost alarm: %s %s" .Labels.alertname .Labels.resource)
                     "body" (printf "%s.\n\nValue: %s. Threshold: %s. Top resource: %s.\n\n%s\n\nRule `%s`, started firing %s UTC (%s). Source: the Grafana cloudflare-spend rules, fleet-ops#9355. Find the leak, stop it, then close this issue." .Annotations.summary .Annotations.value .Annotations.threshold .Annotations.top .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") .GeneratorURL)
                     "labels" (coll.Slice "agent-ready" "priority-now") | data.ToJSON -}}
              {{- end -}}
  - orgId: 1
    name: router-dead-row-dispatch
    receivers:
      - uid: router-dead-row-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "router dead row: %s" .Labels.model_id)
                     "body" (printf "%s.\n\nValue: %s. Threshold: %s.\n\n%s\n\nRule `%s`, started firing %s UTC (%s). Source: the Grafana router-dead-row rule (config/grafana/provisioning/alerting/router-dead-row.yaml), fleet-ops#9312 class fix. Do not remove or bench the row without Nish's yes: open a needs-nish-decision issue with the evidence." .Annotations.summary .Annotations.value .Annotations.threshold .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") .GeneratorURL)
                     "labels" (coll.Slice "agent-ready" "priority-now") | data.ToJSON -}}
              {{- end -}}

  - orgId: 1
    name: fleet-alert-dispatch
    receivers:
      - uid: fleet-alert-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "grafana alert: %s" .Labels.alertname)
                     "body" (printf "%s\n\n%s\n\nRule `%s`, started firing %s UTC (%s). Labels: %s. Source: a Grafana rule in config/grafana/provisioning/alerting, filed by the severity policy in cloudflare-spend-contact.yaml. A paid plan to cancel, a spend to accept or a row to remove is Nish's call: open a needs-nish-decision issue with the evidence instead of acting. Otherwise find the cause, fix it, then close this issue." .Annotations.summary .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") .GeneratorURL (data.ToJSON (.Labels.Remove (stringSlice "alertname" "grafana_folder"))))
                     "labels" (coll.Slice "agent-ready") | data.ToJSON -}}
              {{- end -}}


policies:
  - orgId: 1
    receiver: fleet-alert-dispatch
    group_by: ['...']
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      - receiver: hermes-urgent
        object_matchers:
          - [severity, "=", critical]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, repo, product, resource, model_id, plan, requested_model]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 1h
        continue: true
      - receiver: hermes-urgent
        object_matchers:
          - [severity, "=", critical]
          - [signal, "!~", "deploy-failed-24h|queue-down-2h"]
          - [alertname, "=~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, product, plan, requested_model]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
        continue: true
      - receiver: cloudflare-spend-dispatch
        object_matchers:
          - [signal, "=", cloudflare-spend]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, product, resource]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
      - receiver: router-dead-row-dispatch
        object_matchers:
          - [signal, "=", router-dead-row]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [alertname, model_id]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 12h
      - receiver: fleet-alert-dispatch
        object_matchers:
          - [signal, "=", deploy-failed-24h]
          - [alertname, "=~", "DatasourceError|DatasourceNoData"]
        mute_time_intervals: [deploy-failed-24h-and-queue-down-2h-errors]
      # Same mute for the queue-down-2h rules: the queue-down rule on the same
      # query files the repo's one issue on a read error.
      - receiver: fleet-alert-dispatch
        object_matchers:
          - [signal, "=", queue-down-2h]
          - [alertname, "=~", "DatasourceError|DatasourceNoData"]
        mute_time_intervals: [deploy-failed-24h-and-queue-down-2h-errors]
      # The host-unit and queue-down rules file ONE issue per firing alert
      # (fleet-ops#10204): they are the failures a machine fixes, so the issue is
      # the work item, and a fresh one every 24h started a second worker on the
      # same failure. A week is the safety net: a failure still firing then has
      # an unfixed or closed-without-a-fix issue, and one more is due. Terminal,
      # so a queue-down-2h alert still reaches hermes-urgent above and stops here.
      - receiver: fleet-alert-dispatch
        object_matchers:
          - [signal, "=~", "host-unit|queue-down|queue-down-2h"]
        group_by: ['...']
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 7d
      # A plan out of credit keeps this rule firing until the balance is refilled,
      # and the remedy (top up, cancel, bench the rows) is Nish's call, so its
      # daily issue re-filed the same alert every 24h: fleet-ops#9845, #9857,
      # #9876 and #9897 are one Pareto credit wall across four issues, and each
      # new issue started a worker run against a decision already parked on Nish.
      # The plan rule keeps paging on the critical routes above (1h, and 12h for a
      # datasource error) and files its one issue weekly instead. This route is
      # terminal, so a plan alert stops here and never reaches the catch-all below.
      - receiver: fleet-alert-dispatch
        object_matchers:
          - [plan, "=~", ".+"]
        group_by: ['...']
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 7d
      - receiver: fleet-alert-dispatch
        object_matchers:
          - [alertname, "=~", ".+"]
        group_by: ['...']
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 24h

# The deploy-failed-24h and queue-down-2h rules' read errors (routes above):
# the deploy-failed and queue-down rules on the same queries file each repo's
# one issue.
muteTimes:
  - orgId: 1
    name: deploy-failed-24h-and-queue-down-2h-errors
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"
