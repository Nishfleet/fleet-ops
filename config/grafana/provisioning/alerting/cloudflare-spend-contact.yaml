# Notification contact points and the one policy tree (fleet-ops#9355, #9445).
# The webhooks post the GitHub issues API body from the payload template. The
# token is a file reference, never a literal: $__file{} is Grafana's own
# provisioning expansion and re-reads the file at every provisioning load. The
# file holds a GitHub App installation token (issues:write on Nishfleet/fleet-ops
# only) that expires after one hour, so fleet-grafana-github-token.timer
# re-mints it every 20 min and reloads provisioning. Every rule carries a
# severity label (warning; no Grafana rule pages since the owner reset,
# fleet-ops#10935) and the policy tree below routes on it. Contact points the
# reset stopped using are left in Grafana unused rather than deleted, because
# nothing routes to them.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: fleet-alert-dispatch
    receivers:
      - uid: fleet-alert-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          maxAlerts: 1
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- coll.Dict "title" (printf "grafana alert: %s" .Labels.alertname)
                     "body" (printf "%s\n\n%s\n\nRule `%s`, started firing %s UTC. Labels: %s. Source: a Grafana rule in config/grafana/provisioning/alerting, filed by the severity policy in cloudflare-spend-contact.yaml. A paid plan to cancel, a spend to accept or a row to remove is Nish's call: open a needs-nish-decision issue with the evidence instead of acting. Otherwise find the cause, fix it, then close this issue." .Annotations.summary .Annotations.description .Labels.alertname (.StartsAt.Format "2006-01-02 15:04:05") (data.ToJSON (.Labels.Remove (stringSlice "alertname" "grafana_folder"))))
                     "labels" (coll.Slice "agent-ready") | data.ToJSON -}}
              {{- end -}}


  - orgId: 1
    name: prometheus-alert-dispatch
    receivers:
      - uid: prometheus-alert-gh-issues
        type: webhook
        disableResolveMessage: true
        settings:
          url: https://api.github.com/repos/Nishfleet/fleet-ops/issues
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__file{/run/secrets/github-token/token}
          payload:
            template: |-
              {{- with index .Alerts 0 -}}
              {{- $$units := "" -}}
              {{- range $$.Alerts -}}
              {{- $$units = printf "%s- %s (started firing %s UTC)\n" $$units (or .Labels.name .Labels.instance) (.StartsAt.Format "2006-01-02 15:04:05") -}}
              {{- end -}}
              {{- coll.Dict "title" (printf "alert: %s" .Labels.prom_alertname)
                     "body" (printf "%s\n\n%s\n\nPrometheus alert `%s` is firing for %d instance(s):\n\n%s\nSource: the Grafana prometheus-alerts rule, fleet-ops#10300. One issue covers every instance of this alert name (fleet-ops#10327): fix the one cause behind them.\n\nFix the cause, prove the alert resolved, then close this issue. If the failed unit is on the polkit start list, re-run it with `systemctl start <unit>` once your fix is live, and show `Result=success`." .Annotations.summary .Annotations.description .Labels.prom_alertname (len $$.Alerts) $$units)
                     "labels" (coll.Slice "agent-ready" "strong-only") | data.ToJSON -}}
              {{- end -}}

policies:
  - orgId: 1
    receiver: fleet-alert-dispatch
    group_by: ['...']
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      - receiver: prometheus-alert-dispatch
        object_matchers:
          - [signal, "=", prometheus]
          - [alertname, "!~", "DatasourceError|DatasourceNoData"]
        group_by: [prom_alertname]
        group_wait: 30s
        group_interval: 5m
        # 24h, not 168h: a worker that closes the issue without fixing the cause
        # must not silence the alert for 7 days (fleet-ops#10321). Cost: at most
        # one strong-seat run per still-firing alert per day.
        repeat_interval: 24h
      - receiver: fleet-alert-dispatch
        object_matchers:
          - [alertname, "=~", ".+"]
        group_by: ['...']
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 24h
