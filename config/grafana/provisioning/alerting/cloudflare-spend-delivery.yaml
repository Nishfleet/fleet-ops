# Cost alarm delivery watch (fleet-ops#9355). "A failed alert delivery must
# itself be loud": stock Grafana cannot fall back from a failed webhook to
# another integration, but it counts every failed notification per integration
# (grafana_alerting_notifications_failed_total). Prometheus scrapes Grafana
# (job grafana in rootfs/etc/prometheus/prometheus.yml), and this rule
# (severity critical) pages
# hermes-urgent when the GitHub-issue webhook failed in the last hour. The
# usual cause is a send landing in the provisioning-apply window: every mint
# reloads alerting ("Applying new configuration to Alertmanager"), the apply
# tears the notifier down mid-send, and the send is not retried
# (fleet-ops#11426, #11442). The token chain is a rarer cause; check
# `systemctl --user status fleet-grafana-github-token.service` too. Until the first failure
# the series does not exist, so `or vector(0)` keeps the rule Normal.
apiVersion: 1

groups:
  - orgId: 1
    name: cloudflare-spend-delivery
    folder: fleet
    interval: 5m
    rules:
      - uid: cf-spend-delivery-failed
        title: Cost alarm GitHub issue delivery failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: fleet-prometheus
            model:
              datasource: {type: prometheus, uid: fleet-prometheus}
              editorMode: code
              expr: sum(increase(grafana_alerting_notifications_failed_total{integration="webhook"}[1h])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              refId: C
              expression: A
              conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}, type: query}]
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: The cost alarm could not open its GitHub issue.
          description: 'Grafana failed {{ with index $values "A" }}{{ if .Value }}{{ .Value | printf "%.0f" }}{{ else }}no reading{{ end }}{{ else }}no reading{{ end }} webhook deliveries to the GitHub issues API in the last hour. The usual cause is a send colliding with a provisioning-apply window (fleet-ops#11426, #11442): the delivery is thrown away and the only log hint is the debug level. Check `curl -s localhost:3001/api/alertmanager/grafana/api/v2/alerts`, then `systemctl --user status fleet-grafana-github-token.service` and finally the Grafana log with logger=ngalert.notifier.'
        labels: {severity: critical, signal: cloudflare-spend-delivery}
        isPaused: false
