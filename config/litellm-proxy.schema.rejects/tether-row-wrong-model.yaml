# Tether: the tether group answers only from anthropic/claude-sonnet-5-5; another
# model in it is refused.
# The rows and router_settings are the live config's judge fallback, judge paid,
# Synthetic worker-capable, Straitly worker-public and tether rows plus its own
# router_settings, which pass the schema alone, so the change above is the only
# one in this file.
# undo: model_list.4.litellm_params.model = "anthropic/claude-sonnet-5-5"
model_list:
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY
    reasoning_effort: max
    extra_headers:
      x-opencode-session: fleet-judge
    tags:
    - prepaid
    - opencode-go
    order: 2
    max_parallel_requests: 2
    cooldown_time: 21600
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'Same gateway and model as the removed key-2 rows (88.4% cache-read 7d, #9357 scoreboard); this row is the monthly-quota-walled Go endpoint (#9122) with little traffic of its own.'
    id: opencodego-ds41flash-judge
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 0
- model_name: judge
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    tags:
    - prepaid
    - alibaba
    rpm: 3
    order: 1
    max_parallel_requests: 3
    cooldown_time: 900
    extra_body:
      enable_thinking: true
      thinking_budget: 2048
    additional_drop_params:
    - reasoning_effort
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'Caches: direct probe 2026-10-07 on compatible-mode, call 2 cached_tokens 7168 of 7967 (90%); the endpoint reports prompt_tokens_details.cached_tokens. Judge group: one-shot calls only, order unchanged.'
    id: alibaba-qwen38max-judge
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: worker-capable
  litellm_params:
    model: openai/hf:zai-org/GLM-5.3-Flash
    api_base: https://api.synthetic.new/openai/v1
    api_key: os.environ/SYNTHETIC_API_KEY
    tags:
    - prepaid
    order: 1
    weight: 1
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: '2026-10-07 #9357 scoreboard: 89.5% cache-read 7d on real router traffic.'
    id: synthetic-glm53flashe-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: worker-public
  litellm_params:
    model: openai/deepseek/deepseek-v4-1-flash
    api_base: https://api.straitly.ai/v1
    api_key: os.environ/STRAITLY_API_KEY
    tags:
    - straitly
    - free-credit
    order: 1
    weight: 1
    input_cost_per_token: 3.82e-08
    cache_read_input_token_cost: 3.8e-09
    output_cost_per_token: 1.529e-07
    max_budget: 9.5
    budget_duration: 30d
    max_parallel_requests: 16
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'Caches: direct probe 2026-10-15 on api.straitly.ai deepseek/deepseek-v4-1-flash, 6 calls on a 9040-token prefix, cached_tokens 0/0/0/0/0/8832 (fleet-ops#9788).'
    id: straitly-ds41flasha-worker-public
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: tether
  litellm_params:
    model: anthropic/claude-sonnet-5
    api_key: os.environ/ANTHROPIC_API_KEY
    api_base: https://api.anthropic.com
    cache_control_injection_points:
    - location: message
      role: system
    - location: message
      index: -1
    tags:
    - prepaid
    - anthropic
    order: 1
    input_cost_per_token: 2e-06
    cache_creation_input_token_cost: 2.5e-06
    cache_read_input_token_cost: 1e-07
    output_cost_per_token: 1e-05
    max_parallel_requests: 4
    cooldown_time: 300
    max_budget: 50.0
    budget_duration: 1d
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'Caches: direct probe 2026-10-23 on api.anthropic.com/v1/messages with a 23403-token system block marked cache_control, call 1 cache_creation_input_tokens 23403, call 2 cache_read_input_tokens 23403 of 23414 (99.9%).'
    id: anthropic-sonnet55-tether
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks:
  - prompt_caching
  - session_affinity
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  deployment_affinity_ttl_seconds: 600
  model_group_alias:
    worker-capable-desk: worker-capable
    worker-public-desk: worker-public
  fallbacks:
  - worker-cheap:
    - worker-capable
  - worker-public:
    - worker-capable
  - worker-public-desk:
    - worker-capable
  - assistant:
    - worker-capable
  - tether:
    - assistant
  cooldown_time: 60
  allowed_fails: 1
  num_retries: 0
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    AuthenticationErrorRetries: 1
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
    NotFoundErrorRetries: 1
    DefaultRetries: 1
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
    NotFoundErrorAllowedFails: 0
