# A worker row with a negative weight gets a 0 share from LiteLLM v1.98.0 simple-shuffle
# (simple_shuffle.py:46), which can never be a pick. The floor is 1.
model_list:
- model_name: worker-capable
  litellm_params:
    model: openai/x
    weight: -1
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test."
router_settings:
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  cooldown_time: 60
