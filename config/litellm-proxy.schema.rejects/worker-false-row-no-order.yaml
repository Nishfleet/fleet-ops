# fleet-ops#9365: a worker-group row proven unable to cache must sit at order 2.
# This row carries a valid false verdict with proof but no order key at all, so
# merge-key defaults (order 1 from an anchor) would leave it ahead of cache-true rows.
model_list:
- model_name: worker-capable
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: false
    cache_proof: "2026-10-07 probe: cached_tokens 0 of 7915 twice (https://github.com/Nishfleet/fleet-ops/issues/9365)"
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
