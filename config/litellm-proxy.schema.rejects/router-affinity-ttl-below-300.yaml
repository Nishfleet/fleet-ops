model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
router_settings:
  cooldown_time: 60
  redis_url: redis://127.0.0.1:6379
  # fleet-ops#9361: 299 s falls inside the 300 s gap window the hop metric
  # counts, so it could expire a healthy pin inside a hop the TTL is meant
  # to remove.
  deployment_affinity_ttl_seconds: 299
