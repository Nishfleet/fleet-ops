model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (fleet-ops#9361)."
router_settings:
  cooldown_time: 60
  # Fixture: redis_url beside the password key must be rejected (the password would be dropped).
  redis_url: redis://127.0.0.1:6379
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  # fleet-ops#9365/#9361: session_affinity is present, so this file fails on the
  # TTL bound it names.
  optional_pre_call_checks: ["prompt_caching", "session_affinity"]
  # fleet-ops#9361: 3600 s is the pinned default the stale-pin scatter was measured against.
  deployment_affinity_ttl_seconds: 600
