model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (fleet-ops#9469)."
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
  # The router-level policy names four exception types but not NotFoundError, so a
  # 404 falls back to the router-level allowed_fails (1) and the row needs TWO
  # 404s to park: a dead lane is picked again and leaks the 404 to the next
  # caller. fleet-ops#9469 requires the key, pinned to 0.
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
