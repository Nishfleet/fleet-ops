# fleet-ops#11146: a z.ai or StepFun row on the 900 s burst cool. Those providers' 429s are a quota wall with a fixed reset
# clock (the z.ai Coding Plan weekly limit, the StepFun prepaid balance), not a burst: with the row parked only on its
# second 429 it re-enters the wall every 900 s, which leaked 58.9% of worker-capable chat calls to the caller at
# 2026-10-30 02:28Z (19 of the 29 worker-capable rows walled). The row must park on its first 429
# (model_info.allowed_fails_policy.RateLimitErrorAllowedFails: 0) with cooldown_time 21600, so it re-probes about 4x/day.
# Built from the live config, so this file breaks only the rule named above.
