# fleet-ops#11146: a z.ai or StepFun row on the 900 s burst cool. Those providers' 429s are a quota wall with a fixed reset
# clock (the z.ai Coding Plan weekly limit, the StepFun prepaid balance, the Alibaba token cap), not a burst: with the router default of
# allowed_fails 1 the row needs a second 429 to park and re-enters the wall every 900 s, which leaked 58.9% of worker-capable chat calls to the caller at 2026-10-30 02:28Z (19 of the 29 worker-capable rows walled). The row must park on its first 429
# (model_info.allowed_fails_policy.RateLimitErrorAllowedFails: 0) with cooldown_time 21600, so it re-probes about 4x/day.
# The second row is the fleet-ops#11417 minimax variant: a spent MiniMax token plan re-entered by the burst cool leaked 179 of
# its 429s into the RouterStrongGroupFailing window on 2026-10-31.
# Built from the live config's first z.ai worker-capable row, which passes the schema alone, so this file breaks only the
# rule named above.
model_list:
- model_name: worker-capable
  litellm_params:
    model: openai/glm-5.3-flash
    api_base: https://api.z.ai/api/coding/paas/v4
    api_key: os.environ/ZAI_API_KEY
    tags: [prepaid, zai]
    order: 1
    weight: 1
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (#9365)."
    id: zai-glm53flash-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: worker-capable
  litellm_params:
    model: anthropic/MiniMax-M3.1-Flash-Preview
    api_base: https://api.minimax.io/anthropic
    api_key: os.environ/MINIMAX_API_KEY
    tags: [prepaid, minimax]
    order: 1
    weight: 1
    cooldown_time: 1800
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (#9365)."
    id: minimax-m31-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 3
router_settings:
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  cooldown_time: 60
