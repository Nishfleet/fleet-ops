# fleet-ops#9050: NotFoundErrorRetries above 1 spends more than one in-group attempt on a dead 404 lane before the park (NotFoundErrorAllowedFails: 0) can close the leak; refused.
model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: true
    cache_proof: 'fixture row: only the rule named in this file is under test (fleet-ops#9050).'
router_settings:
  cooldown_time: 60
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  optional_pre_call_checks:
  - prompt_caching
  - session_affinity
  deployment_affinity_ttl_seconds: 600
  allowed_fails_policy:
    NotFoundErrorAllowedFails: 0
  retry_policy:
    AuthenticationErrorRetries: 0
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
    NotFoundErrorRetries: 2
    DefaultRetries: 1
