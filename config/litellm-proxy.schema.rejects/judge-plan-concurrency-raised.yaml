# fleet-ops#9374: the same rule for the concurrency half of the plan (3 at
# once, no more). Only max_parallel_requests moves here, so a schema that
# relaxed that constant and left rpm alone still refuses this file.
model_list:
- model_name: judge
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    rpm: 3
    order: 1
    max_parallel_requests: 6
  model_info:
    id: alibaba-qwen38max-judge
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY
    order: 2
  model_info:
    id: opencodego-ds41flash-judge
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY_2
    order: 2
  model_info:
    id: opencodego2-ds41flash-judge
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60