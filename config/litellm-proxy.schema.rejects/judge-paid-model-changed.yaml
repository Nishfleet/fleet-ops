# fleet-ops#9374: the paid seat under a different model. Everything else is
# right: the order-1 rung, the Alibaba api_base, the plan's rpm 3 and
# concurrency 3. Only model moves, so this file is refused by the paid row's
# model pin alone - a quality claim about qwen3.8-max belongs in its own
# evidence, not in a silent edit to the judge seat.
model_list:
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    rpm: 3
    order: 1
    max_parallel_requests: 3
  model_info:
    id: alibaba-qwen38max-judge
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY
    order: 2
  model_info:
    id: opencodego-ds41flash-judge
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY_2
    order: 2
  model_info:
    id: opencodego2-ds41flash-judge
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
