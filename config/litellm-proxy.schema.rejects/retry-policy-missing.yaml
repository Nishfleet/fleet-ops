# fleet-ops#9375: retry_policy is a required key of router_settings. Without the
# block the Router falls back to the global `num_retries` (0 here) for every
# error class, and a single errant 429 spends the fallback group's cold re-send
# with nothing bounding it. Making it required means a config that loses the
# block fails the schema gate instead of silently widening the in-group budget.
# .github/workflows/ci.yml runs check-jsonschema over
# config/litellm-proxy.schema.rejects/*.yaml and requires every file to fail.
# check-jsonschema reports
#   router_settings: 'retry_policy' is a required property
# Like every rejects fixture this is a fragment, so it also trips the model_list
# judge-row `contains` rule; the missing-key error is the named error line, not
# the file's only error. Both required top-level keys (model_list,
# router_settings) are present, and router_settings keeps its own required
# redis_url.
model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (#9375)."
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
