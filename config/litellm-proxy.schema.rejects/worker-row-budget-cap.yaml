# fleet-ops#12083: a worker row with a deployment budget (max_budget + budget_duration) is
# refused. The budget filter benches a crossed row for the rest of its window (the reset runs
# only on a success event for that row), which idled the CommandCode plan ~24h a day and fired
# PaidPlanIdle. The undo below is the 10 USD/1d cap the CommandCode rows carried until
# 2026-11-17. Everything else in this file passes the schema alone, so the budget keys are the
# only change under test.
model_list:
- model_name: worker-capable
  litellm_params:
    model: openai/z-ai/glm-5.3-flash
    api_base: https://api.commandcode.ai/provider/v1
    api_key: os.environ/COMMANDCODE_API_KEY
    max_budget: 10.0
    budget_duration: 1d
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (#9365)."
router_settings:
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  deployment_affinity_ttl_seconds: 600
  optional_pre_call_checks:
  - session_affinity
  fallbacks:
  - worker-cheap:
    - worker-capable
  retry_policy:
    AuthenticationErrorRetries: 1
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
    NotFoundErrorRetries: 1
    DefaultRetries: 1
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 0
