# fleet-ops#9330: the desk aliases are pinned to the two worker groups a Pi job can
# pick, so an alias that renames another seat (or a group that does not exist) is a
# rejected config rather than a second name for a paid lane. The rejects loop only
# requires a nonzero exit, so other schema rules (the model_list counts) also fire here.
model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
    weight: 1
  model_info:
    supports_prompt_caching: true
    cache_proof: 'fixture row: only the rule named in this file is under test (fleet-ops#9330).'
router_settings:
  cooldown_time: 60
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  optional_pre_call_checks:
  - prompt_caching
  - session_affinity
  deployment_affinity_ttl_seconds: 600
  fallbacks: []
  allowed_fails_policy:
    NotFoundErrorAllowedFails: 0
  retry_policy:
    AuthenticationErrorRetries: 0
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
    NotFoundErrorRetries: 1
    DefaultRetries: 1
  model_group_alias:
    worker-capable-desk: worker-cheap
