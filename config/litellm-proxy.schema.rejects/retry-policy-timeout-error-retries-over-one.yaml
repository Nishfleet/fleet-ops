# fleet-ops#9375: TimeoutErrorRetries is capped at 1, the same cap that holds a
# mid-session failure inside the worker group for one attempt before the
# fallback group or Pi's own retry. A timeout is the most expensive error to
# re-send: the prompt is whole and cold, and the waiting caller has already
# spent its latency budget once. This fixture is CI's proof the cap is real:
# .github/workflows/ci.yml runs check-jsonschema over
# config/litellm-proxy.schema.rejects/*.yaml and requires every file to fail.
# check-jsonschema reports
#   $.router_settings.retry_policy.TimeoutErrorRetries: 2 is greater than the maximum of 1
# Like every rejects fixture this is a fragment, so it also trips the model_list
# judge-row `contains` rule; the cap is the named error line, not the file's
# only error. Both required top-level keys (model_list, router_settings) are
# present.
model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (#9375)."
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
  retry_policy:
    AuthenticationErrorRetries: 0
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
