model_list:
- model_name: worker-cheap
  litellm_params:
    model: openai/x
  model_info:
    supports_prompt_caching: true
    cache_proof: "fixture row: only the rule named in this file is under test (fleet-ops#9469)."
    # A row-level allowed_fails_policy resolves per exception type BEFORE the
    # router policy, so a row naming NotFoundErrorAllowedFails: 1 needs TWO 404s
    # to park and re-opens the leak the router-level 0 closes. If a row names
    # the key at all, it must be 0 (fleet-ops#9469, PR 9472 coordinator risk).
    allowed_fails_policy:
      NotFoundErrorAllowedFails: 1
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
  optional_pre_call_checks: ["prompt_caching", "session_affinity"]
  deployment_affinity_ttl_seconds: 600
  allowed_fails_policy:
    NotFoundErrorAllowedFails: 0
