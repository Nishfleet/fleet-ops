# fleet-ops#9375: the retry budget's AuthenticationErrorRetries back above 0, refused.
# CI's proof that the retry_policy bound is real: .github/workflows/ci.yml runs
# check-jsonschema over config/litellm-proxy.schema.rejects/*.yaml and requires
# every file to fail with the message named in the footer.
# The model_list below is the three real judge rows, so this fixture is valid in
# every other respect: weakening or deleting the retry cap turns this file green
# and the check red.
# A 401 can never recover on retry, so the cap is 0 and a value above it is refused.
model_list:
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY
    reasoning_effort: max
    extra_headers:
      x-opencode-session: fleet-judge
    tags:
    - prepaid
    - opencode-go
    order: 2
    max_parallel_requests: 2
    cooldown_time: 21600
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'fixture row: the three real judge rows, copied so the only rule under test here is the retry cap.'
    id: opencodego-ds41flash-judge
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 0
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY_2
    reasoning_effort: max
    extra_headers:
      x-opencode-session: fleet2-judge
    tags:
    - prepaid
    - opencode-go
    order: 2
    max_parallel_requests: 2
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'fixture row: the three real judge rows, copied so the only rule under test here is the retry cap.'
    id: opencodego2-ds41flash-judge
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: judge
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    tags:
    - prepaid
    - alibaba
    rpm: 3
    order: 1
    max_parallel_requests: 3
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: 'fixture row: the three real judge rows, copied so the only rule under test here is the retry cap.'
    id: alibaba-qwen38max-judge
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
  retry_policy:
    AuthenticationErrorRetries: 2
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
# expected check-jsonschema message:
#   $.router_settings.retry_policy.AuthenticationErrorRetries: 2 is greater than the maximum of 0