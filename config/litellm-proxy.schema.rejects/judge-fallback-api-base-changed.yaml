# fleet-ops#9374: a named fallback row pointed off OpenCode Go. The id, the key
# and the model are all right, so only api_base moves and this file is refused
# by the fallback api_base pin alone. It is the shape where a fallback quietly
# stops being a fallback: an OpenCode key billing a third provider, or an order-2
# row that can only fail.
model_list:
- model_name: judge
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    rpm: 3
    order: 1
    max_parallel_requests: 3
  model_info:
    id: alibaba-qwen38max-judge
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/OPENCODE_API_KEY
    order: 2
  model_info:
    id: opencodego-ds41flash-judge
- model_name: judge
  litellm_params:
    model: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_API_KEY_2
    order: 2
  model_info:
    id: opencodego2-ds41flash-judge
router_settings:
  redis_url: redis://127.0.0.1:6379
  cooldown_time: 60
