# Nish 2026-09-19: stock replacement for the deleted agent-worktree-janitor.sh (cron). Worktree dirs untouched for 3 days are removed by systemd-tmpfiles-clean.timer; git worktree prune drops the stale registrations on the next git op.
# 2026-09-22 (fleet-ops#4256): the default age-by abcmABM let atime veto every deletion — anything that scans/reads the root refreshed atime, so ~2900 stale packet/report files never aged out. bcmBCM keeps every other veto (btime, ctime, mtime) and ignores atime.
# 2026-10-10 (fleet-ops#9526): the orchestrate hand-off keeps one bare mirror per repo
# under .orch-mirror/ and reuses it for every run. A bare repo's HEAD file is written
# once and never touched again, so the 3-day rule deleted it, git stopped recognising
# the mirror as a repository and every hand-off died with "not a git repository".
# x leaves the path and everything under it out of the age-out; the worktrees beside
# it (orch-<repo>-<N>) still age out as before.
# 2026-11-01 (fleet-ops#10945): two ranges the first branch did not name, both
# verified against the real tool (tmpfiles.d(5) Age):
# - tmpfiles ages every entry, a file or a whole directory, on its own b/ctime/mtime
#   (age-by bcmBCM). A dir whose own stamps are 3 days old is removed whole, so a
#   run worktree whose top level saw no write in 3 days goes entirely. Fleet sessions
#   live minutes to about one day (dispatch walls), so anything 3 days old is already
#   landed or scrap per AGENTS.md; the reach in between: a worktree older than 3d
#   that kept top-level writes loses its own inside files that no one rewrote in
#   those days (its .git and package-lock among them) — recovery is worktree add
#   from origin, which is what the branches are there for.
# - the orchestrate hand-off parks a mirror with a damaged object store as
#   orch-damaged-<repo>-*.git to hold its local-only branches for repair. A bare
#   repo's stamp never refreshes, so the age-out would delete it exactly as it
#   deleted HEAD in #9526. The x line below spares those dirs.
x %h/workspaces/agent-worktrees/.orch-mirror
x %h/workspaces/agent-worktrees/orch-damaged-*
e %h/workspaces/agent-worktrees - - - bcmBCM:3d
