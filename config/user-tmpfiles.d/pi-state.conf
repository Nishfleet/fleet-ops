# Nish 2026-09-19, held back by the fleet-ops#10945 rework: the session and
# pi-issues age-out lines rode in agent-worktrees.conf, which no task installed,
# so they never ran. #10945 arms the worktree rule only; no issue assigns the
# deletion of ~/.pi/agent/sessions and ~/.local/state/pi-issues, so this file
# stays unreferenced until an issue delivers it with its own decision note.
e %h/.pi/agent/sessions - - - 7d
e %h/.local/state/pi-issues - - - 7d
