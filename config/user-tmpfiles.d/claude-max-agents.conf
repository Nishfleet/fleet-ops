# The Max config dir (~/.claude-max, Remote Control's CLAUDE_CONFIG_DIR since
# 2026-10-10) reads subagents from its own agents/ dir, so the helper and scout
# lanes that ~/.claude/agents holds were "not found" in every Remote Control
# session. One link, one set of agent files. Plain L never replaces a path that
# already exists, so a hand-made dir there is left alone and fleet-sync.service
# step 5b fails loud on it.
L %h/.claude-max/agents - - - - %h/.claude/agents
