---
listen_address: "127.0.0.1:9095"
verbose: true
commands:
  # Third cut 2026-09-22 (fleet-ops#8051, design docs/ARCHITECTURE.md): the
  # dispatcher is one vendor command and the singleflight is systemd's own
  # job merging. A `start` on a unit that is `activating`/`active` merges
  # into the running job, and alert-repair@.service is Type=oneshot with a
  # synchronous ExecStart — the unit stays `activating` for the whole repair,
  # so two webhooks for the same alertname can never run two repairs. That is
  # the 2026-09-13 twin-spawn hole the 581-line bin/am-executor-claim
  # flock+claim wrapper plugged; the job model closes it for free. The
  # pre-wrapper history: the 1,811-line libexec/alert-repair-dispatch
  # classified the alert, picked a seat, applied skip/park/dedupe rules and
  # then ran `pi --print` anyway; the classification and repair judgement now
  # live in prompts/alert-repair.md.
  #
  # The `sh -c` is required: args: is a fixed argv with no templating of
  # alert labels — the alert reaches the command only through AMX_LABEL_* /
  # AMX_GLABEL_* environment variables (the binary's own string table).
  # max: 1 stays as the in-process per-fingerprint cap layered underneath.
  #
  # ignore_resolved: a resolved-only payload never reaches the unit — the
  # repair prompt reads the live alert from Alertmanager's API itself, so a
  # resolved dispatch would only buy a session to learn nothing.
  #
  # The webhook payload is not piped: prompts/alert-repair.md reads the live
  # alert via $FLEET_ALERTNAME (the unit instance).
  - cmd: /bin/sh
    args: ["-c", 'exec systemctl --user start --no-block "alert-repair@${AMX_LABEL_alertname}.service"']
    max: 1
    ignore_resolved: true
    notify_on_failure: false
