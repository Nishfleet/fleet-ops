# Grok client version that Pi's xai-oauth provider (the pi-grok extension) sends
# to cli-chat-proxy.grok.com (fleet-ops#9219). pi-grok 0.10.1 sends 0.2.101 by
# default, and the proxy now answers 426 below 1.0.13. PI_XAI_CLIENT_VERSION is
# pi-grok's own override (models.ts). A models.json header does not win over it:
# tested 2026-10-04, still 426. 1.0.46 is the version https://x.ai/cli/stable
# published on 2026-10-04.
# Delete this file and the same line in the runner drop-in
# (rootfs/etc/systemd/system/actions.runner.Nishfleet.netcup-agent-.service.d/10-agent.conf)
# once pi-grok's own version lookup (0.11+) loads under Pi. Pi 1.0.0 and 1.0.2
# both fail it with "Cannot find module '@earendil-works/pi-ai'".
# fleet-sync.service installs this file into ~/.config/environment.d/, so every
# user unit and systemd-run transient gets it after the daemon-reload there.
PI_XAI_CLIENT_VERSION=1.0.46
