# User-level logrotate config for pi-packet watch.log (fleet-ops#3272).
# Bound the seat-selection audit log to 10 MB live + 5 compressed back copies.
/home/nish/.local/state/pi-packet/watch.log {
    size 10M
    rotate 5
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
