# User-level logrotate for pi-packet watch.log (fleet-ops#3128).
# Size-triggered: when watch.log reaches 10 MB it is rotated into
# watch.log.1, .2, ... up to 5 backups. copytruncate keeps the open fd
# writing to the same inode so the pi-packet writer never has to reopen.

/home/nish/.local/state/pi-packet/watch.log {
    size 10M
    rotate 5
    missingok
    notifempty
    copytruncate
    nocompress
}
