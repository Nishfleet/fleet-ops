router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    # every group has a terminal healthy route; worker-capable must not dead-end (fleet-ops#4404)
    - worker-cheap: [worker-capable, senior]
    - worker-capable: [senior]
    - senior: [worker-capable]
    - judge: [senior]
    - worker-private: [worker-capable]
  # fleet-ops#6732: live runs cooldown_time:60 / num_retries:0 /
  # RateLimitErrorRetries:0 since the 2026-09-14 retry-storm incident (a dead
  # nebius rung retried 3x per request flooded pareto and cooled every group).
  # Repo keeps the test-pinned #5811 values; the live divergence is deliberate
  # incident posture — re-converge it only with the incident closed out.
  cooldown_time: 300
  allowed_fails: 1
  num_retries: 2
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    AuthenticationErrorRetries: 2
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
general_settings:
  background_health_checks: true
  health_check_interval: 60
  database_url: postgresql://litellm@127.0.0.1:5432/litellm
  redis_url: redis://127.0.0.1:6379
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_prisma_schema_update: true
