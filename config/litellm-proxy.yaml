# four) so the fleet can use the quota. When the 5-hour or weekly limit is hit MiniMax answers 429: a row parks
# 1800 s on its 4th 429 inside that window (RateLimitErrorAllowedFails: 3, the cline-ds41flash shape, so a
# per-minute burst does not park it but a quota wall does) and is re-probed. A 402 or other billing error is not
