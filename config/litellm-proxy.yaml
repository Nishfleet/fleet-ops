- model_name: senior-backup
  # fleet-ops#9596, moved to Alibaba 2026-10-12: senior is one Pareto row, and a 429 "Insufficient credits" on it left the group with nowhere to go (evening audits 2026-10-11). Synthetic is cancelled (2026-10-01), so this row is now the Alibaba Token Plan qwen3.8-max seat, the same model, api_base and key as alibaba-qwen38max-judge below. It is its own group, not a second senior row, so router_settings.fallbacks can name it and the 429 is answered by another provider. It has no fallback of its own (no cycle with judge: senior). The model is a different family from Pareto's GLM, which is what a second reviewer needs; judge rows are Qwen/DeepSeek and already fell to GLM through senior before this change.
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    tags:
    - prepaid
    - alibaba
    - senior
    order: 1
    # rpm 3 and max_parallel_requests 3 are the plan's limits and are shared with alibaba-qwen38max-judge (same key): the plan is one 3-per-minute seat for both groups. About 320 req/day for senior plus judge together, so the shared 3/min is not the constraint; a burst past it is a provider 429 that cools this row.
    rpm: 3
    max_parallel_requests: 3
    # 60 s, not the 900 s of the judge row: this is the only row in its group, so a long park takes the whole senior fallback out. On 2026-10-12 a 502 parked the previous backup row 900 s and review-risky's retries found no senior deployment, so #9602 and #9588 got no second review.
    cooldown_time: 60
    # Same thinking budget as the judge row (fleet-ops#9405): without it qwen3.8-max spends the whole completion on reasoning and returns an empty body on a large diff.
    extra_body:
      enable_thinking: true
      thinking_budget: 2048
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-07 on compatible-mode, call 2 cached_tokens 7168 of 7967 (90%); the endpoint reports prompt_tokens_details.cached_tokens (same model, endpoint and key as alibaba-qwen38max-judge)."
    id: alibaba-qwen38max-senior-backup
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
