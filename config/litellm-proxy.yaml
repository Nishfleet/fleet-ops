# Approved models per provider (Nish 2026-09-28: models are provider specific; a row outside this list needs his yes; no benching).
# Nish 2026-09-30 free rows: CommandCode: stealth/space-bunny-alpha, stealth/pixel-canary, poolside/laguna-s-2.1-free, inclusionai/ling-3.0-flash-sante:free, inclusionai/ling-3.1-flash:free. Cline: poolside/laguna-s-2.1:free, inclusionai/ling-3.0-flash-sante:free. xkiro: stealth/pixel-canary:free, stealth/space-bunny-alpha:free, inclusionai/ling-3.0-flash-sante:free.
# MiniMax M3.1-Flash-Preview is free for every MiniMax Code subscriber until 2026-10-07 (Nish 2026-09-30); its four rows are tagged free until then.
# CommandCode, Cline, OpenCode Go, Ollama: deepseek-v4.1-flash. MiniMax: M3.1-Flash-Preview. StepFun: step-5-preview. Synthetic: GLM-5.3-Flash.
# xkiro: qwen3-coder-plus:free, qwen3.8-max:free. OpenCode zen: space-bunny-free, union-alpha. Cline: stealth/space-bunny-alpha.
# Cline stealth/union-alpha stopped being free 2026-09-30 (402 "Insufficient balance", 397 errors and 0 answers in 5 h). A 402 is neither retried nor cooled by LiteLLM v1.98.0 (no retry_policy key covers APIError; cooldown skips 4xx), so no setting below can move a job off such a row: its four rows are removed until Nish funds Cline credits. Cline's other rows stay. Any row that starts answering only 402 has to come out the same way.
# OpenRouter: stealth/space-bunny-alpha, nemotron-3-ultra, nemotron-3.5-lightning. Pareto: glm-5.3-flash, never in judge.
# Devin: SWE 2 only, through the devin CLI lane in agent.yml (no router route: 404 on every base).
model_list:
- model_name: worker-capable
  litellm_params:
    model: openai/deepseek/deepseek-v4.1-flash
    api_base: https://api.commandcode.ai/provider/v1
    api_key: os.environ/COMMANDCODE_API_KEY
    tags:
    - prepaid
    - commandcode
    order: 1
    max_parallel_requests: 4
    cooldown_time: 900
  model_info:
    mode: chat
    id: commandcode-ds41flash-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: worker-cheap
