router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks: ["prompt_caching"]
  # worker groups hold only rungs proven to return finish_reason=tool_calls (fleet-ops#7761); simple-shuffle ignores order:.
  fallbacks:
    - worker-cheap: [worker-capable]
    - worker-capable: [worker-cheap]
    - senior: [worker-capable]
    - judge: [senior]
  cooldown_time: 60
  # a failed request re-picks another row of the same group, then falls back to the next group (Nish 2026-09-28: no benching, a failed key is retried on later requests).
  num_retries: 2
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    AuthenticationErrorRetries: 2
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
general_settings:
  pass_through_endpoints:
    - path: "/jev"
      # TypeSafe direct (Nish 2026-09-28): the Vercel AI Gateway key is used ONLY when Nish says so.
      target: "https://api.typesafe.ai/v1/systemone"
      cost_per_request: 0.000015
      auth: true
      headers:
        Authorization: "Bearer os.environ/TYPESAFE_API_KEY"
  # real traffic is the probe: the background checks spent the same free quota and cooled rows themselves (Nish 2026-09-28).
  background_health_checks: false
  database_url: postgresql://litellm@127.0.0.1:5432/litellm
  redis_url: redis://127.0.0.1:6379
  master_key: os.environ/LITELLM_MASTER_KEY
  # without this, startup prisma migrate deploy stalls every restart.
  disable_prisma_schema_update: true
