    api_base: https://api.synthetic.new/openai/v1
    api_key: os.environ/SYNTHETIC_API_KEY
    tags:
    - prepaid
    order: 1
    weight: 1
    # Nish 2026-10-04: more lanes. Re-probe 23:20 IST: 12 parallel GLM-5.3-Flash calls gave 8x200 and 4x429 "Too many concurrent requests"
    # (the 2026-09-19 limit of 1 per model is gone). The 500 requests / 5 h pool showed 0 used, the weekly $24 token credit 99% left,
    # and the one row got 16 calls in 24 h. 7 rows x 1 = 7 concurrent, under the measured 8; senior-backup (fleet-ops#9596) is the 8th slot. The 500 / 5 h pool is the real wall:
    # a pool 429 cools a row 15 min, and the rolling window refills by itself.
    max_parallel_requests: 1
    cooldown_time: 900
