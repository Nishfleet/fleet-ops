# Alibaba Token Plan: Qwen answers Hermes chat and judge calls (alias below), never a worker group (fleet-ops#10608); prepaid, so no max_budget.
- model_name: assistant
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    tags:
    - prepaid
    - alibaba
    # qwen3.8-max reasons until the budget caps it; DashScope reads that budget only through extra_body (fleet-ops#9405).
    extra_body:
      enable_thinking: true
      thinking_budget: 2048
    # The row owns the thinking budget, so a caller's reasoning_effort is dropped here (fleet-ops#10109).
    additional_drop_params:
    - reasoning_effort
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-07 on compatible-mode, call 2 cached_tokens 7168 of 7967 (90%); the endpoint reports prompt_tokens_details.cached_tokens."
    id: alibaba-qwen38max-assistant
