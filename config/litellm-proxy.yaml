# stays modest. cache_proof is the same seat's proven probe (same model+key+budget).
# order: 1 on both DeepSeek V4.1 Flash rows of this seat, so the new row is a peer
# of the proven lane in the shuffle, not a fallback.
#
# No max_budget on the new row. This head's budget decision, in one line: the
# seat's allowance stays $10/day.
#
# Why. LiteLLM enforces max_budget per deployment, so a budget is per-lane
# allowance, not a copy of the neighbouring lane's. Adding $10/day to this row
# would have taken the seat from $10/day to $20/day against a single prepaid
# wallet, and splitting $10 over the two lanes (each $5) lowers the existing
# lane, which #9378 forbids. So the new row carries no wall, like the three
# budget-less rows already on this key, and the wallet plus the ppi-cline 429
# alert are the guard for it.
