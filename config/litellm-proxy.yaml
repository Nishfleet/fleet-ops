# is the lifetime cap: both rows together stop routing at 19 USD of the 20 USD balance). A 402 quota_exceeded is neither
# retried nor cooled by v1.98.0, so these caps must trip first. The key also has a 6 USD/day cap at Straitly that LiteLLM
