# synthetic GLM-5.3-Flash (api.synthetic.new) benched 2026-09-13 (429 subscription
# rate limits, all 4 deployments) and RESTORED 2026-09-14 (fleet-ops#6732): 6x
# direct-probe HTTP 200 08:15-08:25Z; back in model_list at its pre-#6193
# placements (worker-cheap/worker-capable order:1, senior/worker-private order:2).
# #6133 (2026-09-13): the usable devin seats sat benched here until a wire
# existed — every candidate api_base 404'd, inference is devin-CLI-only.
# RESOLVED 2026-09-14 by fleet-ops#6228: the CustomLLM bridge below routes
# devin/glm-5-2 + devin/swe-2-max through `devin --print`; the seats are
# back in model_list above at order:2 (failover tier).
router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    # every group has a terminal healthy route; worker-capable must not dead-end (fleet-ops#4404)
    - worker-cheap: [worker-capable, senior]
    - worker-capable: [senior]
    - senior: [worker-capable]
    - judge: [senior]
    - worker-private: [worker-capable]
  cooldown_time: 60
  allowed_fails: 1
  num_retries: 0
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    AuthenticationErrorRetries: 2
    RateLimitErrorRetries: 0
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
  # fleet-ops#6228: Devin/Windsurf seats have no OpenAI-compatible endpoint
  # (#4263); this CustomLLM handler bridges chat completions to the headless
  # `devin --print` CLI. LiteLLM 1.98 resolves the module relative to THIS
  # config file, so the deployed copy sits next to it at
  # ~/.config/fleet-ops/fleet_devin_adapter.py (MANIFEST-installed, repo
  # source libexec/fleet-litellm-devin-adapter/fleet_devin_adapter.py).
  custom_provider_map:
  - provider: devin
    custom_handler: fleet_devin_adapter.devin_windsurf_llm
general_settings:
  background_health_checks: true
  health_check_interval: 60
  database_url: postgresql://litellm@127.0.0.1:5432/litellm
  redis_url: redis://127.0.0.1:6379
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_prisma_schema_update: true
