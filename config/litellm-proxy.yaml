# fleet-ops#6054 (2026-09-12): benched = NOT routed, NOT in model_list, and NOT
# counted by the health canary's fleet_litellm_model_list_expected (only
# "- model_name:" lines count). Inert to the loader: ProxyConfig reads known
# keys via .get(), so this top-level key never reaches the router. Restore a
# deployment ONLY with a green /health probe cited in the PR — while any
# DEPLOYED census entry is unhealthy the health canary fails loud
# (health-deployment-unhealthy; #5792 accept-line drill).
benched:
- benched_at: 2026-09-12
  reason: "openai/deepseek/deepseek-v4-pro @ https://api.xkiro.com/v1 — 503 ServiceUnavailable 'A server error occurred' on /health and by direct probe by 15:47Z; dead-credit, fleet-ops#3284. #5811 wired it 06:15Z as the free rung of senior/judge (tags +senior/+judge, order:1) and worker-capable/worker-cheap (order:2); /health went unhealthy_count=4."
  was: [senior, judge, worker-capable, worker-cheap]
  litellm_params:
    model: openai/deepseek/deepseek-v4-pro
    api_base: https://api.xkiro.com/v1
    api_key: os.environ/XKIRO_API_KEY
    tags:
    - free
    order: 2
    max_parallel_requests: 1
router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    # every group has a terminal healthy route; worker-capable must not dead-end (fleet-ops#4404)
    - worker-cheap: [worker-capable, senior]
    - worker-capable: [senior]
    - senior: [worker-capable]
    - judge: [senior]
    - worker-private: [worker-capable]
  cooldown_time: 300
  allowed_fails: 1
  num_retries: 2
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    AuthenticationErrorRetries: 2
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
general_settings:
  background_health_checks: true
  health_check_interval: 60
  database_url: postgresql://litellm@127.0.0.1:5432/litellm
  redis_url: redis://127.0.0.1:6379
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_prisma_schema_update: true
