# fleet-ops#9469: a 404 lane is taken out of rotation on the FIRST 404. LiteLLM v1.98.0's
# _is_cooldown_required accepts 404, but the threshold is resolved PER EXCEPTION TYPE
# (Router.get_allowed_fails_from_policy), and a key the policy does not name falls back to
# the router-level allowed_fails (1) - two 404s - so the dead lane is picked again and
# leaks a 404 to a caller. router_settings.allowed_fails_policy now carries
# NotFoundErrorAllowedFails: 0, so the first 404 parks the row and the job falls through to
# the next lane in the group (order filtering is applied after the cooldown filter, so the
# job reaches a peer row in the same group, or the worker-group fallbacks when none is
# left; no order-2 worker row remains after fleet-ops#9711). Measured on
# ghcr.io/berriai/litellm:v1.98.0 in tests/test_router_404_fallthrough.py: one 404 parks the
# row and the call still returns 200 on the next row; with the key at 1 the dead lane is
# picked twice.
#
# The per-exception resolution is also what makes one router-level key reach every row:
# _should_cooldown_based_on_deployment_policy reads the row's own policy first and, for an
# exception type that policy does not name, defers to the router-level policy. All 64 rows
# below carry a deployment-level allowed_fails_policy and none of them names NotFoundError,
# so the fix is one key, not 64.
#
# Measured consequence, stated because it is a real trade: the cooldown a 404 applies is the
# ROW's own cooldown_time, not the router-level 60 s. A 404 on one of the 7 rows parked
# 21600 s for a named quota wall keeps that row out of rotation for 6 h. The row is not
# removed: it stays in the router, comes back when the cooldown expires and re-probes
# itself (proven in the same test file), so a restored model or a reset quota is picked up
# within hours. The alternative - two 404s before the park - is the bug. A 404 is a
# withdrawn free model or a dead model id, which is exactly what should park a row; there
# is no per-exception-type cooldown_time in v1.98.0 (AllowedFailsPolicy has 9 fields, none
# of them a duration), so the row's own cooldown_time is the only knob.
#
# Background health checks stay off: they spend the same free quota (Nish 2026-09-28) and
# would probe every paid row.
# OpenCode zen union-alpha answered 0 of 68 calls in the last 7 days (last attempt 2026-09-30 16:30 UTC, LiteLLM_SpendLogs); a direct probe on 2026-10-01 returns 400 "Upstream request failed: Model is unavailable." That 400 maps to BadRequestError, which v1.98.0 never cools, so no setting below can move a job off such a row: its four rows are removed. The opencodego-ds41flash rows on the Go endpoint (same key) stay: they are walled by a monthly quota (429 GoUsageLimitError, limitName monthly), not dead. A 900 s cool re-failed into worker groups every 15 min (0 of 68 calls in the 24 h to 2026-10-02 19:05 UTC). Those three rows now cool 21600 s and park on the first 429 (RateLimitErrorAllowedFails: 0), the same treatment #9075 gave the daily-quota rows (fleet-ops#9122). The opencodego2 rows on the second key stay at 900 s.
# Pareto: glm-5.3-flash, never in judge.
# Devin: SWE 2 only, through the devin CLI lane in agent.yml (no router route: 404 on every base).
# Cline/Pareto "You've reached today's free-model token quota" 429s are a day-long wall, not a transient (fleet-ops#9075, 2026-10-02): a 900 s cool re-failed into worker groups every ~15 min - 13 of 60 probe calls at 09:53 UTC, ~14 quota-429s reached workers in 24 h. Quota-dominated rows now cool 21600 s, a quarter-day park that re-probes ~4x/day so a quota reset is picked up within hours. The cline :free rows (cline-lagunas21, 2 rows) park on the first 429 (RateLimitErrorAllowedFails: 0; LiteLLM resolves the field via `is not None`, so 0 means immediate). Prepaid cline-ds41flash mixes the daily wall with per-minute bursts, and LiteLLM's fail counter TTL is the row's own cooldown_time (21600 s), so RateLimitErrorAllowedFails: 3 parks it on the 4th 429 inside any 6 h window - a per-minute burst rarely totals 4 in 6 h, while a quota wall 429s every call and reaches 4 quickly. pareto now cools 21600 s too (fleet-ops#9876): its 429s are a depleted prepaid balance, not a transient - at or above max_tokens 40960 the provider returns budget_error/credit_insufficient ("Insufficient credits for this request. Reduce max_tokens.") while the affordable ceiling drifts down as the balance drains, and direct probes found no parallel-key cap (fleet-ops#8458's 3-parallel explanation did not reproduce: 4 parallel small requests all returned 200). It parks on the first 429 (RateLimitErrorAllowedFails: 0), so a drained lane costs callers nothing: 0 caller-facing 429s in the 24 h to 2026-10-17 while worker-capable fell back to worker-cheap. Cline and Pareto answer only stream:true upstream (fleet-ops#8923) and LiteLLM v1.98.0 cannot force a stream a caller did not ask for (the request's stream flag always overrides litellm_params; LiteLLM_Params has no stream field), so a non-streaming caller still 400/500s on those rows - every fleet caller (Pi) streams.
# Nish 2026-10-02: removing or benching any provider, model or row needs his explicit yes first. Provider quotas refresh hourly, daily, weekly or monthly, so a quota or limit error never justifies it. When a provider has ended a model, open an issue labelled needs-nish-decision with the evidence: the 8am and 8pm digests ask him again every day until he answers. The removals recorded above each had his yes.
# Selection share (weighted; the Command Code rows removed 2026-10-15 are listed in the record above): Nish 2026-10-13, "OC has 2 keys, and both are unlimited usage along with cc but only on ds4.1 flash". Command Code left DeepSeek on 2026-10-15 (#9744), so the 2 OpenCode Go ds41flash rows in each worker group (opencodego-, opencodego2-) carry a litellm_params weight and every other worker row carries weight 1, the Command Code GLM-5.3-Flash rows included. v1.98.0 simple-shuffle (litellm/router_strategy/simple_shuffle.py:43-59) weights the pick only when the FIRST healthy row has a weight and reads a missing weight as 0, so every worker row must carry one (the schema requires an integer >= 1). Share = k*w/(k*w + n-k) for k preferred rows among n: worker-capable k=2, n=31, w=10 gives 20/49 = 40.8% (was 20/59 = 33.9% at n=41 before the 10 Ollama rows left on 2026-10-22, and 40/79 = 50.6% with the 4 DS rows); worker-cheap k=2, n=13, w=3 gives 6/17 = 35.3% (was 12/23 = 52.2%). The weights are unchanged; the share moves only with n (it rose from 33.9% to 40.8% when the 10 Ollama rows left). Per pick with every row healthy; a parked row leaves the draw, so the preferred share rises, and a session keeps its first row (session_affinity). Adding or removing a worker row changes n: redo the sum (tests/test_router_weights.py fails when a group's share leaves 30-60%).
