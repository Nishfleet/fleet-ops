# about 101 s end to end on this host, with a 30 s drain of in-flight calls. POST /model/block cannot do this: it answers
# HTTP 400 "Model updates only supported for DB-stored models" for a config-file row.
- model_name: worker-capable
  litellm_params:
    model: openai/z-ai/glm-5.3-flash
    api_base: https://api.commandcode.ai/provider/v1
    api_key: os.environ/COMMANDCODE_API_KEY
    tags:
    - prepaid
    - commandcode
    order: 1
    weight: 1
    input_cost_per_token: 3e-07
    cache_read_input_token_cost: 6e-09
    output_cost_per_token: 1.2e-06
    max_budget: 10.0
    budget_duration: 1d
    max_parallel_requests: 4
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-15 on api.commandcode.ai z-ai/glm-5.3-flash, 3 calls on a 19287-token prefix, cached_tokens 0/19264/19264 (fleet-ops#9744)."
