# Alibaba Model Studio Token Plan (Personal Standard, SG, $18/mo, 45,000 credits per 30-day month, no weekly cap,
# unused credits do not roll over - Nish from the console 2026-10-04, #9220), re-wired 2026-10-04 with a fresh key
# (fleet-ops#9220). fleet-ops#9374 (2026-10-07) made this row the judge PRIMARY (order 1) and put the two OpenCode
# Go judge rows on order 2: the plan is paid for and idle (22 of 1054 judge calls in 14 days) while the OpenCode
# Go rows carried the builder family, which memory grader-never-builder-family forbids for the grader. 14 days of
# LiteLLM_SpendLogs to 2026-10-07: peak 3 judge calls in flight at once, mean 1.05, so the plan's 3-4 concurrent
# covers the traffic; rpm and max_parallel_requests stay 3 and were not raised. v1.98.0 does not read either value
# on the request path (no enable_max_parallel_requests_limit, no rpm limiter), so a burst past 3/min is not queued
# here: it passes to the provider, and a 429 cools this row for cooldown_time (900s) while the order-2 pair answers.
# Nish 2026-09-08 (#4445): "only use qwen 3.8 max as another judge / orchestrator on the roster.
# this token plan isn't for use with other models." The 09-08 seat never shipped that judge timer and its rows
# went away in #7666, #8515 and #8521, so this row has no worker rung: one judge row, the only rung that can
# call this seat for a worker. The plan allows 3-4 concurrent, so rpm and max_parallel_requests are both 3 (#9220), which leaves
# the other two judge rows room. Prepaid, so there is no max_budget wall: the monthly credit allowance is the cap.
- model_name: judge
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    tags:
    - prepaid
    - alibaba
    rpm: 3
    order: 1
    max_parallel_requests: 3
    cooldown_time: 900
    # fleet-ops#9405: qwen3.8-max reasons before it answers. With no thinking
    # budget the model spent the whole completion on reasoning and returned an
    # empty body on a 40 KB diff (completion_tokens pinned to the cap: 8192,
    # 14449, 28888, 43470; content 0 bytes; the 2026-10-07 `pi --model judge`
    # call stopped at its 8192-token cap with empty stdout). The DashScope
    # compatible-mode endpoint that this row pins takes enable_thinking and
    # thinking_budget; LiteLLM's openai-compatible path only forwards those
    # through extra_body (utils.py + openai_like/chat/handler.py), so they
    # live here, not as sibling keys and not as pi samplingParams. The
    # schema pins extra_body on this row (config/litellm-proxy.schema.json).
    # This row is model_name: judge only (Nish #4445: Token Plan is
    # judge/orchestrator, no worker rung; senior-backup below reuses this
    # seat with the same budget). 2048
    # caps the reasoning and the row answers in about 50 s with a verdict
    # (proof on the #9393 diff in #9405). A larger diff that still returns
    # empty content after 2048 is a seat failure for the retry ladder, not
    # a reason to widen the budget here. max_tokens is respected once the
    # budget is bounded, so no max_completion_tokens change is needed, and
    # the two order-2 deepseek-v4.1-flash rows keep their reasoning_effort
    # and already return text.
    extra_body:
      enable_thinking: true
      thinking_budget: 2048
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-07 on compatible-mode, call 2 cached_tokens 7168 of 7967 (90%); the endpoint reports prompt_tokens_details.cached_tokens. Judge group: one-shot calls only, order unchanged."
    id: alibaba-qwen38max-judge
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
router_settings:
  routing_strategy: simple-shuffle
  # One task = one model (Nish 2026-10-01, fleet-ops#9015). Pi sends x-litellm-session-id=$FLEET_TASK_ID
  # (config/pi-models.json; Pi refuses to call without it), and session_affinity pins that id to the
  # first row picked in each group until it has been idle for deployment_affinity_ttl_seconds (600 s, see below).
  optional_pre_call_checks: ["prompt_caching", "session_affinity"]
  # The pin store. Without this the Router keeps pins in each worker process's own memory, and the proxy
  # runs --num_workers 2, so a session flips between 2 rows with no failure (fleet-ops#9015: 6,188 of 6,473
  # worker-row switches from 2026-10-02 19:30 to 2026-10-04 15:45 UTC followed a success). general_settings
  # has no redis_url key in v1.98.0 (proxy_server never reads it), so the Redis below sat empty (dbsize 0).
  # Cooldowns and usage counters now share it too, as fleet-ops#4174 P1 intended.
  redis_url: redis://127.0.0.1:6379
  # The pin survives only while its row keeps being picked: the claim script refreshes the TTL when
  # the stored row equals the row just chosen, and a row in cooldown makes async_filter_deployments
  # return the whole group unfiltered. So a pin that lands on a row then hits a quota wall (a daily free-model token quota,
  # as the since-removed free-model hosts hit) is never refreshed and holds the
  # session to a dead row for the full TTL, while every call re-shuffles the group. That scatter was
  # 17.1% of non-first calls (16,673 of 97,326, 2026-10-02 to 10-07 07:55 UTC) and cost 90.4M
  # already-cached tokens in 5.6 days (fleet-ops#9361). 600 s is the tested value: the p99 gap between
  # consecutive calls in one session is 214 s and 99.7% of gaps are under 600 s, so a live session keeps
  # its pin, and a pin on a dead row is dropped after 10 minutes instead of 60. The floor of 300 s (held
  # in the schema) is the gap window the hop metric counts: a shorter TTL could expire a healthy pin inside
  # a hop the metric would count, manufacturing the hops this value exists to remove.
  # INTERIM ONLY (Nish 2026-10-07, fleet-ops#9361 scope change): this TTL caps the blast radius of a
  # stale pin. It is not the fix. LiteLLM has no stock re-pin in the pinned image (v1.98.0) nor in the
  # newest release: deployment_affinity_check.claim_affinity_pin takes eligible_values upstream, but only
  # the complexity router passes it, so a fallback row never takes the pin. The fix is the upstream issue
  # BerriAI/litellm#45145 (repro: first-writer-wins _claim_pin refreshes only when the row it names is
  # re-selected, so a pin held by a row in cooldown can never move) plus its PR and a second image bump,
  # tracked as fleet-ops#9411, until which the TTL above and the session-hop Grafana alert
  # (config/grafana/provisioning/alerting/session-hop.yaml) bound the damage.
  deployment_affinity_ttl_seconds: 600
  # worker groups hold only rungs proven to return finish_reason=tool_calls (fleet-ops#7761); every worker row is
  # order 1 because a worker group is a peer set, not a preference order. The judge group is the exception
  # (fleet-ops#9374): order 1 alibaba-qwen38max-judge, order 2 the two OpenCode Go judge rows. The stale note here
  # ("simple-shuffle ignores order") was wrong for v1.98.0 - the order filter runs for every routing strategy,
  # after the cooldown filter. config/litellm-proxy.schema.json pins the layout - the seat, key and
  # plan limits of the order-1 row, and the model, api_base, key and order of each named fallback -
  # and its rejects/ cases hold one case per shape it must refuse.
  # Worker groups fall back to each other (fleet-ops#9015 finish line: "unless that model fails, then fall back").
  # 24h to 2026-10-02 19:05 UTC: 313 of 11,144 worker calls failed at the caller, and 1,345 of the journal's
  # errors were "JSON error injected into SSE stream" (space-bunny-alpha on the since-removed hosts, 38-92%
  # failing) that raised MidStreamFallbackError and found "No fallback model group". v1.98.0 never cools an
  # APIConnectionError (cooldown_handlers._is_cooldown_required ignores that string) and only runs a
  # mid-stream fallback before any content was generated, so this switch never splices two models into one
  # answer. A failed run still escalates once, at task level, to the senior Cursor lane (agent.yml first
  # strike adds strong-only). senior's one fallback, senior-backup, is qwen3.8-max on the Alibaba Token Plan (fleet-ops#9596, moved off the cancelled Synthetic 2026-10-12), so a Pareto 429, credit wall or busy slot moves to another provider. A judge call that falls to senior still reaches senior-backup: v1.98.0 run_async_fallback re-enters async_function_with_fallbacks with fallback_depth+1 (router_utils/fallback_event_handlers.py:366-372). senior-backup has no fallback, so judge -> senior -> senior-backup ends there and cannot cycle.
  fallbacks:
    - judge: [senior]
    - senior: [senior-backup]
    - worker-capable: [worker-cheap]
    - worker-cheap: [worker-capable]
  cooldown_time: 60
  allowed_fails: 1
  # a same-group retry re-hits the same wall; fallbacks fire on the first failure (fleet-ops#5792).
  num_retries: 0
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    # fleet-ops#9375: cut the in-router retry budget so a mid-session failure spends at most one attempt inside the worker group before the fallback group answers or the call reaches Pi's own retry. Pi keeps x-litellm-session-id, and the session pin is first-writer-wins, so a pinned seat that recovers is re-picked on the next call. Drilled on litellm 1.98.0 with a pinned seat whose first attempt 429s: shipped (2/2/2) made 4 upstream picks [seat-a, seat-a, seat-c, seat-b]; proposed (0/1/1) makes 3 [seat-a, seat-a, seat-b], where the retry lands back on the row that failed. When the 429 clears on that second call, proposed spends 2 picks on seat-a alone and no fallback fires, where a zeroed budget would kick the call to the fallback seat. The schema bounds this block and tests/test_router_retry_policy_no_cross_seat.py locks it.
    # 0 for 401: a bad key can never recover on retry. 1 for 429 bounds the in-group attempts to one, and litellm 1.98.0 sends that retry back to the row that just failed, so a briefly-limited pinned seat is not kicked to another seat. That holds for rows under the router-level allowed_fails of 1 (measured that way). A row that parks on its first 429 (RateLimitErrorAllowedFails 0) is already cooling when the retry runs, so its retry goes to a peer (drilled: [seat-a, seat-c, fallback] by test_a_row_that_parks_on_its_first_429_retries_a_peer_not_itself): still one extra in-group pick at most, but not a same-row retry. 2 worker-capable, 1 worker-cheap and 1 judge row are in that class. The retry is instant - Router._time_to_sleep_before_retry returns 0 while the group still has a healthy row - so the backoff itself stays in Pi's own retry, not here.
    # Note: litellm 1.98.0's get_num_retries_from_retry_policy has no InternalServerError branch, so InternalServerErrorRetries resolves to None (num_retries 0 -> one attempt) until litellm adds the handler; 1 is the intended forward value and the test asserts the current inert behavior. The shipped 2 was inert too, so a 500 got no in-group retry before this change and gets none after: it still goes straight to the fallback group, and this change does not touch the 500 half of fleet-ops#9375.
    AuthenticationErrorRetries: 0
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    # 400 only (a separate fix from the 402 removal above): LiteLLM never cools a 400, so a row whose model is gone upstream stays in the shuffle (zen union-alpha "Model is unavailable", stalled drive for an hour on 2026-09-30; its rows are removed, so this guards against any future dead-model 400). 1 retry = 2 picks. The retry re-shuffles and does not exclude the failed row, so escape is by odds: a dead row's share of its group decides - tiny in the many-row worker groups, but all of senior's single remaining row, where 2 picks cannot escape. ContentPolicyViolation is matched first and stays 0; a context-window 400 is retried too, which costs one fast failure.
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    # fleet-ops#9007: a withdrawn model answers 400 (BadRequestError) and a spent
    # credit line answers 402 (APIError). _is_cooldown_required (pinned v1.98.0,
    # unchanged through released v1.103.1) cools only 401/404/408/429, and no
    # router-level value here can change that. The stock override is per
    # deployment: model_info.allowed_fails_policy naming the exact exception
    # type (cooldown_handlers._has_explicit_allowed_fails_policy_for_exception)
    # makes _should_run_cooldown_logic accept the 4xx. Every row opts in below
    # with BadRequestErrorAllowedFails: 1 - 2 bad answers in one worker cool the
    # row for its cooldown_time, and it comes back when it answers 200. It also
    # matches ContextWindowExceededError (a BadRequestError subclass), but the
    # journal shows the real 400 traffic is dead models: 1239 x 400 in 24h,
    # 0 context overflows. A 402 maps to litellm.APIError, which is NOT in the
    # policy's nameable exception fields, so no config value can cool it -
    # agent.yml's Router wall treats a run killed by one as infra instead.
    AuthenticationErrorAllowedFails: 0
    # one 429 cools the deployment: Pareto's 3-parallel cap is already held by max_parallel_requests.
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
    # fleet-ops#9469: a 404 is a withdrawn free model ("This model is unavailable for free")
    # or a model id that no longer exists. _is_cooldown_required accepts 404, but with this
    # key unset the router-level allowed_fails (1) needs two 404s before the lane parks, so a
    # dead lane leaks a 404 to every other caller. 0 parks it on the first one; it comes back
    # after its cooldown_time and re-probes. The failed call itself still raises NotFoundError
    # (should_retry_this_error hard-raises), and the group's own order-2 row takes the job.
    NotFoundErrorAllowedFails: 0
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
general_settings:
  pass_through_endpoints:
    - path: "/jev"
      # Vercel AI Gateway (Nish 2026-10-04 "vercel"): TypeSafe direct ran out of credits.
      target: "https://ai-gateway.vercel.sh/v4/ai/evaluation-model"
      cost_per_request: 0.000015
      auth: true
      headers:
        Authorization: "Bearer os.environ/VERCEL_AI_GATEWAY_JEV_KEY"
        ai-model-id: "typesafe-ai/jev"
        ai-evaluation-model-specification-version: "4"
        ai-gateway-protocol-version: "0.0.1"
        ai-gateway-auth-method: "api-key"
  # real traffic is the probe: the background checks spent the same free quota and cooled rows themselves (Nish 2026-09-28).
  background_health_checks: false
  database_url: postgresql://litellm@127.0.0.1:5432/litellm
  master_key: os.environ/LITELLM_MASTER_KEY
  # without this, startup prisma migrate deploy stalls every restart.
  disable_prisma_schema_update: true
