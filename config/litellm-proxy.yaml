# anthropic answers in the tether group only (fleet-ops#9980; Nishfleet/tether#7).
# Long notes for this file: docs/litellm-router-notes.md
model_list:
- model_name: worker-capable
  # z.ai Coding Plan slot (fleet-ops#10566, #10608).
  litellm_params:
    model: openai/glm-5.3-flash
    api_base: https://api.z.ai/api/coding/paas/v4
    api_key: os.environ/ZAI_API_KEY
    tags:
    - prepaid
    - zai
    order: 1
    weight: 1
    # z.ai Coding Plan: no slot count, the plan's own 429 cools the row and it re-probes itself (fleet-ops#10694).
    # 6 h park on the first 429: the z.ai 429 is a weekly quota with a fixed reset (fleet-ops#11146).
    cooldown_time: 21600
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Z.AI caches automatically and reports cached_tokens (https://docs.z.ai/guides/capabilities/cache); 202 of 302 non-Pi callers show cached_tokens>0 (10048 of 10124 on 2026-10-03) while Pi's streamed replies carry no prompt_tokens_details (0 of 7652): LiteLLM v1.98.0 drops it (#9357). Direct probe blocked by the 429 code 1310 weekly limit until 2026-10-09."
    id: zai-glm53flashi-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 0
