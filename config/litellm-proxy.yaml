router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    # every group has a terminal healthy route; worker-capable must not dead-end (fleet-ops#4404)
    #
    # 2026-09-18 (fleet-ops#7761) — STANDING RULE, not just today's bench list:
    # a worker group (worker-cheap / worker-capable) may contain ONLY deployments
    # that have been proven to return `finish_reason=tool_calls`. The proof case
    # was the `devin/swe-2-max` CustomLLM bridge (itself retired by the #7907
    # no-glue sweep): `devin --print` is an agent-in-a-box that returns final
    # prose, never a tool_calls response, and as a worker fallback it produced
    # the 2026-09-18 outage — every pi-issue@ worker from ~16:30Z scored
    # PACKET-VERDICT tools=0 and exited 0 while 100+ agent-ready issues sat
    # untouched. Re-proven 2026-09-21: openrouter nemotron-3-ultra-550b-a55b:free
    # returned the tool call as text content (tool_calls: null) on 5/5
    # tool_choice=required probes through the live router — re-benched below.
    # Note `order:` does NOT protect against this: routing_strategy is
    # simple-shuffle, which ignores it (devin took 667 of 1835 worker-cheap calls
    # from a lower-priority order). A non-tool-calling deployment has to be ABSENT
    # from the group, not merely demoted.
    # #4404 still holds: the two worker groups fall back to each other and both
    # carry a proven tool-calling rung. If both are down the call errors LOUDLY,
    # which beats a silent no-op that exits 0.
    - worker-cheap: [worker-capable]
    - worker-capable: [worker-cheap]
    # senior/judge/worker-private consume prose (review, adjudication), not tool
    # calls, so a prose-only rung is legal there — though today every group's
    # only rung is pareto glm-5.3-flash (the #7862 roster collapse).
    - senior: [worker-capable]
    - judge: [senior]
    - worker-private: [worker-capable]
  # fleet-ops#6732 (CLOSED 2026-09-14): cooldown_time:60 / num_retries:0 /
  # RateLimitErrorRetries:0 is the standing posture, not an incident band. The
  # 2026-09-14 retry-storm showed why: a dead rung retried 3x per request
  # flooded the next rung and cooled every group, and the 300/2/2 drift
  # re-measured it — 588 RouterRateLimitError rejections in 88 min on
  # 2026-09-20. Converged into the repo 2026-09-21 (fleet-ops#5792): with one
  # upstream per group a same-group retry can only re-hit the same wall, and
  # failover lives in `fallbacks`, which still fire on the first failure.
  # If groups regain multiple healthy upstreams, num_retries>=2 becomes
  # meaningful again (the #5792 router-policy spec).
  cooldown_time: 60
  allowed_fails: 1
  num_retries: 0
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    AuthenticationErrorRetries: 2
    RateLimitErrorRetries: 0
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
general_settings:
  # Jev (typesafe-ai/jev) as a pass-through endpoint — glue sweep 2026-09-18.
  #
  # Replaces bin/jev-eval.mjs + bin/jev-eval + ~/.local/lib/jev-eval: a Node
  # helper with its own SDK install, its own key read, its own JSONL spend
  # ledger and its own hand-rolled $1 cap. Jev's gateway endpoint is a plain
  # JSON POST, so the proxy can forward it and the proxy's OWN budget engine
  # does the cap — the same engine that caps every model seat.
  #
  # auth: true means a caller must present a LiteLLM virtual key. The key
  # `jev-eval` carries max_budget 1.0 USD / budget_duration 1mo, so LiteLLM
  # refuses the call itself once the month's dollar is spent.
  # cost_per_request is Jev's measured cost: $0.042/MTok in, $0 out, ~350 input
  # tokens on a real fleet question (#7371) = ~$0.0000147. Rounded up.
  pass_through_endpoints:
    - path: "/jev"
      target: "https://ai-gateway.vercel.sh/v4/ai/evaluation-model"
      cost_per_request: 0.000015
      auth: true
      headers:
        Authorization: "Bearer os.environ/VERCEL_AI_GATEWAY_JEV_KEY"
        ai-gateway-protocol-version: "0.0.1"
        ai-evaluation-model-specification-version: "4"
        ai-model-id: "typesafe-ai/jev"
  background_health_checks: true
  health_check_interval: 60
  # Serialise /health: five groups share one Pareto account (cap 4). A parallel
  # census 429'd the seat (fleet-ops#7862). One in-flight health check at a time.
  health_check_concurrency: 1
  database_url: postgresql://litellm@127.0.0.1:5432/litellm
  redis_url: redis://127.0.0.1:6379
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_prisma_schema_update: true
