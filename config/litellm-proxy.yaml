# Approved models: one line per router provider (API key variable lowercased, no _API_KEY), holding the row's model without its openai/ or anthropic/ prefix. A row outside this list needs Nish's yes, and tests/test_provider_watch.py fails CI on one; tests/evals/results/ holds the eval a no-row decision rests on (Nish 2026-09-28).
# A provider in config/provider-watch.json with no row needs a line here: "# No row for <provider>, YYYY-MM-DD: <reason>".
# Approved opencode: deepseek-v4.1-flash
# Approved commandcode: z-ai/glm-5.3-flash
# Approved minimax: MiniMax-M3.1-Flash-Preview
# Approved stepfun: step-5-preview
# Approved synthetic: hf:zai-org/GLM-5.3-Flash
# Approved zai: glm-5.3-flash
# Approved straitly: deepseek/deepseek-v4-1-flash
# Approved alibaba-coding: qwen3.8-max
# Approved anthropic: claude-sonnet-5-5
# anthropic answers in the tether group only (fleet-ops#9980; Nishfleet/tether#7).
# Long notes for this file: docs/litellm-router-notes.md
model_list:
# Command Code carries z-ai/glm-5.3-flash only, 10 USD/day per row (fleet-ops#9744); delete the two -b rows to drop that lane.
# That is a file edit and a restart (about 101 s, with a 30 s drain of in-flight calls): POST /model/block answers 400 for a config-file row.
- model_name: worker-capable
  litellm_params:
    model: openai/z-ai/glm-5.3-flash
    api_base: https://api.commandcode.ai/provider/v1
    api_key: os.environ/COMMANDCODE_API_KEY
    tags:
    - prepaid
    - commandcode
    order: 1
    weight: 1
    input_cost_per_token: 3e-07
    cache_read_input_token_cost: 6e-09
    output_cost_per_token: 1.2e-06
    max_budget: 10.0
    budget_duration: 1d
    max_parallel_requests: 4
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-15 on api.commandcode.ai z-ai/glm-5.3-flash, 3 calls on a 19287-token prefix, cached_tokens 0/19264/19264 (fleet-ops#9744)."
    id: commandcode-glm53flash-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
