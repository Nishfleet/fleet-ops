# Approved models per provider (Nish 2026-09-28: models are provider specific; a row outside this list needs his yes; no benching).
# Providers kept (Nish 2026-10-12: 3 to 5 providers; this PR cuts 12 hosts to 5, and the removal of the other seven needs his explicit yes under the 2026-10-02 rule below): StepFun (api.stepfun.ai), MiniMax (api.minimax.io), OpenCode Go (opencode.ai), Alibaba Token Plan (token-plan.ap-southeast-1.maas.aliyuncs.com, judge and senior-backup) and Pareto (api.paretoinference.com, senior and its worker row). Removed with this change: Cline, Command Code, Ollama Cloud, Synthetic (cancelled 2026-10-01), z.ai, OpenRouter and xKiro, with every fallback, comment and credential reference that pointed only at them.
# Nish 2026-10-08 free rows (step-5-preview-free on the OpenCode Go endpoint) were removed 2026-10-12 (see the OpenCode note below).
# OpenCode Zen space-bunny-free (zen/v1, OPENCODE_API_KEY) removed 2026-10-12 (fleet-ops#9658): the free tier answers 403 FreeTierError "OpenCode's free tier can only be used from within OpenCode" to any outside client (direct probe 2026-10-12), and openai-compatible 403 maps to APIError, which v1.98.0 neither retries nor cools. No OpenCode Zen or free row remains; only the Go endpoint (opencode.ai/zen/go/v1) is used.
# OpenCode keys (OPENCODE_API_KEY, OPENCODE_API_KEY_2) are for DeepSeek 4.1 flash only (Nish 2026-10-12, chat: "opencode is alive bruv, both oc keys - just for ds4.1 flash"; this is his explicit yes to remove the other OpenCode rows). Removed with it: opencodego-step5free-worker-capable, opencodego-step5free-worker-cheap, opencodego2-step5free-worker-capable, opencodego2-step5free-worker-cheap (step-5-preview-free on the Go endpoint). Only the opencodego-ds41flash-* and opencodego2-ds41flash-* rows stay on OpenCode. Why the four step5free rows go though they answered 200 on 2026-10-08: they run on keys Nish scoped to one model, so they are a misuse of those keys, not a failing row. Effect: each of worker-capable and worker-cheap loses 3 rows (2 step5free rows per group plus one zen row). The quote is from Nish in chat 2026-10-12 about 18:45 IST, relayed by the operator rajeev and recorded at https://github.com/Nishfleet/fleet-ops/issues/9658#issuecomment-6125544189 as his yes to remove the rows; no repo test or schema names the removed ids.
# MiniMax M3.1-Flash-Preview free promo ended 2026-10-07 (free for every MiniMax Code subscriber through then, Nish 2026-09-30, #9008/#9009); the four rows below are tagged prepaid again (#9414). Nish 2026-10-09: he is on the flat MiniMax Yearly Plus plan (5-hour and weekly limits, no per-token bill), so the rows carry no dollar cap and no spend alert; the plan quota is the cap (see the comment above the rows).
# OpenCode Go: deepseek-v4.1-flash. MiniMax: M3.1-Flash-Preview. StepFun: step-5-preview. Pareto: glm-5.3-flash, never in judge. Alibaba: qwen3.8-max.
# Alibaba Model Studio Token Plan (fleet-ops#9220): qwen3.8-max is a judge row and, since 2026-10-12, the senior-backup row (senior's fallback, a reviewer seat, never a worker rung; Nish 2026-09-08, #4445, kept it off the worker groups). The two rows below are the only way that seat answers.
# fleet-ops#9469: a 404 lane is taken out of rotation on the FIRST 404. LiteLLM v1.98.0's
# _is_cooldown_required accepts 404, but the threshold is resolved PER EXCEPTION TYPE
# (Router.get_allowed_fails_from_policy), and a key the policy does not name falls back to
# the router-level allowed_fails (1) - two 404s - so the dead lane is picked again and
# leaks a 404 to a caller. router_settings.allowed_fails_policy now carries
# NotFoundErrorAllowedFails: 0, so the first 404 parks the row and the job falls through to
# the next lane in the group (order filtering is applied after the cooldown filter, so the
# order-2 overflow rows and the worker-group fallbacks both take the job). Measured on
# ghcr.io/berriai/litellm:v1.98.0 in tests/test_router_404_fallthrough.py: one 404 parks the
# row and the call still returns 200 on the next row; with the key at 1 the dead lane is
# picked twice.
#
# The per-exception resolution is also what makes one router-level key reach every row:
# _should_cooldown_based_on_deployment_policy reads the row's own policy first and, for an
# exception type that policy does not name, defers to the router-level policy. All 24 rows
# below carry a deployment-level allowed_fails_policy and none of them names NotFoundError,
# so the fix is one key, not 25.
#
# Measured consequence, stated because it is a real trade: the cooldown a 404 applies is the
# ROW's own cooldown_time, not the router-level 60 s. A 404 on one of the 7 rows with a
# cooldown over 900 s (the 3 OpenCode Go rows at 21600 s for a named monthly quota wall, the 4 MiniMax
# rows at 1800 s) keeps that row out of rotation for 6 h or 30 min. The row is not
# removed: it stays in the router, comes back when the cooldown expires and re-probes
# itself (proven in the same test file), so a restored model or a reset quota is picked up
# within hours. The alternative - two 404s before the park - is the bug. A 404 is a
# withdrawn free model or a dead model id, which is exactly what should park a row; there
# is no per-exception-type cooldown_time in v1.98.0 (AllowedFailsPolicy has 9 fields, none
# of them a duration), so the row's own cooldown_time is the only knob.
#
# Background health checks stay off: they spend the same free quota (Nish 2026-09-28) and
# would probe every paid row.
# OpenCode zen union-alpha answered 0 of 68 calls in the last 7 days (last attempt 2026-09-30 16:30 UTC, LiteLLM_SpendLogs); a direct probe on 2026-10-01 returns 400 "Upstream request failed: Model is unavailable." That 400 maps to BadRequestError, which v1.98.0 never cools, so no setting below can move a job off such a row: its four rows are removed. The opencodego-ds41flash rows on the Go endpoint (same key) stay: they are walled by a monthly quota (429 GoUsageLimitError, limitName monthly), not dead. A 900 s cool re-failed into worker groups every 15 min (0 of 68 calls in the 24 h to 2026-10-02 19:05 UTC). Those three rows now cool 21600 s and park on the first 429 (RateLimitErrorAllowedFails: 0), the same treatment #9075 gave the daily-quota rows (fleet-ops#9122). The opencodego2 rows on the second key stay at 900 s.
# Devin: SWE 2 only, through the devin CLI lane in agent.yml (no router route: 404 on every base).
# Pareto "You've reached today's free-model token quota" 429s are a day-long wall, not a transient (fleet-ops#9075, 2026-10-02). pareto keeps 300 s (its 429s are the 3-parallel key cap, fleet-ops#8458) but parks on the first: a 5-min park costs less than leaking a saturated key's 429s to callers. Pareto answers only stream:true upstream (fleet-ops#8923) and LiteLLM v1.98.0 cannot force a stream a caller did not ask for (the request's stream flag always overrides litellm_params; LiteLLM_Params has no stream field), so a non-streaming caller still 400/500s on those rows - every fleet caller (Pi) streams.
# Nish 2026-10-02: removing or benching any provider, model or row needs his explicit yes first. Provider quotas refresh hourly, daily, weekly or monthly, so a quota or limit error never justifies it. When a provider has ended a model, open an issue labelled needs-nish-decision with the evidence: the 8am and 8pm digests ask him again every day until he answers. The removals recorded above each had his yes.
