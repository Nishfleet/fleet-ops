# MiniMax Yearly Plus flat plan (Nish 2026-10-09, screenshot: 5-hour limit and weekly limit, no per-token bill):
# the plan's quota is the cap, not dollars, so these rows carry no max_budget. The accounting prices below
# (platform.minimax.io/docs/guides/pricing-paygo, M3 Standard as the proxy; M3.1-Flash-Preview has none of its
# own) stay so the spend ledger still reads, but nothing filters a row on them. 12 lanes per row (48 across the
# four) so the fleet can use the quota. When the 5-hour or weekly limit is hit MiniMax answers 429: a row parks
# 1800 s on its 4th 429 inside that window (RateLimitErrorAllowedFails: 3, the shape the removed cline-ds41flash rows used, so a
# per-minute burst does not park it but a quota wall does) and is re-probed. A 402 or other billing error is not
# retried (router_settings.num_retries: 0). The idle guard is grafana ppi-minimax (paid-plan-idle.yaml): zero calls
# in 24 h means the plan is going to waste.
# 2026-10-20: the provider list grew one id (MiniMax-M3.1-Flash) and it takes no row here. A row for it would need
# Nish's yes first: the approved-models list at the top of this file names MiniMax: M3.1-Flash-Preview only
# (2026-09-28). The probe + Gate eval gave no case for asking: on the Gate's own 60 held-out cases the two ids are
# not measurably different, and the added id was ahead on no band that counts. Numbers and per-case rows (the only
# copy): tests/evals/results/minimax_gate_m3_1_flash.json. No row or setting below changed.
- model_name: worker-capable
  litellm_params:
    model: anthropic/MiniMax-M3.1-Flash-Preview
    api_base: https://api.minimax.io/anthropic
    api_key: os.environ/MINIMAX_API_KEY
    input_cost_per_token: 3e-07
    output_cost_per_token: 1.2e-06
    cache_read_input_token_cost: 6e-08
    cache_creation_input_token_cost: 3.75e-07
    tags:
    - prepaid
    - minimax
    order: 1
    weight: 1
    max_parallel_requests: 12
    cooldown_time: 1800
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "2026-10-07 #9357 scoreboard: 93.4% cache-read 7d on real router traffic."
    id: minimax-m31-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 3
