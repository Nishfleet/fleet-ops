model_list:
# fleet-ops#4643 cache-affinity ladder (senior auditor 2026-09-12T20:32Z): distinct
# order: values = sticky lowest-order selection (litellm router order-filters each
# pick to the lowest order group) instead of a 3-account shuffle pool that cold-
