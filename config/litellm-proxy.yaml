# fleet-ops#9378 3-day A/B: a second DeepSeek V4.1 Flash lane on the prepaid
# CommandCode seat, same shape as the existing lane, so simple-shuffle gives this
# 8%-failed-run seat more of the worker share. Additive only, the existing lane is
# untouched. Metrics scrape 2026-10-08: 0 429-wall on CommandCode DS-Flash rows.
# order: 1 on every DeepSeek V4.1 Flash row of this seat, so the new lanes are
# peers of the existing ones in the shuffle, not fallbacks.
#
# No max_budget on the two new rows. This head's budget decision, in one line:
# the seat's allowance stays $20/day.
#
# Why. LiteLLM enforces max_budget per deployment, so a budget is per-lane
# allowance, not a copy of the neighbouring lane's. Adding $10/day to each of
# two rows on this one key would have taken the seat from $20/day to $40/day
# against a single prepaid wallet, and holding $20/day by re-splitting it over
# all four lanes (each $5) lowers the two existing lanes, which #9378 forbids.
# So the new rows carry no wall, exactly like the nine budget-less rows already
# on this key, and the wallet plus the ppi-commandcode 429 alert are the guard
# for them.
#
# Measured LiteLLM_SpendLogs, 2026-10-01..08: openai/deepseek/deepseek-v4.1-flash,
# 5,438 calls, $12.67 spend = $1.81/day, which is 18% of the existing $10/day
# per-lane wall. Doubling the lane count doubles that draw to about $3.63/day.
#
# To take the three new lanes out of the shuffle, remove their rows (ids
# commandcode-ds41flashb-worker-capable, commandcode-ds41flashb-worker-cheap and
# cline-ds41flash-worker-cheap) in a one-line config change. fleet-sync copies the
# file and the proxy restarts to load it: about 101 s end to end on this host, with
# a 30 s drain of in-flight calls. POST /model/block cannot do this: it answers
# HTTP 400 "Model updates only supported for DB-stored models" for a config-file row.
