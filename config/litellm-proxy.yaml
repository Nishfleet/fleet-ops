- model_name: senior
  # Long note 5: docs/litellm-router-notes.md
  litellm_params:
    model: openai/hf:zai-org/GLM-5.3-Flash
    api_base: https://api.synthetic.new/openai/v1
    api_key: os.environ/SYNTHETIC_API_KEY
    tags:
    - prepaid
    - senior
    order: 1
    # No max_parallel_requests on a senior row (fleet-ops#10694). Long note 12: docs/litellm-router-notes.md
    # 60 s, not the 900 s of the sibling Synthetic rows: the senior group has one or two rows, so a long park takes half or all of the tier
    # out. On 2026-10-12 a Synthetic 502 (BadGatewayError, which no allowed_fails_policy key covers) parked the row 900 s at 06:14 UTC, and
    # review-risky's retries at 06:18 and 06:22 found no senior deployment, so #9602 and #9588 got no second review. A pool 429 re-probed
    # every 60 s costs one fast failed call a minute; the worker rows keep 900 s because their groups have dozens of other rows.
    cooldown_time: 60
    # No max_budget. LiteLLM prices Synthetic GLM-5.3-Flash at $0 (/global/spend/models 2026-10-12: total_spend 0.0), so a dollar cap
    # on this row could never trip. No slot cap (note 12): the provider's 429 and this row's cooldown limit its share of the shared prepaid pool.
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "2026-10-07 #9357 scoreboard: 89.5% cache-read 7d on real router traffic (same Synthetic GLM-5.3-Flash lane as worker-cheap)."
    id: synthetic-glm53flash-senior
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
- model_name: senior
  # Second GLM reviewer row (2026-10-28): the senior tier had one Synthetic row at one slot, so every workflow-edit review queued behind it, and Synthetic ends 2026-11-12 (fleet-ops#10530).
  litellm_params:
    model: openai/glm-5.3-flash
    api_base: https://api.z.ai/api/coding/paas/v4
    api_key: os.environ/ZAI_API_KEY
    tags:
    - senior
    - prepaid
    - zai
    order: 1
    weight: 1
    # Nish 2026-10-04: use the z.ai Coding Plan. One row per group got ~126 of ~6,500 worker calls (2%) in the 24 h to 22:30 IST,
    # and the plan dashboard showed 25% of the weekly 10K credits used with 5 days left (resets 2026-10-09 22:22 IST).
    # simple-shuffle picks uniformly among rows, so ten rows give it ~8x the share of new tasks (the StepFun pattern above).
    # Coding-plan key: 12 parallel probes gave 10x200 and 2x429 "Rate limit reached for requests" (2026-10-04 23:00 IST, with live router traffic on the same key), so the plan's own 429 is the cap and no row holds a slot count (note 12).
    # General /api/paas/v4 answers 429 code 1113 (no balance) for this key.
    # A 5-hour or weekly plan-limit 429 cools a row 15 min, then it retries by itself, so the reset is used without a human.
    # No max_parallel_requests on a senior row (fleet-ops#10694). Long note 12: docs/litellm-router-notes.md
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Z.AI caches automatically and reports cached_tokens (https://docs.z.ai/guides/capabilities/cache); 202 of 302 non-Pi callers show cached_tokens>0 (10048 of 10124 on 2026-10-03) while Pi's streamed replies carry no prompt_tokens_details (0 of 7652): LiteLLM v1.98.0 drops it (#9357). Direct probe blocked by the 429 code 1310 weekly limit until 2026-10-09."
    id: zai-glm53flash-senior
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
