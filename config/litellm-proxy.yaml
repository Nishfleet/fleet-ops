- model_name: tether
  litellm_params:
    model: anthropic/claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    api_base: https://api.anthropic.com
    cache_control_injection_points:
    - location: message
      role: system
    - location: message
      index: -1
    tags:
    - prepaid
    - anthropic
    order: 1
    input_cost_per_token: 2e-06
    cache_creation_input_token_cost: 2.5e-06
    cache_read_input_token_cost: 1e-07
    output_cost_per_token: 1e-05
    max_parallel_requests: 4
    # 5 min: a spent credit or a rate limit parks the row; `assistant` answers meanwhile (fleet-ops#9980).
    cooldown_time: 300
    max_budget: 50.0
    budget_duration: 1d
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-23 on api.anthropic.com/v1/messages with a 23403-token system block marked cache_control, call 1 cache_creation_input_tokens 23403, call 2 cache_read_input_tokens 23403 of 23414 (99.9%)."
    id: anthropic-sonnet55-tether
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
router_settings:
  routing_strategy: simple-shuffle
  # One task = one model: Pi sends x-litellm-session-id and session_affinity pins it to a row (fleet-ops#9015).
  optional_pre_call_checks: ["prompt_caching", "session_affinity"]
  # Pins and counters live in Redis because the proxy runs 2 workers; host/port/password, never redis_url.
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD
  # 600 s: the p99 gap inside a session is 214 s, so a live pin holds and a dead-row pin expires in 10 min. The fix is upstream (fleet-ops#9411); the session-hop alert on the SELECT-only grafana_ro source (config/grafana/provisioning/alerting/session-hop.yaml, fleet-ops#9475) bounds the damage meanwhile.
  deployment_affinity_ttl_seconds: 600
  # A desk alias renames the group a job already picked, so the 3-day token trial changes compaction alone (fleet-ops#9330). Long note 14: docs/litellm-router-notes.md
  # assistant is Hermes chat; its own rows left with the walled plans (fleet-ops#10935).
  model_group_alias:
    assistant: worker-capable
    worker-capable-desk: worker-capable
    worker-public: worker-capable
    worker-public-desk: worker-capable
  # worker-cheap rises to worker-capable; worker-capable never falls down (fleet-ops#10040).
  # A row answering 402/403 is never cooled, so that call reaches the caller and Pi retries it.
  fallbacks:
    - worker-cheap: [worker-capable]
    - tether: [assistant]
  cooldown_time: 60
  allowed_fails: 1
  # a same-group retry re-hits the same wall; fallbacks fire on the first failure (fleet-ops#5792).
  num_retries: 0
  timeout: 1800
  enable_tag_filtering: false
  retry_policy:
    # Measured on the PINNED_LITELLM in tests/test_router_retry_policy_no_cross_seat.py: re-measure on a bump (fleet-ops#9427).
    AuthenticationErrorRetries: 1
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    BadRequestErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
    NotFoundErrorRetries: 1
    DefaultRetries: 1
  allowed_fails_policy:
    # BadRequestErrorAllowedFails: 1 is the stock per-deployment override that lets a 400 cool the row; a 402 cannot be cooled by config (fleet-ops#9007).
    AuthenticationErrorAllowedFails: 0
    # Read with the row's own cooldown_time, not the router's 60 s.
    RateLimitErrorAllowedFails: 1
    TimeoutErrorAllowedFails: 1
    InternalServerErrorAllowedFails: 1
    # 0 parks a 404 lane on its first failure, then it re-probes; the retry above lands on a live row (fleet-ops#9469, #9050).
    NotFoundErrorAllowedFails: 0
litellm_settings:
  drop_params: true
  callbacks:
  - prometheus
  require_auth_for_metrics_endpoint: false
general_settings:
  pass_through_endpoints:
    - path: "/jev"
      # Vercel AI Gateway (Nish 2026-10-04 "vercel"): TypeSafe direct ran out of credits.
      target: "https://ai-gateway.vercel.sh/v4/ai/evaluation-model"
      cost_per_request: 0.000015
      auth: true
      headers:
        Authorization: "Bearer os.environ/VERCEL_AI_GATEWAY_JEV_KEY"
        ai-model-id: "typesafe-ai/jev"
        ai-evaluation-model-specification-version: "4"
        ai-gateway-protocol-version: "0.0.1"
        ai-gateway-auth-method: "api-key"
  # real traffic is the probe: background checks spent the same free quota (Nish 2026-09-28).
  background_health_checks: false
  # The container's DATABASE_URL is the single source (host localhost), so a credential change is one env edit (fleet-ops#10020).
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY
  # without this, startup prisma migrate deploy stalls every restart.
  disable_prisma_schema_update: true
