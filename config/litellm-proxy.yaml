- model_name: tether
  litellm_params:
    model: anthropic/claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    api_base: https://api.anthropic.com
    cache_control_injection_points:
    - location: message
      role: system
    - location: message
      index: -1
    tags:
    - prepaid
    - anthropic
    order: 1
    input_cost_per_token: 2e-06
    cache_creation_input_token_cost: 2.5e-06
    cache_read_input_token_cost: 1e-07
    output_cost_per_token: 1e-05
    max_parallel_requests: 4
    # 5 min: a spent credit or a rate limit parks the row; `assistant` answers meanwhile (fleet-ops#9980).
    cooldown_time: 300
    max_budget: 50.0
    budget_duration: 1d
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Caches: direct probe 2026-10-23 on api.anthropic.com/v1/messages with a 23403-token system block marked cache_control, call 1 cache_creation_input_tokens 23403, call 2 cache_read_input_tokens 23403 of 23414 (99.9%)."
    id: anthropic-sonnet55-tether
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
# The review job's Claude (decisions ledger 2026-11-04): it reviews lane PRs, whose builders are
# GLM, DeepSeek or MiniMax. On a failure or the 20 USD/day wall it falls back to review-qwen.
# Only the review runner's virtual key lists this group.
- model_name: review-claude
  litellm_params:
    model: anthropic/claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    api_base: https://api.anthropic.com
    tags:
    - prepaid
    - anthropic
    input_cost_per_token: 2e-06
    output_cost_per_token: 1e-05
    max_budget: 20.0
    budget_duration: 1d
  model_info:
    mode: chat
    supports_prompt_caching: false
    cache_proof: "Nothing repeats: each call is a new diff, and the shared system prompt (docs/review-bar.md) is under the 1024-token minimum cacheable prompt (docs.claude.com/en/docs/build-with-claude/prompt-caching)."
    id: anthropic-sonnet55-review
# The review job's last reviewer (owner 2026-11-04: any family but the builder's, never MiniMax).
# Qwen builds nothing, so it may review every PR. It falls back to nothing, so a review never
# reaches a builder's row. Alibaba Token Plan is prepaid, so no max_budget.
- model_name: review-qwen
  litellm_params:
    model: openai/qwen3.8-max
    api_base: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    api_key: os.environ/ALIBABA_CODING_API_KEY
    tags:
    - prepaid
    - alibaba
    extra_body:
      enable_thinking: true
      thinking_budget: 2048
    additional_drop_params:
    - reasoning_effort
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "Same model and endpoint as alibaba-qwen38max-assistant: direct probe 2026-10-07 on compatible-mode, call 2 cached_tokens 7168 of 7967 (90%)."
    id: alibaba-qwen38max-review
# The review job's group for every PR a pi run did not build (owner 2026-11-04: "need the others
# as backup", never MiniMax). Qwen and DeepSeek rows: a failed row cools and the next call
# takes another row (https://docs.litellm.ai/docs/routing). No Claude row, because Claude builds
# these PRs, no GLM row (GLM-5.3-Flash is a worker model only, fleet-ops#11847), and no fallback.
# A pi build never asks for this group. Rows copy their source row.
- model_name: review-any
