# Approved models per provider (Nish 2026-09-28: models are provider specific; a row outside this list needs his yes; no benching).
# Long note 1: docs/litellm-router-notes.md
# Anthropic: claude-sonnet-5-5, in the tether group only (Nish 2026-10-22, fleet-ops#9980 comment 6347106070, and 2026-10-23, Nishfleet/tether#7). The row, its fallback to assistant and its cost are recorded above the router_settings block.
# Cline: stealth/space-bunny-alpha. (Historical: no Cline row remains since 2026-10-23; the same goes for the Cline entries in the free-rows lines above.)
# Alibaba Model Studio Token Plan (fleet-ops#9220): qwen3.8-max is a judge/orchestrator row only, never a worker rung (Nish 2026-09-08, #4445), so the row below is the only way that seat answers.
# Long note 2: docs/litellm-router-notes.md
# fleet-ops#9469: a 404 lane is taken out of rotation on the FIRST 404. LiteLLM v1.98.0's
# _is_cooldown_required accepts 404, but the threshold is resolved PER EXCEPTION TYPE
# (Router.get_allowed_fails_from_policy), and a key the policy does not name falls back to
# the router-level allowed_fails (1) - two 404s - so the dead lane is picked again and
# leaks a 404 to a caller. router_settings.allowed_fails_policy now carries
# NotFoundErrorAllowedFails: 0, so the first 404 parks the row and the job falls through to
# the next lane in the group (order filtering is applied after the cooldown filter, so the
# job reaches a peer row in the same group, or the worker-group fallbacks when none is
# left; no order-2 worker row remains after fleet-ops#9711). Measured on
# ghcr.io/berriai/litellm:v1.98.0 in tests/test_router_404_fallthrough.py: one 404 parks the
# row and the call still returns 200 on the next row; with the key at 1 the dead lane is
# picked twice.
#
# The per-exception resolution is also what makes one router-level key reach every row:
# _should_cooldown_based_on_deployment_policy reads the row's own policy first and, for an
# exception type that policy does not name, defers to the router-level policy. All 47 rows
# below carry a deployment-level allowed_fails_policy and none of them names NotFoundError,
# so the fix is one key, not 47.
#
# Measured consequence, stated because it is a real trade: the cooldown a 404 applies is the
# ROW's own cooldown_time, not the router-level 60 s. A 404 on one of the 4 rows parked
# 21600 s for a named quota wall keeps that row out of rotation for 6 h. The row is not
# removed: it stays in the router, comes back when the cooldown expires and re-probes
# itself (proven in the same test file), so a restored model or a reset quota is picked up
# within hours. The alternative - two 404s before the park - is the bug. A 404 is a
# withdrawn free model or a dead model id, which is exactly what should park a row; there
# is no per-exception-type cooldown_time in v1.98.0 (AllowedFailsPolicy has 9 fields, none
# of them a duration), so the row's own cooldown_time is the only knob.
#
# Background health checks stay off: they spend the same free quota (Nish 2026-09-28) and
# would probe every paid row.
# Long note 3: docs/litellm-router-notes.md
# Pareto removed 2026-10-22 (Nish, "yes, also remove pareto", fleet-ops#10040): both rows (worker-capable and senior) are gone; the senior row is the Synthetic GLM-5.3-Flash row below. PARETO_API_KEY stays in place.
# Devin: SWE 2 only, through the devin CLI lane in agent.yml (no router route: 404 on every base).
# Long note 4: docs/litellm-router-notes.md
