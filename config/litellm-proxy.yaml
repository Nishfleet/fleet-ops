# Ollama worker-capable rows removed 2026-10-22 (approved by the owner on the private tracker item W10c; Nish 2026-10-22 22:15 IST, "yes, also remove pareto", the yes for removing the dead Ollama rows and Pareto, quoted in fleet-ops#10040;
# Long note 6: docs/litellm-router-notes.md
# Nish 2026-10-04: Ollama can take more lanes. Probe 12 parallel 12x200; 24
# parallel 13x200 11x429, cap ~12. Ten rows x mpr 1 = 10 lanes, leaving 2 for
# direct `pi --provider ollama-cloud` (a 429 cools 900 s). DS4.1 Flash only.
# max_budget 1.0 per row: budgets are per deployment, so 10 x 1.0 keeps the
# key at $10/day (the #9209 cap). Peak token rates from ollama.com/pricing.
# Native ollama_chat/, not openai/ on /v1 (fleet-ops#9253): Ollama's /v1 reply ids
# are chatcmpl-<0..999>, all 1,000 were in LiteLLM_SpendLogs by 2026-09-19, and
# SpendLogs keys on the reply id, so every Ollama success was dropped as a
# duplicate (0 rows in 7 days while Prometheus counted them). ollama_chat/ gets
# a uuid id from LiteLLM; tool calls and streaming checked 2026-10-05.
- model_name: worker-capable
  litellm_params:
    model: openai/step-5-preview
    api_base: https://api.stepfun.ai/step_plan/v1
    api_key: os.environ/STEPFUN_API_KEY
    tags:
    - prepaid
    - stepfun
    order: 1
    weight: 1
    # Step Plan Pro (2026-10-01) account cap is 15 concurrent: 20- and 40-way bursts answered 14 x 200 and 429 "concurrency reached, current: 16, limit: 15". 13 leaves 2 for direct `pi --provider stepfun` use, because a concurrency 429 cools this rung for cooldown_time.
    # Nish 2026-10-02: StepFun gets 10 slots. simple-shuffle picks among rows, and one row got 562 of 10,512 worker calls (5%),
    # 58M tokens = ~22% of the Pro plan's pace (8000M/month), in the 24 h to 15:00 IST. Ten rows give it ~10x the share of new tasks.
    # Nish: using the month's credit before the reset is fine; tokens must go to productive work.
    # max_parallel_requests is per row, so the account's 13 router lanes are split 2 + 2 + 2 + 1 + 1 + 1 + 1 + 1 + 1 + 1 across the rows.
    max_parallel_requests: 2
    # Step Plan credit ran out 2026-09-25 11:15 IST (fleet-ops#8653): a 429 cools this rung 15 min, then it retries by itself: refilled credit is used without a human, and a concurrency 429 idles it only briefly.
    cooldown_time: 900
  model_info:
    mode: chat
    supports_prompt_caching: true
    cache_proof: "2026-10-07 #9357 scoreboard: 94.8% cache-read 7d on real router traffic."
    id: stepfun-step5preview-worker-capable
    allowed_fails_policy:
      BadRequestErrorAllowedFails: 1
