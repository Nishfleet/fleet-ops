# Alertmanager routing — repo-sourced (fleet-ops#1534).
#
# This is the ONE mechanical policy for the alertmanager phone path. The
# other phone path is the hermes outbound gate (bin/hermes): only Nish-reserved
# boundary classes + the two digests may pass --urgent. Together these two
# gates are the single policy: no other path can text Nish's phone.
#
# Routing matrix (the contract this file locks):
#   severity=nish      -> telegram (the phone), stop.   [Nish-reserved classes]
#   severity=page      -> telegram (the phone), stop.   [e.g. RepairDispatchDown]
#   severity=critical  -> github-issues, continue.     [no phone]
#   severity=warning   -> github-issues, continue.     [no phone]
#   severity=none      -> default receiver github-issues (or the `deadman`
#                         receiver for Watchdog, which is matched first:
#                         healthchecks.io ping, fleet-ops#8667). [no phone]
#   default (no match) -> github-issues.
#
# Re-notification: group_interval 15m / repeat_interval 6h on every branch
# except the phone (severity=page keeps group_interval 1m) and the Watchdog
# dead-man (fleet-ops#8667), which overrides both to ping healthchecks.io
# every 5m.
#
# severity=nish (2026-09-18) is the Nish-reserved paging path: any alert that
# fires with severity="nish" pages immediately at group_interval 1m.
#
# Glue sweep 2026-09-18: it is now the ONLY such path. bin/nish-boundary-notify,
# bin/hermes and the NISH-ESCALATIONS.md path unit that watched a file were all
# deleted. An agent with a reserved-class finding escalates with one stock line,
# unauthenticated, from any user unit or session:
#
#   amtool alert add alertname=NishEscalation severity=nish \
#     --annotation=summary='<one sentence>'
#
# --annotation=summary, never a bare summary=: a bare key becomes a LABEL, and
# the telegram template below reads .CommonAnnotations.summary — so the message
# arrives with an empty body, and the changed fingerprint means the alert never
# dedupes or resolves. Proven both ways 2026-09-18.
#
# Only severity=page and severity=nish reach the phone. Everything else becomes one GitHub issue per alertname in Nishfleet/fleet-ops, labelled from-alertmanager and closed on resolve (fleet-ops#8432). The orchestrator admits it like any other issue.
#
# Repo-ized so a hand-edit cannot drift the routing back to "everything pages"
# (the 2026-08-28 leak this file replaced). copy it to /etc/prometheus/alertmanager.yml with
# `sudo -n install -D -m 0644 -o root -g root` and reload alertmanager (README).
# The `deadman` receiver reads its webhook URL from /etc/prometheus/deadman_url,
# a root-owned file with the same owner and mode as
# /etc/prometheus/telegram_bot_token. It is provisioned once and never committed.
global:
  resolve_timeout: 5m

# Re-notification budget (2026-09-18). group_interval was 1m, which is what
# actually drove the redispatch storm: 335 alert-repair-* units in 7 days, 238
# dead. repeat_interval only throttles a group whose membership is UNCHANGED —
# every new fingerprint joining a group (a fresh DetachedJobDied unit label, a
# flapping FleetUndersaturated) re-notifies after group_interval instead, so
# 6h throttling never applied: DetachedJobDied fired 62 times in 7 days, some
# one minute apart. 15m collapses those into one notification per quarter hour
# and leaves repeat_interval at 6h (lowering it to 4h would have made a
# still-firing alert re-notify 50% MORE often, not less).
# The phone path keeps 1m: severity=page overrides group_interval below, so
# RepairDispatchDown is never delayed by this budget.
route:
  receiver: github-issues
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 15m
  repeat_interval: 6h
  routes:
    - matchers:
        - alertname="Watchdog"
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
      continue: false
    - matchers:
        - severity="critical"
      receiver: github-issues
      continue: true
    - matchers:
        - severity="nish"
      receiver: telegram
      group_interval: 1m
      continue: false
    - matchers:
        - severity="page"
      receiver: telegram
      group_interval: 1m
      continue: false
    - matchers:
        - severity="warning"
      receiver: github-issues
      continue: true

receivers:
  # Always-firing Watchdog -> the healthchecks.io VPS check. The URL is
  # secret-class, so it is read from a root-owned file and never committed
  # (fleet-ops#8667). repeat_interval is bounded by group_interval, so the
  # route pins group_interval: 1m or pings space out to the inherited 15m.
  - name: deadman
    webhook_configs:
      - url_file: /etc/prometheus/deadman_url
        send_resolved: false
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/prometheus/telegram_bot_token
        chat_id: 1144372019
        message: '[{{ .Status }}] {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        send_resolved: true
  - name: github-issues
    webhook_configs:
      - url: 'http://127.0.0.1:9393/v1/receiver'
        send_resolved: true
