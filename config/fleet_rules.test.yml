# promtool unit tests for the symptom-only rule set (fleet-ops#8432).
# Run: promtool test rules config/fleet_rules.test.yml
rule_files:
  - fleet_rules.yml

evaluation_interval: 1m

tests:
  # Disk at 86% used fires.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/"}'
        values: '14x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: critical
              service: host
              fstype: ext4
              mountpoint: "/"
            exp_annotations:
              summary: "filesystem / above 85% used"
              description: "A full disk fails the restic backup and the LiteLLM postgres write path. Repair: reclaim space, starting with agent worktrees under ~/workspaces/agent-worktrees."

  # Disk at 80% used stays silent.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/"}'
        values: '20x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DiskAlmostFull
        exp_alerts: []

  # Last proven restore ~28h old fires.
  - interval: 1m
    input_series:
      - series: 'fleet_restore_drill_last_success_seconds'
        values: '-100000x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ResticRestoreProofStale
        exp_alerts:
          - exp_labels:
              severity: critical
              service: backups
            exp_annotations:
              summary: "no proven restic restore in 26+ hours"
              description: "fleet_restore_drill_last_success_seconds is older than 26h or absent, so the backup is unproven. Repair: systemctl start restic-r2-restore-test.service and read its journal."

  # Last proven restore ~25h old stays silent.
  - interval: 1m
    input_series:
      - series: 'fleet_restore_drill_last_success_seconds'
        values: '-90000x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ResticRestoreProofStale
        exp_alerts: []

  # Merge queue head waiting over 1h fires.
  - interval: 1m
    input_series:
      - series: 'ci_merge_queue_head_wait_seconds{repo="Nishfleet/fleet-ops"}'
        values: '3700x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: FleetMergeQueueStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: queue
            exp_annotations:
              summary: "merge queue head has waited over 1h"
              description: "ci_merge_queue_head_wait_seconds is above 3600 for 15m, so nothing is landing. Repair: open the merge queue for the repo and read the head PR's checks."

  # Test 11 — total outage: every raw worker rung is unhealthy for the whole
  # window, so min() over the raw worker-cheap/worker-capable rows stays > 0
  # and FleetWorkerLaneOutage fires (fleet-ops#7820). No 429 exemption applies.
  - interval: 1m
    input_series:
      - series: 'litellm_deployment_state{api_base="https://api.paretoinference.com/v1",api_provider="openai",litellm_model_name="z-ai/glm-5.3-flash",model_id="pareto-glm53flash-worker-capable"}'
        values: '1x40'
      - series: 'litellm_deployment_state{api_base="https://opencode.ai/zen/go/v1",api_provider="openai",litellm_model_name="openai/deepseek-v4.1-flash",model_id="opencodego-ds41flash-worker-cheap"}'
        values: '2x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetWorkerLaneOutage
        exp_alerts:
          - exp_labels:
              severity: critical
              service: seat-proxy
            exp_annotations:
              summary: "every worker-cheap/worker-capable deployment has been unhealthy for 30m+ — worker lane is down"
              description: "min(litellm_deployment_state) over raw worker rows > 0 for 30m: no worker rung is healthy, so every pi-issue@ start dies on its first call (fleet-ops#7820). Repair, in order: (1) if ~/workspaces/agent-state/FLEET-PAUSED exists the fleet is deliberately down — stop. (2) GET /health with the master key and probe each worker rung directly (chat AND tool_choice=required); a green direct probe means the gauge is stale — never trust the gauge alone. (3) If every upstream answers a quota/subscription 429, seat supply is a money decision: record the probe results on the issue and route to Nish; do not add rungs or raise max_parallel_requests. (4) Once one rung is green again, XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user reset-failed the pi-scout@/pi-intake-repair@ units that failed in the window."

  # Test 12 — one healthy rung: the same two raw rows, but opencodego answers
  # 0, so min() over the raw worker rows is 0 and the lane is NOT walled.
  # FleetWorkerLaneOutage must stay silent.
  - interval: 1m
    input_series:
      - series: 'litellm_deployment_state{api_base="https://api.paretoinference.com/v1",api_provider="openai",litellm_model_name="z-ai/glm-5.3-flash",model_id="pareto-glm53flash-worker-capable"}'
        values: '1x40'
      - series: 'litellm_deployment_state{api_base="https://opencode.ai/zen/go/v1",api_provider="openai",litellm_model_name="openai/deepseek-v4.1-flash",model_id="opencodego-ds41flash-worker-cheap"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetWorkerLaneOutage
        exp_alerts: []
