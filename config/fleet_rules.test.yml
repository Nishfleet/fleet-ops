# promtool unit tests for the FleetLitellmDeploymentUnhealthy matcher
# (fleet-ops#8398). The rule's job after #8398: a 429/quota wall must NOT page
# (the rung stays LIVE on its own per-deployment cooldown_time and LiteLLM
# re-probes it), while a dead wall — 401, 402 with no stated renewal, 404,
# model gone — MUST still page so it gets benched.
#
# Run: promtool test rules config/fleet_rules.test.yml
# CI runs `promtool check rules config/fleet_rules.yml`; this file is the
# behavioural pin on top of the syntax check. fleet-ops#366 (mechanical fix).
rule_files:
  - fleet_rules.yml

evaluation_interval: 1m

tests:
  # Test 1 — quota wall. state > 0 for 10m+ on a raw row, and the deployment
  # produced 429 cooldown events inside the 1h lookback. The router is managing
  # the wall (cooldown_time in litellm_params), so the alert stays silent.
  - interval: 1m
    input_series:
      - series: 'litellm_deployment_state{api_base="https://api.paretoinference.com/v1",api_provider="openai",litellm_model_name="z-ai/glm-5.3-flash",model_id="pareto-glm53flash-worker-capable"}'
        values: '1x40'
      - series: 'litellm_deployment_cooled_down_total{api_base="https://api.paretoinference.com/v1",api_provider="openai",exception_status="429",litellm_model_name="worker-capable",model_id="pareto-glm53flash-worker-capable"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetLitellmDeploymentUnhealthy
        exp_alerts: []

  # Test 2 — dead wall the alert must still catch. Same shape, but the
  # cooldown events carry exception_status="401" (LiteLLM cools a 401 down
  # too — cooldown_handlers.py). No status filter would silence this; the
  # 429-only filter keeps it firing.
  - interval: 1m
    input_series:
      - series: 'litellm_deployment_state{api_base="https://api.dead-provider.test/v1",api_provider="openai",litellm_model_name="dead/model-x",model_id="dead-modelx-worker-capable"}'
        values: '1x40'
      - series: 'litellm_deployment_cooled_down_total{api_base="https://api.dead-provider.test/v1",api_provider="openai",exception_status="401",litellm_model_name="worker-capable",model_id="dead-modelx-worker-capable"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetLitellmDeploymentUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              service: seat-proxy
            exp_annotations:
              summary: "a routed litellm deployment has been unhealthy for 10m+ and is not in a 429 cooldown the router is managing"
              description: "litellm_deployment_state > 0 sustained on a raw deployment row, with no 429 cooldown event in the last hour — a wall LiteLLM is not clearing by itself (fleet-ops#5792, #8398). Repair, in order: (1) GET /health with the master key to name the rung (unhealthy_endpoints) and probe it directly (chat AND tool_choice=required). (2) A 429 or quota wall that resets keeps its rung LIVE: put `cooldown_time` in that deployment's litellm_params, sized to the wall (parallel-cap 300, weekly trickle 900, hard daily/monthly reset 86400) so the router routes around it and re-probes it by itself. (3) Bench ONLY a wall that will not clear: 401, 402 with no stated renewal, 404, or model gone — add the entry to config/litellm-proxy.yaml's benched: block with a dated reason AND `retry_at:` (the provider's stated reset/renewal date, else now + 24h). (4) Arm the restore probe for that bench with the house one-shot pattern: systemd-run --user --collect --unit later-fleet-ops-<N> --on-calendar='<retry_at> Asia/Kolkata' -- gh issue edit <N> --repo Nishfleet/fleet-ops --add-label agent-ready, where <N> is a restore-probe issue filed at bench time. Restore only with a green probe cited in the PR."

  # Test 3 — unmanaged wall. state > 0 for 10m+ and no cooldown events at all
  # (LiteLLM is not cooling it down; e.g. a 402 dead-credit wall, which never
  # reaches the cooldown path). Must fire.
  - interval: 1m
    input_series:
      - series: 'litellm_deployment_state{api_base="https://api.budget-dead.test/v1",api_provider="openai",litellm_model_name="zai-org/GLM-5.3-Flash",model_id="nebius-glm53flash-worker-cheap"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetLitellmDeploymentUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              service: seat-proxy
            exp_annotations:
              summary: "a routed litellm deployment has been unhealthy for 10m+ and is not in a 429 cooldown the router is managing"
              description: "litellm_deployment_state > 0 sustained on a raw deployment row, with no 429 cooldown event in the last hour — a wall LiteLLM is not clearing by itself (fleet-ops#5792, #8398). Repair, in order: (1) GET /health with the master key to name the rung (unhealthy_endpoints) and probe it directly (chat AND tool_choice=required). (2) A 429 or quota wall that resets keeps its rung LIVE: put `cooldown_time` in that deployment's litellm_params, sized to the wall (parallel-cap 300, weekly trickle 900, hard daily/monthly reset 86400) so the router routes around it and re-probes it by itself. (3) Bench ONLY a wall that will not clear: 401, 402 with no stated renewal, 404, or model gone — add the entry to config/litellm-proxy.yaml's benched: block with a dated reason AND `retry_at:` (the provider's stated reset/renewal date, else now + 24h). (4) Arm the restore probe for that bench with the house one-shot pattern: systemd-run --user --collect --unit later-fleet-ops-<N> --on-calendar='<retry_at> Asia/Kolkata' -- gh issue edit <N> --repo Nishfleet/fleet-ops --add-label agent-ready, where <N> is a restore-probe issue filed at bench time. Restore only with a green probe cited in the PR."

  # Tests 4-8 — rebuild park gate on the product_surface group
  # (Nishfleet/0509#4489). fleet0509_surface_absent exists for a target only
  # while EVERY status code it returned in the last hour was a 404, so the
  # three alerts park during the rebuild's route-absent state and re-arm
  # the moment any non-404 answer — or no answer at all — appears.

  # Test 4 — rebuild state: probes fail and every status is a 404. Parked.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '0x150'
      - series: 'probe_http_status_code{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '404x150'
    alert_rule_test:
      - eval_time: 150m
        alertname: Product0509SearchAliasGapDeadEnd
        exp_alerts: []

  # Test 5 — route live but dead-ending (200 with no rows): must fire.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '0x150'
      - series: 'probe_http_status_code{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '200x150'
    alert_rule_test:
      - eval_time: 150m
        alertname: Product0509SearchAliasGapDeadEnd
        exp_alerts:
          - exp_labels:
              severity: critical
              service: "0509"
              instance: "https://0509.io/search?q=oura&country=all"
              job: blackbox-0509-search-aliasgap
            exp_annotations:
              summary: "0509 /search dead-ends entirely for known-alias-gap brand https://0509.io/search?q=oura&country=all"
              description: "Every probe in the last two hours of https://0509.io/search?q=oura&country=all returned no result row at all. These brands (oura Nishfleet/0509#1427, ridge Nishfleet/0509#2075) are KNOWN_ALIAS_GAPS: a blanket-Unmatched page is the named gap's expected symptom and deliberately does NOT alert. A DEAD-END does, because the guard's core promise is zero dead-end empty states. Repair: this is a recall regression, not the alias gap — check ad ingestion for the brand. A firing alert already excludes the rebuild's route-absent case: a uniform /search 404 parks this rule via fleet0509_surface_absent (Nishfleet/0509#4489), so if this fires the route answered non-404 and the dead-end is real."

  # Test 6 — no status samples at all (connection/TLS/DNS failure): the
  # gate has no positive 404 evidence, so the outage must still fire.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 150m
        alertname: Product0509SearchAliasGapDeadEnd
        exp_alerts:
          - exp_labels:
              severity: critical
              service: "0509"
              instance: "https://0509.io/search?q=oura&country=all"
              job: blackbox-0509-search-aliasgap
            exp_annotations:
              summary: "0509 /search dead-ends entirely for known-alias-gap brand https://0509.io/search?q=oura&country=all"
              description: "Every probe in the last two hours of https://0509.io/search?q=oura&country=all returned no result row at all. These brands (oura Nishfleet/0509#1427, ridge Nishfleet/0509#2075) are KNOWN_ALIAS_GAPS: a blanket-Unmatched page is the named gap's expected symptom and deliberately does NOT alert. A DEAD-END does, because the guard's core promise is zero dead-end empty states. Repair: this is a recall regression, not the alias gap — check ad ingestion for the brand. A firing alert already excludes the rebuild's route-absent case: a uniform /search 404 parks this rule via fleet0509_surface_absent (Nishfleet/0509#4489), so if this fires the route answered non-404 and the dead-end is real."

  # Test 7 — 5xx outage is not a 404: must fire.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '0x150'
      - series: 'probe_http_status_code{instance="https://0509.io/search?q=oura&country=all",job="blackbox-0509-search-aliasgap"}'
        values: '500x150'
    alert_rule_test:
      - eval_time: 150m
        alertname: Product0509SearchAliasGapDeadEnd
        exp_alerts:
          - exp_labels:
              severity: critical
              service: "0509"
              instance: "https://0509.io/search?q=oura&country=all"
              job: blackbox-0509-search-aliasgap
            exp_annotations:
              summary: "0509 /search dead-ends entirely for known-alias-gap brand https://0509.io/search?q=oura&country=all"
              description: "Every probe in the last two hours of https://0509.io/search?q=oura&country=all returned no result row at all. These brands (oura Nishfleet/0509#1427, ridge Nishfleet/0509#2075) are KNOWN_ALIAS_GAPS: a blanket-Unmatched page is the named gap's expected symptom and deliberately does NOT alert. A DEAD-END does, because the guard's core promise is zero dead-end empty states. Repair: this is a recall regression, not the alias gap — check ad ingestion for the brand. A firing alert already excludes the rebuild's route-absent case: a uniform /search 404 parks this rule via fleet0509_surface_absent (Nishfleet/0509#4489), so if this fires the route answered non-404 and the dead-end is real."

  # Test 8 — timeline job (1h-window alert) parks on uniform 404 too.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="https://0509.io/timeline/nike.com",job="blackbox-0509-timeline"}'
        values: '0x90'
      - series: 'probe_http_status_code{instance="https://0509.io/timeline/nike.com",job="blackbox-0509-timeline"}'
        values: '404x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: Product0509TimelineDark
        exp_alerts: []
