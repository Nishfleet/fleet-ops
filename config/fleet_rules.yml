# Fleet alert rules.
#
# Glue sweep 2026-09-18 (exporter lane). This file went 67 rules -> 14.
#
# THE RULE FOR THIS FILE, and the only one: a rule lives here if and only if
#   (a) it guards money, backups, the seat proxy, main-red, or product
#       availability, AND
#   (b) its expression is written on a metric a STOCK exporter already emits.
#
# Stock sources, proven present on this host 2026-09-18:
#   litellm_*                     LiteLLM's own prometheus callback, 127.0.0.1:4000/metrics
#   node_systemd_unit_state       node_exporter systemd collector
#   node_filesystem_*, node_memory_*   node_exporter
#   node_textfile_mtime_seconds   node_exporter textfile collector
#   fleet_restore_drill_*         /usr/local/sbin/restic-r2-restore-test writes
#   fleet_litellm_pgdump_*        restic-restore-test.prom (same writer)
#   up{}                          prometheus scrape state
#   probe_success                 blackbox_exporter (3 targets on 0509)
#   fleet_main_ci_green, fleet_prepaid_credits_usd, fleet_prepaid_used_usd,
#   fleet_main_ci_run_timestamp_seconds
#   ci_merge_queue_entries, ci_merge_queue_head_wait_seconds,
#   ci_hosted_runs_queued, ci_hosted_runs_in_progress,
#   ci_hosted_runs_*_by_workflow, ci_workflow_run_median_seconds
#                                 fleet-metrics-export.service — now a ~45-line
#                                 curl/jq/gh probe, no Python. GitHub's CI
#                                 conclusion, merge-queue state and Cursor's
#                                 prepaid bucket live behind vendor APIs with
#                                 no /metrics endpoint; this is the smallest
#                                 reader for them.
#
# probe_success was NOT available when these rules were first cut (no
# blackbox_exporter, empty vector). Another lane of this same sweep installed
# it (be38630df), so ProductDown below uses it instead of a bespoke gauge.
#
# The 53 deleted rules all read fleet_* gauges produced by the 4,679-line
# libexec/fleet-metrics-export.py and its SLO/quality libraries, which this
# sweep deleted. A rule with no producer is worse than no rule: it reads as
# coverage and can never fire.
#
# severity routing (config/alertmanager.yml): nish -> telegram (Nish's phone),
# page -> telegram, critical/warning/none -> prometheus-am-executor (repair
# dispatch). Only money reaches the phone as severity=nish.

groups:
  - name: fleet_watchdog
    rules:
      # Always firing. Its ABSENCE is the signal: if this stops arriving,
      # Prometheus or Alertmanager is dead and every other rule below is
      # silently unenforced.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog heartbeat for the alerting pipeline"
          description: "Always firing. If this disappears, Prometheus or Alertmanager is dead."

      # Every non-money rule terminates in prometheus-am-executor, which
      # dispatches the repair. If it is down, alerts fire into nothing.
      - alert: RepairDispatchDown
        expr: up{job="am-executor"} == 0
        for: 5m
        labels:
          severity: page
          service: fleet
        annotations:
          summary: "prometheus-am-executor is down — alerts cannot dispatch repair"
          description: "The repair-dispatch receiver is not scrapeable. Until it returns, every critical/warning alert is silent. Repair: systemctl --user status prometheus-am-executor."

      # fleet-ops#6845: the last hop of the nish/page rail can fail silently.
      # amtool alert add is synchronous (a refused POST is loud), but a dead
      # telegram sender or a down alertmanager leaves the escalation
      # accepted-and-undelivered — the same dark-channel class as the
      # NISH-ESCALATIONS.md starvation this issue recorded, on the only rail
      # that still exists. severity=critical -> repair-dispatch summons a
      # repair worker, never the phone: telegram is the thing that is broken.
      - alert: FleetNishPageRailDown
        expr: increase(alertmanager_notifications_failed_total{integration="telegram"}[10m]) > 0 or absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
          service: escalation
        annotations:
          summary: "Nish page rail is dark — telegram sends failing or alertmanager down"
          description: "alertmanager_notifications_failed_total{integration=\"telegram\"} rose in the last 10m, or up{job=\"alertmanager\"} is 0/absent. severity=nish and severity=page alerts are accepted but not reaching the phone. Repair: systemctl status prometheus-alertmanager; check /etc/prometheus/telegram_bot_token; run 'amtool alert query severity=nish' for the accepted-but-undelivered backlog."

  - name: fleet_money
    rules:
      # MONEY. The only rules on this file that reach Nish's phone.
      #
      # LiteLLM enforces the budget itself (it 400s the request when a key or
      # deployment is over max_budget); this rule exists so a key running DOWN
      # is visible before the fleet stalls on a hard wall. Both series come
      # straight from LiteLLM's prometheus callback.
      - alert: LitellmKeyBudgetNearlyExhausted
        expr: (litellm_remaining_api_key_budget_metric / litellm_api_key_max_budget_metric) < 0.10
        for: 10m
        labels:
          severity: nish
          service: money
        annotations:
          summary: "LiteLLM key {{ $labels.api_key_alias }} has under 10% of its budget left"
          description: "litellm_remaining_api_key_budget_metric for key alias {{ $labels.api_key_alias }} is below 10% of its max_budget. When it reaches zero LiteLLM hard-refuses the key and the fleet stalls. Money is Nish-reserved: raising a budget is his call, not the fleet's. Inspect with: curl -s 127.0.0.1:4000/key/info -H \"Authorization: Bearer $LITELLM_MASTER_KEY\"."

      # Prepaid vendor credit is only visible through the vendor API, so it
      # arrives via the one curl|jq textfile reader.
  - name: fleet_seat_proxy
    rules:
      # The seat proxy is the single routing organ. Nothing reaches a model
      # without it.
      - alert: FleetLitellmProxyAbsent
        expr: absent(up{job="litellm"}) or up{job="litellm"} == 0
        for: 5m
        labels:
          severity: critical
          service: seat-proxy
        annotations:
          summary: "LiteLLM seat proxy is down or unscrapeable"
          description: "up{job=\"litellm\"} is 0 or absent. Every pi worker routes through this proxy, so the whole fleet is stalled. Repair: systemctl --user status fleet-litellm-proxy, then journalctl --user -u fleet-litellm-proxy -n 100."

      # FleetLitellmDeploymentUnhealthy fires only on a wall that will NOT
      # clear by itself. litellm_deployment_state is the proxy's OWN metric
      # (0 healthy, 1 partial, 2 complete). Raw health rows carry
      # litellm_model_name = the provider/model string (always contains "/");
      # the group-alias rows (worker-cheap, senior, ...) flap with every
      # request-path cooldown and are excluded by the regex.
      #
      # fleet-ops#8398: a 429/quota wall resets (daily, or a 30-day cycle even
      # if the day's budget was burned at once), so it must NOT page. The rung
      # stays LIVE with its own `cooldown_time` in litellm_params; the router
      # routes around it and re-probes it by itself. The `unless` matcher is
      # the matcher-value fix (no new organ, stock metric): a deployment that
      # produced a 429 cooldown event in the lookback window is already being
      # handled by LiteLLM and is dropped from the alert. Two parts are
      # load-bearing:
      #   - exception_status="429" ONLY. LiteLLM cools a 401/404 down too
      #     (router_utils/cooldown_handlers.py), so a cooldown-event match with
      #     no status filter would silence every dead wall this alert exists to
      #     catch. A dead 401/404 rung still pages.
      #   - the window must be >= that deployment's cooldown_time, or the alert
      #     re-fires between the cooldown's start and its expiry. The
      #     alert-visible (slash-named) quota rungs carry cooldown_time 300s
      #     (pareto) and 900s (synthetic); 1h is 4x the max. Widen this window
      #     if a slash-named rung ever gets a longer cooldown_time.
      #
      # Bench only a wall that cannot clear by itself: 401, 402 with no stated
      # renewal, 404, or model gone. Every bench entry records retry_at and
      # arms a one-shot restore probe at retry_at (recipe in the description).
      - alert: FleetLitellmDeploymentUnhealthy
        expr: max((litellm_deployment_state{model_id!="", litellm_model_name=~".*/.*"} > 0) unless on(model_id) (increase(litellm_deployment_cooled_down_total{exception_status="429"}[1h]) > 0)) > 0
        for: 10m
        labels:
          severity: critical
          service: seat-proxy
        annotations:
          summary: "a routed litellm deployment has been unhealthy for 10m+ and is not in a 429 cooldown the router is managing"
          description: "litellm_deployment_state > 0 sustained on a raw deployment row, with no 429 cooldown event in the last hour — a wall LiteLLM is not clearing by itself (fleet-ops#5792, #8398). Repair, in order: (1) GET /health with the master key to name the rung (unhealthy_endpoints) and probe it directly (chat AND tool_choice=required). (2) A 429 or quota wall that resets keeps its rung LIVE: put `cooldown_time: 300` in that deployment's litellm_params so the router routes around it and re-probes it by itself. (3) Bench ONLY a wall that will not clear: 401, 402 with no stated renewal, 404, or model gone — add the entry to config/litellm-proxy.yaml's benched: block with a dated reason AND `retry_at:` (the provider's stated reset/renewal date, else now + 24h). (4) Arm the restore probe for that bench with the house one-shot pattern: systemd-run --user --collect --unit later-fleet-ops-<N> --on-calendar='<retry_at> Asia/Kolkata' -- gh issue edit <N> --repo Nishfleet/fleet-ops --add-label agent-ready, where <N> is a restore-probe issue filed at bench time. Restore only with a green probe cited in the PR."

  - name: fleet_backups
    rules:
      # Backups. Both series are written by /usr/local/sbin/restic-r2-restore-test
      # into restic-restore-test.prom — a restic textfile, independent of any
      # fleet exporter.
      - alert: ResticRestoreProofStale
        expr: (time() - fleet_restore_drill_last_success_seconds > 28800) or absent(fleet_restore_drill_last_success_seconds)
        for: 15m
        labels:
          severity: critical
          service: backups
        annotations:
          summary: "no proven restic restore in 8+ hours"
          description: "restic-r2-restore-test.timer runs every 6h and only writes fleet_restore_drill_last_success_seconds after a --verify restore actually succeeds. Stale means the backup is unproven, which is the same risk as no backup. Repair: systemctl start restic-r2-restore-test.service and read its journal."

      # Restored 2026-09-19 (claude-vps "verify", glue sweep). f65e812c4 cut this
      # with 52 others, but it belongs to the classes the exporter cut KEPT: it
      # guards a live prepaid seat, and it rides a stock metric -- the script
      # writes fleet_grok_token_refresh_last_success_seconds into node_exporter's
      # textfile collector (/var/lib/prometheus/node-exporter/
      # fleet-grok-token-refresh.prom), scraped and queryable now. No fleet
      # exporter is involved. grok-token-refresh.service is a USER timer, so
      # node_exporter's systemd collector (system units only) cannot see it --
      # this textfile metric is the only signal that the timer still runs, and
      # the seat 401s within 6h of it stopping.
  - name: fleet_host
    rules:
      # Host rules are here because a full disk or an exhausted machine takes
      # out the backups and the seat proxy — they are not general host
      # monitoring, and the load/inode/predict_linear variants were cut.
      - alert: SystemUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "system unit {{ $labels.name }} failed"
          description: "Root-level systemd unit {{ $labels.name }} is in failed state. Repair: systemctl status {{ $labels.name }} and journalctl -u {{ $labels.name }} -n 100."

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) < 0.10
        for: 10m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "filesystem {{ $labels.mountpoint }} below 10% free"
          description: "A full disk fails the restic backup and the LiteLLM postgres write path. Repair: reclaim space, starting with agent worktrees under ~/workspaces/agent-worktrees."

      - alert: MemoryPressureHigh
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.08
        for: 15m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "under 8% memory available"
          description: "systemd-oomd starts reaping at this point, and it does not preferentially spare the seat proxy or postgres. Repair: check the pi-issue@ worker count against the 25-worker cap in the intake prompt."

  - name: product_surface
    rules:
      - alert: Product0509TimelineDark
        expr: min_over_time(probe_success{job="blackbox-0509-timeline"}[1h]) == 0
        for: 5m
        labels:
          severity: critical
          service: 0509
        annotations:
          summary: "0509 /timeline is dark for {{ $labels.instance }}"
          description: "Every probe in the last hour of {{ $labels.instance }} failed: the page did not return 200 with BOTH the 'As of' retrieval affordance and a rendered f9-timeline-entry row. A 410 is the proof-gate dark state (rows stored but the public timeline filtered them out, issue #1284); a 200 with 'As of' but no entry row is the empty or D1-failure shell. This is the customer-visible promise of issue #1899 — a buyer follows a competitor and sees an empty ledger. Repair: check the nightly capture (runDemoBrandBackfill) and the proof gate."

      - alert: Product0509SearchTierRegression
        expr: min_over_time(probe_success{job="blackbox-0509-search-tier"}[2h]) == 0
        for: 5m
        labels:
          severity: critical
          service: 0509
        annotations:
          summary: "0509 /search renders no verified/likely row for {{ $labels.instance }}"
          description: "Every probe in the last two hours of {{ $labels.instance }} failed: the page rendered no 'f9-tier-badge is-verified' or 'is-likely' row. That is either a dead-end (no rows at all) or a blanket-Unmatched tier-label regression on a section 1.8 money-path brand (issue #1452). The free preview dead-ends for this brand. Repair: check search-v2 identity resolution and the tier-label path."

      - alert: Product0509SearchAliasGapDeadEnd
        expr: min_over_time(probe_success{job="blackbox-0509-search-aliasgap"}[2h]) == 0
        for: 5m
        labels:
          severity: critical
          service: 0509
        annotations:
          summary: "0509 /search dead-ends entirely for known-alias-gap brand {{ $labels.instance }}"
          description: "Every probe in the last two hours of {{ $labels.instance }} returned no result row at all. These brands (oura Nishfleet/0509#1427, ridge Nishfleet/0509#2075) are KNOWN_ALIAS_GAPS: a blanket-Unmatched page is the named gap's expected symptom and deliberately does NOT alert. A DEAD-END does, because the guard's core promise is zero dead-end empty states. Repair: this is a recall regression, not the alias gap — check ad ingestion for the brand."

      # The three rules above can only fire while the blackbox exporter is
      # actually scraped. If it stops, they all read as healthy forever —
      # the same blind spot FleetProbeStale closes for fleet.prom.
      - alert: ProductCanaryProbeDown
        expr: min_over_time(up{job=~"blackbox-0509-.*"}[1h]) == 0
        for: 10m
        labels:
          severity: critical
          service: 0509
        annotations:
          summary: "blackbox canary job {{ $labels.job }} has not scraped successfully in an hour"
          description: "While this fires, Product0509TimelineDark, Product0509SearchTierRegression and Product0509SearchAliasGapDeadEnd cannot fire and the 0509 public surface is UNGUARDED. Repair: systemctl status prometheus-blackbox-exporter (listens on 127.0.0.1:9115)."
