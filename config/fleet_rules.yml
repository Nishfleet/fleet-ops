groups:
  - name: fleet_watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog heartbeat for the alerting pipeline"
          description: "Always firing. If this disappears, Prometheus or Alertmanager is dead."

      - alert: FleetHeartbeatStale
        expr: (time() - fleet_timer_last_trigger_seconds{timer="fleet-heartbeat.timer"}) > 7200
        for: 2m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet-heartbeat.timer has not fired in 2+ hours"
          description: "Fleet orchestrator heartbeat is dead; nothing is dispatching or repairing."

      - alert: FleetMetricsExportStale
        expr: (time() - node_textfile_mtime_seconds{file=~".*fleet.prom"}) > 1200
        for: 2m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet metrics exporter frozen for 20+ minutes"
          description: "Timer alerts are blind; fleet-metrics-export.timer or its script is dead."

      - alert: FleetMetricsExportMissing
        expr: absent(node_textfile_mtime_seconds{file=~".*fleet.prom"})
        for: 5m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet metrics textfile missing"
          description: "fleet.prom is gone from the node-exporter textfile dir."

      - alert: DetachedJobDied
        # fleet-ops#4266: a pi-systemd-run unit ended WITHOUT its deliverable
        # (even at exit 0 — a clean stop never fires OnFailure, so the
        # STOP-REASON + /fail ping + gauge 1 written by pi-detached-deadman
        # are the only failure signal). Series are cleared by the deadman on
        # a success verdict or by pi-detached-deadman --clear after the
        # repair worker relaunches.
        expr: fleet_detached_job_died == 1
        for: 1m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "Detached job {{ $labels.unit }} ended without its deliverable"
          description: "unit={{ $labels.unit }} dispatch={{ $labels.dispatch }} deliverable_promised={{ $labels.deliverable }} deadline={{ $labels.deadline }} (fleet-ops#4266). deliverable_promised is a 0/1 FLAG from the fleet_detached_job_died series, NOT a path: 0 = the run promised no artifact, so relaunch with the same --stdin packet and OMIT --deliverable; 1 = it promised one, so pass the real artifact path. Never pass the literal 0/1 (it resolves to <workdir>/0 and can never exist — live 2026-09-10: a repair worker passed `--deliverable 0` and false-tripped the auditor on a migration that had already merged). Then run: fleet-who-stopped {{ $labels.unit }} and post the audit line to the auditor. Clear the dead-man once relaunched: pi-detached-deadman --clear {{ $labels.unit }} (fleet-ops#4921: both commands are on PATH, symlinked from the canonical checkout /home/nish/workspaces/tooling/fleet-ops-deploy-clone/ — never a cwd-relative `bin/...` path, which made repair workers guess the wrong checkout and swallow a pi-detached-deadman ENOENT)"

      - alert: FleetUndersatGuardAbsent
        expr: absent(fleet_pi_workers_active)
        for: 3h
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "undersaturation guard metrics absent — the never-idle guard is missing or dead"
          description: "Repair worker: (re)build per /home/nish/workspaces/agent-state/alert-repair/packet-13-undersaturation-guard.md until fleet_pi_workers_active exports. Check unit undersat-guard-r2-20260827 first."

      - alert: FleetPiSeatUnhealthy
        expr: fleet_pi_seat_healthy == 0
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "Pi seat unhealthy for 30+ minutes"
          description: "pi-seat-health.json reports a non-healthy seat class."

      # fleet-ops#3111: a stale pi-seat-health.json is UNKNOWN, never "healthy".
      # The 2026-09-03 incident left the console tile green on a 2-day-old
      # observation while the transport was down 33h. -1 = no observation at all.
      - alert: FleetPiSeatHealthStale
        expr: fleet_pi_seat_health_age_seconds == -1 or fleet_pi_seat_health_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "Pi seat health observation is stale or absent (>30 min)"
          description: "pi-seat-health.json has not been refreshed in over 30 minutes (or is absent/unparseable, age=-1). The console 'seat healthy' tile is NOT trustworthy while this fires — treat the seat as UNKNOWN, never healthy. Check pi-transport-check (journalctl --user -u pi-transport-check) and the seat-health extension. fleet-ops#3111."

      # fleet-ops#3111: stale cap=0 seats need re-audition. seat-lib
      # auto-expires them to cap=1 after 14d, but sustained > 0 here means
      # seats are lingering at cap=0 past their re-audition date — the
      # 2026-09-03 incident showed groq/inferx/orcarouter sitting for weeks.
      - alert: FleetSeatCap0Stale
        expr: fleet_seat_cap0_stale_total > 0
        for: 1h
        labels:
          severity: info
          service: fleet
        annotations:
          summary: "stale cap=0 seats need re-audition or will auto-expire"
          description: "One or more seats are at cap=0 with intentional_cap_zero=stale — they have a dated re-audition reason and have not been re-probed. seat-lib auto-expires them to cap=1 after 14d (SEAT_CAP_ZERO_STALE_TTL_S); this alert fires 1h after the first stale seat appears so the operator can re-audition BEFORE the auto-expiry (probe the seat live; if it works, restore the cap; if not, re-date the reason). The per-seat fleet_seat_cap0_stale series names each seat with its age_seconds. fleet-ops#3111."

      - alert: FleetDeadCredentialSeats
        expr: fleet_pi_seat_dead_credential_total > 0
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "dead-credential seats need re-auth or retirement"
          description: "One or more ENROLLED (model cap>0) seats are seat_dead=true carrying a credentials_bad signal (HTTP 401/403) in health_class or failure_mode, and will not recover on their own (fleet-ops#1445, fleet-ops#2667, fleet-ops#3301). Cap=0 rows are excluded: pick_seat never routes to them, so a 401 there is not a re-auth action. The per-seat fleet_pi_seat_dead_credential series names each seat and its health_class. Triage: probe the seat live AND probe a second model on the same provider as a control. If the control also fails, the credential is dead -> re-auth. If the control succeeds, the credential is fine and the MODEL is gone (a provider can return 401/403 for a retired slug) -> retire that model row in config/seat-caps.json at cap 0 with intentional_cap_zero=corpse and a dated reason. health_class=corpse means terminal: re-auth cannot help, retire it. Ledger: /home/nish/workspaces/agent-state/lanes/seats."

      # fleet-ops#2407: a walled seat whose usable_at/bench_until has passed is
      # RELEASED by the router (seat_usable fail-opens) but stays classed
      # non-healthy in the ledger until something re-observes it. Sustained >0
      # here means seats linger past their comeback with nobody probing them —
      # the exact "benched indefinitely" failure the issue names. The
      # seat_availability rollup counts released seats as available, so this
      # alert is the loud backstop that keeps a quiet-lingering seat visible.
      - alert: FleetSeatComebackOverdue
        expr: fleet_seat_comeback_overdue_total > 0
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "seat comeback overdue — wall past usable_at, still unobserved"
          description: "One or more seats are still classed non-healthy with their usable_at/bench_until in the past by MORE than one probe interval (900s, fleet-ops#2806): the releaser had a full 15-min cycle to re-probe (re-anchor on a fresh failure, unwall on a success) and did not, so they linger as an unproven walled state past the releaser's cadence. The per-seat fleet_seat_comeback_overdue series names each seat; the releaser's fleet_seat_comeback_release_interval_breached gauge fires on the same boundary from inside the sweep. Repair worker: probe each named seat (a 1-token reply-OK probe or a real dispatch); a success writes a healthy observation and clears it, a fresh failure re-anchors usable_at and clears it. Inspect the seat-health ledger at /home/nish/workspaces/agent-state/lanes/seats and journalctl --user -u fleet-seat-comeback-release.service."

      # fleet-ops#2421: the ACTIVE release path (fleet-seat-comeback-release)
      # re-probes a seat whose wall clock has passed and unwalls a
      # provably-usable seat, so an expired wall self-heals within one 15-min
      # tick instead of lingering classed walled. A sweep that finds expired
      # walls and releases nothing (probe blocked / extension not
      # re-anchoring) renders stall=1 and skips the last-green write, so the
      # release-path-is-dead condition is loud twice: this stalled alert and
      # the absent/stale alert below. 1h-for matches FleetSeatComebackOverdue.
      - alert: FleetSeatComebackReleaseStalled
        expr: fleet_seat_comeback_release_stalled == 1
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "seat come-back release stalled — expired walls remain and nothing was released"
          description: "fleet-seat-comeback-release swept but walled seats still hold EXPIRED wall clocks and released_this_run was 0 (fleet-ops#2421): neither a release (healthy probe) nor a re-anchor (extension write) happened, so the release path is broken for those seats. Inspect the seat-health ledger at /home/nish/workspaces/agent-state/lanes/seats, journalctl --user -u fleet-seat-comeback-release.service, and the pi/seat-health extension state. A seat named by the organ's LOUD line is either unroutable via pi (provider config) or failing without a ledger write (seat-health extension)."

      # fleet-ops#2806: interval-breach — a walled seat whose usable_at has
      # been past for MORE than one probe interval (900s, the same boundary
      # the comeback-overdue metric now graces) after a completed sweep. The
      # stalled rule above keys on wall_end_of (bench_until ?? usable_at),
      # which the extension re-anchors into the future on every failed
      # probe, so a chronically-failing seat (the lived 2026-09-02 nemotron
      # 8h case) never trips it. This gauge reads the RAW usable_at: past by
      # >1 interval at sweep end means the releaser had a full probe cycle
      # to re-probe (re-anchor or unwall) and did not — a falsed sweep, a
      # dead timer, or a mid-loop crash. The organ exits 1 (OnFailure
      # escalates, last-green goes stale) the moment it fires; this rule
      # keeps the sustained case visible at the alert plane.
      - alert: FleetSeatComebackReleaseIntervalBreached
        expr: fleet_seat_comeback_release_interval_breached_total > 0
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "seat comeback releaser missed a full probe cycle — seat(s) past usable_at by >1 interval"
          description: "fleet-seat-comeback-release ended a sweep with fleet_seat_comeback_release_interval_breached_total>0 (fleet-ops#2806): at least one walled seat's usable_at is in the past by more than one probe interval (900s) after the sweep, so the releaser had a full cycle to re-probe it (re-anchor on failure, unwall on success) and did not. Inspect journalctl --user -u fleet-seat-comeback-release.service for the LOUD [COMEBACK-RELEASE-INTERVAL-BREACH] line naming each seat, and verify the fleet-seat-comeback-release.timer is firing every 15 min."

      # fleet-ops#2421: organ heartbeat. fleet_seat_comeback_release_last_green_seconds
      # is written only by a clean sweep (no stuck release path), so absent()
      # catches a missing file, ==0/stale catches a stuck organ. 2h = 8 missed
      # 15-min cycles.
      - alert: FleetSeatComebackReleaseAbsent
        expr: absent(fleet_seat_comeback_release_last_green_seconds) or fleet_seat_comeback_release_last_green_seconds == 0 or (time() - fleet_seat_comeback_release_last_green_seconds) > 7200
        for: 2h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "fleet seat come-back release organ absent — no clean sweep in 2h"
          description: "fleet-seat-comeback-release has not written a clean (unstalled) sweep in over 2 hours (fleet-ops#2421). Repair worker: check the timer (fleet-seat-comeback-release.timer) is enabled and journalctl --user -u fleet-seat-comeback-release.service. The organ re-probes walled seats whose wall clock has passed and unwalls provably-usable ones; its death means released_n stays 0 again."

      # fleet-ops#2638: never-probed comeback visibility. A seat in this gauge
      # means the comeback-release prober has fired on it >=10 times across
      # recent re-bench windows and the seat still has not recovered. The
      # bin's corpse path (fleet_seat_comeback_release_corpse_total,
      # SEAT_DEAD_CONSECUTIVE_THRESHOLD, default 25) should terminate it on
      # the next sweep; sustained > 0 here for 1h+ means the corpse write is
      # not landing (the bin is failing to write the ledger, the threshold
      # config drifted, or the provider is failing faster than the bin can
      # probe). Pages so the repair worker can inspect before the seat's
      # loud-stall check fires. The per-seat series names the stuck seat.
      - alert: FleetSeatComebackNeverReleased
        expr: fleet_seat_comeback_never_released_total > 0
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "seat never released — comeback-release prober keeps failing on the same seat"
          description: "One or more seats have been probed >=10 times by the comeback-release organ without recovery (fleet-ops#2638). The bin's corpse path (SEAT_DEAD_CONSECUTIVE_THRESHOLD, default 25) should terminate these on the next sweep; sustained > 0 here for 1h+ means the corpse write is not landing. The per-seat fleet_seat_comeback_never_released series names the stuck seat. Repair worker: inspect /home/nish/workspaces/agent-state/lanes/seats/<seat>.json (consecutive_failure_count must be climbing), journalctl --user -u fleet-seat-comeback-release.service, and the provider's reachability."

      # fleet-ops#5285: benches lie. fleet_seat_bench_lied_total{provider,model}
      # increments every time the bench-truth PONG probe clears a bench — the
      # ledger benched a seat the provider would actually serve (the lived
      # Devin phantom benches: swe-1-7 benched 6 DAYS on a minutes-scale 429
      # while a live probe answered PONG first try; the highest-yield lane
      # idled up to 45 min per phantom bench). >3 cleared benches in 6h for
      # one provider means the bench WRITER for that provider is lying
      # systematically — repair, never page Nish: the alert-repair
      # dispatcher owns the repair packet.
      - alert: FleetSeatBenchLied
        expr: increase(fleet_seat_bench_lied_total[6h]) > 3
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "bench lie — {{ $labels.provider }} benches cleared by live probe >3x in 6h"
          description: "fleet-ops#5285: the bench-truth PONG probe (fleet-seat-comeback-release --false-wall-only, 15-min cadence) has cleared more than 3 benches on provider {{ $labels.provider }} in 6h — benches on this provider are systematically phantom (the ledger benches seats the provider would serve; the lived Devin swe-2 class). Repair worker: identify the writer (journalctl --user -u fleet-seat-comeback-release.service SEAT-WALL-FALSE lines name the writer field), check the provider's parsed reset windows against its real 429 text, and inspect /home/nish/workspaces/agent-state/lanes/seats/<seat>.json source=bench_truth_probe records. Do NOT silence the probe; the probe IS the un-bench primitive."

      # fleet-ops#2712: provider-level (account-level) quota exhaustion.
      # A provider with >=2 quota_exhausted seats observed within 1h
      # (HTTP 402 + health_class=quota_exhausted) is a billing-wall pattern,
      # not three independent seat faults. The per-seat
      # health_class=quota_exhausted signal alone collapsed three failures
      # into one root cause (e.g. a metered provider's deepseek-v4-pro + gpt-5.6-sol +
      # qwen3.8-max all 402 at once) and depressed the seat_availability
      # SLO without distinguishing them. Pages so the operator can triage
      # ONE billing wall, not three seat threads. 30m-for matches the
      # FleetSeatComebackOverdue cadence.
      - alert: FleetProviderQuotaExhausted
        expr: fleet_provider_quota_exhausted_total > 0
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "provider-level quota exhaustion — one billing wall, multiple seats 402"
          description: "fleet-ops#2712: a provider has >=2 seats reporting HTTP 402/health_class=quota_exhausted within the last 1h. The per-provider fleet_provider_quota_exhausted{provider=\"...\"} series names the affected provider and its seat count; the seat-health ledger at /home/nish/workspaces/agent-state/lanes/seats lists each seat. This is ONE account-level billing wall, not N independent seat faults — triage the provider's quota/billing, not each seat separately. Until the billing wall clears the seat_availability SLO burn is expected (quota_exhausted seats are held unconditionally; see _SEAT_RELEASE_AT_EXPIRY_CLASSES in libexec/fleet-metrics-export.py)."

      # fleet-ops#4217: a seat's live quota figure has gone stale.
      # fleet_seat_quota_observed_seconds is "seconds since the quota was last
      # observed from the provider" — the exporter now stamps it with the real
      # observation time (the fetch, or the cache's own ts when a dying fetch
      # serves a stale cache). A healthy read is 0-300s on the 5-min export
      # cadence. > QUOTA_STALE_S (900s, 15 min) means the provider's own quota
      # endpoint has stopped answering or its credential/session died, so the
      # shown remaining% is stale. absent() on the whole family fires when the
      # exporter's quota path is broken entirely (no provider emits a row). This
      # is the "Stale >15 min => absent, and an absent() alert" acceptance item
      # — the metric powering it never reported a real age before, so no alert
      # could ever fire.
      - alert: FleetSeatQuotaStale
        expr: fleet_seat_quota_observed_seconds > 900 or absent(fleet_seat_quota_observed_seconds)
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "live seat quota observation stale or absent (>15 min, fleet-ops#4217)"
          description: "fleet-ops#4217: a provider's fleet_seat_quota_observed_seconds is > QUOTA_STALE_S (900s, 15 min) OR the whole fleet_seat_quota family is absent from fleet.prom. The provider's remaining% figure is stale — its quota endpoint stopped answering or its credential/session died on this VPS. The per-provider fleet_seat_quota_observed_seconds{provider=\"...\"} series names the seat; repair the credential/session as in #4233 (credential-blocked API seats) / #4232 (browser-dashboard seats), or investigate the endpoint. A healthy exporter re-fetches every 5 min, so this firing means the provider has not been observed for a full 15 min."

      # fleet-ops#4611: the claude OAuth quota meter went silently absent for 7d
      # because a 401 fetch dropped the whole claude family and the generic
      # FleetSeatQuotaStale absent() leg never fired (other providers kept the
      # family present). The exporter now ALWAYS emits a growing
      # fleet_seat_quota_observed_seconds{provider="claude",source="stale"} on a
      # dead fetch (http 401/429 -> api.anthropic.com/api/oauth/usage), so this
      # rule's first leg fires, and the second leg fires if the claude gauge is
      # missing entirely. claude is a real billable seat: a dark meter is
      # invisible spend risk under the zero-revenue standing rule (fleet-ops#3150)
      # — no spend without Nish's visibility.
      - alert: FleetClaudeQuotaStale
        expr: fleet_seat_quota_observed_seconds{provider="claude"} > 900 or absent(fleet_seat_quota_remaining_pct{provider="claude"})
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "claude OAuth quota meter stale or absent (>15 min, fleet-ops#4611)"
          description: "fleet-ops#4611/#4670: fleet_seat_quota_observed_seconds{provider=\"claude\"} is > QUOTA_STALE_S (900s, 15 min) OR fleet_seat_quota_remaining_pct{provider=\"claude\"} is absent from fleet.prom — the claude OAuth usage endpoint (api.anthropic.com/api/oauth/usage) stopped answering or the file login at ~/.claude/.credentials.json is dead (HTTP 401/429). claude is a real billable seat; a dark meter is invisible spend risk under the zero-revenue rule (fleet-ops#3150). The exporter refreshes that file token via platform.claude.com/v1/oauth/token before the 8h expiry (setup-token is inference-only and is never used). If this still fires, the refresh grant failed or the usage endpoint is 429ing; repair the file login or investigate the endpoint."

      # fleet-ops#3284 (child of #3150): the zero-revenue standing rule needs a
      # hard money boundary, not just a digest line. Two legs, per provider:
      #   - fleet_seat_spend_today_usd > 5 — current-UTC-day metered spend over
      #     the $5/day line. The day-labelled fleet_seat_spend_usd series cannot
      #     express "today" in a static PromQL rule (the day label is a date
      #     string, not comparable to now()), so the exporter also emits this
      #     day-less copy of the current day's row.
      #   - fleet_seat_credits_remaining_usd < 5 — the vendor-reported balance
      #     is under $5. A fetch failure OMITS the series rather than emitting
      #     a fake 0 (_cached_vendor_json -> None), so a vendor API outage
      #     cannot false-fire this leg.
      # severity=warning routes to repair-dispatch, never the phone directly —
      # the Nish route is the repair worker writing a MONEY-BOUNDARY entry to
      # NISH-ESCALATIONS.md, which the nish-boundary-notify.path unit delivers
      # (the class-'money' page; MONEY-BOUNDARY is Nish-reserved by rule).
      # for:5m rides out a single mid-write textfile scrape or a one-tick
      # export blip; a real breach holds for the rest of the UTC day anyway.
      #
      # fleet-ops#4627: starvation gate. A dry METERED provider is a lane
      # fault, not a money decision, while any prepaid/free seat can carry
      # the work. The alert fires ONLY when the fleet is starved — zero
      # healthy prepaid/free seats (fleet_seat_healthy{class=~"prepaid|free"}
      # == 0 or absent). The `and on()` applies the fleet-wide condition to
      # every per-provider boundary series, so a firing alert with healthy
      # prepaid seats is bench+log, never a page. Defense-in-depth: the
      # writer (bin/money-boundary-raise) and the notifier
      # (bin/nish-boundary-notify) each re-check the seat state so a
      # hand-written or stale line is also suppressed.
      - alert: FleetProviderSpendBoundary
        expr: (fleet_seat_spend_today_usd > 5 or fleet_seat_credits_remaining_usd < 5) and on() (sum(fleet_seat_healthy{class=~"prepaid|free"}) == 0 or absent(fleet_seat_healthy{class=~"prepaid|free"}))
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "provider {{ $labels.provider }} crossed the USD 5 money boundary AND the fleet is starved (no healthy prepaid/free seat)"
          description: "fleet-ops#3284/#4627: provider {{ $labels.provider }} breached the money boundary — fleet_seat_spend_today_usd > 5 (current-UTC-day metered spend) and/or fleet_seat_credits_remaining_usd < 5 (vendor-reported balance) — AND the fleet is starved (fleet_seat_healthy{class=~\"prepaid|free\"} == 0, no healthy prepaid/free seat can carry the work). A dry metered provider with healthy prepaid/free seats is a lane fault, not a money page; this alert is gated to fire only on starvation. Repair worker — run the deterministic money-wall raise bin/money-boundary-raise in the fleet-ops deploy clone: 'bin/money-boundary-raise {{ $labels.provider }} <spend_today_usd from fleet_seat_spend_today_usd> <credits_remaining_usd from fleet_seat_credits_remaining_usd>'. That ONE script does BOTH required steps IN ORDER in one run (fleet-ops#4477): (1) appends the MONEY-BOUNDARY line to /home/nish/workspaces/agent-state/NISH-ESCALATIONS.md (MONEY-BOUNDARY as the second whitespace field, what nish-boundary-notify.path delivers to Nish's phone), deduped to one phone ping per wall per UTC day, and (2) benches the provider's cap>0 seats via the quota_bench path (source=money_boundary, far-future bench_until +365d, ledger lines under /home/nish/workspaces/agent-state/lanes/seats/) plus the spend-boundary-prebench backup, FAIL-LOUDing (and aborting the bench) if the ledger line cannot be written. The script re-checks fleet starvation before writing the ledger line (fleet-ops#4627): if a healthy prepaid/free seat exists it benches + logs without paging. Do NOT top up, re-auth, or un-bench — money is Nish's alone; only Nish clears the wall. Then report the entries written."

      - alert: FleetKeystoneRoutingAbsent
        expr: absent(fleet_keystone_routing_heartbeat_seconds)
        for: 3h
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "keystone routing organ absent — reliability-first routing is missing or dead"
          description: "fleet-ops#1133: the keystone routing ledger (keystone-routing.jsonl) has not been touched in 3h. pick_seat is not routing keystone packets to strong seats, or the ledger was wiped. Check seat-lib.sh packet_is_keystone / pick_seat keystone branch and the pi-packet state dir."

      # fleet-ops#3324: the minimum-usable floor fail-opens a recoverable
      # bench instead of stalling. A sustained climb on the counter means the
      # fleet is living on slightly-early retries (every tick empty, every
      # tick fail-open) — am-executor repair, not Nish. Money walls never
      # increment this counter. increase() over 5m staying >0 for 30m is
      # "increasing for 30 min".
      - alert: FleetSeatFloorFailopen
        expr: increase(fleet_seat_floor_failopen_total[5m]) > 0
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "seat-floor fail-open climbing for 30 min — fleet living on slightly-early retries"
          description: "Repair worker: pick_seat has been fail-opening the shortest remaining recoverable bench (transient_fault / rate_limited / empty_run / overload_bench) for 30 minutes (fleet-ops#3324). That is a starved capable set, not a money wall. Inspect watch.log for 'seat-floor: fail-open', the seat-health ledger at /home/nish/workspaces/agent-state/lanes/seats, and journalctl --user -u pi-intake@*. A money-walled seat is never fail-opened; if every remaining seat is quota_exhausted / corpse / credentials_bad the counter stays flat and this rule stays silent."

      - alert: FleetTestAlert
        expr: fleet_test_alert == 1
        for: 1m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "Fleet monitoring test alert"
          description: "Synthetic alert for end-to-end proof."

      # fleet-ops#1534: the one meta-alert that pages Nish. severity=page is
      # the ONLY alertmanager route that reaches the phone (config/alertmanager.yml).
      # Fires when the am-executor webhook receiver (prometheus-am-executor.service,
      # 127.0.0.1:9095) is down — the repair path itself is broken, so no
      # critical/warning alert can spawn a repair worker. This is the last
      # resort: if it is silent, the repair path is healthy; if it fires,
      # Nish must intervene manually because the automatic repair path is dead.
      # 2m for: am-executor restarts on transient errors; only a sustained
      # outage pages. Scraped by the am-executor job in config/prometheus.yml.
      - alert: RepairDispatchDown
        expr: up{job="am-executor"} == 0
        for: 2m
        labels:
          severity: page
          service: fleet
        annotations:
          summary: "alert-repair-dispatch webhook receiver is down — the repair path is broken"
          description: "prometheus-am-executor.service (127.0.0.1:9095) has been down for 2+ minutes. No critical/warning alert can spawn a repair worker while this is down. Nish must restart it manually: systemctl --user restart prometheus-am-executor."

  - name: host_and_system
    rules:
      - alert: SystemUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "system unit {{ $labels.name }} failed"
          description: "Root-level systemd unit in failed state; user-level escalation cannot see it."

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) < 0.10
        for: 10m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "filesystem {{ $labels.mountpoint }} below 10% free"
          description: "filesystem {{ $labels.mountpoint }} below 10% free"

      - alert: DiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 30m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "filesystem {{ $labels.mountpoint }} predicted to fill within 24h"
          description: "filesystem {{ $labels.mountpoint }} predicted to fill within 24h based on 6h trend"

      - alert: InodesAlmostFull
        expr: (node_filesystem_files_free / node_filesystem_files) < 0.10
        for: 10m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "inodes {{ $labels.mountpoint }} below 10% free"
          description: "filesystem {{ $labels.mountpoint }} below 10% inodes free"

      - alert: LoadStorm
        expr: node_load1 > 3 * count(node_cpu_seconds_total{mode="idle"})
        for: 2m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "load1 above 3x core count for 2m — restart storm likely"
          description: "node_load1 > 3 * count(idle cpus) (3x nproc). Prevented by oomd + CPUWeight/IOWeight + cgroup scoping; if it still fires, alert-repair-dispatch root-causes it."

      - alert: SustainedLoadHigh
        expr: node_load15 > 12
        for: 30m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "sustained load15 above 12 for 30m"
          description: "Box has 8 vCPUs (nproc=8); threshold = 1.5 * 8 = 12 (fleet-ops#4902, 2026-09-10). The old 0.75*8=6 fired whenever 6+ workers ran their test suites and dispatched a repair worker to 'root-cause the load' (4 packets in 24h on 2026-09-10) — each one added load. A batch box at load15 8-12 is healthy; LoadStorm (3x nproc) stays the real brake, oomd + CPUWeight keep the organs responsive."

      - alert: MemoryPressureHigh
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.08
        for: 10m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "memory available below 8% for 10m"
          description: "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08"

      # fleet-ops#4872: FleetOomdKillsHigh alerts on sum(fleet_oomd_kills_6h) > 3
      # but the textfile exporter only writes samples when journalctl finds
      # systemd-oomd kills of pi-issue@* units, so the name is often absent
      # and the alert can never fire. node_exporter already exports
      # node_vmstat_oom_kill (live counter). Record increase over 6h as the
      # producer. HOST-WIDE: this series carries NO unit= label (kernel OOM
      # counter, not per-cgroup oomd). Do not claim fleet_oomd_kills_6h{unit=...}.
      - record: fleet_oomd_kills_6h
        expr: sum(increase(node_vmstat_oom_kill[6h]))

      - alert: FleetOomdKillsHigh
        expr: sum(fleet_oomd_kills_6h) > 3
        for: 5m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "host-wide OOM kills > 3 in 6h — cut per-worker memory (fleet-ops#4891); trailing 6h window"
          description: "sum(fleet_oomd_kills_6h) > 3 for 5m (fleet-ops#4164, #4872). fleet_oomd_kills_6h is the 6h increase of node_vmstat_oom_kill: host-wide kernel OOM, no unit= label. TRAILING WINDOW: a correct fix cannot clear this alert until the pre-fix kills age out (up to 6h) — do NOT wait for it inside the repair unit (it is killed at 60 min with no context); name the predicted clear time and exit non-zero. REMEDY: there is no hand-tuned admission charge anymore — fleet-ops#4263 deleted the seat-lib RAM governor; worker count is bounded by systemd resources (per-unit MemoryMax + oomd pressure). The host-wide kill source is per-worker memory (pi-issue tsc -b / vitest --coverage); the follow-through work item is fleet-ops#4891 (cut per-worker MemoryPeak < 1G). Do NOT raise the slice MemoryHigh above 12G."

  - name: fleet_self_observation
    rules:
      - alert: FleetThroughputCollapse
        expr: sum(fleet_merged_prs_24h) < 10
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "fleet merged fewer than 10 PRs in 24h; investigate stalls."
          description: "sum(fleet_merged_prs_24h) < 10 for 6h. Family omitted (stale gh cache) does not fire this rule."

      # fleet-ops#3368: the expr keeps the total-greater-than-threshold gate
      # but ANDs it with topk(1, fleet_escalations_24h) so the firing vector
      # carries the dominant producer as its `unit` label. The description
      # (and summary) name that unit so a recurrence is actionable without a
      # manual journal dig. tests/fleet-rules-escalation-storm.test.sh locks
      # the naming via promtool rule unit test.
      - alert: FleetEscalationStorm
        expr: topk(1, fleet_escalations_24h) and on() (sum(fleet_escalations_24h) > 300)
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "escalation volume abnormal; dominant producer {{ $labels.unit }}"
          description: "sum(fleet_escalations_24h) > 300 for 30m; top producer {{ $labels.unit }}={{$value}}."

      # fleet-ops#1199: tightened from 2h to 30m. The 30m floor is enforced
      # by the alert-repair-dispatch mutex (claim/<alert-scope>-<repo> on
      # the target repo) so two dispatches 10s apart cannot both spawn a
      # worker. The threshold is ratchet-managed from this 30m start —
      # raising it back requires a new issue and the same atomic guard
      # to ship with the change.
      - alert: FleetMainRed
        expr: fleet_main_ci_green == 0
        for: 30m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "main branch CI red on {{ $labels.repo }} for 30+ minutes"
          description: "Trunk is broken; merges/deploys unsafe. The alert-repair-dispatch mutex guarantees exactly one repair worker spawns per (alert, repo) pair."

      # fleet-ops#5807: merge-queue head wait + hosted-CI queue depth were
      # blind. 2026-09-12 10:50 IST: the 0509 head #3054 sat AWAITING_CHECKS
      # 2h20m with 14 queued entries and 58 queued + 11 in-progress hosted
      # runs, 0 merges in the last hour — and NO alert (only the unrelated
      # FleetMainRed); a human noticed by hand. The metrics come from the
      # EXISTING 5-min exporter (fleet-metrics-export.py — no new unit, no
      # new timer, no faster polling). The read is skipped while the
      # #1350/#5762 20% rate-limit throttle is breached, and a failed read
      # serves its cache 2h, then the family omits — these absent() legs
      # (fleet-ops#1010: every organ ships its absence alarm) own a dead read
      # path while FleetMetricsExportStale still sees a live textfile. Both
      # severities route to repair-dispatch (config/alertmanager.yml) —
      # neither is a Nish page.
      - alert: CiMergeQueueHeadWaitHigh
        expr: ci_merge_queue_head_wait_seconds > 1200 or absent(ci_merge_queue_head_wait_seconds)
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "merge-queue head wait >20 min on {{ $labels.repo }} (or family absent)"
          description: "fleet-ops#5807: the {{ $labels.repo }} merge-queue head (ci_merge_queue_head_wait_seconds, target <20 min) has exceeded 1200s for 10+ min — its checks are not converging while the entries behind it pile up. Repair worker: (1) name the top slot consumers — get the head PR's waiting checks (`gh pr checks <head-number> -R <repo>`), then group the repo's currently queued+in-progress hosted runs by workflow with count and median duration: `gh run list -R <repo> --limit 200 --json workflowName,status,createdAt,updatedAt --jq 'group_by(.workflowName) | map({workflow: .[0].workflowName, queued: (map(select(.status==\"queued\"))|length), inprogress: (map(select(.status==\"in_progress\"))|length)}) | sort_by(-.queued) | .[:10]'`; (2) consolidate the repeat offenders per 0509#3069, 0509#3068 and 0509#3070 (never a new workflow — PR-only); (3) the alert clears when the head merges or leaves the queue (watch ci_merge_queue_head_wait_seconds fall back under 1200)."

      - alert: CiHostedQueueDepthHigh
        expr: ci_hosted_runs_queued > 30 or absent(ci_hosted_runs_queued)
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: ">30 hosted runs queued on {{ $labels.repo }} (or family absent)"
          description: "fleet-ops#5807: ci_hosted_runs_queued > 30 for 15+ min on {{ $labels.repo }} — the org's ~20-concurrent hosted-jobs plan limit is saturated (58 queued + 11 in-progress at the 2026-09-12 10:50 IST incident), so every further PR waits and the merge-queue head wait (CiMergeQueueHeadWaitHigh) follows. Repair worker: name the top slot consumers — `gh run list -R <repo> --limit 200 --json workflowName,status,createdAt,updatedAt --jq 'group_by(.workflowName) | map({workflow: .[0].workflowName, queued: (map(select(.status==\"queued\"))|length), inprogress: (map(select(.status==\"in_progress\"))|length)}) | sort_by(-.queued) | .[:10]'` — and consolidate the repeat offenders per 0509#3069, 0509#3068 and 0509#3070 (never a new workflow — PR-only)."
  - name: fleet_undersaturation_guard
    rules:
      - alert: FleetUndersaturated
        expr: fleet_pi_workers_active{kind="sum"} < 2 and on (instance, job) fleet_ready_work > 0 and on (instance, job) fleet_maintenance_quiescing == 0
        for: 30m
        labels:
          severity: warning
          service: fleet
          guard: undersaturation
        annotations:
          summary: "workers idle while agent-ready work waits"
          description: "fleet_pi_workers_active{kind=\"sum\"} < 2 with fleet_ready_work > 0 for 30m, and not in the maintenance window. The fleet has ready work and fewer than 2 live workers — concurrency silently dropped. The repair worker should: (1) check Pi seat health (`cat /home/nish/workspaces/agent-state/lanes/pi-seat-health.json`); (2) start the intake loop for every enrolled repo (`for s in 0509 fleet-ops; do systemctl --user start pi-intake@${s}.service || true; done`); (3) verify workers climb (re-check the exporter output and `systemctl --user list-units 'pi-*.service' --state=active,activating`). If workers do not climb within 10 min, fail loud (exit non-zero) so the senior-auditor pipeline picks it up. The weekly maintenance window is excluded by fleet_maintenance_quiescing (read from agent-state/maintenance.json), NOT by the 30m `for` — the window drains workers for >30m."
  - name: fleet_self_maintenance
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR). fleet_self_maintenance_merges
      # is ALWAYS emitted by a live exporter run (even on a no-merge day, as
      # zeros), so absent() fires only when the #1136 code path is dead or
      # removed — not on a quiet day. The ratio gauge itself is omitted when
      # total=0, so the heartbeat keys on the always-present kind="total" gauge.
      - alert: FleetSelfMaintenanceAbsent
        expr: absent(fleet_self_maintenance_merges{kind="total"})
        for: 3h
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "self-maintenance metrics absent — the #1136 ratio/quality exporter path is missing or dead"
          description: "Repair worker: fleet-metrics-export.py must emit fleet_self_maintenance_merges. Check fleet-metrics-export.timer is running and `journalctl --user -u fleet-metrics-export.service` for errors. The #1136 code path (self-maintenance ratio + upgrade/repair/churn classification) is not exporting. Rebuild/restart per /home/nish/workspaces/agent-state/alert-repair/issue-1136-progress.md until fleet_self_maintenance_merges{kind=\"total\"} appears."

      # Regression TREND alert, not a level. fleet2 died at 64% self-maintenance;
      # the level is Nish's policy call, but a 15-point drop versus yesterday's
      # 24h window is physics. offset 24h compares today's rolling 24h ratio to
      # yesterday's; on the first day after deploy the offset is absent so the
      # rule cannot fire (no false alarm during warmup). The ratio is omitted on
      # a no-merge day, so a quiet day never trips this either.
      - alert: FleetSelfMaintenanceRegression
        expr: (fleet_self_maintenance_ratio - fleet_self_maintenance_ratio offset 24h) < -0.15
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "self-maintenance ratio fell 15+ points versus yesterday's 24h window"
          description: "fleet_self_maintenance_ratio dropped by more than 0.15 compared to its value 24h ago, sustained 6h. This is a TREND alert (delta), not a level — the absolute ratio is Nish's policy. fleet2 died at 64% self-maintenance; a sustained drop is the physics to watch. Inspect fleet_self_maintenance_merges{kind=\"self\"|\"product\"} and the merged-PR mix."

      # Churn-share regression TREND. The 2026-08-14 baseline was 49% churn; a
      # 20-point rise versus yesterday is the fleet spending more of its merge
      # budget on churn (chore/refactor/docs/unclassified) and less on
      # upgrade/repair. Trend, not level — the acceptable churn level is policy.
      - alert: FleetQualityChurnRegression
        expr: (fleet_pr_quality_share{class="churn"} - fleet_pr_quality_share{class="churn"} offset 24h) > 0.20
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "churn share of merged PRs rose 20+ points versus yesterday's 24h window"
          description: "fleet_pr_quality_share{class=\"churn\"} rose by more than 0.20 versus its value 24h ago, sustained 6h. TREND alert (delta), not a level. The fleet is merging a growing share of churn (chore/refactor/docs/unclassified) at the expense of upgrade (feat) and repair (fix/test). Inspect fleet_pr_quality_24h{class=...} and recent merge titles."

      # Verified-merges regression TREND (fleet-ops#1136 objective decision,
      # 2026-08-28). The fleet's single optimization target is max
      # quality-throughput: verified, live-proven merged product work per day.
      # Raw merge counts stay on the console; the WFR ratchets against the
      # verified number. A 20-point drop versus yesterday's 24h window is the
      # fleet merging a growing share of unverified work (null diff or no
      # delivery evidence). Trend, not level — the acceptable verified ratio
      # is policy (baseline established on the first instrumented week). The
      # ratio is omitted on a no-merge day, so a quiet day never trips this.
      - alert: FleetVerifiedMergeRegression
        expr: (fleet_verified_merge_ratio - fleet_verified_merge_ratio offset 24h) < -0.20
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "verified-merge ratio fell 20+ points versus yesterday's 24h window"
          description: "fleet_verified_merge_ratio dropped by more than 0.20 compared to its value 24h ago, sustained 6h. TREND alert (delta), not a level. A merged PR is verified when it has a non-null effective diff AND delivery evidence on closure (run-proof:/Verification: run-cue, per lib/exec-review-receipt.py). The WFR ratchets against this verified number, not raw merge counts. A sustained drop means the fleet is merging a growing share of unverified work. Inspect fleet_verified_merges_24h{kind=\"verified\"|\"unverified\"} and recent merge bodies."

  - name: fleet_queue_composition
    rules:
      # Queue composition metrics (fleet-ops#1136 scope addition).
      # Two queues: "agent-ready" (all Nishfleet repos) and "ready-work"
      # (enrolled repos only). The 64% fleet2 death-number is the tripwire
      # (Nish, 2026-08-27 scope addition): warning when any queue's ratio
      # exceeds 64% for a week. The physics signal is the WEEK, so the rule
      # smooths the ratio over the trailing 7d (avg_over_time[7d]) instead of
      # demanding the raw gauge sit above 0.64 for 7 uninterrupted wall-clock
      # days. The instantaneous value dips (product issues land, the queue
      # empties and the series goes stale) and every dip or >5m export gap
      # reset a raw 1w `for:`, so that rule never reached firing
      # (fleet-ops#2171). The 7d average absorbs momentary dips; `for: 6h`
      # only certifies the smoothed breach is steady before it dispatches.
      # The ratio is exported only when total>0, so an empty queue never
      # trips this. Severity=warning feeds the Weekly Review scoring and the
      # precedence-sunset question.
      - alert: FleetQueueSelfMaintenanceRatioHigh
        expr: avg_over_time(fleet_queue_self_maintenance_ratio[7d]) > 0.64
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "queue {{ $labels.queue }} 7-day self-maintenance ratio stayed above 64% (fleet2 death-number) for 6 hours"
          description: "avg_over_time(fleet_queue_self_maintenance_ratio{queue=\"{{ $labels.queue }}\"}[7d]) has been above 0.64 (the fleet2 death-number) for 6+ hours. fleet2 died at 64% self-maintenance; a sustained high ratio in the intake queue means the fleet is queueing machinery work faster than product work. The 7d window absorbs the momentary dips and export gaps that reset the old 1w for: and kept this alert pending forever (fleet-ops#2171). The ratio is exported only when total>0. Feeds Weekly Review scoring and the precedence-sunset question. Inspect fleet_queue_total and fleet_queue_self_maintenance_total for the queue."

      # fleet-ops#4260: needs-orchestrator items must drain through the
      # orchestrator decision pass within ~2h. blocked-reconcile (heartbeat
      # block 6) already starts agent-cron-orchestrator-decision-sweep.service
      # on sight of an item older than 1h; this alert is the backstop for a
      # reconcile that dies or a sweep run that fails — the repair packet
      # re-runs the decision pass by hand. p50 (not max) so one legitimately
      # parked item cannot hold the alert open while the class drains.
      - alert: FleetNeedsOrchestratorStale
        expr: fleet_blocked_issue_age_seconds{kind="needs-orchestrator",quantile="0.5"} > 7200
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "needs-orchestrator issues parked with a median age over 2h — the decision drain is not running"
          description: "fleet-ops#4260: p50 age of open needs-orchestrator issues exceeded 2h. The drain is agent-cron-orchestrator-decision-sweep.service (stock agent-cron-run + prompts/orchestrator-decision-sweep.md, senior-review seat). Repair: run `systemctl --user start agent-cron-orchestrator-decision-sweep.service`, then check `journalctl --user -u agent-cron-orchestrator-decision-sweep -n 80` and the snapshot at /home/nish/.local/state/fleet-heartbeat/blocked-queue.json (needs_orchestrator block). If every seat fails the unit, escalate the seat fault — do not re-park the issues."

  - name: fleet_waste
    rules:
      # Organ heartbeat (fleet-ops#1010). fleet_waste_runs{kind="total"} is
      # ALWAYS emitted by a live waste-ledger export (zeros on a quiet
      # window), so absent() fires only when the #1211 path is dead — not
      # on a no-dispatch day. The ratio gauge itself is omitted when
      # total spend is 0.
      - alert: FleetWasteLedgerAbsent
        expr: absent(fleet_waste_runs{kind="total"})
        for: 3h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "waste-ledger metrics absent — the #1211 loss-accounting exporter path is missing or dead"
          description: "Repair: fleet-waste-export.py must emit fleet_waste_runs{kind=\"total\"}. It piggybacks fleet-metrics-export.service via systemd/fleet-metrics-export.service.d/waste-ledger.conf (no new timer). Check fleet-metrics-export.timer and journalctl --user -u fleet-metrics-export.service."

      # TREND alert, not a level, not a page. WasteRatioRising feeds the
      # Weekly Fleet Review (L3 machinery health + cost). severity=none AND
      # SKIP_SET (alert-repair-dispatch) so a firing trend cannot spawn a
      # repair worker. offset 24h cannot fire on the first day after deploy.
      - alert: WasteRatioRising
        expr: (fleet_waste_ratio - fleet_waste_ratio offset 24h) > 0.15
        for: 6h
        labels:
          severity: none
          service: fleet
        annotations:
          summary: "fleet waste ratio rose 15+ points versus yesterday's 24h window"
          description: "fleet_waste_ratio rose by more than 0.15 versus its value 24h ago, sustained 6h. TREND alert (delta), not a level, not a page — Weekly Fleet Review owns the response. Inspect fleet_waste_empty_runs_24h (the #902 empty-run class) and fleet_waste_retries_24h (the #1204 salvage-bleed class) per lane."

      # fleet-ops#4643: prompt prefix-cache hit ratio. The single biggest
      # spend lever on metered lanes — uncached input is billed at 10-25x
      # cached, and the layout change (stable prefix first) only pays when
      # the prefix is byte-identical across same-type packets. This alert
      # fires per (provider, packet_type) lane whose 24h cache-hit ratio is
      # below 85% for 6h, so a lane that records prompt tokens but never
      # hits the prefix cache surfaces. severity=warning -> repair-dispatch
      # (am-executor), NOT the phone — a spend optimisation is never a
      # Nish page. The metric omits lanes with no prompt tokens (no
      # denominator), so a quiet lane never fires; only an active-low lane
      # does. Repair: re-check the packet layout for that packet_type
      # (tests/packet-layout.test.sh) and the provider's cache TTL window
      # (config/seat-caps.json _comment_4643_cache_ttl) — same-type packets
      # must land inside the TTL window.
      # fleet-ops#4643 follow-up (2026-09-11): the expr MUST scope to real
      # packet lanes, i.e. exclude packet_type=~"interactive|probe". Both are
      # structurally incapable of a prefix cache hit regardless of packet
      # layout: an interactive `pi` session has a human typing a different
      # prompt each turn, and a probe's whole prompt is a one-word sentinel
      # ('Reply OK' / 'PONG') with nothing to reuse. Measuring them against a
      # packet-layout target is a category error. Before this scoping the
      # selector matched them: on 2026-09-11 litellm/other (0.27) and
      # paretoinference/other (0.81) fired for 6h+ while every session
      # driving both lanes had cwd=/home/nish and the litellm prompts were
      # literally 'Reply OK' (17 seat probes in one rebase worktree) — and the
      # real packet lanes were above target (paretoinference/worker 0.906).
      # The alert asks whether the PACKET layout keeps a stable prefix; only
      # packet lanes can answer it. packet_type="other" stays IN scope: it is
      # the bucket for genuine packets matching no named lane.
      - alert: FleetPromptCacheHitLow
        expr: fleet_prompt_cache_hit_ratio{class="metered",packet_type!~"interactive|probe"} < 0.85
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "prompt prefix-cache hit ratio below 85% for 6h on {{ $labels.provider }}/{{ $labels.packet_type }}"
          description: "fleet_prompt_cache_hit_ratio{provider=\"{{ $labels.provider }}\",packet_type=\"{{ $labels.packet_type }}\"} < 0.85 for 6h (fleet-ops#4643). Uncached input is 84% of metered spend; target >= 90%. Repair: verify the packet layout keeps a byte-identical stable prefix for this packet_type (bash tests/packet-layout.test.sh) and that same-type packets land inside the provider's cache TTL window (config/seat-caps.json _comment_4643_cache_ttl). Not a Nish page — routes to am-executor."

  - name: fleet_canary_effectiveness
    rules:
      # Organ heartbeat (fleet-ops#1010 / #2757). The exporter always emits
      # fleet_canary_effectiveness_last_run_seconds on a live tick, so
      # absent() fires only when the piggyback path is dead — not on a
      # quiet incident window. 1h for: matches other 5-min exporter
      # piggybacks (waste-ledger uses 3h; this is tighter because the
      # metric is the only proof canaries catch regressions before users).
      - alert: FleetCanaryEffectivenessAbsent
        expr: absent(fleet_canary_effectiveness_last_run_seconds) or (time() - fleet_canary_effectiveness_last_run_seconds) > 1800
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "canary-effectiveness metrics absent — the #2757 exporter path is missing or dead"
          description: "Repair: lib/canary-effectiveness.py must emit fleet_canary_effectiveness_last_run_seconds. It piggybacks fleet-metrics-export.service via systemd/fleet-metrics-export.service.d/canary-effectiveness.conf (no new timer). Check fleet-metrics-export.timer and journalctl --user -u fleet-metrics-export.service."

      # fleet-ops#3055: the injected-fault drill runs inside every live
      # exporter tick (hermetic — temp store + fixtures, never the real
      # store). last_green only advances when the drill passes; a red/
      # absent drill means the classify path silently broke again (the
      # 2026-09-02 class pinned caught=0 for 19h because no drill ran
      # anywhere). 30m matches the 5-min exporter tick: six red ticks
      # before the fleet hears about it.
      - alert: FleetCanaryEffectivenessDrillStale
        expr: absent(fleet_canary_effectiveness_drill_last_green_seconds) or fleet_canary_effectiveness_drill_last_green_seconds == 0 or (time() - fleet_canary_effectiveness_drill_last_green_seconds) > 1800
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "canary-effectiveness drill not green — the classify path can no longer prove it catches injected regressions"
          description: "fleet_canary_effectiveness_drill_last_green_seconds is absent, 0, or older than 30m. The injected-fault drill must pass on every live exporter tick (fleet-ops#3055); a red drill means the canary can silently stop catching regressions. Repair: lib/canary-effectiveness.py, then re-run the exporter tick and confirm drill_ok=1."

      # effectiveness_ratio already covers the trailing 30d window inside
      # the exporter. Gate on (caught+missed)>0 so a quiet product with
      # zero incidents does not look like a broken canary.
      - alert: CanaryEffectivenessLow
        expr: fleet_canary_effectiveness_ratio < 0.02 and (fleet_canary_caught_regressions_total + fleet_canary_missed_regressions_total) > 0
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "canary organ {{ $labels.organ }} effectiveness_ratio < 0.02 over trailing 30d"
          description: "fleet_canary_effectiveness_ratio{organ=\"{{ $labels.organ }}\"} is below 0.02 while at least one user-facing incident landed in the window (fleet-ops#2757). The canary is running but not catching regressions before users. Inspect fleet_canary_caught_regressions_total / fleet_canary_missed_regressions_total and the organ's failure signature."

      # A canary that never fails AND never catches a regression while
      # user-facing incidents are being missed may be testing the wrong
      # surface. last_failure_seconds=0 means no failure in the trailing
      # window; require runs>0 so a dead organ is the Absent alert, not
      # this one, and require missed>0 so a quiet product with zero
      # incidents does not look like a broken canary.
      - alert: CanarySilentTooLong
        expr: fleet_canary_runs_total > 0 and fleet_canary_caught_regressions_total == 0 and fleet_canary_missed_regressions_total > 0 and (fleet_canary_last_failure_seconds == 0 or (time() - fleet_canary_last_failure_seconds) > 604800)
        for: 12h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "canary organ {{ $labels.organ }} silent 7+ days with no caught regression while misses exist"
          description: "fleet_canary_last_failure_seconds{organ=\"{{ $labels.organ }}\"} is 0 or older than 7d, caught_regressions_total is 0 AND missed_regressions_total is >0 while the organ is still running (fleet-ops#2757 / fleet-ops#3030). A silent canary may be testing the wrong surface. Confirm the organ's failure signature still matches the product path users hit."

  - name: fleet_intake_prioritization
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR).
      # fleet_intake_effectiveness_last_run_seconds is written by the
      # intake-effectiveness exporter every 5-min tick on the existing
      # fleet-metrics-export oneshot (drop-in ExecStart, no new timer), even
      # when the gh merge fetch fails (the hold + heartbeat gauges always
      # emit), so absent() fires only when the #2759 path is dead or removed.
      - alert: FleetIntakeEffectivenessAbsent
        expr: absent(fleet_intake_effectiveness_last_run_seconds)
        for: 3h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "intake prioritization effectiveness metrics absent — the #2759 exporter path is missing or dead"
          description: "Repair: lib/intake-prioritization-effectiveness.py must emit fleet_intake_effectiveness_last_run_seconds. It piggybacks fleet-metrics-export.service via systemd/fleet-metrics-export.service.d/intake-effectiveness.conf (no new timer). Check fleet-metrics-export.timer is running and journalctl --user -u fleet-metrics-export.service for errors. Re-install per /home/nish/workspaces/agent-state/alert-repair/issue-2759-progress.md until fleet_intake_effectiveness_last_run_seconds appears."

      # fleet-ops#2759 output-vs-outcome: the precedence-band product-first
      # hold (fleet-ops#2519/#2539) may ENGAGE (mechanism green) while product
      # merge throughput does not RISE (outcome red). Fires when the trailing
      # 14d effectiveness lift is < 0.1 (the hold did not lift 0509 merges/day
      # vs the no-hold baseline) AND the hold engaged more than half of that
      # window. The effectiveness gauge is a 14d trailing raw value (the
      # window is baked into the exporter), so this is a level check on a
      # trend window, not an instantaneous threshold. Omitted when the
      # baseline rate is 0, so a quiet window can never trip it.
      - alert: IntakePrioritizationIneffective
        expr: fleet_intake_prioritization_effectiveness{repo="0509"} < 0.1 and avg_over_time(fleet_intake_hold_active{repo="fleet-ops"}[14d]) > 0.5
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "product-first hold engages but product merge throughput does not increase (effectiveness < 0.1 over 14d, hold > 50% of window)"
          description: "fleet_intake_prioritization_effectiveness{repo=\"0509\"} has been below 0.1 for the trailing 14d while fleet_intake_hold_active{repo=\"fleet-ops\"} was engaged more than half of that window. The precedence-band mechanism is green but the outcome is red: holding fleet-ops did not lift product (0509) merges/day versus the no-hold baseline. This is the fleet-ops#2759 output-vs-outcome metric's purpose. Inspect fleet_intake_product_merge_rate_during_hold{repo=\"0509\"} vs fleet_intake_product_merge_rate_baseline{repo=\"0509\"} and re-tune config/precedence-band.json thresholds."

      # fleet-ops#2657: the hold must not hard-stall the fleet. When the hold
      # is engaged > 80% of the trailing 14d AND the control plane merges
      # fewer than 0.5 PRs/week (fleet_intake_control_merge_rate_week), the
      # precedence is starving fleet-ops of the machinery the fleet depends
      # on. #2657 was this exact pattern: the hold engaged and the fleet's
      # own repair/mechanism work stalled.
      - alert: IntakeHoldStarvesFleet
        expr: avg_over_time(fleet_intake_hold_active{repo="fleet-ops"}[14d]) > 0.8 and fleet_intake_control_merge_rate_week{repo="fleet-ops"} < 0.5
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "product-first hold is starving fleet-ops: engaged > 80% of 14d while control merges < 0.5/week"
          description: "avg_over_time(fleet_intake_hold_active{repo=\"fleet-ops\"}[14d]) > 0.8 and fleet_intake_control_merge_rate_week{repo=\"fleet-ops\"} < 0.5 — the fleet-ops#2657 hard-stall pattern. The hold engages most of the time yet the control plane merges almost nothing; repair/mechanism work is locked out. Re-tune PRODUCT_FIRST_SELF_RATIO_MAX in lib/precedence-band.sh or widen the floor lanes."

  - name: fleet_scout_effectiveness
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR). The exporter always emits
      # fleet_scout_effectiveness_last_run_seconds on a live tick, so
      # absent() fires only when the piggyback path is dead — not on a
      # quiet scout window. 3h for: matches the 5-min exporter piggyback
      # cadence (waste-ledger uses 3h; intake-effectiveness uses 3h).
      - alert: FleetScoutEffectivenessAbsent
        expr: absent(fleet_scout_effectiveness_last_run_seconds) or (time() - fleet_scout_effectiveness_last_run_seconds) > 10800
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "scout-effectiveness metrics absent — the #2756 exporter path is missing or dead"
          description: "Repair: lib/scout-effectiveness.py must emit fleet_scout_effectiveness_last_run_seconds. It piggybacks fleet-metrics-export.service via systemd/fleet-metrics-export.service.d/scout-effectiveness.conf (no new timer). Check fleet-metrics-export.timer and journalctl --user -u fleet-metrics-export.service."

      # fleet-ops#2756 output-vs-outcome: the scout may RUN green
      # (mechanism) while producing no mergeable product work (outcome).
      # Fires when the trailing 14d effectiveness_ratio (merged_14d / runs)
      # is < 0.1 AND at least one run happened — a productive scout should
      # land > 0.3 issues/run that survive intake dedup (issue target).
      # The ratio gauge is a 14d trailing raw value baked into the
      # exporter, so this is a level check on a trend window. Omitted when
      # runs == 0 (no scout ran — that is the FleetScoutStale rule's job),
      # so a quiet window never trips it. No repo label: covers every
      # enrolled scout repo (0509 by scout-candidate, fleet-ops by
      # agent-ready) so a newly-scouted repo is protected without a rule
      # edit (fleet-ops#3152).
      - alert: ScoutEffectivenessLow
        expr: fleet_scout_effectiveness_ratio < 0.1 and fleet_scout_runs_total > 0
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "scout runs but produces no mergeable work (effectiveness_ratio < 0.1 over 14d)"
          description: "fleet_scout_effectiveness_ratio is below 0.1 while fleet_scout_runs_total > 0 (fleet-ops#2756). The scout is running but its output is not translating to merged PRs — the scout-futility green-and-empty pattern, now quantified. Inspect fleet_scout_issues_filed / survive_intake / agent_ready / merged_14d to find where the pipeline leaks (filed but duped at intake, agent-ready but never claimed, claimed but never merged). Compare against the > 0.3 issues/run target."


  - name: fleet_product_slo
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR). The exporter always emits
      # fleet_product_slo_last_run_seconds on a live tick, so absent() fires
      # only when the piggyback path is dead — not on a quiet product week.
      # 3h matches the scout/intake/waste piggyback cadence.
      - alert: FleetProductSloAbsent
        expr: absent(fleet_product_slo_last_run_seconds) or (time() - fleet_product_slo_last_run_seconds) > 10800
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "product-slo metrics absent — the #2755 exporter path is missing or dead"
          description: "Repair: lib/fleet-product-slo.py must emit fleet_product_slo_last_run_seconds. It piggybacks fleet-metrics-export.service via systemd/fleet-metrics-export.service.d/product-slo.conf (no new timer). Check fleet-metrics-export.timer and journalctl --user -u fleet-metrics-export.service."

      # fleet-ops#5000: a 0509 production business table read ZERO rows after
      # holding rows within the last 24h. A level check against zero, NOT a
      # percentage-decay rule: migrations/0085_retention_sweep_state.sql makes
      # gradual decay expected, so only a cliff to empty is evidence of
      # deletion (or a destructive write) rather than ageing.
      - alert: ProductDataCensusDropped
        expr: fleet_product_table_rows == 0 and max_over_time(fleet_product_table_rows[24h] offset 5m) >= 1
        for: 5m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "0509 production table {{ $labels.table }} is empty — the row census dropped to 0"
          description: "fleet_product_table_rows{table=\"{{ $labels.table }}\"} == 0 while the same table held rows within the last 24h: production product data is empty — rows were deleted, not aged out (Nishfleet/fleet-ops#5000). migrations/0085_retention_sweep_state.sql decays rows gradually, so a cliff to zero is deletion, not ageing. Repair: inspect the {{ $labels.table }} table in the 0509 production D1 database and restore it from D1 Time Travel or the most recent export, then check recent migrations/sweeps for an accidental DELETE or TRUNCATE of {{ $labels.table }}."

      # fleet-ops#2755 accept §4: throughput < 2/week for 2 weeks.
      # avg_over_time over 14d of the weekly gauge approximates "sustained
      # low throughput" without a separate 2-week counter.
      - alert: ProductThroughputStalled
        expr: avg_over_time(fleet_product_throughput_weekly{repo="0509"}[14d]) < 2
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "0509 product throughput stalled (< 2 merged PRs/week over 14d)"
          description: "avg_over_time(fleet_product_throughput_weekly{repo=\"0509\"}[14d]) < 2 (fleet-ops#2755). Product delivery is quiet while operational SLOs may still be green. Inspect fleet_product_merged_24h, scout effectiveness, and the intake product-first hold."

      # fleet-ops#2755 accept §4: p50 lead time > 14 days.
      - alert: ProductLeadTimeDegrading
        expr: fleet_product_lead_time_days{repo="0509"} > 14
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "0509 product lead time p50 > 14 days"
          description: "fleet_product_lead_time_days{repo=\"0509\"} > 14 (fleet-ops#2755). Median issue→merge for non-revert product merges exceeds two weeks. Check claim/queue stalls and review latency."

      # fleet-ops#2755 accept §4: revert rate > 0.15 over trailing 4 weeks.
      - alert: ProductRevertRateHigh
        expr: fleet_product_revert_rate{repo="0509"} > 0.15
        for: 1h
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "0509 product revert rate > 15% over 28d"
          description: "fleet_product_revert_rate{repo=\"0509\"} > 0.15 (fleet-ops#2755). More than one in six product merges is a revert. Pause new product supply and inspect recent reverts before filing more 0509 work."

      # fleet-ops#3519: per-repo rolling-7d quality ceiling breaches. A quality
      # ceiling is breached only after the same metric sits above its
      # committed ceiling for 60 minutes (not a spike — a sustained miss), and
      # severity=warning means it dispatches an am-executor repair worker
      # (repair-dispatch), NOT a page. The ceiling series is emitted beside
      # each gauge for a `> on(repo)` pairing. `for: 60m` per accept §4.
      - alert: FleetProductQualityAbsent
        expr: absent(fleet_product_quality_reverts_per_100)
        for: 3h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "quality metrics absent — the fleet-ops#3519 per-repo quality path is missing or dead"
          description: "absent(fleet_product_quality_reverts_per_100) — lib/fleet-product-slo.py must export the fleet_product_quality_* family. Repair: check fleet-metrics-export.timer and journalctl --user -u fleet-metrics-export.service; the exporter loads lib/fleet-product-slo.py via systemd/fleet-metrics-export.service.d/product-slo.conf."

      - alert: QualityRevertsCeiling
        expr: fleet_product_quality_reverts_per_100 > on(repo) fleet_product_quality_ceiling{metric="reverts_per_100_merges"}
        for: 60m
        labels:
          severity: warning
          service: fleet
          quality: ceiling
        annotations:
          summary: "{{ $labels.repo }} reverts per 100 merges above its committed ceiling for 60m"
          description: "fleet_product_quality_reverts_per_100{repo=\"{{ $labels.repo }}\"} > its config/quality-ratchet.json ceiling for 60m (fleet-ops#3519). Repair: inspect recent reverts on {{ $labels.repo }} and the merge/review path that shipped breakage."

      - alert: QualityPostMergeDefectsCeiling
        expr: fleet_product_quality_post_merge_defects_per_100 > on(repo) fleet_product_quality_ceiling{metric="post_merge_defects_per_100"}
        for: 60m
        labels:
          severity: warning
          service: fleet
          quality: ceiling
        annotations:
          summary: "{{ $labels.repo }} post-merge defects per 100 merges above its committed ceiling for 60m"
          description: "fleet_product_quality_post_merge_defects_per_100{repo=\"{{ $labels.repo }}\"} > its config/quality-ratchet.json ceiling for 60m (fleet-ops#3519). Repair: desk-triage / red-on-main / customer-facing issues are being filed against fresh merges; inspect review depth and the merge gate."

      - alert: QualitySessionsPrCeiling
        expr: fleet_product_quality_sessions_to_pr_pct > on(repo) fleet_product_quality_ceiling{metric="sessions_to_pr_pct"}
        for: 60m
        labels:
          severity: warning
          service: fleet
          quality: ceiling
        annotations:
          summary: "{{ $labels.repo }} sessions per 100 PRs above its committed ceiling for 60m"
          description: "fleet_product_quality_sessions_to_pr_pct{repo=\"{{ $labels.repo }}\"} > its config/quality-ratchet.json ceiling for 60m (fleet-ops#3519). Too many issue-work sessions per merged PR on {{ $labels.repo }} — work is churning without landing. Inspect claim/queue and review latency."

  - name: fleet_console_truth
    rules:
      # fleet-ops#1157: a tile whose independent truth-check disagrees with
      # the number on the page. Warning, 30m, rides the existing repair rail
      # (severity=warning -> repair-dispatch). Exact counts mismatch immediately;
      # the 30m `for` is the lie that persists across two push cycles.
      - alert: ConsoleLying
        expr: fleet_console_tile_mismatch > 0
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "fleet console tile {{ $labels.tile }} is DISPUTED for 30+ minutes"
          description: "fleet_console_tile_mismatch{tile=\"{{ $labels.tile }}\"} > 0 for 30m. The console push job's verify pass recomputed this tile from source and disagreed with the rendered number. Repair: read the tile's verify.cmd on the page (what is this?), run it, and fix the collector (not the verify). PI WORK mismatches against ExecStart content are fleet-ops#1155."

      # Organ heartbeat (fleet-ops#1010 standing pattern). The verify pass
      # writes fleet_console_tile_verify_timestamp_seconds on every push.
      # 40m is >3 push cycles (12 min). absent() catches a missing file;
      # time()-timestamp catches a frozen file (textfile collector keeps
      # the last scrape). No new timer: fleet-console-pi.timer is the schedule.
      - alert: ConsoleTileVerifyAbsent
        expr: absent(fleet_console_tile_verify_timestamp_seconds) or (time() - fleet_console_tile_verify_timestamp_seconds) > 2400
        for: 40m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "console tile-verify organ absent — the self-audit pass is missing or dead"
          description: "Repair worker: fleet-console-pi/verify.py must write fleet_console_tile_verify_timestamp_seconds (and fleet_console_tile_mismatch). Check fleet-console-pi.timer is running and journalctl --user -u fleet-console-pi.service. No new timer was added; verify piggybacks the existing push cycle (fleet-ops#1157)."

      # Organ heartbeat (fleet-ops#1463 + #1010 standing pattern). The
      # resilience drill exports fleet_resilience_drill_last_green_seconds
      # ONLY when every plane passes (or skips) on the last run; a red run
      # deliberately keeps the timestamp at 0 so a drill that stays red is
      # itself loud. 26h is just over one missed daily cycle (the drill
      # fires at 05:47; a one-day skip should not page on a brief host
      # pause, a two-day skip is a real failure). absent() catches a
      # missing file (node-exporter textfile collector keeps the last
      # scrape, so a frozen file keeps the timestamp fresh — that's why
      # time()-timestamp is in the OR clause). The drill runs on the
      # existing daily 05:47 timer (no new timer; #1463 only extends the
      # existing roster).
      - alert: ResilienceDrillAbsent
        expr: absent(fleet_resilience_drill_last_green_seconds) or fleet_resilience_drill_last_green_seconds == 0 or (time() - fleet_resilience_drill_last_green_seconds) > 93600
        for: 4h
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet resilience drill organ absent — the eleven-plane drill is missing, dead, or stuck red"
          description: "Repair worker: bin/fleet-resilience-drill must write fleet_resilience_drill_last_green_seconds on every all-pass run. fleet_resilience_drill_plane_fail{plane=...} and fleet_resilience_drill_plane_skip{plane=...} name the failing planes. Check fleet-resilience-drill.timer is running and journalctl --user -u fleet-resilience-drill.service. The five #1463 failure-class planes (queue_freeze, pipeline_red, boundary_delivery, band_floor, event_trigger_spot) sandbox against live state, so a red plane is safe to reproduce."

      # fleet-ops#1232: 17 min of honest-dark gh tiles because caches aged
      # out and scheduled refreshes did not recover. Honesty rendering
      # (dash + stale marker) already works; this is the missing
      # escalation. 45m = 1.5x the 30 min cache cadence (PR_CACHE_TTL)
      # so a single missed tick never fires. severity=warning rides the
      # existing repair rail (not in SKIP_SET).
      # The exporter emits fleet_gh_cache_fresh=1 for a fresh family and
      # OMITS the series when stale (never 0). min==0 is the named
      # condition; absent() is the live omit-on-stale path that actually
      # went dark.
      - alert: FleetGhCacheStale
        expr: min(fleet_gh_cache_fresh) == 0 or absent(fleet_gh_cache_fresh)
        for: 45m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "gh-derived Prometheus families stale for 45+ minutes"
          description: "Repair worker: run the exporter (`systemctl --user start fleet-metrics-export.service`), check gh auth/rate limit (`gh auth status`; `gh api rate_limit`), and fix the refresh path in fleet-metrics-export.py (`_cached_json` / PR_CACHE_TTL=30m). 45m is 1.5x the cache cadence so routine expiry never fires."

  - name: fleet_gh_rate_limit_supply
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern). The exporter
      # writes fleet_gh_rate_limit_fetched_seconds on every successful
      # gh rate_limit fetch (fleet-ops#1350). absent() catches a missing
      # file; time()-timestamp catches a frozen file (textfile collector
      # keeps the last scrape). 30m is 30x the 60s exporter cadence, so
      # routine cache misses never fire but a dead fetcher path does.
      - alert: FleetGhRateLimitAbsent
        expr: absent(fleet_gh_rate_limit_fetched_seconds) or (time() - fleet_gh_rate_limit_fetched_seconds) > 1800
        for: 10m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "gh rate-limit metrics absent — the #1350 governor path is missing or dead"
          description: "Repair worker: fleet_gh_rate_limit_fetched_seconds is absent or older than 30m. fleet-metrics-export.py must call `gh api rate_limit` and write the side-car state file. Check journalctl --user -u fleet-metrics-export.service for the fetcher error, gh auth (`gh auth status`), and the PR_CACHE_DIR/gh-rate-limit-cache.json cache. The throttle gate in pi-intake-tick.sh fail-OPENS on a missing state file, so a dead fetcher silently removes the API budget governor — fix the fetcher, not the throttle."

      # Sustained-exhaustion TREND alert (fleet-ops#1350). The 20% threshold
      # is the soft throttle (intake holds claims this tick). A TREND alert
      # (delta over 6h) catches SUSTAINED exhaustion — a busy hour that
      # bounces off 18% briefly is not a fault, but staying below 20% for
      # most of a 6h window means the worker count is past the API budget.
      # The `low` gauge is the exporter's precomputed 0/1 (any of the
      # three resources below 20% → 1), so the alert does not re-derive
      # the threshold. max() over all resources because exhaustion on ANY
      # resource is a fault; do not narrow the scope with avg() (a 5000/hr
      # core budget at 19% is a real problem even with search/graphql
      # healthy). offset 6h cannot fire on the first 6h after deploy.
      - alert: FleetGhRateLimitLowSustained
        expr: (max(fleet_gh_rate_limit_low) - max(fleet_gh_rate_limit_low offset 6h)) > 0
        for: 6h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "gh rate-limit has been below 20% for 6+ hours"
          description: "max(fleet_gh_rate_limit_low{resource=...}) flipped from 0 to 1 in the last 6h, sustained 6h. The throttle gate in pi-intake-tick.sh has been holding claims the whole window. A rate-limited fleet is slower than a governed one (Nish 2026-08-27 #1167). Inspect fleet_gh_rate_limit_remaining{resource=\"...\"} to see which resource is exhausted; fleet_gh_rate_limit_reset is the time-to-reset. Recovery: either (1) wait for the window to reset, or (2) reduce the worker count (drop free-lane caps in config/seat-caps.json). The alert is a TREND (delta) not a level so a brief 19% spike does not fire."

  - name: fleet_scout_supply
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR). scout-futility-check writes
      # fleet_scout_last_run_seconds on ExecStartPre begin — not on
      # ExecStopPost of an ExecCondition skip, so a rest-skipped tick does
      # not look like a live scout. 8h is two missed 4h timer cycles.
      # 0 means begin has never succeeded (missing snapshot).
      - alert: FleetScoutStale
        expr: absent(fleet_scout_last_run_seconds) or (time() - fleet_scout_last_run_seconds) > 28800
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "pi-scout@{{ $labels.repo }} has not actually begun in 8+ hours"
          description: "Repair worker: fleet_scout_last_run_seconds is absent or older than 8h (two pi-scout@ timer cycles). This is last ExecStartPre begin, not last timer fire — ExecCondition skip still triggers the timer. Check journalctl --user -u pi-scout@{{ $labels.repo }}.service for action=rest vs missing begin snapshot. If hours_of_work < 24, start the scout. Helper: /home/nish/.local/bin/scout-futility-check. fleet-ops#1277."

      # Organ heartbeat (fleet-ops#1137 standing pattern). The truth
      # staleness checker exports fleet_truth_staleness_last_run_seconds on
      # every run (the exporter-piggyback ExecStartPost on the 5-min exporter
      # tick — no timer of its own since fleet-ops#4149). 25h is a generous
      # slack so a routine skip never fires but a dead checker does. absent()
      # catches a missing file; time()-timestamp catches a frozen file
      # (textfile collector keeps last scrape).
      - alert: TruthStalenessAbsent
        expr: absent(fleet_truth_staleness_last_run_seconds) or (time() - fleet_truth_staleness_last_run_seconds) > 90000
        for: 12h
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "truth-staleness-checker organ absent — the standing-doc checker is missing or dead"
          description: "Repair worker: fleet_truth_staleness_last_run_seconds is absent or older than 25h. The truth-staleness-checker (fleet-ops#1137) cross-checks standing docs against live state; if this is silent, standing truth can silently rot without detection. Check: (1) `systemctl --user status fleet-metrics-export.service` (the checker piggybacks the exporter via ExecStartPost in systemd/fleet-metrics-export.service.d/staleness-checker.conf); (2) `cat ~/.local/libexec/staleness-checker.py` is intact; (3) run it by hand: `python3 ~/.local/libexec/staleness-checker.py`. The weekly timer + issue filing were retired in fleet-ops#4149 — TruthStalenessMismatch notifies on actual mismatches. Helper: /home/nish/.local/libexec/staleness-checker.py. fleet-ops#1137."

      # fleet-ops#4149: the hand-built weekly truth-staleness timer + GitHub
      # issue filing are retired. This alert is their off-the-shelf
      # replacement: when the checker finds a mismatch (stale doc path, dead
      # unit ref, or rotten issue ref), fleet_truth_staleness_mismatches_by_kind
      # goes > 0 with one series per kind. The finding details (kind, source
      # doc, raw claim, reason) live in the JSON cache the checker writes on
      # every run: ~/workspaces/agent-state/fleet-metrics/staleness-findings-cache.json
      # (fleet-metrics-export.py reads the same cache for this gauge).
      # severity=warning -> repair-dispatch (no phone): docs-vs-live drift is
      # a repair job, not a page (fleet-ops#1534).
      - alert: TruthStalenessMismatch
        expr: fleet_truth_staleness_mismatches_by_kind > 0
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "truth staleness mismatches — standing docs drifted from live state"
          description: "Repair worker: fleet_truth_staleness_mismatches_by_kind > 0 — one or more standing-doc claims (file paths, systemd units, issue refs) failed live validation. Read the details in ~/workspaces/agent-state/fleet-metrics/staleness-findings-cache.json (kind, source doc, raw claim, reason), then either fix the live state or correct the doc. The checker piggybacks the exporter tick (ExecStartPost in systemd/fleet-metrics-export.service.d/staleness-checker.conf); this alert replaced the retired weekly timer + auto-filed issues (fleet-ops#4149)."


  - name: fleet_asset_census_supply
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR; required by fleet-ops#1149
      # item 4). fleet-asset-census writes fleet_asset_census_last_run_seconds
      # on every successful weekly diff — findings (unguarded assets) still
      # count as a healthy run, only a stopped timer leaves the metric stale.
      # 14d is two missed weekly timer cycles (Sun 03:15 IST), matching the
      # scout doctrine of two missed cycles before "dead".
      - alert: FleetAssetCensusAbsent
        expr: absent(fleet_asset_census_last_run_seconds) or (time() - fleet_asset_census_last_run_seconds) > 1209600
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "weekly VPS asset census has not run in 14+ days"
          description: "Repair worker: fleet_asset_census_last_run_seconds is absent or older than 14d (two weekly timer cycles). The census enumerates the VPS surface and diffs against config/asset-guard-map.json; a dead census means new/unguarded assets are invisible. Check journalctl --user -u fleet-asset-census.service and systemctl --user list-timers fleet-asset-census.timer. Helper: /home/nish/.local/bin/fleet-asset-census. fleet-ops#1149."

  - name: fleet_gh_webhook_supply
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR; required by fleet-ops#1464).
      # gh-webhook-receiver writes fleet_gh_webhook_receiver_last_green_seconds
      # on every verified+dispatched forward. It also writes the series
      # with timestamp=0 on startup so the rule does not fire spuriously
      # before the first event. 1h is 12 missed 5-min canary cycles — the
      # same "two missed cycles × 6" doctrine as the scout (but at hour
      # granularity because real webhooks are bursty, not continuous).
      - alert: FleetGhWebhookReceiverAbsent
        expr: absent(fleet_gh_webhook_receiver_last_green_seconds) or (time() - fleet_gh_webhook_receiver_last_green_seconds) > 3600
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "gh-webhook-receiver heartbeat metric missing or stale > 1h"
          description: "Repair worker: fleet_gh_webhook_receiver_last_green_seconds is missing or stale. ROOT CAUSE that fired this twice (#1464 fixed by #1607, #1576): the receiver was alive and the synthetic canary was hitting it every 5 min, but the series never reached Prometheus — either the receiver did not bump the heartbeat on ignored canary events (record_verified in libexec/gh-webhook-receiver/serve.py), or the prom label values were single-quoted so node-exporter silently dropped them. Check IN THIS ORDER: (1) cat /var/lib/prometheus/node-exporter/fleet-gh-webhook-receiver.prom — is last_green_seconds recent and are label values double-quoted? (2) systemctl --user status gh-webhook-canary.timer — is the canary firing every 5 min? (3) curl -s 'http://127.0.0.1:9090/api/v1/query?query=fleet_gh_webhook_receiver_last_green_seconds' — does Prometheus see the series? (4) systemctl --user status gh-webhook-receiver.service and curl http://127.0.0.1:8088/healthz. NOTE: the Cloudflare Worker + Tunnel half of the channel (workers/github-push-forward/) is Nish-gated and NOT yet deployed — do NOT chase cloudflared logs (no tunnel exists on this VPS yet); the synthetic canary is the liveness probe. See docs/github-push-channel.md. fleet-ops#1464, #1607, #1576."

      # fleet-ops#1464, pattern 2: synthetic canary is the liveness probe
      # for the entire GitHub push channel. gh-webhook-canary posts a
      # synthetic issues/labeled/agent-ready payload every 5 min and
      # bumps fleet_gh_webhook_canary_last_green_seconds. The canary is
      # considered dead when the series is missing OR older than 15 min
      # (three missed 5-min cycles). This absent() rule is the dead-man:
      # it pages the alert-repair rail when the push channel is stale.
      - alert: FleetGhWebhookCanaryAbsent
        expr: absent(fleet_gh_webhook_canary_last_green_seconds) or (time() - fleet_gh_webhook_canary_last_green_seconds) > 900
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "GitHub push-channel synthetic canary has not gone green in 15+ minutes"
          description: "Repair worker: gh-webhook-canary.timer has not fired a successful probe in 15+ minutes (three missed 5-min cycles). The push channel is provably broken — either gh-webhook-receiver.service is dead, the local receiver cannot be reached (tunnel down, secret file missing, or 127.0.0.1:8088 unbound), or the canary timer itself is dead. First check `systemctl --user status gh-webhook-canary.timer` and journalctl -u gh-webhook-canary. Then `curl http://127.0.0.1:8088/healthz`. fleet-ops#1464."

  - name: fleet_grok_token_refresh_supply
    rules:
      # Organ heartbeat (fleet-ops#1010 standing pattern: every new organ
      # ships its absent() rule in the same PR). grok-token-refresh writes
      # fleet_grok_token_refresh_last_success_seconds on every run that
      # does not REJECT — SUCCESS (rotated) and SKIP (credential still
      # fresh, no rotation needed) both advance it to now. A SKIP is a
      # successful run: the script ran and found the credential healthy.
      # Only REJECT (failed grant) preserves the prior value. fleet-ops#2817:
      # the old preserve-on-skip logic let last_success go stale while the
      # timer kept SKIPping a fresh token, firing a false
      # FleetGrokTokenRefreshStale. 12h is two missed 4h timer cycles —
      # by the time the absent() rule fires the script has provably not
      # run, not merely not rotated.
      - alert: FleetGrokTokenRefreshStale
        expr: absent(fleet_grok_token_refresh_last_success_seconds) or (time() - fleet_grok_token_refresh_last_success_seconds) > 43200
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "grok-token-refresh has not run in 12+ hours"
          description: "Repair worker: fleet_grok_token_refresh_last_success_seconds is absent or older than 12h (two 4h timer cycles). The script advances this metric on every SUCCESS and SKIP — only a REJECT (failed grant) or a dead timer leaves it stale. The script is the prevention side of fleet-ops#41 — it keeps ~/.pi/agent/auth.json[xai-oauth] alive so the live SuperGrok seat (fleet-ops#1163) does not age into a 401. Check journalctl --user -u grok-token-refresh.service and systemctl --user list-timers grok-token-refresh.timer. Helper: /home/nish/.local/bin/grok-token-refresh. fleet-ops#41."

  # fleet-ops#1291: SLO error budgets + multiwindow burn-rate alerts
  # (Google SRE Workbook Ch.5 canon). config/slo-definitions.json is the
  # single source of truth; lib/slo_budget.py does the budget math;
  # libexec/fleet-metrics-export.py emits the fleet_slo_* gauges.
  #
  # Alert model (Workbook §5.4, translated for a sampled-gauge SLI):
  # - RATIO SLOs (main_green, seat_availability): multiwindow burn-rate.
  #     burn_rate = (1 - avg_over_time(fleet_slo_compliance{slo}[W])) / (1 - target)
  #     Fast burn = 14.4x sustained over BOTH 1h AND 5m (long+short suppress flap).
  #     Slow burn = 1x sustained over BOTH 6h AND 30m (feeds the WFR).
  #     Gated on fleet_slo_instrumented{slo} == 1 so an uninstrumented SLO
  #     (source metric pending) never burns budget it cannot measure.
  # - THRESHOLD-GAUGE SLOs (waste_ratio, gh_rate_limit_headroom): the
  #     error-budget ratio model does not fit a single threshold gauge
  #     (Workbook applies burn-rate to ratio SLIs); these get canonical
  #     threshold-window alerts on the raw source metric instead.
  # severity: fast_burn=critical (pages the repair rail, NOT Nish's phone —
  # fleet-ops#1534 reserves severity=page for RepairDispatchDown only),
  # slow_burn=warning (feeds the WFR alert-quality lens).
  - name: fleet_slo_burn
    rules:
      # Organ heartbeat (fleet-ops#1010): the SLO metric family is emitted
      # every scrape by fleet-metrics-export. If it disappears, the
      # exporter is dead and every SLO alert below is blind.
      - alert: FleetSloMetricsAbsent
        expr: absent(fleet_slo_instrumented)
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet SLO metrics absent — the SLO exporter path is dead"
          description: "Repair worker: fleet_slo_instrumented is absent for 15m. fleet-metrics-export.py emits the fleet_slo_* family every scrape; if it disappears the exporter crashed (check journalctl --user -u fleet-metrics-export.service) or config/slo-definitions.json is unparseable. Without this family every burn alert below is blind. NOTE: a prior attempt deployed an exporter referencing lib/slo_budget.py before the file existed (2026-08-30T05:55Z ModuleNotFoundError crash) — verify lib/slo_budget.py is present and the exporter imports clean. fleet-ops#1291."

      # --- main_green: ratio SLO, target 0.99, budget = 1% of week ---
      # Fast burn: >2% of weekly budget in 1h (14.4x normal), 1h AND 5m.
      - alert: FleetSloMainGreenFastBurn
        expr: (fleet_slo_instrumented{slo="main_green"} == 1) and ((1 - avg_over_time(fleet_slo_compliance{slo="main_green"}[1h])) / (1 - fleet_slo_target{slo="main_green"}) > 14.4) and ((1 - avg_over_time(fleet_slo_compliance{slo="main_green"}[5m])) / (1 - fleet_slo_target{slo="main_green"}) > 14.4)
        for: 2m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "SLO main_green fast burn — CI green fraction burning >2% of weekly budget per hour"
          description: "Repair worker: the main_green SLO (default-branch CI green across enrolled repos) is in fast burn — >14.4x the normal budget consumption rate over both 1h and 5m. Check fleet_main_ci_green{repo=...} for which repo(s) are red and whether a red-on-main or stop-the-line condition is active. fleet-ops#1291."
      # Slow burn: >10% of weekly budget in 6h (1x), 6h AND 30m.
      - alert: FleetSloMainGreenSlowBurn
        expr: (fleet_slo_instrumented{slo="main_green"} == 1) and ((1 - avg_over_time(fleet_slo_compliance{slo="main_green"}[6h])) / (1 - fleet_slo_target{slo="main_green"}) > 1) and ((1 - avg_over_time(fleet_slo_compliance{slo="main_green"}[30m])) / (1 - fleet_slo_target{slo="main_green"}) > 1)
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "SLO main_green slow burn — CI green fraction trending below the 99% budget line"
          description: "WFR input: the main_green SLO is in slow burn — on pace to exhaust its weekly error budget. Not paging; feeds the weekly fleet review alert-quality lens. NOTE: this is a windowed burn-rate alert (6h AND 30m avg_over_time), not a point-in-time check — it legitimately fires for up to 30m after all repos go green because the 30m window still includes recent red history. The green map (fleet_main_ci_green) is point-in-time; the SLO is windowed. They disagree by design during recovery. fleet-ops#1291, #3367."

      # fleet-ops#3367: consistency check — SLO compliance and the per-repo
      # green map both derive from the same main_ci dict in one atomic export,
      # so they must agree at every scrape. A disagreement means a stale/frozen
      # SLO gauge (e.g. config parse failure left old compliance in Prometheus
      # while fleet_main_ci_green kept updating). "More than one scrape" = 2m
      # (4 scrapes at 30s); a single-scrape race is tolerated.
      - alert: FleetSloMainGreenGreenMapDisagree
        expr: (fleet_slo_instrumented{slo="main_green"} == 1) and (abs(fleet_slo_compliance{slo="main_green"} - (sum(fleet_main_ci_green) / count(fleet_main_ci_green))) > 0.001)
        for: 2m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "SLO main_green compliance disagrees with the per-repo green map"
          description: "fleet_slo_compliance{slo=\"main_green\"} and sum(fleet_main_ci_green)/count(fleet_main_ci_green) disagree for >2m. Both derive from the same main_ci dict in one atomic export, so a disagreement means a stale/frozen SLO gauge while the green map updates — a real consistency bug. Check the exporter journal (journalctl --user -u fleet-metrics-export.service) and config/slo-definitions.json. fleet-ops#3367."

      # --- seat_availability: ratio SLO, target 0.90, budget = 10% of week ---
      - alert: FleetSloSeatAvailFastBurn
        expr: (fleet_slo_instrumented{slo="seat_availability"} == 1) and ((1 - avg_over_time(fleet_slo_compliance{slo="seat_availability"}[1h])) / (1 - fleet_slo_target{slo="seat_availability"}) > 14.4) and ((1 - avg_over_time(fleet_slo_compliance{slo="seat_availability"}[5m])) / (1 - fleet_slo_target{slo="seat_availability"}) > 14.4)
        for: 2m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "SLO seat_availability fast burn — healthy-seat fraction collapsing"
          description: "Repair worker: the seat_availability SLO (healthy seats / enrolled seats) is in fast burn. Check fleet_pi_seat_healthy, the seat-health ledger at /home/nish/workspaces/agent-state/lanes/seats, and FleetDeadCredentialSeats. fleet-ops#1291."
      - alert: FleetSloSeatAvailSlowBurn
        expr: (fleet_slo_instrumented{slo="seat_availability"} == 1) and ((1 - avg_over_time(fleet_slo_compliance{slo="seat_availability"}[6h])) / (1 - fleet_slo_target{slo="seat_availability"}) > 1) and ((1 - avg_over_time(fleet_slo_compliance{slo="seat_availability"}[30m])) / (1 - fleet_slo_target{slo="seat_availability"}) > 1)
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "SLO seat_availability slow burn — healthy seats trending below the 90% budget line"
          description: "WFR input: the seat_availability SLO is in slow burn. Repair terminates in the intake REPAIR-RUNG (fleet-ops#4639) — after two consecutive ticks with usable slots < 2, intake claims critical-path fleet-ops on reserved seats (litellm judge / mergegateway audition / cursor keystone). When this alert has been firing >1h, alert-repair-dispatch auto-files or links exactly one critical-path fleet-ops issue (signal: slo/seat-availability-slowburn, fleet-ops#4773) and notifies am-executor. Alert-repair workers cannot raise seats; this warning must not page Nish. fleet-ops#1291."

      # --- waste_ratio: threshold-gauge SLO, target 0.10 (max) ---
      # Canonical threshold-window alert (burn-rate ratio model does not fit
      # a single gauge). Fires when waste exceeds 10% for a sustained window.
      - alert: FleetSloWasteRatioOverTarget
        expr: (fleet_slo_instrumented{slo="waste_ratio"} == 1) and (fleet_waste_ratio > 0.10)
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "SLO waste_ratio over target — fleet waste ratio above 10% for 1h+"
          description: "WFR input: the waste_ratio SLO (fleet waste ≤ 10%) is over target. Read fleet_waste_runs{kind=...} and the per-lane fleet_waste_empty_runs_24h / fleet_waste_retries_24h families (fleet-ops#1211). WasteRatioRising is the trend sibling. fleet-ops#1291."

      # --- gh_rate_limit_headroom: threshold-gauge SLO, target 0.20 (min) ---
      # Fires when min(remaining/limit) across core/search/graphql drops
      # below 20% for 30m. The existing FleetGhRateLimitLow level alert and
      # the 6h trend alert cover the same signal; this SLO alert is the
      # budget-framed wrapper that feeds the WFR SMOOTH verdict.
      - alert: FleetSloGhRateLimitHeadroomLow
        expr: (fleet_slo_instrumented{slo="gh_rate_limit_headroom"} == 1) and (fleet_slo_compliance{slo="gh_rate_limit_headroom"} < 0.20)
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "SLO gh_rate_limit_headroom low — GitHub rate limit below 20% headroom for 30m+"
          description: "WFR input: the gh_rate_limit_headroom SLO (min remaining/limit ≥ 20%) is under target. Inspect fleet_gh_rate_limit_remaining{resource=...}; fleet_gh_rate_limit_reset is time-to-reset. fleet-ops#1291."

  - name: fleet_baseline_delta_supply
    rules:
      # fleet-ops#1151: week-over-week MAD strangeness pre-pass for the Weekly
      # Fleet Review. This rule watches the ORGAN, not the anomalies — a high
      # |z| is a report line for the review conference, never a page. The
      # metric is written by libexec/fleet-baseline-delta.py to
      # /var/lib/prometheus/node-exporter/fleet-baseline-delta.prom on every
      # completed run (zero anomalies is still a healthy run, so the rule
      # fires only when the weekly timer stops). 14d is two missed weekly
      # timer cycles (Sun 04:00 IST), matching the scout/asset-census
      # doctrine of two missed cycles before "dead".
      - alert: FleetBaselineDeltaAbsent
        expr: absent(fleet_baseline_delta_last_run_seconds) or (time() - fleet_baseline_delta_last_run_seconds) > 1209600
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "weekly baseline-delta strangeness pass has not run in 14+ days"
          description: "Repair worker: fleet_baseline_delta_last_run_seconds is absent or older than 14d (two weekly timer cycles). fleet-baseline-delta (#1151) queries Prometheus for every fleet_* and key node_* series, compares this week vs a trailing 4-week median+MAD baseline, and writes the ranked top-20 strangeness report the Weekly Fleet Review reads; a dead job means week-over-week anomalies are invisible to the review. Check journalctl --user -u fleet-baseline-delta.service and systemctl --user list-timers fleet-baseline-delta.timer. Helper: /home/nish/.local/libexec/fleet-baseline-delta.py. fleet-ops#1151."

  - name: fleet_aeo_probe_supply
    rules:
      # fleet-ops#1236 / #1010: weekly AEO visibility probe for 0509. The
      # probe writes fleet_aeo_probe_last_run_seconds to
      # /var/lib/prometheus/node-exporter/fleet-aeo.prom on every completed
      # run (missing API seats skip the query but still land the heartbeat),
      # so this rule fires only when the weekly timer stops. 14d is two
      # missed weekly timer cycles (Sun 03:30 IST), matching the
      # baseline-delta/asset-census doctrine of two missed cycles before
      # "dead". severity: critical because a dead probe makes 0509's
      # search-visibility signal (vs StockX/GOAT) go dark with no alert —
      # the exact class that took down quality-research-weekly on 2026-08-30.
      - alert: FleetAeoProbeAbsent
        expr: absent(fleet_aeo_probe_last_run_seconds) or (time() - fleet_aeo_probe_last_run_seconds) > 1209600
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "weekly AEO probe has not run in 14+ days"
          description: "Repair worker: fleet_aeo_probe_last_run_seconds is absent or older than 14d (two weekly timer cycles). The AEO probe (#1236) is 0509's outermost search-visibility line — it proves 0509 ranks for money-queries against StockX/GOAT and feeds the weekly senior conference; a dead probe goes dark silently, so the repair rail must resurrect fleet-aeo-probe.timer. Check journalctl --user -u fleet-aeo-probe.service and systemctl --user list-timers fleet-aeo-probe.timer. Helper: /home/nish/.local/libexec/fleet-aeo-probe.py. fleet-ops#1236."

  - name: fleet_quality_slo
    rules:
      # fleet-ops#2444: the quality-SLO scoreboard must refresh at least
      # daily or the fleet silently serves old quality numbers (a 4-day-old
      # scoreboard cannot adjudicate a live FleetQueueSelfMaintenanceRatioHigh
      # alert). fleet-quality-slo writes fleet_quality_slo_last_computed_seconds
      # to /var/lib/prometheus/node-exporter/fleet-quality-slo.prom on every
      # successful recompute (each heartbeat tick). absent() fires when the
      # recompute path is dead; the >86400 delta fires when a live recompute
      # has stopped refreshing the snapshot for over 24h — both are loud so a
      # stale scoreboard can never be trusted silently.
      - alert: FleetQualitySloStale
        expr: absent(fleet_quality_slo_last_computed_seconds) or (time() - fleet_quality_slo_last_computed_seconds) > 86400
        for: 1h
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "quality-SLO scoreboard stale (>24h) or its recompute path is dead"
          description: "fleet_quality_slo_last_computed_seconds is absent or older than 24h (fleet-ops#2444). The quality scoreboard has been serving stale numbers — a 4-day-old snapshot cannot adjudicate a live FleetQueueSelfMaintenanceRatioHigh alert. Repair: bin/fleet-quality-slo must run (wired as heartbeat-tier1 block 19) and recompute agent-state/quality-slo/snapshot.json, exporting fleet_quality_slo_last_computed_seconds each run. Check journalctl --user -u fleet-heartbeat.service and systemctl --user status fleet-heartbeat.service."

  - name: fleet_deploy_quality
    rules:
      # fleet-ops#2758: deployment quality SLOs. Computed by
      # lib/fleet-deploy-quality.py (loaded by libexec/fleet-metrics-export.py
      # on the 5-min tick). Latency/time-to-detect are p95 gauges; rollback/
      # success are 30d ratios; blocked_duration is the LIVE age of the
      # current DEPLOY-BLOCKED episode (0 when green). NaN policy: a data
      # outage emits NaN gauges + fleet_deployment_quality_up 0, so these
      # threshold rules stay silent (NaN comparisons are false) and
      # DeploymentQualityStale below carries the loud signal.
      - alert: DeploymentLatencyHigh
        expr: fleet_deployment_latency_seconds{repo="fleet-ops"} > 1800
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "fleet-ops merge-to-live p95 latency above 30 min"
          description: "p95 fleet-ops deployment latency (merge -> first green fleet-deploy-check deploy) exceeded 30 minutes for 5+ minutes. The 2-min deploy gate is saturated or blocked; inspect journalctl --user -u fleet-deploy-check.service and bin/fleet-ops-deploy. fleet-ops#2758."
      - alert: DeploymentRollbackRateHigh
        expr: fleet_deployment_rollback_rate{repo="fleet-ops"} > 0.1
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet-ops auto-revert rate above 10% of deployments (30d)"
          description: "More than 10% of fleet-ops deployments in the trailing 30 days were rolled back by the auto-revert machinery (revert: auto-restore green main PRs / merged deployments). The fleet is shipping breakage to main faster than the red-on-main pipeline catches it. fleet-ops#2758."
      - alert: DeploymentTimeToDetectHigh
        expr: fleet_deployment_time_to_detect_seconds{repo="fleet-ops"} > 600
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "fleet-ops p95 time-to-detect above 10 min"
          description: "p95 time from a fleet-ops deployment to the first critical alert dispatch exceeded 10 minutes for 5+ minutes. Bad deploys are not being caught by the alert plane within budget; inspect the alert-repair actions.log coverage and the critical alert rules. fleet-ops#2758."
      - alert: DeployBlockedStuck
        expr: fleet_deploy_blocked_duration_seconds{repo="fleet-ops"} > 900
        for: 3m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet-ops deploy blocked for 15+ minutes (fleet-ops#2725 pattern)"
          description: "fleet_deploy_blocked_duration_seconds{repo=\"fleet-ops\"} exceeded 900s (15 min): the fleet-ops deploy clone is stuck DEPLOY-BLOCKED. 2026-09-02 live case: >1h blocked on dirty tracked files with zero mechanized alert (fleet-ops#2725). Merge-to-live is halted; clear the dirty state on /home/nish/workspaces/tooling/fleet-ops-deploy-clone or root-cause the block. Check journalctl --user -u fleet-deploy-check.service."
      # fleet-ops#5786: DEPLOY-CLONE DRIFT — the deploy clone has been off
      # main or dirty for >15 minutes. The clone is the live install source;
      # drift means merge-to-live may be riding unmerged code AND it lets a
      # worker back a false LIVE claim (2026-09-12: an alert-repair worker
      # left the clone on its fix branch and reported "Live on this host"
      # while its PR was still open with auto-merge off). The 2-min
      # fleet-deploy-check tick already emits DEPLOY-CHECK-OFF-MAIN and
      # invokes the sanctioned deploy to converge; this rule is the page
      # when convergence has failed for 15+ minutes. The gauge clears the
      # first tick the clone is clean main again.
      - alert: DeployCloneOffMain
        expr: fleet_deploy_clone_off_main == 1
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "{{ $labels.repo }} deploy clone off main or dirty for 15+ minutes (fleet-ops#5786)"
          description: "fleet_deploy_clone_off_main{repo=\"{{ $labels.repo }}\"} has been 1 for 15+ minutes: the deploy clone is on a non-main branch, detached, or dirty — the live install source is not clean origin/main, so 'LIVE on this host' may be riding unmerged code. Repair: name the writer first (journalctl --user -u fleet-deploy-check.service for DEPLOY-CHECK-OFF-MAIN / DEPLOY-CHECK-DIRTY-CLONE; ls of /home/nish/workspaces/agent-worktrees for the branch owner). Salvage the branch's diff into the writer's claim worktree if it is not already in a PR, then converge the clone to clean origin/main (bin/fleet-ops-deploy, or `git -C /home/nish/workspaces/tooling/fleet-ops-deploy-clone checkout main && git reset --hard origin/main`). Done means the gauge reads 0 next tick. Never claim LIVE for a change still on a branch — the packet-verdict checker rejects the deliverable (fleet-ops#5786)."
      # fleet-ops#5140: a product repo's production deploy has been non-green
      # for over an hour — the 2026-09-10 stall class where 131 merged product
      # PRs sat undelivered for 28h while every dashboard read green.
      # Deliberately severity=warning, NOT critical: a stalled product deploy
      # stalls customer-facing work, it does not page Nish. fleet-ops keeps
      # its own DeployBlockedStuck (>900s, critical) above. The newest red
      # run's URL is pulled from the fleet_product_deploy_last_red_run_info
      # info series via the query template function — a url label on the
      # duration series itself would mint a new series per run and restart
      # this rule's for: timer forever.
      # ProductDeployStalled (warning, cheap-seat dispatch) DELETED 2026-09-12: superseded by
      # FleetProductionStale below (last-green age + undeployed merges, critical, flagship).
      # One invariant, one alert, one repair path.
      # fleet-ops#5785: STALE PRODUCTION — the replacement for the deleted (2026-09-12)
      # ProductDeployStalled. The trigger is the age of the LAST GREEN
      # production deploy, not the newest run's redness, so it also fires
      # on the shape Stalled is blind to: a newest-green-but-ancient run
      # (blocked duration reads 0 while production serves 3-day-old code),
      # and it proves the staleness MATTERS by requiring a main merge newer
      # than the last green — an idle repo with nothing merged does not
      # fire. The live instance this exists for: 0509 production sat on
      # the 2026-09-09T17:03Z build ~2.5 days while every Deploy production
      # run failed Gate C, 0509#2662 was closed by PR #2949 with no green
      # run proving the fix, and 100+ AUTO-REVERT HALT issues piled up —
      # a human found it by hand. severity=critical + repair_seat=flagship
      # routes the packet to a SENIOR seat through alert-repair-dispatch
      # (the Stalled dispatches to the cheapest healthy seat could see the
      # alert but never fixed the fault); the claim mutex still applies so
      # repeats cannot pile up. The AUTO-REVERT HALT issue pile-up is NOT
      # the escalation path — halts are noise-class, this alert is the
      # flagship repair dispatch.
      - alert: FleetProductionStale
        expr: fleet_product_production_stale_hours > 2 and on(repo) (fleet_product_undeployed_merges == 1)
        for: 15m
        labels:
          severity: critical
          service: fleet
          repair_seat: flagship
        annotations:
          summary: "{{ $labels.repo }} production stale: last green {{ $labels.workflow }} deploy {{ $value }}h ago while main has undeployed merges"
          description: "{{ $labels.repo }}'s production deploy workflow {{ $labels.workflow }} last ran GREEN {{ $value }}h ago AND main carries a merge newer than that green run — customers are running code merges superseded. Evidence: newest red run {{ with query (printf \"fleet_product_deploy_last_red_run_info{repo='%s',workflow='%s'}\" $labels.repo $labels.workflow) }}{{ . | first | label \"url\" }}{{ else }}none fetched{{ end }}; failing step {{ with query (printf \"fleet_product_deploy_last_red_step_info{repo='%s',workflow='%s'}\" $labels.repo $labels.workflow) }}{{ . | first | label \"job\" }}/{{ . | first | label \"step\" }}{{ else }}unknown{{ end }}; newest main merge {{ with query (printf \"fleet_product_main_last_merge_seconds{repo='%s'}\" $labels.repo) }}{{ . | first | value | humanizeTimestamp }}{{ else }}unknown{{ end }}. Repair (flagship seat): open the newest red run, read the failing step, land the fix, then confirm a GREEN {{ $labels.workflow }} run whose SHA contains the fix before the deploy-fault issue may close (the deploy-fault gate reopens it otherwise, fleet-ops#5785). fleet-ops#5785: 0509 production sat stale ~2.5 days on the 2026-09-09T17:03Z build while halts piled up."
          evidence: '{"repo":"{{ $labels.repo }}","workflow":"{{ $labels.workflow }}","stale_hours":{{ $value }},"last_red_run":{{ with query (printf "fleet_product_deploy_last_red_run_info{repo=''%s'',workflow=''%s''}" $labels.repo $labels.workflow) }}"{{ . | first | label "url" }}"{{ else }}null{{ end }},"failing_job":{{ with query (printf "fleet_product_deploy_last_red_step_info{repo=''%s'',workflow=''%s''}" $labels.repo $labels.workflow) }}"{{ . | first | label "job" }}"{{ else }}null{{ end }},"failing_step":{{ with query (printf "fleet_product_deploy_last_red_step_info{repo=''%s'',workflow=''%s''}" $labels.repo $labels.workflow) }}"{{ . | first | label "step" }}"{{ else }}null{{ end }}}'
      - alert: DeploymentQualityStale
        expr: absent(fleet_deployment_quality_up{repo="fleet-ops"}) or fleet_deployment_quality_up{repo="fleet-ops"} == 0
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "deployment-quality metrics computation failed or vanished"
          description: "fleet_deployment_quality_up is absent or 0 for 15+ minutes — lib/fleet-deploy-quality.py failed (the gauges are NaN so threshold rules are silent; THIS alert is the only loud signal). The exporter logs 'deploy-quality: ...' to stderr; check journalctl --user -u fleet-metrics-export.service and /home/nish/.local/lib/pi-packet/fleet-deploy-quality.py. fleet-ops#2758."
      # fleet-ops#5250: a product repo whose deploy-quality computation failed
      # emits fleet_deployment_quality_up{repo="<r>"} 0 (missing
      # PRODUCT_DEPLOY_WORKFLOWS entry, unreadable runs source, gh outage) and
      # its gauges go NaN — ProductDeployStalled is blind for it.
      # DeploymentQualityStale above is repo="fleet-ops" scoped, so without
      # this rule an unmeasurable product repo emits up=0 forever unnoticed —
      # the same silent-absence shape #5140 fixed for the happy path. The 30m
      # fuse is longer than ProductDeployStalled's: a single bad scrape must
      # not fire.
      - alert: ProductDeployUnmeasurable
        expr: fleet_deployment_quality_up{repo!="fleet-ops"} == 0
        for: 30m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "{{ $labels.repo }} deployment-quality unmeasurable: fleet_deployment_quality_up 0 for 30m+"
          description: "fleet_deployment_quality_up{repo=\"{{ $labels.repo }}\"} has been 0 for 30+ minutes — lib/fleet-deploy-quality.py could not measure {{ $labels.repo }} (missing PRODUCT_DEPLOY_WORKFLOWS entry, unreadable runs source, or gh outage) and its deploy-quality gauges are NaN, so ProductDeployStalled is blind for it. The exporter logs 'deploy-quality: ...' to stderr; check journalctl --user -u fleet-metrics-export.service and /home/nish/.local/lib/pi-packet/fleet-deploy-quality.py. fleet-ops#5250."
      - alert: FleetCloseDuplicatesWrongClose
        expr: fleet_close_duplicates_closes_total{cross_repo="true"} > 0 or fleet_close_duplicates_closes_total{protected="true"} > 0
        for: 1m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "close-duplicates closed a cross-repo or protected issue (fleet-ops#3161)"
          description: "fleet_close_duplicates_closes_total{cross_repo=\"true\"} or {protected=\"true\"} is > 0: the duplicate sweep closed an issue it must only comment on (cross-repo canonical, critical-path label, or nish3451-authored). Both series must stay 0. Check the last close-duplicates.json and the tick log dup-cluster review lines."
      - alert: FleetObserveToCloseWrongClose
        expr: fleet_observe_to_close_total{reason="bare-mention"} > 0 or fleet_observe_to_close_total{reason="protected"} > 0
        for: 1m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "observe-to-close closed a mentioned or protected issue (fleet-ops#3231)"
          description: "fleet_observe_to_close_total{reason=\"bare-mention\"} or {reason=\"protected\"} is > 0: observe-to-close closed an issue it must only comment on (a mere PR mention without a Closes trailer or claim branch, or a critical-path/owner-authored issue). Both series must stay 0 — only claim-branch and closes-trailer may increment. This is the PR #3205 regression class: #3140/#3146 were closed by a bare mention. Check the last merged-pr-close.json and the tick log."
      # fleet-ops#5785: a deploy-fault issue was found CLOSED without a green
      # `Deploy production` run proving the fix — the lifecycle sweep already
      # reopened it (that IS the repair), so this alert is the audit
      # tripwire only: it must stay 0 and it never spawns a worker
      # (SKIP_SET in libexec/alert-repair-dispatch). A count >0 means some
      # close path bypassed the gate — GitHub auto-close on a merged trailer,
      # a human close, or a regression in the gate itself.
      - alert: FleetDeployFaultClosedWithoutGreen
        expr: fleet_deploy_fault_closed_without_green > 0
        for: 1m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "a deploy-fault issue was closed without a green Deploy production run (fleet-ops#5785)"
          description: "fleet_deploy_fault_closed_without_green is {{ $value }}: the lifecycle-label-sweep reopen pass found deploy-fault issue(s) closed while no green production-deploy run's SHA contains the fix, and reopened them. The repair already happened (reopen + deploy-fault-gate comment). Investigate WHO closed them — the legal close paths are a closing comment citing the green run URL, or a green run containing the delivery merge. Check /home/nish/.local/state/fleet-heartbeat/lifecycle-label-sweep.json and the sweep's tick log. Must stay 0."
      - alert: FleetObserveToCloseAbsent
        expr: absent(fleet_observe_to_close_total{reason="claim-branch"})
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "observe-to-close metric family vanished"
          description: "fleet_observe_to_close_total is absent for 15+ minutes — the merged-pr-close summary is not being written or the exporter is not emitting the family. Check bin/fleet-merged-pr-close in the heartbeat tick log and the merged-pr-close.json summary path. fleet-ops#3231."
      - alert: FleetLitellmProxyAbsent
        expr: (absent(fleet_litellm_proxy_up{endpoint="readiness"}) or fleet_litellm_proxy_up{endpoint="readiness"} == 0) unless fleet_litellm_organ_installed == 0
        for: 2m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "LiteLLM proxy organ absent or down (fleet-ops#4130 P1)"
          description: "fleet_litellm_proxy_up is absent for 2+ minutes or 0 (proxy unreachable on 127.0.0.1:4000/health/readiness) while the organ is installed (fleet_litellm_organ_installed=1). The unless-gate suppresses this while the P1 organ is deliberately NOT live-installed (Nish-gated, fleet-ops#4174): the canary then writes organ_installed=0 and the alert must not fire; once the venv exists the canary writes 1 and real organ death fires again. The proxy is the routing organ in front of every seat; its death benches the whole fleet. Repair: check journalctl --user -u fleet-litellm-proxy.service and the /health canary at journalctl --user -u fleet-litellm-health-canary.service. P4 drill: workers must fail loud <60s when this fires. fleet-ops#4130, #4221."
      - alert: FleetLitellmPostgresAbsent
        expr: (absent(fleet_litellm_postgres_up) or fleet_litellm_postgres_up == 0) unless fleet_litellm_organ_installed == 0
        for: 2m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "LiteLLM Postgres organ absent or down (fleet-ops#4130 P1)"
          description: "fleet_litellm_postgres_up is absent for 2+ minutes or 0 (pg_isready failed on the local socket) while the organ is installed (fleet_litellm_organ_installed=1). The unless-gate suppresses this while the P1 organ family is deliberately NOT live-installed (Nish-gated, fleet-ops#4174): the canary then writes organ_installed=0. Postgres backs budgets/keys/spend; without it budgets fail open (docs/proxy/users). Repair: check journalctl --user -u fleet-litellm-postgres.service and pg_isready -h /var/run/postgresql. Runbook: docs/litellm-postgres-setup.md. fleet-ops#4130, #4221."
      - alert: FleetLitellmRedisAbsent
        expr: (absent(fleet_litellm_redis_up) or fleet_litellm_redis_up == 0) unless fleet_litellm_organ_installed == 0
        for: 2m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "LiteLLM Redis organ absent or down (fleet-ops#4130 P1)"
          description: "fleet_litellm_redis_up is absent for 2+ minutes or 0 (redis-cli PING did not return PONG on 127.0.0.1:6379) while the organ is installed (fleet_litellm_organ_installed=1). The unless-gate suppresses this while the P1 organ family is deliberately NOT live-installed (Nish-gated, fleet-ops#4174): the canary then writes organ_installed=0. Redis backs the router fast path (cooldown cache, provider budget spend); without it the proxy falls back to per-request state. Repair: check journalctl --user -u fleet-litellm-redis.service. Runbook: docs/litellm-postgres-setup.md (Redis section). fleet-ops#4130, #4221."
      - alert: FleetLitellmHealthCanaryAbsent
        expr: absent(fleet_litellm_proxy_last_green_seconds) unless fleet_litellm_organ_installed == 0
        for: 3m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "LiteLLM /health canary freshness vanished (fleet-ops#4130 P1)"
          description: "fleet_litellm_proxy_last_green_seconds is absent for 3+ minutes while the organ is installed (fleet_litellm_organ_installed=1) — the 60s health canary (libexec/fleet-litellm-health-canary.py) is not running or has never seen proxy_up=1. The unless-gate suppresses this while the P1 organ is deliberately NOT live-installed (Nish-gated, fleet-ops#4174): the fail-open canary then writes organ_installed=0 and never last_green (fleet-ops#4221), so this alert must not fire. Once the venv exists the canary writes 1 and freshness loss fires again; if the canary itself dies, organ_installed goes stale, the gate drops, and the alert fires. The canary timer is fleet-litellm-health-canary.timer. Check journalctl --user -u fleet-litellm-health-canary.service. fleet-ops#4130, #4221."

  # fleet-ops#4141: recording rules that replace the derived numbers the
  # retired opus-heartbeat-gather computed from raw sources (systemd,
  # textfiles, seat JSON, logs). The hourly fleet judge (fable-fleet-check,
  # packet agent-state/fleet-landing-watch/fable-check.md) queries these via
  # /api/v1/query instead of re-deriving them. Every rule here is a pure
  # PromQL aggregation over metrics the existing exporter already emits — no
  # new exporter, no new textfile, no hand-built gatherer.
  - name: fleet_duty_officer_recording
    rules:
      # fleet-ops#4394: count() of an empty vector is absent, not 0. Each
      # expr uses `or vector(0)` so the judge-cited names
      # (`fleet_failed_units`, `fleet_seat_unhealthy_count`,
      # `fleet_workers_active`) always return a value.
      # tests/fleet-duty-officer-recording.test.sh pins the citations.
      # failed_units: the gather counted `systemctl --user list-units
      # --state=failed`; node_systemd_unit_state already carries it.
      - record: fleet_failed_units
        expr: count(node_systemd_unit_state{state="failed"} == 1) or vector(0)

      # unhealthy seat count: the gather read seat JSON and counted
      # health_class != healthy; fleet_pi_seat_healthy already carries it.
      - record: fleet_seat_unhealthy_count
        expr: count(fleet_pi_seat_healthy == 0) or vector(0)

      # active worker count (unit + process): the gather counted
      # systemctl pi-issue@ units; fleet_pi_workers_active already carries
      # the same rollup the undersaturation guard uses.
      - record: fleet_workers_active
        expr: sum(fleet_pi_workers_active{kind="sum"}) or vector(0)

  # fleet-ops#4206: Cursor $400 'API Usage' on-demand pool pacing. The
  # measured spend reader (bin/fleet-prepaid-util-canary) emits
  # fleet_prepaid_spend_usd{provider="cursor"} + pool/cycle/included from
  # POST api2.cursor.sh/aiserver.v1.DashboardService/GetCurrentPeriodUsage
  # into /var/lib/prometheus/node-exporter/prepaid-spend.prom. The rules
  # here pace the pool to zero by the billing-cycle reset and file a repair
  # packet (adds difficulty: senior-review to waiting heavy issues) when
  # the projected burn falls below pool/remaining-days. No new exporter or
  # scheduler — the existing canary tick + node_exporter textfile collector
  # feed these rules.
  - name: fleet_cursor_prepaid_pacing
    rules:
      # fleet_cursor_prepaid_remaining_usd: how much of the $400 on-demand
      # pool is left (pool - spend).
      - record: fleet_cursor_prepaid_remaining_usd
        expr: fleet_prepaid_pool_usd{provider="cursor"} - fleet_prepaid_spend_usd{provider="cursor"}

      # fleet_cursor_prepaid_remaining_days: days until the billing cycle
      # resets. Floored at 0 so a passed reset does not divide by zero or
      # produce a negative pacing target.
      - record: fleet_cursor_prepaid_remaining_days
        expr: clamp_min((fleet_prepaid_cycle_end_timestamp{provider="cursor"} - time()) / 86400, 0)

      # fleet_cursor_prepaid_required_daily_burn_usd: the daily spend rate
      # needed to exhaust the remaining pool by the reset. When the cycle
      # has passed (remaining_days == 0) this is 0 — no pacing needed.
      - record: fleet_cursor_prepaid_required_daily_burn_usd
        expr: fleet_cursor_prepaid_remaining_usd / clamp_min(fleet_cursor_prepaid_remaining_days, 1) * on() (fleet_cursor_prepaid_remaining_days > 0)

      # FleetCursorPrepaidSpendReaderAbsent: the spend reader is dead or
      # the canary tick stopped writing the textfile. severity=warning so
      # alert-repair-dispatch spawns a worker; the absence is the fault,
      # not a slow burn.
      - alert: FleetCursorPrepaidSpendReaderAbsent
        expr: absent(fleet_prepaid_spend_usd{provider="cursor"})
        for: 30m
        labels:
          severity: warning
          service: fleet
          repo: Nishfleet/fleet-ops
        annotations:
          summary: "cursor prepaid spend reader absent — fleet_prepaid_spend_usd{provider=cursor} missing for 30+ minutes"
          description: "fleet-ops#4206: bin/fleet-prepaid-util-canary is not writing /var/lib/prometheus/node-exporter/prepaid-spend.prom or the Cursor DashboardService GetCurrentPeriodUsage call is failing (auth missing, API unreachable, response shape changed). The $400 'API Usage' on-demand pool cannot be paced without this metric. Repair worker — check (1) the canary tick log for 'cursor spend reader: no data'; (2) ~/.config/cursor/auth.json exists and has accessToken (do NOT print the token); (3) curl -s -X POST -H 'Authorization: Bearer <token>' -d '{}' https://api2.cursor.sh/aiserver.v1.DashboardService/GetCurrentPeriodUsage returns JSON with spendLimitUsage; (4) the prepaid-spend.prom textfile is world-readable (0644) in the node_exporter textfile dir. Do NOT emit a fake zero — the absent() rule is the correct fail-loud."

      # FleetCursorPrepaidBurnPacingLow: the trailing-24h burn is below the
      # required daily burn (pool/remaining-days) for 2h, meaning the Cursor
      # $400 pool will not be spent by the reset. The repair packet adds
      # difficulty: senior-review to waiting heavy issues so pick_seat routes
      # them to the cursor/cursor-grok-4.6-high senior ladder.
      # severity=warning so alert-repair-dispatch spawns a worker that
      # edits issue bodies (gh issue edit --body) per the fable-check
      # 'Cursor API budget' block.
      - alert: FleetCursorPrepaidBurnPacingLow
        expr: |
          fleet_cursor_prepaid_remaining_usd > 0
            and fleet_cursor_prepaid_remaining_days > 0
            and increase(fleet_prepaid_spend_usd{provider="cursor"}[24h]) < fleet_cursor_prepaid_required_daily_burn_usd
        for: 2h
        labels:
          severity: warning
          service: fleet
          repo: Nishfleet/fleet-ops
        annotations:
          summary: "cursor $400 prepaid pool burn pacing low — trailing-24h burn below pool/remaining-days for 2h"
          description: "fleet-ops#4206: the Cursor 'API Usage' on-demand pool is being spent too slowly to exhaust by the billing-cycle reset. Repair worker — increase the share of senior-review/keystone work landing on cursor/cursor-grok-4.6-high: for each waiting heavy fleet-ops/0509 issue (open, agent-ready or unclaimed, difficulty: heavy or keystone), prepend 'difficulty: senior-review' to the top of the issue body (gh issue edit --body) so pick_seat routes it to the senior ladder (senior_seats_in_order starts with cursor/cursor-grok-4.6-high). Cap stays 2 (ETIMEDOUT above that); pacing comes from hours, not concurrency. Do NOT raise the cap above 2. Do NOT touch worker-tier models. The judge's Telegram line should quote fleet_prepaid_spend_usd{provider=cursor} and the remaining pool."

  # fleet-ops#5022: OpenCode Go weekly-pool pacing. bin/fleet-prepaid-util-canary
  # reads the subscription's own usage endpoint (GET
  # https://opencode.ai/zen/go/v1/usage) and writes
  # fleet_prepaid_usage_pct{provider="opencode-go",window=...},
  # fleet_prepaid_window_reset_seconds / _timestamp and
  # fleet_prepaid_paced_cap into
  # /var/lib/prometheus/node-exporter/prepaid-usage.prom. Same shape as
  # fleet_cursor_prepaid_pacing above: the existing canary tick + the
  # node_exporter textfile collector feed the rules, no new exporter and no new
  # scheduler. The paced cap is floor(remaining_weekly_pct / hours_to_reset *
  # K), floor 1, ceiling the declared cap; when the declared cap outruns the
  # pace the pool will not be exhausted by its reset, so a repair packet lowers
  # config/seat-caps.json .providers."opencode-go".cap to the paced number.
  - name: fleet_opencode_go_prepaid_pacing
    rules:
      # fleet_prepaid_remaining_weekly_pct: how much of the weekly pool is
      # left to spend before its reset.
      - record: fleet_prepaid_remaining_weekly_pct
        expr: 100 - fleet_prepaid_usage_pct{provider="opencode-go",window="weekly"}

      # fleet_prepaid_remaining_weekly_hours: hours until the weekly pool
      # resets. Floored at 0 so a passed reset does not produce a nonsense
      # pacing target.
      - record: fleet_prepaid_remaining_weekly_hours
        expr: clamp_min(fleet_prepaid_window_reset_seconds{provider="opencode-go",window="weekly"} / 3600, 0)

      # FleetOpenCodeGoUsageReaderAbsent: the usage reader is dead or the
      # canary tick stopped writing the textfile. severity=warning so
      # alert-repair-dispatch spawns a worker; the absence is the fault, not
      # the pool state.
      - alert: FleetOpenCodeGoUsageReaderAbsent
        expr: absent(fleet_prepaid_usage_pct{provider="opencode-go",window="weekly"})
        for: 30m
        labels:
          severity: warning
          service: fleet
          repo: Nishfleet/fleet-ops
        annotations:
          summary: "opencode-go usage reader absent — fleet_prepaid_usage_pct{provider=\"opencode-go\"} missing for 30+ minutes"
          description: "fleet-ops#5022: bin/fleet-prepaid-util-canary is not writing /var/lib/prometheus/node-exporter/prepaid-usage.prom or its GET https://opencode.ai/zen/go/v1/usage call is failing (key missing, API unreachable, response shape changed). Without this metric the weekly pool is a blind spot again — the 2026-09-10 incident was 80.1% of the weekly pool gone with 3.3 days left while the cap sat at 10. Repair worker — check (1) the canary tick log for 'opencode-go usage reader: no data'; (2) the key source resolves (OPENCODE_GO_ENV_FILE /home/nish/fleet2/etc/opencode-go.env OPENCODE_GO_API_KEY, else ~/.local/share/opencode/auth.json .\"opencode-go\".key — do NOT print the key); (3) curl -s -H 'Authorization: Bearer <key>' https://opencode.ai/zen/go/v1/usage returns {\"usage\":{\"rolling\":...}}; (4) prepaid-usage.prom is 0644 in the node_exporter textfile dir. Do NOT emit a fake zero — the absent() rule is the correct fail-loud."

      # FleetOpenCodeGoPaceExceeded: the declared cap is above what the
      # remaining weekly pool supports to its reset, so the pool runs out
      # before the window rolls over and the seat walls early. The repair
      # packet lowers the declared cap to the paced number.
      - alert: FleetOpenCodeGoPaceExceeded
        expr: |
          fleet_prepaid_declared_cap{provider="opencode-go"} > fleet_prepaid_paced_cap{provider="opencode-go"}
            and fleet_prepaid_paced_cap{provider="opencode-go"} > 0
            and fleet_prepaid_remaining_weekly_hours > 0
            and fleet_prepaid_remaining_weekly_pct > 0
        for: 2h
        labels:
          severity: warning
          service: fleet
          repo: Nishfleet/fleet-ops
        annotations:
          summary: "opencode-go cap above pace — the remaining weekly pool will not last to its reset"
          description: "fleet-ops#5022: fleet_prepaid_declared_cap{provider=\"opencode-go\"} is above fleet_prepaid_paced_cap for 2h. The paced cap is floor(remaining_weekly_pct / hours_to_reset * K), floor 1, ceiling the declared cap, with K measured 2026-09-10 (80% of the weekly pool over ~4 days at cap 10 => 0.8%/h per 10 cap units => K=12.5); it is how much concurrency spends exactly the remaining pool by the reset. Repair worker — set config/seat-caps.json .providers.\"opencode-go\".cap to the current fleet_prepaid_paced_cap and lower the deepseek-flash model cap with it (keep 1 as the floor), carrying a dated reason that quotes fleet_prepaid_usage_pct{provider=\"opencode-go\",window=\"weekly\"} and the reset; then PR it. Do NOT edit the live ~/.local/state/pi-packet/seat-caps.json — deploy install.sh overwrites it and it shows as MANIFEST drift. Do NOT touch other providers."

