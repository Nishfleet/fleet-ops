# Fleet alert rules.
#
# Glue sweep 2026-09-18 (exporter lane). This file went 67 rules -> 14.
#
# THE RULE FOR THIS FILE, and the only one: a rule lives here if and only if
#   (a) it guards money, backups, the seat proxy, main-red, or product
#       availability, AND
#   (b) its expression is written on a metric a STOCK exporter already emits.
#
# Stock sources, proven present on this host 2026-09-18:
#   litellm_*                     LiteLLM's own prometheus callback, 127.0.0.1:4000/metrics
#   node_systemd_unit_state       node_exporter systemd collector
#   node_filesystem_*, node_memory_*   node_exporter
#   node_textfile_mtime_seconds   node_exporter textfile collector
#   fleet_restore_drill_*         /usr/local/sbin/restic-r2-restore-test writes
#   fleet_litellm_pgdump_*        restic-restore-test.prom (same writer)
#   up{}                          prometheus scrape state
#   fleet_main_ci_green, fleet_product_up, fleet_prepaid_credits_usd
#                                 fleet-metrics-export.service — now ONE curl|jq
#                                 ExecStart line, no Python. Vendor state (GitHub
#                                 CI, the 0509 origin, Cursor's bucket) has no
#                                 stock exporter; this is the smallest reader.
#
# probe_success is NOT available (no blackbox_exporter on this host — the
# prometheus query returns an empty vector), so no rule may use it.
#
# The 53 deleted rules all read fleet_* gauges produced by the 4,679-line
# libexec/fleet-metrics-export.py and its SLO/quality libraries, which this
# sweep deleted. A rule with no producer is worse than no rule: it reads as
# coverage and can never fire.
#
# severity routing (config/alertmanager.yml): nish -> telegram (Nish's phone),
# page -> telegram, critical/warning/none -> prometheus-am-executor (repair
# dispatch). Only money reaches the phone as severity=nish.

groups:
  - name: fleet_watchdog
    rules:
      # Always firing. Its ABSENCE is the signal: if this stops arriving,
      # Prometheus or Alertmanager is dead and every other rule below is
      # silently unenforced.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog heartbeat for the alerting pipeline"
          description: "Always firing. If this disappears, Prometheus or Alertmanager is dead."

      # Every non-money rule terminates in prometheus-am-executor, which
      # dispatches the repair. If it is down, alerts fire into nothing.
      - alert: RepairDispatchDown
        expr: up{job="am-executor"} == 0
        for: 5m
        labels:
          severity: page
          service: fleet
        annotations:
          summary: "prometheus-am-executor is down — alerts cannot dispatch repair"
          description: "The repair-dispatch receiver is not scrapeable. Until it returns, every critical/warning alert is silent. Repair: systemctl --user status prometheus-am-executor."

  - name: fleet_money
    rules:
      # MONEY. The only rules on this file that reach Nish's phone.
      #
      # LiteLLM enforces the budget itself (it 400s the request when a key or
      # deployment is over max_budget); this rule exists so a key running DOWN
      # is visible before the fleet stalls on a hard wall. Both series come
      # straight from LiteLLM's prometheus callback.
      - alert: LitellmKeyBudgetNearlyExhausted
        expr: (litellm_remaining_api_key_budget_metric / litellm_api_key_max_budget_metric) < 0.10
        for: 10m
        labels:
          severity: nish
          service: money
        annotations:
          summary: "LiteLLM key {{ $labels.api_key_alias }} has under 10% of its budget left"
          description: "litellm_remaining_api_key_budget_metric for key alias {{ $labels.api_key_alias }} is below 10% of its max_budget. When it reaches zero LiteLLM hard-refuses the key and the fleet stalls. Money is Nish-reserved: raising a budget is his call, not the fleet's. Inspect with: curl -s 127.0.0.1:4000/key/info -H \"Authorization: Bearer $LITELLM_MASTER_KEY\"."

      # Prepaid vendor credit is only visible through the vendor API, so it
      # arrives via the one curl|jq textfile reader.
      - alert: FleetPrepaidCreditsLow
        expr: fleet_prepaid_credits_usd < 5
        for: 15m
        labels:
          severity: nish
          service: money
        annotations:
          summary: "prepaid seat {{ $labels.provider }} has under $5 of credit left"
          description: "fleet_prepaid_credits_usd{provider=\"{{ $labels.provider }}\"} is below $5. The seat walls at zero and every packet routed to it fails over. Topping it up is a money decision and therefore Nish's."

  - name: fleet_seat_proxy
    rules:
      # The seat proxy is the single routing organ. Nothing reaches a model
      # without it.
      - alert: FleetLitellmProxyAbsent
        expr: absent(up{job="litellm"}) or up{job="litellm"} == 0
        for: 5m
        labels:
          severity: critical
          service: seat-proxy
        annotations:
          summary: "LiteLLM seat proxy is down or unscrapeable"
          description: "up{job=\"litellm\"} is 0 or absent. Every pi worker routes through this proxy, so the whole fleet is stalled. Repair: systemctl --user status fleet-litellm-proxy, then journalctl --user -u fleet-litellm-proxy -n 100."

  - name: fleet_backups
    rules:
      # Backups. Both series are written by /usr/local/sbin/restic-r2-restore-test
      # into restic-restore-test.prom — a restic textfile, independent of any
      # fleet exporter.
      - alert: ResticRestoreProofStale
        expr: (time() - fleet_restore_drill_last_success_seconds > 28800) or absent(fleet_restore_drill_last_success_seconds)
        for: 15m
        labels:
          severity: critical
          service: backups
        annotations:
          summary: "no proven restic restore in 8+ hours"
          description: "restic-r2-restore-test.timer runs every 6h and only writes fleet_restore_drill_last_success_seconds after a --verify restore actually succeeds. Stale means the backup is unproven, which is the same risk as no backup. Repair: systemctl start restic-r2-restore-test.service and read its journal."

      - alert: LitellmPgDumpStale
        expr: (time() - fleet_litellm_pgdump_mtime_seconds > 129600) or fleet_litellm_pgdump_mtime_seconds == 0
        for: 15m
        labels:
          severity: critical
          service: backups
        annotations:
          summary: "LiteLLM control-plane pg_dump is stale or missing"
          description: "The budgets/keys/spend database behind the seat proxy has no fresh dump. Losing it loses every virtual key and its spend history. Written by restic-r2-backup.service ExecStartPre; repair by running that unit."

  - name: fleet_host
    rules:
      # Host rules are here because a full disk or an exhausted machine takes
      # out the backups and the seat proxy — they are not general host
      # monitoring, and the load/inode/predict_linear variants were cut.
      - alert: SystemUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "system unit {{ $labels.name }} failed"
          description: "Root-level systemd unit {{ $labels.name }} is in failed state. Repair: systemctl status {{ $labels.name }} and journalctl -u {{ $labels.name }} -n 100."

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) < 0.10
        for: 10m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "filesystem {{ $labels.mountpoint }} below 10% free"
          description: "A full disk fails the restic backup and the LiteLLM postgres write path. Repair: reclaim space, starting with agent worktrees under ~/workspaces/agent-worktrees."

      - alert: MemoryPressureHigh
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.08
        for: 15m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "under 8% memory available"
          description: "systemd-oomd starts reaping at this point, and it does not preferentially spare the seat proxy or postgres. Repair: check the pi-issue@ worker count against the 25-worker cap in the intake prompt."

  - name: fleet_delivery
    rules:
      # main-red and product availability. Neither GitHub nor the 0509 origin
      # is a prometheus target, so both arrive through the one curl|jq
      # ExecStart in fleet-metrics-export.service.
      - alert: FleetMainRed
        expr: fleet_main_ci_green == 0
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "main is red on {{ $labels.repo }}"
          description: "The default branch of {{ $labels.repo }} has a failing CI conclusion. Every worker branches from main, so a red main poisons every PR opened after it. Fix forward or revert now — never watch main red."

      - alert: ProductDown
        expr: fleet_product_up == 0
        for: 5m
        labels:
          severity: critical
          service: product
        annotations:
          summary: "product {{ $labels.repo }} is not serving"
          description: "An HTTP probe of the {{ $labels.repo }} production origin did not return a success status. This is customer-visible. Repair: check the most recent deploy and roll back if it correlates."

      # The three rules above have exactly one producer. If it stops, they all
      # read as healthy forever — so the producer's own freshness is a rule.
      - alert: FleetProbeStale
        expr: (time() - node_textfile_mtime_seconds{file="fleet.prom"}) > 1200
        for: 5m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet.prom textfile is over 20 minutes stale"
          description: "fleet-metrics-export.timer runs every 5 minutes. While it is stale, FleetMainRed, ProductDown and FleetPrepaidCreditsLow cannot fire. Repair: systemctl --user status fleet-metrics-export.service."

      - alert: FleetProbeMissing
        expr: absent(node_textfile_mtime_seconds{file="fleet.prom"})
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "fleet.prom textfile is absent entirely"
          description: "The textfile has never been written or was deleted. Same blind spot as FleetProbeStale, but with no timestamp to age out. Repair: systemctl --user start fleet-metrics-export.service."
