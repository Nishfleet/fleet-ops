# pg_hba.conf for the router database (fleet-litellm-postgres.container).
# Every connection, unix socket or loopback TCP, must pass scram-sha-256.
# There is no replication entry, so no replication connection is accepted.
# Postgres listens on 127.0.0.1 only (postgresql.conf), so the IPv6 line is
# defensive. Rules are read top to bottom; the first match decides.
# TYPE  DATABASE  USER  ADDRESS        METHOD
local   all       all                  scram-sha-256
host    all       all   127.0.0.1/32   scram-sha-256
host    all       all   ::1/128        scram-sha-256
