# promtool test rules config/prometheus-tests/agent-run-failure-share.test.yml (CI runs it).
# AgentRunFailureShare (fleet-ops#11799). github_workflow_runs is GitHub's all-time count
# per conclusion, scraped every 15 minutes, so each series climbs by the runs that finished.
# https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
rule_files:
  - ../../rootfs/etc/prometheus/fleet_rules.yml

evaluation_interval: 1m

tests:
  # The 2026-10-29 to 11-05 shape: 1 failed per 10 passed, every day. Quiet while only one
  # 24-hour window exists, firing once both windows are over 2% for 30 minutes.
  - interval: 15m
    input_series:
      - series: 'github_workflow_runs{job="agent-runs",conclusion="success"}'
        values: '0+10x240'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="failure"}'
        values: '0+1x240'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="timed_out"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 47h
        alertname: AgentRunFailureShare
        exp_alerts: []
      - eval_time: 49h
        alertname: AgentRunFailureShare
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "more than 2% of finished agent runs failed two days running"
              description: "9.091% of finished agent.yml runs failed in the last 24 hours, and over 2% the 24 hours before. Find what fails most, fix it, and prove the share fell. Runs: https://github.com/Nishfleet/fleet-ops/actions/workflows/agent.yml"

  # Failures start at hour 30: today is over 2%, the day before had none, so it stays quiet.
  - interval: 15m
    input_series:
      - series: 'github_workflow_runs{job="agent-runs",conclusion="success"}'
        values: '0+10x240'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="failure"}'
        values: '0x120 0+1x120'
    alert_rule_test:
      - eval_time: 50h
        alertname: AgentRunFailureShare
        exp_alerts: []

  # The last window governs: a one-day failure burst that straddles the 24-hour boundary
  # fires while it sits in both windows, and clears once it has aged out of the last one,
  # even though the day before is still over 2%. That was untested: no earlier case had a
  # dirty day-before window and a clean last one, so a rule that read the day-before window
  # alone passed every case in this file.
  - interval: 15m
    input_series:
      - series: 'github_workflow_runs{job="agent-runs",conclusion="success"}'
        values: '0+10x240'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="failure"}'
        values: '0x96 0+1x48 48x96'
    alert_rule_test:
      # The burst (hours 24-36) sits in both windows, so both are over 2% and it fires.
      - eval_time: 54h30m
        alertname: AgentRunFailureShare
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "more than 2% of finished agent runs failed two days running"
              description: "2.34% of finished agent.yml runs failed in the last 24 hours, and over 2% the 24 hours before. Find what fails most, fix it, and prove the share fell. Runs: https://github.com/Nishfleet/fleet-ops/actions/workflows/agent.yml"
      # The burst has aged out of the last window: 1.74% now, so the alert is quiet, while
      # the day before is still 3.13%.
      - eval_time: 56h
        alertname: AgentRunFailureShare
        exp_alerts: []

  # The GitHub read is unauthenticated (see prometheus.yml), and one refused hour hides a
  # whole conclusion: on 2026-11-15 the offset sliver of the success series held only
  # refused scrapes, the series dropped out of the difference, and the alert read 100% for
  # a day whose true share was 37.5% (fleet-ops#12032). This replays that: the success
  # count is missing for six scrapes (24:15-25:30) across the offset sliver, 1000
  # successes finish after it, and 3 failures in the window. True share 0.3%, so quiet.
  # A 20m lookback lost the series, summed 3 of 3, and fired from 48:51; 75m still finds
  # the 24:00 sample and keeps the reading true.
  - interval: 15m
    input_series:
      - series: 'github_workflow_runs{job="agent-runs",conclusion="success"}'
        values: '100x96 _ _ _ _ _ _ 100x2 1100x105'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="failure"}'
        values: '20x32 22x72 25x105'
    alert_rule_test:
      - eval_time: 49h
        alertname: AgentRunFailureShare
        exp_alerts: []

  # The 2026-11-19 to 11-22 week that fired the alert (fleet-ops#12117): four
  # failure increments over four days -- two one-off hosted-lane dispatch
  # failures, one pi process death, and the 03:30 IST Sunday reboot that
  # failed runner 6's job mid-run -- with the all-time counts flat after it
  # (the fix retires the hand-installed second Sunday reboot that doubled the
  # kill window). This replays the real scrape grid, t=0 being 2026-11-19
  # 00:00 UTC and each step starting at the first 15-minute scrape that
  # carried the new all-time count: 64 at 18h15m (Nov 19), 65 at 42h30m
  # (Nov 20), 66 at 69h (Nov 21 21:00, the pi death), 67 at 70h15m (Nov 21
  # 22:15, the reboot kill), 270th success at 91h45m (Nov 22 19:45), and
  # nothing after. Firing at 93h30m (Nov 22 21:30 UTC, the live alert fired
  # 21:29; one failure of two finished runs -- the 270th success landed in the
  # same bracket) and quiet again at 94h30m (22:30 UTC), once the 67th failure
  # has left the last 24-hour window -- proving the alert resolves on its own
  # when no new failures land.
  - interval: 15m
    input_series:
      - series: 'github_workflow_runs{job="agent-runs",conclusion="success"}'
        values: '265x72 266x103 267x93 268 269x94 270x277'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="failure"}'
        values: '63x72 64x97 65x104 66x4 67x364'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="timed_out"}'
        values: '0x640'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="startup_failure"}'
        values: '0x640'
    alert_rule_test:
      - eval_time: 93h30m
        alertname: AgentRunFailureShare
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "more than 2% of finished agent runs failed two days running"
              description: "50% of finished agent.yml runs failed in the last 24 hours, and over 2% the 24 hours before. Find what fails most, fix it, and prove the share fell. Runs: https://github.com/Nishfleet/fleet-ops/actions/workflows/agent.yml"
      # The 67th failure has left the last window (its carrier was Nov 21
      # 22:15, inside the last bracket only until 94h15m): 0 of 1 finished run
      # today, so the alert is quiet, while the day before is still 100%.
      - eval_time: 94h30m
        alertname: AgentRunFailureShare
        exp_alerts: []
      # It stays quiet: the counts are flat, so no window can turn over 2%.
      - eval_time: 119h
        alertname: AgentRunFailureShare
        exp_alerts: []

  # No run finished for two days (dispatch paused): 0 of 0 is no share, so quiet.
  - interval: 15m
    input_series:
      - series: 'github_workflow_runs{job="agent-runs",conclusion="success"}'
        values: '79x240'
      - series: 'github_workflow_runs{job="agent-runs",conclusion="failure"}'
        values: '32x240'
    alert_rule_test:
      - eval_time: 50h
        alertname: AgentRunFailureShare
        exp_alerts: []

  # The counts never arrive (exporter down, or GitHub refused the read): blind, so it fires
  # after 30 minutes, as the old Grafana rule's error state did.
  - interval: 15m
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentRunFailureShare
        exp_alerts: []
      - eval_time: 40m
        alertname: AgentRunFailureShare
        exp_alerts:
          - exp_labels:
              severity: warning
              job: agent-runs
            exp_annotations:
              summary: "agent run counts have not arrived for an hour"
              description: "github_workflow_runs{job=\"agent-runs\"} is missing: check prometheus-json-exporter.service and the GitHub API read, because the failure-share alert is blind."
