# promtool test rules config/prometheus-tests/fleet-rules.test.yml
# (CI runs it). The rule file is the one the host installs.
rule_files:
  - ../../rootfs/etc/prometheus/fleet_rules.yml

evaluation_interval: 30s

tests:
  # Watchdog fires on an empty TSDB, from the first evaluation.
  - interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Watchdog heartbeat for the alerting pipeline"
              description: "Always firing. If this disappears, Prometheus or Alertmanager is dead."

  # Gateway active the whole time: never fires. Then it stops being active and
  # the alert fires once the 5 minute window holds no active sample.
  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{name="hermes-gateway.service",state="active"}'
        values: '1x20 0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: HermesGatewayDown
        exp_alerts: []
      # last active sample at t=9.5m; the window (t-5m, t] holds none from t=14m30s
      - eval_time: 14m
        alertname: HermesGatewayDown
        exp_alerts: []
      - eval_time: 16m
        alertname: HermesGatewayDown
        exp_alerts:
          - exp_labels:
              severity: nish
              name: hermes-gateway.service
              state: active
            exp_annotations:
              summary: "hermes-gateway.service has not been active for 5 minutes"
              description: "node_systemd_unit_state{name=\"hermes-gateway.service\",state=\"active\"} has no active sample in the last 5 minutes, or the series is missing."

  # A crash loop that is "active" for one scrape in the window does not fire
  # (it is restarting, not down), and a short restart gap never fires.
  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{name="hermes-gateway.service",state="active"}'
        values: '1x10 0x3 1x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: HermesGatewayDown
        exp_alerts: []

  # The series disappears entirely: fires after the window empties.
  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{name="hermes-gateway.service",state="active"}'
        values: '1x10 _x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: HermesGatewayDown
        exp_alerts: []
      - eval_time: 16m
        alertname: HermesGatewayDown
        exp_alerts:
          - exp_labels:
              severity: nish
              name: hermes-gateway.service
              state: active
            exp_annotations:
              summary: "hermes-gateway.service has not been active for 5 minutes"
              description: "node_systemd_unit_state{name=\"hermes-gateway.service\",state=\"active\"} has no active sample in the last 5 minutes, or the series is missing."

  # SystemUnitFailed: pending for 5m, then fires; a unit that recovers does not.
  - interval: 30s
    input_series:
      - series: 'node_systemd_unit_state{name="foo.service",state="failed"}'
        values: '0x4 1x20'
      - series: 'node_systemd_unit_state{name="bar.service",state="failed"}'
        values: '1x4 0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: SystemUnitFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: SystemUnitFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              name: foo.service
              state: failed
            exp_annotations:
              summary: "system unit foo.service failed"
              description: "Systemd unit foo.service has been in the failed state for 5 minutes."

  # BackupStale: a timer that triggered 29h ago is fine; once it is past 30h
  # and stays there for 15m, it pages. A missing timer series pages too.
  - interval: 30m
    input_series:
      - series: 'node_systemd_timer_last_trigger_seconds{name="restic-r2-backup.timer"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 29h
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 31h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: nish
              name: restic-r2-backup.timer
            exp_annotations:
              summary: "off-site backup has not run for over 30 hours"
              description: "restic-r2-backup.timer last triggered more than 30 hours ago, or its series is missing."
  - interval: 30m
    input_series:
      - series: 'node_systemd_timer_last_trigger_seconds{name="restic-r2-backup.timer"}'
        values: '0+1800x80'
    alert_rule_test:
      - eval_time: 40h
        alertname: BackupStale
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'node_systemd_timer_last_trigger_seconds{name="other.timer"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: nish
              name: restic-r2-backup.timer
            exp_annotations:
              summary: "off-site backup has not run for over 30 hours"
              description: "restic-r2-backup.timer last triggered more than 30 hours ago, or its series is missing."

  # BackupFailed: a one-off failure that recovers within the hour is silent;
  # a unit that stays failed for an hour pages.
  - interval: 5m
    input_series:
      - series: 'node_systemd_unit_state{name="restic-r2-backup.service",state="failed"}'
        values: '1x24'
      - series: 'node_systemd_unit_state{name="restic-r2-locked-copy.service",state="failed"}'
        values: '1x6 0x18'
      - series: 'node_systemd_unit_state{name="restic-r2-backupX.service",state="failed"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 90m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels:
              severity: nish
              name: restic-r2-backup.service
              state: failed
            exp_annotations:
              summary: "backup unit restic-r2-backup.service has been failed for 1 hour"
              description: "Systemd unit restic-r2-backup.service is in the failed state, so last night's off-site backup did not complete."

  # SiteDown: a site that fails one probe is silent; one that fails every
  # probe for 10 minutes pages. Jobs not named site-* are ignored.
  - interval: 30s
    input_series:
      - series: 'probe_success{job="site-0509",instance="https://0509.io/"}'
        values: '1x10 0 1x30'
      - series: 'probe_success{job="site-rera",instance="https://example.test/"}'
        values: '1x10 0x40'
      - series: 'probe_success{job="blackbox-other",instance="https://other.test/"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 16m
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              severity: nish
              job: site-rera
              instance: https://example.test/
            exp_annotations:
              summary: "https://example.test/ has not answered for 10 minutes"
              description: "Every blackbox probe of https://example.test/ (job site-rera) failed, or could not run, for 10 minutes."

  # SiteDown when the blackbox exporter itself is down: the scrape fails, so
  # up is 0 and probe_success is missing. A short scrape gap stays silent.
  - interval: 30s
    input_series:
      - series: 'up{job="site-products",instance="https://example.test/"}'
        values: '1x10 0x40'
      - series: 'up{job="site-0509",instance="https://0509.io/"}'
        values: '1x10 0 1x30'
      - series: 'up{job="prometheus",instance="localhost:9090"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 12m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 16m
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              severity: nish
              job: site-products
              instance: https://example.test/
            exp_annotations:
              summary: "https://example.test/ has not answered for 10 minutes"
              description: "Every blackbox probe of https://example.test/ (job site-products) failed, or could not run, for 10 minutes."

  # AISpendHigh: 1 USD an hour (24 USD a day) never fires; 3 USD an hour
  # crosses 40 USD within the day and pages.
  - interval: 1h
    input_series:
      - series: 'litellm_spend_metric_total{model="a"}'
        values: '0+1x48'
    alert_rule_test:
      - eval_time: 47h
        alertname: AISpendHigh
        exp_alerts: []
  - interval: 15m
    input_series:
      - series: 'litellm_spend_metric_total{model="a"}'
        values: '0+0.75x120'
    alert_rule_test:
      - eval_time: 10h
        alertname: AISpendHigh
        exp_alerts: []
      - eval_time: 20h
        alertname: AISpendHigh
        exp_alerts:
          - exp_labels:
              severity: nish
            exp_annotations:
              summary: "AI spend is over 40 USD in the last 24 hours"
              description: "sum(increase(litellm_spend_metric_total[24h])) is 60.00 USD, above the 40 USD daily line."

  # AISpendMetricMissing: a counter that stops for a few hours is silent; a
  # whole day with no series pages.
  - interval: 1h
    input_series:
      - series: 'litellm_spend_metric_total{model="a"}'
        values: '0+1x5 _x40'
    alert_rule_test:
      - eval_time: 20h
        alertname: AISpendMetricMissing
        exp_alerts: []
      - eval_time: 33h
        alertname: AISpendMetricMissing
        exp_alerts:
          - exp_labels:
              severity: nish
            exp_annotations:
              summary: "AI spend metric has been missing for over a day"
              description: "No litellm_spend_metric_total series for 24 hours, so AISpendHigh cannot fire."
