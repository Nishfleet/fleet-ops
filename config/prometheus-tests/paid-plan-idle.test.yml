# promtool test rules config/prometheus-tests/paid-plan-idle.test.yml (CI runs it).
# PaidPlanIdle (fleet-ops#11845): a paid endpoint that keeps taking calls never
# alerts, one idle for 24 hours does, and a row the success counter has never
# seen (no successful call since the last router restart) fires off
# litellm_deployment_state, while an endpoint outside config/paid-plans.json
# stays quiet. A plan the provider itself is refusing for quota (a 429 usage
# wall) is used, not idle: while the router holds a 429 refusal for the plan
# inside the window it stays quiet, a refusal older than the window is stale and
# does not silence it, and the silence after a restart with neither successes
# nor refusals recorded still fires (fleet-ops#11985).
# https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
rule_files:
  - ../../rootfs/etc/prometheus/fleet_rules.yml

evaluation_interval: 1h

tests:
  # opencode.ai takes calls the whole time and stays quiet; anthropic has been
  # idle longer than the window and fires; commandcode stops at t=4h, so its
  # 24-hour window empties and it fires too, while nothing else does.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1"}'
        values: '0+10x30'
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4002",api_base="https://api.anthropic.com/v1/messages"}'
        values: '42x30'
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://api.commandcode.ai/provider/v1"}'
        values: '10+5x4 30x25'
    alert_rule_test:
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://api.anthropic.com
            exp_annotations:
              summary: "paid plan https://api.anthropic.com has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://api.anthropic.com in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."
      - eval_time: 28h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://api.anthropic.com
            exp_annotations:
              summary: "paid plan https://api.anthropic.com has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://api.anthropic.com in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."
          - exp_labels:
              severity: warning
              api_base: https://api.commandcode.ai/provider/v1
            exp_annotations:
              summary: "paid plan https://api.commandcode.ai/provider/v1 has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://api.commandcode.ai/provider/v1 in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."

  # A row that has never succeeded since the router started has no success
  # counter, only litellm_deployment_state: it fires, labelled by the plan's own
  # api_base (the rule strips the runtime "/v1/messages" suffix). A busy paid
  # endpoint and an endpoint that is not in config/paid-plans.json (the vercel
  # eval gateway) stay quiet.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://api.z.ai/api/coding/paas/v4"}'
        values: '0+5x10'
      - series: 'litellm_deployment_state{job="litellm",instance="127.0.0.1:4001",api_base="https://api.minimax.io/anthropic/v1/messages",model_id="minimax-m31-worker-capable",litellm_model_name="MiniMax-M3.1-Flash-Preview"}'
        values: '0x10'
      - series: 'litellm_deployment_state{job="litellm",instance="127.0.0.1:4001",api_base="https://ai-gateway.vercel.sh/v4/ai/evaluation-model",litellm_model_name="jev-latest"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://api.minimax.io/anthropic
            exp_annotations:
              summary: "paid plan https://api.minimax.io/anthropic has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://api.minimax.io/anthropic in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."

  # fleet-ops#11985 (seen live 2026-11-13): OpenCode Go tripped its monthly usage
  # wall, the endpoint answered 429 to every call and callers fell back, so the
  # success counter stood still for the whole window. The provider refusing the
  # calls is the opposite of idle, and the vendor resets the plan itself. A
  # refusal inside the window is the wall's signature and the plan stays quiet.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1"}'
        values: '30x41'
      - series: 'litellm_deployment_failure_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1",exception_status="429",exception_class="Openai.RateLimitError"}'
        values: '1+1x40'
    alert_rule_test:
      # A 429 refusal inside the window: walled, not idle — stays quiet.
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts: []
      # Still refused 32 hours later: quiet.
      - eval_time: 32h
        alertname: PaidPlanIdle
        exp_alerts: []

  # The router's refusal counter is born at the plan's first 429 (a fresh
  # counter series is created at 1, which is exactly how the live one was
  # seen), so a wall that parks its rows and draws no further refusals leaves
  # the counter flat at 1 and increase() cannot see it. The second term keeps
  # the plan quiet while the refusal is younger than the window, and a refusal
  # older than the window is a stale one from any cause: the plan's rows are
  # dead and it is being paid for nothing, which is what this alert exists to
  # catch.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1"}'
        values: '30x41'
      - series: 'litellm_deployment_failure_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1",exception_status="429",exception_class="Openai.RateLimitError"}'
        values: '1+0x41'
    alert_rule_test:
      # The refusal is 3 hours old: inside the window, the plan is walled.
      - eval_time: 3h
        alertname: PaidPlanIdle
        exp_alerts: []
      # The refusal is 26 hours old: past the window, the plan is idle again.
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://opencode.ai/zen/go/v1
            exp_annotations:
              summary: "paid plan https://opencode.ai/zen/go/v1 has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://opencode.ai/zen/go/v1 in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."
      # The counter lives until a router restart wipes it; a stale one must not
      # silence the plan for good.
      - eval_time: 32h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://opencode.ai/zen/go/v1
            exp_annotations:
              summary: "paid plan https://opencode.ai/zen/go/v1 has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://opencode.ai/zen/go/v1 in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."

  # A refusal first seen inside the window (the counter series is born at the
  # plan's first 429, so it starts at 4 hours here) suppresses the alert while
  # it is young, and stops suppressing it once it is older than the window.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1"}'
        values: '30x41'
      - series: 'litellm_deployment_failure_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1",exception_status="429",exception_class="Openai.RateLimitError"}'
        values: '_x4 1x40'
    alert_rule_test:
      # The refusal is 22 hours old: inside the window, the plan is walled.
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts: []
      # The refusal is 28 hours old: past the window, the plan is idle again.
      - eval_time: 32h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://opencode.ai/zen/go/v1
            exp_annotations:
              summary: "paid plan https://opencode.ai/zen/go/v1 has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://opencode.ai/zen/go/v1 in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."

  # Same plan seen live 2026-11-13 at 10:59 UTC: the router restarted mid-wall,
  # parked rows drew no probes for hours, so no refusal was recorded and the
  # success counter stood still since the restart. This blind gap is what the
  # alert exists for — it fires until a probe records the wall.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://opencode.ai/zen/go/v1"}'
        values: '30x41'
    alert_rule_test:
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              api_base: https://opencode.ai/zen/go/v1
            exp_annotations:
              summary: "paid plan https://opencode.ai/zen/go/v1 has had no successful router response for 24 hours"
              description: "The router answered no successful response for paid-plan endpoint https://opencode.ai/zen/go/v1 in the last 24 hours (plans: config/paid-plans.json). Callers moved on, or its rows in config/litellm-proxy.yaml are dead and the plan is being paid for nothing."

  # fleet-ops#11884 (seen live 2026-11-10): the router exports a deployment's
  # state under its configured api_base, while the counter only carries the
  # runtime URL the Anthropic provider built (plan api_base + "/v1/messages"),
  # so an exact join missed a plan that was taking calls all day. MiniMax's
  # state series under both label sets with thousands of successful responses
  # at the suffixed one must stay quiet.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://api.minimax.io/anthropic/v1/messages",model_id="minimax-m31-assistant"}'
        values: '0+100x30'
      - series: 'litellm_deployment_state{job="litellm",instance="127.0.0.1:4001",api_base="https://api.minimax.io/anthropic",model_id="minimax-m31-assistant",litellm_model_name="assistant"}'
        values: '2x30'
      - series: 'litellm_deployment_state{job="litellm",instance="127.0.0.1:4001",api_base="https://api.minimax.io/anthropic/v1/messages",model_id="minimax-m31-assistant",litellm_model_name="MiniMax-M3.1-Flash-Preview"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts: []

  # fleet-ops#11943 (seen live 2026-11-12): the OpenAI provider serves some of
  # CommandCode's calls through the Responses API, so litellm_deployment_state
  # carries a runtime api_base (plan api_base + "/v1/responses") while the
  # success counter stays under the configured one. A busy CommandCode plan
  # whose state sits under both label sets must stay quiet.
  - interval: 1h
    input_series:
      - series: 'litellm_deployment_success_responses_total{job="litellm",instance="127.0.0.1:4001",api_base="https://api.commandcode.ai/provider/v1",model_id="commandcode-glm53flash-worker-capable"}'
        values: '0+100x30'
      - series: 'litellm_deployment_state{job="litellm",instance="127.0.0.1:4001",api_base="https://api.commandcode.ai/provider/v1",api_provider="openai",model_id="commandcode-glm53flash-worker-capable",litellm_model_name="z-ai/glm-5.3-flash"}'
        values: '0x30'
      - series: 'litellm_deployment_state{job="litellm",instance="127.0.0.1:4001",api_base="https://api.commandcode.ai/provider/v1/responses",model_id="commandcode-glm53flash-worker-capable",litellm_model_name="z-ai/glm-5.3-flash"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 26h
        alertname: PaidPlanIdle
        exp_alerts: []
