# Private-detail rules for the PR scan (see "Private detail scan" in README.md).
#
# Not named .gitleaks.toml on purpose: gitleaks loads that name on its own, and
# the existing full-history scan would then fail on old commits. CI passes this
# file with --config and only scans the commits a pull request adds.
#
# To silence one line, put `gitleaks:allow` in a comment on it.

title = "private detail rules"

[extend]
useDefault = true

[[rules]]
id = "private-home-path"
description = "Absolute path under a personal home directory"
# Starts at "home", not "/home": the default allowlist drops matches that begin with a slash.
regex = '''\bhome/nish/[A-Za-z0-9._~/-]*'''
keywords = ["home/nish/"]

[[rules]]
id = "private-fleet-seats-config"
description = "Path of the local seat configuration"
regex = '''\.config/fleet-ops/seats'''
keywords = [".config/fleet-ops/seats"]

[[rules]]
id = "private-tailscale-ipv4"
description = "Tailscale address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

[[rules]]
id = "private-tailscale-name"
description = "Tailscale MagicDNS name"
regex = '''[A-Za-z0-9-]+\.ts\.net\b'''
keywords = [".ts.net"]

[[rules]]
id = "private-cloudflare-account-id"
description = "32-hex value next to an account id name"
regex = '''(?i)account[_-]?id\b[^\n]{0,24}?\b[0-9a-f]{32}\b'''
keywords = ["account"]

[[allowlists]]
description = "This file names the patterns it looks for"
paths = ['''(^|/)gitleaks-private-detail\.toml$''']

[[allowlists]]
description = "The pre-existing prometheus-reload and blacksmith-flip retirement lines in fleet-sync.service, touched by earlier commits of #9697 (a PR scan reads every commit, and history cannot be rewritten on an open PR)"
targetRules = ["private-home-path"]
paths = ['''(^|/)systemd/fleet-sync\.service$''']
regexes = ['''fleet-prometheus-reload|blacksmith-flip''']
condition = "AND"

[[allowlists]]
description = "The Hermes sandbox drop-in must name the paths its ReadWritePaths= grants (the unit file has no %h for a system unit, and no inline comment to carry gitleaks:allow); the line is re-added whenever a path is added to it"
targetRules = ["private-home-path"]
paths = ['''(^|/)rootfs/etc/systemd/system/hermes-\.service\.d/sandbox\.conf$''']
regexes = ['''home/nish/(\.hermes|\.local/state/hermes|\.config/gh|workspaces/tooling/nish-vault/00)''']
condition = "AND"

[[allowlists]]
description = "The runner lockdown and eval drop-ins, and podman-eval.service, must name the paths their InaccessiblePaths= hides (a system unit has no %h, and a unit line has no inline comment to carry gitleaks:allow); fleet-ops#9983"
targetRules = ["private-home-path", "private-fleet-seats-config"]
paths = ['''(^|/)rootfs/etc/systemd/system/(actions\.runner\.[^/]*\.service\.d/(20-lockdown|30-eval)\.conf|podman-eval\.service)$''']

[[allowlists]]
description = "The Tincan listener unit is a system unit (no %h, and no inline comment to carry gitleaks:allow), so it names the paths its BindPaths= and Environment= lines use; moved byte for byte from /etc/systemd/system, fleet-ops#9974 phase A"
targetRules = ["private-home-path", "private-fleet-seats-config"]
paths = ['''(^|/)rootfs/etc/systemd/system/tincan-listen-claude-vps\.service$''']
