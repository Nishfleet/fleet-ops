# Private-detail rules for the PR scan (see "Private detail scan" in README.md).
#
# Not named .gitleaks.toml on purpose: gitleaks loads that name on its own, and
# the existing full-history scan would then fail on old commits. CI passes this
# file with --config and only scans the commits a pull request adds.
#
# To silence one line, put `gitleaks:allow` in a comment on it.

title = "private detail rules"

[extend]
useDefault = true

[[rules]]
id = "private-home-path"
description = "Absolute path under a personal home directory"
# Starts at "home", not "/home": the default allowlist drops matches that begin with a slash.
regex = '''\bhome/nish/[A-Za-z0-9._~/-]*'''
keywords = ["home/nish/"]

[[rules]]
id = "private-fleet-seats-config"
description = "Path of the local seat configuration"
regex = '''\.config/fleet-ops/seats'''
keywords = [".config/fleet-ops/seats"]

[[rules]]
id = "private-tailscale-ipv4"
description = "Tailscale address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

[[rules]]
id = "private-tailscale-name"
description = "Tailscale MagicDNS name"
regex = '''[A-Za-z0-9-]+\.ts\.net\b'''
keywords = [".ts.net"]

[[rules]]
id = "private-cloudflare-account-id"
description = "32-hex value next to an account id name"
regex = '''(?i)account[_-]?id\b[^\n]{0,24}?\b[0-9a-f]{32}\b'''
keywords = ["account"]

[[allowlists]]
description = "This file names the patterns it looks for"
paths = ['''(^|/)gitleaks-private-detail\.toml$''']

[[allowlists]]
description = "The pre-existing prometheus-reload and blacksmith-flip retirement lines in fleet-sync.service, touched by earlier commits of #9697 (a PR scan reads every commit, and history cannot be rewritten on an open PR)"
targetRules = ["private-home-path"]
paths = ['''(^|/)systemd/fleet-sync\.service$''']
regexes = ['''fleet-prometheus-reload|blacksmith-flip''']
condition = "AND"

[[allowlists]]
description = "The Hermes sandbox drop-in must name the paths its ReadWritePaths= grants (the unit file has no %h for a system unit, and no inline comment to carry gitleaks:allow); the line is re-added whenever a path is added to it"
targetRules = ["private-home-path"]
paths = ['''(^|/)rootfs/etc/systemd/system/hermes-\.service\.d/sandbox\.conf$''']
regexes = ['''home/nish/(\.hermes|\.local/state/hermes|\.config/gh|workspaces/tooling/nish-vault/00)''']
condition = "AND"

[[allowlists]]
description = "dockerd-eval.service denies the CGNAT block (the tailnet range) in IPAddressDeny=, a unit line with no inline comment to carry gitleaks:allow, and its test reads that line back; the block is a generic range, not a host address; fleet-ops#9983"
targetRules = ["private-tailscale-ipv4"]
paths = ['''^rootfs/etc/systemd/system/dockerd-eval\.service$|^tests/test_dockerd_eval\.py$''']
regexes = ['''100\.64\.0\.0''']
condition = "AND"

[[allowlists]]
description = "The runner lockdown, no-eval and eval drop-ins, dockerd-eval.service, and its test, must name the paths their InaccessiblePaths= hides (a system unit has no %h, and a unit line has no inline comment to carry gitleaks:allow); fleet-ops#9983"
targetRules = ["private-home-path", "private-fleet-seats-config"]
paths = ['''(^|/)rootfs/etc/systemd/system/(actions\.runner\.[^/]*\.service\.d/(20-lockdown|25-no-eval|30-eval)\.conf|dockerd-eval\.service)$|^tests/test_dockerd_eval\.py$|^rootfs/etc/tmpfiles\.d/dockerd-eval\.conf$''']

[[allowlists]]
description = "The tmpfiles file for the blocked plaintext git credential store must name its path (a tmpfiles line has no inline comment to carry gitleaks:allow), and its test names it too; fleet-ops#9983"
targetRules = ["private-home-path"]
paths = ['''(^|/)(rootfs/etc/tmpfiles\.d/no-plaintext-git-credentials\.conf|tests/test_no_plaintext_git_credentials\.py)$''']
regexes = ['''^home/nish/\.git-credentials(/README)?$''']
condition = "AND"

[[allowlists]]
description = "The Tincan listener unit is a system unit (no %h, and no inline comment to carry gitleaks:allow), so it names the paths its BindPaths= and Environment= lines use; moved byte for byte from /etc/systemd/system, fleet-ops#9974 phase A"
targetRules = ["private-home-path", "private-fleet-seats-config"]
paths = ['''(^|/)rootfs/etc/systemd/system/tincan-listen-claude-vps\.service$''']

[[allowlists]]
description = "The desktop server unit binds the tailnet address with -interface, which takes an address and not a name (no inline comment on an ExecStart= line to carry gitleaks:allow)"
targetRules = ["private-tailscale-ipv4"]
paths = ['''(^|/)systemd/tigervnc\.service$''']
regexes = ['''^100\.108\.184\.97$''']
condition = "AND"

[[allowlists]]
description = "The runner egress drop-in must list the CGNAT block 100.64.0.0/10 in IPAddressDeny= (a unit line cannot carry gitleaks:allow); only the network address of the block itself, never a host address"
targetRules = ["private-tailscale-ipv4"]
paths = ['''(^|/)rootfs/etc/systemd/system/actions\.runner\.[^/]+\.service\.d/40-egress\.conf$''']
regexes = ['''^100\.64\.0\.0$''']
condition = "AND"

[[allowlists]]
description = "The seo-fix-kit D1 backup retirement names three user-unit paths the host deploy stops, disables and deletes (fleet-ops#10145). An earlier commit of that PR wrote them as literals; the play now renders them from nish_home and the test asserts that form, and a PR scan reads every commit while history cannot be rewritten on an open PR. Only these three paths, in the two files that carry the retirement"
targetRules = ["private-home-path"]
paths = ['''(^|/)(ansible/host\.yml|tests/test_systemd_unit_keys\.py)$''']
regexes = ['''home/nish/\.config/systemd/user/(timers\.target\.wants/)?seofixkit-d1-backup\.(service|timer)''']
condition = "AND"
