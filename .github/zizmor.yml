# zizmor policy for this repo's workflows, run by the ci job.
# https://docs.zizmor.sh/configuration/
# Every entry below is a finding kept on purpose, with its reason.
rules:
  unpinned-uses:
    config:
      policies:
        # Called at @main on purpose. agent.yml: runner group 3 allows only
        # agent.yml@refs/heads/main, and a SHA pin strands every job
        # (0509#5231, fleet-ops#8617). grade.yml: the grader comes from main,
        # so a PR is never graded by the grade.yml it changes (fleet-ops#8655).
        # devin-grade: the same rule, and the 0509 calibration must run the
        # action that grades pull requests (fleet-ops#8926).
        Nishfleet/fleet-ops/.github/workflows/agent.yml: ref-pin
        Nishfleet/fleet-ops/.github/workflows/grade.yml: ref-pin
        Nishfleet/fleet-ops/.github/actions/devin-grade: ref-pin
        "*": hash-pin
  dangerous-triggers:
    ignore:
      # pull_request_target carries the dequeued/auto_merge_disabled signals
      # and workflow_run carries CI results for claim PRs. Nothing in the file
      # checks out PR code, and the jobs those events reach run only for a
      # claim/issue-* branch whose head repo is this repository
      # (fleet-ops#8457, fleet-ops#8608).
      - agent-dispatch.yml
  self-repository:
    ignore:
      # The `$/` form fails actionlint 1.7.12, which gates this same job, and
      # no-glue is a required check. Switch once actionlint accepts it.
      - ci.yml
