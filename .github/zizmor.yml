# zizmor policy for this repo's workflows, run by the ci job.
# https://docs.zizmor.sh/configuration/
# Every entry below is a finding kept on purpose, with its reason.
rules:
  unpinned-uses:
    config:
      policies:
        # Called at @main on purpose. agent.yml: runner group 3 allows only
        # agent.yml@refs/heads/main, and a SHA pin strands every job
        # (0509#5231, fleet-ops#8617).
        Nishfleet/fleet-ops/.github/workflows/agent.yml: ref-pin
        # The ratchet must run from main so a PR cannot change the rule it is judged by (#9627).
        Nishfleet/fleet-ops/.github/workflows/ratchet.yml: ref-pin
        # The probe runs from main, like agent.yml, so one definition serves every
        # job and repo (fleet-ops#9983).
        Nishfleet/fleet-ops/.github/actions/runner-probe: ref-pin
        # agent.yml's per-job steps live in actions from main, so every agent.yml job
        # runs one definition and parallel PRs edit disjoint files (fleet-ops#10723).
        Nishfleet/fleet-ops/.github/actions/stuck: ref-pin
        "*": hash-pin
  self-repository:
    ignore:
      # The scan steps live in a local action, and it is new in the same PR that first calls it:
      # `@main` would resolve against main, where the action does not exist yet, so the required
      # Gitleaks context would fail on its own introducing PR. The suggested `$/` is not GitHub
      # syntax (actionlint 1.7.12 rejects it as a ref-less action).
      - secret-scan.yml
  dangerous-triggers:
    ignore:
      # pull_request_target carries dequeued (the ejected job, which runs on
      # dequeued only) and closed (miss-review-pr); auto_merge_disabled is
      # still subscribed but starts no job, since a hold or a deliberate
      # disarm must not start a worker. workflow_run carries CI results for
      # claim PRs. Nothing in the file checks out PR code, and the jobs those
      # events reach run only for a claim/issue-* branch whose head repo is
      # this repository (fleet-ops#8457, fleet-ops#8608). The exception is hold-risky, which
      # runs for every PR on auto_merge_enabled/synchronize/labeled/opened/
      # reopened but only calls the API: file names are read as data and no
      # head code is checked out or run (0509#7092). hold-risky never reads the
      # FLEET_DISPATCH_PAUSED pause flag, so it runs while dispatch is paused
      # (ci.yml asserts it). The paused job that logs a pause reads only the
      # event name and action, through env, and has no permissions.
      - agent-dispatch.yml
