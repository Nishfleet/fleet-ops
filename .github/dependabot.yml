# fleet-ops#6153: the bump half of GitHub's pin-and-bump pairing.
# SHA pins live in .github/workflows/**. Without this file those SHAs
# only move by hand, which is a rotting pin, not a control.
# One ecosystem only: fleet-ops is not an npm app.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
