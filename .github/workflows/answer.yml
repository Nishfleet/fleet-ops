name: answer
# When nishfleet-approver requests changes on an agent/issue-* PR, dispatch agent.yml on main
# to answer them. It cannot run here, because a pull_request_review run is on the PR's merge
# ref, which environment `agent` (main only) refuses.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_review
# https://docs.github.com/en/actions/concepts/security/github_token#when-github_token-triggers-workflow-runs
on:
  pull_request_review:
    types: [submitted]
  workflow_call:
permissions: {}
jobs:
  dispatch:
    if: >-
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == 'nishfleet-approver' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {actions: write}
    steps:
      - name: Dispatch the review round on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          issue=${HEAD_REF#agent/issue-}
          case "$issue" in ''|*[!0-9]*) echo "::error::$HEAD_REF is not agent/issue-<number>"; exit 1 ;; esac
          gh workflow run agent.yml -R "$REPO" --ref "$MAIN" -f issue="$issue" -f pr="$NUMBER"
