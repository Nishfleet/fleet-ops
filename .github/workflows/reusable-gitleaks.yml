# Reusable pinned-gitleaks secret scan — the gitleaks BINARY (MIT-licensed, free
# for everyone), installed and pinned by version AND SHA-256. The
# gitleaks-action wrapper demands an org license key and aborts without one on
# Nishfleet repos; installing the release binary restores real scanning at zero
# cost. The release is pinned by version AND by SHA-256, so the download is as
# tamper-evident as a SHA-pinned `uses:`.
#
# This is the standalone secret-scan gate for consumers that need `Gitleaks` as
# a NAMED required status context separate from reusable-pr-checks.yml. Callers
# that bundle gitleaks into pr-checks (scan-secrets: true) do NOT also need this.
#
# Call from a consumer:
#   jobs:
#     gitleaks:
#       uses: Nishfleet/fleet-ops/.github/workflows/reusable-gitleaks.yml@main
#
# Same-repo callers use ./.github/workflows/reusable-gitleaks.yml (this commit).
#
# REQUIRED-CONTEXT SAFETY (the part that matters):
#   GitHub counts a SKIPPED required context as satisfying branch protection,
#   so this job has NO job-level `if:` and NO `needs` (a job with needs is
#   skipped when its dependency fails; an if: can skip on cancellation or any
#   future condition edit). The authorizer is step 1 of THIS job, so a fork PR
#   or unapproved dispatch candidate fails the required check with a real
#   failure — a gate that cannot verify must say no, never render green or
#   skipped. Path optimization lives in step-level conditions only.
#
# Standing CI standard (vault global-standing-rules.md), by construction:
#   1. timeout-minutes on the job.
#   2. concurrency + cancel-in-progress.
#   3. pinned binary (version + SHA-256), no floating ref.
#   4. fetch-depth: 0 — gitleaks git walks full history.
#   5. --redact keeps secret values out of public logs; --exit-code 2 separates
#      "leaks found" (2) from "scanner errored" (1).
#   6. no CI that watches CI.

name: Reusable gitleaks scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Pinned gitleaks release version. Bump deliberately."
        type: string
        required: false
        default: "8.30.1"
      gitleaks-sha256:
        description: "SHA-256 of the gitleaks_<version>_linux_x64.tar.gz archive. Bump alongside gitleaks-version."
        type: string
        required: false
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      timeout-minutes:
        description: "Job timeout."
        type: number
        required: false
        default: 15
      expected-sha:
        description: "Exact main commit authorized for a workflow_dispatch secret scan. Pass from the caller's workflow_dispatch input. Empty for pull_request/push/merge_group."
        type: string
        required: false
        default: ""

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Authorize exact secret-scan candidate
        # Fork guard as a step, not a job: it refuses fork PRs and unapproved
        # dispatch candidates with a real failure of the required job. The repo
        # identity is the CALLER's (github.repository), not a hardcoded name —
        # this workflow is reusable across every Nishfleet/nish3451 repo.
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            push)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" = "refs/heads/main" || "$GITHUB_REF" = "refs/heads/master" ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            merge_group)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" =~ ^refs/heads/gh-readonly-queue/ ]]
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Clear stale gitleaks installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- /tmp/gitleaks.tmp
          rm -rf -- "${RUNNER_TEMP:?}/gitleaks"
      - name: Install pinned gitleaks binary
        shell: bash
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:?}/gitleaks"
          mkdir -p -- "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 180 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          rm -f -- "$archive"
          chmod +x -- "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan repository
        # Fork guard on the scan step, kept from the gitleaks-action era: the
        # authorizer above already fails fork PRs before this step, and this
        # guard keeps untrusted fork code away from the job even if that gate
        # is ever removed. The scan itself consumes no secret.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --redact --exit-code 2 --verbose --no-banner
