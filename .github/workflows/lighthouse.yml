# The fleet's Lighthouse speed budget, defined once. A web repo passes the URLs; the
# assertions are config/lighthouserc.json here, so no caller can loosen them.
name: Lighthouse

on:
  workflow_call:
    inputs:
      urls:
        description: Page URLs to audit, one per line.
        required: true
        type: string
      upload_reports:
        description: Keep the full reports as a run artifact. Off unless the caller asks.
        type: boolean
        default: false
      non_blocking:
        description: When true, a failed audit sets the red output instead of failing the run.
        type: boolean
        default: false
    outputs:
      red:
        description: True when the audit failed or could not run. Always set under non_blocking.
        value: ${{ jobs.lighthouse.outputs.red }}

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      red: ${{ steps.verdict.outputs.red }}
    steps:
      # A reusable workflow cannot see its called ref, so the config is read from main.
      - name: Fetch the Lighthouse config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nishfleet/fleet-ops
          ref: main
          path: fleet-ops
          sparse-checkout: config/lighthouserc.json
          persist-credentials: false
      - name: Audit the URLs against the assertions
        id: audit
        continue-on-error: ${{ inputs.non_blocking }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ inputs.urls }}
          runs: 5
          configPath: ./fleet-ops/config/lighthouserc.json
          uploadArtifacts: ${{ inputs.upload_reports }}
          temporaryPublicStorage: false
      - name: Export the audit verdict
        id: verdict
        # The default step condition is success(), so after a failed earlier
        # step this would be skipped and the verdict would never say red.
        if: ${{ !cancelled() && inputs.non_blocking }}
        run: |
          case "${{ steps.audit.outcome }}" in
            success) red=false ;;
            *) red=true ;;
          esac
          echo "red=$red" >> "$GITHUB_OUTPUT"
