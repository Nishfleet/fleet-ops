# The fleet's Lighthouse speed budget, defined once. A web repo calls this and
# passes only the URLs; the assertions are config/lighthouserc.json in this
# repo, so no caller can loosen them. Same action and pin as 0509's lighthouse job.
name: Lighthouse

on:
  workflow_call:
    inputs:
      urls:
        description: Page URLs to audit, one per line.
        required: true
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # A reusable workflow cannot see the ref it was called at, so the config
      # is read from main: callers pinned to an older SHA still get today's config.
      - name: Fetch the Lighthouse config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nishfleet/fleet-ops
          ref: main
          path: fleet-ops
          sparse-checkout: config/lighthouserc.json
          persist-credentials: false
      - name: Audit the URLs against the assertions
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ inputs.urls }}
          runs: 5
          configPath: ./fleet-ops/config/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
      # Diagnostics only: never changes the audit's result and loosens nothing.
      # The action writes its reports to .lighthouseci/ in the workspace; with 5
      # runs per URL, manifest.json marks the median run that the verdict uses.
      - name: Print the LCP breakdown of every audited URL
        if: always()
        continue-on-error: true
        run: |
          for report in $(jq -r '.[] | select(.isRepresentativeRun) | .jsonPath' .lighthouseci/manifest.json); do
            jq -r '
              "\(.finalDisplayedUrl // .finalUrl): LCP \(.audits["largest-contentful-paint"].numericValue | round) ms, server \(.audits["server-response-time"].numericValue | round) ms",
              "  element: \(.audits["largest-contentful-paint-element"].details.items[0].items[0].node.snippet // "n/a")",
              "  phases: \([.audits["largest-contentful-paint-element"].details.items[1].items[]? | "\(.phase) \(.timing | round) ms"] | join(", "))",
              "  render-blocking: \([.audits["render-blocking-resources"].details.items[]? | "\(.url) \(.wastedMs | round) ms"] | join(", "))",
              "  font-display score: \(.audits["font-display"].score)",
              (
                [.audits["errors-in-console"].details.items[]? | "  console errors: \(.source // "n/a"): \((.description // "n/a") | gsub("\\s*\n\\s*"; " ")) (\(.sourceLocation.url // .url // "n/a"))"]
                | if length == 0 then "  console errors: none" else .[] end
              )
            ' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done
