# The fleet's Lighthouse speed budget, defined once: the caller passes the URLs, the assertions are
# config/lighthouserc.json from fleet-ops main, because a called ref is invisible to a reusable workflow.
name: Lighthouse

on:
  workflow_call:
    inputs:
      urls:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the Lighthouse config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nishfleet/fleet-ops
          ref: main
          path: fleet-ops
          sparse-checkout: config/lighthouserc.json
          persist-credentials: false
      - name: Skip a URL that answers the Cloudflare Access login, and name it
        id: reach
        env: {URLS: "${{ inputs.urls }}"}
        run: |
          for u in $URLS; do [ -n "$u" ] || continue; case "$(curl -sm10 -o /dev/null -w '%{redirect_url}' "$u")" in *cloudflareaccess.com/cdn-cgi/access/login*) echo "::warning::$u answers the Cloudflare Access login, not the site, so it was not measured";; *) ok+="$u"$'\n';; esac; done
          { echo 'urls<<END'; printf %s "$ok"; echo END; } >> "$GITHUB_OUTPUT"
      - name: Audit the URLs against the assertions
        if: steps.reach.outputs.urls != ''
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ steps.reach.outputs.urls }}
          runs: 5
          configPath: ./fleet-ops/config/lighthouserc.json
          temporaryPublicStorage: false
