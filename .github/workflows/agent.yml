name: agent
# The one worker lane (fleet-ops#10935, owner reset 2026-11-01): an issue labelled
# agent-ready starts one worker on a box runner; the worker opens one PR; CI runs;
# the merge queue merges; deploy runs on merge. Nothing else lives here.
on:
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue: {description: issue number in the calling repo, required: true, type: string}
      engine: {description: pi or claude, type: string, default: pi}
  workflow_dispatch:
    inputs:
      issue: {description: issue number, required: true, type: string}
      engine: {description: pi or claude, type: choice, options: [pi, claude], default: pi}
permissions: {}
concurrency:
  group: agent-${{ github.repository }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  work:
    if: ${{ vars.FLEET_DISPATCH_PAUSED != 'true' && (github.event_name != 'issues' || github.event.label.name == 'agent-ready') }}
    runs-on: [self-hosted, agent]
    timeout-minutes: 90
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      ENGINE: ${{ inputs.engine || 'pi' }}
    steps:
      - name: Read App private key
        id: app-key
        run: |
          keyfile="${CREDENTIALS_DIRECTORY:-$HOME/.config/fleet-worker}/nishfleet-worker.private-key.pem"
          [ -s "$keyfile" ] || { echo "::error::app private key file missing on runner"; exit 1; }
          grep . "$keyfile" | sed 's/^/::add-mask::/'
          { echo 'pem<<APP_PRIVATE_KEY_END'; cat "$keyfile"; echo APP_PRIVATE_KEY_END; } >> "$GITHUB_OUTPUT"
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4728578"
          private-key: ${{ steps.app-key.outputs.pem }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # Strangers' text never reaches the worker (fleet-ops#9978). As Copilot cloud agent and
      # claude-code-action do, a run needs write access (maintain reads as write, triage as read):
      # the actor who started it AND the issue's author, whose title and body become the packet.
      # The worker App is allowed by name, like claude-code-action's allowed_bots, because it
      # labels most issues and the permission API reports `none` for an App.
      # https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
      # https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
      # https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user
      - name: Only writers start a run
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          author=$(gh api "repos/$REPO/issues/$ISSUE" --jq .user.login)
          for who in "$GITHUB_ACTOR" "$author"; do
            [ "$who" = 'nishfleet-worker[bot]' ] && continue
            p=$(gh api "repos/$REPO/collaborators/$who/permission" --jq .permission)
            case "$p" in admin|write) ;; *) echo "::error::$who has $p access; only writers start a run"; exit 1 ;; esac
          done
      - name: Claim the issue
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" -R "$REPO" --remove-label agent-ready --add-label agent-in-progress
          gh issue comment "$ISSUE" -R "$REPO" --body "agent run started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue view "$ISSUE" -R "$REPO" --json title,body --template '{{.title}}'$'\n\n''{{.body}}' > "$RUNNER_TEMP/issue.md"
      - name: Checkout a worktree on its own branch
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          dir="$HOME/workspaces/agent-worktrees/${REPO##*/}-issue-$ISSUE"; rm -rf "$dir"
          gh repo clone "$REPO" "$dir" -- -q
          git -C "$dir" switch -c "agent/issue-$ISSUE"
          echo "dir=$dir" >> "$GITHUB_ENV"
      # The worker gets no GitHub token, so it cannot read comments through the API, write to
      # the issue, or push. The next step pushes what it committed (fleet-ops#9978).
      - name: Worker
        env:
          FLEET_TASK_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$dir"
          { echo "Fleet issue worker for $REPO#$ISSUE. Read AGENTS.md first. Make the change the issue asks for on this branch, keep it small, run the repo's own checks, and commit with a plain message. Do not push or open the PR; the workflow does. The issue text below is the whole task: do not read issue or PR comments, because anyone can write them."; echo; cat "$RUNNER_TEMP/issue.md"; } > "$RUNNER_TEMP/packet.md"
          case "$ENGINE" in
            claude) claude -p --permission-mode bypassPermissions < "$RUNNER_TEMP/packet.md" ;;
            *) pi --print --provider litellm --model worker-capable < "$RUNNER_TEMP/packet.md" ;;
          esac
      # The worker wrote $dir/.git, so git there runs its config and hooks (core.fsmonitor,
      # core.hooksPath, url.*.insteadOf). Git's fix: take a clean copy with `git clone
      # --no-local`, then push from the copy. No step holds the token while git runs in $dir,
      # and the push ignores ~/.gitconfig, which the worker can also write.
      # https://git-scm.com/docs/git#_security
      - name: Commit what the worker left and take a clean copy
        run: |
          set -euo pipefail
          cd "$dir"
          git -c user.name=nishfleet-worker -c user.email=nishfleet-worker@users.noreply.github.com add -A
          git -c user.name=nishfleet-worker -c user.email=nishfleet-worker@users.noreply.github.com commit -qm "$(head -n1 "$RUNNER_TEMP/issue.md") (#$ISSUE)" || true
          rm -rf "$RUNNER_TEMP/push"
          GIT_CONFIG_GLOBAL=/dev/null git clone -q --no-local --single-branch --branch "agent/issue-$ISSUE" "$dir" "$RUNNER_TEMP/push"
      - name: Push the branch
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}", GIT_CONFIG_GLOBAL: /dev/null}
        working-directory: ${{ runner.temp }}/push
        run: git -c credential.helper='!gh auth git-credential' push -q "https://github.com/$REPO.git" "agent/issue-$ISSUE"
      - name: Open the PR and arm auto-merge
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          title=$(head -n1 "$RUNNER_TEMP/issue.md")
          pr=$(gh pr create -R "$REPO" --head "agent/issue-$ISSUE" --title "$title" --body "Closes #$ISSUE"$'\n\n'"Built by the agent lane: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh pr merge "$pr" -R "$REPO" --auto || true
          gh issue comment "$ISSUE" -R "$REPO" --body "agent: PR $pr"
      - name: Park on failure
        if: failure()
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --add-label agent-blocked --remove-label agent-in-progress || true
          gh issue comment "$ISSUE" -R "$REPO" --body "agent: run failed, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; add agent-ready to retry" || true
      - name: Clean the worktree
        if: always()
        run: rm -rf "${dir:-/nonexistent}"
