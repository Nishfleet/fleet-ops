name: agent
# The one worker lane (fleet-ops#10935, owner reset 2026-11-01): an issue labelled
# agent-ready starts one worker on a box runner; the worker opens one PR; CI runs;
# the merge queue merges; deploy runs on merge. Nothing else lives here.
on:
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue: {description: issue number in the calling repo, required: true, type: string}
      engine: {description: pi or claude, type: string, default: pi}
  workflow_dispatch:
    inputs:
      issue: {description: issue number, required: true, type: string}
      engine: {description: pi or claude, type: choice, options: [pi, claude], default: pi}
permissions: {}
concurrency:
  group: agent-${{ github.repository }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  work:
    if: ${{ vars.FLEET_DISPATCH_PAUSED != 'true' && (github.event_name != 'issues' || github.event.label.name == 'agent-ready') }}
    runs-on: [self-hosted, agent]
    timeout-minutes: 90
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      ENGINE: ${{ inputs.engine || 'pi' }}
    steps:
      - name: Read App private key
        id: app-key
        run: |
          keyfile="${CREDENTIALS_DIRECTORY:-$HOME/.config/fleet-worker}/nishfleet-worker.private-key.pem"
          [ -s "$keyfile" ] || { echo "::error::app private key file missing on runner"; exit 1; }
          grep . "$keyfile" | sed 's/^/::add-mask::/'
          { echo 'pem<<APP_PRIVATE_KEY_END'; cat "$keyfile"; echo APP_PRIVATE_KEY_END; } >> "$GITHUB_OUTPUT"
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4728578"
          private-key: ${{ steps.app-key.outputs.pem }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Claim the issue
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" -R "$REPO" --remove-label agent-ready --add-label agent-in-progress
          gh issue comment "$ISSUE" -R "$REPO" --body "agent run started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue view "$ISSUE" -R "$REPO" --json title,body --template '{{.title}}'$'\n\n''{{.body}}' > "$RUNNER_TEMP/issue.md"
      - name: Checkout a worktree on its own branch
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          dir="$HOME/workspaces/agent-worktrees/${REPO##*/}-issue-$ISSUE"; rm -rf "$dir"
          gh repo clone "$REPO" "$dir" -- -q
          git -C "$dir" switch -c "agent/issue-$ISSUE"
          echo "dir=$dir" >> "$GITHUB_ENV"
      - name: Worker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FLEET_TASK_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$dir"
          { echo "Fleet issue worker for $REPO#$ISSUE. Read AGENTS.md first. Make the change the issue asks for on this branch, keep it small, run the repo's own checks, commit with a plain message, and push the branch. Do not open the PR; the workflow does."; echo; cat "$RUNNER_TEMP/issue.md"; } > "$RUNNER_TEMP/packet.md"
          case "$ENGINE" in
            claude) claude -p --permission-mode bypassPermissions < "$RUNNER_TEMP/packet.md" ;;
            *) /home/nish/.local/bin/pi --print --provider litellm --model worker-capable < "$RUNNER_TEMP/packet.md" ;;
          esac
          git -c user.name=nishfleet-worker -c user.email=nishfleet-worker@users.noreply.github.com add -A
          git -c user.name=nishfleet-worker -c user.email=nishfleet-worker@users.noreply.github.com commit -qm "$(head -n1 "$RUNNER_TEMP/issue.md") (#$ISSUE)" || true
          git push -u origin "agent/issue-$ISSUE"
      - name: Open the PR and arm auto-merge
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          title=$(head -n1 "$RUNNER_TEMP/issue.md")
          pr=$(gh pr create -R "$REPO" --head "agent/issue-$ISSUE" --title "$title" --body "Closes #$ISSUE"$'\n\n'"Built by the agent lane: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh pr merge "$pr" -R "$REPO" --auto || true
          gh issue comment "$ISSUE" -R "$REPO" --body "agent: PR $pr"
      - name: Park on failure
        if: failure()
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --add-label agent-blocked --remove-label agent-in-progress || true
          gh issue comment "$ISSUE" -R "$REPO" --body "agent: run failed, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; add agent-ready to retry" || true
      - name: Clean the worktree
        if: always()
        run: rm -rf "${dir:-/nonexistent}"
