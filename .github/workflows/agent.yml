# The fleet's only dispatcher (fleet-ops#8429). GitHub owns the queue, the
# per-issue lock (concurrency group), the timeout and the logs. Capacity is
# the number of runners in the `agent` runner group, which only this workflow
# may use.
name: agent
on:
  workflow_call:
    inputs:
      ref:
        description: claim/issue-<N> branch the worker owns until merge
        type: string
        required: true

  # Scheduled agents (fleet-ops#8433), replacing pi-scout@0509.timer and
  # fleet-gardener.timer. Only fires on fleet-ops main; the jobs below tell a
  # cron run from a workflow_call by the empty inputs.ref.
  schedule:
    - cron: '0 */4 * * *'   # scout, Nishfleet/0509
    - cron: '0 4 * * 1'     # gardener, Mondays 09:30 IST
permissions: {}
jobs:
  work:
    if: inputs.ref
    runs-on: [self-hosted, agent]
    timeout-minutes: 60
    outputs:
      wall: ${{ steps.wall.outputs.wall }}
    concurrency:
      group: agent-${{ github.repository }}-${{ inputs.ref }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      REF: ${{ inputs.ref }}
      GIT_AUTHOR_NAME: nishfleet-worker[bot]
      GIT_AUTHOR_EMAIL: 321485391+nishfleet-worker[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: nishfleet-worker[bot]
      GIT_COMMITTER_EMAIL: 321485391+nishfleet-worker[bot]@users.noreply.github.com
    steps:
      - name: Read App private key
        id: app-key
        run: |
          keyfile="$HOME/.config/fleet-worker/nishfleet-worker.private-key.pem"
          [ -s "$keyfile" ] || { echo "::error::app private key file missing on runner"; exit 1; }
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < "$keyfile"
          delim=APP_PRIVATE_KEY_END
          {
            printf 'pem<<%s\n' "$delim"
            cat "$keyfile"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: "4728578"
          private-key: ${{ steps.app-key.outputs.pem }}
          owner: ${{ github.repository_owner }}
          skip-token-revoke: "false"
      - name: Gate
        # The dispatch policy that the old intake prompt used to carry, now in one
        # step: skip parked or blocked work, size unsized work (Jev first
        # opinion, else needs-split -> opus-vet), cap runs, then claim.
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          i=${REF#claim/issue-}
          skip() { echo "gate: skip ($1)"; echo go=false >> "$GITHUB_OUTPUT"; exit 0; }
          issue=$(gh api "repos/$REPO/issues/$i")
          labels=,$(jq -r '[.labels[].name]|join(",")' <<<"$issue"),
          [ "$(jq -r .state <<<"$issue")" = open ] || skip closed
          [ "$(jq -r '.issue_dependencies_summary.blocked_by // 0' <<<"$issue")" = 0 ] || skip blocked
          if jq -e '.title|startswith("__scout_probe_")' <<<"$issue" >/dev/null; then skip probe; fi
          for l in noise-class agent-blocked awaiting-runtime-gate needs-split needs-orchestrator needs-nish-decision nish-reserved deputy superseded-by-rebuild proposed epic umbrella; do
            case $labels in *",$l,"*) skip "$l" ;; esac
          done

          case $labels in *,cheap-ok,*|*,strong-only,*) ;; *)
            key=$(grep -m1 '^LITELLM_JEV_KEY=' "$HOME/.config/fleet-ops/seats/typesafe-jev.env" | cut -d= -f2-)
            echo "::add-mask::$key"
            p=$(jq -n --argjson s "$issue" '{custom_llm_provider: "vercel_ai_gateway", state: {issue: {ref: $s.html_url, title: $s.title, body: $s.body}}, questions: {cheap_ok: {type: "boolean", instructions: "Is this ONE small change (roughly 1-4 files, one behaviour, done in one sitting) whose steps and acceptance are already spelled out, so the builder only has to follow them? Answer no if it bundles several deliverables, asks the builder to discover or fix whatever turns up, depends on production after deploy, or leaves a design choice open."}}}' |
              curl -s --max-time 90 127.0.0.1:4000/jev -H "Authorization: Bearer $key" -H 'content-type: application/json' -d @- |
              jq -r '.answers.cheap_ok.probability // "unavailable"' 2>/dev/null || echo unavailable)
            if awk -v p="$p" 'BEGIN { exit !(p ~ /^[0-9.]+$/ && p + 0 >= 0.9) }'; then
              gh issue edit "$i" -R "$REPO" --add-label cheap-ok
              gh issue comment "$i" -R "$REPO" --body "jev cheap_ok: p=$p"
            else
              gh issue edit "$i" -R "$REPO" --add-label needs-split
              gh issue comment "$i" -R "$REPO" --body "jev cheap_ok: p=$p; Opus sizes"
              skip needs-split
            fi ;;
          esac

          # Hard stop for loops where a run "succeeds" but CI stays red: 3 runs
          # per issue since the newest opus-vet, counted from these comments.
          # shellcheck disable=SC2016 # $v is a jq variable
          runs=$(gh issue view "$i" -R "$REPO" --json comments --jq '[.comments[].body] | (map(startswith("opus-vet:")) | rindex(true) // -1) as $v | .[$v+1:] | map(select(startswith("agent run started:"))) | length')
          if [ "$runs" -ge 3 ]; then
            gh issue edit "$i" -R "$REPO" --add-label needs-orchestrator --remove-label agent-ready,agent-in-progress
            gh issue comment "$i" -R "$REPO" --body "agent attempt cap: $runs runs since the last opus-vet; parked for the orchestrator"
            skip cap
          fi

          # Engine (Nish, 2026-09-25). Cursor is the senior lane and is paced to
          # 1 run at once. strong-only issues need a senior model other than
          # SWE-2, so they go only to Cursor; a full Cursor lane leaves them
          # agent-ready. Every other issue: Devin SWE-2 Max while fewer than 4
          # run ($0), else pi while it has a free router slot, else Cursor.
          # A lane's live count is the distinct worker directories (Devin,
          # Cursor) or pi session directories on its bwrap command lines, so
          # it spans every runner and repo on this host.
          live() { pgrep -af -- "^bwrap .* -- $1 " | grep -oE 'agent-worktrees/issue-[^ ]*|sessions/agent-[^ ]*' | sort -u | wc -l; }
          # pi has a free slot while its live workers are fewer than the summed
          # max_parallel_requests of the router's worker-capable seats, and the
          # router is not walled (fleet-ops#8543: no raw worker-capable row
          # healthy, same filter as FleetWorkerLaneOutage; an empty or
          # unreachable /metrics is not a wall).
          pi_free() {
            slots=$(python3 -c 'import sys, yaml; print(sum(m["litellm_params"].get("max_parallel_requests") or 0 for m in yaml.safe_load(open(sys.argv[1]))["model_list"] if m.get("model_name") == "worker-capable"))' "$HOME/.config/fleet-ops/litellm-proxy.yaml")
            [ "$(live pi)" -lt "$slots" ] || return 1
            ! curl -sL --max-time 10 127.0.0.1:4000/metrics |
              awk '/^litellm_deployment_state\{/ && /model_id="[^"]*-worker-capable"/ && /litellm_model_name="[^"]*\// { n++; if ($NF + 0 == 0) up++ } END { exit !(n > 0 && up == 0) }'
          }
          # Devin is free while fewer than 4 run and it has not answered
          # "capacity issues" in the last 15 minutes (the Router wall step
          # touches the marker); until then its turn falls through to pi.
          devin_free() {
            [ "$(live devin)" -lt 4 ] && [ -z "$(find "$HOME/.cache/fleet-ops/devin-wall" -mmin -15 2>/dev/null)" ]
          }
          case $labels in
            *,strong-only,*) [ "$(live cursor-agent)" -lt 1 ] || skip lanes-full; engine=cursor ;;
            *)
              if devin_free; then engine=devin
              elif pi_free; then engine=pi
              elif [ "$(live cursor-agent)" -lt 1 ]; then engine=cursor
              else skip lanes-full
              fi ;;
          esac
          gh issue edit "$i" -R "$REPO" --remove-label agent-ready --add-label agent-in-progress
          gh issue comment "$i" -R "$REPO" --body "agent run started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo go=true >> "$GITHUB_OUTPUT"
      - name: Branch
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/$REPO/git/ref/heads/$REF" --silent 2>/dev/null ||
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$REF" -f sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" --silent
      - name: Worker
        if: steps.gate.outputs.go == 'true'
        # A step timeout fails the job, so the report job strikes it. A job
        # timeout only cancels it, and failure() || cancelled() skips report,
        # leaving the issue claimed with no strike (run 35900449636).
        timeout-minutes: 55
        # Logs are public on public repos. The full transcript stays on the
        # VPS; only errors (stderr) reach the log. The Gate picks the engine.
        env:
          ENGINE: ${{ steps.gate.outputs.engine }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          exec 2> >(tee "$RUNNER_TEMP/worker.err" >&2)
          id=${REPO#*/}-${REF#claim/issue-}
          # The worker runs in its own PID namespace: when it exits (or this
          # step is cancelled), the kernel kills every process it started,
          # including ones that setsid/daemonize past the runner's snapshot-based
          # orphan cleanup (actions/runner#4601). Before this, a headless Chrome
          # outlived its job by 13h and a worker's gh-checks poller held
          # node_modules so Clean workspace failed ENOTEMPTY (0509 run 36107401820).
          # Same cgroup, so agent.slice memory limits still apply.
          jail="bwrap --dev-bind / / --proc /proc --unshare-pid --die-with-parent --"
          dir="$HOME/workspaces/agent-worktrees/issue-$id"
          packet="Fleet issue worker for instance $id. Follow $HOME/workspaces/tooling/fleet-ops-deploy-clone/prompts/worker.md (read AGENTS.md beside it first); every \$1 there means $id."
          if [ "$ENGINE" = devin ]; then
            # --chdir puts the worker directory on the bwrap command line,
            # which is what the Gate's lane count reads.
            mkdir -p "$dir"
            echo "$packet" | bwrap --dev-bind / / --proc /proc --unshare-pid --die-with-parent --chdir "$dir" -- \
              devin -p --prompt-file /dev/stdin --permission-mode dangerous --model swe-2-max >/dev/null
          elif [ "$ENGINE" = cursor ]; then
            set -a; . "$HOME/.config/fleet-ops/seats/cursor.env"; set +a
            mkdir -p "$dir"
            $jail cursor-agent -p --output-format text --model grok-4.7-xhigh --force --trust \
              --workspace "$dir" "$packet" >/dev/null
          else
            echo "/worker $id" | $jail pi --print \
              --append-system-prompt "$HOME/workspaces/tooling/fleet-ops-deploy-clone/AGENTS.md" \
              --session-dir "$HOME/.pi/agent/sessions/agent-$id" \
              --exclude-tools subagent --provider litellm --model worker-capable >/dev/null
          fi
      - name: App token for arm
        id: arm-token
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: "4728578"
          private-key: ${{ steps.app-key.outputs.pem }}
          owner: ${{ github.repository_owner }}
          skip-token-revoke: "false"
      - name: Router wall
        id: wall
        # A router seat wall or a Devin capacity refusal is infra, not a bad
        # packet (fleet-ops#8543): no strike, back to agent-ready. The Gate's
        # 3-run cap bounds the loop. Devin fails before it writes anything, so
        # a claim branch that is already ahead of main is requeued too.
        if: failure() && steps.gate.outputs.go == 'true'
        env:
          ENGINE: ${{ steps.gate.outputs.engine }}
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
        run: |
          i=${REF#claim/issue-}
          if [ "$ENGINE" = devin ] && grep -qiE 'capacity issues|cognition\.ai/retryable": true' "$RUNNER_TEMP/worker.err" 2>/dev/null; then
            mkdir -p "$HOME/.cache/fleet-ops"
            touch "$HOME/.cache/fleet-ops/devin-wall"
          else
            grep -qiE 'no deployments available|ratelimiterror|\b429\b' "$RUNNER_TEMP/worker.err" 2>/dev/null || exit 0
            [ "$(gh api "repos/$REPO/compare/main...$REF" --jq .ahead_by)" = 0 ] || exit 0
          fi
          gh issue comment "$i" -R "$REPO" --body "agent run infra-failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue edit "$i" -R "$REPO" --add-label agent-ready --remove-label agent-in-progress
          echo wall=true >> "$GITHUB_OUTPUT"
      - name: Arm auto-merge as the App
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
        run: |
          # The merge closes the issue only through a closing keyword, and
          # workers drop it often enough that merged work stayed claimed
          # (0509 #4870 #4941 #4958 #5011 #5022 #5027 #5052, 2026-09-24).
          if gh pr view "$REF" -R "$REPO" --json state --jq .state | grep -qx OPEN; then
            i=${REF#claim/issue-}
            body=$(gh pr view "$REF" -R "$REPO" --json body --jq .body)
            grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #$i\b" <<<"$body" ||
              gh pr edit "$REF" -R "$REPO" --body "$body"$'\n\n'"Closes #$i"
            gh pr merge "$REF" -R "$REPO" --auto --squash  # a merge queue overrides the method; repos without one need it
          fi
      - name: Deliverable
        if: steps.gate.outputs.go == 'true'
        # A worker that exits 0 with no PR and no park leaves the issue claimed
        # and this job green, so report never strikes it (fleet-ops#8461).
        # Legit exit-0 paths in prompts/worker.md: closed (1b), parked with
        # agent-blocked/needs-orchestrator/needs-nish-decision (2b, 4), a
        # GitHub blocked_by dependency (4), or a PR on the claim branch.
        env:
          GH_TOKEN: ${{ steps.arm-token.outputs.token }}
        run: |
          i=${REF#claim/issue-}
          issue=$(gh api "repos/$REPO/issues/$i")
          [ "$(jq -r .state <<<"$issue")" = open ] || exit 0
          [ "$(jq -r '.issue_dependencies_summary.blocked_by // 0' <<<"$issue")" = 0 ] || exit 0
          labels=,$(jq -r '[.labels[].name]|join(",")' <<<"$issue"),
          case $labels in *,agent-in-progress,*) ;; *) exit 0 ;; esac
          for l in agent-blocked needs-orchestrator needs-nish-decision; do
            case $labels in *",$l,"*) exit 0 ;; esac
          done
          if gh pr list -R "$REPO" --head "$REF" --state all --json state --jq '.[].state' | grep -qxE 'OPEN|MERGED'; then
            exit 0
          fi
          echo "::error::worker exited 0 but #$i is still agent-in-progress with no open or merged PR and no park label"
          exit 1
      - name: Clean workspace
        if: always()
        run: rm -rf "$HOME/workspaces/agent-worktrees/issue-${REPO#*/}-${REF#claim/issue-}"
  scout:
    if: ${{ !inputs.ref && github.event.schedule == '0 */4 * * *' }}
    runs-on: [self-hosted, agent]
    timeout-minutes: 180
    concurrency:
      group: scheduled-scout-0509
      cancel-in-progress: false
    steps:
      - name: App token (key never leaves the VPS)
        run: |
          t=$(gh token generate --app-id 4728578 --key "$HOME/.config/fleet-worker/nishfleet-worker.private-key.pem" --installation-id 156789042 --token-only)
          echo "::add-mask::$t"
          echo "GH_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Scout 0509
        # Transcript stays on the VPS. The supply:/scout-yield: lines are the
        # completed-run signature (the old ExecStartPost abort gate,
        # fleet-ops#7524); without one the job fails.
        run: |
          out="$RUNNER_TEMP/scout.out"
          echo "/scout 0509" | pi --print \
            --append-system-prompt "$HOME/workspaces/tooling/fleet-ops-deploy-clone/AGENTS.md" \
            --session-dir "$HOME/.pi/agent/sessions/pi-scout-0509" \
            --provider litellm --model worker-cheap > "$out"
          grep -E 'supply:[[:space:]]*ready_count=[0-9]+|scout-yield:' "$out" ||
            { echo "scout-abort-gate: no supply: line this run" >&2; exit 1; }
  gardener:
    if: ${{ !inputs.ref && github.event.schedule == '0 4 * * 1' }}
    runs-on: [self-hosted, agent]
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /run/user/1000
    steps:
      - name: Gardener
        # Same command as fleet-gardener.service: the box's own claude login
        # and gh login, no App token. Transcript stays off the public log.
        run: claude -p --model claude-opus-5-5 --dangerously-skip-permissions < "$HOME/workspaces/tooling/fleet-ops-deploy-clone/prompts/gardener.md" > /dev/null
  report:
    needs: work
    if: (failure() || cancelled()) && needs.work.outputs.wall != 'true'
    runs-on: [self-hosted, agent]
    permissions:
      issues: write
    steps:
      # App token, not GITHUB_TOKEN: a GITHUB_TOKEN label fires no workflow, so opus-vet never ran on a park (fleet-ops#8552).
      - name: App token (key never leaves the VPS)
        run: |
          t=$(gh token generate --app-id 4728578 --key "$HOME/.config/fleet-worker/nishfleet-worker.private-key.pem" --installation-id 156789042 --token-only)
          echo "::add-mask::$t"
          echo "GH_TOKEN=$t" >> "$GITHUB_ENV"
      - env:
          N: ${{ inputs.ref }}
        # Two strikes, counted from these comments since the newest opus-vet
        # (a fresh vet resets the count, same as the old claim-release prompt).
        # First strike re-queues via agent-ready (fleet-ops#8552); the second parks.
        run: |
          i=${N#claim/issue-}
          # shellcheck disable=SC2016 # $v is a jq variable
          prior=$(gh issue view "$i" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body] | (map(startswith("opus-vet:")) | rindex(true) // -1) as $v | .[$v+1:] | map(select(startswith("agent run failed:"))) | length')
          gh issue comment "$i" -R "$GITHUB_REPOSITORY" --body "agent run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$prior" -ge 1 ]; then
            gh issue edit "$i" -R "$GITHUB_REPOSITORY" --add-label needs-orchestrator --remove-label agent-ready,agent-in-progress,agent-failed
          else
            gh issue edit "$i" -R "$GITHUB_REPOSITORY" --add-label agent-ready --remove-label agent-in-progress,agent-failed
          fi
