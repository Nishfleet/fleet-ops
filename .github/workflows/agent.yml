name: agent
# review.yml reads the engine from this name, which GitHub fixes when the run starts, to pick a
# reviewer from another AI family. Same choice as the Worker step: claude, else pi.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#run-name
run-name: "agent #${{ github.event.issue.number || inputs.issue }} engine=${{ inputs.engine == 'claude' && 'claude' || 'pi' }}"
# The one worker lane (fleet-ops#10935, owner reset 2026-11-01): an issue labelled
# agent-ready starts one worker on a box runner; the worker opens one PR; CI runs;
# the merge queue merges; deploy runs on merge. Nothing else lives here.
#
# The AI worker never holds a GitHub credential (fleet-ops#11715, owner 2026-11-04 "fully
# isolate it"). Every step that needs the App token runs on a GitHub-hosted runner: a fresh
# VM per job that the box, and so the worker, cannot reach. The App key is a secret of
# environment `agent`, which only main may deploy to; called from a product repo, the
# caller's own `agent` environment answers,
# and the caller passes APP_PRIVATE_KEY by name. The worker job on the box gets the repo and
# hands back its commits as git bundles through artifacts, so its runner has no key file,
# no token in any process it can read, and no git credential. Same split as review.yml.
# https://docs.github.com/en/actions/reference/security/secure-use#hardening-for-self-hosted-runners
# https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments
# https://git-scm.com/docs/git-bundle
#
# The lane answers the review on its own PRs (global-standing-rules.md: the builder
# answers each finding, the same reviewer signs off, hard cap 3 rounds). answer.yml
# dispatches this workflow on main with `issue` and `pr` when the reviewer bot or the
# repository owner requests changes on an agent/issue-* PR, or when CI fails on its head;
# the run reads the review, or the check runs against the head, fixes the same branch, and
# the push starts CI and the re-review.
on:
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      issue: {description: issue number in the calling repo, required: true, type: string}
      pr: {description: the agent PR whose review to answer, type: string, default: ''}
      engine: {description: pi or claude, type: string, default: pi}
    # A called workflow gets only the secrets its caller passes, even an environment secret;
    # required makes a caller that forgets it fail loudly instead of reading an empty key.
    # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow
    secrets:
      APP_PRIVATE_KEY: {required: true}
  workflow_dispatch:
    inputs:
      issue: {description: issue number, required: true, type: string}
      pr: {description: the agent PR whose review to answer, type: string, default: ''}
      engine: {description: pi or claude, type: choice, options: [pi, claude], default: pi}
permissions: {}
# One group for the whole run (fleet-ops#11987): claim reads the branch head, so the group
# must hold the whole run — claim starts only after the previous run's push instead of
# bundling a head that run is about to replace. queue: max is what keeps a run that skips
# on an issue's other labels from cancelling a waiting run: the default single cancels and
# replaces the pending run, and this workflow starts on every label.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
# Product repos call this workflow, and the group holds there too: "When you reuse a
# workflow, the entire called workflow is used, just as if it was part of the caller
# workflow" (reusing-workflow-configurations), so a top-level key of the called workflow
# applies to the caller's run — the reuse note that a group in the called workflow can
# cancel "the workflow that's already running" says the same thing from the other side.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/reusing-workflow-configurations
concurrency:
  group: agent-${{ github.repository }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
  queue: max
env:
  REPO: ${{ github.repository }}
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  PR: ${{ inputs.pr }}
jobs:
  # While paused, only gardener and alert issues still run (owner, 2026-11-04).
  # The labels are read from the API on every event: in a called workflow the
  # github context is the caller's, and inputs carry no labels.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
  gate:
    if: ${{ github.event_name != 'issues' || github.event.label.name == 'agent-ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {issues: read}
    outputs:
      run: ${{ steps.labels.outputs.run }}
    steps:
      - id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PAUSED: ${{ vars.FLEET_DISPATCH_PAUSED }}
        run: |
          set -euo pipefail
          run=true
          if [ "$PAUSED" = true ]; then
            run=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq 'any(.labels[]; .name == "gardener" or .name == "alert")')
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  claim:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    environment: agent
    timeout-minutes: 10
    permissions: {}
    outputs:
      issue: ${{ steps.claim.outputs.issue || steps.round.outputs.task }}
      base: ${{ steps.repo.outputs.base }}
      default: ${{ steps.repo.outputs.default }}
      go: ${{ steps.round.outputs.go }}
      engine: ${{ steps.round.outputs.engine }}
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4728578"
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      # Strangers' text never reaches the worker (fleet-ops#9978). As Copilot cloud agent and
      # claude-code-action do, a run needs write access (maintain reads as write, triage as read):
      # the actor who started it AND the issue's author, whose title and body become the packet.
      # The worker App is allowed by name, like claude-code-action's allowed_bots, because it
      # labels most issues and the permission API reports `none` for an App.
      # https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations
      # https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
      # https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user
      - name: Only writers start a run
        if: env.PR == ''
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          author=$(gh api "repos/$REPO/issues/$ISSUE" --jq .user.login)
          for who in "$GITHUB_ACTOR" "$author"; do
            [ "$who" = 'nishfleet-worker[bot]' ] && continue
            p=$(gh api "repos/$REPO/collaborators/$who/permission" --jq .permission)
            case "$p" in admin|write) ;; *) echo "::error::$who has $p access; only writers start a run"; exit 1 ;; esac
          done
      # A random delimiter, because the issue body is user text:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
      - name: Claim the issue
        id: claim
        if: env.PR == ''
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          # Before the label swap, so a trip leaves the ticket agent-ready instead of parked
          # on agent-in-progress with no run behind it (round-2 review on #11957).
          [ "$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:agent/issue-$ISSUE&state=open" --jq length)" = 0 ] || { echo "::error::#$ISSUE already has an open pull request on agent/issue-$ISSUE; review and red CI are answered on that pull request"; exit 1; }
          gh issue edit "$ISSUE" -R "$REPO" --remove-label agent-ready --add-label agent-in-progress
          gh issue comment "$ISSUE" -R "$REPO" --body "agent run started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          eof="ISSUE_$(openssl rand -hex 16)"
          { echo "issue<<$eof"; gh issue view "$ISSUE" -R "$REPO" --json title,body --template '{{.title}}'$'\n\n''{{.body}}'; echo; echo "$eof"; } >> "$GITHUB_OUTPUT"
      # A review round: what is open on the PR is each reviewer's latest review that is
      # APPROVED, CHANGES_REQUESTED or DISMISSED (comment reviews do not count, the rule
      # branch protection uses), and it is open while it asks for changes. The task
      # carries every open change request, each under a "From <login>:" line. This step
      # always runs, so `go` is always one step output; an issue run is always a go.
      # https://docs.github.com/en/rest/pulls/reviews#list-reviews-for-a-pull-request
      # https://docs.github.com/en/rest/checks/runs#list-check-runs-for-a-git-reference
      - name: Read the review or the red CI
        id: round
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          read -r ref sha < <(gh api "repos/$REPO/pulls/$PR" --jq '[.head.ref, .head.sha] | @tsv')
          [ "$ref" = "agent/issue-$ISSUE" ] || { echo "::error::PR #$PR is on $ref, not agent/issue-$ISSUE"; exit 1; }
          gh api "repos/$REPO/pulls/$PR/reviews?per_page=100" --jq '[.[] | select(.user.login == "nishfleet-approver" or .user.login == "nish3451")]' > "$RUNNER_TEMP/reviews.json"
          # A review round is a head that got a change request: the count is the distinct
          # commit_id among all change-request reviews from the bot or the owner, so the
          # bot and the owner asking on one head count once (fleet-ops#11987). A red head
          # cannot get the bot's, the reviewer reads green CI only (review.yml), so the
          # lane answers a failure the checks report on this sha instead: a check run with
          # conclusion "failure" names the dead job. All rounds ride the same cap of 3
          # answered rounds: each distinct change-request head, each "answering red CI"
          # comment this step left on the PR, and this red head itself count one round;
          # rounds 1 and 2 go to the regular builder, round 3 to the senior builder, and
          # a fourth labels the PR needs-owner and runs nothing.
          # https://docs.github.com/en/rest/checks/runs#list-check-runs-for-a-git-reference
          # https://docs.github.com/en/rest/issues/comments#list-issue-comments
          rounds=$(jq '[.[] | select(.state == "CHANGES_REQUESTED") | .commit_id] | unique | length' "$RUNNER_TEMP/reviews.json")
          # What is open: each reviewer's latest review that is not a comment, open while
          # it asks for changes. Reviews arrive oldest first, so the last of a reviewer's
          # is its latest; jq's group_by sorts the groups by login.
          # https://docs.github.com/en/rest/pulls/reviews#list-reviews-for-a-pull-request
          jq '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | group_by(.user.login) | map(last) | map(select(.state == "CHANGES_REQUESTED"))' "$RUNNER_TEMP/reviews.json" > "$RUNNER_TEMP/open.json"
          findings=$(jq -r 'map("From \(.user.login):\n\(.body)") | join("\n\n")' "$RUNNER_TEMP/open.json")
          failing=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.conclusion == "failure") | .name] | join(" ")')
          red=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq '[.[] | select(.body | startswith("agent: answering red CI on "))] | length')
          rounds=$((rounds + red + (${#failing} > 0 ? 1 : 0)))
          if [ -z "$failing" ] && [ "$(jq 'length' "$RUNNER_TEMP/open.json")" = 0 ]; then
            echo "no open change request from the bot or the owner and the checks on $sha are green; nothing to answer"; echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$rounds" -ge 4 ]; then
            gh api "repos/$REPO/issues/$PR/labels" -f 'labels[]=needs-owner' > /dev/null
            gh api "repos/$REPO/issues/$PR/comments" -f body="agent: review round $rounds still asks for changes; three rounds were answered, the third by the senior builder, so the owner decides." > /dev/null
            echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The third answered round goes to the senior builder (fleet-ops#11964, owner
          # 2026-11-13): the work job reads engine=claude and lands on the Claude pool's
          # `senior` runner. The comment marks the round, so review.yml hands the
          # re-review to review-fable.
          senior=''
          if [ "$rounds" -eq 3 ]; then
            echo "engine=claude" >> "$GITHUB_OUTPUT"
            senior=1
            gh api "repos/$REPO/issues/$PR/comments" -f body="agent: senior builder takes round 3: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          fi
          if [ -n "$failing" ]; then
            gh api "repos/$REPO/issues/$PR/comments" -f body="agent: answering red CI on $sha ($failing): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
            eof="RED_$(openssl rand -hex 16)"
            { echo "task<<$eof"
              if [ "$senior" ]; then echo "Two earlier answers did not close this. Fix every open finding below, or say in the commit message why a finding is wrong."; echo; fi
              echo "The CI on #$PR is red on $sha; the failed jobs are: $failing. Fix the failures with the smallest change on this same branch and leave the run-proof line the prompt asks for."
              if [ -n "$findings" ]; then echo; echo "$findings"; fi
              echo "$eof"; echo "ref=$ref"; echo go=true; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api "repos/$REPO/issues/$PR/comments" -f body="agent: answering review round $rounds: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          eof="REVIEW_$(openssl rand -hex 16)"
          { echo "task<<$eof"
            if [ "$senior" ]; then echo "Two earlier answers did not close this. Fix every open finding below, or say in the commit message why a finding is wrong."; echo; fi
            echo "Answer review round $rounds on #$PR"; echo; echo "$findings"; echo "$eof"; echo "ref=$ref"; echo go=true; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.round.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle the repo for the worker
        id: repo
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          default=$(gh api "repos/$REPO" --jq .default_branch)
          git switch -C "agent/issue-$ISSUE"
          # A stale branch is brought up to date by merging the default branch (the worker
          # packet says so; the push is fast-forward only), so the worker needs it without
          # network. The checkout fetched it as refs/remotes/origin/<default> (fetch-depth: 0);
          # a bundle stores a ref under the name it is given and a clone maps only refs/heads/*
          # back to origin/*, so the ref rides as refs/heads/<default> and the worker's clone
          # reads origin/<default>.
          # https://git-scm.com/docs/git-bundle
          # https://git-scm.com/docs/git-clone
          git update-ref "refs/heads/$default" "refs/remotes/origin/$default"
          git bundle create "$RUNNER_TEMP/repo.bundle" "agent/issue-$ISSUE" "refs/heads/$default"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "default=$default" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: repo, path: "${{ runner.temp }}/repo.bundle", retention-days: 1, overwrite: true}
  # The ticket check, report only (fleet-ops#11949, owner 2026-11-12): before a builder
  # starts, a fresh ticket is checked against the build rules and its verdict is posted as
  # one comment on the ticket. The check is a job of review.yml, called here as a reusable
  # workflow so it runs where the reviewer runners already accept jobs; no runner group
  # changes. The if sits on this calling job, so a re-run that already has a pull request
  # is skipped and never queues a reviewer runner. Report only: work keeps needs: [claim]
  # and park keeps needs: [claim, work, push], so a check that hangs, fails or never gets
  # a runner cannot stop, park or delay a build.
  # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
  ticket-check:
    needs: claim
    # On the issues event the inputs context is empty, so the event names the fresh path;
    # a call or a dispatch that already carries a pull request skips the whole call, so it
    # is skipped, not queued, and no reviewer runner is asked for.
    if: github.event_name == 'issues' || inputs.pr == ''
    # The cap for the called workflow's token: the check reads the ticket and
    # docs/review-bar.md and comments the verdict on the ticket, nothing else.
    # https://docs.github.com/en/actions/reference/security/secure-use#considering-permissions-in-reusable-workflows
    permissions: {contents: read, issues: write}
    uses: Nishfleet/fleet-ops/.github/workflows/review.yml@main
    with:
      issue: ${{ github.event.issue.number || inputs.issue }}
  work:
    needs: claim
    if: needs.claim.outputs.go == 'true'
    # engine=claude goes to the Claude pool's `senior` label (tasks/runners.yml), everything else to `agent`.
    # A senior round sets engine in the claim job (fleet-ops#11964), so a dispatched
    # engine=claude and a senior round both land here.
    # https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/using-labels-with-self-hosted-runners
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
    runs-on: [self-hosted, "${{ (needs.claim.outputs.engine || inputs.engine) == 'claude' && 'senior' || 'agent' }}"]
    timeout-minutes: 90
    permissions: {}
    outputs:
      nochange: ${{ steps.bundle.outputs.nochange }}
      proof: ${{ steps.bundle.outputs.proof }}
    env:
      ENGINE: ${{ needs.claim.outputs.engine || inputs.engine || 'pi' }}
      BASE: ${{ needs.claim.outputs.base }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: repo, path: "${{ runner.temp }}"}
      - name: Worker
        env:
          ISSUE_TEXT: ${{ needs.claim.outputs.issue }}
          DEFAULT_BRANCH: ${{ needs.claim.outputs.default }}
          FLEET_TASK_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/work"; rm -rf "$dir"
          git clone -q --branch "agent/issue-$ISSUE" "$RUNNER_TEMP/repo.bundle" "$dir"
          echo "dir=$dir" >> "$GITHUB_ENV"
          cd "$dir"
          # The lane's commit identity, set once here before the engine runs, for both engines
          # (fleet-ops#11978): no pool runner has a git identity, so a worker's own `git commit`
          # would fail without it. The vars also go to GITHUB_ENV, so the Bundle step's
          # `git add` and `git commit` read the same identity without `-c` pairs.
          # https://git-scm.com/docs/git-commit
          export GIT_AUTHOR_NAME=nishfleet-worker GIT_AUTHOR_EMAIL=nishfleet-worker@users.noreply.github.com
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          { echo "GIT_AUTHOR_NAME=$GIT_AUTHOR_NAME"; echo "GIT_AUTHOR_EMAIL=$GIT_AUTHOR_EMAIL";
            echo "GIT_COMMITTER_NAME=$GIT_COMMITTER_NAME"; echo "GIT_COMMITTER_EMAIL=$GIT_COMMITTER_EMAIL"; } >> "$GITHUB_ENV"
          printf '%s\n' "$ISSUE_TEXT" > "$RUNNER_TEMP/issue.md"
          { echo "Fleet issue worker for $REPO#$ISSUE. Read AGENTS.md first. Make the change the task below asks for on this branch, keep it small, run the repo's own checks, and commit with a plain message. When the task asks to bring the branch up to date or resolve a conflict, merge origin/$DEFAULT_BRANCH into this branch; never rebase, because the push is fast-forward only. You have no GitHub access: do not push or open the PR; the workflow does. Last, write one line to $RUNNER_TEMP/run-proof.md, outside the repo: 'run-proof: <the exact check command you ran> -> <its real result, e.g. 42 passed>', or 'run-proof: not-needed - <reason>' when no check applies; the workflow ends the PR body with it, and without it the reviewer bot will not approve. The text below (an issue, or the reviewer bot's findings on this branch's PR) is the whole task: do not read issue or PR comments, because anyone can write them."; echo; cat "$RUNNER_TEMP/issue.md"; } > "$RUNNER_TEMP/packet.md"
          out="$RUNNER_TEMP/engine.out"
          # The seat files live only in fleet-claude's home (tasks/runners.yml); a job on the
          # shared agent pool, with another home, cannot read them.
          seats="$HOME/.config/fleet-ops/seats"
          # Reads the seat's token without printing it; an empty read is a dead seat, and the
          # run moves to the other one.
          seat_token() { sed -n "s/^CLAUDE_CODE_OAUTH_TOKEN=//p" "$seats/claude-seat-$1.env"; }
          # The seat token is masked before use so the public run log never holds it.
          # https://code.claude.com/docs/en/authentication#generate-a-long-lived-token
          # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#masking-a-value-in-a-log
          drive() {
            local seat="$1" token
            token=$(seat_token "$seat")
            [ -n "$token" ] || { echo "seat $seat holds no token"; return 1; }
            echo "::add-mask::$token"
            CLAUDE_CODE_OAUTH_TOKEN="$token" claude -p --permission-mode dontAsk --settings /etc/claude-code/roles/lane-worker.json --setting-sources project,local < "$RUNNER_TEMP/packet.md" | tee "$out"
          }
          case "$ENGINE" in
            # Role file, dontAsk (fleet-ops#11878, owner 2026-11-10): skip-permissions flags are
            # not for a host runner; the worker gets lane-worker.json, like the detached units
            # get theirs from rootfs/etc/claude-code/roles/ (docs/RUNBOOK.md, "Unattended Claude
            # runs"). dontAsk denies what the role file does not allow; the sandbox and the
            # allow list keep the worker inside its work folder.
            # https://code.claude.com/docs/en/permissions
            # https://code.claude.com/docs/en/sandboxing
            # https://code.claude.com/docs/en/settings#setting-sources
            claude)
              # Seats alternate by run id parity; an engine failure with no commit hands the
              # run to the other seat once, while a worker that already committed keeps its work.
              seat=$([ $((GITHUB_RUN_ID % 2)) -eq 0 ] && echo a || echo b)
              if ! drive "$seat"; then
                if [ "$(git -C "$dir" rev-list --count "$BASE"..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
                  echo "the engine failed after the worker committed; not retrying on the other seat" >&2
                  exit 1
                fi
                drive "$([ "$seat" = a ] && echo b || echo a)" || { echo "the other seat failed too" >&2; exit 1; }
              fi
              ;;
            *) pi --print --provider litellm --model worker-capable < "$RUNNER_TEMP/packet.md" | tee "$out" ;;
          esac
          # Empty output is never a verdict (fleet-ops#11946): the agent runner's `claude` was
          # a coreutils `true` stub, which printed nothing, exited 0 in under a minute, and the
          # lane read the dead run as "the worker changed nothing". A worker that really has
          # nothing to change still prints its verdict (claude -p and pi --print both print
          # their result), so an empty capture fails this step loudly, for both engines:
          # a failed command is always flagged, never walked past.
          # https://code.claude.com/docs/en/cli-reference
          [ -s "$out" ] || { echo "::error::the $ENGINE engine printed nothing; empty output is not a verdict"; exit 1; }
      - name: Bundle what the worker left
        id: bundle
        run: |
          set -euo pipefail
          cd "$dir"
          git add -A
          git commit -qm "$(head -n1 "$RUNNER_TEMP/issue.md") (#$ISSUE)" || true
          echo "proof=$(grep -m1 '^run-proof: ' "$RUNNER_TEMP/run-proof.md" | tr -d '\r' || true)" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BASE" HEAD; then echo "nochange=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git bundle create "$RUNNER_TEMP/work.bundle" "^$BASE" "agent/issue-$ISSUE"
      - if: steps.bundle.outputs.nochange != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: work, path: "${{ runner.temp }}/work.bundle", retention-days: 1, overwrite: true}
      - name: Clean the worktree
        if: always()
        run: rm -rf "$RUNNER_TEMP/work" "$RUNNER_TEMP/repo.bundle" "$RUNNER_TEMP/work.bundle"
  push:
    needs: [claim, work]
    runs-on: ubuntu-latest
    environment: agent
    timeout-minutes: 10
    permissions: {}
    steps:
      # Owner decision 2026-11-10: the lane opens PRs that edit .github/workflows/**, so this
      # token alone adds workflows: write; CODEOWNERS on .github/ still gates the merge.
      # https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/choosing-permissions-for-a-github-app
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4728578"
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      # A gardener pass that changes nothing closes its issue, so gardener.yml files the next one.
      - name: Close a gardener issue that needed no change
        id: nochange
        if: needs.work.outputs.nochange == 'true'
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          set -euo pipefail
          if [ -n "$PR" ] || ! gh issue view "$ISSUE" -R "$REPO" --json labels --jq 'any(.labels[]; .name == "gardener")' | grep -qx true; then echo "::error::the worker changed nothing"; exit 1; fi
          gh issue edit "$ISSUE" -R "$REPO" --remove-label agent-in-progress
          gh issue close "$ISSUE" -R "$REPO" --reason completed --comment "gardener: nothing to change this week, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - if: needs.work.outputs.nochange != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: work, path: "${{ runner.temp }}"}
      # No checkout: an empty repo with only the base commit takes the worker's commits as
      # data, so nothing the worker wrote runs in this job. A review answer appends this run's
      # proof to the PR body before the push, because the push starts the re-review and
      # review.yml reads the body live.
      # https://docs.github.com/en/rest/pulls/pulls#update-a-pull-request
      # An issue run builds on main, so it replaces a branch an old run left behind (run
      # 41846745347 failed "fetch first" on closed PR #11730's head), but only when no open PR
      # uses it, and only if the branch still holds the commit read here. A review round and
      # a branch with an open PR push fast-forward only.
      # https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-with-leaseltrefnamegt
      # https://docs.github.com/en/rest/pulls/pulls#list-pull-requests
      - name: Push the branch, open the PR and arm auto-merge
        if: needs.work.outputs.nochange != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ needs.claim.outputs.base }}
          DEFAULT: ${{ needs.claim.outputs.default }}
          PROOF: ${{ needs.work.outputs.proof }}
        run: |
          set -euo pipefail
          proof="${PROOF:-The worker wrote no run-proof line, so the reviewer bot will not approve.}"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$PR" ]; then
            body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
            gh api -X PATCH "repos/$REPO/pulls/$PR" -f body="$body"$'\n\n'"Review answer by the agent lane: $run"$'\n\n'"$proof" > /dev/null
          fi
          gh auth setup-git
          git init -q "$RUNNER_TEMP/push" && cd "$RUNNER_TEMP/push"
          git fetch -q --depth=1 "https://github.com/$REPO.git" "$BASE:refs/heads/base"
          # The work bundle's prerequisites are the branch's boundary commits: a branch that
          # merged the default branch carries commits this empty repo lacks, and the bundle
          # fetch dies with "Repository lacks these prerequisite commits". Fetch the default
          # branch's history without file contents — a partial clone, stock git — first.
          # https://git-scm.com/docs/partial-clone
          git fetch -q --filter=blob:none "https://github.com/$REPO.git" "$DEFAULT:refs/heads/default"
          git fetch -q "$RUNNER_TEMP/work.bundle" 'refs/heads/*:refs/work/*'
          lease=()
          if [ -z "$PR" ] && [ "$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:agent/issue-$ISSUE&state=open" --jq length)" = 0 ]; then
            old=$(git ls-remote "https://github.com/$REPO.git" "refs/heads/agent/issue-$ISSUE" | cut -f1)
            lease=("--force-with-lease=refs/heads/agent/issue-$ISSUE:$old")
          fi
          git push -q "${lease[@]}" "https://github.com/$REPO.git" "refs/work/agent/issue-$ISSUE:refs/heads/agent/issue-$ISSUE"
          if [ -n "$PR" ]; then gh pr comment "$PR" -R "$REPO" --body "agent: pushed the answer; CI and the re-review run next"; exit 0; fi
          title=$(gh issue view "$ISSUE" -R "$REPO" --json title --jq .title)
          pr=$(gh pr create -R "$REPO" --head "agent/issue-$ISSUE" --title "$title" --body "Closes #$ISSUE"$'\n\n'"Built by the agent lane: $run"$'\n\n'"$proof")
          gh issue comment "$ISSUE" -R "$REPO" --body "agent: PR $pr"
          # https://cli.github.com/manual/gh_pr_merge: with a merge queue --auto queues the PR.
          # A failure fails the job, so park labels the issue agent-blocked.
          gh pr merge "$pr" -R "$REPO" --auto
  park:
    needs: [claim, work, push]
    # A job past timeout-minutes ends `cancelled`, and failure() is false for it, so the
    # needs results are read too. !cancelled() keeps a run cancelled by hand from parking.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
    if: ${{ !cancelled() && (failure() || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    environment: agent
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4728578"
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Park on failure
        env: {GH_TOKEN: "${{ steps.app-token.outputs.token }}"}
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --add-label agent-blocked --remove-label agent-in-progress
          gh issue comment "$ISSUE" -R "$REPO" --body "agent: run failed, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; add agent-ready to retry"
