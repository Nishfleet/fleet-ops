# Dispatch-only probe for the hand-flipped org variable `CI_RUNNER`
# (docs/RUNBOOK.md "CI_RUNNER"): its log names the variable the job saw and the runner
# the job took, so a flip is visible. Non-required on purpose: a probe reports, it never
# gates. It restores the role kimi-probe had before the grader removal (fleet-ops#8953).
name: ci-runner-probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    name: probe
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Show the variable the job saw and the runner it landed on
        env:
          CI_RUNNER: ${{ vars.CI_RUNNER }}
        run: echo "CI_RUNNER=${CI_RUNNER:-<unset>} runner=${RUNNER_NAME}"
