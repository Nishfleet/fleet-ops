# The consumer job fleet-ops#8936 bullet 4 asked for: dispatch it and the log names the
# variable the job saw and the runner the job took, so the hand-flipped org variable
# `CI_RUNNER` (docs/RUNBOOK.md "CI_RUNNER") is visible, and ubuntu-latest carries the job
# while the variable is unset. Non-required and dispatch-only on purpose: a probe
# reports, it never gates. It restores the kimi-probe role, which the grader removal
# took with it (fleet-ops#8953).
name: ci-runner-probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-runner-probe
  cancel-in-progress: false
jobs:
  probe:
    name: probe
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Show the variable the job saw and the runner it landed on
        env:
          CI_RUNNER: ${{ vars.CI_RUNNER }}
        run: echo "CI_RUNNER=${CI_RUNNER:-<unset>} runner=${RUNNER_NAME}"
