# deploy-box: push-triggered. Starts the fleet-sync.service user oneshot (the
# user-scope deploy steps), then the fleet-host-config.service system oneshot
# (Ansible applies rootfs/ as root); each exit code is a verdict. polkit lets
# this runner's user start that one system unit, so no step uses sudo.
# The unit's own guards still gate every step. fleet-ops#8519
# The probe runs last, so its verdict cannot skip a deploy step and a red probe
# still fails the run (fleet-ops#10046; tests/test_deploy_box_trigger.py).
name: deploy-box

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual replay of main head; the unit's own guards still gate every step

concurrency:
  group: deploy-box
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 15  # fleet-sync allows 300s and fleet-host-config 600s
    env:
      XDG_RUNTIME_DIR: /run/user/1000
    steps:
      - name: Start fleet-sync.service (user-scope deploy steps)
        run: /usr/bin/systemctl --user start fleet-sync.service || { /usr/bin/journalctl --user --no-pager -xeu fleet-sync.service --lines=60; exit 1; }
      - name: Start fleet-host-config.service (Ansible applies rootfs/ as root)
        run: /usr/bin/systemctl start fleet-host-config.service || { /usr/bin/journalctl --no-pager -xeu fleet-host-config.service --lines=60; exit 1; }
      - name: Probe the runner's jail for readable credential paths
        uses: Nishfleet/fleet-ops/.github/actions/runner-probe@main
