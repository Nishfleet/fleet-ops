# Runs two systemd oneshots on the fleet runner; each exit code is a verdict. Reasons: docs/workflow-notes.md.
name: deploy-box

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual replay of main head; the unit's own guards still gate every step

concurrency:
  group: deploy-box
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  apply:
    name: apply
    runs-on: [self-hosted, fleet-ci]
    # The unit allows TimeoutStartSec=300 for the steps alone; 10 min leaves
    # headroom without letting a hung step park a runner.
    timeout-minutes: 10
    env:
      XDG_RUNTIME_DIR: /run/user/1000
    steps:
      - uses: Nishfleet/fleet-ops/.github/actions/runner-probe@main
      - name: Start fleet-sync.service (user-scope deploy steps)
        run: /usr/bin/systemctl --user start fleet-sync.service || { /usr/bin/journalctl --user --no-pager -xeu fleet-sync.service --lines=60; exit 1; }
      - name: Start fleet-host-config.service (Ansible applies rootfs/ as root)
        run: /usr/bin/systemctl start fleet-host-config.service || { /usr/bin/journalctl --no-pager -xeu fleet-host-config.service --lines=60; exit 1; }
