# deploy-box: push-triggered. Starts fleet-host-config.service (ansible-pull of
# signed main, as root) and waits for it: `systemctl start` on a Type=oneshot unit
# blocks until the unit ends and exits non-zero if it failed
# (https://www.freedesktop.org/software/systemd/man/latest/systemctl.html).
# polkit lets the runner's user fleet-ci start that one unit (rootfs/etc/polkit-1/rules.d/50-fleet-host-config.rules).
name: deploy-box

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual replay of main head

concurrency:
  group: deploy-box
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  apply:
    name: apply
    runs-on: [self-hosted, fleet-ci]
    # fleet-host-config.service stops itself at TimeoutStartSec=600.
    timeout-minutes: 15
    steps:
      - name: Start fleet-host-config.service and wait for its result
        # On failure, the last 100 journal lines of this run. Only on failure, because
        # this log is public and the play's --diff output names host files.
        run: /usr/bin/systemctl start fleet-host-config.service || { /usr/bin/journalctl --no-pager -n 100 _SYSTEMD_INVOCATION_ID="$(/usr/bin/systemctl show -p InvocationID --value fleet-host-config.service)"; exit 1; }
