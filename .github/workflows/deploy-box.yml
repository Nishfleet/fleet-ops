# deploy-box: push-triggered. Starts the fleet-sync.service oneshot unit,
# which is the single copy of the deploy steps; its exit code is the verdict.
# The unit's own guards still gate every step. fleet-ops#8519
name: deploy-box

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual replay of main head; the unit's own guards still gate every step

concurrency:
  group: deploy-box
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  apply:
    name: apply
    runs-on: [self-hosted, fleet-ci]
    # The unit allows TimeoutStartSec=300 for the steps alone; 10 min leaves
    # headroom without letting a hung step park a runner.
    timeout-minutes: 10
    env:
      XDG_RUNTIME_DIR: /run/user/1000
    steps:
      - name: Start fleet-sync.service (the single copy of the deploy steps)
        run: /usr/bin/systemctl --user start fleet-sync.service
