# deploy-box: push-triggered. Writes a request stamp to the deploy mailbox
# (/var/lib/fleet-deploy/request) and waits for fleet-deploy.service's verdict:
# root runs the deploy (fleet-sync, then fleet-host-config) from fleet-deploy.path,
# so no step on this runner touches the user bus or polkit. fleet-ops#8519, #10043.
name: deploy-box

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual replay of main head; the unit's own guards still gate every step

concurrency:
  group: deploy-box
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  apply:
    name: apply
    runs-on: [self-hosted, fleet-ci]
    # fleet-deploy.service allows itself 900s; 20 min covers a wait behind a queued request.
    timeout-minutes: 20
    steps:
      - uses: Nishfleet/fleet-ops/.github/actions/runner-probe@main
      - name: Write the deploy request and wait for the verdict
        run: |
          set -euo pipefail
          systemctl is-active --quiet fleet-deploy.path || { echo "::error::fleet-deploy.path is not active"; exit 1; }
          stamp="run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$stamp" > /var/lib/fleet-deploy/request
          echo "deploy request: $stamp"
          until line=$(grep "^$stamp " /var/lib/fleet-deploy/result 2>/dev/null); do sleep 10; done
          echo "deploy verdict: $line"
          read -r _ res status _ <<<"$line"
          if [ "$res" != success ] || [ "$status" != 0 ]; then sed -n '1,100p' /var/lib/fleet-deploy/log; exit 1; fi
