name: CI
# Every job names the incident or rule that keeps it (owner, fleet-ops#10935,
# 2026-11-01: "failures should be unacceptable"). No job reads anything outside
# the PR. Hosted runners only. Secret scanning and push protection are GitHub's
# own, enabled on the repo (leaked tokens, fleet-ops#9578 and #8771); no job here.
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Tools (ansible-core for the host play, systemd for unit files)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ansible-core systemd >/dev/null
      - name: The host play parses (it is the deploy; a broken play breaks the box)
        run: ansible-playbook --syntax-check -i localhost, ansible/host.yml
      - name: Unit files verify (three merges broke the box in one night, 2026-10-29)
        shell: bash
        run: |
          shopt -s nullglob
          # Host-only binaries the units name; a stub is enough for verify.
          for b in /home/nish/.local/bin/pi /home/nish/.local/bin/tincan /home/nish/.local/bin/claude /home/nish/.hermes/hermes-agent/.hermes/bin/hermes /home/runner/.local/bin/tofu /opt/node-v22.23.3/bin/node /usr/bin/restic /usr/bin/rootlesskit /usr/bin/syncthing /usr/bin/tigervncserver /var/lib/fleet-runner/test_instance/runsvc.sh; do sudo install -D -m755 /bin/true "$b"; done; sudo chown -R "$USER" "$HOME/.local"
          systemd-analyze verify --man=no systemd/*.service systemd/*.timer systemd/*.path rootfs/etc/systemd/system/*.service rootfs/etc/systemd/system/*.timer rootfs/etc/systemd/user/*.service rootfs/etc/systemd/user/*.timer
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Tests under tests/, found by pytest (fleet-ops#10721)
        run: |
          pip install -q pytest==8.3.5 pyyaml jsonschema httpx jinja2 litellm==1.105.0
          pytest -q -p no:cacheprovider tests
      - name: Alert rules and routes check, rule tests pass (nothing ran them, 2026-11-03)
        shell: bash
        # Upstream release binaries at the versions the box's packages run (Prometheus 3 changed
        # range semantics), checked against each release's sha256sums.txt.
        env: {PROM: 2.45.3, AM: 0.26.0}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v$PROM/prometheus-$PROM.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/alertmanager/releases/download/v$AM/alertmanager-$AM.linux-amd64.tar.gz"
          sha256sum -c <<<"53b23de673c54bf6eeac13f17fe14027e8fe7800d0cf361e3177ba96413812b8  prometheus-$PROM.linux-amd64.tar.gz
          abd73e2ee6bf67d3888699660abbecba7b076bf1f9459a3a8999d493b149ffa6  alertmanager-$AM.linux-amd64.tar.gz"
          tar xzf "prometheus-$PROM.linux-amd64.tar.gz" --strip-components=1 "prometheus-$PROM.linux-amd64/promtool"
          tar xzf "alertmanager-$AM.linux-amd64.tar.gz" --strip-components=1 "alertmanager-$AM.linux-amd64/amtool"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/promtool" check rules rootfs/etc/prometheus/*_rules.yml
          "$RUNNER_TEMP/promtool" test rules config/prometheus-tests/*.test.yml
          "$RUNNER_TEMP/amtool" check-config rootfs/etc/alertmanager/alertmanager.yml
      - name: Workflow files lint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
