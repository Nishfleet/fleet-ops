name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. Main runs complete; they queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ci: every step is one vendor command (Nish 2026-09-22: "wipe" the inline
  # shell block that lived here). Dropped with it: the shellcheck loop (no
  # systemd/*.sh remain) and the per-file yaml parse (the proxy and systemd
  # load these files on deploy and fail loud). Required check by this name.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sudo apt-get update
      # fleet-ops#8724: the router config's hard rules (no bench list, a per-row
      # cooldown_time <=900 s, router cooldown <=60 s; Nish 2026-09-28) live in the schema.
      # Each file under rejects/ breaks one rule and must fail, so a loosened schema goes red.
      - run: |
          pipx run check-jsonschema==0.38.2 --schemafile config/litellm-proxy.schema.json config/litellm-proxy.yaml
          for f in config/litellm-proxy.schema.rejects/*.yaml; do
            ! pipx run check-jsonschema==0.38.2 --schemafile config/litellm-proxy.schema.json "$f" || { echo "schema accepted $f"; exit 1; }
          done
      - run: pipx install semgrep==1.170.0
      # Parity with the block this replaced: it ran semgrep without --error, so
      # findings were reported, never gating. Gating on p/default is a separate
      # decision with the findings listed (fleet-ops issue filed by Fable).
      - run: semgrep --config p/default --metrics=off
      # No glue, held by a machine (Nish 2026-09-29). One rule file; 0509 reads it by URL.
      - run: semgrep scan --config .semgrep/no-glue.yml --metrics=off --error
      - name: No agent attribution in the PR's commits or body
        # AGENTS.md "Agent names are forbidden" was prose only; agent
        # trailers reached main (#9205, #9240). A pull_request check, not
        # merge_group: GitHub's own squash adds a Co-authored-by line when the
        # commit author is not the PR opener, so a merge_group check would fail
        # every agent PR. This gates what a session writes, not what GitHub adds.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          log=$(git log --format=%B "$BASE_SHA..$HEAD_SHA")
          ! printf '%s\n%s\n' "$log" "$PR_BODY" | grep -iEn '^(co-authored-by|claude-session):|^[^[:alpha:]]*generated with'
      - name: No long-lived PAT in any workflow
        run: "! grep -rEn 'secrets\\.[A-Za-z_][A-Za-z0-9_]*PAT\\b' .github/workflows/"
      - name: No secret variable expanded into an output command
        # fleet-ops#7381: a worker's improvised presence check carried the
        #   "token: ${GH_TOKEN:+set}${GH_TOKEN:-EMPTY}"
        # payload — the :- expansion yields the VALUE, so the live App token
        # landed in the run transcript. This step gates the committed
        # surfaces an agent reads or runs (prompts, units, workflows, AGENTS.md).
        # Secret names = the fleet's uppercase conventions plus LiteLLM SK_*
        # vars and JS process.env.X. fleet-litellm-key is exempt: emitting
        # a key IS its job. tests/ holds fixture drills that legitimately
        # carry the runnable shape; .fleet/ is generated bench corpora — a
        # stale quote there must not poison unrelated PRs (0509#1817 class).
        # rc: 0 prints+ fails on match, 1 is clean, 2 is a grep error and
        # must fail too — a broken pattern can never read as a clean scan.
        run: |
          rc=0
          grep -rEn --exclude-dir=.git "$SPAT" \
            AGENTS.md README.md prompts systemd rootfs ansible config template docs patches .github credentials || rc=$?
          test "$rc" -eq 1
        env:
          SPAT: (echo|printf|printenv|console\.(log|error|warn|info))[^|;]*(\$\{?|process\.env\.)([A-Za-z_][A-Za-z0-9_]*(TOKEN|SECRET|PASS(WORD|WD)?|CREDENTIALS?|PRIVATE|_KEY)[A-Za-z0-9_]*|SK_[A-Z][A-Z0-9_]*)
      # the gates below are independent linters: `if: always()` so one red run
      # lists every violated gate instead of fail-fast hiding the rest.
      - name: actionlint over .github/workflows/
        if: always()
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: zizmor over .github/workflows/
        # Stock security audit for workflows: dangerous triggers, template
        # injection, persisted credentials, unpinned actions, over-broad
        # permissions and App tokens. Offline, so it needs no token and cannot
        # hang on API rate limits. Nishfleet/0509#5843 adds the same image.
        # Policy and its kept exceptions: .github/zizmor.yml.
        if: always()
        uses: docker://ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
        with:
          args: --offline --format plain .github/workflows
      - name: shellcheck over shell files (extension + shebang discovery)
        if: always()
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          version: v0.11.0
      - name: apt binaries systemd-analyze verify needs (promtool, bwrap, redis-server, ansible-pull)
        if: always()
        run: sudo apt-get install -y --no-install-recommends prometheus bubblewrap redis-server ansible-core
      - name: stub pi for systemd-analyze verify (host-only binary)
        if: always()
        run: sudo install -D -m0755 /bin/true /home/nish/.local/bin/pi
      - name: stub tincan for systemd-analyze verify (host-only binary)
        if: always()
        run: sudo install -D -m0755 /bin/true /home/nish/.local/bin/tincan
      - name: stub litellm for systemd-analyze verify (host-only binary)
        if: always()
        run: sudo install -D -m0755 /bin/true /home/nish/.local/venvs/litellm/bin/litellm
      - name: stub cursor-agent for systemd-analyze verify (host-only binary)
        if: always()
        run: install -D -m0755 /bin/true "$HOME/.local/bin/cursor-agent"
      - name: stub leviathan for systemd-analyze verify (host-only binary)
        if: always()
        run: install -D -m0755 /bin/true "$HOME/.local/bin/leviathan"
      - name: systemd-analyze verify over unit files
        # nullglob: #8474 deleted the last systemd/*.path unit, and an unmatched
        # glob reaches systemd-analyze as a literal filename -> rc 1. With
        # nullglob an empty set expands to nothing and a future .path unit is
        # verified again by this same line.
        # systemd/system/*.slice too (fleet-ops#8638): the root glob never
        # matched systemd/system/, so agent.slice and claude.slice shipped
        # unverified. Slices carry no Exec line, so they need none of the
        # binary stubs above. Root-owned units moved to rootfs/etc/systemd/system/
        # (fleet-host-config, thread "fix everything like pro devs"); the
        # host-config service and timer are verified with the slices.
        if: always()
        run: |
          shopt -s nullglob
          systemd-analyze verify --man=no systemd/*.service systemd/*.timer systemd/*.path systemd/*.slice rootfs/etc/systemd/system/*.slice rootfs/etc/systemd/system/fleet-host-config.service rootfs/etc/systemd/system/fleet-host-config.timer rootfs/etc/systemd/system/fleet-update.service rootfs/etc/systemd/system/fleet-update.timer
      - name: ansible/host.yml parses (ansible-playbook --syntax-check)
        # fleet-host-config.service runs this playbook as root on every merge;
        # a parse error would stop every root config change at deploy time.
        if: always()
        run: ansible-playbook --syntax-check -i localhost, ansible/host.yml
      - name: ansible/update.yml parses (ansible-playbook --syntax-check)
        # fleet-update.service runs this playbook as root once a week.
        if: always()
        run: ansible-playbook --syntax-check -i localhost, ansible/update.yml
      - name: The report survives a skipped registration (fleet-ops#9340)
        # The report task renders every registered var with the idiom
        # (var | default({})).results | default([]). A skipped non-looped
        # registration carries no 'results' key, so the old pattern
        # (x | default({'results': []})).results raised "'dict object' has no
        # attribute 'results'" and the run died at its last task. This play
        # reproduces that registration, renders the report expressions, and
        # asserts no old pattern is left in ansible/update.yml.
        if: always()
        run: ansible-playbook -i localhost, ansible/tests/report-after-skipped-block.yml
      - name: rootfs/etc/nftables.conf loads on a fresh boot (nft -c)
        # nft refuses the whole file when a rule names a cgroup path that does
        # not exist yet, as at boot before user@1000 starts: the 2026-09-22
        # container-slice rule would have dropped every table on the next
        # reboot. This runner has no such cgroups, so the same rule fails here.
        if: always()
        run: sudo apt-get install -y --no-install-recommends nftables && sudo nft -c -f rootfs/etc/nftables.conf
      - name: Worker jail hides the gh login and Cloudflare tokens (fleet-ops#9274)
        # Runs agent.yml's own jail_base line, so a change there is what is
        # tested. Workers read outsider comments; only the filesystem view
        # keeps Nish's admin login and the deploy token out of their reach.
        # One bwrap line only: a second inline jail would skip these mounts.
        # Ubuntu 24.04 blocks unprivileged user namespaces by default; the
        # VPS allows them, so the runner is set to match.
        if: always()
        run: |
          test "$(grep -c 'bwrap --dev-bind' .github/workflows/agent.yml)" -eq 1
          line=$(sed -n 's/^ *jail_base="\(.*\)"$/\1/p' .github/workflows/agent.yml)
          test -n "$line"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Plant only where nothing exists, so a real login is never overwritten.
          test ! -e "$HOME/.config/gh/hosts.yml"
          test ! -e "$HOME/.config/cloudflare/deploy-ci.env"
          mkdir -p "$HOME/workspaces/tooling/fleet-ops-deploy-clone" "$HOME/.config/gh" "$HOME/.config/cloudflare"
          echo 'oauth_token: planted' > "$HOME/.config/gh/hosts.yml"
          echo 'CLOUDFLARE_API_TOKEN=planted' > "$HOME/.config/cloudflare/deploy-ci.env"
          echo visible > "$HOME/.config/control"
          # $HOME is the line's only expansion; no eval of file text.
          read -ra jail <<< "${line//\$HOME/$HOME} --"
          "${jail[@]}" test -r "$HOME/.config/control"
          "${jail[@]}" test ! -e "$HOME/.config/gh/hosts.yml"
          "${jail[@]}" test ! -e "$HOME/.config/cloudflare/deploy-ci.env"
          test -r "$HOME/.config/gh/hosts.yml"
          rm -f "$HOME/.config/gh/hosts.yml" "$HOME/.config/cloudflare/deploy-ci.env" "$HOME/.config/control"
      - name: No shell ${...} or bare %s/%u/%h inside systemd Exec lines (fleet-ops#8382)
        # systemd expands ${...} and % specifiers itself, before any interpreter
        # runs, so the shell never sees them. Refused on Exec*= lines: `${` + a
        # digit/#/% operator, and a bare %s, %u or %h in a `sh -c` string not
        # written `%%`. `$VAR`, `${NAME}`, %i and `%h/` stay legal. rc: 0 is a
        # match and 2 is a broken pattern — both fail; only rc 1 passes. Scope
        # is #8382's: Exec*= lines only, continuation lines are #8393.
        if: always()
        run: |
          rc=0
          grep -rnE '^Exec[A-Za-z]*=(.*[^$]|)\$\{[0-9#%]|^Exec[A-Za-z]*=(.*[^A-Za-z0-9])?(sh|bash|zsh)[[:space:]]+-c[[:space:]].*([^%]%[su]|[^%]%h([^/]|$))' \
            systemd rootfs || rc=$?
          test "$rc" -eq 1
      - name: pi seat ids resolve to litellm-proxy.yaml model_name (fleet-ops#8332)
        if: always()
        run: jq -n -e --argjson ids "$(jq -c '[.providers.litellm.models[].id]' config/pi-models.json)" --argjson names "$(yq -o=json '[.model_list[].model_name]' config/litellm-proxy.yaml)" '($ids - $names) as $bad | if ($bad|length)==0 then true else error("unresolved pi seat ids - \($bad|join(","))") end'
      # Native provider only (fleet-ops#9253): openai/ on ollama.com/v1 returns reply ids
      # chatcmpl-<0..999> that collide in LiteLLM_SpendLogs, so its calls never log.
      - name: Ollama rungs serve only the permitted slug on the native provider (fleet-ops#8332, fleet-ops#9253)
        if: always()
        run: yq -o=json '[.model_list[] | select(((.litellm_params.api_base // "") | test("ollama")) or ((.litellm_params.model // "") | test("^ollama"))) | "\(.litellm_params.model) @ \(.litellm_params.api_base)" | select(. != "ollama_chat/deepseek-v4.1-flash @ https://ollama.com")]' config/litellm-proxy.yaml | jq -e 'if length==0 then true else error("ollama rungs must be ollama_chat/deepseek-v4.1-flash @ https://ollama.com - \(join(","))") end'
      - name: Miss-review event filter
        if: always()
        run: |
          jq -e '
            def fire:
              (.miss_review == "live") and (
                (.event_name == "issues" and .action == "labeled" and .label == "agent-failed")
                or (.event_name == "issues" and .action == "reopened")
                or (.event_name == "issue_comment" and .action == "created" and ((.body // "") | startswith("park:") or startswith("opus-vet:")) and ((.author_association // "") | IN("OWNER","MEMBER","COLLABORATOR")))
                or (.event_name == "pull_request_target" and .action == "closed" and (.merged == false) and ((.head_ref // "") | startswith("claim/issue-")) and .head_repo == .repository)
                or (.event_name == "pull_request_target" and .action == "closed" and (.merged == true) and ((.title // "") | startswith("Revert")) and .head_repo == .repository)
                or (.event_name == "workflow_dispatch" and .task == "miss-review" and ((.issue // "") | length) > 0)
                or (.event_name == "schedule" and .requeued == true)
              );
            (.cases | map(select(.want != fire)) | if length == 0 then true else error("filter mismatch: \(map(.id)|join(","))") end)
          ' config/miss-review-events.json
          jq -r '.needles[]' config/miss-review-events.json | while IFS= read -r n; do
            grep -F -- "$n" .github/workflows/agent-dispatch.yml >/dev/null || { echo "missing needle: $n"; exit 1; }
          done
      - name: Orchestrate event filter
        if: always()
        run: |
          # The orchestrate job's if:, in the order the workflow writes it.
          jq -e '
            def fire:
              ((.orchestrate // "") != "off") and (
                (.event_name == "issues" and .action == "labeled" and .label == "needs-orchestrator" and
                  ((.sender // "") == "nish3451" or
                   (((.sender // "") | endswith("[bot]")) and ((.sender // "") == "nishfleet-worker[bot]" or (.sender // "") == "github-actions[bot]"))))
                or (.event_name == "workflow_dispatch" and .task == "orchestrate" and ((.issue // "") | length) > 0)
              );
            (.orchestrate_cases | map(select(.want != fire)) | if length == 0 then true else error("orchestrate filter mismatch: \(map(.id)|join(","))") end)
          ' config/orchestrate-events.json
          # The Gate detector in agent.yml, verbatim: an issue whose title or
          # body names a workflow file is parked for the orchestrator, because
          # no worker App can push one.
          jq -e '
            def parks: (((.title // "") + "\n" + (.body // "")) | contains(".github/workflows/"));
            (.gate_cases | map(select(.want_park != parks)) | if length == 0 then true else error("gate detector mismatch: \(map(.id)|join(","))") end)
          ' config/orchestrate-events.json
          jq -r '.needles["agent-dispatch.yml"][]' config/orchestrate-events.json | while IFS= read -r n; do
            grep -F -- "$n" .github/workflows/agent-dispatch.yml >/dev/null || { echo "missing dispatch needle: $n"; exit 1; }
          done
          jq -r '.needles["agent.yml"][]' config/orchestrate-events.json | while IFS= read -r n; do
            grep -F -- "$n" .github/workflows/agent.yml >/dev/null || { echo "missing gate needle: $n"; exit 1; }
          done
      - name: Dispatch pause flag skips dispatch, never the guards
        # A paused queue must still hold risky PRs: the weekly update once
        # disabled agent-dispatch, and hold-risky could not run in that window
        # (2026-10-05). Every job is classed here, so a new job forces the
        # choice. A dispatch job carries the flag as a top-level conjunct of its
        # if:, so no || branch can start a worker while paused; a guard job
        # never reads the flag. update.yml must pause through the variable,
        # clear it in always:, and never disable the workflow.
        if: always()
        run: |
          set -euo pipefail
          f=.github/workflows/agent-dispatch.yml
          gated="new rework conflicts remerge ejected list unblocked miss-review miss-review-pr miss-stalled orchestrate"
          guards="hold-risky close-claim rework-note"
          bad=0
          for j in $(yq '.jobs | keys | .[]' "$f"); do
            cond=$(yq ".jobs.\"$j\".if // \"\"" "$f" | tr -s ' \n' '  ' | sed 's/ $//')
            case " $gated " in
              *" $j "*)
                [[ $cond =~ ^(!cancelled\(\)\ \&\&\ )?vars\.FLEET_DISPATCH_PAUSED\ !=\ \'true\'\ \&\&\  ]] ||
                  { echo "dispatch job $j does not skip on FLEET_DISPATCH_PAUSED: $cond"; bad=1; }
                continue ;;
            esac
            case " $guards " in
              *" $j "*)
                ! yq ".jobs.\"$j\"" "$f" | grep -q FLEET_DISPATCH_PAUSED ||
                  { echo "guard job $j reads FLEET_DISPATCH_PAUSED; it must run while paused"; bad=1; }
                ! yq ".jobs.\"$j\" | has(\"uses\")" "$f" | grep -qx true ||
                  { echo "guard job $j starts a worker"; bad=1; }
                continue ;;
            esac
            if [ "$j" = paused ]; then
              [[ $cond == "vars.FLEET_DISPATCH_PAUSED == 'true' && "* ]] || { echo "paused job runs unpaused: $cond"; bad=1; }
              [ "$(yq '.jobs.paused.permissions | length' "$f")" = 0 ] || { echo "paused job has permissions"; bad=1; }
              continue
            fi
            echo "job $j is not classed as dispatch or guard in this check"; bad=1
          done
          u=ansible/update.yml
          ! grep -nE 'gh, *workflow, *(disable|enable)' "$u" || { echo "$u disables or enables a workflow"; bad=1; }
          [ "$(yq '.[0].vars.pause_variable' "$u")" = FLEET_DISPATCH_PAUSED ] || { echo "$u pause_variable is not FLEET_DISPATCH_PAUSED"; bad=1; }
          set_true=$(yq '[.. | select(tag == "!!map" and has("ansible.builtin.command")) | .["ansible.builtin.command"].argv | select(.[1] == "variable" and .[2] == "set" and .[5] == "true")] | length' "$u")
          clear=$(yq '[.[0].tasks[] | select(has("always")) | .always[] | .. | select(tag == "!!map" and has("ansible.builtin.command")) | .["ansible.builtin.command"].argv | select(.[1] == "variable" and .[2] == "set" and .[5] == "false")] | length' "$u")
          [ "$set_true" = 1 ] && [ "$clear" = 1 ] || { echo "$u: want one set to true and one clear in always:, got $set_true and $clear"; bad=1; }
          # A run killed before always: (TimeoutStartSec, SIGKILL) must not
          # leave dispatch paused for good, and a failed clear must page
          # instead of waiting for next Sunday. Structural, by task name: each
          # named task must exist exactly once, in this order, in the right
          # block, with the right command or file state. A renamed or moved
          # task fails here instead of passing a string match by luck.
          [ "$(yq '.[0].vars.pause_marker' "$u")" = /var/lib/fleet-ops/dispatch-paused-by-update ] || { echo "$u pause_marker moved"; bad=1; }
          cat > "$RUNNER_TEMP/pause.jq" <<'JQ'
          . as $doc
          # Every task and block in the play, in file order, as paths.
          | [paths(objects and has("name") and (has("block") or (keys | any(startswith("ansible.builtin."))))) | select(.[0] == 0 and .[1] == "tasks")] as $ps
          | def at($n): [range(0; $ps | length) | . as $i | select(($doc | getpath($ps[$i])).name == $n)];
            def task($n): $doc | getpath($ps[at($n)[0]]);
            # argv[1:6] is the gh call without the binary: "variable set <var> --body <value>".
            def argv($n): (task($n)["ansible.builtin.command"].argv // []) as $a | if ($a | type) == "array" then $a[1:6] | join(" ") else "" end;
            def top($n): $ps[at($n)[0]][2];
            def part($n): $ps[at($n)[0]][3];
            def idx($n): at($n)[0];
            "Pause, prune and update" as $main
          | "Clear the pause flag on each of them" as $sc
          | "Drop the stale marker" as $sd
          | "Record which repos this run pauses, before pausing them" as $w
          | "Pause agent dispatch where it is not paused (no new agent jobs)" as $p
          | "Clear the dispatch pause flag where this run set it" as $c
          | "Read the pause flag back on each repo this run paused" as $r
          | "Name every repo whose dispatch is still paused" as $n
          | "Drop the pause marker once every flag it lists is clear" as $d
          | "Fail loudly if any step or check went wrong" as $fa
          | [$main, $sc, $sd, $w, $p, $c, $r, $n, $d, $fa] as $all
          | [ ($all[] | select(at(.) | length != 1) | "want exactly one task named \"\(.)\""),
              (if any($all[]; at(.) | length != 1) then empty else
                (if [idx($sc), idx($sd), idx($w), idx($p), idx($c), idx($r), idx($n), idx($d)] | . != sort
                 then "pause tasks out of order: want stale clear, stale drop, write, set, clear, read back, name, drop" else empty end),
                (if top($sc) == top($sd) and top($sc) < top($main) and (($doc[0].tasks[top($sc)].when // "") | tostring) == "stale_pause.stat.exists"
                 then empty else "stale clear and drop: want one top-level block gated on stale_pause.stat.exists, before the main block" end),
                (if argv($sc) == "variable set {{ pause_variable }} --body false" and ((task($sc).loop // "") | tostring | test("stale_pause_repos"))
                 then empty else "stale clear: want a set to false over the marker file's repos" end),
                (if task($sd)["ansible.builtin.file"] == {"path": "{{ pause_marker }}", "state": "absent"}
                 then empty else "stale drop: want a delete of the marker" end),
                (if top($w) == top($main) and top($p) == top($main) and part($w) == "block" and part($p) == "block"
                 then empty else "write and set: want both inside the main block" end),
                # Root-owned and 0600: a job running as nish must not be able to
                # list a repo for the next run to unpause.
                (task($w) as $t
                 | if $t["ansible.builtin.copy"].dest == "{{ pause_marker }}" and $t["ansible.builtin.copy"].mode == "0600"
                      and $t["ansible.builtin.copy"].owner == "root" and $t.become == false and ($t | has("become_user") | not)
                   then empty else "marker write: want dest pause_marker, mode \"0600\", owner root, become: false, no become_user (so it runs as root)" end),
                (if argv($p) == "variable set {{ pause_variable }} --body true" then empty else "pause: want a set to true" end),
                ([$c, $r, $n, $d][] | select(top(.) != top($main) or part(.) != "always") | "\(.): want it in the main block's always:"),
                (if argv($c) == "variable set {{ pause_variable }} --body false" then empty else "always clear: want a set to false" end),
                # The clear retries before it gives up: one API blip must not
                # leave a queue paused.
                (task($c) as $t
                 | if (($t.until // "") | tostring | test("^\\s*" + ($t.register // "-") + " is succeeded\\s*$")) and $t.retries == 3
                   then empty else "always clear: want until: <its register> is succeeded and retries: 3" end),
                # The read-back reads the flag itself, by name, and only a 404
                # (unset) is allowed to pass as not paused.
                (task($r) as $t | ($t["ansible.builtin.command"].argv // []) as $a
                 | if $a == ["gh", "api", "repos/{{ item }}/actions/variables/{{ pause_variable }}", "--jq", ".value"]
                      and $doc[0].vars.pause_variable == "FLEET_DISPATCH_PAUSED"
                   then empty else "read back: want gh api repos/{{ item }}/actions/variables/{{ pause_variable }} --jq .value, with pause_variable FLEET_DISPATCH_PAUSED" end),
                (task($r) as $t
                 | if ($t.register // "") != "" and (($t.failed_when // "") | tostring) == "\($t.register).rc != 0 and 'HTTP 404' not in \($t.register).stderr"
                   then empty else "read back: want failed_when: <register>.rc != 0 and 'HTTP 404' not in <register>.stderr" end),
                (if task($d)["ansible.builtin.file"] == {"path": "{{ pause_marker }}", "state": "absent"} and ((task($d).when // "") | tostring | test("dispatch_still_paused"))
                 then empty else "always drop: want a marker delete gated on dispatch_still_paused" end),
                # The point of the read-back: a repo left paused pages, instead
                # of sitting paused until the next weekly run.
                (task($fa)["ansible.builtin.assert"] as $as
                 | (if [($as.that // [])[] | tostring | select(test("dispatch_still_paused"))] | length > 0
                    then empty else "the final assert does not fail on dispatch_still_paused" end),
                   (if ($as.fail_msg // "") | tostring | test("DISPATCH STILL PAUSED")
                    then empty else "the final assert's fail_msg does not name a still-paused queue (DISPATCH STILL PAUSED)" end))
              end)
            ] | .[]
          JQ
          yq -o=json "$u" | jq -r -f "$RUNNER_TEMP/pause.jq" > "$RUNNER_TEMP/pause-problems.txt"
          if [ -s "$RUNNER_TEMP/pause-problems.txt" ]; then sed "s|^|$u: |" "$RUNNER_TEMP/pause-problems.txt"; bad=1; fi
          test "$bad" -eq 0
      - name: Risky-path hold classifier (hold-risky)
        # Runs agent-dispatch.yml's own CLASSIFY and APPROVAL programs, read out
        # of the workflow, against every case in config/risky-paths.json, so the list
        # and the program cannot drift from what the hold job runs. A case with
        # "paths": null stands for an unreadable list, which must hold. An
        # approval case feeds APPROVAL {sha, statuses, comments}, the shape the
        # job builds from the head sha, its statuses and the PR's comments.
        if: always()
        run: |
          prog=$(yq '.jobs.hold-risky.env.CLASSIFY' .github/workflows/agent-dispatch.yml)
          label=$(yq '.jobs.hold-risky.env.LABEL' .github/workflows/agent-dispatch.yml)
          [ -n "$prog" ] && [ "$prog" != null ] && [ "$label" = needs-coordinator ]
          jq -e '.paths["*"] | length > 0' config/risky-paths.json >/dev/null
          bad=0
          while IFS= read -r c; do
            cfg=$(jq -c --argjson c "$c" 'if ($c | has("paths")) then {paths: $c.paths} else . end' config/risky-paths.json)
            got=$(jq -c --argjson cfg "$cfg" --arg label "$label" "$prog" <<<"$c")
            [ "$(jq -r .risky <<<"$got")" = "$(jq -r .want <<<"$c")" ] || { echo "case $(jq -r .id <<<"$c"): got $got"; bad=1; }
          done < <(jq -c '.cases[]' config/risky-paths.json)
          approved=$(yq '.jobs.hold-risky.env.APPROVAL' .github/workflows/agent-dispatch.yml)
          ctx=$(yq '.jobs.hold-risky.env.CONTEXT' .github/workflows/agent-dispatch.yml)
          [ -n "$approved" ] && [ "$approved" != null ] && [ "$ctx" = coordinator-approval ]
          while IFS= read -r c; do
            got=$(jq -r --arg c "$ctx" --arg who "$(jq -r '.approvers | join(" ")' <<<"$c")" "$approved" <<<"$(jq -c '{sha, statuses, comments}' <<<"$c")")
            [ "$got" = "$(jq -r .want <<<"$c")" ] || { echo "approval case $(jq -r .id <<<"$c"): got $got"; bad=1; }
          done < <(jq -c '.approval_cases[]' config/risky-paths.json)
          test "$bad" -eq 0
      - name: hold-risky fails closed (fake gh)
        # Runs hold-risky's own run block, read out of agent-dispatch.yml,
        # against a fake gh and curl. Each read fails in turn, and every run
        # must still label, disarm and dequeue a risky PR; a failed approval
        # read must not approve even when the other read would. Controls: an
        # approved risky PR and an unread-free safe PR are not held.
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/hold-mock
          mkdir -p "$t/bin"
          yq '.jobs.hold-risky.steps[0].run' .github/workflows/agent-dispatch.yml > "$t/hold.sh"
          for v in LABEL CONTEXT APPROVERS RISKY_PATHS_URL CLASSIFY APPROVAL; do
            val=$(yq ".jobs.hold-risky.env.$v" .github/workflows/agent-dispatch.yml)
            [ -n "$val" ] && [ "$val" != null ] || { echo "hold-risky env $v missing"; exit 1; }
            export "$v=$val"
          done
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          args="$*"
          if [ -n "${FAIL:-}" ] && grep -qE -- "$FAIL" <<<"gh $args"; then echo "mock gh fails: $args" >&2; exit 1; fi
          case $args in
            *"query=query("*)
              q=true; a='{"enabledAt":"x"}'
              [ ! -f "$STATE/dequeued" ] || q=false
              [ ! -f "$STATE/disarmed" ] || a=null
              echo "{\"id\":\"PR_n\",\"isInMergeQueue\":$q,\"autoMergeRequest\":$a}" ;;
            *disablePullRequestAutoMerge*) touch "$STATE/disarmed" ;;
            *dequeuePullRequest*) touch "$STATE/dequeued" ;;
            *"/labels"*) touch "$STATE/labelled" ;;
            *"/files?"*) if [ -n "${SAFE:-}" ]; then echo app/routes/home.tsx; else echo workers/app.ts; fi ;;
            *"/statuses?"*) ;;
            *"/comments?"*) [ -z "${APPROVE:-}" ] || echo "{\"user\":{\"login\":\"nish3451\"},\"body\":\"coordinator-approval: $SHA\",\"created_at\":\"t\",\"updated_at\":\"t\"}" ;;
            *"/pulls/7") echo "{\"state\":\"open\",\"head\":{\"sha\":\"$SHA\"},\"labels\":[],\"changed_files\":1,\"node_id\":\"PR_n\"}" ;;
            *) echo "mock gh: unexpected call: $args" >&2; exit 1 ;;
          esac
          MOCK
          cat > "$t/bin/curl" <<'MOCK'
          #!/usr/bin/env bash
          if [ -n "${FAIL:-}" ] && grep -qE -- "$FAIL" <<<"curl $*"; then exit 22; fi
          cat config/risky-paths.json
          MOCK
          chmod +x "$t/bin/gh" "$t/bin/curl"
          export SHA=3f9c2a1b7d4e5f60718293a4b5c6d7e8f9012345 GITHUB_REPOSITORY=Nishfleet/0509 PR=7
          bad=0
          # case: name|FAIL regex|APPROVE|SAFE|want held (yes/no)|want exit (0/1)
          while IFS='|' read -r name fail approve safe held code; do
            export STATE=$t/$name RUNNER_TEMP=$t/$name/tmp GITHUB_STEP_SUMMARY=$t/$name/summary FAIL=$fail APPROVE=$approve SAFE=$safe
            mkdir -p "$RUNNER_TEMP"
            rc=0
            PATH="$t/bin:$PATH" bash "$t/hold.sh" > "$t/$name/out" 2>&1 || rc=$?
            got=no
            # Held = disarmed, dequeued and labelled (the label write itself
            # fails in label-write-fails, which must still disarm and dequeue).
            [ -f "$STATE/disarmed" ] && [ -f "$STATE/dequeued" ] && { [ -f "$STATE/labelled" ] || [ "$name" = label-write-fails ]; } && got=yes
            if [ "$held" = no ] && { [ -f "$STATE/labelled" ] || [ -f "$STATE/disarmed" ] || [ -f "$STATE/dequeued" ]; }; then got=partial; fi
            if [ "$got" != "$held" ] || [ "$rc" != "$code" ]; then
              echo "case $name: held=$got (want $held) exit=$rc (want $code)"; cat "$t/$name/out"; bad=1
            fi
          done <<'CASES'
          risky-unapproved||||yes|0
          pr-read-fails|pulls/7$|||yes|0
          pr-read-fails-safe-files|pulls/7$||1|yes|0
          files-read-fails|/files\?|||yes|0
          path-list-fails|^curl|||yes|0
          statuses-read-fails|/statuses\?|1||yes|0
          comments-read-fails|/comments\?|||yes|0
          merge-state-read-fails|query=query\(|||yes|1
          label-write-fails|/labels|||yes|1
          approved-control||1||no|0
          safe-control|||1|no|0
          CASES
          test "$bad" -eq 0
      - name: Infra-wall classifier (fake gh)
        # Runs the report job's own run block, read out of agent.yml, against a
        # fake gh. Cases in config/infra-wall-events.json carry the real
        # jobs-API payloads of the 2026-10-05 overload (runs 37267338065 and
        # 37276581999, public on fleet-ops): the 55-minute cap death and the
        # mid-worker runner deaths that were wrongly struck into the
        # strong-only lane (fleet-ops#9291). Controls prove the strike path is
        # unchanged: a healthy host, a missing guard sample, an early worker
        # failure, a later-step failure, a failed jobs read and an unmatchable
        # ref all still strike, the second strike still parks, and a fourth
        # infra death in a row strikes (the requeue cap).
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/infra-mock
          mkdir -p "$t/bin"
          block() { yq ".jobs.report.steps[] | select(.name == \"Strike or requeue\") | .$1" .github/workflows/agent.yml; }
          block run > "$t/report.sh"
          for v in LOAD1 CORES SWAP_USED_KB WORKER_TIMEOUT_SECS CPU_LOAD_FACTOR SWAP_GUARD_KB INFRA_REQUEUE_CAP; do
            val=$(block "env.$v")
            [ -n "$val" ] && [ "$val" != null ] || { echo "report env $v missing"; exit 1; }
          done
          # The guard constants ship with the block; the Host sample values are
          # per case (a runner that died records none).
          WORKER_TIMEOUT_SECS=$(block env.WORKER_TIMEOUT_SECS)
          CPU_LOAD_FACTOR=$(block env.CPU_LOAD_FACTOR)
          SWAP_GUARD_KB=$(block env.SWAP_GUARD_KB)
          INFRA_REQUEUE_CAP=$(block env.INFRA_REQUEUE_CAP)
          export WORKER_TIMEOUT_SECS CPU_LOAD_FACTOR SWAP_GUARD_KB INFRA_REQUEUE_CAP
          # The work job must sample the host at the death moment and hand the
          # numbers to report through the job outputs.
          yq '.jobs.work.steps[] | select(.id == "host") | .run' .github/workflows/agent.yml > "$t/sample.sh"
          sample_out=$t/sample.out
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          for k in load1 cores swap_used_kb; do
            grep -Eq "^$k=[0-9]+(\\.[0-9]+)?$" "$sample_out" || { echo "host sample: $k missing or malformed"; exit 1; }
          done
          yq '.jobs.work.outputs.load1' .github/workflows/agent.yml | grep -F 'steps.host.outputs.load1' >/dev/null || { echo "work outputs.load1 not wired"; exit 1; }
          yq '.jobs.work.outputs.cores' .github/workflows/agent.yml | grep -F 'steps.host.outputs.cores' >/dev/null || { echo "work outputs.cores not wired"; exit 1; }
          yq '.jobs.work.outputs.swap_used_kb' .github/workflows/agent.yml | grep -F 'steps.host.outputs.swap_used_kb' >/dev/null || { echo "work outputs.swap_used_kb not wired"; exit 1; }
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          prog=""; jqnext=0; args=()
          for a in "$@"; do
            if [ "$jqnext" = 1 ]; then prog=$a; jqnext=0; continue; fi
            if [ "$a" = "--jq" ]; then jqnext=1; continue; fi
            args+=("$a")
          done
          joined="${args[*]}"
          case $joined in
            *"--json number"*) exit 0 ;;
            *"--paginate"*"/jobs"*)
              if [ -n "${API_FAIL:-}" ]; then echo "mock gh: jobs api fails" >&2; exit 1; fi
              cat "$FIXTURE" ;;
            *"--json comments"*)
              if [ -n "$prog" ]; then jq "$prog" "$COMMENTS"; else cat "$COMMENTS"; fi ;;
            *"issue comment"*) printf '%s\n' "$joined" >> "$STATE/commented" ;;
            *"issue edit"*) printf '%s\n' "$joined" >> "$STATE/edited" ;;
            *) echo "mock gh: unexpected call: $joined" >&2; exit 1 ;;
          esac
          MOCK
          chmod +x "$t/bin/gh"
          export GITHUB_RUN_ID=4242424242 GITHUB_REPOSITORY=Nishfleet/fleet-ops GITHUB_SERVER_URL=https://github.com
          bad=0
          while IFS='|' read -r name fixture ref l1 co sw prior infra started want; do
            export STATE=$t/$name FIXTURE=$t/$name-jobs.json COMMENTS=$t/$name-comments.json
            mkdir -p "$STATE"
            : > "$STATE/commented"; : > "$STATE/edited"
            jq -c --arg f "$fixture" '.fixtures[$f][]' config/infra-wall-events.json > "$FIXTURE"
            jq -n --arg u "https://github.com/Nishfleet/fleet-ops/actions/runs/$GITHUB_RUN_ID" --argjson s "$started" --argjson p "$prior" --argjson n "$infra" \
              '{comments: ([if $s == 1 then {body: ("agent run started: " + $u), authorAssociation: "NONE"} else empty end]
                + [if $p == 1 then {body: "agent run failed: https://github.com/Nishfleet/fleet-ops/actions/runs/111", authorAssociation: "NONE"} else empty end]
                + [range($n) | {body: "agent run infra-failed: https://github.com/Nishfleet/fleet-ops/actions/runs/222", authorAssociation: "NONE"}])}' > "$COMMENTS"
            export N=$ref LOAD1=$l1 CORES=$co SWAP_USED_KB=$sw
            API_FAIL=
            if [ "$name" = jobs-api-fails ]; then API_FAIL=1; fi
            export API_FAIL
            rc=0
            PATH="$t/bin:$PATH" bash "$t/report.sh" > "$STATE/out" 2>&1 || rc=$?
            got=none
            if grep -q "agent run infra-failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && grep -q -- "--add-label agent-ready --remove-label agent-in-progress" "$STATE/edited" \
               && ! grep -q "agent run failed:" "$STATE/commented" \
               && ! grep -qE 'strong-only|needs-orchestrator' "$STATE/edited"; then got=infra; fi
            if grep -q "agent run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && ! grep -q infra-failed "$STATE/commented" && grep -q strong-only "$STATE/edited"; then got=strike; fi
            if grep -q "agent run failed:" "$STATE/commented" && grep -q needs-orchestrator "$STATE/edited"; then got=park; fi
            if [ ! -s "$STATE/commented" ] && [ ! -s "$STATE/edited" ]; then got=skip; fi
            if [ "$got" != "$want" ] || [ "$rc" != 0 ]; then
              echo "case $name: got=$got (want $want) exit=$rc"; cat "$STATE/out"; bad=1
            fi
          done < <(jq -r '.cases[] | [.name, .fixture, .ref, .env.LOAD1, .env.CORES, .env.SWAP_USED_KB, (.prior_failed_comment|tostring), (.prior_infra_comments // 0 | tostring), (if .started_comment then 1 else 0 end), .want] | map(tostring) | join("|")' config/infra-wall-events.json)
          test "$bad" -eq 0
