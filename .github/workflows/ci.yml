name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          # Pinned to a release >7 days old. Bump SEMGREP_VERSION after vetting.
          SEMGREP_VERSION="1.170.0"
          python3 -m pip install --no-input "semgrep==${SEMGREP_VERSION}"
      # TODO(fleet-ops): add the fleet's orchestration rules config from
      # Nishfleet/siterep-public .semgrep/no-hand-built-orchestration.yml at an
      # exact commit SHA, once packet p56 merges it. Until then, p/default only.
      # Flagged loudly: the orchestration-specific ruleset is NOT yet applied.
      - name: Run semgrep
        run: semgrep --config p/default --error .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned binary + sha256)
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="v0.11.0"
          SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          ARCHIVE="shellcheck-v0.11.0.linux.x86_64.tar.xz"
          URL="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${SHELLCHECK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xJf "${ARCHIVE}" -C "${HOME}/.local/bin" --strip-components=1 "shellcheck-v0.11.0/shellcheck"
          chmod +x "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run shellcheck
        # -x: follow `source` calls. bin/pi-issue-run sources lib/seat-lib.sh
        # through a variable (PI_PACKET_SEAT_LIB override), and the canonical
        # source file lives in the repo (the install symlinks it). Without
        # -x, shellcheck can't resolve the include and emits SC1091 — which
        # is the documented case shellcheck -x exists for.
        # Filter bin/* to skip non-shell files (Python helper, TS extensions).
        # shellcheck decides the language from the extension; feeding it .py
        # emits SC1071 and exits nonzero, which is wrong for our layout.
        run: |
          set -euo pipefail
          shopt -s extglob
          files=(bin/!(*.py|*.ts) install.sh)
          shellcheck -x "${files[@]}"

  unit-verify:
    name: systemd-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stub VPS executables
        # `systemd-analyze verify` checks that ExecStart commands exist. The
        # units reference VPS-specific paths (/home/nish/.local/bin/pi, the
        # siterep-* scripts, fleet-console-pi/push.sh) that do not exist on a
        # hosted runner. Create empty executable stubs so verify can check the
        # unit SYNTAX (section headers, directives, key=value validity) without
        # false-positiving on missing host binaries. This is the stubbed
        # environment the packet specifies for verifying unit FILES outside
        # their target host.
        run: |
          set -euo pipefail
          # Hosted runners run as user 'runner', not 'nish' — use sudo to
          # create the VPS paths the units reference.
          for p in \
            /home/nish/.local/bin/pi \
            /home/nish/.local/bin/pi-issue-run \
            /home/nish/.local/bin/pi-packet-run \
            /home/nish/.local/bin/pi-intake-run \
            /home/nish/.local/bin/agent-cron-run \
            /home/nish/.local/bin/intake-reconcile \
            /home/nish/.local/bin/pi-issue-failed-reap \
            /home/nish/.local/bin/siterep-deploy \
            /home/nish/.local/bin/siterep-deploy-verify \
            /home/nish/.local/bin/siterep-deploy-rollback \
            /home/nish/.local/bin/siterep-live-canary \
            /home/nish/.local/bin/siterep-uptime \
            /home/nish/.local/bin/fleet-heartbeat \
            /home/nish/.local/bin/fleet-heartbeat-tier1 \
            /home/nish/.local/bin/fleet-heartbeat-tier2 \
            /home/nish/.local/bin/fleet-blind-audit \
            /home/nish/.local/bin/fleet-blind-audit-panel \
            /home/nish/.local/bin/fleet-deploy-check \
            /home/nish/.local/bin/fleet-seat-recovery \
            /home/nish/.local/bin/fleet-unjustified-wait \
            /home/nish/.local/bin/fleet-escalation-completion \
            /home/nish/.local/bin/fleet-asset-census \
            /home/nish/.local/bin/agent-scheduler-drift-check \
            /home/nish/.local/bin/memory-index-autocompact \
            /home/nish/workspaces/tooling/fleet-console-pi/push.sh
          do
            sudo install -D -m 0755 /dev/null "$p"
          done
      - name: Verify unit files
        # Proven to catch breakage: a malformed unit (bad section header /
        # missing '=') makes verify exit nonzero with a clear "failed to load
        # properly" message. Demonstrated locally before this commit.
        run: |
          set -uo pipefail
          systemd-analyze --version
          # Verify each file individually so a failure names the bad file.
          # Do NOT use set -e: we want to collect all failures, then exit.
          shopt -s nullglob
          rc=0
          for f in systemd/*.service systemd/*.timer; do
            if ! systemd-analyze verify --man=no "$f"; then
              rc=1
            fi
          done
          exit "$rc"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned binary + sha256)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVE="gitleaks_8.30.1_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xzf "${ARCHIVE}" -C "${HOME}/.local/bin" gitleaks
          chmod +x "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan repository
        run: gitleaks git --redact --verbose

  tests:
    # Calls the central reusable PR-checks workflow. The four required check
    # names (Gitleaks, Semgrep, Shellcheck, systemd-analyze) stay as local
    # jobs above: a `uses:` job reports as "caller / callee" and would make
    # those required checks wait forever. scan-secrets is false so gitleaks
    # does not run twice while that required job still exists.
    name: P14 tests
    uses: ./.github/workflows/reusable-pr-checks.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      node-version: ""
      install-command: ""
      scan-secrets: false
      timeout-minutes: 20
      verify-command: |
        set -euo pipefail
        # fleet-ops#3235 part six (the follow-up its own commit message planned:
        # "CI workflow change in a follow-up commit — GitHub App cannot push
        # workflow files"). GitHub runners have neither pi-transport-check nor
        # pi, so the #3235 transport gate read every bench writer as
        # transport-down and red'd the suite at the first ledger assertion
        # (seat-lib.test.sh run 33888017048, then pi-issue-run-noop-bench). The
        # suite runs transport-offline by declaration; the gate itself stays ON
        # in live operation where the real probe/bin exist.
        export PI_SEAT_LIB_CHECK_TRANSPORT=0
        for t in jq openssl curl python3 node git flock; do
          command -v "$t" >/dev/null 2>&1 || {
            echo "missing tool: $t" >&2
            exit 1
          }
        done
        bash tests/manifest-shape.test.sh
        bash tests/intake-repos-shape.test.sh
        bash tests/worker-token-fail-closed.test.sh
        bash tests/semantic-conflict-detector.test.sh
        bash tests/repeat-deterministic-detector.test.sh
        bash tests/red-on-main-detector.test.sh
        bash tests/ci-failure-escalation-detector.test.sh
        bash tests/staleness-checker.test.sh
        bash tests/required-check-purity.test.sh
        bash tests/pi-packet-guard.test.sh
        bash tests/fleet-work-supply-canary.test.sh
        bash tests/scout-futility.test.sh
        bash tests/pi-systemd-run.test.sh
        bash tests/pi-intake-run.test.sh
        bash tests/pi-issue-start.test.sh
        bash tests/pi-issue-start-packet-regen.test.sh
        bash tests/worker-prompt-size-ceiling.test.sh
        bash tests/pi-issue-failed-reap.test.sh
        # fleet-ops#2133: reclaim cooldown + stale-claim release break the
        # spawn-die-respawn wedge (reaper writes cooldown marker, intake
        # skips for 15min, stale claims with no live worker/PR are released).
        bash tests/pi-issue-failed-reap-cooldown.test.sh
        bash tests/pi-intake-tick-reclaim-cooldown.test.sh
        bash tests/pi-intake-tick-difficulty-from-issue.test.sh
        bash tests/pi-intake-topup.test.sh
        bash tests/fleet-console-pi-utc.test.sh
        bash tests/pi-issue-run-session-error-feed.test.sh
        bash tests/repair-rotation.test.sh
        bash tests/alert-repair-seat-walled.test.sh
        bash tests/alert-repair-class-park-skip.test.sh
        bash tests/fleet-claim.test.sh
        bash tests/agent-cron-seat-rotation.test.sh
        bash tests/seat-lib.test.sh
        bash tests/seat-lib-degraded.test.sh
        bash tests/seat-lib-org-reserve.test.sh
        bash tests/stop-escalation-dispatch.test.sh
        bash tests/escalation-units-shape.test.sh
        # fleet-ops#1164: persist nish-boundary-notify CLASSES in git + lint.
        bash tests/nish-boundary-notify-classes.test.sh
        bash tests/system-dropins-shape.test.sh
        bash tests/fleet-ops-deploy.test.sh
        # fleet-ops#3634: self-rescue a deploy clone left on a named branch or
        # dirty instead of blocking every merge (2 incidents 2026-09-05).
        bash tests/fleet-ops-deploy-rescue.test.sh
        bash tests/fleet-heartbeat-undersaturation.test.sh
        # fleet-ops#153: lock the product-vs-control-plane throughput split.
        bash tests/fleet-heartbeat-throughput-split.test.sh
        # fleet-ops#153: lock the 0509 scout packet-assembly contract.
        bash tests/pi-scout-packet-assembly.test.sh
        bash tests/fleet-heartbeat-low-water-mark.test.sh
        bash tests/fleet-blind-audit.test.sh
        bash tests/fleet-heartbeat-blind-audit-trigger.test.sh
        bash tests/mass-close-guard.test.sh
        bash tests/codex-orphan-reap.test.sh
        # fleet-ops#1161: orphan-workflow detector (audit findings 3+4).
        bash tests/orphan-workflow-detector.test.sh
        bash tests/open-question-sweep-deleted.test.sh
        bash tests/escalation-coverage-canary.test.sh
        bash tests/fleet-unjustified-wait.test.sh
        bash tests/fleet-deploy-check.test.sh
        bash tests/fleet-seat-recovery.test.sh
        bash tests/fleet-escalation-completion.test.sh
        bash tests/rule-enforcement.test.sh
        bash tests/reusable-workflows.test.sh
        # fleet-ops#359: lock the auto-revert gate and the reopen-on-revert
        # behavior so a reverted merge can no longer leave its issues closed.
        bash tests/auto-revert-required-check-gate.test.sh
        bash tests/reopen-reverted-issues.test.sh
        # The CI-standards audit parses workflow YAML with PyYAML.
        python3 -m pip install --no-input "pyyaml==6.0.1"
        bash tests/ci-standards-audit.test.sh
        # fleet-ops#828: lock the gate-integrity decision script's
        # line-anchored attestation extraction (multi-line attest comments).
        bash tests/gate-integrity.test.sh
        # fleet-ops#1136: pin the self-maintenance ratio, upgrade/repair/churn
        # classification, queue composition, and verified-merges numerator
        # (non-null diff AND delivery evidence) in the metrics exporter, plus
        # the absent/trend alert rules and the self-maintenance config shape.
        bash tests/fleet-metrics-export.test.sh
        # fleet-ops#1235: lock the /etc/default/prometheus retention
        # override (40d) and the deploy restart-vs-reload + headroom guard.
        bash tests/prometheus-retention-40d.test.sh
        # fleet-ops#1460: lock the timer manifest shape (every user timer
        # has a manifest entry with a named reason — schedule-needs-reason).
        bash tests/timer-manifest.test.sh
        # fleet-ops#1534: single chokepoint for messages to Nish's phone.
        # hermes outbound class-gate (--urgent requires sanctioned --class),
        # alertmanager routing matrix (only severity=page -> telegram),
        # RepairDispatchDown is the only severity=page alert, writer class-gate
        # in stop-escalation-dispatch (CAP-REACHED/KILL-ESCALATION -> auditor
        # path, LADDER-WALLED -> MONEY-BOUNDARY), and the integration test
        # proving the two gates together form one phone chokepoint.
        bash tests/hermes-outbound-class-gate.test.sh
        bash tests/alertmanager-routing-matrix.test.sh
        bash tests/fleet-rules-severity-page.test.sh
        bash tests/stop-escalation-writer-class-gate.test.sh
        bash tests/phone-chokepoint.test.sh
        bash tests/scout-effectiveness-multirepo.test.sh
        # fleet-ops#3740 landed tests/fleet-close-and-archive-repo.test.sh without a
        # ci.yml entry, so the P14 listing gate went red on main and blocked every
        # PR (orchestrator fix, 2026-09-06). Drill: 5 scenarios, stubbed gh.
        bash tests/fleet-close-and-archive-repo.test.sh
