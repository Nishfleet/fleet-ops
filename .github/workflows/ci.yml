name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          # Pinned to a release >7 days old. Bump SEMGREP_VERSION after vetting.
          SEMGREP_VERSION="1.170.0"
          python3 -m pip install --no-input "semgrep==${SEMGREP_VERSION}"
      # TODO(fleet-ops): add the fleet's orchestration rules config from
      # Nishfleet/siterep-public .semgrep/no-hand-built-orchestration.yml at an
      # exact commit SHA, once packet p56 merges it. Until then, p/default only.
      # Flagged loudly: the orchestration-specific ruleset is NOT yet applied.
      - name: Run semgrep
        run: semgrep --config p/default --error .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned binary + sha256)
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="v0.11.0"
          SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          ARCHIVE="shellcheck-v0.11.0.linux.x86_64.tar.xz"
          URL="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${SHELLCHECK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xJf "${ARCHIVE}" -C "${HOME}/.local/bin" --strip-components=1 "shellcheck-v0.11.0/shellcheck"
          chmod +x "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run shellcheck
        # -x: follow `source` calls. bin/pi-issue-run sources lib/seat-lib.sh
        # through a variable (PI_PACKET_SEAT_LIB override), and the canonical
        # source file lives in the repo (the install symlinks it). Without
        # -x, shellcheck can't resolve the include and emits SC1091 — which
        # is the documented case shellcheck -x exists for.
        # Filter bin/* to skip non-shell files (Python helper, TS extensions).
        # shellcheck decides the language from the extension; feeding it .py
        # emits SC1071 and exits nonzero, which is wrong for our layout.
        run: |
          set -euo pipefail
          shopt -s extglob
          files=(bin/!(*.py|*.ts) install.sh)
          shellcheck -x "${files[@]}"

  unit-verify:
    name: systemd-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stub VPS executables
        # `systemd-analyze verify` checks that ExecStart commands exist. The
        # units reference VPS-specific paths (/home/nish/.local/bin/pi, the
        # siterep-* scripts, fleet-console-pi/push.sh) that do not exist on a
        # hosted runner. Create empty executable stubs so verify can check the
        # unit SYNTAX (section headers, directives, key=value validity) without
        # false-positiving on missing host binaries. This is the stubbed
        # environment the packet specifies for verifying unit FILES outside
        # their target host.
        run: |
          set -euo pipefail
          # Hosted runners run as user 'runner', not 'nish' — use sudo to
          # create the VPS paths the units reference.
          for p in \
            /home/nish/.local/bin/pi \
            /home/nish/.local/bin/pi-issue-run \
            /home/nish/.local/bin/pi-packet-run \
            /home/nish/.local/bin/pi-intake-run \
            /home/nish/.local/bin/pi-issue-failed-reap \
            /home/nish/.local/bin/siterep-deploy \
            /home/nish/.local/bin/siterep-deploy-verify \
            /home/nish/.local/bin/siterep-deploy-rollback \
            /home/nish/.local/bin/siterep-live-canary \
            /home/nish/.local/bin/siterep-uptime \
            /home/nish/.local/bin/fleet-heartbeat \
            /home/nish/.local/bin/fleet-heartbeat-tier1 \
            /home/nish/.local/bin/fleet-heartbeat-tier2 \
            /home/nish/workspaces/tooling/fleet-console-pi/push.sh
          do
            sudo install -D -m 0755 /dev/null "$p"
          done
      - name: Verify unit files
        # Proven to catch breakage: a malformed unit (bad section header /
        # missing '=') makes verify exit nonzero with a clear "failed to load
        # properly" message. Demonstrated locally before this commit.
        run: |
          set -uo pipefail
          systemd-analyze --version
          # Verify each file individually so a failure names the bad file.
          # Do NOT use set -e: we want to collect all failures, then exit.
          shopt -s nullglob
          rc=0
          for f in systemd/*.service systemd/*.timer; do
            if ! systemd-analyze verify --man=no "$f"; then
              rc=1
            fi
          done
          exit "$rc"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned binary + sha256)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVE="gitleaks_8.30.1_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xzf "${ARCHIVE}" -C "${HOME}/.local/bin" gitleaks
          chmod +x "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan repository
        run: gitleaks git --redact --verbose

  tests:
    # P14 (worker credential split): prove the nishfleet-worker App
    # manifest is shape-locked and the worker-token path is fail-closed.
    # The live test (tests/worker-token-live.test.sh) is gated on
    # NISHFLEET_WORKER_LIVE_TEST=1 and skips by default — it requires the
    # real App + credentials and is run manually after Nish's manifest
    # click. Until then, this job is the only automation that touches
    # the new code, and it never reaches GitHub.
    name: P14 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test deps
        # ubuntu-latest hosted runners are pre-seeded with curl, jq, openssl,
        # and python3 — apt-get is unnecessary here. Run a quick existence
        # check so the failure mode is "missing tool" rather than apt lock
        # contention with parallel jobs.
        run: |
          set -euo pipefail
          for t in jq openssl curl python3 node; do
            command -v "$t" >/dev/null 2>&1 || {
              echo "missing tool: $t" >&2
              exit 1
            }
          done
          # The CI-standards audit parses workflow YAML with PyYAML.
          python3 -m pip install --no-input "pyyaml==6.0.1"
      - name: Manifest shape
        run: bash tests/manifest-shape.test.sh
      - name: intake-repos shape
        run: bash tests/intake-repos-shape.test.sh
      - name: worker-token fail-closed
        run: bash tests/worker-token-fail-closed.test.sh
      - name: semantic-conflict-detector
        run: bash tests/semantic-conflict-detector.test.sh
      - name: repeat-deterministic-detector
        run: bash tests/repeat-deterministic-detector.test.sh
      - name: required-check-purity
        run: bash tests/required-check-purity.test.sh
      - name: pi-packet-guard
        run: bash tests/pi-packet-guard.test.sh
      - name: pi-systemd-run
        run: bash tests/pi-systemd-run.test.sh
      - name: pi-intake-run overlap
        run: bash tests/pi-intake-run.test.sh
      - name: pi-issue-start no-op
        run: bash tests/pi-issue-start.test.sh
      - name: pi-issue-failed-reap live skip
        run: bash tests/pi-issue-failed-reap.test.sh
      - name: repair rotation
        run: bash tests/repair-rotation.test.sh
      # fleet-ops#71: lock the system-scope RAM governor drop-ins this issue
      # repo-owns, plus their MANIFEST entries and the install.sh routing
      # that puts them under `./install.sh --system`. Drift detection at
      # install time is `./install.sh --check --system`; this is the
      # SHAPE lock that catches content regressions in CI.
      - name: system drop-ins shape
        run: bash tests/system-dropins-shape.test.sh
      - name: undersaturation alarm
        run: bash tests/fleet-heartbeat-undersaturation.test.sh
      # fleet-ops#77: lock the mass-close guard decision matrix. A not-planned
      # close of an agent-labeled issue with no merged linked PR reopens;
      # everything else stays closed. The live "close a dummy agent-ready
      # issue and watch it reopen" check is manual GitHub-side; this is the
      # SHAPE lock that catches decision regressions in CI.
      - name: mass-close guard
        run: bash tests/mass-close-guard.test.sh
      - name: ci-standards-audit
        run: bash tests/ci-standards-audit.test.sh
