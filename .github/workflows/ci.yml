          cat > "$t/bin/curl" <<'MOCK'
          #!/usr/bin/env bash
          if [ -n "${FAIL:-}" ] && grep -qE -- "$FAIL" <<<"curl $*"; then exit 22; fi
          cat config/risky-paths.json
          MOCK
          chmod +x "$t/bin/gh" "$t/bin/curl"
          export SHA=3f9c2a1b7d4e5f60718293a4b5c6d7e8f9012345 GITHUB_REPOSITORY=Nishfleet/0509 PR=7
          bad=0
          # case: name|FAIL regex|APPROVE (comment)|SAFE|want held (yes/no)|want exit (0/1)|review shape|rearm|draft|armed|want arm output (yes/no, default no)
          # A review shape is a PR review by nish3451 on the head unless the shape says otherwise.
          # rearm runs the block as approval-signal does: it never holds, and arms only an approved, unarmed, non-draft risky PR.
          while IFS='|' read -r name fail approve safe held code review rearm draft armed arm; do
            export STATE=$t/$name RUNNER_TEMP=$t/$name/tmp GITHUB_STEP_SUMMARY=$t/$name/summary GITHUB_OUTPUT=$t/$name/output FAIL=$fail APPROVE=$approve SAFE=$safe REVIEW=$review DRAFT=$draft ARMED=$armed REARM=false
            [ -z "$rearm" ] || REARM=true
            mkdir -p "$RUNNER_TEMP"
            rc=0
            PATH="$t/bin:$PATH" bash "$t/hold.sh" > "$t/$name/out" 2>&1 || rc=$?
            got=no
            # Held = disarmed, dequeued and labelled (the label write itself
            # fails in label-write-fails, which must still disarm and dequeue).
            [ -f "$STATE/disarmed" ] && [ -f "$STATE/dequeued" ] && { [ -f "$STATE/labelled" ] || [ "$name" = label-write-fails ]; } && got=yes
            if [ "$held" = no ] && { [ -f "$STATE/labelled" ] || [ -f "$STATE/disarmed" ] || [ -f "$STATE/dequeued" ]; }; then got=partial; fi
            if [ "$got" != "$held" ] || [ "$rc" != "$code" ]; then
              echo "case $name: held=$got (want $held) exit=$rc (want $code)"; cat "$t/$name/out"; bad=1
            fi
            armout=no
            ! grep -qx "arm_sha=$SHA" "$t/$name/output" 2>/dev/null || armout=yes
            if [ "$armout" != "${arm:-no}" ]; then echo "case $name: arm output=$armout (want ${arm:-no})"; cat "$t/$name/out"; bad=1; fi
          done <<'CASES'
          risky-unapproved||||yes|0
          pr-read-fails|pulls/7$|||yes|0
          pr-read-fails-safe-files|pulls/7$||1|yes|0
          files-read-fails|/files\?|||yes|0
          path-list-fails|^curl|||yes|0
          statuses-read-fails|/statuses\?|1||yes|0
          comments-read-fails|/comments\?|||yes|0
          merge-state-read-fails|query=query\(|||yes|1
          label-write-fails|/labels|||yes|1
          approved-control||1||no|0
          safe-control|||1|no|0
          review-approved-on-head||||no|0|approve
          review-approved-stale-sha||||yes|0|stale
          review-by-non-approver||||yes|0|non-approver
          review-by-actions-bot||||yes|0|bot
          review-dismissed||||yes|0|dismissed
          reviews-read-fails|/reviews\?|1||yes|0|approve
          rearm-review-approved||||no|0|approve|1|||yes
          rearm-comment-approved||1||no|0||1|||yes
          rearm-unapproved||||no|0||1|||no
          rearm-stale-review||||no|0|stale|1|||no
          rearm-bot-review||||no|0|bot|1|||no
          rearm-draft||||no|0|approve|1|1||no
          rearm-already-armed||||no|0|approve|1||1|no
          rearm-safe-pr|||1|no|0|approve|1|||no
          rearm-reviews-read-fails|/reviews\?|||no|0|approve|1|||no
          CASES
          test "$bad" -eq 0
      - name: coordinator-approval fails closed in the queue (fake gh)
        # Runs the coordinator-approval job's own run block, read out of this
        # file, against a fake gh, with the programs and path list read from
        # this checkout (BASE_DIR=.). A risky PR with no approval of its exact
        # head fails, whether it is the entry's own PR or one ahead of it in
        # the group; every failed read fails; controls pass (approved, safe).
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/gate-mock
          mkdir -p "$t/bin"
          yq '.jobs.coordinator-approval.steps[] | select(.name == "Fail a risky PR in the queue whose head has no coordinator approval") | .run' .github/workflows/ci.yml > "$t/gate.sh"
          [ -s "$t/gate.sh" ] && ! grep -qx null "$t/gate.sh"
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          args="$*"
          if [ -n "${FAIL:-}" ] && grep -qE -- "$FAIL" <<<"gh $args"; then echo "mock gh fails: $args" >&2; exit 1; fi
          sha() { printf '%040d' "$1"; }
          has() { [[ " $1 " == *" $2 "* ]]; }
          case $args in
            *"/compare/"*) tr ';' '\n' <<<"$SUBJECTS" ;;
            *"/pulls/"*"/files?"*) n=${args#*pulls/}; n=${n%%/*}; if has "$RISKY" "$n"; then echo '{"f":".github/workflows/deploy-production.yml","p":null,"patch":"@@ -1 +1 @@\n+x"}'; else echo '{"f":"app/routes/home.tsx","p":null,"patch":"@@ -1 +1 @@\n+x"}'; fi ;;
            *"/pulls/"*"/reviews?"*) n=${args#*pulls/}; n=${n%%/*}
              # REVIEW picks a review shape for the PRs in REVIEWED; commit_id is the head unless the shape says stale.
              if has "$REVIEWED" "$n"; then h=$(sha "$n"); u='{"login":"nish3451"}'; st=APPROVED; cid=$h
                case ${REVIEW:-} in
                  stale) cid=$(sha 999) ;;
                  non-approver) u='{"login":"someone-else"}' ;;
                  bot) u='{"login":"github-actions[bot]"}' ;;
                  dismissed) st=DISMISSED ;;
                  commented) st=COMMENTED ;;
                  changes-requested-later) echo "{\"user\":{\"login\":\"nish3451\"},\"state\":\"APPROVED\",\"commit_id\":\"$h\",\"submitted_at\":\"2026-10-09T01:00:00Z\"}"; st=CHANGES_REQUESTED ;;
                esac
                echo "{\"user\":$u,\"state\":\"$st\",\"commit_id\":\"$cid\",\"submitted_at\":\"2026-10-09T02:00:00Z\"}"
              fi ;;
            *"/pulls/"*) n=${args##*pulls/}; l='[]'; ! has "$LABELED" "$n" || l='[{"name":"needs-coordinator"}]'; echo "{\"state\":\"open\",\"head\":{\"sha\":\"$(sha "$n")\"},\"labels\":$l,\"changed_files\":1}" ;;
            *"/statuses?"*) ;;
            *"/issues/"*"/comments?"*) n=${args#*issues/}; n=${n%%/*}
              if has "$APPROVED" "$n"; then s=$(sha "$n"); [ -z "${STALE:-}" ] || s=$(sha 999); echo "{\"user\":{\"login\":\"nish3451\"},\"body\":\"coordinator-approval: $s\",\"created_at\":\"t\",\"updated_at\":\"t\"}"; fi ;;
            *) echo "mock gh: unexpected call: $args" >&2; exit 1 ;;
          esac
          MOCK
          chmod +x "$t/bin/gh"
          export GITHUB_REPOSITORY=Nishfleet/fleet-ops BASE_DIR=. BASE_SHA=b GROUP_SHA=g GH_TOKEN=x
          bad=0
          # case: name|head ref PR|commit subjects (;)|risky PRs|labelled PRs|approved PRs|stale approval|FAIL regex|want exit|review shape (PRs with an approving review are the ones in "approved" only when the shape is empty; a shape applies to PR 7)
          while IFS='|' read -r name pr subjects risky labeled approved stale fail want review; do
            export RUNNER_TEMP=$t/$name GITHUB_STEP_SUMMARY=$t/$name/summary SUBJECTS=$subjects RISKY=$risky LABELED=$labeled APPROVED=$approved STALE=$stale FAIL=$fail REVIEW=$review REVIEWED=
            [ -z "$review" ] || REVIEWED=7
            export HEAD_REF=refs/heads/gh-readonly-queue/main/pr-$pr-0123456789abcdef0123456789abcdef01234567
            [ "$pr" != badref ] || HEAD_REF=refs/heads/feature
            mkdir -p "$RUNNER_TEMP"
            rc=0
            PATH="$t/bin:$PATH" bash "$t/gate.sh" > "$t/$name/out" 2>&1 || rc=$?
            if [ "$rc" != "$want" ]; then echo "case $name: exit=$rc (want $want)"; cat "$t/$name/out"; bad=1; fi
          done <<'CASES'
          risky-unapproved|7|Add x (#7)|7|||||1
          label-only-unapproved|7|Add x (#7)||7||||1
          risky-approved|7|Add x (#7)|7||7|||0
          risky-approval-for-old-head|7|Add x (#7)|7||7|1||1
          safe-control|7|Add x (#7)||||||0
          group-ahead-unapproved|8|a (#7);b (#8)|7|||||1
          group-ahead-approved|8|a (#7);b (#8)|7||7|||0
          group-unmappable-commit|8|a;b (#8)||||||1
          bad-ref|badref|Add x (#7)||||||1
          pr-read-fails|7|Add x (#7)|||||pulls/7$|1
          files-read-fails|7|Add x (#7)|||||/files\?|1
          statuses-read-fails|7|Add x (#7)|7||7||/statuses\?|1
          comments-read-fails|7|Add x (#7)|7||7||/comments\?|1
          compare-read-fails|7|Add x (#7)|||||/compare/|1
          review-approved-on-head|7|Add x (#7)|7|||||0|approve
          review-approved-stale-sha|7|Add x (#7)|7|||||1|stale
          review-by-non-approver|7|Add x (#7)|7|||||1|non-approver
          review-by-actions-bot|7|Add x (#7)|7|||||1|bot
          review-dismissed|7|Add x (#7)|7|||||1|dismissed
          review-comment-only|7|Add x (#7)|7|||||1|commented
          review-approve-then-changes-requested|7|Add x (#7)|7|||||1|changes-requested-later
          review-approved-reviews-read-fails|7|Add x (#7)|7||7||/reviews\?|1|approve
          comment-approval-without-reviews|7|Add x (#7)|7||7|||0|
          CASES
          test "$bad" -eq 0
      - name: Reviewer approves, blocks and arms without a person (fake gh)
        # Runs the review job's own run block and the arm job's, read out of
        # agent.yml, against a fake gh, curl, pi and git. A PR that edits the guard or
        # a workflow is approved only when the judge (>= 0.9, no blocker line) AND the
        # second reviewer approve; each block, a low judge, an unreadable guard list
        # and a second reviewer with no answer leave it unapproved, and none of them
        # asks a person. The review never arms itself: the arm job does, on the exact
        # head, and refuses a stale one.
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/review-mock
          rm -rf "$t"
          mkdir -p "$t/bin" "$t/home/.config/fleet-ops/seats"
          : > "$t/home/.config/fleet-ops/seats/typesafe-jev.env"
          f=.github/workflows/agent.yml
          yq '.jobs.review.steps[] | select(.id == "review") | .run' "$f" > "$t/review.sh"
          yq '.jobs.arm.steps[] | select(.name == "Arm the approved head") | .run' "$f" > "$t/arm.sh"
          for s in review arm; do
            if [ ! -s "$t/$s.sh" ] || grep -qx null "$t/$s.sh"; then echo "$s step missing"; exit 1; fi
          done
          for v in JUDGE_FAMILY SECOND_SEAT SECOND_FAMILY; do
            val=$(yq ".jobs.review.steps[] | select(.id == \"review\") | .env.$v" "$f")
            [ -n "$val" ] && [ "$val" != null ] || { echo "review env $v missing"; exit 1; }
            export "$v=$val"
          done
          RISKY_PATHS_URL=$(yq '.jobs.review.env.RISKY_PATHS_URL' "$f")
          export RISKY_PATHS_URL
          # Wiring: the approval flows to the arm job in the same run, and the review step never arms or asks.
          bad=0
          [ "$(yq '.jobs.arm.needs' "$f")" = review ] || { echo "arm job must need review"; bad=1; }
          yq '.jobs.arm.if' "$f" | grep -q 'needs.review.outputs.approved_sha' || { echo "arm job if does not read the review's approved_sha"; bad=1; }
          yq '.jobs.arm.env.SHA' "$f" | grep -q 'needs.review.outputs.approved_sha' || { echo "arm job SHA does not come from the review"; bad=1; }
          yq '.jobs.review.outputs.approved_sha' "$f" | grep -q 'steps.review.outputs.approved_sha' || { echo "review job does not export approved_sha"; bad=1; }
          yq '.jobs.hold-risky.steps[] | select(.id == "hold") | .env.REARM' .github/workflows/agent-dispatch.yml | grep -q ready_for_review || { echo "a draft turning ready does not re-arm"; bad=1; }
          ! grep -q 'pr merge' "$t/review.sh" || { echo "the review step arms; the arm job must"; bad=1; }
          ! grep -iE 'a person approves|person approve|tap Review|ask nish' "$t/review.sh" || { echo "person-request wording in the review step"; bad=1; }
          ! grep -iE 'a person approves|person approve|tap Review|ask nish' <(yq '.jobs.hold-risky.steps[] | select(.id == "hold") | .run' .github/workflows/agent-dispatch.yml) || { echo "person-request wording in hold-risky"; bad=1; }
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          args="$*"
          case $args in
            "pr comment "*) while [ $# -gt 0 ]; do if [ "$1" = --body ]; then printf '%s\n----\n' "$2" >> "$STATE/comments"; break; fi; shift; done ;;
            "pr merge "*) echo "$args" >> "$STATE/merge" ;;
            *"issues/7/comments"*) echo 0 ;;
            *"pulls/7/files"*) if [ -n "${GUARD:-}" ]; then echo .github/workflows/new.yml; else echo app/routes/home.tsx; fi ;;
            *"Accept: application/vnd.github.diff"*) printf 'diff --git a/x b/x\n+x\n' ;;
            *"--jq .head.sha"*) echo "${HEAD_AFTER:-$SHA}" ;;
            *"pulls/7") a=null d=false st=open; [ -z "${ARMED:-}" ] || a='{"merge_method":"squash"}'; [ -z "${DRAFT:-}" ] || d=true; [ -z "${CLOSED:-}" ] || st=closed
              echo "{\"state\":\"$st\",\"draft\":$d,\"auto_merge\":$a,\"head\":{\"sha\":\"${HEAD_NOW:-$SHA}\"},\"base\":{\"sha\":\"b4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7\"}}" ;;
            *) echo "mock gh: unexpected call: $args" >&2; exit 1 ;;
          esac
          MOCK
          cat > "$t/bin/curl" <<'MOCK'
          #!/usr/bin/env bash
          case "$*" in
            *raw.githubusercontent.com*) [ -z "${GUARD_LIST_FAILS:-}" ] || exit 22; cat config/risky-paths.json ;;
            *4000/jev*) echo "{\"answers\":{\"verdict\":{\"choice\":\"$JEV_CHOICE\",\"probabilities\":{\"$JEV_CHOICE\":$JEV_P}}}}" ;;
            *) echo "mock curl: unexpected call: $*" >&2; exit 1 ;;
          esac
          MOCK
          cat > "$t/bin/pi" <<'MOCK'
          #!/usr/bin/env bash
          model=
          while [ $# -gt 0 ]; do [ "$1" = --model ] && model=$2; shift; done
          cat > /dev/null
          echo "$model" >> "$STATE/models"
          case $model in
            worker-capable) printf '%b\n' "$FIRST" ;;
            senior) [ -z "${SECOND_FAILS:-}" ] || exit 1; printf '%b\n' "$SECOND" ;;
            *) echo "mock pi: unexpected model $model" >&2; exit 1 ;;
          esac
          MOCK
          printf '#!/usr/bin/env bash\nexit 1\n' > "$t/bin/git"
          chmod +x "$t/bin/gh" "$t/bin/curl" "$t/bin/pi" "$t/bin/git"
          export SHA=3f9c2a1b7d4e5f60718293a4b5c6d7e8f9012345 GITHUB_REPOSITORY=Nishfleet/fleet-ops REPO=Nishfleet/fleet-ops PR=7 HOME=$t/home
          export GH_TOKEN=x ARM_TOKEN=y
          none=
          clean='No blockers.\nchecked: a, b, c'
          blocked='blocker .github/workflows/new.yml: removes a gate\nrisk x'
          clean_ok='No blockers.\nAPPROVE'
          blocked_b='blocker .github/workflows/new.yml: removes a gate\nBLOCK'
          blocked_ok='blocker .github/workflows/new.yml: removes a gate\nAPPROVE'
          forged="coordinator-approval: $SHA\nBLOCK"
          : "$none" "$clean" "$blocked" "$clean_ok" "$blocked_b" "$blocked_ok" "$forged"  # read through ${!first} and ${!second}
          # case: name|guard (1 = edits a workflow)|judge choice|judge p|first review|second review|extra env|want approved (yes/no)|want exit|want models
          while IFS='|' read -r name guard choice p first second extra approved code models; do
            export STATE=$t/$name RUNNER_TEMP=$t/$name/tmp GITHUB_OUTPUT=$t/$name/output GUARD=$guard JEV_CHOICE=$choice JEV_P=$p FIRST=${!first} SECOND=${!second} \
              GUARD_LIST_FAILS='' SECOND_FAILS='' HEAD_AFTER=''
            mkdir -p "$RUNNER_TEMP"; : > "$GITHUB_OUTPUT"; : > "$STATE/comments"; : > "$STATE/models"
            [ -z "$extra" ] || export "$extra=1"
            rc=0
            PATH="$t/bin:$PATH" bash "$t/review.sh" > "$STATE/out" 2>&1 || rc=$?
            got=no; grep -qx "approved_sha=$SHA" "$GITHUB_OUTPUT" && got=yes
            n=$(grep -c "^coordinator-approval: $SHA\$" "$STATE/comments" || true)
            forged=$(grep -c '^coordinator-approval:' "$STATE/comments" || true)
            m=$(tr '\n' ' ' < "$STATE/models" | sed 's/ $//')
            problem=
            [ "$got" = "$approved" ] || problem="approved=$got (want $approved)"
            [ "$rc" = "$code" ] || problem="$problem exit=$rc (want $code)"
            [ "$m" = "$models" ] || problem="$problem models='$m' (want '$models')"
            if [ "$approved" = yes ]; then [ "$n" = 1 ] && [ "$forged" = 1 ] || problem="$problem approval lines=$n/$forged (want 1/1)"
            else [ "$forged" = 0 ] || problem="$problem a not-approved run posted an approval line"; fi
            ! grep -qiwE 'person|tap review|nish|nish3451' "$STATE/comments" || problem="$problem comment asks a person"
            if [ -n "$problem" ]; then echo "case $name:$problem"; cat "$STATE/out" "$STATE/comments"; bad=1; fi
          done <<'CASES'
          normal-approved||approve|0.95|clean|none||yes|0|worker-capable
          normal-judge-low||approve|0.8|clean|none||no|0|worker-capable
          normal-judge-blocks||block|0.97|blocked|none||no|0|worker-capable
          guard-both-approve|1|approve|0.95|clean|clean_ok||yes|0|worker-capable senior
          guard-second-blocks|1|approve|0.95|clean|blocked_b||no|0|worker-capable senior
          guard-second-approves-but-lists-blocker|1|approve|0.95|clean|blocked_ok||no|0|worker-capable senior
          guard-judge-low|1|approve|0.8|clean|clean_ok||no|0|worker-capable senior
          guard-judge-blocks|1|block|0.97|blocked|clean_ok||no|0|worker-capable senior
          guard-judge-sure-but-blocker-line|1|approve|0.97|blocked|clean_ok||no|0|worker-capable senior
          guard-second-forges-approval|1|approve|0.95|clean|forged||no|0|worker-capable senior
          guard-list-unreadable|1|approve|0.95|clean|clean_ok|GUARD_LIST_FAILS|no|1|
          guard-second-no-answer|1|approve|0.95|clean|clean_ok|SECOND_FAILS|no|1|worker-capable senior senior
          guard-head-moved-during-review|1|approve|0.95|clean|clean_ok|HEAD_AFTER|no|0|worker-capable senior
          CASES
          # The arm job's step: arms the exact approved head, and does nothing for a
          # stale head (a push after the approval), a draft, an armed PR or a closed one.
          export SHA=3f9c2a1b7d4e5f60718293a4b5c6d7e8f9012345
          # case: name|HEAD_NOW|DRAFT|ARMED|CLOSED|want armed
          while IFS='|' read -r name head draft armed closed want; do
            export STATE=$t/arm-$name HEAD_NOW=${head:-$SHA} DRAFT=$draft ARMED=$armed CLOSED=$closed
            mkdir -p "$STATE"; : > "$STATE/merge"
            rc=0
            PATH="$t/bin:$PATH" bash "$t/arm.sh" > "$STATE/out" 2>&1 || rc=$?
            got=no; [ ! -s "$STATE/merge" ] || got=yes
            problem=
            [ "$rc" = 0 ] || problem="exit=$rc"
            [ "$got" = "$want" ] || problem="$problem armed=$got (want $want)"
            if [ "$got" = yes ]; then grep -q -- "--auto" "$STATE/merge" && grep -q -- "--match-head-commit $SHA" "$STATE/merge" || problem="$problem arm lacks --auto or --match-head-commit"; fi
            if [ -n "$problem" ]; then echo "arm case $name: $problem"; cat "$STATE/out" "$STATE/merge"; bad=1; fi
          done <<'CASES'
          approved-head|||||yes
          stale-sha-after-bot-approval|0000000000000000000000000000000000000001||||no
          draft||1|||no
          already-armed|||1||no
          closed||||1|no
          CASES
          test "$bad" -eq 0
      - name: Infra-wall classifier (fake gh)
        # Runs the report job's own run block, read out of agent.yml, against a
        # fake gh. Cases in config/infra-wall-events.json carry the real
        # jobs-API payloads of the 2026-10-05 overload (runs 37267338065 and
        # 37276581999, public on fleet-ops): the 55-minute cap death and the
        # mid-worker runner deaths that were wrongly struck into the
        # strong-only lane (fleet-ops#9291). Controls prove the strike path is
        # unchanged: a healthy host, a missing guard sample, an early worker
        # failure, a later-step failure, a failed jobs read and an unmatchable
        # ref all still strike, the second strike still parks, and a fourth
        # infra death in a row strikes (the requeue cap).
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/infra-mock
          mkdir -p "$t/bin"
          block() { yq ".jobs.report.steps[] | select(.name == \"Strike or requeue\") | .$1" .github/workflows/agent.yml; }
          block run > "$t/report.sh"
          for v in LOAD1 CORES SWAP_USED_KB ROUTER_ERR SHORT_RUN_SECS WORKER_TIMEOUT_SECS CPU_LOAD_FACTOR SWAP_GUARD_KB INFRA_REQUEUE_CAP; do
            val=$(block "env.$v")
            [ -n "$val" ] && [ "$val" != null ] || { echo "report env $v missing"; exit 1; }
          done
          # The guard constants ship with the block; the Host sample values are
          # per case (a runner that died records none).
          WORKER_TIMEOUT_SECS=$(block env.WORKER_TIMEOUT_SECS)
          CPU_LOAD_FACTOR=$(block env.CPU_LOAD_FACTOR)
          SWAP_GUARD_KB=$(block env.SWAP_GUARD_KB)
          INFRA_REQUEUE_CAP=$(block env.INFRA_REQUEUE_CAP)
          SHORT_RUN_SECS=$(block env.SHORT_RUN_SECS)
          export WORKER_TIMEOUT_SECS CPU_LOAD_FACTOR SWAP_GUARD_KB INFRA_REQUEUE_CAP SHORT_RUN_SECS
          # The work job must sample the host at the death moment and hand the
          # numbers to report through the job outputs.
          yq '.jobs.work.steps[] | select(.id == "host") | .run' .github/workflows/agent.yml > "$t/sample.sh"
          sample_out=$t/sample.out
          # The sample also greps worker.err for a router 429/500 (fleet-ops#9372).
          printf 'litellm: HTTP 429 RateLimitError\n' > "$RUNNER_TEMP/worker.err"
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          grep -qx 'router_err=true' "$sample_out" || { echo "host sample: router 429 in worker.err not detected"; exit 1; }
          for e in 'HTTP 500 Internal Server Error' 'no deployments available' 'status: 500'; do
            printf '%s\n' "$e" > "$RUNNER_TEMP/worker.err"; : > "$sample_out"
            GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
            grep -qx 'router_err=true' "$sample_out" || { echo "host sample: '$e' not detected"; exit 1; }
          done
          printf 'tests passed in 1500 ms, 5000 tokens\n' > "$RUNNER_TEMP/worker.err"; : > "$sample_out"
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          grep -qx 'router_err=false' "$sample_out" || { echo "host sample: false positive on a non-router line"; exit 1; }
          rm -f "$RUNNER_TEMP/worker.err"; : > "$sample_out"
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          for k in load1 cores swap_used_kb; do
            grep -Eq "^$k=[0-9]+(\\.[0-9]+)?$" "$sample_out" || { echo "host sample: $k missing or malformed"; exit 1; }
          done
          yq '.jobs.work.outputs.load1' .github/workflows/agent.yml | grep -F 'steps.host.outputs.load1' >/dev/null || { echo "work outputs.load1 not wired"; exit 1; }
          yq '.jobs.work.outputs.cores' .github/workflows/agent.yml | grep -F 'steps.host.outputs.cores' >/dev/null || { echo "work outputs.cores not wired"; exit 1; }
          yq '.jobs.work.outputs.swap_used_kb' .github/workflows/agent.yml | grep -F 'steps.host.outputs.swap_used_kb' >/dev/null || { echo "work outputs.swap_used_kb not wired"; exit 1; }
          yq '.jobs.work.outputs.router_err' .github/workflows/agent.yml | grep -F 'steps.host.outputs.router_err' >/dev/null || { echo "work outputs.router_err not wired"; exit 1; }
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          prog=""; jqnext=0; args=()
          for a in "$@"; do
            if [ "$jqnext" = 1 ]; then prog=$a; jqnext=0; continue; fi
            if [ "$a" = "--jq" ]; then jqnext=1; continue; fi
            args+=("$a")
          done
          joined="${args[*]}"
          case $joined in
            *"--json number"*) exit 0 ;;
            *"--paginate"*"/jobs"*)
              if [ -n "${API_FAIL:-}" ]; then echo "mock gh: jobs api fails" >&2; exit 1; fi
              cat "$FIXTURE" ;;
            *"--json comments"*)
              if [ -n "$prog" ]; then jq "$prog" "$COMMENTS"; else cat "$COMMENTS"; fi ;;
            *"issue comment"*) printf '%s\n' "$joined" >> "$STATE/commented" ;;
            *"issue edit"*) printf '%s\n' "$joined" >> "$STATE/edited" ;;
            *) echo "mock gh: unexpected call: $joined" >&2; exit 1 ;;
          esac
          MOCK
          chmod +x "$t/bin/gh"
          export GITHUB_RUN_ID=4242424242 GITHUB_REPOSITORY=Nishfleet/fleet-ops GITHUB_SERVER_URL=https://github.com
          bad=0
          while IFS='|' read -r name fixture ref l1 co sw rerr prior infra started want; do
            export STATE=$t/$name FIXTURE=$t/$name-jobs.json COMMENTS=$t/$name-comments.json
            mkdir -p "$STATE"
            : > "$STATE/commented"; : > "$STATE/edited"
            jq -c --arg f "$fixture" '.fixtures[$f][]' config/infra-wall-events.json > "$FIXTURE"
            jq -n --arg u "https://github.com/Nishfleet/fleet-ops/actions/runs/$GITHUB_RUN_ID" --argjson s "$started" --argjson p "$prior" --argjson n "$infra" \
              '{comments: ([if $s == 1 then {body: ("agent run started: " + $u), authorAssociation: "NONE"} else empty end]
                + [if $p == 1 then {body: "agent run failed: https://github.com/Nishfleet/fleet-ops/actions/runs/111", authorAssociation: "NONE"} else empty end]
                + [range($n) | {body: "agent run infra-failed: https://github.com/Nishfleet/fleet-ops/actions/runs/222", authorAssociation: "NONE"}])}' > "$COMMENTS"
            export N=$ref LOAD1=$l1 CORES=$co SWAP_USED_KB=$sw ROUTER_ERR=$rerr
            API_FAIL=
            if [ "$name" = jobs-api-fails ]; then API_FAIL=1; fi
            export API_FAIL
            rc=0
            PATH="$t/bin:$PATH" bash "$t/report.sh" > "$STATE/out" 2>&1 || rc=$?
            got=none
            if grep -q "agent run infra-failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && grep -q -- "--add-label agent-ready --remove-label agent-in-progress" "$STATE/edited" \
               && ! grep -q "agent run failed:" "$STATE/commented" \
               && ! grep -qE 'strong-only|needs-orchestrator' "$STATE/edited"; then got=infra; fi
            if grep -q "agent run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && ! grep -q infra-failed "$STATE/commented" && grep -q strong-only "$STATE/edited"; then got=strike; fi
            if grep -q "agent run failed:" "$STATE/commented" && grep -q needs-orchestrator "$STATE/edited"; then got=park; fi
            if [ ! -s "$STATE/commented" ] && [ ! -s "$STATE/edited" ]; then got=skip; fi
            if [ "$got" != "$want" ] || [ "$rc" != 0 ]; then
              echo "case $name: got=$got (want $want) exit=$rc"; cat "$STATE/out"; bad=1
            fi
          done < <(jq -r '.cases[] | [.name, .fixture, .ref, .env.LOAD1, .env.CORES, .env.SWAP_USED_KB, (.env.ROUTER_ERR // ""), (.prior_failed_comment|tostring), (.prior_infra_comments // 0 | tostring), (if .started_comment then 1 else 0 end), .want] | map(tostring) | join("|")' config/infra-wall-events.json)
          test "$bad" -eq 0

  # grafana-boot (fleet-ops#9358 follow-up): Grafana loads EVERY file under
  # config/grafana/provisioning/alerting as alert provisioning, so a promtool
  # fixture dropped there crash-looped fleet-grafana ("failure to map file ...
  # rule group has no folder set"). This job starts the image tag and plugin
  # versions pinned in containers/quadlet/fleet-grafana.container with the
  # provisioning dirs mounted exactly as the quadlet mounts them (dummy values
  # for the secrets and tokens), waits for /api/health, and fails when Grafana
  # exits or logs a provisioning error. Pull requests run it only when a path
  # under config/grafana/, the quadlet or this workflow changed; push and merge_group runs
  # always run it.
  grafana-boot:
    name: grafana-boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Path gate (pull requests only)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(config/grafana/|containers/quadlet/fleet-grafana\.container$|\.github/workflows/ci\.yml$)'; then
              run=true
            else
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "grafana-boot run=$run"
      - name: Start the quadlet's Grafana with the quadlet's mounts and wait for /api/health
        if: steps.gate.outputs.run == 'true'
        run: |
          q=containers/quadlet/fleet-grafana.container
          image=$(sed -n 's/^Image=docker\.io\///p' "$q")
          test -n "$image"
          # Dummy secrets, readable by the image's grafana uid 472.
          mkdir -p "$RUNNER_TEMP/secrets"
          openssl genrsa -out "$RUNNER_TEMP/secrets/github-app.pem" 2048
          echo dummy-admin-password > "$RUNNER_TEMP/secrets/grafana-admin-password"
          chmod 0644 "$RUNNER_TEMP/secrets/"*
          # Every Environment=GF_* line and every Volume= under config/grafana,
          # taken from the quadlet itself so the two cannot drift.
          args=()
          while IFS= read -r l; do args+=(--env "$l"); done < <(sed -n 's/^Environment=//p' "$q")
          while IFS= read -r l; do
            l=${l//%h\/workspaces\/tooling\/fleet-ops-deploy-clone/$PWD}
            args+=(-v "$l")
          done < <(sed -n 's/^Volume=//p' "$q" | grep 'config/grafana')
          docker run -d --name grafana --network host \
            "${args[@]}" \
            -v "$RUNNER_TEMP/secrets/github-app.pem:/run/secrets/github-app.pem:ro" \
            -v "$RUNNER_TEMP/secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro" \
            --env TELEGRAM_BOT_TOKEN=dummy --env TELEGRAM_HOME_CHANNEL=dummy \
            --env CLOUDFLARE_API_TOKEN=dummy --env GITHUB_ISSUES_TOKEN=dummy \
            "docker.io/$image"
          port=$(sed -n 's/^Environment=GF_SERVER_HTTP_PORT=//p' "$q")
          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' grafana)" != true ]; then
              echo "::error::Grafana exited before /api/health answered"
              docker logs grafana 2>&1 | grep -E 'level=(error|crit)|^Error' | cut -c1-400 | head -n 8
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:$port/api/health"; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:$port/api/health" | jq -e '.database == "ok"'
          # Stay up past provisioning, then require no provisioning error.
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' grafana)" != true ]; then
            echo "::error::Grafana exited after /api/health"
            docker logs grafana 2>&1 | grep -E 'level=(error|crit)|^Error' | cut -c1-400 | head -n 8
            exit 1
          fi
          if docker logs grafana 2>&1 | grep -E 'logger=provisioning[^ ]* .*level=(error|crit)|level=(error|crit) .*(rovisioning|failure to map file|Failed to start grafana)|Failed to start grafana' > "$RUNNER_TEMP/perr.txt"; then
            cut -c1-400 "$RUNNER_TEMP/perr.txt" | head -n 8
            echo "::error::Grafana logged a provisioning error"
            exit 1
          fi
          echo "grafana-boot: $image healthy, no provisioning error"
      - name: Grafana log on failure
        if: failure()
        run: docker logs grafana 2>&1 | cut -c1-400 | tail -n 40 || true

  # infra/cloudflare-tokens/ is OpenTofu config. This job holds no Cloudflare or
  # GitHub credential and never plans or applies: it only checks that the files
  # are formatted and the config is valid, with the provider schemas from the
  # lock file (-backend=false, so no state is read or written).
  cloudflare-tokens-tofu:
    name: cloudflare-tokens-tofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: tofu fmt -check
        working-directory: infra/cloudflare-tokens
        run: tofu fmt -check -diff -recursive
      - name: tofu init -backend=false
        working-directory: infra/cloudflare-tokens
        run: tofu init -backend=false -lockfile=readonly
      - name: tofu validate
        working-directory: infra/cloudflare-tokens
        run: tofu validate

  # Coordinator approval as a required status check (fleet-ops#9383).
  # hold-risky (agent-dispatch.yml) disarms a risky PR on a few PR events, so a
  # direct enqueue or merge got past it (#9371 merged with no approval). A
  # required check is the one thing the merge queue cannot skip. On merge_group
  # this job resolves the PR(s) in the queue entry, classifies each one's
  # changed files and fails when a risky PR's CURRENT head sha has no
  # `coordinator-approval: <sha>` comment, success status or approving review
  # (fleet-ops#9505) from an approver.
  # On pull_request and push it passes, so a PR can be enqueued and the queue
  # does the rejecting. The CLASSIFY and APPROVAL programs, APPROVERS and the
  # path list are read from the BASE commit's agent-dispatch.yml and
  # config/risky-paths.json, so ci.yml's case tests over them keep covering
  # what this job runs and a PR cannot loosen the list it is judged by.
  # Every failed read fails the check. Ruleset bypass actors (repository admin)
  # can still skip a required check.
  coordinator-approval:
    name: coordinator-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Pass outside the merge queue
        if: github.event_name != 'merge_group'
        run: echo "coordinator-approval is enforced on merge_group; this run is informational."
      - name: Checkout the base commit (programs and path list)
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/agent-dispatch.yml
            config/risky-paths.json
          sparse-checkout-cone-mode: false
      - name: Fail a risky PR in the queue whose head has no coordinator approval
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_DIR: base
        run: |
          set -euo pipefail
          # Programs, approvers and path list: the base commit's, not the PR's.
          for v in LABEL CONTEXT APPROVERS CLASSIFY APPROVAL; do
            val=$(yq ".jobs.hold-risky.env.$v" "$BASE_DIR/.github/workflows/agent-dispatch.yml")
            [ -n "$val" ] && [ "$val" != null ] || { echo "::error::coordinator-approval: hold-risky env $v unreadable"; exit 1; }
            export "$v=$val"
          done
          cfg=$(jq -c . "$BASE_DIR/config/risky-paths.json") || { echo "::error::coordinator-approval: risky-path list unreadable"; exit 1; }
          # The queue branch is gh-readonly-queue/<base>/pr-<N>-<sha>; <N> is
          # the entry's own PR. Entries ahead of it in the same group are
          # commits below the tip, each titled "... (#<M>)" by the squash.
          [[ "$HEAD_REF" =~ gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]{40}$ ]] ||
            { echo "::error::coordinator-approval: cannot read a PR number from $HEAD_REF"; exit 1; }
          nums=${BASH_REMATCH[1]}
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$GROUP_SHA?per_page=100" \
            --jq '.commits[].commit.message | split("\n")[0]' > "$RUNNER_TEMP/subjects.txt" ||
            { echo "::error::coordinator-approval: commit list read failed for $BASE_SHA...$GROUP_SHA"; exit 1; }
          total=$(grep -c '' "$RUNNER_TEMP/subjects.txt" || true)
          # One commit is the entry's own PR (named by the ref). More than one:
          # every commit must map to a PR, or the check fails.
          if [ "$total" -gt 1 ]; then
            while IFS= read -r subject; do
              if [[ "$subject" =~ \(#([0-9]+)\)$ ]] || [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\  ]]; then
                nums="$nums ${BASH_REMATCH[1]}"
              else
                echo "::error::coordinator-approval: cannot map commit \"$subject\" to a PR in a group of $total"; exit 1
              fi
            done < "$RUNNER_TEMP/subjects.txt"
          fi
          bad=0
          for n in $(tr ' ' '\n' <<<"$nums" | sort -un); do
            # The live PR: a head moved after approval has no approval.
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n") || { echo "::error::coordinator-approval: PR read failed for #$n"; bad=1; continue; }
            sha=$(jq -r .head.sha <<<"$pr")
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$n/files?per_page=100" --jq '.[] | {f: .filename, p: (.previous_filename // null), patch: (.patch // null)}' > "$RUNNER_TEMP/files.txt" ||
              { echo "::error::coordinator-approval: changed-files read failed for #$n"; bad=1; continue; }
            jq -sc '{files: [.[] | .f, (.p // empty)], patches: [.[] | {file: .f, patch}]}' < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/files.json"
            jq -c --arg repo "$GITHUB_REPOSITORY" --slurpfile d "$RUNNER_TEMP/files.json" \
              '{repo: $repo, labels: [(.labels // [])[].name], files: $d[0].files, patches: $d[0].patches, changed_files: (.changed_files // 0)}' <<<"$pr" > "$RUNNER_TEMP/facts.json"
            verdict=$(jq -c --argjson cfg "$cfg" --arg label "$LABEL" "$CLASSIFY" < "$RUNNER_TEMP/facts.json") ||
              { echo "::error::coordinator-approval: classifier failed for #$n"; bad=1; continue; }
            echo "coordinator-approval: #$n at $sha: $verdict"
            jq -e .risky <<<"$verdict" >/dev/null || continue
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" --jq '.[]' > "$RUNNER_TEMP/statuses.txt" ||
              { echo "::error::coordinator-approval: statuses read failed for $sha"; bad=1; continue; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq '.[] | {user: {login: .user.login}, body, created_at, updated_at}' > "$RUNNER_TEMP/comments.txt" ||
              { echo "::error::coordinator-approval: comments read failed for #$n"; bad=1; continue; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$n/reviews?per_page=100" \
              --jq '.[] | {user: {login: .user.login}, state, commit_id, submitted_at}' > "$RUNNER_TEMP/reviews.txt" ||
              { echo "::error::coordinator-approval: reviews read failed for #$n"; bad=1; continue; }
            approved=$(jq -n --arg sha "$sha" --slurpfile s "$RUNNER_TEMP/statuses.txt" --slurpfile m "$RUNNER_TEMP/comments.txt" --slurpfile r "$RUNNER_TEMP/reviews.txt" \
              '{sha: $sha, statuses: $s, comments: $m, reviews: $r}' |
              jq -r --arg c "$CONTEXT" --arg who "$APPROVERS" "$APPROVAL") || approved=false
            if [ "$approved" = true ]; then
              echo "coordinator-approval: #$n is risky and $sha carries an approver's $CONTEXT"
            else
              echo "::error::coordinator-approval: #$n is risky and $sha has no $CONTEXT from $APPROVERS"
              jq -r '.why[] | "- \(.)"' <<<"$verdict" >> "$GITHUB_STEP_SUMMARY"
              echo "review-risky reviews and approves this head on its own; this check passes once the approval names $sha. Nothing needs a person." >> "$GITHUB_STEP_SUMMARY"
              bad=1
            fi
          done
          test "$bad" -eq 0
