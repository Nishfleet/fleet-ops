name: CI
# Every job names the incident or rule that keeps it (owner, fleet-ops#10935,
# 2026-11-01: "failures should be unacceptable"). No job reads anything outside
# the PR. Hosted runners only. Secret scanning and push protection are GitHub's
# own, enabled on the repo (leaked tokens, fleet-ops#9578 and #8771); no job here.
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Tools (ansible-core for the host play, systemd for unit files)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ansible-core systemd >/dev/null
      - name: The host play parses (it is the deploy; a broken play breaks the box)
        run: ansible-playbook --syntax-check -i localhost, ansible/host.yml
      - uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1, fail-open tasks (#11636)
      - name: Unit files verify (three merges broke the box in one night, 2026-10-29)
        shell: bash
        run: |
          shopt -s nullglob
          # Host-only binaries the units name; a stub is enough for verify.
          for b in /home/nish/.local/bin/pi /home/nish/.local/bin/tincan /home/nish/.local/bin/claude /home/nish/.hermes/hermes-agent/.hermes/bin/hermes /home/runner/.local/bin/tofu /opt/node-v22.23.3/bin/node /usr/bin/restic /usr/bin/rootlesskit /usr/bin/syncthing /usr/bin/tigervncserver /var/lib/fleet-runner/test_instance/runsvc.sh /var/lib/fleet-reviewer/test_instance/bin/runsvc.sh; do sudo install -D -m755 /bin/true "$b"; done; sudo chown -R "$USER" "$HOME/.local"
          systemd-analyze verify --man=no systemd/*.service systemd/*.timer systemd/*.path rootfs/etc/systemd/system/*.service rootfs/etc/systemd/system/*.timer rootfs/etc/systemd/user/*.service rootfs/etc/systemd/user/*.timer
      - name: Python lint (fleet-ops#11692)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with: {version: "0.17.3"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Tests under tests/, found by pytest (fleet-ops#10721)
        run: |
          pip install -q pytest==8.3.5 pyyaml jsonschema httpx jinja2 litellm==1.105.0
          pytest -q -p no:cacheprovider tests
      - name: Alert rules, routes and rule tests (nothing ran them, 2026-11-03; images = box versions)
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint sh prom/prometheus:v2.45.3@sha256:1534519c0a215a47840bfa09991b6262fb302989b734fc1073b2844445b04313 -c 'promtool check rules rootfs/etc/prometheus/*_rules.yml && promtool test rules config/prometheus-tests/*.test.yml'
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint amtool prom/alertmanager:v0.26.0@sha256:361db356b33041437517f1cd298462055580585f26555c317df1a3caf2868552 check-config rootfs/etc/alertmanager/alertmanager.yml
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1, workflow security (#8457, #11686)
        with: {advanced-security: false, version: 1.32.0}
      - name: Workflow files lint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
