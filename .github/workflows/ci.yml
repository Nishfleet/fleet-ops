      - name: Infra-wall classifier (fake gh)
        # Runs the work job's own `Strike or requeue` run block, read out of agent.yml,
        # against a fake gh. Cases in config/infra-wall-events.json carry the real Worker
        # times of the 2026-10-05 overload (runs 37267338065 and 37276581999): the 55-minute
        # cap death that was wrongly struck (fleet-ops#9291). Controls: a healthy host, a
        # missing guard sample, an early failure and a later-step failure still strike, the
        # second strike still parks, and a fourth infra death in a row strikes (requeue cap). A plain cap death on pi is infra (#9955).
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/infra-mock
          mkdir -p "$t/bin"
          f=.github/workflows/agent.yml
          [ "$(yq '.jobs.report' "$f")" = null ] || { echo "a separate report job is back: the strike must run in the work job"; exit 1; }
          block() { yq ".jobs.work.steps[] | select(.name == \"Strike or requeue\") | .$1" "$f"; }
          block run > "$t/report.sh"
          [ -s "$t/report.sh" ] || { echo "work job has no Strike or requeue step"; exit 1; }
          # Both strike steps run on a failed or cancelled job, never on a
          # Router wall (that one is already requeued), and mint their own token.
          for sel in '.name == "App token for strike"' '.name == "Strike or requeue"'; do
            cond=$(yq ".jobs.work.steps[] | select($sel) | .if" "$f")
            for need in 'failure() || cancelled()' "steps.wall.outputs.wall != 'true'"; do
              grep -qF -- "$need" <<<"$cond" || { echo "step ($sel) lacks: $need"; exit 1; }
            done
          done
          for v in WORKER_OUTCOME STARTED ENDED LOAD1 CORES SWAP_USED_KB ROUTER_ERR ENGINE SHORT_RUN_SECS WORKER_TIMEOUT_SECS CPU_LOAD_FACTOR SWAP_GUARD_KB INFRA_REQUEUE_CAP; do
            val=$(block "env.$v")
            [ -n "$val" ] && [ "$val" != null ] || { echo "strike env $v missing"; exit 1; }
          done
          # The guard constants ship with the block; the Worker outcome, clock
          # and Host sample values are per case.
          WORKER_TIMEOUT_SECS=$(block env.WORKER_TIMEOUT_SECS)
          CPU_LOAD_FACTOR=$(block env.CPU_LOAD_FACTOR)
          SWAP_GUARD_KB=$(block env.SWAP_GUARD_KB)
          INFRA_REQUEUE_CAP=$(block env.INFRA_REQUEUE_CAP)
          SHORT_RUN_SECS=$(block env.SHORT_RUN_SECS)
          export WORKER_TIMEOUT_SECS CPU_LOAD_FACTOR SWAP_GUARD_KB INFRA_REQUEUE_CAP SHORT_RUN_SECS
          # The classifier reads the Worker step's own outcome and two clocks,
          # not the jobs API (the job conclusion is still null while the job runs).
          block env.WORKER_OUTCOME | grep -qF 'steps.worker.outcome' || { echo "WORKER_OUTCOME not wired to steps.worker.outcome"; exit 1; }
          [ "$(yq '.jobs.work.steps[] | select(.id == "worker") | .name' "$f")" = Worker ] || { echo "Worker step lost its id"; exit 1; }
          yq '.jobs.work.steps[] | select(.id == "clock") | .run' "$f" > "$t/clock.sh"
          clock_out=$t/clock.out
          GITHUB_OUTPUT="$clock_out" bash "$t/clock.sh"
          grep -Eq '^started=[0-9]+$' "$clock_out" || { echo "Worker clock: started missing or malformed"; exit 1; }
          block env.STARTED | grep -qF 'steps.clock.outputs.started' || { echo "STARTED not wired to the Worker clock"; exit 1; }
          # The work job must sample the host at the death moment.
          yq '.jobs.work.steps[] | select(.id == "host") | .run' "$f" > "$t/sample.sh"
          sample_out=$t/sample.out
          # The sample also greps worker.err for a router 429/500 (fleet-ops#9372).
          printf 'litellm: HTTP 429 RateLimitError\n' > "$RUNNER_TEMP/worker.err"
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          grep -qx 'router_err=true' "$sample_out" || { echo "host sample: router 429 in worker.err not detected"; exit 1; }
          for e in 'HTTP 500 Internal Server Error' 'no deployments available' 'status: 500'; do
            printf '%s\n' "$e" > "$RUNNER_TEMP/worker.err"; : > "$sample_out"
            GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
            grep -qx 'router_err=true' "$sample_out" || { echo "host sample: '$e' not detected"; exit 1; }
          done
          printf 'tests passed in 1500 ms, 5000 tokens\n' > "$RUNNER_TEMP/worker.err"; : > "$sample_out"
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          grep -qx 'router_err=false' "$sample_out" || { echo "host sample: false positive on a non-router line"; exit 1; }
          rm -f "$RUNNER_TEMP/worker.err"; : > "$sample_out"
          GITHUB_OUTPUT="$sample_out" bash "$t/sample.sh"
          for k in ended load1 cores swap_used_kb; do
            grep -Eq "^$k=[0-9]+(\\.[0-9]+)?$" "$sample_out" || { echo "host sample: $k missing or malformed"; exit 1; }
            block "env.${k^^}" | grep -qF "steps.host.outputs.$k" || { echo "strike env for $k not wired to the Host sample"; exit 1; }
          done
          block env.ROUTER_ERR | grep -qF 'steps.host.outputs.router_err' || { echo "strike env ROUTER_ERR not wired to the Host sample"; exit 1; }
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          prog=""; jqnext=0; args=()
          for a in "$@"; do
            if [ "$jqnext" = 1 ]; then prog=$a; jqnext=0; continue; fi
            if [ "$a" = "--jq" ]; then jqnext=1; continue; fi
            args+=("$a")
          done
          joined="${args[*]}"
          case $joined in
            *"--json number"*) exit 0 ;;
            *"--json comments"*)
              if [ -n "$prog" ]; then jq "$prog" "$COMMENTS"; else cat "$COMMENTS"; fi ;;
            *"issue comment"*) printf '%s\n' "$joined" >> "$STATE/commented" ;;
            *"issue edit"*) printf '%s\n' "$joined" >> "$STATE/edited" ;;
            *) echo "mock gh: unexpected call: $joined" >&2; exit 1 ;;
          esac
          MOCK
          chmod +x "$t/bin/gh"
          export GITHUB_RUN_ID=4242424242 GITHUB_REPOSITORY=Nishfleet/fleet-ops GITHUB_SERVER_URL=https://github.com
          bad=0
          while IFS='|' read -r name ref outcome started ended l1 co sw rerr engine prior infra started_comment want; do
            export STATE=$t/$name COMMENTS=$t/$name-comments.json
            mkdir -p "$STATE"
            : > "$STATE/commented"; : > "$STATE/edited"
            jq -n --arg u "https://github.com/Nishfleet/fleet-ops/actions/runs/$GITHUB_RUN_ID" --argjson s "$started_comment" --argjson p "$prior" --argjson n "$infra" \
              '{comments: ([if $s == 1 then {body: ("agent run started: " + $u), authorAssociation: "NONE"} else empty end]
                + [if $p == 1 then {body: "agent run failed: https://github.com/Nishfleet/fleet-ops/actions/runs/111", authorAssociation: "NONE"} else empty end]
                + [range($n) | {body: "agent run infra-failed: https://github.com/Nishfleet/fleet-ops/actions/runs/222", authorAssociation: "NONE"}])}' > "$COMMENTS"
            export REF=$ref WORKER_OUTCOME=$outcome STARTED=$started ENDED=$ended LOAD1=$l1 CORES=$co SWAP_USED_KB=$sw ROUTER_ERR=$rerr ENGINE=$engine
            rc=0
            PATH="$t/bin:$PATH" bash "$t/report.sh" > "$STATE/out" 2>&1 || rc=$?
            got=none
            if grep -q "agent run infra-failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && grep -q -- "--add-label agent-ready --remove-label agent-in-progress" "$STATE/edited" \
               && ! grep -q "agent run failed:" "$STATE/commented" \
               && ! grep -qE 'strong-only|needs-orchestrator' "$STATE/edited"; then got=infra; fi
            if grep -q "agent run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && ! grep -q infra-failed "$STATE/commented" && grep -q strong-only "$STATE/edited"; then got=strike; fi
            if grep -q "agent run failed:" "$STATE/commented" && grep -q needs-orchestrator "$STATE/edited"; then got=park; fi
            if [ ! -s "$STATE/commented" ] && [ ! -s "$STATE/edited" ]; then got=skip; fi
            if [ "$got" != "$want" ] || [ "$rc" != 0 ]; then
              echo "case $name: got=$got (want $want) exit=$rc"; cat "$STATE/out"; bad=1
            fi
          done < <(jq -r '.cases[] | [.name, .ref, .env.WORKER_OUTCOME, .env.STARTED, .env.ENDED, .env.LOAD1, .env.CORES, .env.SWAP_USED_KB, (.env.ROUTER_ERR // ""), (.env.ENGINE // "claude"), (.prior_failed_comment|tostring), (.prior_infra_comments // 0 | tostring), (if .started_comment then 1 else 0 end), .want] | map(tostring) | join("|")' config/infra-wall-events.json)
          test "$bad" -eq 0
      - name: Sweep liveness reads the work job (fleet-ops#9275)
        # A run is live only while its `work` job is queued or running, not
        # while the run as a whole reads queued. Runs the RUN_LIVE_JQ filter
        # out of agent-dispatch.yml against the cases in
        # config/sweep-liveness-events.json, and checks that all five sweep
        # reads (conflicts, stalled, orphans, red PRs, stuck rework) use it and none still reads the
        # run status alone.
        if: always()
        run: |
          set -euo pipefail
          f=.github/workflows/agent-dispatch.yml
          filter=$(yq '.env.RUN_LIVE_JQ' "$f")
          [ -n "$filter" ] && [ "$filter" != null ] || { echo "RUN_LIVE_JQ missing from $f"; exit 1; }
          [ "$(grep -cE '^ *rv=\$\(gh run view .*--json status,jobs\)' "$f")" -eq 5 ] || { echo "expected 5 sweep reads of status,jobs"; exit 1; }
          # shellcheck disable=SC2016 # the literal text "$RUN_LIVE_JQ" is the needle
          [ "$(grep -c -- '"$RUN_LIVE_JQ"' "$f")" -eq 5 ] || { echo "expected 5 sweep reads judged by RUN_LIVE_JQ"; exit 1; }
          ! grep -n -- '--json status --jq' "$f" || { echo "a sweep read still judges the run status alone"; exit 1; }
          bad=0
          while IFS= read -r c; do
            name=$(jq -r .name <<<"$c"); want=$(jq -r .want <<<"$c"); ref=$(jq -r .ref <<<"$c")
            got=$(jq -c '{status: .run_status, jobs: [.jobs[] | {name: .[0], status: .[1]}]}' <<<"$c" | jq -r --arg ref "$ref" "$filter")
            [ "$got" = "$want" ] || { echo "case $name: live=$got (want $want)"; bad=1; }
          done < <(jq -c '.cases[]' config/sweep-liveness-events.json)
          test "$bad" -eq 0
      - name: Router wall treats a Cursor stall as infra (fake gh)
        # Runs the Router wall step's own run block, read out of agent.yml, against a fake gh and a
        # worker.err (the Cursor line is the real one, fleet-ops#9275). A stall with the claim branch 0 ahead
        # of main is infra: infra-failed comment, agent-ready, wall=true. With a commit pushed, on another
        # engine, or after 3 infra requeues, it is not a wall and the strike step handles it.
        if: always()
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/wall-mock
          mkdir -p "$t/bin"
          yq '.jobs.work.steps[] | select(.id == "wall") | .run' .github/workflows/agent.yml > "$t/wall.sh"
          [ -s "$t/wall.sh" ] || { echo "Router wall step not found"; exit 1; }
          cat > "$t/bin/gh" <<'MOCK'
          #!/usr/bin/env bash
          case "$*" in
            *"compare/main..."*) echo "$AHEAD"; echo called >> "$STATE/compared" ;;
            *"issue view"*) echo "${PRIOR_INFRA:-0}" ;;
            *"issue comment"*) echo "$*" >> "$STATE/commented" ;;
            *"issue edit"*) echo "$*" >> "$STATE/edited" ;;
            *) echo "mock gh: unexpected call: $*" >&2; exit 1 ;;
          esac
          MOCK
          chmod +x "$t/bin/gh"
          export GITHUB_RUN_ID=4242424242 GITHUB_REPOSITORY=Nishfleet/fleet-ops REPO=Nishfleet/fleet-ops REF=claim/issue-9275 GITHUB_SERVER_URL=https://github.com
          cursor_stall=$'Connection lost, reconnecting to https://agentn.global.api5.cursor.sh (attempt 1)...\nRetry attempt 1...\nRetriableError: Connection stalled repeatedly'
          bad=0
          # name|engine|worker.err|ahead|want wall (yes/no)
          while IFS='|' read -r name engine err ahead want; do
            export STATE=$t/$name AHEAD=$ahead ENGINE=$engine GITHUB_OUTPUT=$t/$name/out PRIOR_INFRA=0
            [ "$name" != cursor-stall-capped ] || PRIOR_INFRA=3
            rm -rf "$STATE"; mkdir -p "$STATE"; : > "$GITHUB_OUTPUT"
            export RUNNER_TEMP=$STATE
            printf '%b\n' "${err//@CURSOR@/$cursor_stall}" > "$RUNNER_TEMP/worker.err"
            rc=0
            PATH="$t/bin:$PATH" bash "$t/wall.sh" > "$STATE/log" 2>&1 || rc=$?
            got=no
            if grep -qx 'wall=true' "$GITHUB_OUTPUT" && grep -q "agent run infra-failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$STATE/commented" \
               && grep -q -- '--add-label agent-ready --remove-label agent-in-progress' "$STATE/edited"; then got=yes; fi
            if [ "$want" = no ] && { [ -s "$STATE/commented" ] || [ -s "$STATE/edited" ]; }; then got=partial; fi
            if [ "$got" != "$want" ] || [ "$rc" != 0 ]; then echo "case $name: wall=$got (want $want) exit=$rc"; cat "$STATE/log"; bad=1; fi
          done <<'CASES'
          cursor-stall-unpushed|cursor|@CURSOR@|0|yes
          cursor-stall-pushed|cursor|@CURSOR@|1|no
          cursor-stall-capped|cursor|@CURSOR@|0|no
          pi-with-cursor-text|pi|@CURSOR@|0|no
          cursor-other-failure|cursor|error: tool call failed|0|no
          cursor-stall-then-429-pushed|cursor|@CURSOR@\nHTTP 429|1|no
          router-429-unpushed|pi|litellm RateLimitError: no deployments available|0|yes
          router-429-pushed|pi|litellm RateLimitError: no deployments available|1|no
          devin-capacity-pushed|devin|capacity issues|1|yes
          CASES
          test "$bad" -eq 0
      - name: Every other job in this workflow gates ci
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Pin: every job except ci and coordinator-approval must be in ci's needs.
          want=$(yq -r '.jobs | keys | .[] | select(. != "ci" and . != "coordinator-approval")' .github/workflows/ci.yml | sort)
          have=$(yq -r '.jobs.ci.needs[]' .github/workflows/ci.yml | sort)
          [ "$want" = "$have" ] || { echo "::error::ci needs ${have//$'\n'/ } but the other jobs are ${want//$'\n'/ }"; exit 1; }
          # Failure and cancelled block; success and skipped pass.
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "::error::needed jobs not green: $bad"; exit 1; }
          echo "ci: needed jobs green: $(jq -r 'keys | join(", ")' <<<"$NEEDS")"

  # grafana-boot (fleet-ops#9358 follow-up): Grafana loads EVERY file under
  # config/grafana/provisioning/alerting as alert provisioning, so a promtool
  # fixture dropped there crash-looped fleet-grafana ("failure to map file ...
  # rule group has no folder set"). This job starts the image tag and plugin
  # versions pinned in containers/quadlet/fleet-grafana.container with the
  # provisioning dirs mounted exactly as the quadlet mounts them (dummy values
  # for the secrets and tokens), waits for /api/health, and fails when Grafana
  # exits or logs a provisioning error. Pull requests run it only when a path
  # under config/grafana/, the quadlet or this workflow changed; push and merge_group runs
  # always run it.
  grafana-boot:
    name: grafana-boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Path gate (pull requests only)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(config/grafana/|containers/quadlet/fleet-grafana\.container$|systemd/fleet-grafana-provisioning\.|systemd/fleet-grafana-github-token\.|tests/test_deploy_failed_(rule|engine)\.py$|\.github/workflows/ci\.yml$)'; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "grafana-boot run=$run"
      - name: Start the quadlet's Grafana with the quadlet's mounts and wait for /api/health
        if: steps.gate.outputs.run == 'true'
        run: |
          q=containers/quadlet/fleet-grafana.container
          image=$(sed -n 's/^Image=docker\.io\///p' "$q")
          test -n "$image"
          # Dummy secrets, readable by the image's grafana uid 472.
          mkdir -p "$RUNNER_TEMP/secrets"
          openssl genrsa -out "$RUNNER_TEMP/secrets/github-app.pem" 2048
          echo dummy-admin-password > "$RUNNER_TEMP/secrets/grafana-admin-password"
          # The contact points read $__file{/run/secrets/github-token/token}; the
          # host mounts the runtime dir fleet-grafana-github-token.service fills.
          mkdir -p "$RUNNER_TEMP/secrets/github-token"
          echo dummy-github-token > "$RUNNER_TEMP/secrets/github-token/token"
          chmod 0644 "$RUNNER_TEMP/secrets/"*.pem "$RUNNER_TEMP/secrets/grafana-admin-password" "$RUNNER_TEMP/secrets/github-token/token"
          chmod 0755 "$RUNNER_TEMP/secrets/github-token"
          # Every Environment=GF_* line and every Volume= under config/grafana,
          # taken from the quadlet itself so the two cannot drift.
          args=()
          while IFS= read -r l; do args+=(--env "$l"); done < <(sed -n 's/^Environment=//p' "$q")
          while IFS= read -r l; do
            l=${l//%h\/workspaces\/tooling\/fleet-ops-deploy-clone/$PWD}
            args+=(-v "$l")
          done < <(sed -n 's/^Volume=//p' "$q" | grep 'config/grafana')
          while IFS= read -r n; do echo dummy > "$RUNNER_TEMP/secrets/$n"; chmod 0644 "$RUNNER_TEMP/secrets/$n"; args+=(-v "$RUNNER_TEMP/secrets/$n:/run/secrets/$n:ro"); done < <(sed -n 's/^Secret=\([^,]*\),.*/\1/p' "$q")
          docker run -d --name grafana --network host \
            "${args[@]}" \
            -v "$RUNNER_TEMP/secrets/github-app.pem:/run/secrets/github-app.pem:ro" \
            -v "$RUNNER_TEMP/secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro" \
            -v "$RUNNER_TEMP/secrets/github-token:/run/secrets/github-token:ro" \
            "docker.io/$image"
          port=$(sed -n 's/^Environment=GF_SERVER_HTTP_PORT=//p' "$q")
          [[ $port =~ ^[0-9]+$ ]] || { echo "::error::$q has no numeric GF_SERVER_HTTP_PORT (got '$port')"; exit 1; }
          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' grafana)" != true ]; then
              echo "::error::Grafana exited before /api/health answered"
              docker logs grafana 2>&1 | grep -E 'level=(error|crit)|^Error' | cut -c1-400 | head -n 8
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:$port/api/health"; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS --connect-timeout 5 --max-time 30 "http://127.0.0.1:$port/api/health" | jq -e '.database == "ok"'
          # Stay up past provisioning, then require no provisioning error.
          sleep 10
          if [ "$(docker inspect -f '{{.State.Running}}' grafana)" != true ]; then
            echo "::error::Grafana exited after /api/health"
            docker logs grafana 2>&1 | grep -E 'level=(error|crit)|^Error' | cut -c1-400 | head -n 8
            exit 1
          fi
          if docker logs grafana 2>&1 | grep -E 'logger=provisioning[^ ]* .*level=(error|crit)|level=(error|crit) .*(rovisioning|failure to map file|Failed to start grafana)|Failed to start grafana' > "$RUNNER_TEMP/perr.txt"; then
            cut -c1-400 "$RUNNER_TEMP/perr.txt" | head -n 8
            echo "::error::Grafana logged a provisioning error"
            exit 1
          fi
          echo "grafana-boot: $image healthy, no provisioning error"
      - name: Provisioning reload path unit covers every mounted dir and its reload call works
        # fleet-ops#9449 follow-up: Grafana reads provisioning only at start, so
        # a merged rule change sat unloaded for 31 hours and paged a false
        # alarm. systemd/fleet-grafana-provisioning.path watches the clone's
        # provisioning dirs and the .service POSTs the stock admin reload API.
        # (1) every config/grafana/provisioning/<dir> the quadlet mounts must be
        # a PathChanged= in the .path unit, so a new mount cannot ship unwatched
        # (dashboards is skipped: its provider polls every 60 s);
        # (2) the .service's reload URLs, called with the dummy admin password
        # against the booted pinned image, must answer 2xx and leave Grafana
        # healthy with no provisioning error.
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          q=containers/quadlet/fleet-grafana.container
          p=systemd/fleet-grafana-provisioning.path
          u=systemd/fleet-grafana-provisioning.service
          pw="$RUNNER_TEMP/secrets/grafana-admin-password"
          # The dummy password is written by the "Start the quadlet's Grafana" step above.
          test -s "$pw" || { echo "::error::dummy admin password file missing or empty; the boot step must write it"; exit 1; }
          n=0
          while IFS= read -r d; do
            grep -qE "^PathChanged=.*/config/grafana/provisioning/$d\$" "$p" || { echo "::error::$p does not watch the provisioning dir $d that $q mounts"; exit 1; }
            n=$((n+1))
          done < <(sed -n 's|^Volume=.*/config/grafana/provisioning/\([a-z]*\):.*|\1|p' "$q" | grep -vx dashboards)
          test "$n" -ge 2
          port=$(sed -n 's/^Environment=GF_SERVER_HTTP_PORT=//p' "$q")
          [[ $port =~ ^[0-9]+$ ]] || { echo "::error::$q has no numeric GF_SERVER_HTTP_PORT (got '$port')"; exit 1; }
          # The .service loops `for e in <endpoints>` over one URL base; take both from it.
          base=$(grep -oE 'http://127\.0\.0\.1:[0-9]+/api/admin/provisioning/' "$u" | head -n 1)
          eps=$(sed -n 's/.*for e in \([a-z ]*\); do.*/\1/p' "$u")
          [ -n "$base" ] && [ -n "$eps" ] || { echo "::error::$u: could not read the reload URL base and endpoint list"; exit 1; }
          m=0
          for e in $eps; do
            url=${base/:3001\//:$port/}${e}/reload
            # Password as a quoted, escaped config fd, same as the .service: never in argv.
            curl -fsS --connect-timeout 5 --max-time 30 -X POST --config <(sed 's/["\\]/\\&/g; s/^/user = "admin:/; s/$/"/' "$pw") "$url"
            echo
            m=$((m+1))
          done
          [ "$m" -ge 2 ] || { echo "::error::$u reloads $m endpoints, want at least 2"; exit 1; }
          curl -fsS --connect-timeout 5 --max-time 30 "http://127.0.0.1:$port/api/health" | jq -e '.database == "ok"'
          sleep 5
          if docker logs grafana 2>&1 | grep -E 'logger=provisioning[^ ]* .*level=(error|crit)|level=(error|crit) .*(rovisioning|failure to map file)' > "$RUNNER_TEMP/rerr.txt"; then
            cut -c1-400 "$RUNNER_TEMP/rerr.txt" | head -n 8
            echo "::error::Grafana logged a provisioning error after the reload"
            exit 1
          fi
          echo "grafana-boot: $n provisioning dirs watched, reload answered 2xx"
      - name: A provisioning reload re-reads the token file the contact points name (fleet-ops#9445)
        # The refresh design rests on one Grafana behaviour: $__file{} is
        # expanded again on every provisioning load, so the 20 min re-mint reaches
        # the webhook through the stock admin reload without a restart. Proven
        # here against the pinned image, with the REAL contact point file (only
        # its URL and timers rewritten): a firing rule routed to the dead-row
        # webhook delivers the first token, the file is replaced by rename, the
        # reload API is called, and the next delivery must carry the second.
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          d=$RUNNER_TEMP/reload-drill
          mkdir -p "$d/prov" "$d/tok" "$d/data"
          chmod 0777 "$d/data"
          printf 'tokenA' > "$d/tok/token"
          # The host layout: 0700 dir, 0600 files, readable only by the owner. The
          # container runs as that owner (on the host UserNS=keep-id maps the file
          # owner to the image's grafana uid), so a mode the reader cannot use fails here.
          chmod 0700 "$d/tok"; chmod 0600 "$d/tok/token"
          sed -e 's|https://api.github.com/repos/Nishfleet/fleet-ops/issues|http://127.0.0.1:18796/|' \
              -e 's|group_interval: 5m|group_interval: 10s|' -e 's|repeat_interval: 12h|repeat_interval: 1m|' -e 's|repeat_interval: 24h|repeat_interval: 1m|' \
              config/grafana/provisioning/alerting/cloudflare-spend-contact.yaml > "$d/prov/contact.yaml"
          cat > "$d/prov/fixture.yaml" <<'YAML'
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: hermes-urgent
              receivers:
                - uid: drill-urgent
                  type: webhook
                  disableResolveMessage: true
                  settings: {url: "http://127.0.0.1:18796/urgent", httpMethod: POST}
          groups:
            - orgId: 1
              name: drill
              folder: drill
              interval: 10s
              rules:
                - uid: drill-dead-row
                  title: drill dead row
                  condition: B
                  data:
                    - refId: A
                      datasourceUid: __expr__
                      model: {datasource: {type: __expr__, uid: __expr__}, type: math, expression: "1", refId: A}
                    - refId: B
                      datasourceUid: __expr__
                      model: {datasource: {type: __expr__, uid: __expr__}, type: threshold, expression: A, refId: B, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [B]}, reducer: {params: [], type: last}, type: query}]}
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  annotations: {summary: drill, value: "1", threshold: "0", description: drill}
                  labels: {signal: router-dead-row, model_id: drill}
                - uid: drill-generic
                  title: drill generic
                  condition: B
                  data:
                    - refId: A
                      datasourceUid: __expr__
                      model: {datasource: {type: __expr__, uid: __expr__}, type: math, expression: "1", refId: A}
                    - refId: B
                      datasourceUid: __expr__
                      model: {datasource: {type: __expr__, uid: __expr__}, type: threshold, expression: A, refId: B, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [B]}, reducer: {params: [], type: last}, type: query}]}
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  annotations: {summary: drill, value: "1", threshold: "0", description: drill}
                  labels: {signal: drill-generic}
          YAML
          echo drill-admin-pw > "$d/admin-pw"
          : > "$d/sink.log"
          python3 tests/webhook_sink.py 18796 "$d/sink.log" &
          sink=$!
          trap 'kill $sink 2>/dev/null || true; docker rm -f grafana-drill >/dev/null 2>&1 || true' EXIT
          image=$(sed -n 's/^Image=docker\.io\///p' containers/quadlet/fleet-grafana.container)
          docker run -d --name grafana-drill --network host --user "$(id -u):$(id -g)" \
            --env GF_SERVER_HTTP_ADDR=127.0.0.1 --env GF_SERVER_HTTP_PORT=3998 --env GF_SECURITY_ADMIN_PASSWORD="$(cat "$d/admin-pw")" \
            --env TELEGRAM_BOT_TOKEN=dummy --env TELEGRAM_HOME_CHANNEL=dummy \
            -v "$d/prov:/etc/grafana/provisioning/alerting:ro" \
            -v "$d/tok:/run/secrets/github-token:ro" \
            -v "$d/data:/var/lib/grafana" \
            "docker.io/$image" >/dev/null
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:3998/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:3998/api/health | jq -e '.database == "ok"' >/dev/null
          for _ in $(seq 1 60); do grep -q '^AUTH Bearer tokenA$' "$d/sink.log" && break; sleep 3; done
          grep -q '^AUTH Bearer tokenA$' "$d/sink.log" || { echo "::error::the dead-row webhook never delivered the first token"; docker logs grafana-drill 2>&1 | grep -E 'level=(error|warn)' | cut -c1-300 | tail -n 10; exit 1; }
          printf 'tokenB' > "$d/tok/token.new"; chmod 0600 "$d/tok/token.new"; mv -f "$d/tok/token.new" "$d/tok/token"
          pwcfg() { sed 's/["\\]/\\&/g; s/^/user = "admin:/; s/$/"/' "$d/admin-pw"; }
          curl -fsS -X POST --config <(pwcfg) http://127.0.0.1:3998/api/admin/provisioning/alerting/reload; echo
          # A firing alert is re-sent only on Grafana's own schedule, so make the
          # next delivery deterministic: a second always-firing rule with another
          # model_id is a new notification group and is sent at once through the
          # contact point as it stands after the reload.
          folder=$(curl -fsS --config <(pwcfg) http://127.0.0.1:3998/api/folders | jq -er '.[]|select(.title=="drill")|.uid')
          jq -n --arg f "$folder" '{title: "drill dead row 2", ruleGroup: "drill-api", folderUID: $f, orgID: 1, condition: "B", for: "0s", noDataState: "OK", execErrState: "Error",
            labels: {signal: "router-dead-row", model_id: "drill2"}, annotations: {summary: "drill", value: "1", threshold: "0", description: "drill"},
            data: [{refId: "A", datasourceUid: "__expr__", relativeTimeRange: {from: 0, to: 0}, model: {datasource: {type: "__expr__", uid: "__expr__"}, type: "math", expression: "1", refId: "A"}},
                   {refId: "B", datasourceUid: "__expr__", relativeTimeRange: {from: 0, to: 0}, model: {datasource: {type: "__expr__", uid: "__expr__"}, type: "threshold", expression: "A", refId: "B", conditions: [{evaluator: {params: [0], type: "gt"}, operator: {type: "and"}, query: {params: ["B"]}, reducer: {params: [], type: "last"}, type: "query"}]}}]}' > "$d/rule2.json"
          curl -fsS -X POST --config <(pwcfg) -H 'content-type: application/json' --data @"$d/rule2.json" http://127.0.0.1:3998/api/v1/provisioning/alert-rules >/dev/null
          for _ in $(seq 1 60); do grep -q '^AUTH Bearer tokenB$' "$d/sink.log" && break; sleep 3; done
          grep -q '^AUTH Bearer tokenB$' "$d/sink.log" || { echo "::error::a provisioning reload did not make the webhook send the replaced token"; sort "$d/sink.log" | uniq -c; exit 1; }
          sort "$d/sink.log" | uniq -c
          # A rule with no route of its own lands on the policy root,
          # fleet-alert-dispatch: its payload must be a labelled fleet issue.
          for _ in $(seq 1 30); do grep -q '"title":"grafana alert: drill generic"' "$d/sink.log" && break; sleep 3; done
          g=$(grep '"title":"grafana alert: drill generic"' "$d/sink.log" | head -n 1 || true)
          [ -n "$g" ] || { echo "::error::a rule with no route of its own did not reach fleet-alert-dispatch"; cat "$d/sink.log"; exit 1; }
          jq -e '.labels == ["agent-ready"] and (.body | contains("drill generic")) and (.body | contains("drill-generic"))' <<<"${g#BODY * }" >/dev/null \
            || { echo "::error::fleet-alert-dispatch rendered an unexpected issue"; echo "$g"; exit 1; }
          echo "reload drill: webhook sent tokenA, then tokenB after the admin reload, no restart; a root-routed rule filed a fleet issue"
      - name: deploy-failed rules, SQL logic in SQLite and on the pinned Grafana's SQL engine
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 20
        run: pipx run --spec pytest==8.3.5 pytest -q -p no:cacheprovider tests/test_deploy_failed_rule.py tests/test_deploy_failed_engine.py
      - name: Grafana log on failure
        if: failure()
        run: docker logs grafana 2>&1 | cut -c1-400 | tail -n 40 || true

  # infra/cloudflare-tokens/ is OpenTofu config. This job holds no Cloudflare or
  # GitHub credential and never plans or applies: it only checks that the files
  # are formatted and the config is valid, with the provider schemas from the
  # lock file (-backend=false, so no state is read or written).
  cloudflare-tokens-tofu:
    name: cloudflare-tokens-tofu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: tofu fmt -check
        working-directory: infra/cloudflare-tokens
        run: tofu fmt -check -diff -recursive
      - name: tofu init -backend=false
        working-directory: infra/cloudflare-tokens
        run: tofu init -backend=false -lockfile=readonly
      - name: tofu validate
        working-directory: infra/cloudflare-tokens
        run: tofu validate

  ratchet:
    uses: Nishfleet/fleet-ops/.github/workflows/ratchet.yml@main

  # Coordinator approval as a required status check (fleet-ops#9383).
  # hold-risky (agent-dispatch.yml) disarms a risky PR on a few PR events, so a
  # direct enqueue or merge got past it (#9371 merged with no approval). A
  # required check is the one thing the merge queue cannot skip. On merge_group
  # this job resolves the PR(s) in the queue entry, classifies each one's
  # changed files and fails when a risky PR's CURRENT head sha has no
  # `coordinator-approval: <sha>` comment or success status from an approver.
  # On pull_request and push it passes, so a PR can be enqueued and the queue
  # does the rejecting. The CLASSIFY and APPROVAL programs, APPROVERS and the
  # path list are read from the BASE commit's agent-dispatch.yml and
  # config/risky-paths.json, so ci.yml's case tests over them keep covering
  # what this job runs and a PR cannot loosen the list it is judged by.
  # Every failed read fails the check. Ruleset bypass actors (repository admin)
  # can still skip a required check.
  coordinator-approval:
    name: coordinator-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Pass outside the merge queue
        if: github.event_name != 'merge_group'
        run: echo "coordinator-approval is enforced on merge_group; this run is informational."
      - name: Checkout the base commit (programs and path list)
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/agent-dispatch.yml
            config/risky-paths.json
          sparse-checkout-cone-mode: false
      - name: Fail a risky PR in the queue whose head has no coordinator approval
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_DIR: base
        run: |
          set -euo pipefail
          # Programs, approvers and path list: the base commit's, not the PR's.
          for v in LABEL CONTEXT APPROVERS CLASSIFY APPROVAL; do
            val=$(yq ".jobs.hold-risky.env.$v" "$BASE_DIR/.github/workflows/agent-dispatch.yml")
            [ -n "$val" ] && [ "$val" != null ] || { echo "::error::coordinator-approval: hold-risky env $v unreadable"; exit 1; }
            export "$v=$val"
          done
          cfg=$(jq -c . "$BASE_DIR/config/risky-paths.json") || { echo "::error::coordinator-approval: risky-path list unreadable"; exit 1; }
          # The queue branch is gh-readonly-queue/<base>/pr-<N>-<sha>; <N> is
          # the entry's own PR. Entries ahead of it in the same group are
          # commits below the tip, each titled "... (#<M>)" by the squash.
          [[ "$HEAD_REF" =~ gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]{40}$ ]] ||
            { echo "::error::coordinator-approval: cannot read a PR number from $HEAD_REF"; exit 1; }
          nums=${BASH_REMATCH[1]}
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$GROUP_SHA?per_page=100" \
            --jq '.commits[].commit.message | split("\n")[0]' > "$RUNNER_TEMP/subjects.txt" ||
            { echo "::error::coordinator-approval: commit list read failed for $BASE_SHA...$GROUP_SHA"; exit 1; }
          total=$(grep -c '' "$RUNNER_TEMP/subjects.txt" || true)
          # One commit is the entry's own PR (named by the ref). More than one:
          # every commit must map to a PR, or the check fails.
          if [ "$total" -gt 1 ]; then
            while IFS= read -r subject; do
              if [[ "$subject" =~ \(#([0-9]+)\)$ ]] || [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\  ]]; then
                nums="$nums ${BASH_REMATCH[1]}"
              else
                echo "::error::coordinator-approval: cannot map commit \"$subject\" to a PR in a group of $total"; exit 1
              fi
            done < "$RUNNER_TEMP/subjects.txt"
          fi
          bad=0
          for n in $(tr ' ' '\n' <<<"$nums" | sort -un); do
            # The live PR: a head moved after approval has no approval.
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n") || { echo "::error::coordinator-approval: PR read failed for #$n"; bad=1; continue; }
            sha=$(jq -r .head.sha <<<"$pr")
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$n/files?per_page=100" --jq '.[] | {f: .filename, p: (.previous_filename // null), patch: (.patch // null)}' > "$RUNNER_TEMP/files.txt" ||
              { echo "::error::coordinator-approval: changed-files read failed for #$n"; bad=1; continue; }
            jq -sc '{files: [.[] | .f, (.p // empty)], patches: [.[] | {file: .f, patch}]}' < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/files.json"
            jq -c --arg repo "$GITHUB_REPOSITORY" --slurpfile d "$RUNNER_TEMP/files.json" \
              '{repo: $repo, labels: [(.labels // [])[].name], files: $d[0].files, patches: $d[0].patches, changed_files: (.changed_files // 0)}' <<<"$pr" > "$RUNNER_TEMP/facts.json"
            verdict=$(jq -c --argjson cfg "$cfg" --arg label "$LABEL" "$CLASSIFY" < "$RUNNER_TEMP/facts.json") ||
              { echo "::error::coordinator-approval: classifier failed for #$n"; bad=1; continue; }
            echo "coordinator-approval: #$n at $sha: $verdict"
            jq -e .risky <<<"$verdict" >/dev/null || continue
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" --jq '.[]' > "$RUNNER_TEMP/statuses.txt" ||
              { echo "::error::coordinator-approval: statuses read failed for $sha"; bad=1; continue; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq '.[] | {user: {login: .user.login}, body, created_at, updated_at}' > "$RUNNER_TEMP/comments.txt" ||
              { echo "::error::coordinator-approval: comments read failed for #$n"; bad=1; continue; }
            approved=$(jq -n --arg sha "$sha" --slurpfile s "$RUNNER_TEMP/statuses.txt" --slurpfile m "$RUNNER_TEMP/comments.txt" \
              '{sha: $sha, statuses: $s, comments: $m}' |
              jq -r --arg c "$CONTEXT" --arg who "$APPROVERS" "$APPROVAL") || approved=false
            if [ "$approved" = true ]; then
              echo "coordinator-approval: #$n is risky and $sha carries an approver's $CONTEXT"
            else
              echo "::error::coordinator-approval: #$n is risky and $sha has no $CONTEXT from $APPROVERS"
              jq -r '.why[] | "- \(.)"' <<<"$verdict" >> "$GITHUB_STEP_SUMMARY"
              echo "review-risky reviews and approves this head on its own; this check passes once the approval names $sha. Nothing needs a person." >> "$GITHUB_STEP_SUMMARY"
              bad=1
            fi
          done
          test "$bad" -eq 0
