name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6443a0d7130f3286e5bc1f6270c7dc4db7b87 # v5.0.0
        with:
          persist-credentials: false
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          # Pinned to a release >7 days old. Bump SEMGREP_VERSION after vetting.
          SEMGREP_VERSION="1.170.0"
          python3 -m pip install --no-input "semgrep==${SEMGREP_VERSION}"
      # TODO(fleet-ops): add the fleet's orchestration rules config from
      # Nishfleet/siterep-public .semgrep/no-hand-built-orchestration.yml at an
      # exact commit SHA, once packet p56 merges it. Until then, p/default only.
      # Flagged loudly: the orchestration-specific ruleset is NOT yet applied.
      - name: Run semgrep
        run: semgrep --config p/default --error .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6443a0d7130f3286e5bc1f6270c7dc4db7b87 # v5.0.0
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned binary + sha256)
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="v0.11.0"
          SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          ARCHIVE="shellcheck-v0.11.0.linux.x86_64.tar.xz"
          URL="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${SHELLCHECK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xJf "${ARCHIVE}" -C "${HOME}/.local/bin" --strip-components=1 "shellcheck-v0.11.0/shellcheck"
          chmod +x "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Run shellcheck
        run: shellcheck bin/* install.sh

  unit-verify:
    name: systemd-analyze verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6443a0d7130f3286e5bc1f6270c7dc4db7b87 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify unit files
        # Hosted runners ship systemd-analyze but no running user manager.
        # `systemd-analyze verify` accepts file paths and parses them against
        # the default unit path without needing a manager. Proven to catch
        # breakage: a malformed unit (bad section header / missing '=') makes
        # verify exit nonzero with a clear "failed to load properly" message.
        run: |
          set -euo pipefail
          systemd-analyze --version
          # Verify each file individually so a failure names the bad file.
          shopt -s nullglob
          rc=0
          for f in systemd/*.service systemd/*.timer; do
            if ! systemd-analyze verify --man=no "$f"; then
              rc=1
            fi
          done
          exit "$rc"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6443a0d7130f3286e5bc1f6270c7dc4db7b87 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned binary + sha256)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVE="gitleaks_8.30.1_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          install -d "${HOME}/.local/bin"
          tar -xzf "${ARCHIVE}" -C "${HOME}/.local/bin" gitleaks
          chmod +x "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan repository
        run: gitleaks git --redact --verbose
