name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. Main runs complete; they queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stock checks
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck prometheus python3-yaml python3-pip

          shopt -s nullglob
          systemd_shell=(systemd/*.sh)
          if ((${#systemd_shell[@]})); then
            shellcheck -x "${systemd_shell[@]}"
          else
            echo "no systemd/*.sh to shellcheck"
          fi

          promtool check rules config/fleet_rules.yml

          python3 -m pip install --user --no-input "semgrep==1.170.0"
          export PATH="${HOME}/.local/bin:${PATH}"
          semgrep --config p/default --metrics=off

          for f in config/*.yml; do
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
