# Steps live in .github/actions/secret-scan. Reasons and switches: docs/workflow-notes.md.
name: Secret Scan
on:
  pull_request:
  merge_group:
  push: {branches: [main, master]}
  workflow_dispatch:
    inputs:
      expected_sha: {description: Exact main commit authorized for secret scanning, required: true, type: string}
permissions: {}
concurrency: {group: "secret-scan-${{ github.ref }}", cancel-in-progress: true}
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: Authorize exact secret-scan candidate
        env: {EXPECTED_SHA: "${{ inputs.expected_sha || '' }}", HEAD_REPOSITORY: "${{ github.event.pull_request.head.repo.full_name || '' }}"}
        run: |
          set -euo pipefail
          s='^[a-f0-9]{40}$'; test "$GITHUB_REPOSITORY" = Nishfleet/fleet-ops; [[ $GITHUB_SHA =~ $s ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request) test -z "$EXPECTED_SHA"; test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"; [[ $GITHUB_REF =~ ^refs/pull/[1-9][0-9]*/merge$ ]] ;;
            push) test -z "$EXPECTED_SHA"; [[ $GITHUB_REF =~ ^refs/heads/(main|master)$ ]] ;;
            workflow_dispatch) test "$GITHUB_REF" = refs/heads/main; test "$GITHUB_RUN_ATTEMPT" = 1; [[ $EXPECTED_SHA =~ $s ]]; test "$EXPECTED_SHA" = "$GITHUB_SHA" ;;
            merge_group) test -z "$EXPECTED_SHA"; [[ $GITHUB_REF == refs/heads/gh-readonly-queue/* ]] ;;
            *) false ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", fetch-depth: 0, clean: true, persist-credentials: false}
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/secret-scan
        with: {sha: "${{ github.sha }}", base-sha: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}", head-sha: "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}"}
  private-detail-scan:
    name: Private detail scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - if: github.event_name == 'pull_request' && vars.PRIVATE_DETAIL_SCAN != 'off'
        uses: ./.github/actions/secret-scan
        with: {config: .github/gitleaks-private-detail.toml, base-sha: "${{ github.event.pull_request.base.sha }}", head-sha: "${{ github.event.pull_request.head.sha }}"}
