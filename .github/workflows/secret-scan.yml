name: Secret Scan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for secret scanning
        required: true
        type: string

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    # Required context (branch protection). It must be structurally incapable
    # of concluding SKIPPED: GitHub counts a skipped required context as
    # satisfying branch protection, so there is NO job-level `if:` and NO
    # `needs` here (a job with needs is skipped when its dependency fails;
    # an if: can skip on cancellation or any future condition edit). The
    # authorizer is step 1 of THIS job, so a fork PR or unapproved dispatch
    # candidate fails the required check with a real failure - a gate that
    # cannot verify must say no, never render green or skipped. Path
    # optimization lives in step-level conditions only (see the fork guard on
    # the scan step below).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Authorize exact secret-scan candidate
        # Fork guard as a step, not a job: it refuses fork PRs and unapproved
        # dispatch candidates with a real failure of the required job.
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/fleet-ops"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            push)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" = "refs/heads/main" || "$GITHUB_REF" = "refs/heads/master" ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            merge_group)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" =~ ^refs/heads/gh-readonly-queue/ ]]
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Clear stale gitleaks installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- /tmp/gitleaks.tmp
          rm -rf -- "${RUNNER_TEMP:?}/gitleaks"
      - name: Install pinned gitleaks binary
        # The gitleaks BINARY is MIT-licensed and free for everyone. Only the
        # gitleaks-action wrapper demands an organization license key, and
        # since this repository moved into the Nishfleet organization that
        # wrapper aborted every run with "missing gitleaks license" - i.e. no
        # secret scan actually executed. Installing the release binary
        # ourselves restores real scanning at zero cost. The release is pinned
        # by version AND by SHA-256, so the download is as tamper-evident as a
        # SHA-pinned `uses:`. To bump: change both env values together from
        # https://github.com/gitleaks/gitleaks/releases (checksums file).
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:?}/gitleaks"
          mkdir -p -- "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 180 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          rm -f -- "$archive"
          chmod +x -- "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan repository
        # Fork guard on the scan step, kept from the gitleaks-action era: the
        # authorizer above already fails fork PRs before this step, and this
        # guard keeps untrusted fork code away from the job even if that gate
        # is ever removed. The scan itself consumes no secret - the gitleaks
        # binary needs no token.
        #
        # `gitleaks git` walks the commit history the pinned fetch-depth: 0
        # checkout provides, so a secret that was committed and later deleted
        # still fails the gate. On pull_request AND merge_group events the scan
        # is scoped to the PR's own range (base_sha..head_sha; merge_group
        # carries the same pair) so a secret sitting on an unrelated branch
        # cannot poison other PRs or the merge queue. Push and workflow_dispatch
        # scan the full ancestry of the authorized commit (--full-history HEAD)
        # so an already-merged secret still fails - but never every fetched
        # ref: a bare `gitleaks git` runs `git log --all`, which walked every
        # claim branch, so a fixture on an unrelated branch turned main red and
        # the auto-revert organ merged a revert of an innocent PR (0509#1817
        # reverted #1787, 2026-09-06). tests/secret-scan-workflow.test.sh pins
        # this.
        # --redact keeps the secret value out of the public run log; --exit-code
        # 2 separates "leaks found" (2) from "gitleaks itself errored" (1) so an
        # infrastructure fault can never be misread as a clean scan.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group)
              test -n "$PR_BASE_SHA" && test -n "$PR_HEAD_SHA"
              log_opts=(--log-opts "${PR_BASE_SHA}..${PR_HEAD_SHA}")
              ;;
            *)
              # push / workflow_dispatch: the full ancestry of the authorized
              # commit and nothing else (see the step comment).
              log_opts=(--log-opts "--full-history HEAD")
              ;;
          esac
          gitleaks git . --redact --exit-code 2 --verbose --no-banner "${log_opts[@]}"
