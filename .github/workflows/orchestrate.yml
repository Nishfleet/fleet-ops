name: orchestrate
# The hand-off lane, split out of agent-dispatch.yml (fleet-ops#11192): one workflow file
# holds only orchestrate runs, so `gh run list --workflow=orchestrate.yml` is the exact live
# list and Workflow_Runs on this file is the exact per-day denominator, with no event filter.
on:
  issues:
    types: [labeled]
  # issue=<number> hands that issue over: the daily sweep's re-fire, and a hand.
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to hand to the orchestrator'
        type: string
        required: true
  # A trigger stub in another repo calls this file, as it does agent-dispatch.yml.
  workflow_call:
    inputs:
      issue:
        type: string
permissions: {}
jobs:
  # A parked issue is one the fleet cannot finish: the attempt cap, two failed
  # runs, or a worker parking it. The label was the whole hand-off and nothing
  # read it, so parked work sat (fleet-ops #9211 #9063 #9055 #9015 #8973 #8574
  # #8561 #8444 open, 0509 7). This job picks the issue up and runs the
  # orchestrator, which is a Claude Code session on the worker App token with
  # workflows: write (fleet-ops#10949): most parked work edits
  # .github/workflows/**, and no runner job may read the runner user's gh login
  # any more, so that login is neither a credential here nor an approval.
  # Not a reusable call to agent.yml on purpose: agent.yml is the worker (App
  # token, bwrap jail, one claim branch), and this is the hand-off (App token
  # with workflows: write, plain worktree, branch orch/issue-<N>).
  orchestrate:
    # A bot sender alone is not trust; workflow_dispatch is already write-only.
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' &&
      vars.ORCHESTRATE != 'off' && (
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'needs-orchestrator' &&
          (github.event.sender.login == 'nish3451' ||
           (endsWith(github.event.sender.login, '[bot]') &&
            (github.event.sender.login == 'nishfleet-worker[bot]' || github.event.sender.login == 'github-actions[bot]')))) ||
        (github.event_name == 'workflow_dispatch' && inputs.issue != '')
      )
    # Per issue: a per-repo group dropped queued hand-offs (fleet-ops#9700).
    concurrency:
      group: orchestrate-${{ github.repository }}-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: ${{ github.repository == 'Nishfleet/fleet-ops' && fromJSON('["self-hosted","fleet-ops"]') || fromJSON('["self-hosted","agent"]') }}  # fleet-ops#10717
    # Above the session step's wall and the cleanup after it. Measured on 40942864011: 9 seconds from
    # job start to the session step, 4 seconds from its kill to the job's last step, so the 10-minute
    # margin here is slack, not the budget the session runs in (fleet-ops#11059).
    timeout-minutes: 85
    # GITHUB_TOKEN stays read-only; every write, the session's too, is the App token (fleet-ops#10949).
    permissions:
      issues: read
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      # A label-only trigger from a 0509 stub passes no input; read the event.
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: Nishfleet/fleet-ops/.github/actions/runner-probe@main
      # The key stays on the runner, is masked, and goes only to
      # create-github-app-token. workflows: write is the one grant the runner
      # login used to carry for this job: the session pushes and opens PRs that
      # edit .github/workflows/**, which the App could not do before Nish granted
      # it (fleet-ops#9521).
      - name: Read App private key
        id: app-key
        run: |
          keyfile="${CREDENTIALS_DIRECTORY:-$HOME/.config/fleet-worker}/nishfleet-worker.private-key.pem"
          [ -s "$keyfile" ] || { echo "::error::orchestrate: app private key file missing on runner"; exit 1; }
          grep . "$keyfile" | sed 's/^/::add-mask::/'
          { echo 'pem<<APP_PRIVATE_KEY_END'; cat "$keyfile"; echo APP_PRIVATE_KEY_END; } >> "$GITHUB_OUTPUT"
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4728578"
          private-key: ${{ steps.app-key.outputs.pem }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-actions: read
      - name: Check the issue is still parked
        id: issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}  # the App token, never the runner login (fleet-ops#10949)
          # Raw values: the defaults live in bash, so a literal 0 survives.
          DAILY_MAX: ${{ vars.ORCHESTRATE_DAILY_MAX }}
          RUNNER_VAR: ${{ vars.ORCHESTRATE_RUNNER }}
        run: |
          set -euo pipefail
          [ -n "$ISSUE" ] || { echo "orchestrate: no issue number on this event; skip"; exit 0; }
          state=$(gh issue view "$ISSUE" -R "$REPO" --json state --jq .state)
          labels=,$(gh issue view "$ISSUE" -R "$REPO" --json labels --jq '[.labels[].name]|join(",")'),
          [ "$state" = OPEN ] || { echo "orchestrate: #$ISSUE is $state; skip"; exit 0; }
          [ "$(gh api "repos/$REPO/issues/$ISSUE" --jq '.issue_dependencies_summary.blocked_by // 0')" = 0 ] || { echo "orchestrate: #$ISSUE is blocked by an open issue; skip"; exit 0; }
          # Picked up again, or a previous hand-off produced no PR: end here, not in
          # the always() step, so nothing is built.
          case $labels in *,needs-orchestrator,*) ;; *) echo "orchestrate: #$ISSUE no longer has needs-orchestrator; skip"; exit 0 ;; esac
          case $labels in *,handoff-ended,*) echo "orchestrate: #$ISSUE already has handoff-ended; skip"; exit 0 ;; esac
          branch="orch/issue-$ISSUE"
          # An open PR is a blocked review sent back (fleet-ops#10435); no PR at all is
          # a run that died before opening one; a closed or merged one ended the
          # branch, so park it agent-blocked (fleet-ops#10211, #10843).
          if gh api "repos/$REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            ended=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$branch&state=all" --jq 'if any(.[]; .state == "open") then "open" elif length == 0 then "none" else "newest #\([.[].number] | max // "unknown")" end') || { echo "orchestrate: the PR list for $branch failed; skip"; exit 0; }
            # These writes need issues: write, which the App token holds.
            if [ "$ended" != open ] && [ "$ended" != none ]; then gh issue edit "$ISSUE" -R "$REPO" --add-label agent-blocked --remove-label needs-orchestrator; gh issue comment "$ISSUE" -R "$REPO" --body "orchestrator: $branch has only closed or merged pull requests ($ended), so no hand-off can continue it. Parked agent-blocked for the open-or-close decision; a fresh branch needs a new claim."; echo "orchestrate: $branch has only closed or merged PRs; parked #$ISSUE agent-blocked"; exit 0; fi
          fi
          # Daily cap (fleet-ops#9351): counts today's (IST) hand-off-started
          # comments, from members or the App, never this workflow's runs (fleet-ops#10641).
          DAILY_MAX=${DAILY_MAX:-10}
          case $DAILY_MAX in
            ''|*[!0-9]*) echo "::error::orchestrate: ORCHESTRATE_DAILY_MAX must be a non-negative integer, got '$DAILY_MAX'"; exit 1 ;;
          esac
          if [ "$DAILY_MAX" -gt 0 ]; then
            since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%FT%TZ)
            retry() { local o i; for i in 1 2 3; do o=$("$@") && { printf '%s\n' "$o"; return 0; }; sleep $((i * 5)); done; return 1; }
            if pages=$(retry gh api --method GET --paginate "repos/$REPO/issues/comments" -f since="$since" -f per_page=100 --jq "[.[] | select(.created_at >= \"$since\" and ((.author_association | IN(\"OWNER\", \"MEMBER\", \"COLLABORATOR\")) or (.user.login == \"nishfleet-worker[bot]\")) and (.body | startswith(\"orchestrator hand-off started:\")))] | length"); then
              count=$(printf '%s\n' "$pages" | jq -s 'add // 0')
              if [ "$count" -ge "$DAILY_MAX" ]; then
                echo "::warning::orchestrate: daily cap reached ($count/$DAILY_MAX hand-offs since 00:00 IST in $REPO); #$ISSUE keeps needs-orchestrator; dispatch orchestrate.yml issue=$ISSUE after midnight IST"
                exit 0
              fi
              echo "orchestrate: $count/$DAILY_MAX hand-offs since 00:00 IST in $REPO"
            else
              echo "::warning::orchestrate: daily cap count unreadable (GitHub error); admitting #$ISSUE uncounted"
            fi
          else
            echo "orchestrate: daily cap off (ORCHESTRATE_DAILY_MAX=0)"
          fi
          # Sonnet for every hand-off; a bare `claude -p` would run Opus (#10750).
          { echo "model=claude-sonnet-5-5"; echo "turns=40"; } >> "$GITHUB_OUTPUT"
          # Pi on a LiteLLM seat unless ORCHESTRATE_RUNNER is claude (fleet-ops#9407).
          if [ "${RUNNER_VAR:-pi}" = claude ]; then
            echo "runner=claude" >> "$GITHUB_OUTPUT"
          else
            echo "runner=pi" >> "$GITHUB_OUTPUT"
          fi
          # Feeds the daily cap; posted as the App, so a failure only warns.
          gh issue comment "$ISSUE" -R "$REPO" --body "orchestrator hand-off started: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" ||
            echo "::warning::orchestrate: the hand-off-started comment failed; today's daily cap count misses this run"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Fresh worktree on origin/main
        id: worktree
        if: steps.issue.outputs.go == 'true'
        # Every git call here authenticates with the job-level App token.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}  # the App token, never the runner login (fleet-ops#10949)
        run: |
          set -euo pipefail
          # Never in /tmp or the deploy clone: a checkout a session can re-clone is no base.
          # shellcheck disable=SC2153 # REPO is the job-level env, not a misspelling
          repo=${REPO#*/}
          mirror="$HOME/workspaces/agent-worktrees/.orch-mirror/$repo.git"
          wt="$HOME/workspaces/agent-worktrees/orch-$repo-$ISSUE"
          mkdir -p "${mirror%/*}"
          exec 9>"${mirror%.git}.lock"
          flock 9
          # Test for a repository, not a directory: a mirror that lost HEAD
          # (fleet-ops#9526) is one git no longer recognises.
          init_mirror() {
            if [ "$(git -C "$mirror" rev-parse --is-bare-repository 2>/dev/null)" != true ]; then
              mkdir -p "$mirror"
              git init -q --bare "$mirror"
            fi
            git -C "$mirror" remote get-url origin >/dev/null 2>&1 ||
              git -C "$mirror" remote add origin "https://github.com/$REPO.git"
          }
          init_mirror
          # git authenticates with the App token (gh auth git-credential reads GH_TOKEN). The refspec
          # maps into refs/remotes/origin/*, NOT refs/heads/*: with prune, a
          # heads->heads refspec deletes local branches not on origin (proven live).
          fetch_mirror() {
            git -C "$mirror" fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'
          }
          # The age-out also removed old objects, so the fetch can fail with
          # "unresolved deltas" (fleet-ops#9526): set the mirror aside only when the
          # object store also fails a connectivity check.
          if ! fetch_mirror; then
            if git -C "$mirror" fsck --connectivity-only --no-dangling >/dev/null 2>&1; then
              echo "::error::orchestrate: fetch failed on an intact mirror; not rebuilding it"
              exit 1
            fi
            aside="$HOME/workspaces/agent-worktrees/orch-damaged-$repo-$(date +%s).git"
            echo "::warning::orchestrate: the mirror's object store is damaged; setting it aside and fetching fresh"
            mv "$mirror" "$aside"
            init_mirror
            fetch_mirror
          fi
          # A killed run can leave the worktree registered; a detached build unit can
          # hold it as WorkingDirectory, and removing it is the #9377 CHDIR loss.
          if units=$(systemctl --user list-units --type=service --state=active 'orch-*' --plain --no-legend --no-pager 2>/dev/null); then
            while read -r unit _; do [ "$(systemctl --user show -p WorkingDirectory --value "$unit" 2>/dev/null)" = "$wt" ] && { echo "::error::orchestrate: $unit is building in $wt; keeping the tree (fleet-ops#9377)"; exit 1; }; done <<<"$units"
          fi
          git -C "$mirror" worktree prune
          git -C "$mirror" worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt"
          git -C "$mirror" worktree prune
          branch_ref="refs/heads/orch/issue-$ISSUE"
          # A branch on origin here has an open PR or none at all (step "issue"): continue from its head.
          start=refs/remotes/origin/orch/issue-$ISSUE
          git -C "$mirror" show-ref --verify --quiet "$start" || start=
          if git -C "$mirror" show-ref --verify --quiet "$branch_ref"; then
            # A hand-off that died before its push holds its commits on this branch.
            while IFS= read -r line; do
              case $line in
                "worktree "*) wdir=${line#worktree } ;;
                "branch $branch_ref")
                  git -C "$mirror" worktree remove --force "$wdir" 2>/dev/null || rm -rf "$wdir"
                  git -C "$mirror" worktree prune ;;
              esac
            done < <(git -C "$mirror" worktree list --porcelain)
            # A rework resets this branch to origin's head, so keep the tip.
            if [ -n "$start" ] && ! git -C "$mirror" merge-base --is-ancestor "$branch_ref" "$start" 2>/dev/null; then git -C "$mirror" branch -f "orch/issue-$ISSUE-unpushed" "$branch_ref"; echo "::warning::orchestrate: orch/issue-$ISSUE had unpushed commits, kept on orch/issue-$ISSUE-unpushed"; fi
            git -C "$mirror" worktree add -q ${start:+-B "orch/issue-$ISSUE"} "$wt" "${start:-$branch_ref}"
          else
            git -C "$mirror" worktree add -q -b "orch/issue-$ISSUE" "$wt" "${start:-refs/remotes/origin/main}"
          fi
          echo "worktree=$wt" >> "$GITHUB_OUTPUT"
      - name: Run the orchestrator session
        if: steps.issue.outputs.go == 'true' && steps.worktree.outputs.worktree != ''
        # 75, not 50 (fleet-ops#11059): 31 of the 67 failed agent-dispatch runs in the week to 2026-10-29
        # were this step's kill, 28 of the 32 failing orchestrate jobs ran at least 45 of the 50 minutes,
        # and the session spends most of that wall in model latency and in the tests its change needs.
        # The measurements are on #11059. The prompt's Time budget books the last 15 minutes for landing
        # the PR, keeps its own clock, and tests/test_workflow_caps.py holds its numbers to this one.
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}  # the App token, never the runner login (fleet-ops#10949)
          # Through env: zizmor's template-injection rule fails the workflow otherwise.
          ISSUE_N: ${{ github.event.issue.number || inputs.issue }}
          REPO_NAME: ${{ github.repository }}
          WORKTREE: ${{ steps.worktree.outputs.worktree }}
          MODEL: ${{ steps.issue.outputs.model }}
          TURNS: ${{ steps.issue.outputs.turns }}
          ORCH_RUNNER: ${{ steps.issue.outputs.runner }}
          SEAT: ${{ vars.ORCHESTRATE_SEAT }}
          HOOKS: ${{ vars.ORCHESTRATE_HOOKS }}
        run: |
          set -euo pipefail
          cd "$WORKTREE"
          # The prompt from THIS checkout; a repo without one falls back to the fleet copy.
          prompt="prompts/orchestrator-handoff.md"
          if [ ! -f "$prompt" ]; then
            echo "::warning::$REPO_NAME@main has no $prompt; using the fleet copy"
            prompt="$HOME/workspaces/tooling/fleet-ops-deploy-clone/prompts/orchestrator-handoff.md"
          fi
          { cat "$prompt"; printf '\n\nTarget: %s#%s\nBranch: orch/issue-%s. It is checked out already; run git log --oneline origin/main..HEAD before you build, because an earlier hand-off may have left commits here.\n' "$REPO_NAME" "$ISSUE_N" "$ISSUE_N"; } > "$RUNNER_TEMP/orchestrator-prompt.md"
          # Sonnet always, never the session default (Opus, #10750). The session pushes
          # with the App token in GH_TOKEN (fleet-ops#10949). The prompt
          # goes on stdin: its `---` front matter parses as an option as an argument.
          # The session never sees the App key the token above came from (fleet-ops#9521, #10949).
          # The unit's LoadCredential= puts the App key in systemd's credential store, and this
          # session reads outsider issue text, so the jail hides the unit's credential directory
          # and the store that holds it, which leaves a sibling runner's copy of the same key out
          # of reach too (fleet-ops#10957).
          jail=(bwrap --dev-bind / / --tmpfs "$HOME/.config/fleet-worker" --tmpfs "$RUNNER_TEMP/_runner_file_commands" ${CREDENTIALS_DIRECTORY:+--tmpfs "$CREDENTIALS_DIRECTORY" --tmpfs "${CREDENTIALS_DIRECTORY%/*}"} --die-with-parent --)
          if [ "$ORCH_RUNNER" = pi ]; then
            # No Claude spend and no turn cap: the step's timeout-minutes is the wall
            # (fleet-ops#10349).
            FLEET_TASK_ID="orch-${REPO_NAME#*/}-$ISSUE_N" \
              "${jail[@]}" "$HOME/.local/bin/pi" --print \
              --provider litellm --model "${SEAT:-worker-capable}" \
              < "$RUNNER_TEMP/orchestrator-prompt.md"
            exit 0
          fi
          # The repo's hooks only spend turns here; ORCHESTRATE_HOOKS=on keeps them.
          hook_args=(--settings '{"disableAllHooks":true}')
          [ "$HOOKS" != on ] || hook_args=()
          # Start-up trim: 51,407 input tokens and $0.334 untrimmed, 36,440 and
          # $0.146 trimmed (VPS, bare prompt, cold cache).
          "${jail[@]}" "$HOME/.local/bin/claude" -p \
            --model "$MODEL" \
            "${hook_args[@]}" \
            --strict-mcp-config \
            --disable-slash-commands \
            --setting-sources project,local \
            --output-format json \
            --permission-mode bypassPermissions \
            --max-turns "$TURNS" \
            < "$RUNNER_TEMP/orchestrator-prompt.md"
      - name: Clean up and mark a PR-less hand-off
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}  # the App token, never the runner login (fleet-ops#10949)
          # Through env: zizmor template-injection, as with WORKTREE above.
          GO: ${{ steps.issue.outputs.go }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153 # REPO is the job-level env, not a misspelling
          repo=${REPO#*/}
          mirror="$HOME/workspaces/agent-worktrees/.orch-mirror/$repo.git"
          wt="$HOME/workspaces/agent-worktrees/orch-$repo-$ISSUE"
          # Removal first and unconditional: a session cut at the job wall leaves the
          # worktree, and a leftover checkout costs the next hand-off a clone.
          # Skip it while a running user unit has this worktree as its
          # WorkingDirectory: removing the tree under that unit killed
          # orch-drive-642-build on 2026-10-07 (status=200/CHDIR, edits lost,
          # fleet-ops#9377). An unreadable unit list keeps the tree too, and
          # systemd-tmpfiles ages it out after 3 days.
          busy=0; export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          if [ -d "$wt" ] && [ -d "$XDG_RUNTIME_DIR" ]; then
            if units=$(systemctl --user list-units --type=service --state=active,activating,deactivating,reloading --plain --no-legend --no-pager 'orch-*'); then
              while read -r unit _; do
                [ -n "$unit" ] || continue
                if wd=$(systemctl --user show -p WorkingDirectory --value "$unit"); then
                  [ "$wd" = "$wt" ] && busy=1
                else
                  busy=1
                fi
              done <<< "$units"
            else
              busy=1
            fi
          fi
          if [ "$busy" = 1 ]; then
            echo "orchestrate: a running unit uses $wt; keeping the worktree"
          elif [ -d "$mirror" ]; then
            lock="${mirror%.git}.lock"
            flock "$lock" git -C "$mirror" worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt"
            flock "$lock" git -C "$mirror" worktree prune || true
          fi
          # Nothing was built: the session step was skipped or the issue check
          # bailed, so no PR is coming and this run does not park the issue.
          [ "$GO" = true ] || { echo "orchestrate: nothing was built on this run; no park mark"; exit 0; }
          # No PR for this head: mark it so the label loop stops. The sweep re-queues
          # it after 6 h, up to 3 tries.
          if gh pr list -R "$REPO" --head "orch/issue-$ISSUE" --state all --json number --jq 'length' | grep -qxE '[1-9][0-9]*'; then
            echo "orchestrate: #$ISSUE has a PR on orch/issue-$ISSUE; nothing to mark"
            exit 0
          fi
          # A PR on another branch (gate/*, claim/*) that closes the issue is GitHub's
          # own link, so the issue is not a dead end (fleet-ops#9278 item 4). Open and
          # merged PRs count; a closed unmerged one does not. Fail closed: a read that
          # fails or prints no count marks nothing.
          # shellcheck disable=SC2016 # $o, $r, $n are GraphQL variables
          [ "$(gh api graphql -F o="${REPO%/*}" -F r="${REPO#*/}" -F n="$ISSUE" -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){closedByPullRequestsReferences(first:1){totalCount}}}}' --jq '.data.repository.issue.closedByPullRequestsReferences.totalCount')" = 0 ] || { echo "orchestrate: #$ISSUE has a linked closing PR, or the link read failed; nothing to mark"; exit 0; }
          # A `due:` line still in the future is work nothing can build yet (fleet-ops#11014).
          # handoff-ended is what the sweep re-fires and what later-sweep skips, so such an
          # issue could never reach its date and a person had to clear the label. on-hold is not
          # in later-sweep's skip list, so that sweep promotes the issue when the date passes.
          # The pattern is later-sweep's own, so one line decides what "due" means in both places.
          due=$(gh issue view "$ISSUE" -R "$REPO" --json body --jq .body | jq -Rse --argjson now "$(date +%s)" '((try (capture("(?m)^due:[ \t]*(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})[ \t]+(?<t>[0-9]{2}:[0-9]{2})[ \t]+[Ii][Ss][Tt]") | .d + "T" + .t + ":00Z" | fromdateiso8601) catch null) // 0) - 19800 > $now') || due=false
          label=handoff-ended color=BFD4F2 desc="Orchestrator hand-off ended without a PR; the sweep re-queues it after 6 h" note="orchestrator hand-off ended without a PR: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          if [ "$due" = true ]; then label=on-hold color=EDDEDD desc="Parked until the issue's due: date; later-sweep promotes it" note="orchestrator: on hold until the due date in this issue; nothing can be built before it, so this hand-off stops here and later-sweep promotes it then"; fi
          # These writes need issues: write, which the App token holds.
          # --force makes the label idempotent on a newly stubbed repo (drive#199).
          gh label create "$label" -R "$REPO" --force --color "$color" --description "$desc"
          gh issue edit "$ISSUE" -R "$REPO" --add-label "$label" --remove-label needs-orchestrator
          gh issue comment "$ISSUE" -R "$REPO" --body "$note"
          echo "orchestrate: #$ISSUE marked $label (no PR)"
