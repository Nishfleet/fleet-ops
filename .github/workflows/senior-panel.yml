name: Senior panel

# The required check that blocks merge on `build:serious` PRs (fleet-ops #223).
#
# - No `build:serious` label  -> check is GREEN (trivial; no conference).
# - `build:serious` label     -> convene the three-seat senior-auditor
#   conference (GLM-5.2 devin / GLM-5.3 free / ds4-pro straitly):
#     * 2-of-3 APPROVE -> GREEN, verdicts posted as a PR comment.
#     * REJECT         -> RED, reject reasons posted.
#     * seats walled / conference cannot convene -> PENDING: the check
#       stays NOT-GREEN (fail-closed, never auto-green) and an escalation
#       is filed per #221.
# - Re-push re-runs the conference (trigger: synchronize).
#
# The conference runs in stub mode by default (deterministic, no network) so
# the gate/tally/verdict mechanics are proven in CI. Live mode activates when
# SENIOR_PANEL_BRIDGE_URL + SENIOR_PANEL_BRIDGE_TOKEN are configured: the
# workflow POSTs the context packet to a VPS bridge that convenes the real
# three-seat conference via the #146 pi-audit@ machinery. Until that bridge
# + the pi-audit@ template units land in main, live mode fails closed by
# design — a serious build is never auto-greened without the panel. This is
# the correct, safe state, not a gap.
#
# Making this check REQUIRED is the org ruleset (#185), not this workflow.
# Surface: gh CLI + GitHub REST API + the optional VPS bridge. No paid
# services from the workflow itself (the auditor seats are #146's budget).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: senior-panel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conference:
    name: Senior-auditor conference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for build:serious label
        id: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          has="$(gh pr view "$PR" -R "$REPO" --json labels -q '[.labels[].name] | any(. == "build:serious")')"
          echo "serious=$has" >> "$GITHUB_OUTPUT"
          if [ "$has" = "true" ]; then
            echo "build:serious present — convening conference"
          else
            echo "no build:serious label — trivial, check is green"
          fi

      - name: Convene conference
        if: steps.label.outputs.serious == 'true'
        id: conf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Live bridge (optional). Absent -> stub mode (fail-closed safe).
          SENIOR_PANEL_BRIDGE_URL: ${{ secrets.SENIOR_PANEL_BRIDGE_URL }}
          SENIOR_PANEL_BRIDGE_TOKEN: ${{ secrets.SENIOR_PANEL_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR" -R "$REPO" --json title,body,files,additions,deletions,closingIssuesReferences,createdAt)"
          diff="$(gh pr diff "$PR" -R "$REPO" 2>/dev/null | head -c 24000 || true)"
          changed_files="$(printf '%s' "$pr_json" | jq -c '[.files[].path]')"
          additions="$(printf '%s' "$pr_json" | jq -r '.additions')"
          deletions="$(printf '%s' "$pr_json" | jq -r '.deletions')"
          closing_number="$(printf '%s' "$pr_json" | jq -r '[.closingIssuesReferences[].number] | first // empty')"
          closing_body=""
          if [ -n "$closing_number" ]; then
            closing_body="$(gh issue view "$closing_number" -R "$REPO" --json body -q '.body' 2>/dev/null | head -c 8000 || true)"
          fi
          # Latest CI check runs on this PR's head (data gathering, not prose).
          ci_runs="$(gh api \
            "/repos/${REPO}/commits/${{ github.event.pull_request.head.sha }}/check-runs" \
            --paginate -q '[.check_runs[] | {name, conclusion, url: .html_url}]' 2>/dev/null || echo '[]')"

          # Triggers that labeled this PR (from the gate's verdict, re-derived
          # for the packet so auditors see WHY it was called).
          gate_packet="$(jq -c -n \
            --argjson changedFiles "$changed_files" \
            --argjson additions "$additions" \
            --argjson deletions "$deletions" \
            --argjson closingIssueLabels '[]' \
            --argjson claimDurationMinutes 'null' \
            '{changedFiles:$changedFiles, additions:$additions, deletions:$deletions, closingIssueLabels:$closingIssueLabels, claimDurationMinutes:$claimDurationMinutes}')"
          triggers="$(printf '%s' "$gate_packet" | node .github/scripts/seriousness-gate.mjs | jq -c '.triggers')"

          packet="$(jq -c -n \
            --arg repo "$REPO" \
            --argjson prNumber "$PR" \
            --arg prTitle "$(printf '%s' "$pr_json" | jq -r '.title')" \
            --arg prBody "$(printf '%s' "$pr_json" | jq -r '.body')" \
            --arg diff "$diff" \
            --argjson changedFiles "$changed_files" \
            --argjson additions "$additions" \
            --argjson deletions "$deletions" \
            --argjson closingIssueNumber "${closing_number:-null}" \
            --arg closingIssueBody "$closing_body" \
            --argjson ciCheckRuns "$ci_runs" \
            --argjson triggers "$triggers" \
            --arg headSha "${{ github.event.pull_request.head.sha }}" \
            '{repo:$repo, prNumber:$prNumber, prTitle:$prTitle, prBody:$prBody, diff:$diff, changedFiles:$changedFiles, additions:$additions, deletions:$deletions, closingIssueNumber:$closingIssueNumber, closingIssueBody:$closingIssueBody, ciCheckRuns:$ciCheckRuns, triggers:$triggers, headSha:$headSha}')"

          result="$(printf '%s' "$packet" | node .github/scripts/senior-panel-conference.mjs)"
          conf_result="$(printf '%s' "$result" | jq -r '.result')"
          escalated="$(printf '%s' "$result" | jq -r '.escalated')"
          # Write the comment to a file — never interpolate multi-line output
          # into run: (shell-injection / purity lint). Use --body-file below.
          printf '%s' "$result" | jq -r '.commentBody' > /tmp/senior-panel-comment.md
          {
            echo "result=$conf_result"
            echo "escalated=$escalated"
          } >> "$GITHUB_OUTPUT"

      - name: Post verdict comment
        if: steps.label.outputs.serious == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr comment "$PR" -R "$REPO" --body-file /tmp/senior-panel-comment.md

      - name: File escalation on pending
        if: steps.label.outputs.serious == 'true' && steps.conf.outputs.escalated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fail-closed: a pending conference is an escalation (#221), not a
          # green check. File a tracking issue so the stall is owned, not lost.
          cat > /tmp/senior-panel-escalation.md <<EOF
          The senior-auditor conference on PR #${PR} could not convene 2-of-3 (seats walled or bridge unavailable). The senior-panel check stays not-green until the panel reconvenes.

          blocked-on: Nishfleet/fleet-ops#146
          blocked-on: nish-decision

          PR: https://github.com/${REPO}/pull/${PR}
          EOF
          gh issue create -R "Nishfleet/fleet-ops" \
            --title "escalate-senior: senior-panel pending on ${REPO}#${PR}" \
            --label escalate-senior \
            --body-file /tmp/senior-panel-escalation.md \
            || echo "escalation issue create failed (label may not exist yet) — verdict comment posted on PR"

      - name: Set check outcome
        if: always()
        env:
          SERIOUS: ${{ steps.label.outputs.serious }}
          RESULT: ${{ steps.conf.outputs.result }}
        run: |
          set -euo pipefail
          # Trivial (no label) -> green. APPROVE -> green. REJECT/PENDING -> red.
          if [ "$SERIOUS" != "true" ]; then
            echo "trivial — green"; exit 0
          fi
          case "$RESULT" in
            APPROVE) echo "conference approved — green"; exit 0 ;;
            REJECT)  echo "conference rejected — red"; exit 1 ;;
            PENDING) echo "conference pending (fail-closed) — red, not green"; exit 1 ;;
            *)       echo "unexpected conference result: $RESULT — red"; exit 1 ;;
          esac
