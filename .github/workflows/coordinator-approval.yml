# Required check `coordinator-approval` (ruleset main-merge-queue). Success when the
# PR's current head has an APPROVED review from an approver and the approver has not
# since requested changes on it. The ruleset (dismiss_stale_reviews_on_push) dismisses
# reviews on a push, so a new head starts unapproved. Auto-merge, armed when the PR is
# opened, waits for this check like any other. Approvers: the review job's identity
# (agent.yml, GITHUB_TOKEN) and nish3451.
# A review written with GITHUB_TOKEN fires no pull_request_review, so `refresh` re-runs
# the head's check when an agent-dispatch run ends. For a pull_request_target run the
# workflow_run head_sha is the PR head (checked on a live run); an hourly schedule or
# manual sweep run re-runs every open PR head whose last check failed.
# Trust boundary, unchanged from the comment gate this replaces: any workflow a PR runs can
# write a check or a GITHUB_TOKEN review under these names, so a PR that adds or edits one is
# held to the review job's two reviewers of different model families (it is a workflow edit).
# The ruleset's own approving review is checked by GitHub, apart from this file. A queue
# entry only forms for a PR that already passed this check and the review, and a push
# removes it from the queue.
name: coordinator-approval
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
  workflow_run:
    workflows: [agent-dispatch]
    types: [completed]
permissions: {}
jobs:
  coordinator-approval:
    name: coordinator-approval
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    # A newer event for the same PR replaces an older run.
    concurrency:
      group: coordinator-approval-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - if: github.event_name == 'merge_group'
        run: echo "coordinator-approval is enforced on the pull request; the queue entry passes."
      - if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          APPROVERS: nish3451 github-actions[bot]
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" --jq '.[]' |
            jq -es --arg sha "$sha" --arg who "$APPROVERS" '
              [.[] | select(.commit_id == $sha and (.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED")))]
              | group_by(.user.login) | map(max_by(.submitted_at))
              | any(.[]; .state == "APPROVED" and (.user.login as $l | $who | split(" ") | index($l)))' ||
            { echo "::error::coordinator-approval: no approving review from $APPROVERS on $sha"; exit 1; }
  refresh:
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["pull_request_target","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event.workflow_run.event }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - run: |
          if [ "$EVENT" = pull_request_target ]; then shas=$SHA; else shas=$(gh pr list -R "$GITHUB_REPOSITORY" --json headRefOid --jq '.[].headRefOid'); fi
          for sha in $shas; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w coordinator-approval.yml -c "$sha" -e pull_request -L 1 --json databaseId,conclusion --jq '.[0] // empty')
            [ -n "$run" ] || continue
            id=$(jq -r .databaseId <<<"$run")
            if [ "$EVENT" = pull_request_target ]; then gh run watch "$id" -R "$GITHUB_REPOSITORY" > /dev/null || true; else [ "$(jq -r .conclusion <<<"$run")" = failure ] || continue; fi
            gh run rerun "$id" -R "$GITHUB_REPOSITORY"
          done
