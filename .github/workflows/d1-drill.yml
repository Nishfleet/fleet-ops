# Monthly restore drill (fleet-ops#9769). Reads each database's newest existing
# backup, restores it once into a local sqlite3 file and counts rows. It calls no
# Cloudflare API and uses no Cloudflare token (drill rules 1 to 5 in the issue).
name: D1 restore drill
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch: {}
concurrency: {group: d1-drill, cancel-in-progress: false}
permissions:
  contents: read
  issues: write
jobs:
  drill:
    name: drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore the newest backup of each database
        timeout-minutes: 15
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.D1_DRILL_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.D1_DRILL_R2_SECRET }}
          R2_ENDPOINT: ${{ secrets.D1_DRILL_R2_ENDPOINT }}
          DRIVE_TOKEN: ${{ secrets.D1_DRILL_DRIVE_TOKEN }}
          AGE_KEY: ${{ secrets.D1_DRILL_AGE_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -uo pipefail
          w=$RUNNER_TEMP/drill; mkdir -p "$w"; : > "$w/report.txt"
          trap 'rm -f "$w"/*.sql "$w"/*.age "$w"/*.zip "$w"/*.db' EXIT
          say() { echo "$*" | tee -a "$w/report.txt" >> "$GITHUB_STEP_SUMMARY"; }
          restore() { # name, dump: one pass, at most one retry, then per-table row counts
            local db=$w/$1.db t out=""
            sqlite3 -bail "$db" < "$2" || { rm -f "$db"; sqlite3 -bail "$db" < "$2"; } || { say "- $1: restore failed twice"; return; }
            for t in $(sqlite3 "$db" "select name from sqlite_master where type='table' and name not glob 'sqlite_*' and name not glob '_cf_*'"); do
              out+="$t=$(sqlite3 "$db" "select count(*) from \"$t\"") "
            done
            say "- $1: ${out:+ok, restored once, rows: ${out% }}${out:-restored but has no tables}; live count not run"
          }
          read -r key mod <<< "$(aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket seofixkit-backups --prefix d1/ --query 'sort_by(Contents,&LastModified)[-1].[Key,LastModified]' --output text 2>/dev/null)"
          if [ -n "${key:-}" ] && [ "$key" != None ] && aws s3 cp --only-show-errors --endpoint-url "$R2_ENDPOINT" "s3://seofixkit-backups/$key" "$w/seo.sql"; then
            say "- seo-fix-kit: ok, found newest backup $key, $(( ($(date +%s) - $(date -d "$mod" +%s)) / 86400 )) days old"
            restore seo-fix-kit "$w/seo.sql"
          else
            say "- seo-fix-kit: cannot read backup"
          fi
          api() { GH_TOKEN=$DRIVE_TOKEN gh api "$@"; }
          if [ -z "$AGE_KEY" ]; then
            say "- drive: cannot decrypt (no age key)"
          elif id=$(api 'repos/Nishfleet/drive/actions/artifacts?name=d1-backup&per_page=1' -q '.artifacts[0].id // empty') && [ -n "$id" ] \
              && api "repos/Nishfleet/drive/actions/artifacts/$id/zip" > "$w/drive.zip" && unzip -oq "$w/drive.zip" -d "$w"; then
            sudo apt-get update -qq && sudo apt-get install -y -qq age > /dev/null
            for f in "$w"/*.sql.age; do
              n=$(basename "$f" .sql.age)
              if age -d -i <(printf '%s\n' "$AGE_KEY") -o "${f%.age}" "$f"; then restore "drive-${n%-*}" "${f%.age}"; else say "- drive-${n%-*}: cannot decrypt"; fi
            done
          else
            say "- drive: cannot read backup"
          fi
          for l in "siterep-public: no backup" "aiconverter-app: no backup" "TinyStudio.io-public: no backup" "0509: no export backup" "mailbox: no D1 database found"; do say "- $l"; done
      - name: Open or update the one findings issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=$RUNNER_TEMP/drill/report.txt; t='D1 restore drill: findings'
          [ -s "$f" ] || echo "- the drill wrote no report" > "$f"
          grep -qv ': ok,' "$f" || exit 0
          { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; cat "$f"; } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --state open --search "\"$t\" in:title" --json number,title -q "map(select(.title==\"$t\"))[0].number // empty")
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "$RUNNER_TEMP/body.md"; else gh issue create --title "$t" --body-file "$RUNNER_TEMP/body.md"; fi
