name: Auto revert

# Reversibility over gating (Nish, canonical): a merge must be as undoable as
# a deploy. When a push-to-main CI workflow goes red, this opens a revert PR
# that restores the last green state with no human. Platform primitives only:
# `workflow_run` fires on completion; `git revert` builds the undo; armed
# auto-merge lands it only if the four required checks pass on the revert
# (restoring green IS the proof the revert is correct). Git itself is the
# record of last-good — no SHA ledger, no state file, no polling.
#
# One level of automatic undo only. If the revert commit itself is red on
# main, the loop guard files a loud halt issue and stops: a red revert is a
# structural problem, not a loop. If something else landed between the failing
# commit and now, the freshness guard files a halt issue naming both SHAs and
# stops: that is a human-order problem.
#
# The PR is opened with an installation token minted from the nishfleet-worker
# GitHub App (org-wide install, contents/issues/pull-requests:write). A PR
# opened by GITHUB_TOKEN would not itself trigger `pull_request` workflows, so
# the four required checks would not report on the revert PR and armed
# auto-merge would not fire. The App token (a real actor, not GITHUB_TOKEN)
# makes the revert PR trigger its own checks and lets armed auto-merge land it.
# The App also carries issues:write, which the old AUTO_REVERT_PAT lacked —
# without it the halt path could not post comments (403 addComment, run
# 33043774694). If the App secrets are missing the job falls back to
# GITHUB_TOKEN: the mechanism still builds and opens the correct revert, but
# halt comments and self-triggered checks will not fire. That is flagged, not
# silent.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Parallel failures serialize: two red workflows for the same push (or two
# pushes close together) must not race to revert. One at a time, in arrival
# order; the freshness guard handles whatever landed in between.
concurrency:
  group: auto-revert
  cancel-in-progress: false

jobs:
  auto-revert:
    name: auto-revert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout main (full history for the revert)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Mint nishfleet-worker App installation token
        id: app-token
        # Mints a ≤1h installation token for the nishfleet-worker GitHub App
        # (app id 4728578, org-wide install under Nishfleet). The App carries
        # contents/issues/pull-requests:write — the scopes the old
        # AUTO_REVERT_PAT lacked (issues:write), which broke halt comments
        # (403 addComment, run 33043774694). continue-on-error lets a missing
        # or expired App secret degrade to GITHUB_TOKEN below (the old
        # loud-but-no-comment shape) instead of crashing the whole job.
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
          private-key: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Revert or halt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/auto-revert.sh
