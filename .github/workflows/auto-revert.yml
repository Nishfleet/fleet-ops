name: Auto revert

# Reversibility over gating (Nish, canonical): a merge must be as undoable as
# a deploy. When a push-to-main CI workflow goes red, this opens a revert PR
# that restores the last green state with no human. Platform primitives only:
# `workflow_run` fires on completion; `git revert` builds the undo; armed
# auto-merge lands it only if the four required checks pass on the revert
# (restoring green IS the proof the revert is correct). Git itself is the
# record of last-good — no SHA ledger, no state file, no polling.
#
# One level of automatic undo only. If the revert commit itself is red on
# main, the loop guard files a loud halt issue and stops: a red revert is a
# structural problem, not a loop. If something else landed between the failing
# commit and now, the freshness guard files a halt issue naming both SHAs and
# stops: that is a human-order problem.
#
# The PR is opened with the workflow's GITHUB_TOKEN. NOTE: a PR opened by
# GITHUB_TOKEN does not itself trigger `pull_request` workflows, so the four
# required checks will not report on the revert PR and armed auto-merge will
# not fire until a PAT (secret AUTO_REVERT_PAT) is wired in. Until then the
# PR sits open and loud — the mechanism still builds and opens the correct
# revert; a human (or the PAT) lands it. This is flagged, not silent.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Parallel failures serialize: two red workflows for the same push (or two
# pushes close together) must not race to revert. One at a time, in arrival
# order; the freshness guard handles whatever landed in between.
concurrency:
  group: auto-revert
  cancel-in-progress: false

jobs:
  auto-revert:
    name: auto-revert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout main (full history for the revert)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Revert or halt
        env:
          GH_TOKEN: ${{ secrets.AUTO_REVERT_PAT || secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/auto-revert.sh
