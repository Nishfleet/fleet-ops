# Reusable auto-merge arm. Callers keep the pull_request trigger and pass the
# nishfleet-worker App secrets explicitly (not secrets: inherit).
#
#   jobs:
#     arm:
#       uses: Nishfleet/fleet-ops/.github/workflows/reusable-auto-merge-arm.yml@main
#       secrets:
#         NISHFLEET_WORKER_APP_ID: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
#         NISHFLEET_WORKER_PRIVATE_KEY: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
#
# Arms under a nishfleet-worker App installation token, not GITHUB_TOKEN and
# not a human PAT (fleet-ops#1469):
#   - GITHUB_TOKEN would not trigger push workflows on main (deploy
#     verification, auto-revert), silently disarming the safety net.
#   - A human PAT (the old AUTO_REVERT_PAT) made Nish the triggering actor of
#     every merge, so GitHub emailed him one failure notice per red workflow
#     per merge (30+ hand-deleted on 2026-08-28). The App is the actor now;
#     failure notices stop reaching Nish.
# The App token is a real actor (like the PAT) so push workflows still fire.
# If the App secrets are missing the mint fails LOUD and the PR waits for a
# human — the correct fallback. There is NO GITHUB_TOKEN fallback here: a
# silent merge under GITHUB_TOKEN is exactly the disarmed-safety-net case the
# token choice exists to prevent.
#
# fleet-ops#1457 (stop-the-line): before arming, this workflow checks for an
# open `stop-the-line` issue in the repo. The detector opens the issue when
# the same workflow has failed on consecutive main commits (the HALT
# condition auto-revert already publishes) and closes it on the next green
# run of THAT workflow. While the issue is open, this step refuses to arm
# auto-merge on any new PR — the line is mechanically frozen. CI on the PR
# continues to run and report (no change there); only the actual merge is
# gated. A human can still merge via the green button when the issue is
# open, or wait for the next green run that closes the issue (no human step
# required for the auto-unfreeze). The state of the line is visible to
# operators in the same place every other halt already lives — the GitHub
# issue tracker — so the alert path is unchanged.
#
# fleet-ops#3532 (quality ratchet): a second check refuses to arm when the
# repo's measured quality metric is above the ceiling committed in
# fleet-ops config/quality-ratchet.json — stop-the-line: quality ceiling
# breached. The metric definition is lib/fleet-product-slo.py
# --repo-check, the same code the fleet-metrics exporter runs, fetched at
# the fleet-ops ref this workflow file came from. A fetch/measure fault
# warns and arms (fail-open, same as the freeze gate).

name: Reusable auto-merge arm

on:
  workflow_call:
    secrets:
      NISHFLEET_WORKER_APP_ID:
        required: false
      NISHFLEET_WORKER_PRIVATE_KEY:
        required: false

permissions:
  issues: read

jobs:
  arm:
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[no-merge]') &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'no-auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the PR head with full history so the merge-trample gate
      # (below) can compute the PR's effective diff-to-main. The arm itself
      # needs no workspace, but the gate is a git-diff evaluator.
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # ---- stop-the-line check (fleet-ops#1457) ----------------------------
      # A freeze (the HALT verdict persists and no later green has cleared
      # it) is observed by an OPEN `stop-the-line` issue. Reading the issue
      # list is cheap and labels-first so a single query handles any number
      # of historic halts. If we miss the issue (label never stuck, GitHub
      # search edge case) the title-based dedup in the detector covered the
      # same family in fleet-ops#596 and #1059; we mirror that by including
      # the literal string "stop-the-line: " in the title search.
      - name: Check stop-the-line (freeze gate)
        id: freeze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh issue list --repo "${{ github.repository }}" \
                --state open --limit 100 \
                --search "stop-the-line: in:title frozen in:title" \
                --json number --jq 'length' 2>/dev/null | grep -qE '^([1-9][0-9]*)$'; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "stop-the-line: an open stop-the-line issue is freezing this repo (fleet-ops#1457); auto-merge arming skipped"
            exit 0
          fi
          echo "frozen=false" >> "$GITHUB_OUTPUT"

      # ---- quality ceiling check (fleet-ops#3532) -------------------------
      # Per-repo quality ceilings are committed in fleet-ops
      # config/quality-ratchet.json (.ceilings, repo row else _default); the
      # measurement is the same code the fleet-metrics exporter runs —
      # lib/fleet-product-slo.py --repo-check — fetched at the exact
      # fleet-ops ref this workflow file came from (github.workflow_sha), so
      # gate, metric definition, and ceiling can never drift apart.
      # fleet-ops is public, so raw.githubusercontent.com fetch needs no
      # token and no extra permission. A metric enforces only when a
      # measurement source exists (today: reverts_per_100_merges;
      # red_on_main_minutes lands with fleet-ops#3534 and is reported as
      # unmeasured until then). A fetch or measure failure warns and arms —
      # fail-open, the same posture as the freeze gate above.
      - name: Check quality ceiling
        id: quality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          FLEET_OPS_REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$REPO_NAME" ]; then
            echo "::warning::quality ceiling check has no repo name — arming proceeds (fail-open)"
            echo "breached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://raw.githubusercontent.com/Nishfleet/fleet-ops/${FLEET_OPS_REF}"
          if ! curl -fsSL --retry 2 -o "$tmp/quality-ratchet.json" "$base/config/quality-ratchet.json" \
            || ! curl -fsSL --retry 2 -o "$tmp/fleet-product-slo.py" "$base/lib/fleet-product-slo.py"; then
            echo "::warning::quality ceiling fetch failed — arming proceeds (fail-open, mirrors the freeze gate)"
            echo "breached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict="$(
            FLEET_QUALITY_RATCHET_JSON="$tmp/quality-ratchet.json" \
            FLEET_PRODUCT_SLO_ORG="$REPO_OWNER" \
            python3 "$tmp/fleet-product-slo.py" --repo-check "$REPO_NAME" \
              2>"$tmp/repo-check.err" || true
          )"
          if [ -z "$verdict" ] || ! jq -e . >/dev/null 2>&1 <<<"$verdict"; then
            echo "::warning::quality ceiling check failed: $(cat "$tmp/repo-check.err") — arming proceeds (fail-open)"
            echo "breached=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          breached="$(jq -r '.breached | join(", ")' <<<"$verdict")"
          if [ -n "$breached" ]; then
            detail="$(jq -r '[.breached[] as $m | "\($m) measured \(.measured[$m]) > ceiling \(.ceiling[$m])"] | join("; ")' <<<"$verdict")"
            echo "stop-the-line: quality ceiling breached ($detail); auto-merge arming skipped (fleet-ops#3532)"
            echo "breached=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "quality: $(jq -c . <<<"$verdict")"
          echo "breached=false" >> "$GITHUB_OUTPUT"

      # ---- merge-trample gate (fleet-ops#1229) ----------------------------
      # A PR whose merge diff deletes paths its own commits never modified
      # (ghost), or that deletes files its merge-base just added while also
      # changing other files (the #1228 worktree-gap class), must not
      # auto-merge even if the heartbeat path is down. This step makes the
      # gate a real required check: a REJECT exits 1, failing the job so the
      # PR cannot land. The gate binary and its library are fetched at the
      # exact fleet-ops ref this workflow file came from (github.workflow_sha)
      # so gate and definition can never drift apart. A fetch/interop failure
      # warns and arms — fail-open, the same posture as the freeze and quality
      # gates above; only an actual REJECT fails closed.
      - name: Check merge-trample gate
        id: trample
        env:
          FLEET_OPS_REF: ${{ github.workflow_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch -q origin main:refs/remotes/origin/main
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://raw.githubusercontent.com/Nishfleet/fleet-ops/${FLEET_OPS_REF}"
          if ! curl -fsSL --retry 2 -o "$tmp/fleet-merge-trample-gate" "$base/bin/fleet-merge-trample-gate" \
            || ! curl -fsSL --retry 2 -o "$tmp/merge-trample-gate.py" "$base/lib/merge-trample-gate.py"; then
            echo "::warning::merge-trample gate fetch failed — arming proceeds (fail-open, mirrors the freeze/quality gates)"
            echo "trampled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x "$tmp/fleet-merge-trample-gate"
          if ! MERGE_TRAMPLE_GATE_LIB="$tmp/merge-trample-gate.py" \
              "$tmp/fleet-merge-trample-gate" evaluate \
              --repo "$GITHUB_WORKSPACE" \
              --base origin/main \
              --head "$PR_HEAD" \
              --title "$PR_TITLE" \
              --head-ref "$PR_HEAD_REF" >/dev/null 2>&1; then
            echo "::error::merge-trample REJECT (fleet-ops#1229) — this PR's merge diff deletes paths its own commits never touched; auto-merge not armed"
            echo "trampled=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "trampled=false" >> "$GITHUB_OUTPUT"

      - name: Mint nishfleet-worker App installation token
        id: app-token
        # Mints a ≤1h installation token for the nishfleet-worker GitHub App
        # (app id 4728578, org-wide install under Nishfleet). The App carries
        # contents/pull-requests:write — enough to arm auto-merge — and is a
        # real actor, so a merge under this token triggers push workflows on
        # main (deploy verification, auto-revert), unlike GITHUB_TOKEN. No
        # continue-on-error and no GITHUB_TOKEN fallback: a missing or expired
        # App secret must fail LOUD so the PR waits for a human rather than
        # silently merging under a token that disarms the safety net
        # (fleet-ops#1469). Same action pin as the auto-revert path.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
          private-key: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      # ---- gate-integrity arm guard (fleet-ops#5238) ----------------------
      # gate-integrity is advisory — not a required context — so
      # `--auto --squash` merges past a red verdict the moment required
      # checks pass (#5207 landed a ci.yml edit with gate-integrity
      # FAILURE). This step refuses to arm when the PR's diff touches
      # gate-owned paths and the head's `gate-integrity` check is not
      # green. The refusal is non-sticky: a green verdict re-arms on the
      # next pull_request event or the hourly tier1 queue pass.
      # Guard, lib and the shared gate-glob config loader are fetched at
      # the exact fleet-ops ref this workflow file came from
      # (github.workflow_sha) so gate and definition cannot drift apart;
      # the repo's own .fleet/gate-integrity.yml at the PR base ref
      # supplies the glob set (base-owned rules judge the PR), defaulting
      # to the loader's built-ins when absent. Reads run under the
      # nishfleet-worker App token so callers need no extra permissions.
      # A fetch/eval fault warns and arms — fail-open, the same posture
      # as the freeze/quality gates; only an actual refuse verdict gates.
      - name: Check gate-integrity verdict on gate-path PRs
        id: gateint
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FLEET_OPS_REF: ${{ github.workflow_sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # GitHub wraps this in `bash -e`. A refuse is exit 1, which
          # would fail the required `arm` check and freeze the PR
          # (live: run 34557585569 on #5264). Turn -e off first.
          # The only payload is a clean `verdict=="refuse"`. Every
          # helper fault warns and leaves gated=false (fail-open).
          set +e
          echo "gated=false" >> "$GITHUB_OUTPUT"
          set -uo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::gate-arm guard has no App token — arming proceeds (fail-open; the mint step already fails loud when secrets are absent)"
            exit 0
          fi
          base="https://raw.githubusercontent.com/Nishfleet/fleet-ops/${FLEET_OPS_REF}"
          ok=1
          curl -fsSL --retry 2 -o "$tmp/fleet-gate-arm-guard" "$base/bin/fleet-gate-arm-guard" || ok=0
          curl -fsSL --retry 2 -o "$tmp/gate-arm-guard.py" "$base/lib/gate-arm-guard.py" || ok=0
          curl -fsSL --retry 2 -o "$tmp/gate-integrity-config.sh" "$base/lib/gate-integrity-config.sh" || ok=0
          if [ "$ok" -eq 0 ]; then
            echo "::warning::gate-arm guard fetch failed — arming proceeds (fail-open, mirrors the freeze/quality gates)"
            exit 0
          fi
          chmod +x "$tmp/fleet-gate-arm-guard"
          if ! gh api "repos/${{ github.repository }}/contents/.fleet/gate-integrity.yml?ref=$BASE_REF" \
                --jq '.content' 2>/dev/null | base64 -d > "$tmp/repo-gate.yml" 2>/dev/null; then
            : > "$tmp/repo-gate.yml"
          fi
          globs="$(bash "$tmp/gate-integrity-config.sh" "$tmp/repo-gate.yml" 2>/dev/null | jq -c '.gate_globs' 2>/dev/null)"
          if [ -z "$globs" ]; then
            echo "::warning::gate-glob resolution failed — arming proceeds (fail-open)"
            exit 0
          fi
          GATE_ARM_GUARD_LIB="$tmp/gate-arm-guard.py" \
            "$tmp/fleet-gate-arm-guard" evaluate \
              --repo "${{ github.repository }}" --pr "$PR_NUM" \
              --globs-json "$globs" --wait-seconds 90 \
              > "$tmp/verdict.json" 2> "$tmp/verdict.err" || true
          cat "$tmp/verdict.json" 2>/dev/null || true
          cat "$tmp/verdict.err" >&2 || true
          if jq -e '.verdict == "refuse"' "$tmp/verdict.json" >/dev/null 2>&1; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
            echo "gate-integrity is not green on a gate-path PR; auto-merge arming skipped (fleet-ops#5238) — a green verdict re-arms on the next pull_request event or the hourly queue pass"
            # A worker may already have armed via `gh pr merge --auto`.
            # GitHub auto-merge waits only on required checks, so leaving
            # that arm in place is the #5207 escape. Disarm is the teeth;
            # --disable-auto on a PR that was never armed is a no-op.
            gh pr merge "$PR_NUM" --disable-auto --repo "${{ github.repository }}" >/dev/null 2>&1 || true
            exit 0
          fi
          jq -e '.verdict == "arm"' "$tmp/verdict.json" >/dev/null 2>&1 \
            || echo "::warning::gate-arm guard produced no verdict — arming proceeds (fail-open)"

      - name: Arm auto-merge
        if: steps.freeze.outputs.frozen == 'false' && steps.quality.outputs.breached == 'false' && steps.trample.outputs.trampled == 'false' && steps.gateint.outputs.gated == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::nishfleet-worker App token is not configured — auto-merge not armed; this PR waits for a human"
            exit 1
          fi
          gh pr merge "$PR" --auto --squash --repo "${{ github.repository }}"
