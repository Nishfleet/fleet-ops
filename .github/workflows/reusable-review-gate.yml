# Reusable review gate — rationed deep PR review with budget backpressure.
#
# Deep PR review is rationed: Greptile Starter gives ~50 reviews a month for the
# whole GitHub account. A repo can open far more PRs than that, so reviewing
# everything was never possible. Reviews are opt-in via the `review:deep` label;
# this workflow decides when to add it.
#
# Backpressure: as the month's budget depletes, the bar rises.
#   under 50% spent   ->  label high-risk and critical PRs
#   50-85% spent      ->  label critical PRs only (money, secrets, auth, data)
#   over 85% spent    ->  label nothing; add `review:deep` by hand to override
#
# MONTHLY_CAP is per-repo on purpose. GITHUB_TOKEN is scoped to the calling
# repository, so a cross-repo count would silently miss private repos and
# over-spend. Keep the caps across all gated repos summing to less than 50.
#
# Call from a consumer:
#   jobs:
#     review-gate:
#       uses: Nishfleet/fleet-ops/.github/workflows/reusable-review-gate.yml@main
#       with:
#         monthly-cap: "30"
#         deep-label: "review:deep"
#       secrets: inherit
#
# Same-repo callers use ./.github/workflows/reusable-review-gate.yml (this commit).
#
# Standing CI standard (vault global-standing-rules.md), by construction:
#   1. timeout-minutes on the job.
#   2. no required-context hazard: this job labels PRs, it does not gate merges.
#   3. budget backpressure is a function of the PR's own risk + the month's
#      spend so far — never a global lock every PR must edit (ci-standard.md
#      "Required checks are pure").
#   4. no CI that watches CI.

name: Reusable review gate

on:
  workflow_call:
    inputs:
      monthly-cap:
        description: "Per-repo monthly cap on review:deep labels. Keep the sum across gated repos < 50."
        type: string
        required: false
        default: "30"
      deep-label:
        description: "Label that triggers a deep review. Default review:deep."
        type: string
        required: false
        default: "review:deep"
      timeout-minutes:
        description: "Job timeout."
        type: number
        required: false
        default: 10

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: github.event.pull_request.draft == false
    steps:
      - name: Decide whether this PR earns a review
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MONTHLY_CAP: ${{ inputs.monthly-cap }}
          DEEP_LABEL: ${{ inputs.deep-label }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | [.filename, .additions, .deletions] | @tsv' > files.tsv || true

          MONTH_START="$(date -u +%Y-%m-01)"
          SPENT="$(gh api -X GET search/issues \
            -f "q=repo:$REPO is:pr label:${DEEP_LABEL} created:>=$MONTH_START" \
            --jq '.total_count' 2>/dev/null || echo 0)"
          echo "spent=$SPENT" >> "$GITHUB_OUTPUT"

          SPENT="$SPENT" MONTHLY_CAP="$MONTHLY_CAP" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          # Things that lose money, leak data, or break the deploy if they are wrong.
          CRITICAL = (
              "auth", "oauth", "session", "password", "secret", "token", "credential",
              "permission", "rbac", "billing", "payment", "stripe", "checkout",
              "subscription", "invoice", "refund", "migration", "migrations",
              "/schema", "d1/", "prisma/", "drizzle/", ".github/workflows/",
          )
          # True of nearly every file in a Cloudflare app, so only meaningful in bulk.
          BROAD = ("api/", "server/", "worker", "wrangler", "middleware", "deploy", "release")
          LOCKFILES = ("package-lock.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock")
          DOCS = {".md", ".mdx", ".txt", ".rst", ".adoc"}

          rows = [r.split("\t") for r in Path("files.tsv").read_text().splitlines() if r.strip()]
          rows = [(r[0], int(r[1]), int(r[2])) for r in rows if len(r) >= 3]
          names = [r[0] for r in rows]
          churn = sum(a + d for _, a, d in rows)
          lower = [n.lower() for n in names]

          def any_hit(hints):
              return [n for n in lower if any(h in n for h in hints)]

          critical = any_hit(CRITICAL)
          broad = any_hit(BROAD)
          locks = any_hit(LOCKFILES)

          if not names:
              level, why = "low", "no files changed"
          elif all(Path(n).suffix.lower() in DOCS for n in names):
              level, why = "low", "docs only"
          elif locks and len(names) <= 3:
              # A dependency bump is mechanical; the lockfile diff teaches a reviewer nothing.
              level, why = "normal", "dependency bump only"
          elif critical:
              level, why = "critical", "touches " + ", ".join(sorted(set(critical))[:3])
          elif len(names) >= 25 or churn >= 2000:
              level, why = "high", f"large diff: {len(names)} files, {churn} lines"
          elif broad and churn >= 400:
              level, why = "high", f"substantial server-side change: {churn} lines"
          else:
              level, why = "normal", "ordinary diff"

          spent = int(os.environ.get("SPENT") or 0)
          cap = int(os.environ.get("MONTHLY_CAP") or 30)
          ratio = spent / cap if cap else 1.0

          if ratio < 0.5:
              bar = {"critical", "high"}
          elif ratio < 0.85:
              bar = {"critical"}
          else:
              bar = set()

          spend = level in bar
          print(f"level={level}")
          print(f"why={why}")
          print(f"spend={'yes' if spend else 'no'}")
          print(f"budget={spent}/{cap}")
          PY

      - name: Request deep review
        if: steps.gate.outputs.spend == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DEEP_LABEL: ${{ inputs.deep-label }}
          LEVEL: ${{ steps.gate.outputs.level }}
          WHY: ${{ steps.gate.outputs.why }}
          BUDGET: ${{ steps.gate.outputs.budget }}
        run: |
          gh label create "$DEEP_LABEL" --repo "$REPO" --color B60205 \
            --description "High-risk diff: spend a rationed AI review here" --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$REPO" --add-label "$DEEP_LABEL"
          echo "::notice::Deep review requested (${LEVEL}) — ${WHY}. Budget ${BUDGET}."

      - name: Explain the skip
        if: steps.gate.outputs.spend != 'yes'
        env:
          LEVEL: ${{ steps.gate.outputs.level }}
          WHY: ${{ steps.gate.outputs.why }}
          BUDGET: ${{ steps.gate.outputs.budget }}
          DEEP_LABEL: ${{ inputs.deep-label }}
        run: |
          echo "::notice::No deep review — ${LEVEL}: ${WHY}. Budget ${BUDGET}. Add the ${DEEP_LABEL} label by hand to override."
