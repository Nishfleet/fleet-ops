on: workflow_call
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      # fleet-ops#8724: the router config's hard rules (no bench list, per-row cooldown_time <=900 s,
      # router cooldown <=60 s) live in the schema; each rejects/ file breaks one and must fail.
      - run: |
          pipx run check-jsonschema==0.38.2 --schemafile config/litellm-proxy.schema.json config/litellm-proxy.yaml
          for f in config/litellm-proxy.schema.rejects/*.yaml; do
            ! pipx run check-jsonschema==0.38.2 --schemafile config/litellm-proxy.schema.json "$f" || { echo "schema accepted $f"; exit 1; }
          done
      - run: pipx install semgrep==1.170.0
      # No glue (Nish 2026-09-29; 0509 reads no-glue.yml by URL), no host cua-driver plus its fixtures (#9297).
      - run: semgrep scan --config .semgrep/no-glue.yml --config .semgrep/no-host-cua-driver.yml --metrics=off --error && semgrep --test --metrics=off --config .semgrep/no-host-cua-driver.yml .semgrep/no-host-cua-driver.txt
      - name: No agent attribution in the PR's commits or body
        # pull_request only: GitHub's squash adds a Co-authored-by line, failing merge_group (#9205, #9240).
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          log=$(git log --format=%B "$BASE_SHA..$HEAD_SHA")
          ! printf '%s\n%s\n' "$log" "$PR_BODY" | grep -iEn '^(co-authored-by|claude-session):|^[^[:alpha:]]*generated with'
      - name: A new component links a design note
        # Design-it-twice (#10556): a PR that adds a unit, quadlet or Pi extension carries `design-note: docs/design/<file>.md` (or a URL).
        if: github.event_name == 'pull_request'
        env: {BASE_SHA: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}", PR_BODY: "${{ github.event.pull_request.body }}"}
        shell: bash
        run: |
          new=$(git diff --name-only --diff-filter=A --no-renames "$BASE_SHA...$HEAD_SHA")
          grep -E '^(systemd/[^/]+\.(service|timer|socket)|containers/quadlet/[^/]+\.container|pi-extensions/[^/]+/package\.json)$' <<<"$new" >/dev/null || exit 0
          n=$(sed -nE 's/\r?$//; s/^design-note: *//p' <<<"$PR_BODY"); n=${n%%$'\n'*}
          [[ $n == https://* || ( $n == docs/design/*.md && -f $n ) ]] || { echo "::error::new component: add a line 'design-note: docs/design/<file>.md' (or a URL) to the PR body"; exit 1; }
      - name: No long-lived PAT in any workflow
        run: "! grep -rEn 'secrets\\.[A-Za-z_][A-Za-z0-9_]*PAT\\b' .github/workflows/"
      - name: No secret variable expanded into an output command
        # fleet-ops#7381: `${TOKEN:-EMPTY}` printed the live App token into a transcript.
        # Scans the surfaces an agent reads or runs; tests/ drills and .fleet/ corpora are not scanned.
        # grep rc 1 is clean; rc 2 (a broken pattern) must fail too.
        run: |
          rc=0
          grep -rEn --exclude-dir=.git "$SPAT" \
            AGENTS.md README.md prompts systemd rootfs ansible config template docs .github credentials || rc=$?
          test "$rc" -eq 1
        env:
          SPAT: (echo|printf|printenv|console\.(log|error|warn|info))[^|;]*(\$\{?|process\.env\.)([A-Za-z_][A-Za-z0-9_]*(TOKEN|SECRET|PASS(WORD|WD)?|CREDENTIALS?|PRIVATE|_KEY)[A-Za-z0-9_]*|SK_[A-Z][A-Z0-9_]*)
      # the gates below are independent linters: `if: always()` lists every violated gate.
      - name: actionlint over .github/workflows/
        if: always()
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: zizmor over .github/workflows/
        # Stock security audit for workflows: dangerous triggers, template injection, persisted
        # credentials, unpinned actions, over-broad permissions and App tokens. Offline: no token, cannot
        # hang on API rate limits. Nishfleet/0509#5843 adds the same image.
        # Policy and its kept exceptions: .github/zizmor.yml.
        if: always()
        uses: docker://ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
        with:
          args: --offline --format plain .github/workflows
      - name: shellcheck over shell files (extension + shebang discovery)
        if: always()
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          version: v0.11.0
