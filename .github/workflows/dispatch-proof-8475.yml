# TEMPORARY: live proof for fleet-ops#8475, deleted before its PR opens.
# The opus-size job's dispatch step runs with GH_TOKEN=github.token, the token
# class this proves: workflow_dispatch is the documented trigger GITHUB_TOKEN
# may start. The step body below is opus-size's step body verbatim, with
# inputs.issue standing in for github.event.issue.number and --ref pointing at
# the claim branch (production has no --ref; the claim branch is where the
# change lives until it merges).
name: dispatch-proof-8475
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to hand to agent-dispatch, exactly as opus-size does'
        required: true
        type: string
permissions:
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent-dispatch.yml -R "$GITHUB_REPOSITORY" --ref claim/issue-8475 -f issue=${{ inputs.issue }}
