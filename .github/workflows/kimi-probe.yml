# The evidence for switching the grade back to Kimi. Cursor's Kimi hit its
# usage limit on 2026-09-28 (grade.yml runs Devin until the cycle resets on
# 2026-10-25). One tiny Kimi call a day: a green run means Kimi answers again,
# so set vars.GRADE_ENGINE to kimi (opus-vet and opus-size follow it) and flip
# grade.yml's engine default. The job stops calling once vars.GRADE_ENGINE is
# kimi (the real graders are the evidence) or vars.GRADER is no longer kimi.
name: kimi-probe
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: kimi-probe
  cancel-in-progress: false
jobs:
  probe:
    name: probe
    if: vars.GRADER == 'kimi' && vars.GRADE_ENGINE != 'kimi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Install the Cursor CLI
        run: |
          curl -fsS https://cursor.com/install -o "$RUNNER_TEMP/cursor-install.sh"
          bash "$RUNNER_TEMP/cursor-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ask Kimi K3 Max for one word
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          out=$(cursor-agent -p --output-format text --model kimi-k3-max --trust "Reply with the single word: ok")
          echo "$out"
          grep -qixE '[[:space:]]*ok[[:punct:]]*[[:space:]]*' <<<"$out"
