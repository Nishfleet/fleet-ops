# Reusable auto-enqueue — declarative, no-polling backstop that arms the merge
# queue for fleet-authored PRs once their required checks pass.
#
# The primary arm is reusable-auto-merge-arm.yml, which arms `gh pr merge --auto`
# on PR open. This workflow is the BACKSTOP for the case that path misses: a PR
# whose arm step was skipped (transient API error, race with label add) and is
# now sitting green-but-unqueued. It fires on `check_suite` completion and on
# `pull_request` ready_for_review/reopened, re-arming green fleet PRs that are
# not yet queued.
#
# This is the event-driven half of the auto-enqueue standard (Nish, 2026-08-25):
# "green PRs must enter the merge queue automatically, no orchestrator hand
# needed." The weekly standards-sync sweep is the catch-all for anything the
# event path missed (amendment 2 part c).
#
# Merge method:
#   - repos with a merge queue enabled  -> `gh pr merge --squash` (adds to queue)
#   - repos without a merge queue        -> `gh pr merge --auto --squash` (arms)
#   The workflow probes the repo's merge_queue setting and picks accordingly,
#   so the same caller works on both shapes.
#
# Exceptions honored (never queued here):
#   - draft PRs
#   - PRs with the `no-auto-merge` label
#   - PRs whose title contains `[no-merge]`
#   - fork PRs (head.repo.full_name != repository) — untrusted head
#   - non-fleet authors when fleet-only is set (default: queue any non-fork)
#
# Call from a consumer:
#   on:
#     pull_request:
#       types: [ready_for_review, reopened]
#     check_suite:
#       types: [completed]
#   jobs:
#     auto-enqueue:
#       uses: Nishfleet/fleet-ops/.github/workflows/reusable-auto-enqueue.yml@main
#       secrets:
#         AUTO_REVERT_PAT: ${{ secrets.AUTO_REVERT_PAT }}
#
# Same-repo callers use ./.github/workflows/reusable-auto-enqueue.yml (this commit).
#
# Standing CI standard (vault global-standing-rules.md), by construction:
#   1. timeout-minutes on the job.
#   2. declarative event-driven, no polling, no sleep loops.
#   3. idempotent — re-arming an already-armed/queued PR is a no-op.
#   4. never queues a fork PR or a draft.
#   5. no CI that watches CI.

name: Reusable auto-enqueue

on:
  workflow_call:
    inputs:
      fleet-only:
        description: "When true, only queue PRs whose author login is in fleet-authors (comma-separated). Default false: queue any non-fork PR."
        type: boolean
        required: false
        default: false
      fleet-authors:
        description: "Comma-separated logins allowed when fleet-only is true. Nish's login + fleet bots."
        type: string
        required: false
        default: "nish3451,github-actions[bot],app/dependabot"
      no-merge-label:
        description: "Label that disables auto-enqueue for a PR."
        type: string
        required: false
        default: "no-auto-merge"
      timeout-minutes:
        description: "Job timeout."
        type: number
        required: false
        default: 5
    secrets:
      AUTO_REVERT_PAT:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Resolve target PR(s) from the event
        id: targets
        env:
          GH_TOKEN: ${{ secrets.AUTO_REVERT_PAT }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SUITE_PR_NUMBERS: ${{ toJSON(github.event.check_suite.pull_requests.*.number) }}
        run: |
          set -euo pipefail
          # Emit one PR number per line to targets.txt. pull_request events
          # carry one number; check_suite events carry 0..N (a suite can cover
          # multiple PRs on the same SHA). An empty list is a clean no-op.
          : > targets.txt
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            printf '%s\n' "$PR_NUMBER" >> targets.txt
          elif [ "$EVENT" = "check_suite" ]; then
            printf '%s\n' "$SUITE_PR_NUMBERS" \
              | jq -r '.[] | select(. != null) | numbers' 2>/dev/null >> targets.txt || true
          fi
          # Dedup.
          sort -u -o targets.txt targets.txt
          echo "count=$(wc -l < targets.txt)" >> "$GITHUB_OUTPUT"

      - name: Arm/queue green fleet PRs
        if: steps.targets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.AUTO_REVERT_PAT }}
          REPO: ${{ github.repository }}
          FLEET_ONLY: ${{ inputs.fleet-only }}
          FLEET_AUTHORS: ${{ inputs.fleet-authors }}
          NO_MERGE_LABEL: ${{ inputs.no-merge-label }}
        run: |
          set -uo pipefail
          [ -z "$GH_TOKEN" ] && { echo "::error::AUTO_REVERT_PAT not configured — cannot enqueue"; exit 1; }

          # Resolve the repo's merge-queue + squash settings once.
          repo_json="$(gh api "repos/$REPO")"
          merge_queue="$(printf '%s' "$repo_json" | jq -r '.allow_merge_commit // false')"
          squash="$(printf '%s' "$repo_json" | jq -r '.allow_squash_merge // false')"
          # GitHub's merge_queue repo setting is not on the repo object; probe
          # the branch-protection merge_queue on the default branch. If a queue
          # is configured there, use --squash (adds to queue); else --auto --squash.
          default_branch="$(printf '%s' "$repo_json" | jq -r '.default_branch')"
          has_queue="false"
          bp="$(gh api "repos/$REPO/branches/$default_branch/protection" 2>/dev/null || true)"
          if [ -n "$bp" ] && printf '%s' "$bp" | jq -e '.required_status_checks.strict == true or .required_pull_request_reviews != null' >/dev/null 2>&1; then
            # strict status checks + PR reviews is the merge-queue shape; the
            # definitive probe is whether `gh pr merge --squash` reports the
            # queue ref. We arm with --auto --squash either way: on a queue
            # repo, --auto --squash adds to the queue; on a non-queue repo it
            # arms auto-merge. One path, both shapes.
            has_queue="true"
          fi

          fleet_authors_csv="$(printf '%s' "$FLEET_AUTHORS" | tr -d ' ')"
          armed=0; skipped=0; already=0
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            pr_data="$(gh api "repos/$REPO/pulls/$pr" 2>/dev/null || true)"
            [ -n "$pr_data" ] || { echo "SKIP #$pr: cannot read PR"; skipped=$((skipped+1)); continue; }

            draft="$(printf '%s' "$pr_data" | jq -r '.draft')"
            state="$(printf '%s' "$pr_data" | jq -r '.state')"
            head_repo="$(printf '%s' "$pr_data" | jq -r '.head.repo.full_name')"
            author="$(printf '%s' "$pr_data" | jq -r '.user.login')"
            title="$(printf '%s' "$pr_data" | jq -r '.title')"
            labels="$(printf '%s' "$pr_data" | jq -r '.labels[].name' | tr '\n' ',' | sed 's/,$//')"

            # Exceptions — never queue.
            if [ "$draft" = "true" ]; then echo "SKIP #$pr: draft"; skipped=$((skipped+1)); continue; fi
            if [ "$state" != "open" ]; then echo "SKIP #$pr: not open ($state)"; skipped=$((skipped+1)); continue; fi
            if [ "$head_repo" != "$REPO" ]; then echo "SKIP #$pr: fork PR"; skipped=$((skipped+1)); continue; fi
            case "$title" in *"[no-merge]"*) echo "SKIP #$pr: [no-merge] title"; skipped=$((skipped+1)); continue ;; esac
            case ",$labels," in *",$NO_MERGE_LABEL,"*) echo "SKIP #$pr: $NO_MERGE_LABEL label"; skipped=$((skipped+1)); continue ;; esac

            if [ "$FLEET_ONLY" = "true" ]; then
              case ",$fleet_authors_csv," in *",$author,"*) ;; *) echo "SKIP #$pr: author $author not in fleet list"; skipped=$((skipped+1)); continue ;; esac
            fi

            # Already armed/queued? `gh pr merge` sets auto_merge_request_enabled
            # on the PR when --auto is armed. Re-arming is a no-op but noisy;
            # skip if already armed.
            already_armed="$(printf '%s' "$pr_data" | jq -r '.auto_merge // null')"
            if [ "$already_armed" != "null" ]; then echo "OK #$pr: already armed/queued"; already=$((already+1)); continue; fi

            # Arm. --auto --squash works on both queue and non-queue repos:
            # on a queue repo it adds to the queue; on a non-queue repo it arms
            # auto-merge-on-green. Required checks must pass before merge either
            # way — this never bypasses branch protection.
            if gh pr merge "$pr" --auto --squash --repo "$REPO" 2>&1 | sed 's/^/  /'; then
              echo "ARMED #$pr ($author): auto --squash"
              armed=$((armed+1))
            else
              echo "SKIP #$pr: gh pr merge failed (likely failing/pending checks — will retry on next event)"
              skipped=$((skipped+1))
            fi
          done < targets.txt
          echo "::notice::auto-enqueue: armed=$armed already=$already skipped=$skipped"
