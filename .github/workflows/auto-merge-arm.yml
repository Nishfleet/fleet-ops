name: Auto-merge arm

# Agent-authored PRs land themselves (Nish, 2026-08-25 — vault
# global-standing-rules.md "Agent-authored PRs land themselves"): every opened
# PR is armed for auto-merge so it lands the moment required checks pass, no
# matter which agent, tool, or human opened it. Required checks (and the merge
# queue, where one exists) stay the only quality gate — this removes just the
# human wait, and keeps working when any one agent is out of usage.
#
# Opt-outs (the ONLY ones): draft PRs, the `no-auto-merge` label at creation,
# or `[no-merge]` in the title. Scheduled sweeps that must never self-merge
# open DRAFT PRs.
#
# Arms under a nishfleet-worker App installation token, not GITHUB_TOKEN and
# not a human PAT (fleet-ops#1469): a merge under GITHUB_TOKEN would not
# trigger push workflows on main (deploy verification, auto-revert), silently
# disarming the safety net; a merge under the old AUTO_REVERT_PAT made Nish
# the triggering actor of every merge, so GitHub emailed him one failure
# notice per red workflow per merge (30+ hand-deleted on 2026-08-28). The App
# is a real actor (push workflows still fire) but not Nish, so the failure
# emails stop reaching him. If the App secrets are missing the reusable
# workflow fails LOUD and the PR waits for a human — the correct fallback.
#
# The `arm` job is a required check (fleet-ops#1340): it runs the
# merge-trample gate so a trampling PR cannot merge even if the heartbeat path
# is down. That requires `synchronize` in the trigger — a required check must
# re-report on the latest head, and without `synchronize` a pushed-to PR would
# leave the check stale and block the merge. Re-running on a push re-arms
# auto-merge (idempotent) and re-evaluates the freeze/quality/trample gates on
# the new head.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# fleet-ops#1457 (stop-the-line): grants `issues: read` so the reusable arm
# workflow can probe for an open `stop-the-line` issue before arming. A
# freeze (consecutive-commit HALT) blocks the arm step; the line stays
# mergeable by hand and the next green run auto-clears.

permissions:
  issues: read

concurrency:
  group: auto-merge-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    uses: ./.github/workflows/reusable-auto-merge-arm.yml
    secrets:
      NISHFLEET_WORKER_APP_ID: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
      NISHFLEET_WORKER_PRIVATE_KEY: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
