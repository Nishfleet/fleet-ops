# Fleet map maintenance.
#
# The regenerated map is published as a workflow artifact. It is never
# committed and never becomes a pull request: a PR opened as github-actions
# with GITHUB_TOKEN never enters the main merge queue, so map-sync PRs
# stranded open forever (fleet-ops#8442). The push trigger is gone for the
# same reason: claude-code-action rejects push outright
# ("Unsupported event type: push", red on every push to main since
# 2026-09-23), and drift no longer reaches main through this workflow.
name: fleet-map

on:
  pull_request:
    paths:
      - 'systemd/**'
      - 'prompts/**'
      - 'config/**'
      - '.github/workflows/fleet-map.yml'
      - '.agents/skills/verify-fleet/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: fleet-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification-section:
    name: verification-section
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A systemd, prompt, or config change needs a Verification section
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          changed=$(git diff --name-only origin/main...HEAD -- systemd prompts config)
          if [ -z "$changed" ]; then
            exit 0
          fi
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          printf '%s\n' "$body" | grep -q '## Verification'
          # A 40-hex commit sha contains 32 hex chars. Bound the match so only
          # an invocation id counts, and require the two show values the
          # template names but does not fill in.
          printf '%s\n' "$body" | grep -qE '(^|[^0-9a-fA-F])[0-9a-fA-F]{32}([^0-9a-fA-F]|$)'
          printf '%s\n' "$body" | grep -qE 'CPUUsageNSec=[0-9]'
          printf '%s\n' "$body" | grep -qE 'MemoryPeak=[0-9]'

  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Regenerate drifted fleet-map rows
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # main 2026-09-22, Claude Code 2.1.280 (first to know claude-opus-5-5)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: nishfleet-worker
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: false
          prompt: |
            Maintain `.agents/skills/verify-fleet/fleet-map.md` and no other file.
            Inventory every unit, timer, path, slice, and template under `systemd/`. A `*.d` drop-in directory belongs to its unit (the directory name without `.d`). Decode systemd `\xNN` escapes in filenames. `systemd/service.d/` is the row id `service.d`. `*.conf.d` directories use the name without `.d` (for example `oomd.conf`).
            Compare that set to the `<!-- fleet-map:NAME -->` markers in the map. Also check every backtick path that starts with `prompts/`, `config/`, or `systemd/`.
            If the marker set equals the unit set, each marker appears once, and every cited path exists, do not edit anything.
            Otherwise edit only the map: delete a row whose unit is gone, append one row for a missing unit using the file's Description= line, and mark a missing backtick path with `(missing on tree)`.
            Do not commit, push, comment, or open a pull request.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Edit,Bash(git status:*),Bash(git diff:*)"

      - name: Record drift in the run summary, or record no drift
        id: drift
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          map=.agents/skills/verify-fleet/fleet-map.md
          others=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -vx "$map" || true)
          if [ -n "$others" ]; then
            echo "map sync edited files other than the map" >&2
            printf '%s\n' "$others" >&2
            exit 1
          fi
          if git diff --quiet -- "$map" && git diff --cached --quiet -- "$map"; then
            echo "no drift at $sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "map drift at $sha; the regenerated map is this run's artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Publish the regenerated map as a workflow artifact
        if: steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-map-drift
          path: .agents/skills/verify-fleet/fleet-map.md
          retention-days: 7
          if-no-files-found: error
