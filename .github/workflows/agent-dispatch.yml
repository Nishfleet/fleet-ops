# Events that put work on the agent queue. Repo variable AGENT_MODE:
#   shadow (default) = only issues also labelled shadow-actions, no rework
#   live             = every agent-ready issue, plus rework on red CI
# Repo variable MISS_REVIEW:
#   off (default, unset) = miss-review jobs never start
#   live                 = a miss event starts one different-family review
# To switch miss-review off: set MISS_REVIEW to off, or delete the variable.
# To delete it: revert the miss-review jobs in this file and the miss-review
# path in agent.yml (Gate, Worker, Arm, Deliverable, Clean).
# Repo variable ORCHESTRATE:
#   off                  = the orchestrate job never starts
#   live (default, unset) = a needs-orchestrator label starts one hand-off run.
#   Default on (Nish 2026-10-04, "on for everything the fleet touches"), so a
#   newly stubbed repo cannot sit off by omission.
# Cost controls on the orchestrate job (fleet-ops#9351), one line per part:
#   Daily cap: ORCHESTRATE_DAILY_MAX hand-off runs per IST day, default 10. Off: set the variable to 0.
#   Model/turns pin: Sonnet (ORCHESTRATE_MODEL, default claude-sonnet-5-5), 40 turns. Off: label the issue needs-opus (Opus, 80 turns), or set ORCHESTRATE_MODEL to off for all.
#   Hook skip: the session runs with --settings '{"disableAllHooks":true}'. Off: set ORCHESTRATE_HOOKS to on.
#   Runner: pi on a LiteLLM seat (ORCHESTRATE_SEAT, default worker-capable), fleet-ops#9407. Off: set ORCHESTRATE_RUNNER to claude, or label the issue needs-opus.
#   Delete all three: revert the cap and pick blocks of the "Check the issue" step and the model/--settings lines of the session step here,
#     the "Orchestrate cap and session args" step in ci.yml, and cap_cases and session_cases in config/orchestrate-events.json (or revert the merge commit).
# To switch orchestration off: set ORCHESTRATE to off.
# To delete it: revert the orchestrate job in this file, the workflow-path
# detector in agent.yml's Gate, and prompts/orchestrator-handoff.md. A run
# already in flight finishes: the label gate only stops new ones.
# Repo variable FLEET_DISPATCH_PAUSED (the caller repo's, like the others):
#   true                   = every job that starts a worker or picks work to
#                            start skips, and the paused job logs one summary
#                            line per skipped event
#   anything else or unset = not paused
# ansible/update.yml sets it to true for the weekly update and back to false in
# its always: block, then sweeps. It replaces `gh workflow disable`: a disabled
# workflow drops every trigger, so hold-risky could not hold a PR armed in that
# window (2026-10-05, 08:11-10:47Z). hold-risky and close-claim never read it;
# ci.yml fails if a guard job gains the condition or a dispatch job loses it.
# The orchestrate job is the one self-hosted job here: org runner group
# `agent` (id 3) must list this file @refs/heads/main in selected_workflows,
# or the job queues forever next to idle runners. Delete that entry with it.
name: agent-dispatch
on:
  issues:
    types: [labeled, closed, reopened]
  issue_comment:
    types: [created]
  # issue=<number> dispatches only that issue's ref, for a caller that
  # relabels or closes with GITHUB_TOKEN: that fires no workflow, and
  # workflow_dispatch is the documented trigger GITHUB_TOKEN may start.
  # No input sweeps exactly like the hourly schedule.
  # task=miss-review with issue=<N> replays a miss review on that issue
  # (0509#6912 class) without claiming it as a builder run.
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to dispatch, overrides the sweep and its claim-PR append'
        required: false
        type: string
      task:
        description: 'miss-review to replay a miss on issue, orchestrate to hand a parked issue to the orchestrator, empty for a normal sweep'
        required: false
        type: string
  # Nishfleet/0509 keeps only a trigger stub that calls this file, so the
  # dispatch logic has one copy. github.* is the caller's, so every job below
  # acts on the calling repo. agent_mode carries the caller's AGENT_MODE.
  workflow_call:
    inputs:
      issue:
        required: false
        type: string
        default: ''
      agent_mode:
        required: false
        type: string
        default: ''
      task:
        required: false
        type: string
        default: ''
      # JSON runs-on for the two GitHub-side jobs. A private caller whose
      # hosted minutes ran out passes its own runners, e.g.
      # '["self-hosted","Linux","X64"]' (drive, 2026-10-04: hosted jobs
      # refused for billing, so the sweep never ran).
      runner:
        required: false
        type: string
        default: '"ubuntu-latest"'
  # pull_request_target, not pull_request: pull_request never runs while a PR
  # has a merge conflict. Invariant (Kimi K3 review L2, 2026-09-24): nothing in
  # this file checks out PR code. ejected and miss-review-pr only run for a
  # claim/issue-* (or a same-repo Revert) whose head repo is this repository,
  # so a fork's PR never reaches a runner or a token. hold-risky runs for every
  # PR on the last five types but only calls the API: it reads file names as
  # data and never checks out or runs the head.
  pull_request_target:
    types: [dequeued, auto_merge_disabled, closed, auto_merge_enabled, synchronize, labeled, opened, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # GitHub emits no event when a job queued for a self-hosted runner expires
  # after 24h, or when a claim PR turns DIRTY outside the merge queue (0509#4373).
  # The sweep below catches both, and a rework event that never fired; hourly
  # stays well under the 24h expiry and matches the drive and 0509 stubs.
  schedule:
    - cron: '17 * * * *'
permissions: {}
# One sweep running and one waiting per repo: a newer sweep replaces the waiting
# one, and cancel-in-progress stays false so a running sweep finishes. 15 sweeps
# queued behind 24 busy runners on 2026-09-28 (agent-dispatch #7798 since
# 16:57Z), each listing the same issues. Every per-issue event (new, rework,
# ejected, issue=<N> dispatch, a close) gets its own group and is not held back.
concurrency:
  group: agent-dispatch-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue == '')) && 'sweep' || github.run_id }}
  cancel-in-progress: false
jobs:
  # FLEET_DISPATCH_PAUSED is true: say so, once per event that a dispatch job
  # would have acted on, so a skipped run is not silent. It starts nothing and
  # writes nothing. The plain PR events (hold-risky's) and ordinary comments
  # and labels are left out, so a pause does not fill the runners with notices.
  # Work skipped here is not lost: the sweep update.yml runs after clearing the
  # flag lists every agent-ready issue and stalled claim PR again.
  paused:
    if: >-
      vars.FLEET_DISPATCH_PAUSED == 'true' &&
      (github.event_name != 'pull_request_target' || github.event.action == 'dequeued' || github.event.action == 'closed') &&
      (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, 'park:') || startsWith(github.event.comment.body, 'opus-vet:')) &&
      (github.event_name != 'issues' || github.event.action != 'labeled' ||
       contains(fromJSON('["agent-ready","agent-failed","needs-orchestrator"]'), github.event.label.name))
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          msg="agent-dispatch paused: FLEET_DISPATCH_PAUSED=true on $GITHUB_REPOSITORY, so no dispatch job ran for this $EVENT${ACTION:+ ($ACTION)} event. hold-risky and close-claim still run; the sweep after the flag clears picks up waiting work."
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
  new:
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' && github.event_name == 'issues' && github.event.label.name == 'agent-ready' &&
      ((inputs.agent_mode || vars.AGENT_MODE) == 'live' || contains(github.event.issue.labels.*.name, 'shadow-actions'))
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    # issues: write is what agent.yml's report job asks for; its other jobs
    # ask for nothing and act with the App token.
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: claim/issue-${{ github.event.issue.number }}
  # Red CI on a claim PR: post the failed run's ##[error] lines on the issue
  # before the rework run starts, so the worker reads what broke instead of
  # re-deriving it (fleet-ops#9063: drive #200 and #180 reworks ended green
  # with TS errors still red and nothing on the issue said which). The
  # rework run's own "agent run started:" comment is what counts toward the
  # Gate's 3-run cap; this note starts with "rework:", which the cap and
  # park counters ignore.
  rework-note:
    if: >-
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' && github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claim/issue-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          i=${REF#claim/issue-}; i=${i%%-*}
          # A tool that prints errors as plain text leaves only the generic
          # exit-code ##[error] line, so the failed log's last 30 lines stand
          # in. A log that cannot be read still leaves a note with the run
          # link, so the worker knows where to look.
          log=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed 2>/dev/null) || log=
          errors=$(grep -F '##[error]' <<<"$log" | sed 's/.*##\[error\]//' | grep -vx 'Process completed with exit code [0-9]*\.' |
            cut -c1-300 | awk '!seen[$0]++' | head -n 30) || true
          [ -n "$errors" ] || errors=$(cut -f3- <<<"$log" | cut -c1-300 | tail -n 30)
          [ -n "$errors" ] || errors="(the failed log could not be read; open the run)"
          # shellcheck disable=SC2016 # the backticks are a literal markdown fence
          body=$(printf 'rework: CI run %s failed on %s. Fix these errors, then push to %s:\n\n```\n%s\n```' "$RUN_URL" "${SHA:0:7}" "$REF" "$errors")
          gh issue comment "$i" -R "$GITHUB_REPOSITORY" --body "$body"
  rework:
    needs: rework-note
    if: >-
      !cancelled() && vars.FLEET_DISPATCH_PAUSED != 'true' &&
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' && github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claim/issue-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: ${{ github.event.workflow_run.head_branch }}
  # main moved (CI finished on a push to the default branch): a claim PR it
  # left CONFLICTING sends no event of its own, so its issue sat
  # agent-in-progress with no run (fleet-ops#9063: drive #136 / PR #174).
  # Requeue each one with a "merge main" note, the same way red CI is.
  # Skipped while that issue's newest agent run is still live: the run in
  # flight will see the conflict itself.
  conflicts:
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' &&
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    permissions:
      actions: read
      issues: write
      pull-requests: read
    outputs:
      refs: ${{ steps.find.outputs.refs }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs='[]'
          # Only PRs the bulk list does not call MERGEABLE are re-read: the
          # bulk list says UNKNOWN until GitHub recomputes a PR after a push
          # to main, and a per-PR read triggers that (fleet-ops#8557).
          prs=$(gh pr list -R "$GITHUB_REPOSITORY" -L 1000 --json number,headRefName,isDraft,mergeable \
            --jq '.[] | select((.headRefName | test("^claim/issue-[0-9]+$")) and (.isDraft | not) and .mergeable != "MERGEABLE") | .number')
          for pr in $prs; do
            for _ in 1 2 3; do
              v=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,mergeable)
              [ "$(jq -r .mergeable <<<"$v")" != UNKNOWN ] && break
              sleep 10
            done
            [ "$(jq -r .mergeable <<<"$v")" = CONFLICTING ] || continue
            ref=$(jq -r .headRefName <<<"$v"); i=${ref#claim/issue-}
            # Same skips as the Gate: closed, blocked or parked work gets no note.
            gh api "repos/$GITHUB_REPOSITORY/issues/$i" --jq '.state == "open" and (.issue_dependencies_summary.blocked_by // 0) == 0 and
              (any(.labels[].name; IN("agent-blocked","needs-split","needs-orchestrator","needs-nish-decision","epic")) | not)' | grep -qx true || continue
            body=$(gh issue view "$i" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(startswith("agent run started:"))] | last // ""')
            if [[ $body =~ actions/runs/([0-9]+) ]]; then
              case $(gh run view "${BASH_REMATCH[1]}" -R "$GITHUB_REPOSITORY" --json status --jq .status) in
                queued|in_progress|requested|waiting|pending) echo "#$i: run live, skip"; continue ;;
              esac
            fi
            gh issue comment "$i" -R "$GITHUB_REPOSITORY" --body "rework: claim PR #$pr conflicts with main. Merge main: git merge origin/main into $ref, resolve the conflicts, run the checks, push."
            echo "requeue #$i: PR #$pr is CONFLICTING"
            refs=$(jq -nc --argjson r "$refs" --arg x "$ref" '$r + [$x]')
          done
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
  remerge:
    needs: conflicts
    if: vars.FLEET_DISPATCH_PAUSED != 'true' && needs.conflicts.outputs.refs != '' && needs.conflicts.outputs.refs != '[]'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.AGENT_MAX_PARALLEL || '4') }}
      matrix:
        ref: ${{ fromJSON(needs.conflicts.outputs.refs) }}
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: ${{ matrix.ref }}
  # The merge queue ejected a claim PR (failed checks or a conflict): send the
  # worker back to it. dequeued only: auto_merge_disabled is what hold-risky
  # (or the coordinator) does on purpose, and the other pull_request_target
  # types are hold-risky's. A dropped arm on a safe claim PR is the sweep's
  # unarmed case, which re-arms it.
  ejected:
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' &&
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' && github.event_name == 'pull_request_target' &&
      github.event.action == 'dequeued' &&
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'claim/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: ${{ github.event.pull_request.head.ref }}
  # Approved-head merge guard (0509#7092: a risky PR was armed by the
  # orchestrator, gained commits after the coordinator approved a different
  # head, and merged on ci-ok alone; its needs-coordinator label came 8 s after
  # the arm). Risk is read from the changed paths, not only the label, so an
  # unlabelled risky PR is caught too. The path list is config/risky-paths.json
  # on fleet-ops main, read by URL so every caller repo uses the same copy; an
  # unreadable list holds every PR. A risky PR whose CURRENT head sha has no
  # approval from an approver loses its arm, leaves the merge queue and gets
  # the label. Approval is either a PR comment with the line
  # `coordinator-approval: <full head sha>` (unedited), or a
  # coordinator-approval=success commit status on that sha. The comment path
  # exists because cloud sessions get 403 on POST /statuses. Both name one
  # sha, so every push needs a fresh approval. GITHUB_TOKEN writes fire no workflow, so
  # the hold does not re-trigger itself or the ejected job. ci.yml runs CLASSIFY
  # and APPROVAL below against every case in config/risky-paths.json.
  hold-risky:
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["auto_merge_enabled","synchronize","labeled","opened","reopened"]'), github.event.action)
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      review_sha: ${{ steps.hold.outputs.review_sha }}
    concurrency:
      group: hold-risky-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # pull-requests: write labels the PR and disables auto-merge. contents:
    # write is what GitHub asks of a merge-queue dequeue (it acts on the merge,
    # like arming does). statuses: read and pull-requests (which covers a PR's
    # issue comments) read the approval. Nothing here checks
    # out code, so contents: write never meets PR head code.
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    env:
      LABEL: needs-coordinator
      CONTEXT: coordinator-approval
      # Space-separated logins whose status or comment counts. Any token with
      # statuses: write can post a status, and anyone who can comment can
      # write the approval line, so the context name or line alone is not an
      # approval.
      # github-actions[bot] is the independent reviewer (review-risky below):
      # its approval comment is written by agent.yml's review job with
      # GITHUB_TOKEN, an identity no PR author uses. nish3451 stays for a
      # person's typed approval.
      APPROVERS: nish3451 github-actions[bot]
      RISKY_PATHS_URL: https://raw.githubusercontent.com/Nishfleet/fleet-ops/main/config/risky-paths.json
      # stdin: {repo, labels, files, patches, changed_files}; $cfg:
      # risky-paths.json or null. patches is [{file, patch}] with patch null
      # when the API sent none (large or binary). Risky is a path hit (under
      # "*", minus the "safe" docs patterns, or under the PR's own repo) or an
      # added diff line matching a "diff" entry for that file, or a file such
      # an entry covers with no patch. A list cut at 3000 files, an empty
      # list or an unreadable path list all count as risky.
      CLASSIFY: |
        . as $pr
        | (($cfg // {}).paths // null) as $p
        | (($cfg // {}).safe // []) as $safe
        | (($cfg // {}).diff // []) as $diff
        | (if ($p | type) == "object" and ($p["*"] | type) == "array" then $p["*"] else ["."] end) as $star
        | (if ($p | type) == "object" then [$p | to_entries[] | select(.key != "*" and (.key | ascii_downcase) == ($pr.repo | ascii_downcase)) | .value[]] else [] end) as $own
        | [$pr.files[] | . as $f
            | select((any($safe[]; . as $re | $f | test($re; "i")) | not) and any($star[]; . as $re | $f | test($re; "i"))
                     or any($own[]; . as $re | $f | test($re; "i")))] as $hits
        | [($pr.patches // [])[] | . as $x
            | $diff[] | . as $d
            | select(($x.file | test($d.files; "i")) and (if $d.not_files == null then true else ($x.file | test($d.not_files; "i") | not) end))
            | if $x.patch == null then (if $d.hold_no_patch == true then "no diff for \($x.file) (\($d.id))" else empty end)
              elif ([$x.patch | split("\n")[] | select(startswith("+") and (startswith("+++") | not))] | join(" ") | test($d.pattern; "i")) then "diff \($d.id) in \($x.file)"
              else empty end] as $dhits
        | ([if any($pr.labels[]; . == $label) then "label \($label)" else empty end]
           + [if ($p | type) != "object" then "risky-path list unreadable" else empty end]
           + [if ($pr.files | length) == 0 then "no changed files listed" else empty end]
           + [if $pr.changed_files >= 3000 then "\($pr.changed_files) changed files, list cut at 3000" else empty end]
           + ($hits | unique | .[:10] | map("path \(.)"))
           + ($dhits | unique | .[:10])) as $why
        | {risky: ($why | length > 0), why: $why}
      # stdin: {sha, statuses, comments}. sha is the current head; statuses
      # are that sha's, newest first (GitHub's order); comments are the PR's
      # issue comments. Status path: only the newest status for CONTEXT counts,
      # so a later failure revokes it. Comment path: an approver's comment,
      # never edited (updated_at == created_at, so an old comment cannot be
      # edited onto a new sha), with a line exactly "CONTEXT: <sha>" for the
      # full 40-hex head sha. Either path approves.
      APPROVAL: |
        . as $in
        | ($who | split(" ") | map(select(length > 0))) as $approvers
        | ([($in.statuses // [])[] | select(.context == $c)] | .[0] // {}) as $s
        | ($s.state == "success" and any($approvers[]; . == ($s.creator.login // ""))) as $by_status
        | (($in.sha // "") | test("^[0-9a-f]{40}$")) as $full
        | ($full and any(($in.comments // [])[];
            (.user.login // "") as $l
            | any($approvers[]; . == $l)
              and .created_at != null and .updated_at == .created_at
              and any((.body // "") | split("\n")[] | rtrimstr("\r"); . == "\($c): \($in.sha)"))) as $by_comment
        | $by_status or $by_comment
    steps:
      - name: Hold a risky PR whose head has no coordinator approval
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Fails closed: a read that fails (the PR, its files, the path list,
        # its statuses or comments, the merge state) never skips the hold. It
        # counts as risky or not approved, gets a ::warning:: naming the read,
        # and the label, disarm and dequeue still run. The job only goes red
        # when it cannot confirm the PR is disarmed and out of the queue.
        # ci.yml runs this block against a fake gh with each read failing.
        run: |
          set -euo pipefail
          # The live PR, not the event payload: a push after the event moves the head.
          if pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR"); then
            [ "$(jq -r .state <<<"$pr")" = open ] || { echo "hold-risky: #$PR is not open; skip"; exit 0; }
            sha=$(jq -r .head.sha <<<"$pr")
          else
            echo "::warning::hold-risky: PR read failed for #$PR; holding as risky and not approved"
            pr=null
            sha=unknown
          fi
          # Old and new name of a rename both count. Files go through a file,
          # not argv: 3000 paths can pass the 128 KiB single-argument limit.
          # A failed read leaves the list empty, which CLASSIFY holds.
          # patch is null when GitHub sends none (large or binary files).
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | {f: .filename, p: (.previous_filename // null), patch: (.patch // null)}' > "$RUNNER_TEMP/files.txt"; then
            echo "::warning::hold-risky: changed-files read failed for #$PR; holding as risky"
            : > "$RUNNER_TEMP/files.txt"
          fi
          jq -sc '{files: [.[] | .f, (.p // empty)], patches: [.[] | {file: .f, patch}]}' < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/files.json"
          jq -c --arg repo "$GITHUB_REPOSITORY" --slurpfile d "$RUNNER_TEMP/files.json" \
            '{repo: $repo, labels: [(.labels // [])[].name], files: $d[0].files, patches: $d[0].patches, changed_files: (.changed_files // 0)}' <<<"$pr" > "$RUNNER_TEMP/facts.json"
          if ! cfg=$(curl -fsSL --retry 3 "$RISKY_PATHS_URL" | jq -c .); then
            echo "::warning::could not read $RISKY_PATHS_URL; holding as risky"
            cfg=null
          fi
          verdict=$(jq -c --argjson cfg "$cfg" --arg label "$LABEL" "$CLASSIFY" < "$RUNNER_TEMP/facts.json") ||
            { echo "::warning::hold-risky: classifier failed for #$PR; holding as risky"; verdict='{"risky":true,"why":["classifier failed"]}'; }
          # An unread PR has no labels or file count to classify, so it holds.
          [ "$pr" != null ] || verdict=$(jq -c '.risky = true | .why += ["PR read failed"]' <<<"$verdict")
          echo "hold-risky: #$PR at $sha: $verdict"
          jq -e .risky <<<"$verdict" >/dev/null || exit 0
          # Either approval read failing means not approved, even if the other
          # read alone would approve.
          approved=false
          if [ "$sha" = unknown ]; then
            echo "::warning::hold-risky: no head sha for #$PR; not approved"
          elif ! gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" --jq '.[]' > "$RUNNER_TEMP/statuses.txt"; then
            echo "::warning::hold-risky: statuses read failed for $sha; not approved"
          elif ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | {user: {login: .user.login}, body, created_at, updated_at}' > "$RUNNER_TEMP/comments.txt"; then
            echo "::warning::hold-risky: comments read failed for #$PR; not approved"
          else
            approved=$(jq -n --arg sha "$sha" --slurpfile s "$RUNNER_TEMP/statuses.txt" --slurpfile m "$RUNNER_TEMP/comments.txt" \
              '{sha: $sha, statuses: $s, comments: $m}' |
              jq -r --arg c "$CONTEXT" --arg who "$APPROVERS" "$APPROVAL") || approved=false
          fi
          if [ "$approved" = true ]; then
            echo "hold-risky: #$PR is risky and $sha carries an approver's $CONTEXT; no hold"
            exit 0
          fi
          # Label first, so a dequeued event raised by the steps below already
          # sees it. A failed label does not stop the disarm and dequeue.
          ok=true
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$LABEL" --silent ||
            { echo "::error::hold-risky: could not label #$PR $LABEL"; ok=false; }
          # shellcheck disable=SC2016 # $o $n $p $id are GraphQL variables, not shell
          q='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){id isInMergeQueue autoMergeRequest{enabledAt}}}}'
          read_pr() { gh api graphql -f query="$q" -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" -F p="$PR" --jq .data.repository.pullRequest; }
          # A failed merge-state read does not skip the hold: both mutations
          # run blind (with the REST node_id), and the re-read below confirms.
          if live=$(read_pr); then
            id=$(jq -r .id <<<"$live")
            armed=$(jq -r '.autoMergeRequest != null' <<<"$live")
            queued=$(jq -r .isInMergeQueue <<<"$live")
          else
            echo "::warning::hold-risky: merge-state read failed for #$PR; disarming and dequeuing blind"
            id=$(jq -r '.node_id // empty' <<<"$pr")
            armed=unknown
            queued=unknown
          fi
          [ -n "$id" ] || { echo "::error::hold-risky: no node id for #$PR; cannot disarm or dequeue"; exit 1; }
          if [ "$armed" != false ]; then
            # shellcheck disable=SC2016
            if gh api graphql -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}' -f id="$id" --silent; then
              echo "hold-risky: disabled auto-merge on #$PR"
            else
              echo "::warning::hold-risky: disable auto-merge call failed on #$PR; checked below"
            fi
          fi
          if [ "$queued" != false ]; then
            # A PR that left the queue between the read and the call ("not
            # queued") is fine; the re-read below catches one still queued.
            # shellcheck disable=SC2016
            if gh api graphql -f query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}' -f id="$id" --silent; then
              echo "hold-risky: dequeued #$PR"
            else
              echo "::warning::hold-risky: dequeue call failed on #$PR; checked below"
            fi
          fi
          if [ "$armed$queued" != falsefalse ]; then
            if after=$(read_pr); then
              [ "$(jq -r '.autoMergeRequest != null' <<<"$after")" != true ] || { echo "::error::#$PR is still armed"; ok=false; }
              [ "$(jq -r .isInMergeQueue <<<"$after")" != true ] || { echo "::error::#$PR is still in the merge queue"; ok=false; }
            else
              echo "::error::hold-risky: cannot confirm #$PR is disarmed and out of the queue"
              ok=false
            fi
          fi
          [ "$sha" = unknown ] || echo "review_sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### hold-risky: #$PR held at \`$sha\`"
            jq -r '.why[] | "- \(.)"' <<<"$verdict"
            echo
            echo "review-risky reviews this exact head next; or an approver's PR comment line \`$CONTEXT: $sha\` (prompts/orchestrator-handoff.md step 4)."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = true ]
  # Independent review of a held risky PR (Nish 2026-10-05: reviewed PRs merge
  # themselves, no pasted approval lines). agent.yml's review job reads the
  # head's diff through the API, never checks out PR code, asks a model with no
  # tools for findings and Jev for approve or block, then posts the
  # coordinator-approval comment as github-actions[bot] and arms the PR.
  # hold-risky stays the only door: it reads that comment like any other.
  # A PR that edits the guard itself (risky-paths.json "guard") is never
  # approved here; a person approves it. Paused fleets do not review.
  review-risky:
    needs: hold-risky
    if: vars.FLEET_DISPATCH_PAUSED != 'true' && needs.hold-risky.outputs.review_sha != ''
    permissions:
      pull-requests: write
      # agent.yml's work and report jobs ask for issues: write; a caller job must grant every permission the called workflow requests, or the run dies at startup.
      issues: write
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    with:
      review_pr: ${{ github.event.pull_request.number }}
      review_sha: ${{ needs.hold-risky.outputs.review_sha }}
  # A closed blocker frees the issues it was blocking; a manual run sweeps
  # every ready, unblocked issue (cutover backfill and missed-event recovery),
  # then open claim PRs that are unarmed, conflicting, missing a required-check
  # report, red with no rework since the failure, or still agent-in-progress
  # with no live agent run.
  # Priority-now first, then oldest. The Gate step in agent.yml re-checks each
  # and its 3-run cap bounds any loop.
  list:
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' &&
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' &&
      inputs.task != 'miss-review' &&
      ((github.event_name == 'issues' && github.event.action == 'closed') ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    permissions:
      issues: write
      pull-requests: read
      # actions: liveness is `gh run view` (fleet-ops#8777). checks and
      # statuses: that same sweep reads the head's statusCheckRollup.
      actions: read
      checks: read
      statuses: read
    outputs:
      refs: ${{ steps.list.outputs.refs }}
      stalled_refs: ${{ steps.list.outputs.stalled_refs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED: ${{ github.event.issue.number }}
          ISSUE: ${{ inputs.issue }}
          # jq defs shared by the missing-checks and red-PR cases below.
          CHECK_DEFS: |
            def pending: (.status != null and .status != "COMPLETED") or .state == "PENDING";
            def failed: (.conclusion | IN("FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED", "STARTUP_FAILURE")) or (.state | IN("FAILURE", "ERROR"));
          # One red claim PR in, a verdict out: {reason, run}. Input is
          # {pr: gh pr view, issue: the issue API object, comments: gh issue
          # view comments}. reason is "go" or the skip reason; run is the
          # newest counted "agent run started:" body.
          # The label list and infra-failed rule are agent.yml's Gate, copied; a
          # start whose run infra-failed never tried, so it does not count.
          # No cap test: a PR at the cap is dispatched on purpose, so the Gate
          # parks it with needs-orchestrator and later sweeps skip it on the
          # label. No rework: note test: rework-note posts even while paused,
          # so a note would hide the failure the event missed.
          # config/sweep-rework-cases.json runs this program in CI.
          RED_REWORK: |
            (.pr.statusCheckRollup // []) as $checks
            | ([$checks[] | select(failed) | (.completedAt // .startedAt // empty) | fromdateiso8601] | max) as $failed_at
            | (.issue.labels | map(.name)) as $labels
            | [.comments[] | select(.body | startswith("agent run infra-failed: ")) | .body | ltrimstr("agent run infra-failed: ")] as $infra
            | [.comments[] | select(.body | startswith("agent run started: ")) | select(.body | ltrimstr("agent run started: ") | . as $u | $infra | index($u) | not)] as $started
            | (if $failed_at == null then "not-red"
               elif ($checks | any(pending)) then "pending"
               elif .pr.mergeStateStatus == "DIRTY" then "conflicting"
               elif .issue.state != "open" then "closed"
               elif (.issue.issue_dependencies_summary.blocked_by // 0) != 0 then "blocked"
               elif ($labels | any(IN("agent-blocked", "needs-split", "needs-orchestrator", "needs-nish-decision", "epic"))) then "label"
               elif ($started | length) > 0 and ($started[-1].createdAt | fromdateiso8601) >= $failed_at then "run-after-failure"
               else "go" end) as $reason
            | {reason: $reason, run: ($started[-1].body // "")}
        run: |
          stalled_refs='[]'
          if [ -n "$ISSUE" ]; then
            # One issue, no PR append: the jq below still re-checks agent-ready
            # and blocked_by, and agent.yml's Gate re-checks again, so a
            # dispatch of an issue that was split or parked is skipped.
            nums=$ISSUE
          elif [ -n "$CLOSED" ]; then
            nums=$(gh api "repos/$GITHUB_REPOSITORY/issues/$CLOSED/dependencies/blocking" --jq '.[]|select(.state=="open")|.number')
            # A split parent never closed on its own, so everything blocked by
            # it waited forever (0509, 2026-09-24: ~140 queued issues). Close
            # each open ancestor whose sub-issues are now all closed, and
            # release what it blocked. A GITHUB_TOKEN close fires no event,
            # so the release happens here. /parent 404s at the top.
            # A critical-path or epic parent carries its own finish line (a
            # production run, not its children), so it never closes here:
            # 0509#5680 and #5736 were closed with production still red.
            c=$CLOSED
            while p=$(gh api "repos/$GITHUB_REPOSITORY/issues/$c/parent" --jq .number 2>/dev/null) &&
              [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$p" --jq '"\(.state) \(.sub_issues_summary.total - .sub_issues_summary.completed)\(if any(.labels[].name; . == "critical-path" or . == "epic") then " own-finish-line" else "" end)"')" = "open 0" ]; do
              gh issue close "$p" -R "$GITHUB_REPOSITORY" -r completed -c "every sub-issue is closed, the last was #$c; closing the parent"
              nums="$nums $(gh api "repos/$GITHUB_REPOSITORY/issues/$p/dependencies/blocking" --jq '.[]|select(.state=="open")|.number')"
              c=$p
            done
          else
            # An issue left agent-in-progress by a run that died with its runner
            # (a host or service restart sends no event) and no claim PR yet
            # goes back to agent-ready, so this sweep lists it (fleet-ops#9063:
            # drive #200 #34 #99 #60 #75 sat claimed with no live run, 2026-10-02).
            # One with a claim PR is the orphans case below.
            for n in $(gh issue list -R "$GITHUB_REPOSITORY" -l agent-in-progress -L 1000 --json number --jq '.[].number'); do
              gh pr list -R "$GITHUB_REPOSITORY" --head "claim/issue-$n" --state open --json number --jq 'length' | grep -qx 0 || continue
              body=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(startswith("agent run started:"))] | last // ""')
              [[ $body =~ actions/runs/([0-9]+) ]] || continue
              case $(gh run view "${BASH_REMATCH[1]}" -R "$GITHUB_REPOSITORY" --json status --jq .status) in
                queued|in_progress|requested|waiting|pending) ;;
                *) gh issue edit "$n" -R "$GITHUB_REPOSITORY" --remove-label agent-in-progress --add-label agent-ready
                   echo "requeued #$n: claimed with no live run and no claim PR"
                   stalled_refs=$(jq -nc --argjson s "$stalled_refs" --arg r "claim/issue-$n-miss-review" '$s + [$r]') ;;
              esac
            done
            nums=$(gh issue list -R "$GITHUB_REPOSITORY" -l agent-ready -L 1000 --json number --jq '.[].number')
            # CONFLICTING too: auto-merge stays armed on a PR that turns DIRTY
            # after arming, so it never enters the queue and no event fires
            # (0509#4384, armed and DIRTY since 09-23 19:00Z).
            # The bulk list returns mergeable UNKNOWN until GitHub recomputes a
            # PR after a push to main, so each armed PR is re-read per PR to
            # trigger that computation (fleet-ops#8557). A PR in the merge queue
            # is dropped by ref below; a queued PR can have autoMergeRequest
            # null (0509#4688), so the CONFLICTING test alone cannot drop it.
            all=$(gh pr list -R "$GITHUB_REPOSITORY" -L 1000 --json number,headRefName,autoMergeRequest,isDraft,isCrossRepository,mergeable,labels \
              --jq '[.[] | select((.headRefName|startswith("claim/issue-")) and (.isDraft|not))]')
            if queued=$(gh api graphql -f query="query{repository(owner:\"${GITHUB_REPOSITORY%/*}\",name:\"${GITHUB_REPOSITORY#*/}\"){mergeQueue{entries(first:100){nodes{pullRequest{headRefName}}}}}}" \
              --jq '[.data.repository.mergeQueue.entries.nodes[]?.pullRequest.headRefName]'); then
              unarmed=$(jq -c '[.[] | select(.autoMergeRequest == null and (.labels | map(.name) | index("needs-coordinator") | not)) | .headRefName]' <<<"$all")
              conflicted=$(for pr in $(jq -r '.[] | select(.autoMergeRequest != null and .mergeable != "MERGEABLE") | .number' <<<"$all"); do
                for _ in 1 2 3; do
                  v=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,mergeable)
                  [ "$(jq -r .mergeable <<<"$v")" != UNKNOWN ] && break
                  sleep 10
                done
                jq -c 'select(.mergeable == "CONFLICTING") | .headRefName' <<<"$v"
              done | jq -sc .)
              # Armed claim PRs whose required checks never reported (fleet-ops#8777).
              # BLOCKED with nothing pending and nothing failed means a required
              # check is absent. A pending check is left: it is running, not
              # missing. A completed failure is left too: the red PRs case below
              # owns that. A repo with no required checks is never BLOCKED by
              # them, so it lists none (Nishfleet/drive, fleet-ops#8981).
              missing=$(
                for pr in $(jq -r '.[] | select(.autoMergeRequest != null) | .number' <<<"$all"); do
                  gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,statusCheckRollup,mergeStateStatus || exit 1
                done | jq -sc "$CHECK_DEFS"'
                  [.[] | (.statusCheckRollup // []) as $checks
                    | select(.mergeStateStatus == "BLOCKED" and ($checks | any(pending) | not) and ($checks | any(failed) | not))
                    | .headRefName
                  ]'
              )
              # Claim PRs whose issue is still agent-in-progress after the worker
              # is gone (fleet-ops#8777). Live means the newest "agent run started:"
              # run is queued or in progress; `gh run view` is that read.
              inprog=$(gh issue list -R "$GITHUB_REPOSITORY" -l agent-in-progress -L 1000 --json number --jq '[.[].number]')
              orphans=$(
                jq -r --argjson ip "$inprog" '.[] | select(.labels | map(.name) | index("needs-coordinator") | not) | .headRefName | capture("^claim/issue-(?<n>[0-9]+)$").n | tonumber as $i | select($ip | index($i)) | $i' <<<"$all" |
                while IFS= read -r n; do
                  body=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(startswith("agent run started:"))] | if length == 0 then "" else last end') || exit 1
                  if [ -z "$body" ]; then
                    echo "claim/issue-$n"
                    continue
                  fi
                  if [[ $body =~ actions/runs/([0-9]+) ]]; then
                    id=${BASH_REMATCH[1]}
                  else
                    echo "::error::agent run started comment on #$n has no run id" >&2
                    exit 1
                  fi
                  status=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status --jq .status) || exit 1
                  case $status in
                    queued|in_progress|requested|waiting|pending) ;;
                    *) echo "claim/issue-$n" ;;
                  esac
                done | jq -Rsc 'split("\n") | map(select(length > 0))'
              )
              # Red claim PRs the rework event missed (drive#765: no run fired;
              # 0509#7182 #7172: rework hit lanes-full and nothing retried; every
              # failure while FLEET_DISPATCH_PAUSED is true). An "agent run
              # started:" newer than the failure, or a live newest run, leaves
              # the PR alone; a rare overlap with the rework event is
              # serialised by agent.yml's concurrency. The verdict is the
              # RED_REWORK program above; liveness is `gh run view` on its
              # newest counted run. A DIRTY PR is the conflicts job's. A PR at
              # the 3-run cap is sent on so the Gate parks it.
              red=$(
                set -o pipefail
                for pr in $(jq -r '.[] | select((.isCrossRepository | not) and (.headRefName | test("^claim/issue-[0-9]+$"))) | .number' <<<"$all"); do
                  v=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,statusCheckRollup,mergeStateStatus) || exit 1
                  ref=$(jq -r .headRefName <<<"$v"); n=${ref#claim/issue-}
                  jq -e --argjson q "$queued" '.headRefName | IN($q[]) | not' <<<"$v" >/dev/null || continue
                  verdict=$(jq -nc --argjson pr "$v" \
                    --argjson issue "$(gh api "repos/$GITHUB_REPOSITORY/issues/$n")" \
                    --argjson comments "$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments --jq .comments)" \
                    '{pr: $pr, issue: $issue, comments: $comments}' | jq -c "$CHECK_DEFS $RED_REWORK") || exit 1
                  [ "$(jq -r .reason <<<"$verdict")" = go ] || continue
                  if [[ $(jq -r .run <<<"$verdict") =~ actions/runs/([0-9]+) ]]; then
                    status=$(gh run view "${BASH_REMATCH[1]}" -R "$GITHUB_REPOSITORY" --json status --jq .status) || exit 1
                    case $status in
                      queued|in_progress|requested|waiting|pending) echo "#$n: run live, skip" >&2; continue ;;
                    esac
                  fi
                  echo "$ref"
                done | jq -Rsc 'split("\n") | map(select(length > 0))'
              )
              prs=$(jq -nc --argjson a "$unarmed" --argjson b "$conflicted" --argjson m "$missing" --argjson o "$orphans" --argjson d "$red" --argjson q "$queued" '(reduce ($a[], $b[], $m[], $o[], $d[]) as $r ([]; if index($r) then . else . + [$r] end)) - $q')
              echo "claim PRs missing required checks: $missing"
              echo "claim PRs with a dead agent run: $orphans"
              echo "claim PRs red with no rework since: $red"
              echo "claim PRs picked by the sweep: $prs"
            else
              echo "::warning::merge-queue read failed; skipping all claim-PR re-dispatch this run"
              prs='[]'
            fi
          fi
          refs=$(for n in $nums; do gh api "repos/$GITHUB_REPOSITORY/issues/$n"; done |
            jq -sc --argjson prs "${prs:-[]}" '[.[] | select(.issue_dependencies_summary.blocked_by == 0 and any(.labels[]; .name == "agent-ready"))]
              | sort_by((if any(.labels[]; .name == "priority-now") then 0 else 1 end), .created_at)
              | map("claim/issue-\(.number)") | . + ($prs - .) | .[:256]')
          echo "refs=${refs:-[]}" >> "$GITHUB_OUTPUT"
          echo "stalled_refs=$stalled_refs" >> "$GITHUB_OUTPUT"
  unblocked:
    needs: list
    if: vars.FLEET_DISPATCH_PAUSED != 'true' && needs.list.outputs.refs != '[]'
    strategy:
      fail-fast: false
      # Bound the sweep fan-out to live seat slots. The matrix starts one worker
      # per listed ref at once; a 14-ref sweep put ~14 workers on the LiteLLM
      # router against ~7 live parallel slots and 429'd them into strikes
      # (fleet-ops#8553). Stock Actions knob, no new files: strategy.max-parallel,
      # tunable per repo via vars.AGENT_MAX_PARALLEL (unset -> 4, the Devin lane's cap of 4).
      # The Gate counts live Devin workers, but matrix jobs start in the same
      # second and all read 0, so 9 of 10 hit Devin's rate limit on 2026-09-29
      # (run 36621293000); a fan-out of 4 cannot exceed the cap.
      # This bounds only this matrix. The new/rework/ejected jobs above are one
      # dispatch per event and are NOT throttled by max-parallel; bounding that
      # aggregate is host runner-count config (deploy is Nish-gated). Sweeps
      # themselves are one running plus one waiting (concurrency above).
      max-parallel: ${{ fromJSON(vars.AGENT_MAX_PARALLEL || '4') }}
      matrix:
        ref: ${{ fromJSON(needs.list.outputs.refs) }}
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: ${{ matrix.ref }}
  # A claim PR outlives its issue. Nothing closed the PR when the issue closed
  # not-by-merge (0509 09-23: #4297 #4268 #4212 #4211 sat open until hand-closed),
  # so those PRs blocked the queue noise for days. Close the open claim PR and
  # delete its branch. Close-by-merge skips itself: a merged PR is not OPEN, so
  # --state open finds nothing and the normal path is untouched. Not gated on
  # AGENT_MODE: this removes work from the queue in every mode and dispatches
  # nothing.
  close-claim:
    # issue=<N> too: a close made with GITHUB_TOKEN fires no
    # issues.closed, and the caller then dispatches the issue by number. Without this its
    # claim PR stayed open (0509 #5081 #5019 #5010 #4922 #4902 #4683).
    if: >-
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (inputs.issue != '' && inputs.task != 'miss-review')
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    permissions:
      # pull-requests: write closes the PR; contents: write is what
      # --delete-branch needs to delete the ref (fleet-ops#8457).
      pull-requests: write
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        # The event can be stale: a worker that closes and reopens its issue
        # still fires this, and it closed a graded PR (0509 #4972/#5012).
        run: |
          [ "$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json state --jq .state)" = CLOSED ] || exit 0
          for pr in $(gh pr list -R "$GITHUB_REPOSITORY" --head "claim/issue-$ISSUE" --state open --json number --jq '.[].number'); do
            # Re-check: the one race this guards is a merge landing between the
            # list and the close, which must skip, not fail.
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json state --jq .state | grep -qx OPEN || continue
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch \
              --comment "issue #$ISSUE closed with this claim PR open; closing it here (fleet-ops#8457)"
          done
  # Miss review. Off unless vars.MISS_REVIEW is live. One review per issue
  # (concurrency group); a second event inside 1 h is skipped in agent.yml's
  # Gate. Design A (winner): stock GitHub events, one uses: agent.yml job.
  # Design B (rejected): classify misses inside the 6 h sweep. That waits on a
  # clock, and Nish 2026-10-04 said a review starts when something goes wrong,
  # never on a clock. Graft: stalled still uses the existing sweep, because
  # that requeue is the miss event and GitHub emits no other signal for it.
  # failed / agent attempt cap is owned by agent.yml's Gate (the same run that
  # posts the cap comment), so an issue_comment cannot start a second review.
  miss-review:
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' && vars.MISS_REVIEW == 'live' && (
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent-failed') ||
        (github.event_name == 'issues' && github.event.action == 'reopened') ||
        (github.event_name == 'issue_comment' && github.event.action == 'created' &&
          (startsWith(github.event.comment.body, 'park:') || startsWith(github.event.comment.body, 'opus-vet:')) &&
          (github.event.comment.author_association == 'OWNER' ||
           github.event.comment.author_association == 'MEMBER' ||
           github.event.comment.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'workflow_dispatch' && inputs.task == 'miss-review' && inputs.issue != '')
      )
    concurrency:
      group: miss-review-${{ github.repository }}-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: claim/issue-${{ github.event.issue.number || inputs.issue }}-miss-review
  miss-review-pr:
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' && vars.MISS_REVIEW == 'live' && github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.merged == false && startsWith(github.event.pull_request.head.ref, 'claim/issue-')) ||
       (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Revert')))
    concurrency:
      group: miss-review-${{ github.repository }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: ${{ startsWith(github.event.pull_request.head.ref, 'claim/issue-') && format('{0}-miss-review', github.event.pull_request.head.ref) || format('claim/issue-{0}-miss-review', github.event.pull_request.number) }}
  miss-stalled:
    needs: list
    if: vars.FLEET_DISPATCH_PAUSED != 'true' && vars.MISS_REVIEW == 'live' && needs.list.outputs.stalled_refs != '' && needs.list.outputs.stalled_refs != '[]'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.AGENT_MAX_PARALLEL || '4') }}
      matrix:
        ref: ${{ fromJSON(needs.list.outputs.stalled_refs) }}
    concurrency:
      group: miss-review-${{ github.repository }}-${{ matrix.ref }}
      cancel-in-progress: false
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main # runner group 3 allows only agent.yml@refs/heads/main; a SHA pin strands every job
    permissions:
      issues: write
      pull-requests: write
    with:
      ref: ${{ matrix.ref }}
  # A parked issue is one the fleet cannot finish: the attempt cap, two failed
  # runs, or a worker parking it. The label was the whole hand-off and nothing
  # read it, so parked work sat (fleet-ops #9211 #9063 #9055 #9015 #8973 #8574
  # #8561 #8444 open, 0509 7). This job picks the issue up and runs the
  # orchestrator, which is a Claude Code session on the runner user's OWN gh
  # login, not the worker App: that login can push .github/workflows/**, which
  # the App cannot by design (Nish 2026-10-04). Most parked work is exactly that
  # class, and agent.yml's Gate now routes it here instead of burning a run.
  # Not a reusable call to agent.yml on purpose: agent.yml is the worker (App
  # token, bwrap jail, one claim branch), and this is the hand-off (runner
  # login, plain worktree, branch orch/issue-<N>).
  orchestrate:
    # A bot sender alone is not trust: any GitHub App in the org can label an
    # issue and would start a session with bypassPermissions. The login must be
    # Nish, or the fleet App / github-actions (the Gate's workflow-path route
    # and agent.yml's attempt-cap park label). workflow_dispatch needs no sender
    # test: it is already write-access only.
    if: >-
      vars.FLEET_DISPATCH_PAUSED != 'true' &&
      vars.ORCHESTRATE != 'off' && (
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'needs-orchestrator' &&
          (github.event.sender.login == 'nish3451' ||
           (endsWith(github.event.sender.login, '[bot]') &&
            (github.event.sender.login == 'nishfleet-worker[bot]' || github.event.sender.login == 'github-actions[bot]')))) ||
        (github.event_name == 'workflow_dispatch' && inputs.task == 'orchestrate' && inputs.issue != '')
      )
    concurrency:
      group: orchestrate-${{ github.repository }}
      cancel-in-progress: false
    runs-on: [self-hosted, agent]
    timeout-minutes: 60
    # issues: read is the whole grant: the steps read the issue, and the
    # orchestrator session does its own writes as the runner login. The GITHUB_TOKEN
    # is never handed to claude (step work unsets GH_TOKEN and GITHUB_TOKEN), so
    # this token cannot reach the session that pushes workflow files.
    permissions:
      # issues: read is the job's own grant (steps read the issue), contents:
      # read is added because steps a and d read git refs and PR lists through
      # the API, which GitHub scopes to contents even for a read.
      # pull-requests: read, because on a private repo the cleanup step's PR
      # list fails without it ("Resource not accessible by integration"), and a
      # failed list reads as "no PR". First seen on drive while it was private;
      # drive is public in Nishfleet since 2026-10-06, and the grant stays for
      # any private caller.
      # actions: read, because the daily cap lists this workflow's runs and
      # their jobs; without it that call is a 403 under GITHUB_TOKEN.
      issues: read
      contents: read
      pull-requests: read
      actions: read
    env:
      REPO: ${{ github.repository }}
      # An issues.labeled event has no inputs.issue, so a 0509 stub that calls
      # this file for a label-only trigger passes '' and the event number is read.
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Check the issue is still parked
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          # Raw values: the defaults live in bash, so a literal 0 survives.
          DAILY_MAX: ${{ vars.ORCHESTRATE_DAILY_MAX }}
          MODEL_VAR: ${{ vars.ORCHESTRATE_MODEL }}
          RUNNER_VAR: ${{ vars.ORCHESTRATE_RUNNER }}
          RUN_ID: ${{ github.run_id }}
          # Counts the jobs of earlier runs whose session step ended (success
          # or failure). Input: a slurped array of job objects from the
          # actions jobs API. The name match covers a caller stub, whose job
          # reads "<stub job> / orchestrate".
          CAP_COUNT: >-
            [.[] | select(.name == "orchestrate" or (.name | endswith(" / orchestrate")))
              | select(any(.steps[]?; .name == "Run the orchestrator session" and (.conclusion == "success" or .conclusion == "failure")))]
            | length
        run: |
          set -euo pipefail
          [ -n "$ISSUE" ] || { echo "orchestrate: no issue number on this event; skip"; exit 0; }
          state=$(gh issue view "$ISSUE" -R "$REPO" --json state --jq .state)
          labels=,$(gh issue view "$ISSUE" -R "$REPO" --json labels --jq '[.labels[].name]|join(",")'),
          [ "$state" = OPEN ] || { echo "orchestrate: #$ISSUE is $state; skip"; exit 0; }
          # Relabelled back to agent-ready (someone picked it up), or a previous
          # hand-off already ran and produced no PR: both end the loop here
          # rather than in the always() step, so nothing is built.
          case $labels in *,needs-orchestrator,*) ;; *) echo "orchestrate: #$ISSUE no longer has needs-orchestrator; skip"; exit 0 ;; esac
          case $labels in *,orchestrator-tried,*) echo "orchestrate: #$ISSUE already has orchestrator-tried; skip"; exit 0 ;; esac
          branch="orch/issue-$ISSUE"
          if gh api "repos/$REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            echo "orchestrate: $branch exists on origin; another hand-off owns #$ISSUE; skip"
            exit 0
          fi
          # Daily cap (fleet-ops#9351): a 2026-10-06 day of 26 Opus hand-offs
          # used ~31% of Nish's weekly Claude limit. It counts hand-off RUNS
          # since 00:00 IST, whose session step concluded, over this workflow's
          # `issues` and `workflow_dispatch` runs (the only events that can
          # start this job). Over the cap the run skips and the issue keeps
          # needs-orchestrator for a later dispatch. 0 = no cap.
          DAILY_MAX=${DAILY_MAX:-10}
          case $DAILY_MAX in
            ''|*[!0-9]*) echo "::error::orchestrate: ORCHESTRATE_DAILY_MAX must be a non-negative integer, got '$DAILY_MAX'"; exit 1 ;;
          esac
          if [ "$DAILY_MAX" -gt 0 ]; then
            since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%FT%TZ)
            wid=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id)
            ids=
            for ev in issues workflow_dispatch; do
              ids+=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/$wid/runs" -f event="$ev" -f created=">=${since%%T*}" -f per_page=100 --jq ".workflow_runs[] | select(.created_at >= \"$since\") | .id")$'\n'
            done
            ids=$(printf '%s' "$ids" | grep -E '^[0-9]+$' | sort -u || true)
            nruns=$(printf '%s' "$ids" | grep -c . || true)
            # More runs than this: the count is unknown, so cap rather than
            # let a busy repo run uncounted.
            if [ "$nruns" -gt 400 ]; then
              echo "::warning::orchestrate: $nruns runs since 00:00 IST in $REPO, too many to count; daily cap holds #$ISSUE (keeps needs-orchestrator)"
              exit 0
            fi
            jobs_json=$(for id in $ids; do gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" --jq '.jobs[] | {name, steps: [.steps[]? | {name, conclusion}]}'; done | jq -s .)
            count=$(jq "$CAP_COUNT" <<<"$jobs_json")
            if [ "$count" -ge "$DAILY_MAX" ]; then
              echo "::warning::orchestrate: daily cap reached ($count/$DAILY_MAX hand-off runs since 00:00 IST in $REPO); #$ISSUE keeps needs-orchestrator; dispatch task=orchestrate issue=$ISSUE after midnight IST"
              exit 0
            fi
            echo "orchestrate: $count/$DAILY_MAX hand-off runs since 00:00 IST in $REPO"
          else
            echo "orchestrate: daily cap off (ORCHESTRATE_DAILY_MAX=0)"
          fi
          # Sonnet unless the issue asks for Opus or ORCHESTRATE_MODEL is off.
          # An empty model leaves the session default (Opus) in place.
          MODEL_VAR=${MODEL_VAR:-claude-sonnet-5-5}
          if [[ $labels == *,needs-opus,* || $MODEL_VAR == off ]]; then
            { echo "model="; echo "turns=80"; } >> "$GITHUB_OUTPUT"
          else
            { echo "model=$MODEL_VAR"; echo "turns=40"; } >> "$GITHUB_OUTPUT"
          fi
          # Pi on a LiteLLM seat unless the issue asks for Opus or
          # ORCHESTRATE_RUNNER is claude (fleet-ops#9407: Claude burn).
          if [[ $labels == *,needs-opus,* || $MODEL_VAR == off || ${RUNNER_VAR:-pi} == claude ]]; then
            echo "runner=claude" >> "$GITHUB_OUTPUT"
          else
            echo "runner=pi" >> "$GITHUB_OUTPUT"
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Fresh worktree on origin/main
        id: worktree
        if: steps.issue.outputs.go == 'true'
        # No GH_TOKEN: every git call here authenticates as the runner user.
        run: |
          set -euo pipefail
          # The mirror lives under $HOME/workspaces/agent-worktrees, beside the
          # worker worktrees, never in /tmp or inside the deploy clone: a
          # checkout a session can re-clone is not a base to branch from.
          # A bare repo needs no checkout of its own, and `git worktree add`
          # works from one (git 2.43 proven).
          # shellcheck disable=SC2153 # REPO is the job-level env, not a misspelling
          repo=${REPO#*/}
          mirror="$HOME/workspaces/agent-worktrees/.orch-mirror/$repo.git"
          wt="$HOME/workspaces/agent-worktrees/orch-$repo-$ISSUE"
          if [ ! -d "$mirror" ]; then
            mkdir -p "$(dirname "$mirror")"
            git init -q --bare "$mirror"
            git -C "$mirror" remote add origin "https://github.com/$REPO.git"
          fi
          # No GH_TOKEN on the fetch either: the App token cannot read a private
          # repo and has no workflows scope. The runner user's own gh login is the
          # credential (~/.gitconfig -> gh auth git-credential), and a repo it
          # cannot read fails this step loudly instead of claiming an issue it
          # cannot build.
          # The refspec maps into refs/remotes/origin/*, NOT into refs/heads/*:
          # with prune, a heads->heads refspec deletes every local branch that is
          # not on origin, which is exactly the branch holding a hand-off that
          # died before its push (proven live: --prune removed
          # refs/heads/orch/issue-localonly). Pruning only refs/remotes is safe.
          # It also gives the worktree a real origin/main, which the prompt's
          # "git log --oneline origin/main..HEAD" reuse step needs.
          env -u GH_TOKEN -u GITHUB_TOKEN git -C "$mirror" fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'
          # A killed run can leave the worktree registered, and a bare repo
          # refuses to check one branch out in two worktrees at once. Remove it
          # through git first, so the registration goes with the directory.
          git -C "$mirror" worktree prune
          git -C "$mirror" worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt"
          git -C "$mirror" worktree prune
          branch_ref="refs/heads/orch/issue-$ISSUE"
          if git -C "$mirror" show-ref --verify --quiet "$branch_ref"; then
            # A hand-off that died before its push: its branch holds its commits,
            # so start from it instead of failing on "branch already exists".
            # Step "issue" already bailed when that branch is on origin, so this
            # is only the local half.
            while IFS= read -r line; do
              case $line in
                "worktree "*) wdir=${line#worktree } ;;
                "branch $branch_ref")
                  env -u GH_TOKEN -u GITHUB_TOKEN git -C "$mirror" worktree remove --force "$wdir" 2>/dev/null || rm -rf "$wdir"
                  git -C "$mirror" worktree prune ;;
              esac
            done < <(git -C "$mirror" worktree list --porcelain)
            env -u GH_TOKEN -u GITHUB_TOKEN git -C "$mirror" worktree add -q "$wt" "$branch_ref"
          else
            env -u GH_TOKEN -u GITHUB_TOKEN git -C "$mirror" worktree add -q -b "orch/issue-$ISSUE" "$wt" refs/remotes/origin/main
          fi
          echo "worktree=$wt" >> "$GITHUB_OUTPUT"
      - name: Run the orchestrator session
        if: steps.issue.outputs.go == 'true' && steps.worktree.outputs.worktree != ''
        env:
          # The prompt is a file, not a ${{ }} inline: zizmor's
          # template-injection rule fails the workflow otherwise.
          ISSUE_N: ${{ github.event.issue.number || inputs.issue }}
          REPO_NAME: ${{ github.repository }}
          WORKTREE: ${{ steps.worktree.outputs.worktree }}
          MODEL: ${{ steps.issue.outputs.model }}
          TURNS: ${{ steps.issue.outputs.turns }}
          RUNNER: ${{ steps.issue.outputs.runner }}
          SEAT: ${{ vars.ORCHESTRATE_SEAT }}
          HOOKS: ${{ vars.ORCHESTRATE_HOOKS }}
        run: |
          set -euo pipefail
          cd "$WORKTREE"
          # The prompt is the file from THIS checkout (origin/main of the repo
          # under hand-off). A hand-off on a repo that has no such file falls
          # back to the fleet's live copy, never a stale branch copy.
          prompt="prompts/orchestrator-handoff.md"
          if [ ! -f "$prompt" ]; then
            echo "::warning::$REPO_NAME@main has no $prompt; using the fleet copy"
            prompt="$HOME/workspaces/tooling/fleet-ops-deploy-clone/prompts/orchestrator-handoff.md"
          fi
          { cat "$prompt"; printf '\n\nTarget: %s#%s\nBranch: orch/issue-%s. It is checked out already; run git log --oneline origin/main..HEAD before you build, because an earlier hand-off may have left commits here.\n' "$REPO_NAME" "$ISSUE_N" "$ISSUE_N"; } > "$RUNNER_TEMP/orchestrator-prompt.md"
          # Sonnet by default; the session default (Opus) only for a needs-opus
          # issue, where MODEL is empty (fleet-ops#9351: Opus on every hand-off
          # burned the weekly limit). --output-format json puts modelUsage in
          # the log, the proof of which model ran. GH_TOKEN and GITHUB_TOKEN are unset so the
          # session authenticates as the runner user, whose gh login can push
          # .github/workflows/** -- the whole reason this job exists.
          # The prompt goes on stdin: it opens with `---` front matter, and as
          # an argument the CLI parses that as an option and exits 1 (run
          # 37207149948: "error: unknown option '---").
          if [ "$RUNNER" = pi ]; then
            # Pi on a LiteLLM seat: no Claude spend. Pi has no turn cap, so
            # the timeout below is the wall. The litellm provider reads
            # FLEET_TASK_ID for its session-id header and exits 1 without it.
            # Seat switch: ORCHESTRATE_SEAT (default worker-capable).
            # Claude switch: ORCHESTRATE_RUNNER=claude, or a needs-opus label.
            env -u GH_TOKEN -u GITHUB_TOKEN FLEET_TASK_ID="orch-${REPO_NAME#*/}-$ISSUE_N" \
              timeout 3000 /home/nish/.local/bin/pi --print \
              --provider litellm --model "${SEAT:-worker-capable}" \
              < "$RUNNER_TEMP/orchestrator-prompt.md"
            exit 0
          fi
          model_args=()
          [ -z "$MODEL" ] || model_args=(--model "$MODEL")
          # The repo's hooks are for interactive and worker sessions; here they
          # only spend turns. ORCHESTRATE_HOOKS=on keeps them.
          hook_args=(--settings '{"disableAllHooks":true}')
          [ "$HOOKS" != on ] || hook_args=()
          env -u GH_TOKEN -u GITHUB_TOKEN timeout 3000 /home/nish/.local/bin/claude -p \
            "${model_args[@]}" \
            "${hook_args[@]}" \
            --output-format json \
            --permission-mode bypassPermissions \
            --max-turns "$TURNS" \
            < "$RUNNER_TEMP/orchestrator-prompt.md"
      - name: Clean up and mark a PR-less hand-off
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # steps.* goes through env, never into the run block directly
          # (zizmor template-injection; the same reason WORKTREE above is an
          # env var).
          GO: ${{ steps.issue.outputs.go }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153 # REPO is the job-level env, not a misspelling
          repo=${REPO#*/}
          mirror="$HOME/workspaces/agent-worktrees/.orch-mirror/$repo.git"
          wt="$HOME/workspaces/agent-worktrees/orch-$repo-$ISSUE"
          # Worktree removal first and unconditional: a session cut at the job
          # wall can leave the worktree, and a leftover checkout costs the next
          # hand-off a clone. remove --force is how a dirty tree goes, and this
          # is never a pgrep-kill of anything (a wrong pattern there can take a
          # worker's process with it, fleet-ops#7743).
          if [ -d "$mirror" ]; then
            env -u GH_TOKEN -u GITHUB_TOKEN git -C "$mirror" worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt"
            env -u GH_TOKEN -u GITHUB_TOKEN git -C "$mirror" worktree prune || true
          fi
          # Nothing was built: the session step was skipped or the issue check
          # bailed. No PR exists and none is coming, but this run never started
          # work, so it does not park the issue.
          [ "$GO" = true ] || {
            echo "orchestrate: nothing was built on this run; no park mark"
            exit 0
          }
          [ -n "$ISSUE" ] || exit 0
          # No PR for this head: mark it, so the label loop stops. The next
          # orchestrate event (a re-label, or a replay dispatch) sees
          # orchestrator-tried and skips; only a person clears the label.
          if gh pr list -R "$REPO" --head "orch/issue-$ISSUE" --state all --json number --jq 'length' | grep -qxE '[1-9][0-9]*'; then
            echo "orchestrate: #$ISSUE has a PR on orch/issue-$ISSUE; nothing to mark"
            exit 0
          fi
          # The writes need issues: write, which this job deliberately does not
          # hold: the orchestrator session, not this job, owns pushing. So the
          # mark is posted as the runner user's own login (gh's stored host
          # credential, the same one the session pushes with).
          # --force makes the label idempotent, so a newly stubbed repo without
          # it does not fail the mark (drive#199, 2026-10-04).
          env -u GH_TOKEN -u GITHUB_TOKEN gh label create orchestrator-tried -R "$REPO" --force --color BFD4F2 --description "Orchestrator hand-off ended without a PR; a person clears it to retry"
          env -u GH_TOKEN -u GITHUB_TOKEN gh issue edit "$ISSUE" -R "$REPO" --add-label orchestrator-tried --remove-label needs-orchestrator
          env -u GH_TOKEN -u GITHUB_TOKEN gh issue comment "$ISSUE" -R "$REPO" --body "orchestrator hand-off ended without a PR: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          echo "orchestrate: #$ISSUE marked orchestrator-tried (no PR)"
