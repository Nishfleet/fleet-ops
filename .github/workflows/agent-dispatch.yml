# Events that put work on the agent queue. Repo variable AGENT_MODE:
#   shadow (default) = only issues also labelled shadow-actions, no rework
#   live             = every agent-ready issue, plus rework on red CI
name: agent-dispatch
on:
  issues:
    types: [labeled, closed]
  workflow_dispatch:
  # pull_request_target, not pull_request: pull_request never runs while a PR
  # has a merge conflict. No PR code is checked out or run here.
  pull_request_target:
    types: [dequeued, auto_merge_disabled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # GitHub emits no event when a job queued for a self-hosted runner expires
  # after 24h, or when a claim PR turns DIRTY outside the merge queue (0509#4373).
  # The sweep below catches both; 6h stays well under the 24h expiry.
  schedule:
    - cron: '17 */6 * * *'
permissions:
  issues: write
jobs:
  new:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'agent-ready' &&
      (vars.AGENT_MODE == 'live' || contains(github.event.issue.labels.*.name, 'shadow-actions'))
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: claim/issue-${{ github.event.issue.number }}
  rework:
    if: >-
      vars.AGENT_MODE == 'live' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claim/issue-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: ${{ github.event.workflow_run.head_branch }}
  # The merge queue ejected a claim PR (failed checks or a conflict), or its
  # auto-merge was dropped: send the worker back to it.
  ejected:
    if: >-
      vars.AGENT_MODE == 'live' && github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'claim/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: ${{ github.event.pull_request.head.ref }}
  # A closed blocker frees the issues it was blocking; a manual run sweeps
  # every ready, unblocked issue (cutover backfill and missed-event recovery),
  # then every open claim PR without auto-merge (conflicted or ejected).
  # Priority-now first, then oldest. The Gate step in agent.yml re-checks each
  # and its 3-run cap bounds any loop.
  list:
    if: >-
      vars.AGENT_MODE == 'live' &&
      ((github.event_name == 'issues' && github.event.action == 'closed') ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      refs: ${{ steps.list.outputs.refs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED: ${{ github.event.issue.number }}
        run: |
          if [ -n "$CLOSED" ]; then
            nums=$(gh api "repos/$GITHUB_REPOSITORY/issues/$CLOSED/dependencies/blocking" --jq '.[]|select(.state=="open")|.number')
          else
            nums=$(gh issue list -R "$GITHUB_REPOSITORY" -l agent-ready -L 1000 --json number --jq '.[].number')
            prs=$(gh pr list -R "$GITHUB_REPOSITORY" -L 1000 --json headRefName,autoMergeRequest,isDraft \
              --jq '[.[] | select((.headRefName|startswith("claim/issue-")) and .autoMergeRequest == null and (.isDraft|not)) | .headRefName]')
          fi
          refs=$(for n in $nums; do gh api "repos/$GITHUB_REPOSITORY/issues/$n"; done |
            jq -sc --argjson prs "${prs:-[]}" '[.[] | select(.issue_dependencies_summary.blocked_by == 0 and any(.labels[]; .name == "agent-ready"))]
              | sort_by((if any(.labels[]; .name == "priority-now") then 0 else 1 end), .created_at)
              | map("claim/issue-\(.number)") | . + ($prs - .) | .[:256]')
          echo "refs=${refs:-[]}" >> "$GITHUB_OUTPUT"
  unblocked:
    needs: list
    if: needs.list.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.list.outputs.refs) }}
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: ${{ matrix.ref }}
