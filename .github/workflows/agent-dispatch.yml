# Events that put work on the agent queue. Repo variable AGENT_MODE:
#   shadow (default) = only issues also labelled shadow-actions, no rework
#   live             = every agent-ready issue, plus rework on red CI
name: agent-dispatch
on:
  issues:
    types: [labeled, closed]
  # issue=<number> dispatches only that issue's ref, the code path
  # opus-vet.yml's opus-size job uses: an issue relabelled by GITHUB_TOKEN
  # fires no workflow, and workflow_dispatch is the documented trigger
  # GITHUB_TOKEN may start. No input sweeps exactly like the 6h schedule.
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to dispatch, overrides the sweep and its claim-PR append'
        required: false
        type: string
  # Nishfleet/0509 keeps only a trigger stub that calls this file, so the
  # dispatch logic has one copy. github.* is the caller's, so every job below
  # acts on the calling repo. agent_mode carries the caller's AGENT_MODE.
  workflow_call:
    inputs:
      issue:
        required: false
        type: string
        default: ''
      agent_mode:
        required: false
        type: string
        default: ''
  # pull_request_target, not pull_request: pull_request never runs while a PR
  # has a merge conflict. No PR code is checked out or run here.
  pull_request_target:
    types: [dequeued, auto_merge_disabled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # GitHub emits no event when a job queued for a self-hosted runner expires
  # after 24h, or when a claim PR turns DIRTY outside the merge queue (0509#4373).
  # The sweep below catches both; 6h stays well under the 24h expiry.
  schedule:
    - cron: '17 */6 * * *'
permissions:
  issues: write
jobs:
  new:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'agent-ready' &&
      ((inputs.agent_mode || vars.AGENT_MODE) == 'live' || contains(github.event.issue.labels.*.name, 'shadow-actions'))
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: claim/issue-${{ github.event.issue.number }}
  rework:
    if: >-
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claim/issue-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: ${{ github.event.workflow_run.head_branch }}
  # The merge queue ejected a claim PR (failed checks or a conflict), or its
  # auto-merge was dropped: send the worker back to it.
  ejected:
    if: >-
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' && github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'claim/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: ${{ github.event.pull_request.head.ref }}
  # A closed blocker frees the issues it was blocking; a manual run sweeps
  # every ready, unblocked issue (cutover backfill and missed-event recovery),
  # then every open claim PR without auto-merge (conflicted or ejected).
  # Priority-now first, then oldest. The Gate step in agent.yml re-checks each
  # and its 3-run cap bounds any loop.
  list:
    if: >-
      (inputs.agent_mode || vars.AGENT_MODE) == 'live' &&
      ((github.event_name == 'issues' && github.event.action == 'closed') ||
       github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      refs: ${{ steps.list.outputs.refs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED: ${{ github.event.issue.number }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then
            # One issue, no PR append: the jq below still re-checks agent-ready
            # and blocked_by, and agent.yml's Gate re-checks again, so a
            # dispatch of an issue that was split or parked is skipped.
            nums=$ISSUE
          elif [ -n "$CLOSED" ]; then
            nums=$(gh api "repos/$GITHUB_REPOSITORY/issues/$CLOSED/dependencies/blocking" --jq '.[]|select(.state=="open")|.number')
          else
            nums=$(gh issue list -R "$GITHUB_REPOSITORY" -l agent-ready -L 1000 --json number --jq '.[].number')
            prs=$(gh pr list -R "$GITHUB_REPOSITORY" -L 1000 --json headRefName,autoMergeRequest,isDraft \
              --jq '[.[] | select((.headRefName|startswith("claim/issue-")) and .autoMergeRequest == null and (.isDraft|not)) | .headRefName]')
          fi
          refs=$(for n in $nums; do gh api "repos/$GITHUB_REPOSITORY/issues/$n"; done |
            jq -sc --argjson prs "${prs:-[]}" '[.[] | select(.issue_dependencies_summary.blocked_by == 0 and any(.labels[]; .name == "agent-ready"))]
              | sort_by((if any(.labels[]; .name == "priority-now") then 0 else 1 end), .created_at)
              | map("claim/issue-\(.number)") | . + ($prs - .) | .[:256]')
          echo "refs=${refs:-[]}" >> "$GITHUB_OUTPUT"
  unblocked:
    needs: list
    if: needs.list.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.list.outputs.refs) }}
    uses: Nishfleet/fleet-ops/.github/workflows/agent.yml@main
    with:
      ref: ${{ matrix.ref }}
  # A claim PR outlives its issue. Nothing closed the PR when the issue closed
  # not-by-merge (0509 09-23: #4297 #4268 #4212 #4211 sat open until hand-closed),
  # so those PRs blocked the queue noise for days. Close the open claim PR and
  # delete its branch. Close-by-merge skips itself: a merged PR is not OPEN, so
  # --state open finds nothing and the normal path is untouched. Not gated on
  # AGENT_MODE: this removes work from the queue in every mode and dispatches
  # nothing.
  close-claim:
    if: >-
      github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      # pull-requests: write closes the PR; contents: write is what
      # --delete-branch needs to delete the ref (fleet-ops#8457).
      pull-requests: write
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          for pr in $(gh pr list -R "$GITHUB_REPOSITORY" --head "claim/issue-$ISSUE" --state open --json number --jq '.[].number'); do
            # Re-check: the one race this guards is a merge landing between the
            # list and the close, which must skip, not fail.
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json state --jq .state | grep -qx OPEN || continue
            gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch \
              --comment "issue #$ISSUE closed with this claim PR open; closing it here (fleet-ops#8457)"
          done
