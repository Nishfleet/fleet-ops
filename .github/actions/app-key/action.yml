# agent.yml's arm, review and inish-daily jobs each mint an App token, and each read the same key
# file to do it. One definition, so the key is read and masked in one place (fleet-ops#10990).
name: app-key
description: Read the fleet App private key and output it as a masked `pem` output.
outputs:
  pem:
    value: ${{ steps.read.outputs.pem }}
runs:
  using: composite
  steps:
    - id: read
      shell: bash -e {0}
      run: |
        keyfile="${CREDENTIALS_DIRECTORY:-$HOME/.config/fleet-worker}/nishfleet-worker.private-key.pem"
        [ -s "$keyfile" ] || { echo "::error::app private key file missing on runner"; exit 1; }
        grep . "$keyfile" | sed 's/^/::add-mask::/'
        { echo 'pem<<APP_PRIVATE_KEY_END'; cat "$keyfile"; echo APP_PRIVATE_KEY_END; } >> "$GITHUB_OUTPUT"
