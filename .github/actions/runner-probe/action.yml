# Fails the job when a path its runner unit hides with InaccessiblePaths= is readable or writable
# from the job, or when a path it covers with a TemporaryFileSystem= mount is not a mount point in
# the job (fleet-ops#9983, #10886).
name: runner-probe
description: Fail when a path the runner unit hides is a host path in the job.
inputs:
  require-lock:
    description: Fail, not warn, when the unit hides no paths.
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUIRE: ${{ inputs.require-lock }}
      run: |
        set -f
        unit=$(grep -o 'actions\.runner\.[^/]*\.service' /proc/self/cgroup | tail -1)
        test -n "$unit" || { echo "::error::this job is not in an actions.runner unit"; exit 1; }
        n=0; bad=0
        # Both keys hide a path, and both leave a host path behind when they do not apply, so one
        # loop covers them. A masked path has no options and a mount may, so each value gets a
        # "mask:" or "mount:" prefix here, and the loop reads the kind and then the path. No path
        # this repo masks holds a colon: tests/test_runner_jail_start_state.py fails when one does,
        # because that colon would split the path into mount options.
        # A path the unit hides is absent here, or unreadable, and passes. A path the unit covers
        # with a mount reads fine, because an empty tmpfs is readable by design, so the mount itself
        # is the hide: it is there, and it is a mount point in this job's namespace. What fails is a
        # masked path that reads, which is a host path, and a mount that is there, reads, and is no
        # mount point. A host mount point under a mask is not caught: it reads and mountpoint says
        # yes. A unit that hides a parent directory whole drops every mount nested under it
        # (namespace.c: drop_inaccessible), so those paths are absent here and nothing is left to
        # read. The token dirs exist before the unit starts (ExecStartPre=+/usr/bin/install in the
        # drop-ins), and systemd makes any mount point still absent itself (mount_tmpfs() calls
        # mkdir_p()), so a directory the mint creates after that start is covered (fleet-ops#10886).
        for v in $(systemctl show -p TemporaryFileSystem --value "$unit" | sed '/^$/d; s/^/mount:/') $(systemctl show -p InaccessiblePaths --value "$unit" | sed '/^$/d; s/^/mask:/'); do
          kind=${v%%:*}; p=${v#*:}; p=${p%%:*}; p=${p#-}; n=$((n + 1))
          if { [ "$kind" = mask ] && { test -r "$p" || test -w "$p"; }; } || { [ "$kind" = mount ] && [ -e "$p" ] && ! mountpoint -q "$p"; }; then echo "::error::$p is a host path in this job, so nothing hides it"; bad=$((bad + 1)); fi
        done
        echo "runner=$RUNNER_NAME unit=$unit checked=$n readable=$bad"
        if [ "$n" -eq 0 ]; then
          if [ "$REQUIRE" = true ]; then echo "::error::$unit hides no paths"; bad=1; else echo "::warning::$unit hides no paths"; fi
        fi
        test "$bad" -eq 0
