# Fails the job when a path its runner unit hides (InaccessiblePaths) can be read or written (fleet-ops#9983).
name: runner-probe
description: Fail when a path the runner unit hides is readable from the job.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -f
        unit=$(grep -o 'actions\.runner\.[^/]*\.service' /proc/self/cgroup | tail -1)
        test -n "$unit" || { echo "::error::this job is not in an actions.runner unit"; exit 1; }
        n=0; bad=0
        for p in $(systemctl show -p InaccessiblePaths --value "$unit"); do
          p=${p#-}; n=$((n + 1))
          if test -r "$p" || test -w "$p"; then echo "::error::$p is readable from this job"; bad=$((bad + 1)); fi
        done
        echo "runner=$RUNNER_NAME unit=$unit checked=$n readable=$bad"
        test "$n" -ne 0 || echo "::warning::$unit hides no paths"
        test "$bad" -eq 0
