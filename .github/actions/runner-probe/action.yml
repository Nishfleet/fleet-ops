# Fails the job when a path its runner unit hides with InaccessiblePaths= is readable or writable
# from the job, or when a path it covers with a TemporaryFileSystem= mount is not a mount point in
# the job (fleet-ops#9983, #10886).
name: runner-probe
description: Fail when a path the runner unit hides is a host path in the job.
inputs:
  require-lock:
    description: Fail, not warn, when the unit hides no paths.
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUIRE: ${{ inputs.require-lock }}
      run: |
        set -f
        unit=$(grep -o 'actions\.runner\.[^/]*\.service' /proc/self/cgroup | tail -1)
        test -n "$unit" || { echo "::error::this job is not in an actions.runner unit"; exit 1; }
        n=0; bad=0
        # Both keys hide a path, and both leave a host path behind when they do not apply, so one
        # loop covers them. The loop separates them by the options: systemd prints a mount as
        # "path:options" and a masked path has no colon (no path this repo masks holds one:
        # tests/test_runner_jail_start_state.py fails when one does, because a colon would make
        # the probe read a masked path as a mount and drop its test).
        # A path the unit hides below is absent here, or unreadable, and passes. A path the unit
        # covers with a mount reads fine, because an empty tmpfs is readable by design, so the
        # mount itself is the hide: it is there, and it is a mount point in this job's namespace.
        # What fails is a masked path that reads, which is a host path, and a mount that is there,
        # reads, and is no mount point. A mount that is no mount point also fails when the host
        # path is itself a mount point (fleet-ci-3 hides /run/user/1000 as a mount point, and a
        # unit that starts before that mount exists would leave the host one readable).
        # A unit that hides a parent directory whole drops every mount nested under it
        # (namespace.c: drop_inaccessible), so those paths are absent here and nothing is left to
        # read. systemd made the mount points before this job started (mount_tmpfs() calls
        # mkdir_p()), so a directory the mint creates after that start is covered (fleet-ops#10886).
        for v in $(systemctl show -p InaccessiblePaths,TemporaryFileSystem --value "$unit"); do
          p=${v%%:*}; p=${p#-}; n=$((n + 1))
          if { test -r "$p" || test -w "$p"; } && { [ "${v#*:}" = "$v" ] || { [ -e "$p" ] && ! mountpoint -q "$p"; }; }; then echo "::error::$p is a host path in this job, so nothing hides it"; bad=$((bad + 1)); fi
        done
        echo "runner=$RUNNER_NAME unit=$unit checked=$n readable=$bad"
        if [ "$n" -eq 0 ]; then
          if [ "$REQUIRE" = true ]; then echo "::error::$unit hides no paths"; bad=1; else echo "::warning::$unit hides no paths"; fi
        fi
        test "$bad" -eq 0
