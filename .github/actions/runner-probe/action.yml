# Fails the job when a path its runner sandbox hides can be read or written (fleet-ops#9983). The hidden list comes
# from the job's own mount namespace (/proc/self/mountinfo), the paths the running runner actually hides. systemctl
# show would read the loaded unit config, which names paths the process never hid: a drop-in reaches a runner only
# at its next start and the deploy restarts no runner (fleet-ops#10898), so every job on it failed the probe for as
# long as the window lasted (fleet-ops#11072, #11016).
name: runner-probe
description: Fail when a path the running runner sandbox hides is readable from the job.
inputs:
  require-lock:
    description: Fail, not warn, when the unit hides no paths.
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUIRE: ${{ inputs.require-lock }}
      run: |
        set -f
        unit=$(grep -o 'actions\.runner\.[^/]*\.service' /proc/self/cgroup | tail -1)
        test -n "$unit" || { echo "::error::this job is not in an actions.runner unit"; exit 1; }
        n=0; bad=0
        for p in $(awk '$4 ~ /^\/systemd\/inaccessible\// {print $5}' /proc/self/mountinfo); do
          n=$((n + 1))
          if test -r "$p" || test -w "$p"; then echo "::error::$p is readable from this job"; bad=$((bad + 1)); fi
        done
        echo "runner=$RUNNER_NAME unit=$unit checked=$n readable=$bad"
        if [ "$n" -eq 0 ]; then
          if [ "$REQUIRE" = true ]; then echo "::error::$unit hides no paths"; bad=1; else echo "::warning::$unit hides no paths"; fi
        fi
        test "$bad" -eq 0
