# opus-review grader steps (fleet-ops#8621). Prompt, action pin and fail-closed
# label check are the fleet-ops job's. grade-non-worker true grades every author
# (fleet-ops#8757). false grades nishfleet-worker[bot] only.
name: opus-review
description: Grade a pull request from a different model family than its author.
inputs:
  grade-non-worker:
    description: Grade authors other than nishfleet-worker[bot]. fleet-ops passes true.
    required: false
    default: "false"
  claude-token:
    description: CLAUDE_CODE_OAUTH_TOKEN for worker pull requests.
    required: true
  cursor-api-key:
    description: CURSOR_API_KEY for the Kimi engine. Empty when that engine does not run.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: github.event_name == 'pull_request' && (inputs.grade-non-worker == 'true' || github.event.pull_request.user.login == 'nishfleet-worker[bot]')
      with:
        fetch-depth: 1
    - uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # main 2026-09-22, Claude Code 2.1.280 (first to know claude-opus-5-5)
      if: github.event_name == 'pull_request' && vars.GRADER != 'kimi' && github.event.pull_request.user.login == 'nishfleet-worker[bot]'
      env:
        GRADE_PROMPT: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          You are the grader. The author is ${{ github.event.pull_request.user.login == 'nishfleet-worker[bot]' && 'a fleet worker model (Devin swe-2, Pi, or Cursor Grok) executing a packet' || 'a Claude session, or a Grok unit run under the owner' }}; you are ${{ (vars.GRADER == 'kimi' || github.event.pull_request.user.login != 'nishfleet-worker[bot]') && 'Kimi K3 Max' || 'Claude Opus 5' }}. Read the PR body and the issue it cites, then the diff. Grade the PR A+ to F on: does the change do what the packet asked and nothing more; is every claim in the body proven by something in the diff or a cited run; tests assert behaviour, not implementation; no scripts, hooks, wrappers, helpers or inline programs (the repo's no-glue rule); no comment that justifies a workaround; the `encoded:` line names a real rung. A+ means every item is met with zero findings; any finding makes the grade A or lower. The pass bar is A+ (Nish 2026-09-25: "pass bar is A+"). Post ONE top-level comment via `gh pr comment` that starts with `${{ (vars.GRADER == 'kimi' || github.event.pull_request.user.login != 'nishfleet-worker[bot]') && 'Kimi' || 'Opus' }} grade: <letter>` followed by at most eight lines of reasons, each tied to a file and line. Use inline comments only for concrete defects. If the grade is anything but A+ run `gh pr edit --add-label blocked-by-judge`; if A+ run `gh pr edit --remove-label blocked-by-judge` (ignore the error if absent). Do not edit files. Do not approve or request changes through the review API.
      with:
        claude_code_oauth_token: ${{ inputs.claude-token }}
        # The action refuses bot-initiated runs by default; the grader exists
        # precisely for the worker app's PRs (first real run: fleet-ops#8098).
        allowed_bots: nishfleet-worker
        # The Claude GitHub App is not installed on the org; the workflow token
        # carries the pull-requests/issues write scope this job declares.
        github_token: ${{ github.token }}
        use_sticky_comment: true
        prompt: ${{ env.GRADE_PROMPT }}
        claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
    - name: Grade with Kimi K3 Max
      if: github.event_name == 'pull_request' && (vars.GRADER == 'kimi' || (inputs.grade-non-worker == 'true' && github.event.pull_request.user.login != 'nishfleet-worker[bot]'))
      shell: bash
      env:
        CURSOR_API_KEY: ${{ inputs.cursor-api-key }}
        GH_TOKEN: ${{ github.token }}
        GRADE_PROMPT: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          You are the grader. The author is ${{ github.event.pull_request.user.login == 'nishfleet-worker[bot]' && 'a fleet worker model (Devin swe-2, Pi, or Cursor Grok) executing a packet' || 'a Claude session, or a Grok unit run under the owner' }}; you are ${{ (vars.GRADER == 'kimi' || github.event.pull_request.user.login != 'nishfleet-worker[bot]') && 'Kimi K3 Max' || 'Claude Opus 5' }}. Read the PR body and the issue it cites, then the diff. Grade the PR A+ to F on: does the change do what the packet asked and nothing more; is every claim in the body proven by something in the diff or a cited run; tests assert behaviour, not implementation; no scripts, hooks, wrappers, helpers or inline programs (the repo's no-glue rule); no comment that justifies a workaround; the `encoded:` line names a real rung. A+ means every item is met with zero findings; any finding makes the grade A or lower. The pass bar is A+ (Nish 2026-09-25: "pass bar is A+"). Post ONE top-level comment via `gh pr comment` that starts with `${{ (vars.GRADER == 'kimi' || github.event.pull_request.user.login != 'nishfleet-worker[bot]') && 'Kimi' || 'Opus' }} grade: <letter>` followed by at most eight lines of reasons, each tied to a file and line. Use inline comments only for concrete defects. If the grade is anything but A+ run `gh pr edit --add-label blocked-by-judge`; if A+ run `gh pr edit --remove-label blocked-by-judge` (ignore the error if absent). Do not edit files. Do not approve or request changes through the review API.
      run: |
        curl https://cursor.com/install -fsS | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$HOME/.cursor"
        cat > "$HOME/.cursor/cli-config.json" <<'EOF'
        {
          "version": 1,
          "editor": {"vimMode": false},
          "approvalMode": "allowlist",
          "sandbox": {"mode": "disabled"},
          "permissions": {
            "allow": [
              "Read(**)",
              "Shell(gh:pr comment*)",
              "Shell(gh:pr diff*)",
              "Shell(gh:pr view*)",
              "Shell(gh:pr edit*)",
              "Shell(gh:issue view*)",
              "Shell(gh:issue edit*)",
              "Shell(git:diff*)",
              "Shell(git:log*)",
              "Shell(git:show*)"
            ],
            "deny": [
              "Write(**)",
              "Mcp(*:*)",
              "WebFetch(*)",
              "Shell(rm)",
              "Shell(mv)",
              "Shell(cp)",
              "Shell(chmod)",
              "Shell(chown)",
              "Shell(sudo)",
              "Shell(bash)",
              "Shell(sh)",
              "Shell(zsh)",
              "Shell(python)",
              "Shell(python3)",
              "Shell(node)",
              "Shell(perl)",
              "Shell(ruby)",
              "Shell(php)",
              "Shell(curl)",
              "Shell(wget)",
              "Shell(npm)",
              "Shell(npx)",
              "Shell(pip)",
              "Shell(pip3)",
              "Shell(make)",
              "Shell(dd)",
              "Shell(tee)",
              "Shell(install)",
              "Shell(touch)",
              "Shell(mkdir)",
              "Shell(git:add*)",
              "Shell(git:commit*)",
              "Shell(git:checkout*)",
              "Shell(git:switch*)",
              "Shell(git:merge*)",
              "Shell(git:rebase*)",
              "Shell(git:reset*)",
              "Shell(git:push*)",
              "Shell(git:pull*)",
              "Shell(git:stash*)",
              "Shell(git:branch*)",
              "Shell(git:worktree*)",
              "Shell(git:config*)",
              "Shell(git:remote*)",
              "Shell(git:clone*)",
              "Shell(git:tag*)",
              "Shell(gh:api*)",
              "Shell(gh:auth*)",
              "Shell(gh:pr create*)",
              "Shell(gh:pr merge*)",
              "Shell(gh:pr close*)",
              "Shell(gh:pr review*)",
              "Shell(gh:pr ready*)",
              "Shell(gh:workflow*)",
              "Shell(gh:run*)",
              "Shell(gh:secret*)",
              "Shell(gh:repo*)",
              "Shell(gh:release*)"
            ]
          }
        }
        EOF
        cursor-agent -p --output-format text --model kimi-k3-max --force --trust "$GRADE_PROMPT"
    - name: A grade below A+ fails this check (fail closed if the label read fails)
      if: github.event_name == 'pull_request' && (inputs.grade-non-worker == 'true' || github.event.pull_request.user.login == 'nishfleet-worker[bot]')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' > "$RUNNER_TEMP/labels" && ! grep -qx blocked-by-judge "$RUNNER_TEMP/labels"
    - name: merge_group reports the check so the queue can merge (the grade was enforced on the pull request)
      if: github.event_name == 'merge_group'
      shell: bash
      run: "true"
