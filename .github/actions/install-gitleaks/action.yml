# Pinned by version and SHA-256 (MIT binary; only the gitleaks-action wrapper needs a license key). To bump, change both env values.
name: install-gitleaks
description: Install the pinned gitleaks release binary and put it on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP:?}/gitleaks"
        mkdir -p -- "$install_dir"
        archive="$install_dir/gitleaks.tar.gz"
        curl --fail --silent --show-error --location \
          --retry 5 --retry-all-errors --max-time 180 --output "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
        tar -xzf "$archive" -C "$install_dir" gitleaks
        test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
