# agent.yml's arm job calls this for the App-token arm; the job keeps its if, permissions,
# concurrency, env, the App private key reading and the runner-login arm (fleet-ops#10723).
# The App has no workflows permission, so it cannot push this file, while it can push the
# job that calls it: the lines that read the key and that arm with the runner user's own
# login stay in the job, and this action takes the minted token as an input.
name: arm
description: Arm one head the arm job already checked, with the worker App token.
inputs:
  app-token:
    description: The worker App installation token the job minted.
    required: true
runs:
  using: composite
  steps:
    - name: Arm the approved head with the App token
      id: arm-app
      shell: bash -e {0}
      env: {GH_TOKEN: "${{ inputs.app-token }}"}
      run: |
        set -euo pipefail
        gh pr merge "$PR" -R "$REPO" --auto --squash --match-head-commit "$SHA"  # a merge queue overrides the method; repos without one need it
        echo "armed #$PR at $SHA"
